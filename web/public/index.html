  function load(){api('admin/users').then(function(j){

        m.querySelector('#cl').onclick=function(){m.remove();load();};m.querySelector('#cp').onclick=function(){try{navigator.clipboard.writeText(j.password);this.textContent='Đã sao chép';}catch(e){}};});}
  }

  if(t==='chat_delete')return 'Xoá tin #'+esc(d.msg)+' của tài khoản #'+esc(d.of)+': “'+esc(d.q||'')+'”';
