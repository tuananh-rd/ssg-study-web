 on existing ones** – tạo đặc trưng mới từ đặc trưng có sẵn (tỉ lệ, tích, tổ hợp) là ví dụ điển hình của feature engineering.\n- Importing libraries: chỉ là bước lập trình.\n- Standardizing numeric features: là scaling/tiền xử lý, ít được coi là tạo feature mới.\n- All of these: sai vì có ý không liên quan.\nLưu ý: standardization đôi khi cũng xếp vào feature engineering, nhưng theo bộ đề đáp án là ý còn lại."},{"id":110,"slide":123,"topic":"Clustering & khoảng cách","section":"Câu trung bình","question":"Which of the following statements is a characteristic of the DBSCAN algorithm?","options":["Can handle tons of data and weird shapes.","Finds uneven cluster sizes (one is big, some are tiny).","It will do a great performance finding many clusters.","It will do a great performance finding few clusters."],"answer":[0],"explanation":"**Đáp án đúng: Can handle tons of data and weird shapes.** – DBSCAN dựa trên mật độ nên tìm được cụm hình dạng tuỳ ý và mở rộng tốt với dữ liệu lớn.\n- Uneven cluster sizes: DBSCAN gặp khó khi mật độ các cụm khác nhau nhiều (một epsilon cho tất cả).\n- Great at finding many/few clusters: số cụm do mật độ quyết định, không phải đặc điểm đặc trưng."},{"id":113,"slide":126,"topic":"EDA & Xử lý dữ liệu","section":"Câu trung bình","question":"When is it most likely that an observation contains an outlier for one of its features?","options":["One feature has an internally studentized residual value above 3.","One feature has a deleted residual value above 3.","The observation consists of the maximum target value.","The observation is missing values for several of the features."],"answer":[0],"explanation":"**Đáp án đúng: One feature has an internally studentized residual value above 3.** – theo bộ đề, residual chuẩn hoá lớn hơn 3 (độ lệch quá 3 độ lệch chuẩn) là dấu hiệu outlier.\n- Deleted residual above 3: phát hiện outlier theo cách khác (không chuẩn hoá cùng ngưỡng).\n- Maximum target value: giá trị lớn nhất chưa chắc là outlier.\n- Missing values: là vấn đề dữ liệu thiếu, không phải outlier."},{"id":114,"slide":127,"topic":"Clustering & khoảng cách","section":"Câu trung bình","question":"When using DBSCAN, how does the algorithm determine that a cluster is complete and is time to move to a different point of the data set and potentially start a new cluster?","options":["When the algorithm requires you to change the input.","When the algorithm forms a new cluster using the outliers.","When no point is left unvisited by the chain reaction.","When the solution converges to a single cluster."],"answer":[2],"explanation":"**Đáp án đúng: When no point is left unvisited by the chain reaction.** – DBSCAN mở rộng cụm từ core point sang các điểm density-reachable; khi không còn điểm nào chưa duyệt, cụm hoàn tất và chuyển sang điểm khác.\n- Change the input: không có cơ chế này.\n- Form a cluster using outliers: outlier là noise, không tạo cụm.\n- Converges to single cluster: DBSCAN không hội tụ theo kiểu lặp như K-means."},{"id":115,"slide":128,"topic":"EDA & Xử lý dữ liệu","section":"Câu trung bình","question":"Why is feature engineering important in machine learning?","options":["It improves model training time","It helps in reducing the dimensionality of data","It enhances the performance of machine learning models","It helps to get insight about data"],"answer":[2],"explanation":"**Đáp án đúng: It enhances the performance of machine learning models** – feature engineering tạo/chọn/biến đổi đặc trưng để mô hình học được tín hiệu tốt hơn, nên mục tiêu chính là nâng hiệu năng.\n- Improves training time: có thể là hệ quả phụ, không phải lý do chính.\n- Reduces dimensionality: chỉ là một kỹ thuật (feature selection/PCA), không phải mục đích tổng quát.\n- Insight about data: thuộc EDA nhiều hơn."},{"id":116,"slide":129,"topic":"Train/test & Cross-validation","section":"Câu trung bình","question":"How is the test data used in the model-building process?","options":["measure error and performance of the model.","measure the parameters and hyperparameters of the model.","tweak the model hyperparameters.","tweak the model parameters."],"answer":[0],"explanation":"**Đáp án đúng: measure error and performance of the model.** – test set chỉ dùng một lần ở cuối để ước lượng sai số tổng quát hoá.\n- Measure parameters and hyperparameters: không đo được, tham số được học từ training.\n- Tweak hyperparameters: dùng validation set/cross-validation.\n- Tweak parameters: là việc của training set."},{"id":117,"slide":130,"topic":"Regularization & Overfitting","section":"Câu trung bình","question":"How does increasing the regularization strength (lambda) in Lasso regularization affect the sparsity of the solution?","options":["Higher lambda encourages sparser solutions","Lower lambda encourages sparser solutions","Lambda has no effect on sparsity","Lambda encourages equalization of coefficients"],"answer":[0],"explanation":"**Đáp án đúng: Higher lambda encourages sparser solutions** – $\\lambda$ càng lớn thì phạt L1 $\\lambda\\sum|w_j|$ càng mạnh, nhiều hệ số bị ép về đúng 0.\n- Lower lambda sparser: ngược lại, lambda nhỏ gần với hồi quy thường.\n- No effect: sai.\n- Equalization of coefficients: đặc điểm gần với Ridge, không phải Lasso."},{"id":118,"slide":131,"topic":"Hồi quy tuyến tính & đa thức","section":"Câu trung bình","question":"How can we create polynomial features in scikit-learn?","options":["polyFeat.fit and polyFeat.transform","polyFeat.add and polyFeat.transform","polyFeat.add and polyFeat.fit","polyFeat.transform"],"answer":[0],"explanation":"**Đáp án đúng: polyFeat.fit and polyFeat.transform** – với `PolynomialFeatures`, gọi `fit` rồi `transform` (hoặc `fit_transform`) để sinh đặc trưng đa thức.\n- `add`: không tồn tại trong API của transformer scikit-learn.\n- `transform` đơn lẻ: cần `fit` trước (để biết số đặc trưng đầu vào)."},{"id":119,"slide":132,"topic":"Train/test & Cross-validation","section":"Câu trung bình","question":"Complete the following sentence: The training data is used to fit the model, while the test data is used to:","options":["measure the parameters and hyperparameters of the model","tweak the model hyperparameters","tweak the model parameters","measure error and performance of the model"],"answer":[3],"explanation":"**Đáp án đúng: measure error and performance of the model** – train set để fit model, test set để đánh giá trên dữ liệu chưa thấy.\n- Measure parameters and hyperparameters: tham số được ước lượng bởi training.\n- Tweak hyperparameters: dùng validation.\n- Tweak parameters: là việc của quá trình fit."},{"id":120,"slide":133,"topic":"Regularization & Overfitting","section":"Câu trung bình","question":"Compared with Lasso regression (assuming similar implementation), Ridge regression is:","options":["less likely to overfit to training data.","more likely to overfit to training data.","less likely to set feature coefficients to zero.","more likely to set feature coefficients to zero."],"answer":[2],"explanation":"**Đáp án đúng: less likely to set feature coefficients to zero.** – Ridge dùng phạt L2 chỉ co hệ số về gần 0 chứ không bằng đúng 0; Lasso (L1) mới tạo sparsity.\n- Less/more likely to overfit: cả hai đều chống overfit, mức độ phụ thuộc $\\lambda$, không có kết luận chung.\n- More likely to set coefficients to zero: đó là Lasso."},{"id":121,"slide":134,"topic":"KNN & Decision Tree","section":"Câu trung bình","question":"Decision trees used as classifiers compute the value assigned to a leaf by calculating the ratio: number of observations of one class divided by the number of observations in that leaf.\nE.g. number of customers that are younger than 50 years old divided by the total number of customers.\nHow are leaf values calculated for regression decision trees?","options":["average value of the predicted variable","median value of the predicted variable","mode value of the predicted variable","weighted average value of the predicted variable"],"answer":[0],"explanation":"**Đáp án đúng: average value of the predicted variable** – leaf của regression tree dự đoán bằng trung bình giá trị target của các mẫu trong leaf (tối thiểu hoá MSE).\n- Median: chỉ dùng khi tối thiểu hoá MAE.\n- Mode: dùng cho classification.\n- Weighted average: không phải mặc định."},{"id":122,"slide":135,"topic":"EDA & Xử lý dữ liệu","section":"Câu trung bình","question":"From the options listed below, select the option that is NOT a valid exploratory data approach to visually confirm whether your data is ready for modeling or if it needs further cleaning or data processing:","options":["Create a panel plot that shows distributions for the dependent variable and scatter plots for all independent variables","Train a model and identify the observations with the largest residuals","Create visualizations for scatter plots, histograms, box plots, and hexbin plots","Create a correlation heatmap to confirm the sign and magnitude of correlation across your features."],"answer":[1],"explanation":"**Đáp án đúng: Train a model and identify the observations with the largest residuals** – đây là phân tích sau khi huấn luyện, không phải khám phá dữ liệu trực quan để quyết định dữ liệu đã sẵn sàng hay chưa.\n- Panel plot của phân phối và scatter plot: EDA hợp lệ.\n- Scatter, histogram, box, hexbin: EDA hợp lệ.\n- Correlation heatmap: EDA hợp lệ cho dấu và độ lớn tương quan."},{"id":123,"slide":136,"topic":"Regularization & Overfitting","section":"Câu trung bình","question":"If a low-complexity model is underfitting during estimation, which of the following is MOST LIKELY true (holding the model constant)?","options":["K-fold cross-validation will still lead to underfitting, for any k.","K-cross-validation with a small k will reduce or eliminate underfitting.","K-fold cross-validation with a large k will reduce or eliminate underfitting.","None of the above."],"answer":[0],"explanation":"**Đáp án đúng: K-fold cross-validation will still lead to underfitting, for any k.** – underfitting do mô hình quá đơn giản (high bias); cross-validation chỉ là cách đánh giá, không đổi năng lực mô hình nên với bất kỳ k nào vẫn underfit.\n- Small k hoặc large k làm giảm underfitting: sai, chỉ làm thay đổi độ tin cậy ước lượng sai số.\n- None of the above: sai vì ý đầu đúng."},{"id":124,"slide":137,"topic":"Thống kê & suy luận","section":"Câu trung bình","question":"In statistical hypothesis testing, what is a Type II error?","options":["Rejecting a true null hypothesis","Accepting a false null hypothesis","Failing to reject a false null hypothesis","Failing to reject a true null hypothesis"],"answer":[2],"explanation":"**Đáp án đúng: Failing to reject a false null hypothesis** – Type II error ($\\beta$) là bỏ sót hiệu ứng thật: $H_0$ sai nhưng không bị bác bỏ.\n- Rejecting a true null: Type I error ($\\alpha$).\n- Accepting a false null: cách nói tương đương nhưng không chuẩn (không 'chấp nhận' $H_0$).\n- Failing to reject a true null: quyết định đúng."},{"id":125,"slide":138,"topic":"Giảm chiều (PCA, MDS…)","section":"Câu trung bình","question":"In PCA, what are principal components?","options":["Data points in the dataset","The features with the highest importance","The eigenvectors of the covariance matrix","The mean values of each feature"],"answer":[2],"explanation":"**Đáp án đúng: The eigenvectors of the covariance matrix** – principal components là các hướng (eigenvector) của ma trận hiệp phương sai, eigenvalue tương ứng là phương sai giải thích.\n- Data points: không phải.\n- Features with highest importance: PCA tạo tổ hợp mới, không chọn đặc trưng gốc.\n- Mean values: dùng để căn giữa dữ liệu, không phải thành phần chính."},{"id":126,"slide":139,"topic":"Clustering & khoảng cách","section":"Câu trung bình","question":"In the K-means algorithm, how are cluster centroids initially chosen?","options":["Randomly from the dataset","Based on the mean of the entire dataset","Using hierarchical clustering","By selecting the data point farthest from the center"],"answer":[0],"explanation":"**Đáp án đúng: Randomly from the dataset** – K-means cơ bản khởi tạo centroid ngẫu nhiên từ các điểm dữ liệu (K-means++ cải tiến việc này).\n- Mean of the entire dataset: mọi centroid sẽ trùng nhau.\n- Hierarchical clustering: có thể dùng nhưng không phải mặc định.\n- Farthest point: là một phần của chiến lược K-means++, không phải khởi tạo ban đầu cơ bản."},{"id":127,"slide":140,"topic":"Regularization & Overfitting","section":"Câu trung bình","question":"In the context of linear regression, what is the purpose of regularization techniques such as Lasso and Ridge?","options":["To increase the complexity of the model","To add noise to the dataset","To reduce overfitting and stabilize coefficient estimates","To introduce non-linearity in the regression relationship"],"answer":[2],"explanation":"**Đáp án đúng: To reduce overfitting and stabilize coefficient estimates** – phạt độ lớn hệ số giúp giảm variance và ổn định khi có đa cộng tuyến.\n- Increase complexity: ngược mục đích.\n- Add noise: không phải mục tiêu.\n- Introduce non-linearity: Lasso/Ridge vẫn tuyến tính; phi tuyến cần polynomial/kernel."},{"id":128,"slide":141,"topic":"Clustering & khoảng cách","section":"Câu trung bình","question":"In HAC, what does the term \"agglomerative\" refer to?","options":["Merging data points into clusters","Splitting clusters into individual points","Assigning data points to the nearest centroid","Calculating the within-cluster variance"],"answer":[0],"explanation":"**Đáp án đúng: Merging data points into clusters** – HAC theo hướng bottom-up: mỗi điểm bắt đầu là một cụm rồi gộp dần các cụm gần nhất.\n- Splitting clusters: là divisive (top-down).\n- Assigning to nearest centroid: là K-means.\n- Within-cluster variance: là tiêu chí (Ward), không phải ý nghĩa của 'agglomerative'."},{"id":129,"slide":142,"topic":"Tổng quan AI / ML","section":"Câu trung bình","question":"In online shopping application, how is machine learning commonly used?","options":["To predict the weather","To recommend products based on user preferences","To play music playlists","To book flight tickets"],"answer":[1],"explanation":"**Đáp án đúng: To recommend products based on user preferences** – recommender system dùng lịch sử/hành vi người dùng để gợi ý sản phẩm.\n- Predict the weather, play music playlists, book flight tickets: không phải ứng dụng đặc trưng của ML trong mua sắm trực tuyến."},{"id":130,"slide":143,"topic":"Clustering & khoảng cách","section":"Câu trung bình","question":"The purpose of the K-means algorithm is","options":["To find the optimal number of clusters","To minimize the within-cluster variance","To maximize the between-cluster variance","To assign cluster labels based on proximity"],"answer":[1],"explanation":"**Đáp án đúng: To minimize the within-cluster variance** – K-means tối thiểu hoá tổng bình phương khoảng cách trong cụm: $\\sum_k\\sum_{x\\in C_k}\\|x-\\mu_k\\|^2$.\n- Find the optimal number of clusters: $K$ là đầu vào, không do thuật toán tìm.\n- Maximize between-cluster variance: hệ quả tương đương nhưng không là mục tiêu tối ưu trực tiếp.\n- Assign labels by proximity: là bước gán, không phải mục đích."},{"id":132,"slide":145,"topic":"EDA & Xử lý dữ liệu","section":"Câu trung bình","question":"While analyzing correlations between continuous variables, you observe that some pairs have near-zero Pearson correlation, but their scatter plots show clear curved patterns. What could explain this?","options":["Strong multicollinearity","Missing data","Non-linear relationship between variables","Incorrect encoding of data"],"answer":[2],"explanation":"**Đáp án đúng: Non-linear relationship between variables** – Pearson chỉ đo quan hệ tuyến tính; quan hệ cong (ví dụ $y=x^2$) có thể cho hệ số gần 0 dù phụ thuộc rất mạnh.\n- Multicollinearity: là tương quan cao giữa các biến độc lập.\n- Missing data / Incorrect encoding: không giải thích được hình dạng cong trên scatter plot.\nMẹo nhớ: correlation ≈ 0 không có nghĩa là độc lập."},{"id":133,"slide":146,"topic":"Tổng quan AI / ML","section":"Câu trung bình","question":"What is the primary goal of supervised learning?","options":["Discovering hidden patterns in data","Making predictions based on labeled training data","Classifying data into categories","Clustering similar data points"],"answer":[1],"explanation":"**Đáp án đúng: Making predictions based on labeled training data** – supervised learning học ánh xạ từ đầu vào sang nhãn đã biết để dự đoán dữ liệu mới.\n- Discovering hidden patterns và Clustering: là unsupervised.\n- Classifying into categories: chỉ là một dạng bài toán supervised (cùng với regression), chưa bao quát."},{"id":134,"slide":147,"topic":"Regularization & Overfitting","section":"Câu trung bình","question":"What is the effect of the L1 regularization penalty on model coefficients?","options":["Encourages equalization of coefficients","Encourages sparsity (some coefficients become exactly zero)","Encourages large coefficients","Has no impact on coefficients"],"answer":[1],"explanation":"**Đáp án đúng: Encourages sparsity (some coefficients become exactly zero)** – phạt L1 $\\lambda\\sum|w_j|$ có góc nhọn tại 0 nên đưa nhiều hệ số về đúng 0, hỗ trợ feature selection.\n- Equalization of coefficients: tính chất gần với L2.\n- Large coefficients: L1 phạt hệ số lớn.\n- No impact: sai."},{"id":135,"slide":149,"topic":"Dữ liệu mất cân bằng","section":"Câu dài","question":"What is the main reason to use under-sampling in an imbalanced classification problem?","options":["To artificially inflate the minority class instances by creating synthetic examples.","To increase training time by providing more instances for model learning.","To force the model to ignore the majority class completely during training.","To balance the class distribution by reducing the number of majority class instances, which can improve the model's ability to detect minority instances."],"answer":[3],"explanation":"**Đáp án đúng: To balance the class distribution by reducing the number of majority class instances, which can improve the model's ability to detect minority instances.**\n- Inflate minority with synthetic examples: là oversampling/SMOTE.\n- Increase training time: undersampling thực tế giảm thời gian huấn luyện.\n- Ignore majority class completely: vẫn giữ một phần mẫu majority."},{"id":136,"slide":150,"topic":"Clustering & khoảng cách","section":"Câu dài","question":"What is a potential challenge associated with the K-means algorithm?","options":["It is sensitive to the initial choice of centroids and can converge to local optima","It always produces the same clusters regardless of the dataset","It performs poorly on high-dimensional data","It is only suitable for small datasets"],"answer":[0],"explanation":"**Đáp án đúng: It is sensitive to the initial choice of centroids and can converge to local optima** – kết quả phụ thuộc khởi tạo; thường chạy nhiều lần hoặc dùng K-means++.\n- Always the same clusters: sai, khởi tạo ngẫu nhiên cho kết quả khác nhau.\n- Poor on high-dimensional data / only small datasets: không phải thách thức chính; K-means mở rộng tốt với dữ liệu lớn."},{"id":137,"slide":151,"topic":"Giảm chiều (PCA, MDS…)","section":"Câu dài","question":"What is the curse of dimensionality in machine learning?","options":["The curse of dimensionality refers to the limitation of models in handling high-dimensional data.","The curse of dimensionality describes the increased computational efficiency with higher dimensions.","The curse of dimensionality is irrelevant in machine learning","The curse of dimensionality occurs only in linear regression models"],"answer":[0],"explanation":"**Đáp án đúng: The curse of dimensionality refers to the limitation of models in handling high-dimensional data.** – khi số chiều tăng, dữ liệu trở nên thưa, khoảng cách mất ý nghĩa, cần nhiều mẫu hơn và dễ overfit.\n- Increased computational efficiency: ngược lại, chi phí tăng.\n- Irrelevant: sai.\n- Only in linear regression: sai, ảnh hưởng nhiều mô hình (kNN, clustering...)."},{"id":138,"slide":152,"topic":"Phân loại (Logistic…)","section":"Câu dài","question":"What is typically the first step in fitting a logistic regression model using scikit-learn?","options":["import logistic regression from the sklearn.linear_model module\ne.g. from sklearn.linear_model import LogisticRegression","import Logistic from the sklearn.regression module\ne.g. from sklearn.regression import Logistic","import Logistic from the sklearn.linear_regression module\ne.g. from sklearn.linear_regression import Logistic","import logistic regression from the sklearn.linearclassifier module\ne.g. from sklearn.linear classifier import LogisticRegression"],"answer":[0],"explanation":"**Đáp án đúng: import LogisticRegression from `sklearn.linear_model`** – cú pháp đúng là `from sklearn.linear_model import LogisticRegression`.\n- `sklearn.regression`, `sklearn.linear_regression`, `sklearn.linearclassifier`: các module này không tồn tại trong scikit-learn."},{"id":139,"slide":153,"topic":"Hồi quy tuyến tính & đa thức","section":"Câu dài","question":"What is the difference between simple linear regression and multiple linear regression?","options":["Simple linear regression has more accuracy","Multiple linear regression has only one independent variable","Simple linear regression deals with one independent variable, while multiple linear regression handles multiple independent variables","Multiple linear regression is used exclusively for classification tasks"],"answer":[2],"explanation":"**Đáp án đúng: Simple linear regression deals with one independent variable, while multiple linear regression handles multiple independent variables.**\n- Simple has more accuracy: không có cơ sở chung.\n- Multiple has only one independent variable: ngược với định nghĩa.\n- Multiple used exclusively for classification: sai, vẫn là hồi quy."},{"id":140,"slide":154,"topic":"Train/test & Cross-validation","section":"Câu dài","question":"What is the purpose of splitting a dataset into training and test sets in machine learning?","options":["To increase the size of the training set for better model performance","To reduce overfitting by evaluating the model on unseen data","To improve the computational efficiency of model training","To introduce randomness and diversity in the training process"],"answer":[1],"explanation":"**Đáp án đúng: To reduce overfitting by evaluating the model on unseen data** – tách test set giúp phát hiện overfitting và ước lượng khả năng tổng quát hoá.\n- Increase training set size: chia dữ liệu làm training nhỏ lại.\n- Improve computational efficiency: không phải mục đích.\n- Randomness and diversity: không phải mục đích của việc chia tập.\nLưu ý: chặt chẽ hơn, việc chia chỉ giúp phát hiện/đánh giá overfitting chứ không trực tiếp ngăn nó."},{"id":141,"slide":155,"topic":"EDA & Xử lý dữ liệu","section":"Câu dài","question":"What is feature engineering?","options":["A process of building machine learning models","A process of transforming raw data into features that better represent the underlying problem","A process of evaluating model performance","None of these"],"answer":[1],"explanation":"**Đáp án đúng: A process of transforming raw data into features that better represent the underlying problem** – feature engineering tạo, chọn và biến đổi đặc trưng để mô hình dễ học hơn.\n- Building machine learning models: là bước huấn luyện, diễn ra sau.\n- Evaluating model performance: là bước đánh giá.\n- None of these: sai vì có đáp án đúng."},{"id":142,"slide":156,"topic":"Tổng quan AI / ML","section":"Câu dài","question":"What is the most important factor to consider when evaluating a Machine Learning model?","options":["Model estimation involves choosing parameters that minimize the cost function.","Model selection involves choosing a model that minimizes the cost function.","Model estimation involves choosing a cost function that can be compared across models.","Model selection involves choosing modeling parameters that minimize in-sample validation error."],"answer":[0],"explanation":"**Đáp án đúng: Model estimation involves choosing parameters that minimize the cost function.** – estimation là tìm tham số (ví dụ hệ số hồi quy) làm cực tiểu hàm chi phí trên dữ liệu huấn luyện.\n- Model selection minimizes the cost function: selection là chọn giữa các mô hình/siêu tham số dựa trên hiệu năng trên dữ liệu chưa thấy, không phải cực tiểu hoá cost bằng cách fit.\n- Estimation chooses a cost function: hàm chi phí được chọn trước, không phải kết quả của estimation.\n- Selection minimizes in-sample validation error: lẫn lộn, validation dùng dữ liệu ngoài mẫu huấn luyện.\nLưu ý: câu hỏi diễn đạt chưa rõ; theo bộ đề đáp án là ý nêu trên."},{"id":143,"slide":157,"topic":"Tổng quan AI / ML","section":"Câu dài","question":"What is the goal of machine learning?","options":["The goal of machine learning is to achieve high accuracy in prediction for future examples, not for the training ones.","The goal of machine learning is to achieve high accuracy in prediction for future examples, and for the training ones.","The goal of machine learning is to achieve low accuracy in prediction for future examples, high accuracy for the training phase.","The goal of machine learning is to achieve low accuracy in prediction for future examples, and low accuracy for the training phase."],"answer":[0],"explanation":"**Đáp án đúng: high accuracy for future examples, not for the training ones** – mục tiêu của ML là tổng quát hoá tốt trên dữ liệu mới, không phải chỉ khớp dữ liệu huấn luyện.\n- High on future and on training ones: ý 'and for the training ones' không phải mục tiêu cốt lõi (khớp tốt training dễ gây overfit).\n- Low accuracy on future: ngược mục tiêu.\n- Low on both: vô lý."},{"id":144,"slide":158,"topic":"Thống kê & suy luận","section":"Câu dài","question":"What is p-value in statistical hypothesis testing?","options":["The probability of making a Type I error","The probability of rejecting a true null hypothesis","The probability of accepting a false null hypothesis","The probability of observing the data given that the null hypothesis is true"],"answer":[3],"explanation":"**Đáp án đúng: The probability of observing the data given that the null hypothesis is true** – p-value là xác suất thu được kết quả (ít nhất cực đoan như đã quan sát) khi $H_0$ đúng: $P(\\text{data}\\mid H_0)$.\n- Probability of making a Type I error / rejecting a true null: đó là mức ý nghĩa $\\alpha$, được đặt trước.\n- Accepting a false null: là Type II error.\nLưu ý: cách nói chặt chẽ là 'dữ liệu ít nhất cực đoan như quan sát'."},{"id":145,"slide":159,"topic":"Hồi quy tuyến tính & đa thức","section":"Câu dài","question":"What is the main goal of adding polynomial features to a linear regression?","options":["Remove the linearity of the regression and turn it into a polynomial model.","Capture the relation of the outcome with features of higher order.","Increase the interpretability of a black box model.","Ensure similar results across all folds when using K-fold cross validation."],"answer":[1],"explanation":"**Đáp án đúng: Capture the relation of the outcome with features of higher order.** – thêm $x^2, x^3$... giúp mô hình tuyến tính theo tham số mô tả quan hệ cong.\n- Remove the linearity: mô hình vẫn tuyến tính theo hệ số.\n- Increase interpretability of a black box: không liên quan.\n- Similar results across folds: không phải mục đích."},{"id":146,"slide":160,"topic":"Clustering & khoảng cách","section":"Câu dài","question":"What is the key feature for the Cosine Distance?","options":["The size of the curve.","The Cosine Distance, which takes into account the angle between 2 points.","It is sensitive to the size of the data set.","It is not sensitive to the size of the data set."],"answer":[1],"explanation":"**Đáp án đúng: Cosine Distance takes into account the angle between 2 points** – cosine so sánh hướng của hai vector (độ tương tự $\\cos\\theta=\\dfrac{A\\cdot B}{\\|A\\|\\|B\\|}$), không quan tâm độ lớn.\n- Size of the curve: không có nghĩa.\n- Sensitive / not sensitive to the size of the data set: không phải đặc điểm chính; điều quan trọng là bất biến với độ dài vector, không phải kích thước tập dữ liệu."},{"id":147,"slide":161,"topic":"Clustering & khoảng cách","section":"Câu dài","question":"What is the primary objective of using K-Means clustering in unsupervised learning tasks?","options":["To partition the dataset into k clusters where each observation belongs to the cluster with the nearest mean, minimizing within-cluster variance.","To build a supervised classification model based on labeled examples for future prediction tasks.","To assign each point to multiple clusters simultaneously and maximize between-cluster distances.","To predict continuous target values using linear combinations of features in the dataset."],"answer":[0],"explanation":"**Đáp án đúng: partition the dataset into k clusters, mỗi điểm thuộc cụm có mean gần nhất, minimizing within-cluster variance.**\n- Supervised classification model: K-means là unsupervised.\n- Multiple clusters cùng lúc: đó là soft clustering (GMM, fuzzy c-means); K-means gán cứng.\n- Predict continuous target: là hồi quy."},{"id":148,"slide":162,"topic":"Train/test & Cross-validation","section":"Câu dài","question":"What is a potential downside of using a single train-test split instead of cross-validation?","options":["It takes significantly more computation time","It may lead to underfitting","It prevents hyperparameter tuning","The evaluation may be highly sensitive to how the data is split"],"answer":[3],"explanation":"**Đáp án đúng: The evaluation may be highly sensitive to how the data is split** – một lần chia ngẫu nhiên có thể may/rủi, nên ước lượng sai số có variance cao; cross-validation lấy trung bình trên nhiều lần chia.\n- More computation time: single split rẻ hơn.\n- Underfitting: không do cách chia.\n- Prevents hyperparameter tuning: không, vẫn có thể tune bằng validation set."},{"id":149,"slide":163,"topic":"Thống kê & suy luận","section":"Câu dài","question":"What are confidence intervals in statistical inference?","options":["Confidence intervals provide a range of values within which the true population parameter is likely to fall","Confidence intervals are used to measure the strength of association between two variables.","Confidence intervals represent the probability that a hypothesis is true","Confidence intervals are only applicable to large sample sizes"],"answer":[0],"explanation":"**Đáp án đúng: Confidence intervals provide a range of values within which the true population parameter is likely to fall.**\n- Strength of association: đo bằng hệ số tương quan/effect size.\n- Probability that a hypothesis is true: sai, đây là cách hiểu sai thường gặp.\n- Only large samples: sai, dùng được với mẫu nhỏ (ví dụ t-interval)."},{"id":150,"slide":164,"topic":"Giảm chiều (PCA, MDS…)","section":"Câu dài","question":"What are the eigenvalues in PCA?","options":["Eigenvalues represent the mean values of each feature","Eigenvalues indicate the importance of each principal component in capturing variance","Eigenvalues are the coefficients of the linear regression model in PCA","Eigenvalues are not relevant in PCA"],"answer":[1],"explanation":"**Đáp án đúng: Eigenvalues indicate the importance of each principal component in capturing variance** – eigenvalue lớn nghĩa là thành phần đó giải thích nhiều phương sai.\n- Mean values of features: không liên quan.\n- Coefficients of linear regression: PCA không phải hồi quy.\n- Not relevant: sai."},{"id":151,"slide":165,"topic":"Regularization & Overfitting","section":"Câu dài","question":"What are the potential consequences of using a high-complexity model in linear regression?","options":["A high variance of parameter estimates across cross-validation sub-samples indicates likely overfitting.","Cross-validation with a small k will reduce or eliminate overfitting.","A low variance of parameter estimates across cross-validation subsamples indicates likely overfitting.","Cross-validation with a large k will reduce or eliminate overfitting."],"answer":[0],"explanation":"**Đáp án đúng: A high variance of parameter estimates across cross-validation sub-samples indicates likely overfitting.** – mô hình phức tạp nhạy với dữ liệu nên hệ số thay đổi lớn giữa các fold.\n- Low variance indicates overfitting: ngược lại.\n- Small k hoặc large k làm giảm/loại bỏ overfitting: sai, cross-validation chỉ đánh giá, không đổi độ phức tạp mô hình."},{"id":152,"slide":166,"topic":"EDA & Xử lý dữ liệu","section":"Câu dài","question":"What does NoSQL stand for and what does it represent?","options":["NoSQL stands for Not-only SQL, and it represents a set of databases that are relational, therefore, they have fixed structure.","NoSQL stands for Non-Structured Query Language, and it represents a set of relational databases with fixed schemas.","NoSQL stands for Non-Structured Query Language, and it represents a set of non-relational databases with varied schemas.","NoSQL stands for Not-only SQL, and it represents a set of databases that are not relational, therefore, they vary in structure."],"answer":[3],"explanation":"**Đáp án đúng: NoSQL stands for Not-only SQL, and it represents a set of databases that are not relational, therefore, they vary in structure.**\n- Relational với cấu trúc cố định: đặc điểm của SQL.\n- 'Non-Structured Query Language': cách giải thích tên sai."},{"id":153,"slide":167,"topic":"Dữ liệu mất cân bằng","section":"Câu dài","question":"What does synthetic oversampling technique in handling imbalanced datasets do?","options":["It involves creating entirely new features for the minority class","It generates synthetic samples for the minority class to balance the dataset","It randomly removes samples from both classes","It focuses on increasing the size of the majority class"],"answer":[1],"explanation":"**Đáp án đúng: It generates synthetic samples for the minority class to balance the dataset** – ví dụ SMOTE nội suy giữa các mẫu thiểu số lân cận.\n- Creating new features: không phải, đây là tạo mẫu.\n- Randomly removing samples from both classes: không phải oversampling.\n- Increasing the majority class: ngược mục đích."},{"id":155,"slide":169,"topic":"Dữ liệu mất cân bằng","section":"Câu dài","question":"What problem occurs when the classes in a dataset are highly unbalanced?","options":["The model may focus equally on all classes, leading to balanced accuracy and fair predictions.","The model will ignore rare classes and achieve perfect predictions for minority classes.","The model tends to be biased toward the majority class, making poor predictions for the minority class.","The model will automatically adjust weights and handle all classes without error."],"answer":[2],"explanation":"**Đáp án đúng: The model tends to be biased toward the majority class, making poor predictions for the minority class.** – tối ưu accuracy tổng thể khiến mô hình ưu tiên lớp đa số.\n- Focus equally on all classes: không xảy ra.\n- Perfect predictions for minority: ngược thực tế.\n- Automatically adjust weights: không tự động, cần class weights/resampling."},{"id":156,"slide":170,"topic":"EDA & Xử lý dữ liệu","section":"Câu dài","question":"What role does feature engineering play in the machine learning process?","options":["It involves optimizing model hyperparameters","It refers to the creation of complex algorithms for model training.","It focuses on selecting and transforming input variables to enhance model performance","It is irrelevant in the context of machine learning."],"answer":[2],"explanation":"**Đáp án đúng: It focuses on selecting and transforming input variables to enhance model performance.**\n- Optimizing hyperparameters: là tuning.\n- Creating complex algorithms: không phải việc của feature engineering.\n- Irrelevant: sai."},{"id":157,"slide":171,"topic":"Clustering & khoảng cách","section":"Câu dài","question":"What happen with our second cluster centroid when we use the probability formula?","options":["When we use the probability formula, we put less weight on the points that are far away. So, our second cluster centroid is likely going to be closer.","When we use the probability formula, we put more weight on the points that are far away. So, our second cluster centroid is likely going to be more distant.","When we use the probability formula, we put more weight on the lighter centroids, because it will take more computational power to draw our clusters. So, the second cluster centroid is likely going to be less distant.","When we use the probability formula, we put less weight on the points that are far away. So, our second cluster centroid is likely going to be more distant."],"answer":[1],"explanation":"**Đáp án đúng: dùng probability formula thì đặt nhiều trọng số hơn cho các điểm xa, nên centroid thứ hai nhiều khả năng xa hơn.** – đây là K-means++: xác suất chọn điểm tỉ lệ với $D(x)^2$ (bình phương khoảng cách tới centroid gần nhất).\n- Less weight on far points, centroid closer: ngược.\n- Less weight on far points nhưng more distant: mâu thuẫn.\n- Lighter centroids/computational power: không có trong thuật toán."},{"id":158,"slide":172,"topic":"Dữ liệu mất cân bằng","section":"Câu dài","question":"Which of the following statements is true about downsampling in imbalanced datasets?","options":["Downsampling always leads to better model performance","Downsampling involves removing samples from the majority class","Downsampling is primarily used to increase the size of the dataset","Downsampling has no impact on the distribution of classes"],"answer":[1],"explanation":"**Đáp án đúng: Downsampling involves removing samples from the majority class.**\n- Always better performance: không đảm bảo, có thể mất thông tin.\n- Increase dataset size: ngược lại.\n- No impact on class distribution: thực tế nó đổi phân phối lớp."},{"id":159,"slide":173,"topic":"Dữ liệu mất cân bằng","section":"Câu dài","question":"Which of the following statements is true regarding Random and Synthetic Over Sampling in the context of imbalanced datasets?","options":["Random Over Sampling duplicates random instances of the minority class to balance the dataset, while Synthetic Over Sampling generates new synthetic instances.","Random Over Sampling generates new synthetic instances of the minority class, while Synthetic Over Sampling duplicates random instances.","Random Over Sampling and Synthetic Over Sampling both involve duplicating random instances of the minority class.","Random Over Sampling and Synthetic Over Sampling are identical techniques with different names."],"answer":[0],"explanation":"**Đáp án đúng: Random Over Sampling duplicates random instances of the minority class, while Synthetic Over Sampling generates new synthetic instances.**\n- Hai ý đảo ngược hoặc cùng sao chép: sai.\n- Identical techniques: sai, SMOTE tạo mẫu mới bằng nội suy nên giảm nguy cơ overfit do trùng lặp."},{"id":160,"slide":174,"topic":"Clustering & khoảng cách","section":"Câu dài","question":"Which of the following statements correctly defines the strengths of the DBSCAN algorithm?","options":["No need to specify the number of clusters (cf. K-means), allows for noise, and can handle arbitrary-shaped clusters.","Do well with different density, works with just one parameter, the n_clu defines itself.","The algorithm will find the outliers first, draw regular shapes, works faster than other algorithms.","The algorithm is computationally intensive, it is sensitive to outliers, and it requires few hyperparameters to be tuned."],"answer":[0],"explanation":"**Đáp án đúng: No need to specify the number of clusters (cf. K-means), allows for noise, and can handle arbitrary-shaped clusters.**\n- Do well with different density, n_clu defines itself: DBSCAN yếu khi mật độ khác nhau; cần tham số.\n- Finds outliers first, regular shapes, faster: sai, cụm có hình tuỳ ý.\n- Computationally intensive, sensitive to outliers, many hyperparameters: sai, DBSCAN chịu được noise và chỉ có hai tham số chính."},{"id":161,"slide":175,"topic":"Clustering & khoảng cách","section":"Câu dài","question":"Which of the following statements correctly defines the weaknesses of the DBSCAN algorithm?","options":["The clusters it find might not be trustworthy, it needs noisy data to work, and it can't handle subgroups.","It needs two parameters as input, finding appropriate values of ε and n_clu can be difficult, and it does not do well with clusters of different density.","The algorithm will find the outliers first, it draws regular shapes, and it works faster than other algorithms.","The algorithm is computationally intensive, it is sensitive to outliers, and it requires too many hyperparameters to be tuned."],"answer":[1],"explanation":"**Đáp án đúng: Needs two parameters (ε và n_clu/minPts), khó chọn giá trị phù hợp, và không tốt với các cụm có mật độ khác nhau.**\n- Needs noisy data: sai, không cần dữ liệu nhiễu.\n- Finds outliers first, regular shapes, faster: không phải điểm yếu và không đúng.\n- Too many hyperparameters, sensitive to outliers: DBSCAN chỉ có hai tham số và chịu được outlier."},{"id":162,"slide":176,"topic":"Clustering & khoảng cách","section":"Câu dài","question":"Which of the following statements is a characteristic of the Mean Shift algorithm?","options":["Not require us to set the number of clusters, the number of clusters will be determined for us.","Bad with non-spherical cluster shapes.","You need to decide the number of clusters on your own, choosing the numbers directly or the minimum distance threshold.","Good with non-spherical cluster shapes."],"answer":[0],"explanation":"**Đáp án đúng: Not require us to set the number of clusters, the number of clusters will be determined for us.** – Mean shift tìm các mode của mật độ, số cụm suy ra từ bandwidth.\n- Bad with non-spherical shapes: sai, thuật toán không giả định hình cầu.\n- Need to decide number of clusters: đó là K-means/HAC.\n- Good with non-spherical shapes: đúng một phần, nhưng đáp án bộ đề nhấn vào việc không cần đặt số cụm.\nLưu ý: ý 'Good with non-spherical cluster shapes' cũng có thể đúng; theo bộ đề chọn ý thứ nhất."},{"id":163,"slide":177,"topic":"Clustering & khoảng cách","section":"Câu dài","question":"Which of the following statements is a characteristic of the K-means algorithm?","options":["It is limited to use the Euclidean distance within his formulation.","To determine the number of clusters we use the elbow method.","Can be slow to calculate as the number of observations increases.","It's limited to use the Ward distance within his formulation."],"answer":[1],"explanation":"**Đáp án đúng: To determine the number of clusters we use the elbow method.** – vẽ inertia theo $K$ và chọn điểm gấp khúc.\n- Limited to Euclidean distance: K-means chuẩn dùng Euclidean vì centroid là mean, nhưng đây là hạn chế chứ không phải đặc điểm nổi bật theo bộ đề.\n- Slow as observations increase: K-means khá scalable.\n- Limited to Ward distance: Ward thuộc HAC.\nLưu ý: ý đầu về Euclidean cũng đúng về mặt kỹ thuật; theo bộ đề chọn elbow method."},{"id":164,"slide":178,"topic":"Clustering & khoảng cách","section":"Câu dài","question":"Which of the following statements best describes the iterative part of the K-means algorithm?","options":["The k-means algorithm assigns a number of clusters at random.","The k-means algorithm adjusts the centroids to the new mean of each cluster, and then it keeps repeating this process until no example is assigned to another cluster.","The k-means algorithm iteratively deletes outliers.","The k-means algorithm iteratively calculates the distance from each point to the centroid of each cluster."],"answer":[1],"explanation":"**Đáp án đúng: adjusts the centroids to the new mean of each cluster, and keeps repeating until no example is assigned to another cluster.** – lặp lại gán điểm → cập nhật centroid cho tới khi hội tụ.\n- Assigns a number of clusters at random: $K$ do người dùng đặt.\n- Deletes outliers: không.\n- Chỉ tính khoảng cách: chỉ là bước gán, thiếu bước cập nhật centroid và điều kiện dừng."},{"id":165,"slide":179,"topic":"Clustering & khoảng cách","section":"Câu dài","question":"Which of the following statements is a business case for the use of the Manhattan distance (L1)?","options":["We use it in business cases where there is very high dimensionality.","We use it in business cases where there is low dimensionality.","We use it in business cases where the dimensionality is unknown.","We use it in business cases with outliers."],"answer":[0],"explanation":"**Đáp án đúng: We use it in business cases where there is very high dimensionality.** – với chiều rất cao, Manhattan (L1) ít bị ảnh hưởng của curse of dimensionality hơn Euclidean.\n- Low dimensionality: Euclidean thường phù hợp.\n- Unknown dimensionality: không phải tiêu chí.\n- With outliers: L1 bền hơn L2 với outlier, nhưng theo bộ đề đáp án là chiều cao.\nLưu ý: ý 'with outliers' cũng có cơ sở; theo bộ đề chọn high dimensionality."},{"id":167,"slide":181,"topic":"Clustering & khoảng cách","section":"Câu dài","question":"Which statement describes better \"The Smarter initialization of K-mean clusters\"?","options":["\"Draw a line between the data points to create 2 big clusters.\"","\"After we find our centroids, we calculate the distance between all our data points.\"","\"Pick one point random as initial point and for the second pick instead of doing it randomly we prioritize by assigning the probability of the distance.\"","\"We start by having two centroids as far as possible between each other.\""],"answer":[2],"explanation":"**Đáp án đúng: chọn ngẫu nhiên một điểm làm centroid đầu, centroid thứ hai chọn theo xác suất phụ thuộc khoảng cách.** – đây là K-means++: xác suất $\\propto D(x)^2$.\n- Draw a line to create 2 big clusters: không phải thuật toán.\n- Calculate distance after finding centroids: là bước gán điểm.\n- Two centroids as far as possible: chọn xa tuyệt đối (farthest-first) nhạy với outlier, không phải K-means++."},{"id":168,"slide":182,"topic":"Dữ liệu mất cân bằng","section":"Câu dài","question":"Which scenario would most likely benefit from applying SMOTE (Synthetic Minority Over-sampling Technique)?","options":["When the training data has too many outliers affecting majority class predictions.","When the classes are balanced but have different feature scales that need normalization.","When the training data is linearly separable but suffers from high variance.","When a classification dataset has a severely imbalanced distribution between classes, leading to poor minority class recall."],"answer":[3],"explanation":"**Đáp án đúng: classification dataset mất cân bằng nghiêm trọng khiến recall của lớp thiểu số thấp** – SMOTE tạo mẫu thiểu số tổng hợp bằng nội suy giữa các lân cận để cân bằng lớp.\n- Too many outliers: dùng robust methods/xử lý outlier.\n- Balanced classes but different scales: cần normalization/standardization.\n- Linearly separable but high variance: dùng regularization/ensemble."},{"id":169,"slide":183,"topic":"Giảm chiều (PCA, MDS…)","section":"Câu dài","question":"Which statement is a common use of Dimension Reduction in the real world?","options":["Image tracking","Explaining the relation between the amount of alcohol consumption and diabetes.","Deep Learning","Predicting whether a customer will return to a store to make a major purchase."],"answer":[0],"explanation":"**Đáp án đúng: Image tracking** – ứng dụng thực tế của dimension reduction (PCA, autoencoder...) để nén và trích đặc trưng từ dữ liệu ảnh nhiều chiều.\n- Alcohol và diabetes: bài toán giải thích quan hệ (hồi quy/thống kê).\n- Deep Learning: là họ mô hình, không phải ứng dụng.\n- Dự đoán khách quay lại: bài toán classification."},{"id":170,"slide":184,"topic":"KNN & Decision Tree","section":"Câu dài","question":"How does the choice of splitting criterion affect the decision tree model?","options":["The choice of splitting criterion has no impact on the decision tree model.","Different splitting criteria may result in different decision boundaries and model performance.","The splitting criterion determines the maximum depth of the tree.","The splitting criterion adjusts the regularization strength of the model."],"answer":[1],"explanation":"**Đáp án đúng: Different splitting criteria may result in different decision boundaries and model performance.** – ví dụ Gini và entropy có thể chọn điểm chia khác nhau, tạo cấu trúc cây khác.\n- No impact: sai.\n- Determines maximum depth: do `max_depth`/pruning quyết định.\n- Adjusts regularization strength: không, đó là các tham số như `ccp_alpha`, `min_samples_leaf`."},{"id":171,"slide":185,"topic":"Ensemble (RF, Bagging, Boosting)","section":"Câu dài","question":"How to explain the concept of learning rate in the Boosting algorithms?","options":["It is the speed at which the algorithm learns from the data","It controls the contribution of each weak learner to the final prediction","It measures the accuracy of the model","It determines the number of boosting rounds"],"answer":[1],"explanation":"**Đáp án đúng: It controls the contribution of each weak learner to the final prediction** – learning rate (shrinkage) $\\eta$ nhân với đầu ra mỗi weak learner; nhỏ hơn thì học chậm, cần nhiều vòng hơn nhưng tổng quát hoá tốt hơn.\n- Speed at which the algorithm learns: mô tả mơ hồ.\n- Accuracy of the model: không phải.\n- Number of boosting rounds: là `n_estimators`."},{"id":172,"slide":186,"topic":"Clustering & khoảng cách","section":"Câu dài","question":"When applying K-means clustering, what is the role of the hyperparameter K, and how does it impact the results?","options":["K controls the learning rate and convergence speed","K determines the number of clusters, influencing the final grouping of data points","K represents the dimensionality of the feature space","K is unrelated to clustering; it refers to the number of iterations"],"answer":[1],"explanation":"**Đáp án đúng: K determines the number of clusters, influencing the final grouping of data points.**\n- Learning rate and convergence speed: K-means không có learning rate.\n- Dimensionality of feature space: sai.\n- Number of iterations: là `max_iter`."},{"id":173,"slide":187,"topic":"Ensemble (RF, Bagging, Boosting)","section":"Câu dài","question":"When using bagging methods like Random Forest, what is the role of feature randomness during the training of individual trees?","options":["It forces each tree to overfit to its subset, improving accuracy on the training data.","It reduces training time by eliminating the need to evaluate multiple features at each split.","It ensures that only the most important features are selected across all trees.","It decorrelates the trees, making the ensemble stronger and reducing the variance without increasing bias significantly."],"answer":[3],"explanation":"**Đáp án đúng: It decorrelates the trees, making the ensemble stronger and reducing the variance without increasing bias significantly.** – mỗi split chỉ xét tập con ngẫu nhiên đặc trưng nên các cây ít tương quan hơn, trung bình sẽ giảm variance mạnh hơn.\n- Force overfit to improve training accuracy: không phải mục đích.\n- Reduces training time: có thể là hệ quả phụ nhưng không phải vai trò.\n- Only most important features: ngược lại, đa dạng hoá đặc trưng."},{"id":174,"slide":188,"topic":"Clustering & khoảng cách","section":"Câu dài","question":"When would hierarchical agglomerative clustering (HAC) be preferred over K-Means?","options":["When you want a dendrogram showing nested clusters without specifying the number of clusters beforehand","When you need to cluster millions of data points quickly in a scalable and memory-efficient manner.","When your data has perfectly spherical and equally-sized clusters, making K-Means more natural.","When you are performing feature selection and need an algorithm with built-in regularization."],"answer":[0],"explanation":"**Đáp án đúng: When you want a dendrogram showing nested clusters without specifying the number of clusters beforehand.**\n- Millions of points quickly: HAC có độ phức tạp $O(n^2)$ trở lên, không scalable.\n- Spherical, equal-sized clusters: phù hợp K-means.\n- Feature selection with regularization: không liên quan."},{"id":175,"slide":189,"topic":"Clustering & khoảng cách","section":"Câu dài","question":"Why we need a stopping criterion when we are using the HAC?","options":["The algorithm will turn our data into small clusters.","The algorithm will turn our data into just one cluster.","The algorithm will not start working if we don't assign a number of clusters.","The stopping criterion ensures centroids are calculated correctly."],"answer":[1],"explanation":"**Đáp án đúng: The algorithm will turn our data into just one cluster.** – HAC gộp liên tục nên nếu không dừng sẽ gộp mọi điểm thành một cụm duy nhất; cần ngưỡng khoảng cách hoặc số cụm để cắt dendrogram.\n- Small clusters: là trạng thái ban đầu.\n- Won't start without number of clusters: thuật toán vẫn chạy.\n- Centroid calculation: không phải vai trò."},{"id":176,"slide":190,"topic":"Thống kê & suy luận","section":"Câu dài","question":"A p-value is:","options":["the smallest significance level at which the null hypothesis would be rejected","the probability of the null hypothesis being true","the probability of the null hypothesis being false","the smallest significance level at which the null hypothesis is accepted"],"answer":[0],"explanation":"**Đáp án đúng: the smallest significance level at which the null hypothesis would be rejected** – p-value là mức $\\alpha$ nhỏ nhất mà tại đó $H_0$ bị bác bỏ.\n- Probability of null being true/false: p-value không phải xác suất của giả thuyết.\n- Smallest level at which null is accepted: nhầm lẫn, ta không 'chấp nhận' $H_0$."},{"id":177,"slide":191,"topic":"Regularization & Overfitting","section":"Câu dài","question":"A machine learning model shows continuously decreasing training error but starts to have increasing error on the test set as its complexity grows. Which explanation best describes this situation?","options":["The model is too simple and fails to capture the underlying patterns in the data, leading to underfitting.","The dataset is too large for the model to learn anything meaningful, causing instability in both training and testing error.","The model is too complex, capturing noise and specific patterns in the training data, which reduces its ability to generalize to new data, resulting in overfitting.","The model features were not properly normalized or standardized, which causes differences in scale to dominate the learning process."],"answer":[2],"explanation":"**Đáp án đúng: The model is too complex, capturing noise... resulting in overfitting.** – training error giảm nhưng test error tăng khi độ phức tạp tăng là dấu hiệu điển hình của overfitting (high variance).\n- Too simple/underfitting: sẽ có cả training và test error cao.\n- Dataset too large: không gây ra mẫu hình này.\n- Not normalized: không giải thích sự phân kỳ train–test theo độ phức tạp."},{"id":178,"slide":192,"topic":"Tổng quan AI / ML","section":"Câu dài","question":"Among the types of Machine Learning, which method works by providing the model with a labeled dataset (with both inputs and correct outputs), so that the model can learn to make predictions for new data?","options":["Reinforcement Learning - learning through trial, error, and rewards.","Supervised Learning - learning with labeled data.","Unsupervised Learning - learning from unlabeled data.","Deep Learning - a special branch of Machine Learning based on multi-layer neural networks."],"answer":[1],"explanation":"**Đáp án đúng: Supervised Learning – learning with labeled data.**\n- Reinforcement Learning: học bằng thử–sai và phần thưởng.\n- Unsupervised Learning: dữ liệu không nhãn.\n- Deep Learning: là họ mô hình dựa trên mạng nơ-ron nhiều lớp, không phải kiểu học theo nhãn."},{"id":179,"slide":193,"topic":"Clustering & khoảng cách","section":"Câu dài","question":"According to the DBSCAN required inputs, which statement describes the n_clu input?","options":["Function to calculate distance.","Radius of local neighborhood.","Determines density threshold (for fixed ε) (The minimum amount of points for a particular point to be consider a core point of a cluster).","The maximum amount of observations for a particular point to be consider a core point of a cluster."],"answer":[2],"explanation":"**Đáp án đúng: Determines density threshold (for fixed ε)** – tham số `n_clu` (thường gọi minPts) là số điểm tối thiểu trong bán kính ε để một điểm là core point.\n- Function to calculate distance: là tham số metric.\n- Radius of local neighborhood: là ε.\n- Maximum amount of observations: sai, đây là ngưỡng tối thiểu."},{"id":180,"slide":194,"topic":"Regularization & Overfitting","section":"Câu dài","question":"BOTH Ridge regression and Lasso regression","options":["do not adjust the cost function used to estimate a model.","add a term to the loss function proportional to a regularization parameter.","add a term to the loss function proportional to the square of parameter coefficients.","add a term to the loss function proportional to the absolute value of parameter coefficients."],"answer":[1],"explanation":"**Đáp án đúng: add a term to the loss function proportional to a regularization parameter.** – cả Ridge và Lasso đều cộng số hạng phạt nhân với $\\lambda$.\n- Do not adjust the cost function: sai.\n- Proportional to the square of coefficients: chỉ Ridge (L2).\n- Proportional to the absolute value: chỉ Lasso (L1)."},{"id":182,"slide":196,"topic":"Ensemble (RF, Bagging, Boosting)","section":"Câu dài","question":"If a single decision tree model overfits the data, how can an ensemble method like Random Forest help?","options":["By building multiple trees on bootstrapped datasets and averaging their predictions.","By pruning the original tree and applying logistic regression to the residuals.","By combining several kernel methods to generate a more flexible decision boundary.","By forcing each tree to only use support vectors as input during training."],"answer":[0],"explanation":"**Đáp án đúng: By building multiple trees on bootstrapped datasets and averaging their predictions.** – bagging giảm variance của cây đơn.\n- Pruning and logistic regression on residuals: không phải Random Forest.\n- Combining kernel methods: thuộc SVM.\n- Only support vectors: khái niệm của SVM, không liên quan."},{"id":183,"slide":197,"topic":"Giảm chiều (PCA, MDS…)","section":"Câu dài","question":"In PCA, how does the explained variance ratio of each principal component help in determining the optimal number of components?","options":["By selecting components with the highest explained variance ratio","By selecting components with the lowest explained variance ratio","By ignoring the explained variance ratio and always using all components","By using the cumulative explained variance ratio to find an elbow point in the scree plot"],"answer":[3],"explanation":"**Đáp án đúng: By using the cumulative explained variance ratio to find an elbow point in the scree plot.** – chọn số thành phần sao cho phương sai tích luỹ đủ lớn (ví dụ 90–95%) hoặc tại điểm gấp khúc.\n- Chỉ lấy highest hoặc lowest: không có tiêu chí tích luỹ.\n- Using all components: không giảm chiều."},{"id":184,"slide":198,"topic":"Train/test & Cross-validation","section":"Câu dài","question":"In k-fold cross-validation, how will increase of k affect the variance (across subsamples) of estimated model parameters?","options":["Increasing of k will not affect the variance of estimated parameters.","Increasing of k will usually reduce the variance of estimated parameters.","Increasing of k will usually increase the variance of estimated parameters.","Increasing of k will increase the variance of estimated parameters if models are underfit, but reduce it if models are overfit."],"answer":[1],"explanation":"**Đáp án đúng: Increasing of k will usually reduce the variance of estimated parameters.** – theo bộ đề, k lớn thì mỗi tập huấn luyện lớn hơn nên ước lượng tham số ổn định hơn giữa các lần fit.\n- No effect / increase / phụ thuộc underfit-overfit: không đúng theo bộ đề.\nLưu ý: về mặt lý thuyết, k lớn làm các tập train chồng lấn nhiều nên các ước lượng tương quan cao, và variance của ước lượng sai số có thể tăng; nhưng theo bộ đề đáp án là giảm."},{"id":185,"slide":199,"topic":"SVM","section":"Câu dài","question":"In SVM, what is the purpose of support vectors?","options":["They are used to define the margin between classes.","They are outliers that are ignored during training.","They are the data points that lie closest to the decision boundary.","They are the weights assigned to features in the input data."],"answer":[2],"explanation":"**Đáp án đúng: They are the data points that lie closest to the decision boundary.** – support vectors là các điểm nằm trên hoặc trong margin, chỉ chúng quyết định hyperplane.\n- Define the margin: cũng đúng một phần (margin xác định bởi support vectors) nhưng đáp án bộ đề là định nghĩa.\n- Outliers ignored: sai, chúng chính là điểm quan trọng nhất.\n- Weights assigned to features: là hệ số $w$.\nLưu ý: ý 'define the margin' cũng hợp lý; theo bộ đề chọn ý định nghĩa gần ranh giới."},{"id":186,"slide":200,"topic":"Thống kê & suy luận","section":"Câu dài","question":"In Frequentist statistics, a 95% confidence interval for the mean of a dataset means:","options":["There is a 95% probability that the true mean lies inside this specific interval.","If the same experiment is repeated many times, about 95% of the calculated intervals would contain the true mean.","The mean will change 95% of the time depending on the sample size.","The confidence interval always contains exactly 95% of the data points."],"answer":[1],"explanation":"**Đáp án đúng: If the same experiment is repeated many times, about 95% of the calculated intervals would contain the true mean.** – cách hiểu frequentist: 95% nằm ở quy trình, không phải xác suất của một khoảng cụ thể.\n- 95% probability true mean inside this specific interval: sai, khoảng cụ thể hoặc chứa hoặc không chứa tham số cố định.\n- Mean changes 95% of the time: vô nghĩa.\n- Contains 95% of data points: nhầm với khoảng dự báo/phân vị."},{"id":187,"slide":201,"topic":"SVM","section":"Câu dài","question":"In an SVM model, what is the primary purpose of the regularization parameter C in the cost function?","options":["C scales all input features so that each feature contributes equally to distance calculations in the model.","C determines which kernel function will be automatically selected by the algorithm for classification.","C controls the balance between maximizing the margin and minimizing misclassification, allowing the model to tolerate some errors while reducing overfitting.","C limits the number of support vectors that can be included in defining the decision boundary of the model."],"answer":[2],"explanation":"**Đáp án đúng: C controls the balance between maximizing the margin and minimizing misclassification, allowing the model to tolerate some errors while reducing overfitting.** – $C$ lớn: phạt lỗi mạnh, margin hẹp (dễ overfit); $C$ nhỏ: margin rộng, chấp nhận lỗi.\n- Scales features: là việc của StandardScaler.\n- Selects kernel: do người dùng chọn.\n- Limits number of support vectors: chỉ là hệ quả gián tiếp."},{"id":188,"slide":202,"topic":"KNN & Decision Tree","section":"Câu dài","question":"These are two main advantages of decision trees:","options":["They do not tend to overfit and are not sensitive to changes in data","They are very visual and easy to interpret","They are resistant to outliers and output scaled features","They output both parameters and significance levels"],"answer":[1],"explanation":"**Đáp án đúng: They are very visual and easy to interpret** – cây có thể vẽ ra và đọc theo các quy tắc if–else.\n- Do not overfit, not sensitive to data changes: sai, cây đơn dễ overfit và không ổn định.\n- Resistant to outliers and output scaled features: không đúng (không xuất đặc trưng chuẩn hoá).\n- Output parameters and significance levels: là đặc điểm của hồi quy thống kê.\nLưu ý: đề nói 'two main advantages' nhưng chỉ có một ý đúng trong các lựa chọn."},{"id":189,"slide":203,"topic":"Ensemble (RF, Bagging, Boosting)","section":"Câu dài","question":"This is the best way to choose the number of trees to build on a Bagging ensemble.","options":["Choose a large number of trees, typically above 100","Prioritize training error metrics over out of bag sample","Tune number of trees as a hyperparameter that needs to be optimized","Choose a number of trees past the point of diminishing returns"],"answer":[2],"explanation":"**Đáp án đúng: Tune number of trees as a hyperparameter that needs to be optimized** – chọn bằng cross-validation hoặc out-of-bag error, thêm cây giảm variance nhưng lợi ích bão hoà.\n- Large number above 100: tuỳ bài toán, không phải quy tắc.\n- Prioritize training error over OOB: sai, training error không phản ánh tổng quát hoá.\n- Past diminishing returns: tốn tài nguyên mà ít lợi ích."},{"id":190,"slide":204,"topic":"Phân loại (Logistic…)","section":"Câu dài","question":"This option describes a way of turning a regression problem for a classification problem:","options":["Create a new variable that flags 1 for above a certain value and 0 otherwise","Use outlier treatment","Use missing value handling","Create a new variable that uses autoencoding to transform a continuous outcome into categorical"],"answer":[0],"explanation":"**Đáp án đúng: Create a new variable that flags 1 for above a certain value and 0 otherwise** – đặt ngưỡng (binarization) chuyển biến liên tục thành nhãn phân loại.\n- Outlier treatment, missing value handling: là tiền xử lý, không đổi loại bài toán.\n- Autoencoding: dùng để học biểu diễn, không phải để rời rạc hoá target."},{"id":192,"slide":206,"topic":"EDA & Xử lý dữ liệu","section":"Câu dài","question":"The stratified sampling technique in machine learning is used ?","options":["To create a balanced dataset","To reduce the number of features","To ensure that each class is represented proportionally in training and testing sets","To increase the size of the dataset"],"answer":[2],"explanation":"**Đáp án đúng: To ensure that each class is represented proportionally in training and testing sets** – stratified sampling giữ tỉ lệ lớp ở mọi tập con.\n- Create a balanced dataset: không, tỉ lệ gốc được giữ nguyên.\n- Reduce features / increase dataset size: không liên quan."},{"id":193,"slide":207,"topic":"Clustering & khoảng cách","section":"Câu dài","question":"The difference between Euclidean distance and Manhattan distance is","options":["Euclidean distance considers only horizontal or vertical movements, while Manhattan distance allows diagonal movements.","Euclidean distance is the sum of absolute differences, while Manhattan distance is the sum of squared differences.","Euclidean distance measures the straight-line distance, while Manhattan distance measures the sum of absolute differences along each dimension","Euclidean distance is only applicable to numerical data, while Manhattan distance is used for categorical data"],"answer":[2],"explanation":"**Đáp án đúng: Euclidean measures the straight-line distance, while Manhattan measures the sum of absolute differences along each dimension.** – $d_2=\\sqrt{\\sum(x_i-y_i)^2}$, $d_1=\\sum|x_i-y_i|$.\n- Ý 1 và 2: đảo ngược định nghĩa.\n- Ý 4: cả hai dùng cho dữ liệu số."},{"id":194,"slide":208,"topic":"Clustering & khoảng cách","section":"Câu dài","question":"The following statement is an example of a business case where we can use the Cosine Distance?","options":["Cosine is useful for coordinate based measurements.","Cosine is better for data such as text where location of occurrence is less important.","Cosine distance is more sensitive to the curse of dimensionality","Cosine distance is less sensitive to the curse of dimensionality"],"answer":[1],"explanation":"**Đáp án đúng: Cosine is better for data such as text where location of occurrence is less important.** – với vector đếm từ, hướng quan trọng hơn độ lớn.\n- Coordinate-based measurements: phù hợp Euclidean.\n- More sensitive to curse of dimensionality: không đúng.\n- Less sensitive to curse of dimensionality: có thể đúng nhưng không phải ví dụ business case.\nLưu ý: ý cuối cũng có thể chấp nhận; theo bộ đề chọn ví dụ về văn bản."},{"id":195,"slide":209,"topic":"KNN & Decision Tree","section":"Câu dài","question":"The main purpose of scaling features before fitting a k nearest neighbor model is to:","options":["Help find the appropriate value of k","Ensure decision boundaries have roughly the same size for all classes","Ensure that features have similar influence on the distance calculation","Break ties in case there is the same number of neighbors of different classes next to a given observation"],"answer":[2],"explanation":"**Đáp án đúng: Ensure that features have similar influence on the distance calculation** – kNN dùng khoảng cách nên đặc trưng có thang đo lớn sẽ chi phối nếu không chuẩn hoá (ví dụ lương so với tuổi).\n- Find appropriate k: dùng cross-validation.\n- Decision boundaries same size for all classes: không liên quan.\n- Break ties: là việc của quy tắc chọn k lẻ/trọng số."},{"id":196,"slide":210,"topic":"Regularization & Overfitting","section":"Câu dài","question":"The bias-variance tradeoff is an important concept in model selection. Which statement best describes this tradeoff?","options":["Increasing model complexity always reduces both bias and variance at the same time.","Bias and variance are completely independent and can be minimized separately in any model.","As model complexity increases, bias decreases and variance increases, so the goal is to balance both to minimize total error.","A model with both high bias and high variance will achieve the lowest test error because the two errors cancel each other out."],"answer":[2],"explanation":"**Đáp án đúng: As model complexity increases, bias decreases and variance increases, so the goal is to balance both to minimize total error.**\n- Complexity reduces both: sai, variance tăng.\n- Independent and separately minimized: sai, hai đại lượng đánh đổi nhau.\n- High bias and high variance give lowest error: sai, chúng cộng vào tổng sai số: $\\text{Error}=\\text{Bias}^2+\\text{Variance}+\\text{Noise}$."},{"id":197,"slide":211,"topic":"Giảm chiều (PCA, MDS…)","section":"Câu dài","question":"Select the option that best completes the following sentence:\nFor data with many features, principal components analysis","options":["identifies which features can be safely discarded","reduces the number of features without losing any information.","establishes a minimum number of viable features for use in the analysis.","generates new features that are linear combinations of the original features."],"answer":[3],"explanation":"**Đáp án đúng: generates new features that are linear combinations of the original features.** – mỗi principal component là tổ hợp tuyến tính của các đặc trưng gốc, sắp theo phương sai giảm dần.\n- Identifies which features can be discarded: đó là feature selection; PCA không loại đặc trưng gốc.\n- Reduces features without losing any information: giảm chiều luôn mất một phần thông tin.\n- Minimum number of viable features: không phải vai trò của PCA."},{"id":198,"slide":212,"topic":"KNN & Decision Tree","section":"Câu dài","question":"Usually the first step to fit a k nearest neighbor classifier using scikit learn is to:","options":["import KNN from the sklearn.knearest neighbors module\ne.g. from sklearn.knearestneighbors import KNN","import KNeighbors Classifier from the sklearn.neighbors module\ne.g. from sklearn.neighbors import KNeighborsClassifier","import Classifier from the sklearn.nearestneighbors module\ne.g. from sklearn.nearestneighbors import Classifier","import KNNClassifier from the sklearn.knearestneighbors module\ne.g. from sklearn.knearest neighbors import KNNClassifier"],"answer":[1],"explanation":"**Đáp án đúng: import KNeighborsClassifier from the `sklearn.neighbors` module** – `from sklearn.neighbors import KNeighborsClassifier`.\n- Các module `sklearn.knearestneighbors`, `sklearn.nearestneighbors` và các lớp `KNN`, `Classifier`, `KNNClassifier`: không tồn tại trong scikit-learn."},{"id":199,"slide":213,"topic":"Phân loại (Logistic…)","section":"Câu dài","question":"Usually the first step to fit a logistic regression model using scikit learn is to:","options":["import logistic regression from the sklearn.linear_model module\ne.g. from sklearn.linear_model import LogisticRegression","import Logistic from the sklearn.regression module\ne.g. from sklearn.regression import Logistic","import Logistic from the sklearn.linear_regression module\ne.g. from sklearn.linear_regression import Logistic","import logistic regression from the sklearn.linear classifier module\ne.g. from sklearn.linearclassifier import Logistic Regression"],"answer":[0],"explanation":"**Đáp án đúng: import LogisticRegression from `sklearn.linear_model`** – `from sklearn.linear_model import LogisticRegression`.\n- `sklearn.regression`, `sklearn.linear_regression`, `sklearn.linearclassifier`: các module này không tồn tại; lớp cũng không tên `Logistic`."},{"id":200,"slide":214,"topic":"EDA & Xử lý dữ liệu","section":"Câu dài","question":"What is the purpose of feature engineering in the machine learning workflow?","options":["Selecting the most important features in the dataset","Creating new features or transforming existing ones to improve model performance","Training the machine learning model","Evaluating the model's performance on the test set"],"answer":[1],"explanation":"Feature Engineering giúp mô hình học tốt hơn bằng cách tạo ra các đặc trưng có ý nghĩa hoặc biến đổi dữ liệu đầu vào."},{"id":201,"slide":215,"topic":"EDA & Xử lý dữ liệu","section":"Câu dài","question":"What is the primary purpose of performing Exploratory Data Analysis (EDA) on a dataset?","options":["To train and evaluate a predictive machine learning model.","To remove all errors and missing values from the dataset.","To gain initial insights into the data, uncover trends, and highlight irregularities.","To convert the dataset into a different file format (e.g., CSV to Excel)."],"answer":[2],"explanation":"EDA giúp hiểu cấu trúc dữ liệu, phân phối, mối quan hệ giữa các biến và phát hiện dữ liệu bất thường trước khi xây dựng mô hình."},{"id":202,"slide":216,"topic":"Thống kê & suy luận","section":"Câu dài","question":"What is the difference between a parametric and a non-parametric method in statistical inference?","options":["Parametric methods assume a specific distribution for the data, while non-parametric methods make no assumptions about the underlying distribution","Parametric methods only apply to large sample sizes, while non-parametric methods are suitable for any sample size","Parametric methods are used for estimating population parameters, while non-parametric methods focus on summarizing the data","Parametric methods are computationally less intensive than non-parametric methods"],"answer":[0],"explanation":"Phương pháp tham số giả định dữ liệu tuân theo một phân phối xác định, trong khi phương pháp phi tham số không đưa ra giả định về phân phối của dữ liệu. Đây là điểm khác biệt cơ bản giữa hai nhóm phương pháp thống kê."},{"id":203,"slide":217,"topic":"Regularization & Overfitting","section":"Câu dài","question":"A data scientist is comparing three models of increasing complexity on the same dataset. The training error decreases steadily for all models, but the validation error initially decreases and then starts increasing for the most complex model. She decides to apply 10-fold cross-validation to better assess each model. Which statement best explains why cross-validation is especially useful in this case?","options":["It allows the data scientist to combine the training and test sets into one large dataset, which guarantees higher training accuracy for all models.","It provides multiple random splits of the training data, producing more stable estimates of each model's generalization performance and revealing the point at which increasing complexity leads to overfitting.","It ensures that all models achieve minimal error on the training data by repeatedly adjusting the model parameters using different folds of the same dataset.","It removes noise and outliers from the dataset automatically, preventing the more complex models from fitting any irregular patterns in the data."],"answer":[1],"explanation":"10-fold Cross Validation tạo ra nhiều lần chia dữ liệu khác nhau, giúp ước lượng ổn định hơn khả năng tổng quát hóa của từng mô hình và phát hiện thời điểm mô hình bắt đầu bị overfitting."},{"id":204,"slide":218,"topic":"KNN & Decision Tree","section":"Câu dài","question":"Which of the following scenarios would most likely benefit from using Logistic Regression instead of KNN?","options":["When the goal is interpretability and understanding the contribution of each feature.","When the data has complex patterns and requires highly flexible decision boundaries.","When instance-based decision making is crucial for local prediction accuracy.","When the number of training samples is very small compared to the number of features."],"answer":[0],"explanation":"Logistic Regression dễ giải thích thông qua các hệ số của từng đặc trưng, trong khi KNN khó diễn giải hơn."},{"id":205,"slide":219,"topic":"SVM","section":"Câu dài","question":"In SVM, what is the impact of setting a very large value for the regularization parameter C?","options":["The model becomes stricter about minimizing misclassification, potentially fitting noise and leading to poor generalization.","The margin becomes wider, increasing the robustness of the model against noise and improving accuracy.","The model allows more slack variables, increasing bias and underfitting the training data.","The kernel becomes more complex, requiring additional tuning of the gamma parameter for optimal performance."],"answer":[0],"explanation":"Giá trị C lớn làm giảm khả năng chấp nhận lỗi, mô hình nghiêm ngặt hơn trong việc giảm lỗi phân loại, dễ khớp cả nhiễu và dẫn đến overfitting."},{"id":206,"slide":220,"topic":"SVM","section":"Câu dài","question":"What is a key characteristic of Support Vector Machines?","options":["Support Vector Machine models rarely overfit on training data.","Support Vector Machine models are non-linear.","Support Vector Machine models can be used for classification but not for regression.","Support Vector Machine models can be used for regression but not for classification."],"answer":[0],"explanation":"SVM có khả năng tổng quát hóa tốt, đặc biệt khi lựa chọn kernel và tham số phù hợp."},{"id":207,"slide":221,"topic":"Ensemble (RF, Bagging, Boosting)","section":"Câu dài","question":"In ensemble learning, which strategy best describes how stacking operates?","options":["It adjusts model weights iteratively to focus on difficult examples and maximize accuracy.","It trains multiple models on the same data and averages their predictions without additional learning.","It selects only the best-performing model among all trained models for the final prediction.","It combines multiple base models and trains a meta-model to learn the optimal way to merge their predictions."],"answer":[3],"explanation":"Stacking kết hợp nhiều mô hình cơ sở và dùng một mô hình thứ hai (meta-model) để học cách kết hợp tối ưu các dự đoán của chúng."},{"id":208,"slide":222,"topic":"Dữ liệu mất cân bằng","section":"Câu dài","question":"A data scientist is using Random Forest to handle an imbalanced dataset. What additional technique can improve the model's performance o
