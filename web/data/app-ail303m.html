hine translation (ALPAC) and the limitations of the Perceptron","wrong":["The cost of maintaining Expert Systems was too high and they were difficult to scale","The defeat of the Deep Blue supercomputer by chess grandmaster Garry Kasparov","Artificial neural networks could not be scaled up to solve large enterprise problems"]},"r-m1-004":{"q":"When was the Backpropagation algorithm introduced in the history of AI?","correct":"In 1986, during the Expert Systems boom (1980s)","wrong":["In 1957, at the same time as the Perceptron algorithm","In 1950, when Alan Turing published the Turing Test","In 2012, at the time of the AlexNet boom"]},"r-m1-005":{"q":"How is Machine Learning precisely defined?","correct":"The study of programs that are not explicitly programmed but learn patterns from data over time","wrong":["The branch of science that simulates intelligent behavior in computers to imitate human cognition","A multi-layer neural network model specialized for processing large-scale nonlinear data","A system based on fixed expert rules to make automatic inferences"]},"r-m1-006":{"q":"In the Machine Learning workflow, which step comes immediately after 'Data Collection'?","correct":"Data Exploration & Preprocessing","wrong":["Modeling","Validation","Deployment"]},"r-m1-007":{"q":"Among the basic terms of machine learning, how is 'Target' defined?","correct":"The category or value that we are trying to predict","wrong":["The data attributes used as explanatory variables for prediction","A single data point corresponding to one row in the data table","The specific target value that has been labeled for each observation"]},"r-m1-008":{"q":"In a Machine Learning model, which component does the term 'Features' refer to?","correct":"The data attributes used for prediction (explanatory variables)","wrong":["The target label value that the model must produce as output","A single observation in the test dataset","The residual error between predicted and actual results"]},"r-m1-009":{"q":"What is a single data point in a data table (usually corresponding to one row) called?","correct":"Observation or Example","wrong":["Feature","Target","Label"]},"r-m1-010":{"q":"What harm do duplicate data in the training set cause to the model?","correct":"They bias the weights during training","wrong":["They cause the model to always underfit due to a lack of data","They make categorical variables impossible to convert with One-hot encoding","They automatically remove outlier observations in the test set"]},"r-m1-011":{"q":"Which values does Imputation typically use as replacements when handling missing data?","correct":"The mean, median, or most frequent value","wrong":["A fixed value of 0 or the largest outlier value of the attribute","A random value from any normal distribution unrelated to the dataset","The Euclidean distance between the two farthest observations"]},"r-m1-012":{"q":"What method is the Masking technique understood to be in handling missing data?","correct":"Creating a separate category for missing values","wrong":["Completely deleting rows or columns that contain missing values","Mathematical interpolation based on the nearest neighboring data points","Normalizing the data to the range [0, 1] before training"]},"r-m1-013":{"q":"Which visualization chart is mentioned in the material as helping to detect outliers?","correct":"Box plot","wrong":["Histogram","Scatter plot","Pair plot"]},"r-m1-014":{"q":"What is the main purpose of conducting Exploratory Data Analysis (EDA) before building a model?","correct":"To gain a preliminary understanding of the data and identify patterns and trends before modeling","wrong":["To optimize the hyperparameters of the classification algorithm","To prune decision tree branches in order to reduce variance","To generate synthetic samples for an imbalanced minority class"]},"r-m1-015":{"q":"Among EDA visualization techniques, what is a Scatter plot mainly used for?","correct":"Observing the relationship between two quantitative variables","wrong":["Observing the shape of the frequency distribution of a single variable","Displaying the multivariate correlation matrix of all variables at once","Detecting misclassified label errors in the test set"]},"r-m1-016":{"q":"Which chart is preferred for examining multivariate correlations among many pairs of attributes at once in EDA?","correct":"Pair plot","wrong":["Histogram","Box plot","A single Scatter plot"]},"r-m1-017":{"q":"What is the main effect of the Log Transformation in feature engineering?","correct":"It makes skewed data more closely resemble a normal distribution, which is useful for Linear Regression","wrong":["It converts categorical data into binary variables 0 or 1","It increases the dimensionality of the feature space using powers of 2 and 3","It generates new data points to balance the proportions of the classification classes"]},"r-m1-018":{"q":"One-hot encoding is most suitable for which type of categorical variable?","correct":"Nominal (unordered categories)","wrong":["Ordinal (categories with a hierarchical order)","Continuous (continuous numeric variables with negative values)","Discrete (countable integer variables)"]},"r-m1-019":{"q":"In which case should Ordinal encoding be applied instead of One-hot encoding?","correct":"When the categorical variable has a clear order (Ordinal), assigning numeric values in the order 1, 2, 3...","wrong":["When the categorical variable has no ranking whatsoever (Nominal)","When the data contains many outliers and needs to be noise-resistant","When one wants to transform skewed data into a normal distribution"]},"r-m1-020":{"q":"Which scaling method uses the interquartile range and is more robust to outliers?","correct":"Robust Scaling","wrong":["Min-Max Scaling","Standard Scaling","One-hot Encoding"]},"r-m1-021":{"q":"Standard Scaling transforms data to a standard distribution with which values of the mean and standard deviation (std)?","correct":"mean = 0, std = 1","wrong":["mean = 0, std = 0","mean = 1, std = 1","mean = 0.5, std = 0.5"]},"r-m1-022":{"q":"What is the core difference between Estimation and Inference in statistics?","correct":"Estimation applies an algorithm to compute a value, whereas inference determines the accuracy of that estimate","wrong":["Estimation is used for non-parametric models, whereas inference is used for parametric models","Estimation is computed on the test set, whereas inference is performed only on the training set","Estimation updates the posterior distribution, whereas inference only repeats independent trials"]},"r-m1-023":{"q":"What is the main characteristic of a Parametric model?","correct":"It assumes the data follow a specific distribution (e.g., the Normal distribution)","wrong":["It makes no assumptions at all about the probability distribution of the data","It only stores the entire training data and defers computation until prediction time","It always uses a number of parameters that grows in proportion to the number of data samples"]},"r-m1-024":{"q":"Which of the following examples is given in the material as representing a Non-parametric method?","correct":"The frequency distribution chart (Histogram)","wrong":["The Normal distribution","Classical Linear Regression","The Bernoulli binomial distribution"]},"r-m1-025":{"q":"How does the Bayesian view of statistical inference differ from the Frequentist school?","correct":"It describes parameters through probability distributions and updates beliefs from the prior to the posterior as data are observed","wrong":["It focuses only on frequency of occurrence through infinitely repeated trials","It treats the parameter as always a single fixed constant that cannot have a distribution","It absolutely does not use prior probability information in the inference process"]},"r-m1-026":{"q":"In statistical hypothesis testing, what does the Null Hypothesis (H0) usually represent?","correct":"The assumption that there is no effect or no difference","wrong":["The assumption that a clear effect or difference definitely exists","The maximum significance level allowed for accepting false positive error","The probability that the data fall into the rejection region of the normal distribution"]},"r-m1-027":{"q":"What is the decision rule in hypothesis testing when comparing the p-value with the significance level alpha (usually 0.05)?","correct":"If p-value < alpha, reject H0","wrong":["If p-value < alpha, H0 must be accepted","If p-value > alpha, reject H0","If p-value = 1, completely reject the alternative hypothesis H1"]},"r-m1-028":{"q":"When does a Type I Error occur in hypothesis testing?","correct":"Rejecting H0 when H0 is true (False Positive)","wrong":["Accepting H0 when H1 is true (False Negative)","Accepting H0 when H0 is true","Rejecting H0 when H1 is true"]},"r-m1-029":{"q":"Which of the following statements about the relationship between Correlation and Causation is correct?","correct":"Correlation helps with prediction but does not imply causation, because there may be confounding variables or spurious correlation","wrong":["If two variables have a high correlation coefficient, a direct causal relationship definitely exists","Correlation cannot be used for prediction unless causation can be proven","Confounding variables exist only when the two variables are completely independent"]},"r-m1-030":{"q":"What is the mandatory characteristic of the training data in Supervised Learning?","correct":"The training data must be labeled","wrong":["The training data must have no accompanying labels at all","The data consist of only a single string-type feature variable","All labels must be continuous variables greater than 0"]},"r-m1-031":{"q":"What are the two core keywords of Reinforcement Learning?","correct":"Policy and Action","wrong":["Target and Feature","Entropy and Information Gain","Centroid and Inertia"]},"r-m1-032":{"q":"What is the main difference between Regression and Classification problems in Supervised Learning?","correct":"The target variable in Regression is continuous numeric, whereas in Classification it is a discrete category","wrong":["Regression does not need a target label, whereas classification must have labels","Regression uses the Hinge Loss function, whereas classification always uses the SSE loss function","Regression applies only to text data, whereas classification applies only to audio data"]},"r-m1-033":{"q":"In scikit-learn, which method is called on a model object to train it on a dataset?","correct":"`model.fit(X_train, y_train)`","wrong":["`model.predict(X_train, y_train)`","`model.transform(X_train, y_train)`","`model.evaluate(X_train, y_train)`"]},"r-m1-034":{"q":"In the data splitting process, what is the Validation Set used for?","correct":"Tuning the model's hyperparameters","wrong":["Directly training the model's base weights","Evaluating the model's final overall performance before deployment","Checking the correctness of One-hot encoding"]},"r-m1-035":{"q":"What is the fundamental purpose of splitting data into a training set (Train) and a test set (Test)?","correct":"To check generalization on new data and avoid overfitting","wrong":["To ensure the data size is reduced so the algorithm converges faster","To convert data from a nonlinear form into a linear form","To automatically fill in missing values across the whole dataset"]},"r-m1-036":{"q":"How does K-fold Cross Validation work?","correct":"It splits the data into K parts, with each part serving in turn as the test set while the remaining parts serve as the training set","wrong":["It splits the data into K independent parts and trains K different unrelated models","It repeats training K times on the entire original dataset without splitting","It randomly selects K data points as representative cluster centers"]},"r-m1-037":{"q":"In the code `cross_val_score(lr, X, y, cv=5)`, what does the parameter `cv=5` indicate?","correct":"The number of folds in the cross-validation procedure is 5","wrong":["The proportion of data in the test set is 5%","The number of selected input features is 5","The maximum number of iterations of the regression model is 5"]},"r-m1-038":{"q":"In Linear Regression, what is the concept of 'Residual' understood to be?","correct":"The distance between the actual value and the model's predicted value","wrong":["The sum of squares of all errors on the training set","The distance between observations and the mean of the independent variable","The proportion of variance of the target variable explained by the model"]},"r-m1-039":{"q":"Which cost function is commonly used in Linear Regression to find the optimal fitted line?","correct":"SSE (Sum of Squared Errors), which minimizes the sum of squared residuals","wrong":["Hinge Loss, which penalizes misclassification errors on the margin","Deviance (binomial log-likelihood), which maximizes the likelihood","Exponential Loss, which assigns exponential weights to misclassified samples"]},"r-m1-040":{"q":"What is the meaning of the Coefficient of Determination (R-squared) in evaluating a regression model?","correct":"The proportion of variance of the target variable explained by the model; the closer the value is to 1, the better the model","wrong":["The sum of the absolute residual magnitudes; the larger the value, the more accurate the model","The ratio of correctly classified samples to the total number of samples in the confusion matrix","The slope of the separating hyperplane in a high-dimensional feature space"]},"r-m1-041":{"q":"When calling `model.score(X_test, y_test)` where `model` is a `LinearRegression` object, which metric is returned?","correct":"The coefficient of determination R-squared (R^2)","wrong":["The sum of squared errors SSE","The mean absolute error MAE","The classification accuracy Accuracy"]},"r-m1-042":{"q":"What is the main purpose of Polynomial Regression?","correct":"To capture nonlinear relationships by adding higher-degree terms of ts, reducing coefficient size but not shrinking them to 0","wrong":["It penalizes the sum of absolute values of the coefficients, shrinking coefficients completely to 0","It automatically labels missing data points before training","It can only be used when the feature variables are completely uncorrelated"]},"r-m1-048":{"q":"In which case is Elastic Net regularization recommended?","correct":"When the dataset has many feature variables that are strongly correlated with each other","wrong":["When all feature variables are completely independent and uncorrelated","When the dataset has only a single explanatory variable and no noise","When the problem requires converting the data into hierarchical clusters"]},"r-m1-049":{"q":"Why must Scaling (e.g., StandardScaler) always be performed before applying Regularization?","correct":"So that the coefficients are on the same scale, ensuring the penalty is applied fairly to every feature","wrong":["To transform all target labels into a normal distribution with mean 0","To transform nonlinear regression problems into classification problems","To completely eliminate multicollinearity among the independent variables"]},"r-m2-001":{"q":"Which mathematical function does Logistic Regression use to convert its output into a probability range from 0 to 1?","correct":"The Sigmoid function","wrong":["The Hinge Loss function","The multivariate Softmax function","The SSE loss function"]},"r-m2-002":{"q":"What is the fundamental distinction between Regression and Classification problems?","correct":"Regression predicts a continuous numeric value, whereas classification predicts a discrete category or label","wrong":["Regression applies only when the data have fewer than 100 samples, whereas classification applies to large data","Regression uses unsupervised learning models, whereas classification uses supervised learning models","Regression must use the RBF kernel function, whereas classification only uses linear hyperplanes"]},"r-m2-003":{"q":"What is a prominent advantage of the Logistic Regression model?","correct":"It is highly interpretable, helping to understand the importance and degree of impact of each factor","wrong":["It can automatically learn complex nonlinear features like a deep neural network","It is completely unaffected by the scale of the input feature variables","It automatically reduces the classification error on the test set to exactly 0"]},"r-m2-004":{"q":"In the declaration `LogisticRegression(penalty='l2', C=10.0)`, what does the parameter `penalty='l2'` indicate?","correct":"It uses L2 regularization penalty (the sum of squared coefficients)","wrong":["It uses the L1 Manhattan distance to measure similarity","It limits the maximum number of classification classes to 2 binary classes","It specifies the maximum depth of the classification model as 2 levels"]},"r-m2-005":{"q":"In a Confusion Matrix, what is the case called where a sample is actually Positive (Actual Positive) but the model predicts Negative (Predicted Negative)?","correct":"False Negative (FN) - Type II Error","wrong":["False Positive (FP) - Type I Error","True Positive (TP)","True Negative (TN)"]},"r-m2-006":{"q":"Which concept corresponds to the case where a sample is actually Negative (Actual Negative) but the model predicts Positive (Predicted Positive)?","correct":"False Positive (FP) - Type I Error","wrong":["False Negative (FN) - Type II Error","True Positive (TP)","True Negative (TN)"]},"r-m2-007":{"q":"What does the Recall (Sensitivity) metric measure in a classification problem?","correct":"The proportion of positive samples correctly identified out of all actual positive samples","wrong":["The proportion of truly positive samples out of all samples the model predicts as positive","The proportion of correctly predicted samples (both negative and positive) over the entire dataset","The ability to avoid false alarms on actual negative samples"]},"r-m2-008":{"q":"What does the Precision metric reflect?","correct":"The proportion of truly positive samples among the samples the model predicts as positive","wrong":["The proportion of negative samples correctly identified out of all actual negative samples","The total number of correct predictions of both the positive and negative classes divided by the total number of samples","The area under the performance curve plotting TPR against FPR"]},"r-m2-009":{"q":"Which two quantities does the ROC Curve plot against each other?","correct":"True Positive Rate (TPR) and False Positive Rate (FPR)","wrong":["Precision and Recall","Accuracy and F1-Score","Bias and Variance"]},"r-m2-010":{"q":"What are the two most fundamental theoretical characteristics of the K-Nearest Neighbors (KNN) algorithm?","correct":"Non-parametric and Lazy learner","wrong":["Parametric and Eager learner","Greedy and automatic Feature extraction","Bottom-up hierarchical and global objective function optimization"]},"r-m2-011":{"q":"Why is Feature Scaling especially important for the KNN algorithm?","correct":"Because KNN relies on distance measures (such as Euclidean), so variables with a large range will dominate the entire result","wrong":["Because KNN requires all input variables to follow a standard normal distribution with mean=0 and std=1","Because without scaling, the algorithm cannot compute the Hinge Loss function","Because Feature Scaling helps KNN convert from a classification algorithm to a regression algorithm"]},"r-m2-012":{"q":"Which method is commonly applied on the error rate plot to choose the optimal value of K in the KNN algorithm?","correct":"The Elbow Method","wrong":["The Dendrogram branching chart","The minimum Cosine distance","The SMOTE resampling method"]},"r-m2-013":{"q":"How does the KNN algorithm predict the label for a new data point?","correct":"It computes the distance to every point, selects the K nearest points, and assigns the label by majority class among those K points","wrong":["It finds the optimal hyperplane solution by minimizing the sum of squared residual errors","It maps the data point to an infinite-dimensional space and then uses the Sigmoid function to compute the probability","It traverses branches from root to leaf according to the criterion of the greatest reduction in Entropy impurity"]},"r-m2-014":{"q":"When comparing the training (Fit) process of Linear Regression and KNN, which statement is correct?","correct":"Linear Regression trains slowly because it must minimize a cost function, whereas KNN trains very quickly because it only needs to store the data","wrong":["Linear Regression trains quickly because it has no parameters, whereas KNN trains slowly because of neighbor search","Both models train at the same speed because they both use the backpropagation algorithm","KNN trains slowly because it must build an optimal weight matrix before receiving new data"]},"r-m2-015":{"q":"Regarding the Prediction phase and Memory consumption, what is KNN's disadvantage compared with Linear Regression?","correct":"KNN predicts slowly (it must search for the nearest neighbors) and is memory-intensive (it must store the entire training set)","wrong":["KNN predicts very quickly and uses less memory because it stores only a few basic weights","KNN cannot make predictions if the test set has more than 3 attributes","KNN must solve a system of second-order derivative equations at each prediction step"]},"r-m2-016":{"q":"What is the main goal of the Support Vector Machines (SVM) algorithm?","correct":"To find a hyperplane that separates the classes such that the margin between the classes is maximized","wrong":["To maximize the area under the ROC curve by estimating normal distribution probabilities","To cluster data points based on minimizing the Gini Index impurity criterion","To create independent decision trees on random subsets sampled with replacement"]},"r-m2-017":{"q":"What key role do 'Support Vectors' play in an SVM model?","correct":"They are the data points closest to the decision boundary and directly affect the optimal position of the hyperplane","wrong":["They are the outliers farthest from the data cloud that the algorithm must remove","They are vectors representing the mean coordinates of all points in the same cluster","They are the regularization weights assigned to the model after the fit process ends"]},"r-m2-018":{"q":"What is the difference in loss function between SVM and Logistic Regression?","correct":"SVM uses the Hinge Loss function to penalize misclassification, whereas Logistic Regression uses a loss function that asymptotically decays toward 0","wrong":["SVM uses the least-squares SSE loss function, whereas Logistic Regression uses the Deviance function","SVM uses the Exponential Loss function, whereas Logistic Regression uses Hinge Loss","Both models use the same Hinge Loss function, but SVM has no regularization parameter C"]},"r-m2-019":{"q":"What advantage and disadvantage does using the Hinge Loss function bring to SVM compared with Logistic Regression?","correct":"Better classification accuracy but less sensitivity for estimating predicted probabilities","wrong":["Prediction speed increases many times over but requires more memory","It can compute exact percentage output probabilities but is easily affected by multicollinearity","It completely removes the dependence on the regularization hyperparameter C"]},"r-m2-020":{"q":"In scikit-learn, which syntax is used to instantiate a linear SVM model with the Hinge loss function?","correct":"`LinearSVC(C=1.0, loss='hinge', max_iter=10000)`","wrong":["`SVC(kernel='rbf', loss='sse')`","`SGDClassifier(loss='log_loss')`","`LogisticRegression(penalty='hinge')`"]},"r-m2-021":{"q":"How does an SVM model behave with respect to outlier data points?","correct":"It can be affected by outliers, which may significantly change the decision boundary if not handled properly","wrong":["It is completely immune to outlier data thanks to an automatic branch-pruning mechanism","It automatically transforms outliers to the center of the normal distribution","It always removes outliers from the dataset before optimizing the hyperplane"]},"r-m2-022":{"q":"What is the role of the regularization parameter C in an SVM model?","correct":"It controls the trade-off between maximizing the margin and minimizing classification error","wrong":["It specifies the number of neighboring points to consider when labeling a sample","It determines the number of base decision trees in the ensemble model","It measures the reduction in Entropy impurity after each split"]},"r-m2-023":{"q":"When the parameter C is set to a small value in SVM, how does the model tend to behave?","correct":"It allows more misclassifications in order to achieve a larger margin, which helps reduce overfitting","wrong":["It tries to classify all data points correctly at all costs, resulting in a narrow margin and being prone to overfitting","It completely eliminates all support vectors from the model","It automatically switches from the linear kernel to the Gaussian RBF kernel"]},"r-m2-024":{"q":"What consequence can occur when the parameter C is set too large in SVM?","correct":"The margin narrows in an attempt to classify every point correctly, which easily leads to overfitting","wrong":["The model ignores most of the training data, leading to severe underfitting","Prediction computation time drops to 0","The algorithm must assign the label -1 to all boundary points"]},"r-m2-025":{"q":"What is the core meaning of the Kernel Trick in SVM?","correct":"It performs nonlinear classification by mapping the data into a higher-dimensional space without explicitly computing the coordinates","wrong":["It reduces the data from a high-dimensional space to a 2-dimensional space to speed up computation","It converts a supervised classification problem into an unsupervised clustering problem","It randomly samples the dataset with replacement to build independent models"]},"r-m2-026":{"q":"Which type of Kernel is commonly used in SVM to transform nonlinear data so that it can be separated by a hyperplane?","correct":"Gaussian (RBF) Kernel","wrong":["Linear Kernel","Manhattan Kernel","Jaccard Kernel"]},"r-m2-027":{"q":"In the model `SVC(kernel='rbf', gamma='scale')`, what is the role of the `gamma` parameter?","correct":"It controls the range of influence of a single training data point","wrong":["It determines the number of clusters K to separate in the space","It limits the maximum depth of the separating hyperplane","It measures the multivariate correlation between pairs of features"]},"r-m2-028":{"q":"Which Kernel in SVM is most suitable when the original data are already linearly separable?","correct":"Linear Kernel","wrong":["Gaussian (RBF) Kernel","Polynomial Kernel of degree 5","Nonlinear Sigmoid Kernel"]},"r-m2-029":{"q":"What is the biggest performance limitation of traditional Kernel methods in SVM?","correct":"They run very slowly on datasets larger than a few thousand samples unless parallelized","wrong":["They cannot find a decision boundary for data with 2 or more attributes","They require the training data to follow a Poisson distribution","They always cause the R-squared coefficient of determination to fall below 0"]},"r-m2-030":{"q":"How does the RBFSampler (Random Fourier Features) technique speed up SVM training?","correct":"It approximates the feature mapping of the RBF kernel, allowing the model to train faster on large datasets","wrong":["It randomly removes 90% of the rows in the training dataset","It replaces all Euclidean distance measures with Manhattan distance","It converts categorical labels into continuous real values"]},"r-m2-031":{"q":"What purpose does the Nystroem technique serve in SVM optimization?","correct":"It approximates the kernel feature mapping in order to speed up the training process","wrong":["It prunes decision tree branches whose depth exceeds the allowed limit","It labels noise data points in the DBSCAN algorithm","It estimates the optimal bandwidth for the Mean-Shift algorithm"]},"r-m2-032":{"q":"In the code example illustrating speed-up with `RBFSampler`, which fast linear model is used on the newly generated features?","correct":"`SGDClassifier(max_iter=1000)`","wrong":["`DecisionTreeClassifier(max_depth=5)`","`KNeighborsClassifier(n_neighbors=3)`","`AgglomerativeClustering(linkage='ward')`"]},"r-m2-033":{"q":"What is the first step in the basic Workflow when training an SVM model?","correct":"Collect and prepare the data (labeling, feature scaling)","wrong":["Tune the hyperparameters C and gamma via cross-validation","Choose the appropriate nonlinear Kernel type","Evaluate the model on the final test dataset"]},"r-m2-034":{"q":"After the appropriate Kernel type has been chosen, what is the next step in the SVM workflow?","correct":"Tune the hyperparameters (C, gamma) through Cross-validation","wrong":["Re-collect the data from scratch from API or NoSQL sources","Transform the categorical labels using One-hot encoding","Immediately deploy the model to the production system without evaluation"]},"r-m2-035":{"q":"Why is feature scaling a mandatory operation in the data preparation step for SVM?","correct":"To ensure that variables with large units do not dominate the distance computation and the margin width","wrong":["To transform outlier data points into points lying on the hyperplane","To force the Hinge Loss function to always equal exactly 0","To completely remove the need to split the data into Train and Test sets"]},"r-m3-001":{"q":"In terms of the underlying algorithm, on which algorithmic principle does a Decision Tree operate?","correct":"A greedy algorithm that splits the data based on impurity measures","wrong":["A dynamic programming algorithm that globally optimizes the separating boundaries","A swarm algorithm that minimizes the distance between data points","A stochastic gradient descent algorithm that minimizes the Hinge Loss function"]},"r-m3-002":{"q":"When comparing Prediction speed with KNN and Logistic Regression, what is characteristic of a Decision Tree?","correct":"Very fast, because it only needs to traverse the tree branches from the root down to a leaf","wrong":["Slowest, because it must compute distances to all data points in the training set","Very slow, because it must solve an optimization system of equations when receiving a new sample","Comparable to KNN because both are Lazy learner models"]},"r-m3-003":{"q":"What is a characteristic of the Decision Boundary in a Decision Tree model?","correct":"It has an intuitive, hierarchical structure","wrong":["It is a perfectly flat hyperplane with no hierarchy","It is a smooth curve defined by the Sigmoid activation function","It is always fixed and cannot change when new training data are added"]},"r-m3-004":{"q":"What does the Entropy measure reflect in the splitting mechanism of a Decision Tree?","correct":"The degree of disorder of the information in the dataset","wrong":["The maximum margin distance between two opposing classes","The minimum number of samples required to create a new leaf node","The ratio of correctly predicted samples to the total number of test samples"]},"r-m3-005":{"q":"How is the concept of Information Gain defined?","correct":"The difference between the entropy before and after splitting the data","wrong":["The total impurity of all leaf nodes after the pruning process finishes","The percentage of data explained by the model, equivalent to R-squared","The increase in classification accuracy when moving from a single tree to a random forest"]},"r-m3-006":{"q":"What does the Gini Index measure in Decision Tree splitting?","correct":"A measure of how often a randomly chosen element in the dataset would be misclassified","wrong":["The sum of squared distances between elements and the class centroid","The probability that the element falls into an undecidable boundary region","The multivariate correlation between pairs of input attributes"]},"r-m3-007":{"q":"What is the most common problem and a major drawback of Decision Trees?","correct":"They tend to overfit the training data and have high variance","wrong":["They severely underfit due to strict statistical assumptions","They only work with data that have binary labels 0 and 1","They cannot represent intuitive logical decision rules"]},"r-m3-008":{"q":"What is the main purpose of applying Pruning to a Decision Tree?","correct":"To remove branches that contribute little predictive value in order to improve generalization","wrong":["To convert all categorical variables into continuous variables","To add more leaf levels to fit 100% of the training data perfectly","To randomly combine multiple trees into a Bagging model"]},"r-m3-009":{"q":"On which criterion is Pruning in a Decision Tree usually based?","correct":"The classification error threshold","wrong":["The Manhattan distance between neighboring points","The L2 regularization coefficient of the independent variables","The increase in the model's memory footprint"]},"r-m3-010":{"q":"Decision Trees are considered very easy for humans to interpret thanks to which logical structure?","correct":"'if... then... else' logic","wrong":["Multi-layer nonlinear integral functions","Hyperplane regression equations in infinite-dimensional space","Higher-order Markov transition matrices"]},"r-m3-011":{"q":"Which of the following statements is correct regarding the flexibility of Decision Trees in handling data types?","correct":"They can handle all types of data, from binary and ordinal to continuous","wrong":["They can only handle continuous numeric data and cannot be used for categorical data","They require all variables to be converted into binary 0/1 categorical variables","They only work with data transformed using the Log function"]},"r-m3-012":{"q":"In terms of data preprocessing, what outstanding advantage do Decision Trees have over KNN and SVM?","correct":"They do not require complex data preprocessing or feature scaling","wrong":["They automatically fill in all missing values using the median method","They automatically generate higher-degree polynomial features without any supporting library","They require hypothesis testing to be applied before reading the data"]},"r-m3-013":{"q":"In the code `DecisionTreeClassifier(criterion='entropy', max_depth=5)`, what does the parameter `criterion='entropy'` mean?","correct":"It uses the Entropy measure to evaluate and select the splitting feature","wrong":["It uses the Gini Index to measure the degree of misclassification","It applies the Hinge Loss function during training","It computes distances using the Euclidean norm for neighboring points"]},"r-m3-014":{"q":"What is the role of the parameter `max_depth=5` when instantiating `DecisionTreeClassifier`?","correct":"It limits the maximum depth of the tree to prevent overfitting","wrong":["It specifies the number of sub-trees created in a random forest","It specifies the maximum number of features selected at each split","It divides the data into 5 equal parts for K-fold cross-validation"]},"r-m3-015":{"q":"To control and prevent overfitting in a Decision Tree, which factors can be tuned?","correct":"Tune parameters such as `max_depth` and `min_samples_leaf`, or use cross-validation","wrong":["Increase the polynomial degree of the input features to degree 4 or 5","Switch the loss function to Exponential Loss and increase the number of outlier samples","Skip the data labeling step and switch to an unsupervised learning model"]},"r-m4-001":{"q":"How is the Ensemble Learning technique defined?","correct":"A technique that combines the predictions of multiple individual models (base learners) to create an overall model with better and more stable generalization","wrong":["A method that replaces all training data with principal components after dimensionality reduction by PCA","A technique that trains only a single decision tree of unlimited depth in order to completely eliminate error","An unsupervised machine learning model specialized in grouping observations that share the same probability distribution"]},"r-m4-002":{"q":"Which two types of error is the core goal of Ensemble Learning aimed at reducing?","correct":"Reducing variance and reducing bias","wrong":["Reducing the number of data samples and reducing the number of input features","Reducing the Gini Index impurity and eliminating the Manhattan distance","Reducing the number of clusters K and reducing the neighborhood radius Epsilon"]},"r-m4-003":{"q":"What are the three main approaches in Ensemble Learning mentioned in the material?","correct":"Bagging, Boosting, and Stacking","wrong":["K-Means, HAC, and DBSCAN","Regression, Classification, and Clustering","Underfitting, Overfitting, and Regularization"]},"r-m4-004":{"q":"How is the 'Bootstrap' mechanism in the Bagging technique carried out?","correct":"Sampling the data with replacement to create new training subsets","wrong":["Sequentially sampling the data without replacement and gradually removing misclassified samples","Splitting the original dataset into K completely equal and independent parts","Linearly interpolating between the nearest neighboring data points to generate extra samples"]},"r-m4-005":{"q":"In the Bagging technique, in what form are the predictions of the base models combined (Aggregation)?","correct":"Averaging the results for regression problems or majority voting for classification problems","wrong":["Using a complex meta model to learn nonlinear weights for each tree","Successively multiplying the predicted values of each model in a chain","Keeping only the prediction of the base model with the highest score on the test set"]},"r-m4-006":{"q":"How does the Random Forest algorithm add randomness compared with ordinary Bagging?","correct":"It randomly selects only a subset of features at each tree split point","wrong":["It trains trees sequentially so that each later tree corrects the errors of ording to the majority of their nearest neighboring observations","They are moved to the test set to evaluate out-of-bag performance"]},"r-m4-011":{"q":"The Base Learner in Boosting is often a 'Decision Stump'; how is this concept understood?","correct":"A decision tree with exactly 1 level that makes its decision based on only 1 specific feature","wrong":["A fully grown decision tree with unlimited maximum depth","A deep neural network with many hidden layers trained by backpropagation","An SVM model using the nonlinear Gaussian RBF kernel with a large gamma parameter"]},"r-m4-012":{"q":"What is the main difference between AdaBoost and Gradient Boosting in terms of loss function and robustness to outliers?","correct":"AdaBoost uses an exponential loss function that is very sensitive to outliers, whereas Gradient Boosting typically uses the Deviance function, which is more robust to outliers","wrong":["AdaBoost uses the Hinge Loss function, which is robust to outliers, whereas Gradient Boosting uses the SSE function, which is sensitive to outliers","AdaBoost optimizes the cost function with Gradient Descent, whereas Gradient Boosting optimizes with a genetic algorithm","AdaBoost runs in parallel on multi-core hardware, whereas Gradient Boosting runs sequentially on a single thread"]},"r-m4-013":{"q":"In the declaration `GradientBoostingClassifier(n_estimators=100, learning_rate=0.1, max_depth=3)`, what role does the `learning_rate` parameter play?","correct":"It controls the rate at which the contribution of each sub-tree to the overall model is scaled (shrinkage)","wrong":["It specifies the epsilon neighborhood radius for finding core data points","It determines the number of random features selected at each split point","It is the percentage of outlier data samples to be removed before fitting"]},"r-m4-014":{"q":"What is the biggest characteristic that distinguishes Stacking from Bagging and Boosting?","correct":"It combines models of different (heterogeneous) types, such as SVM, KNN, and Logistic Regression","wrong":["It uses only a single homogeneous type of base model, a 1-level decision tree","It must train the base models in a sequential error-correcting chain","It does not use data labels at all in the entire training process"]},"r-m4-015":{"q":"How does the layering mechanism in the Stacking technique work?","correct":"The base-level models (level-0) make predictions, and these predictions serve as inputs to the meta model (level-1), which makes the final conclusion","wrong":["The meta model (level-1) predicts first, and then passes the results to the base-level models (level-0) to filter noise","The base models are trained only on the test set, whereas the meta model is trained only on the training set","The original data are split into multiple layers according to the depth of the Dendrogram"]},"r-m4-016":{"q":"What is the input of the meta model (level-1) in the Stacking architecture?","correct":"The predictions (such as class probabilities) output by the base-level models (level-0)","wrong":["The original raw dataset together with all unscaled features","The Manhattan distance between observations and cluster centroids","The Entropy and Gini Index impurity values at each leaf node"]},"r-m4-017":{"q":"What are the common methods for combining predictions at the meta model level in Stacking?","correct":"Majority voting or weighting each model based on its performance","wrong":["Bootstrap sampling with replacement on the multivariate correlation matrix","Pruning models whose depth exceeds the allowed classification error threshold","Mapping the predictions into the RBF kernel space with a fixed gamma parameter"]},"r-m4-018":{"q":"When comparing the error-optimization goals of Bagging and Boosting, which statement is correct?","correct":"Bagging mainly aims to reduce Variance (avoiding overfitting), whereas Boosting aims to reduce Bias (overcoming underfitting)","wrong":["Bagging aims to reduce Bias, whereas Boosting in the multidimensional space","The black-box model can be completely replaced by a single 1-level decision tree"]},"r-m4-028":{"q":"In the LIME procedure, by what principle are the perturbations weighted?","correct":"Perturbations closer to the original point receive higher weights, and those farther away receive lower weights","wrong":["All perturbations are assigned exactly equal weights","Perturbations farther from the original point are assigned larger weights","Weights are assigned randomly from a uniform distribution between 0 and 1"]},"r-m4-029":{"q":"Why should Accuracy absolutely not be used to evaluate a model on imbalanced data?","correct":"Because the model can achieve very high Accuracy simply by predicting the majority class correctly while completely ignoring or misclassifying the minority class","wrong":["Because the Accuracy formula would be divided by 0 when the minority class has too few samples","Because Accuracy applies only to continuous regression problems and not to classification","Because the confusion matrix automatically swaps the TP and TN values during computation"]},"r-m4-030":{"q":"Which three evaluation metrics are recommended instead of Accuracy for imbalanced data?","correct":"AUC (Area Under Curve), F1 Score, and Cohen's Kappa","wrong":["SSE, TSS, and R-squared","Entropy, Information Gain, and Gini Index","Inertia, Distortion, and Bandwidth"]},"r-m4-031":{"q":"By what mechanism does the SMOTE technique generate new data points for the minority class?","correct":"It creates new samples based on existing ones through mathematical interpolation","wrong":["It directly duplicates existing data rows of the minority class","It removes majority-class points that lie too close to the decision boundary","It maps data points into an infinite-dimensional feature space using the RBF kernel"]},"r-m4-032":{"q":"In the imbalanced data handling process, when must Resampling be performed?","correct":"Only after the Train and Test sets have been split (after the Stratified Split)","wrong":["On the entire original data before splitting the Train and Test sets","Only on the test set (Test set) after the model has finished training","Simultaneously while computing the final confusion matrix"]},"r-m4-033":{"q":"What is the criterion for retaining majority-class data points in the NearMiss-1 algorithm?","correct":"Points whose average distance to the 3 nearest minority-class points is the smallest","wrong":["Points whose average distance to the 3 farthest minority-class points is the smallest","Points that are the nearest neighbors of each minority-class point","Points whose coordinates coincide with the K-Means cluster center of the majority class"]},"r-m4-034":{"q":"What is the difference between the two boundary-cleaning techniques Tomek Links and ENN (Edited Nearest Neighbors)?","correct":"Tomek Links removes majority-class points that lie too close to the minority class, whereas ENN removes points whose label differs from the majority of their surrounding neighbors","wrong":["Tomek Links duplicates additional minority samples, whereas ENN reduces majority samples","Tomek Links applies only to regression problems, whereas ENN applies only to classification","Tomek Links measures Cosine distance, whereas ENN must measure Manhattan distance"]},"r-m4-035":{"q":"What is the core nature of Unsupervised Learning?","correct":"The model is trained on unlabeled data and discovers hidden structures or patterns on its own","wrong":["The model must have pre-assigned discrete categorical target labels","The model uses the Hinge Loss function to maximize the separating margin","The model is trained only on datasets whose sample proportions have been balanced with SMOTE"]},"r-m4-036":{"q":"What are the two main types of problems in Unsupervised Learning mentioned in the material?","correct":"Clustering and Dimension Reduction","wrong":["Regression and Classification","Reinforcement Learning and Transfer Learning","Hypothesis Testing and Bayesian Estimation"]},"r-m4-037":{"q":"What causes the 'Curse of Dimensionality' problem?","correct":"The number of training samples required grows exponentially with the number of dimensions, so having too many features leads to poorer model performance","wrong":["The number of clusters K grows too quickly, so the clustering algorithm cannot converge","Excessive duplicate data cause the model weights to be biased","The Euclidean distance between points always converges to 0"]},"r-m4-038":{"q":"Which algorithm does the material emphasize as being useful for Dimension Reduction?","correct":"PCA (Principal Component Analysis)","wrong":["K-Means","DBSCAN","AdaBoost"]},"r-m4-039":{"q":"In the K-Means algorithm, how is the position of a cluster center (centroid) updated at each iteration?","correct":"By taking the mean of the coordinates of all data points in that cluster","wrong":["By randomly choosing any data point in the cluster as the new center","By computing the median Manhattan distance from the points to the origin","By finding the point whose number of neighbors exceeds the MinPts parameter within radius Epsilon"]},"r-m4-040":{"q":"What benefit does the K-Means++ initialization improvement bring over traditional K-Means?","correct":"Smarter centroid initialization that helps the algorithm converge faster and avoid poor local optima","wrong":["It automatically finds the optimal number of clusters K without the user specifying it","It allows the algorithm to handle clusters of arbitrary non-spherical shapes well","It completely removes outlier data points from the computation"]},"r-m4-041":{"q":"How does the Elbow Method determine the optimal number of clusters K?","correct":"By plotting the Inertia value against K and choosing the point where the rate of decrease in Inertia clearly slows down","wrong":["By plotting the ROC curve and choosing the point with the largest area under the curve AUC","By cutting across the longest vertical line in the Dendrogram","By finding the value of K at which all labeled data are classified 100% correctly"]},"r-m4-042":{"q":"How is the Inertia (SSE) metric in the K-Means algorithm defined?","correct":"The sum of squared distances from points to their cluster centers","wrong":["The mean of squared distances between pairs of cluster centers","The largest Euclidean distance between any two points in the same cluster","The ratio of within-cluster variance to between-cluster variance"]},"r-m4-043":{"q":"As the number of clusters K increases, how does the Inertia value in K-Means vary?","correct":"Inertia always decreases as K increases","wrong":["Inertia always increases as K increases","Inertia stays unchanged for every value of K","Inertia decreases only when K is even and increases when K is odd"]},"r-m4-044":{"q":"Which of the following applications of clustering helps businesses optimize marketing campaigns?","correct":"Customer segmentation by shopping behavior and demographics","wrong":["Predicting future stock revenue values using regression","Automatically filling in missing data using the Masking technique","Detecting Type I errors in the hypothesis testing process"]},"r-m4-045":{"q":"On what mechanism do clustering algorithms support Anomaly Detection?","correct":"Identifying isolated data points that clearly do not belong to any cluster","wrong":["Identifying data points located near the center of the highest-density cluster","Counting the number of points that fall into leaf nodes with Entropy impurity equal to 0","Finding variables whose regression coefficients are shrunk to 0 by LASSO"]},"r-m4-046":{"q":"In image processing, how is the clustering technique applied to the Image Compression problem?","correct":"It reduces the number of colors or the resolution while still preserving the main content of the image","wrong":["It converts a color image into a binary black-and-white image of 0s and 1s","It doubles the image resolution using pixel interpolation","It automatically removes the background behind the main object in the image completely"]},"r-m4-047":{"q":"In scikit-learn, which attribute of a trained `KMeans` object stores the Inertia value (the sum of squared distances to the cluster centers)?","correct":"`kmeans.inertia_`","wrong":["`kmeans.cluster_centers_`","`kmeans.labels_`","`kmeans.distortion_`"]},"r-m4-048":{"q":"Which attribute is used to retrieve the coordinates of the cluster centers after a `KMeans` model has finished training?","correct":"`kmeans.cluster_centers_`","wrong":["`kmeans.inertia_`","`kmeans.centroids_`","`kmeans.centers_`"]},"r-m4-049":{"q":"Which `KMeans` method both trains the model and directly returns the predicted cluster labels for the input dataset?","correct":"`kmeans.fit_predict(X)`","wrong":["`kmeans.transform(X)`","`kmeans.score(X)`","`kmeans.fit_transform(X)`"]},"r-m4-050":{"q":"What are the characteristics of Euclidean (L2) Distance?","correct":"It computes the shortest straight line between two points, suitable for coordinate data but sensitive to the curse of dimensionality","wrong":["It computes the sum of absolute differences between coordinates and is unaffected by the number of dimensions","It measures the angle between two vectors and is completely unaffected by magnitude (scaling)","It measures the ratio of shared elements to the total number of unique elements of two sets"]},"r-m4-051":{"q":"In which case is Manhattan Distance (L1 / City Block) usually preferred?","correct":"When the features do not share the same unit of measurement or the data move along a grid-like network","wrong":["When measuring similarity between long text documents","When the data are binary sets for which the Intersection over Union ratio must be computed","When finding clusters of arbitrary complex concave and convex shapes"]},"r-m4-052":{"q":"Why is Cosine Distance especially effective in Text Mining?","correct":"It measures the angle between two vectors, so it is unaffected by magnitude (document length) and only considers frequency and relative direction","wrong":["It computes the shortest straight-line distance between the keywords that appear","It automatically normalizes the vocabulary distribution to a normal distribution with mean 0","It is completely robust to outlier data points based on the interquartile range"]},"r-m4-053":{"q":"On what principle is Jaccard Distance computed?","correct":"Based on the ratio of shared elements to the total number of unique elements (Intersection over Union)","wrong":["The square root of the sum of squared differences between coordinates","The dot product of two vectors divided by the product of their lengths","The sum of absolute differences between feature variables"]},"r-m4-054":{"q":"According to the hand-calculation example in the material, for two vectors `a = [[1, 2, 3]]` and `b = [[4, 5, 6]]`, how is the Euclidean distance computed?","correct":"sqrt((1-4)^2 + (2-5)^2 + (3-6)^2) = sqrt(9 + 9 + 9) = sqrt(27) (approximately 5.196)","wrong":["|1-4| + |2-5| + |3-6| = 3 + 3 + 3 = 9","(1*4 + 2*5 + 3*6) = 4 + 10 + 18 = 32","(1-4)^2 + (2-5)^2 + (3-6)^2 = 27"]},"r-m4-055":{"q":"According to which model does Hierarchical Agglomerative Clustering (HAC) build clusters?","correct":"A bottom-up hierarchical model, in which each point initially forms its own cluster and the closest clusters are then gradually merged","wrong":["A top-down hierarchical model that splits the entire dataset into smaller clusters","Randomly choosing K centroids and assigning points to the nearest centroid until convergence","Shifting the center of a search window toward the region of highest point density"]},"r-m4-056":{"q":"By what criterion does Ward Linkage in hierarchical clustering operate?","correct":"It merges clusters such that the increase in total variance (Inertia) is minimized","wrong":["It measures the smallest distance between two points belonging to two different clusters","It measures the largest distance between two points belonging to two different clusters","It computes the average distance of all pairs of points between two clusters"]},"r-m4-057":{"q":"Which linkage method in HAC is prone to being affected by noise because it causes the 'chaining' effect?","correct":"Single Linkage","wrong":["Complete Linkage","Average Linkage","Ward Linkage"]},"r-m4-058":{"q":"When examining a Dendrogram, where does cutting the hierarchy tree usually yield the most natural and stable clustering result?","correct":"Cutting across the longest vertical lines (where the distance between cluster merges is the largest)","wrong":["Cutting across the horizontal branches at the lowest position near the bottom of the chart","Cutting at the point where the number of sub-branches equals the number of input attributes","Cutting at the point where all data points become individual single clusters"]},"r-m4-059":{"q":"What is the criterion for measuring the distance between two clusters in Complete Linkage?","correct":"The largest distance between two points belonging to two different clusters","wrong":["The smallest distance between two points belonging to two different clusters","The average distance between all pairs of points of the two clusters","The distance between the two cluster centers computed under a normal distribution"]},"r-m4-060":{"q":"What are two prominent advantages of the DBSCAN clustering algorithm?","correct":"It can find clusters of arbitrary shape and automatically excludes noise","wrong":["It computes faster than K-Means on datasets of millions of samples","It requires no input parameters from the user","It always splits the data into uniform, perfectly spherical clusters"]},"r-m4-061":{"q":"In DBSCAN, under what condition is a data point identified as a 'Core Point'?","correct":"It has more than MinPts neighboring points within the radius Epsilon (eps)","wrong":["It lies within the eps radius of another point but itself has fewer than MinPts neighbors","It has no neighboring points at all within the eps radius","Its coordinates coincide exactly with a K-Means cluster center"]},"r-m4-062":{"q":"What characterizes a 'Border Point' (Density-reachable) in DBSCAN?","correct":"It lies within the eps radius of a core point but does not itself have enough MinPts neighbors","wrong":["It has more than MinPts neighbors but lies outside the eps radius of every core point","It belongs to no cluster and is always assigned the label -1","It is the point with the smallest distance to the cluster center in the entire dataset"]},"r-m4-063":{"q":"In scikit-learn, which label value does the `DBSCAN` algorithm assign to represent noise data points?","correct":"Label -1","wrong":["Label 0","Label 99","Label None"]},"r-m4-064":{"q":"What are the two most important hyperparameters to set when instantiating `DBSCAN(eps=0.5, min_samples=5)`?","correct":"The neighborhood radius `eps` and the minimum number of points in the neighborhood `min_samples` (MinPts)","wrong":["The number of clusters `n_clusters` and the linkage method `linkage`","The window size `bandwidth` and the number of principal components `n_components`","The regularization parameter `C` and the loss function `loss`"]},"r-m4-065":{"q":"On what mechanism does the Mean-Shift Clustering algorithm operate?","correct":"It searches for the regions of highest data density (modes) by shifting the center of a window toward higher density until convergence","wrong":["It minimizes the SSE loss function by updating weights according to first-order derivatives","It splits the data into spherical clusters by assigning points to the nearest cluster center","It gradually merges data points from the bottom to the top of the Dendrogram hierarchy"]},"r-m4-066":{"q":"What is a prominent advantage of the Mean-Shift clustering algorithm?","correct":"It does not require declaring the number of clusters K in advance and can find clusters of uneven sizes","wrong":["It processes extremely fast on datasets of millions of samples","It is completely independent of any window-size hyperparameter","It can work effectively with any nonlinear distance metric"]},"r-m4-067":{"q":"What is a major disadvantage of the Mean-Shift algorithm mentioned in the material?","correct":"It runs slowly on large data and depends heavily on the 'bandwidth' parameter (window size)","wrong":["It forces the user to accurately guess the initial number of clusters K","It cannot find clusters of different sizes and densities","It automatically transforms all target labels into continuous variables"]},"r-m4-068":{"q":"Which scikit-learn function is used to automatically estimate the window size (bandwidth) parameter for Mean-Shift?","correct":"`estimate_bandwidth(X, quantile=0.2)`","wrong":["`find_optimal_k(X)`","`calculate_inertia(X)`","`get_eps_radius(X)`"]},"r-m4-069":{"q":"When working with an extremely large dataset and needing a very fast clustering algorithm, which method is the most suitable choice?","correct":"K-Means","wrong":["Hierarchical Clustering","Mean-Shift","DBSCAN with multiple density levels"]},"r-m4-070":{"q":"What is the computational complexity drawback of Hierarchical Clustering when processing large datasets?","correct":"It runs slowly on large data because its computational complexity reaches O(N^2) and K must be chosen to cut the tree","wrong":["It can only find clusters of arbitrary winding shapes and is sensitive to eps","It cannot visually represent the clustering process with a Dendrogram","It must initialize cluster centers using the smart K-Means++ technique"]},"r-m4-071":{"q":"What is the main disadvantage of the DBSCAN algorithm in the overall comparison among clustering algorithms?","correct":"It is sensitive to the eps parameter and performs poorly on clusters with different densities","wrong":["It forces the user to know in advance and precisely declare the number of clusters K","It can only detect clusters of symmetric spherical shape","It has no ability to automatically detect and filter out noise data points"]},"r-m4-072":{"q":"Which of the following is a limitation of the Mean-Shift algorithm compared with other clustering algorithms?","correct":"It runs slowly and uses only Euclidean distance","wrong":["It is effective only on spherical clusters and requires knowing the number of clusters K in advance","Its computational complexity is O(N^2) and it must cut the hierarchy tree","It is very sensitive to the eps parameter and cannot detect noise points"]}},"confuse":[]};

var KEY=SJ.key,canSave=true,P;

function hydrate(o){var r=Object.assign(blank(),o||{});r.settings=Object.assign(blank().settings,(o&&o.settings)||{});return r;}
function load(){try{var s=localStorage.getItem(KEY);P=hydrate(s?JSON.parse(s):null);localStorage.setItem(KEY+'_p','1');localStorage.removeItem(KEY+'_p');}catch(e){if(!P)P=blank();canSave=false;}}

function banner(){var b=$('#banner');if(b){b.style.display='block';b.innerHTML='Trình duyệt đang chặn lưu trữ — tiến độ chỉ giữ trong phiên này. <a href="#" id="bnExp">Xuất file sao lưu</a>';$('#bnExp').onclick=function(e){e.preventDefault();exportData();};}}

// ---------- stats ----------
function modAcc(m){var r=P.recent[m]||[];return r.length?r.reduce(function(a,b){return a+b;},0)/r.length:null;}
function overallAcc(){var s=0,n=0;D.modules.forEach(function(m){(P.recent[m.id]||[]).forEach(function(v){s+=v;n++;});});return n?s/n:0;}
function coverage(){return Object.keys(P.answers).filter(function(k){return ALLQ_ID[k];}).length/ALLQ.length;}
function lastExam(){return P.exams[P.exams.length-1]||null;}
function readiness(){var le=lastExam();return Math.round(100*(0.6*overallAcc()+0.25*coverage()+0.15*(le?le.score/10:0)));}
function mistakeIds(){return Object.keys(P.mistakes).filter(function(k){return QMAP[k];});}
function daysLeft(){return P.settings.examDate?diffDays(today(),P.settings.examDate):null;}
function barClass(v){return v==null?'':v<0.5?'red':v<0.8?'yellow':'green';}
function weakest(){
  var list=QMODS.slice().map(function(m){var a=modAcc(m.id),n=(P.recent[m.id]||[]).length;return {m:m,score:(a==null?-1:(n<10?a-0.3:a))-m.priority*0.02};});
  list.sort(function(a,b){return a.score-b.score;});return list[0].m;
}
// ---------- ghi nhật ký hoạt động (chỉ khi chạy trên web có tài khoản; quản trị viên được cấp quyền mới xem được) ----------
var TRK={q:[],t:0};
function track(type,detail){
  if(!window.AI_SERVER||!SJ||!SJ.id)return;
  TRK.q.push({type:type,ts:Date.now(),detail:detail||{}});if(TRK.q.length>200)TRK.q.shift();
  clearTimeout(TRK.t);TRK.t=setTimeout(trackFlush,TRK.q.length>=20?200:6000);
}
function trackFlush(){
  if(!TRK.q.length)return;var ev=TRK.q.splice(0,40);
  try{fetch('/api/event',{method:'POST',credentials:'same-origin',keepalive:true,headers:{'content-type':'application/json','x-requested-with':'ssg-web'},body:JSON.stringify({subject:SJ.id,events:ev})}).then(function(r){if(!r.ok&&r.status>=500)TRK.q=ev.concat(TRK.q);}).catch(function(){TRK.q=ev.concat(TRK.q).slice(-200);});}catch(e){}
  if(TRK.q.length){clearTimeout(TRK.t);TRK.t=setTimeout(trackFlush,1500);}
}
addEventListener('pagehide',trackFlush);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')trackFlush();});
// Đo thời gian đọc lý thuyết (chỉ tính khi đang xem bài, tab hiển thị và có thao tác trong 2,5 phút gần nhất (đọc chữ thường không đụng chuột)) → điểm bảng xếp hạng
var RT={sec:0,mod:'',act:Date.now()};
['mousemove','keydown','scroll','touchstart','pointerdown','wheel'].forEach(function(ev){addEventListener(ev,function(){RT.act=Date.now();},{passive:true,capture:true});});
function rtFlush(){if(RT.sec>=5){track('read_time',{mod:RT.mod,secs:Math.min(120,RT.sec)});}RT.sec=0;}
setInterval(function(){
  var m=/^#\/learn\/([^?\/]+)/.exec(location.hash||'');
  if(m&&document.visibilityState==='visible'&&Date.now()-RT.act<150000){if(RT.mod&&RT.mod!==m[1])rtFlush();RT.mod=m[1];RT.sec+=5;if(RT.sec>=30)rtFlush();}
  else if(RT.sec)rtFlush();
},5000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')rtFlush();});
function record(q,ok,quiet){
  if(!quiet)track('quiz_answer',{id:q.id,ok:!!ok,src:q.bank?'bank':(q.type||'q'),mod:q.module||'',ref:q.ref||'',retry:q._retry||0});
  var a=P.answers[q.id]||(P.answers[q.id]={seen:0,correct:0});a.seen++;if(ok)a.correct++;a.lastOk=ok;
  var r=P.recent[q.module]||(P.recent[q.module]=[]);r.push(ok?1:0);if(r.length>20)r.splice(0,r.length-20);
  var m=P.mistakes[q.id];
  if(!ok){m=m||{wrong:0,streak:0};m.wrong++;m.streak=0;P.mistakes[q.id]=m;}
  else if(m){m.streak++;if(m.streak>=2)delete P.mistakes[q.id];}
  save();
}

function runQuiz(list,title,back,lang,resume){
  list=list.slice();var HIST=new Map(),i=0,score=0,wrong=[],base=list.length,seen={},fixed=0,t0=Date.now(),spent=0,qkey=title+'|'+back;
  if(resume){i=Math.min(resume.i||0,list.length);score=resume.score||0;fixed=resume.fixed||0;seen=resume.seen||{};spent=resume.spent||0;base=resume.base||list.length;wrong=(resume.wrong||[]).map(function(id){return QMAP[id];}).filter(Boolean);}
  function persist(ix){try{P.quiz={key:qkey,title:title,back:back,lang:lang,items:list.map(function(q){return [q.id,q._retry||0];}),i:ix,score:score,fixed:fixed,seen:seen,base:base,wrong:wrong.map(function(q){return q.id;}),spent:spent+Math.round((Date.now()-t0)/1000),at:Date.now()};save();}catch(e){}}lang=localStorage.getItem('ui_qlang')||lang||plang();
  function show(){
    if(i>=list.length)return done();
    persist(i);
    var q=list[i],t=T(q,lang),answered=false,sel=[],tv=(q.bank&&lang==='vi'&&q.vi)?q.vi:null;
    function od(o){return tv?(tv.options[(q.orig||[]).indexOf(o)]||o):o;}
    // q.orig: câu có sẵn danh sách đáp án gốc (đề kì trước, bộ đề); q.keep: giữ nguyên thứ tự (có "All of the above"…)

    var opts=rec0?rec0.opts:q.orig?(q.keep?q.orig.slice():shuffle(q.orig)):shuffle([t.correct].concat(t.wrong));
    var good=q.answers||[t.correct],multi=good.length>1;
    var head=q.bank?esc(q.topic):(q.type==='recall'||q.type==='key'?'§'+q.ref+' '+esc(secTitle(q.ref)):esc(MOD[q.module].title));

function mdInline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');}
function mdInline2(s){
  return s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g,'$1<i>$2</i>').replace(/~~(.+?)~~/g,'<s>$1</s>')

function mdLite(src){

    return '\n'+hold('<div class="cb"><div class="cb-h"><span>'+esc(lang||'code')+'</span><button type="button" class="cb-copy">Chép</button></div><pre><code>'+esc(code.replace(/\n$/,''))+'</code></pre></div>')+'\n';});

    .replace(/\\\[([\s\S]+?)\\\]/g,function(_,t){return '\n'+mj(t,true)+'\n';})

  while(i<lines.length){
    var ln=lines[i],m;
    if(!ln.trim()){i++;continue;}

    if((m=ln.match(/^\s*(#{1,4})\s+(.*)/))){var lv=Math.min(4,m[1].length+1);out.push('<h'+lv+' class="md-h">'+inl(m[2])+'</h'+lv+'>');i++;continue;}
    if(/^\s*\|.*\|\s*$/.test(ln)&&i+1<lines.length&&/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i+1])){

        else{while(stack.length<ind+1){html+='<'+tag+'>';stack.push(tag);}}

    }
    var para=[];
    while(i<lines.length&&lines[i].trim()&&!/^\s*(#{1,4}\s|>|([-*•]|\d+[.)])\s+|\|.*\||-{3,}\s*$)/.test(lines[i])){para.push(lines[i]);i++;}

    out.push('<p>'+para.map(inl).join('<br>')+'</p>');
  }

function copyText(text){var ta=document.createElement('textarea');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';ta.value=text;document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();if(!ok&&navigator.clipboard)navigator.clipboard.writeText(text).then(function(){},function(){});return ok;}

// Trích nội dung mục lý thuyết liên quan để AI bám sát tài liệu môn
function secText(ref){var m=MOD[modOfRef(ref)];if(!m)return '';var s=m.sections.filter(function(x){return x.id===ref;})[0];if(!s)return '';
  var d=document.createElement('div');d.innerHTML=s.h.replace(/<\/(li|p|tr|h\d)>/g,'\n</$1>');return ('§'+s.id+' '+s.t+'\n'+d.textContent.replace(/\n\s*\n+/g,'\n').trim()).slice(0,1800);}
/** ctx: {lang, opts: các đáp án theo thứ tự đang hiện, picked: đáp án đã chọn (hoặc null), answered} */
function aiPrompt(q,ctx){
  var t=T(q,ctx.lang),hint=!ctx.answered,good=q.answers||[t.correct];
  var letters=function(arr){return arr.map(function(x){return L[ctx.opts.indexOf(x)];}).filter(Boolean).sort().join(', ');};
  var ans=letters(good),mine=ctx.picked!=null?letters([].concat(ctx.picked)):'';
  return [
    'Đây là một câu trắc nghiệm môn '+SJ.aiField+'.'+(hint?'':' Đáp án trong app CÓ THỂ BỊ SAI.'),
    q.past?'Câu này lấy từ đề thi kì trước; đề không kèm đáp án nên đáp án trong app do người soạn tự xác định.':null,
    q.bank?'Câu này lấy từ bộ đề ôn tập '+SJ.name+' do sinh viên tổng hợp ('+q.section+'); đáp án trong bộ đề có thể sai.':null,
    good.length>1?'Câu này chọn '+good.length+' đáp án.':null,
    hint?'Tôi đang tự làm câu này. ĐỪNG nói thẳng đáp án: hãy gợi ý kiến thức cần dùng và hướng suy luận để tôi tự chọn. Chỉ nói đáp án khi tôi xin. Trả lời ngắn gọn bằng tiếng Việt.'
        :'Hãy tự giải độc lập trước, sau đó so với đáp án trong app và kết luận rõ: ĐÚNG hay SAI (nếu sai thì đáp án đúng là gì). Giải thích ngắn gọn bằng tiếng Việt.',
    '','Câu hỏi:',t.q,''
  ].concat(ctx.opts.map(function(o,i){return L[i]+'. '+o;})).concat([
    '',
    hint?null:'Đáp án trong app: '+ans,
    !hint&&mine&&mine!==ans?'Tôi đã chọn: '+mine:null,
    hint?null:(q.explain?'Giải thích trong app: '+q.explain:null),
    q.ref?'\nTrích tài liệu môn liên quan:\n'+secText(q.ref):null
  ]).filter(function(x){return x!=null;}).join('\n');
}

      '<p class="muted small" style="margin:6px 0 8px">Key chỉ lưu trong trình duyệt này, không nằm trong file HTML – gửi file cho bạn bè không lộ key.</p>'+

    function sync(){var off=$('#aiprov',box).value==='anthropic';$('#aibasef',box).hidden=$('#aimodtf',box).hidden=off;$('#aimodf',box).hidden=!off;

    function save(){
      var k=$('#aikey',box).value.trim(),p=$('#aiprov',box).value,off=p==='anthropic',base=$('#aibase',box).value.trim(),mt=$('#aimodt',box).value.trim();
      if(!k)return $('#aikey',box).focus();

        if(old.provider!==next.provider||old.base!==next.base||old.model!==next.model)Object.keys(aiChats).forEach(function(id){if(!aiChats[id].busy)aiChats[id].msgs=[];});

      '<div class="ai-log" aria-live="polite"></div><div class="ai-chips"></div>'+
      '<div class="att-bar" id="aiAtt" hidden></div><div class="ai-compose"><button class="iconbtn att-btn" id="aiAt" type="button" title="Đính kèm ảnh, PDF hoặc tệp văn bản" aria-label="Đính kèm">'+ic('clip')+'</button><input type="file" id="aiFile" multiple hidden accept="'+ATT_ACCEPT+'"><textarea class="ai-input" rows="1" placeholder="Hỏi thêm về câu này…"></textarea><button class="btn sm" id="aistop" hidden>■ Dừng</button><button class="ai-send" id="aisend" aria-label="Gửi">'+ic('arrow')+'</button></div>'+
      '<div class="ai-foot small muted"><span><kbd>Enter</kbd> gửi · <kbd>Shift</kbd>+<kbd>Enter</kbd> xuống dòng</span><span>Hội thoại mất khi tải lại trang</span></div>';
    var log=$('.ai-log',box),input=$('.ai-input',box),chips=$('.ai-chips',box);input.value=chat.draft||'';
    function grow(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px';}
    input.oninput=function(){chat.draft=input.value;grow();};
    input.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}if(e.key==='Escape')input.blur();};
    attBind(chat,{btn:$('#aiAt',box),input:$('#aiFile',box),bar:$('#aiAtt',box),box:box,ta:input});
    $('#aistop',box).onclick=function(){if(chat.ctrl)chat.ctrl.abort();};
    $('#aisend',box).onclick=function(){send();};
    $('#aiclr',box).onclick=function(){if(!chat.busy){chat.msgs=[];chat.err=null;chat.retry=null;draw();}};
    if($('#aicfg',box))$('#aicfg',box).onclick=function(){show(true);};
    function ask(t,shown,restore){aiAsk(chat,chat.msgs.length?t:aiPrompt(q,getCtx())+'\n\nCâu hỏi của tôi: '+t,shown||t,restore);}
    function send(t){t=(t||input.value).trim();if((!t&&!(chat.att&&chat.att.length))||chat.busy||chat.attBusy)return;if(!t)t='Hãy xem giúp tôi phần đính kèm này.';input.value='';chat.draft='';grow();ask(t,t,true);}
    function bubble(m,i){
      var asst=m.role==='assistant';
      return '<div class="ai-msg '+m.role+'">'+(asst?'<span class="ai-badge xs">'+ic('spark')+'</span>':'')+'<div class="ai-bub"><div class="ai-msg-text">'+(asst?mdLite(m.shown):esc(m.shown)+attHtml(m))+'</div>'+
        (asst?'<div class="ai-msg-meta"><span>'+esc(m.meta||'')+'</span><button class="link-btn" data-copy="'+i+'">Chép</button></div>':'')+'</div></div>';
    }

      var hint=!getCtx().answered;
      log.innerHTML=(!chat.msgs.length&&!chat.busy&&!chat.err?'<div class="ai-empty">'+(hint
          ?'Bạn đang làm câu này nên AI chỉ <b>gợi ý</b>, không nói đáp án. Chọn một gợi ý bên dưới hoặc tự gõ câu hỏi.'
          :'AI sẽ tự giải độc lập rồi đối chiếu với đáp án trong app. Bấm <b>Kiểm tra đáp án</b> hoặc hỏi bất kỳ điều gì về câu này.')+'</div>':'')+
        chat.msgs.map(bubble).join('')+
        (chat.busy?'<div class="ai-msg assistant pending"><span class="ai-badge xs">'+ic('spark')+'</span><div class="ai-bub"><div class="ai-msg-text">'+(chat.partial?mdLite(chat.partial):'<span class="typing"><i></i><i></i><i></i></span>')+'</div></div></div>':'')+
        (chat.err?'<div class="ai-err"><span>'+esc(chat.err)+'</span>'+(chat.retry?'<button class="btn sm" id="airetry">Thử lại</button>':'')+'</div>':'');
      var list=(chat.msgs.length?[]:[hint?'Gợi ý cách làm':'Kiểm tra đáp án']).concat(hint?AI_CHIPS_HINT.slice(1):AI_CHIPS_CHECK);
      chips.innerHTML=chat.busy?'':list.map(function(c,k){return '<button class="ai-chip" data-chip="'+k+'">'+esc(c)+'</button>';}).join('');
      $$('[data-chip]',chips).forEach(function(b){b.onclick=function(){var c=list[+b.dataset.chip];
        if(!chat.msgs.length&&+b.dataset.chip===0)aiAsk(chat,aiPrompt(q,getCtx()),hint?'Gợi ý giúp tôi cách làm câu này (chưa nói đáp án).':'Kiểm tra giúp tôi đáp án câu này.',false);
        else ask(c);};});
      $$('[data-copy]',log).forEach(function(b){b.onclick=function(){copyText(chat.msgs[+b.dataset.copy].shown);b.textContent='Đã chép';setTimeout(function(){b.textContent='Chép';},1500);};});
      if($('#airetry',log))$('#airetry',log).onclick=function(){var r=chat.retry;chat.retry=null;chat.err=null;if(r)aiAsk(chat,r.text,r.shown,true);};
      $('#aisend',box).disabled=chat.busy;$('#aistop',box).hidden=!chat.busy;$('#aiclr',box).hidden=!chat.msgs.length;
      if(!chat.busy&&chat.draft&&!input.value){input.value=chat.draft;grow();}

    }
    chat.view=function(){if(log.isConnected)draw();};draw();grow();
  }
  show(false);
}
/** Trả lời xong 1 câu: đã cài chatbot + bật tự động thì mở chat và nhờ AI đối chiếu (mỗi câu 1 lần) */

// ---------- Dịch Anh → Việt ----------
function googleTr(text){return 'https://translate.google.com/?sl=en&tl=vi&op=translate&text='+encodeURIComponent(text.slice(0,4000));}
async function aiTranslate(text,onDelta){var r=await aiStream({msgs:[{role:'user',content:text}]},function(b){if(onDelta)onDelta(blocksText(b));},{system:TR_SYSTEM,effort:'low'});
  if(r.stop==='refusal')throw new Error('AI từ chối dịch đoạn này.');return blocksText(r.blocks).trim();}
var trState={};
/** Khung dịch cho câu đang hiện bằng tiếng Anh. Câu trong ngân hàng: dùng sẵn bản tiếng Việt (miễn phí);
    câu đề kì trước: nhờ AI dịch (lưu lại), chưa cài chatbot thì mở Google Dịch. opts = đáp án tiếng Anh theo thứ tự đang hiện. */
function trToggle(el,btn,q,opts){
  var st=trState[q.id]||(trState[q.id]={});
  if(st.open){st.open=false;el.innerHTML='';btn.textContent='Dịch';return;}
  var en=T(q,'en'),srcEn=[en.correct].concat(en.wrong),srcVi=[q.correct].concat(q.wrong);
  if(q.en&&!q.past){st.open=true;btn.textContent='Ẩn bản dịch';
    el.innerHTML='<div class="tr-box"><b>Bản tiếng Việt</b><div>'+qhtml(q.q)+'</div><ol class="tr-opts">'+opts.map(function(o,i){return '<li><b>'+L[i]+'.</b> '+esc(srcVi[srcEn.indexOf(o)]||o)+'</li>';}).join('')+'</ol></div>';return;}
  var full=[q.q].concat(q.orig).join('\n'),cached=TrCache.get()[q.id];
  if(!cached&&!AiCfg.get().key){window.open(googleTr(full),'_blank','noopener');return;}
  st.open=true;btn.textContent='Ẩn bản dịch';
  function paint(raw,loading,err){
    var p=raw&&trParse(raw);
    el.innerHTML='<div class="tr-box"><div class="row between"><b>Bản dịch</b><a class="small" href="'+googleTr(full)+'" target="_blank" rel="noopener">Google Dịch '+ic('ext')+'</a></div>'+
      (err?'<div class="ai-err">'+esc(err)+'</div>':loading?'<div class="muted">'+esc((raw||'Đang dịch…').replace(/<<\s*(Q|\d+)\s*>>\s*/g,''))+'</div>':
      p?'<div>'+qhtml(p.q)+'</div><ol class="tr-opts">'+opts.map(function(o,i){return '<li><b>'+L[i]+'.</b> '+esc(p.opts[q.orig.indexOf(o)]||o)+'</li>';}).join('')+'</ol>':'<div>'+qhtml(raw)+'</div>')+'</div>';
  }
  if(cached)return paint(cached);
  paint('',true);

function trOnSelect(e){

    var range=sel.getRangeAt(0),node=range.commonAncestorContainer,host=node.nodeType===1?node:node.parentElement;
    if(!host||!host.closest('#content')||host.closest('input,textarea,select,.ai-log,.tr-box,.tr-pop'))return;
    if(host.closest('.dock'))return;
    var viet=/[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i.test(text);
    if(text.length>=3&&(viet||text.length>1500)&&text.length<=3000){askPopShow(text,range.getBoundingClientRect());return;}
