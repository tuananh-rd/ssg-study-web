n the minority class?","options":["Reducing the number of trees to avoid overfitting to the majority class.","Selecting only features with low correlation before training the forest.","Using a smaller bootstrap sample size for each tree to focus more on the minority class.","Applying class weighting to penalize misclassifications of the minority class more heavily."],"answer":[3],"explanation":"Class Weight giúp Random Forest chú ý nhiều hơn đến lớp thiểu số bằng cách phạt nặng hơn các lỗi phân loại sai lớp thiểu số."},{"id":209,"slide":223,"topic":"Dữ liệu mất cân bằng","section":"Câu dài","question":"What potential issues might arise when removing samples from the majority class in the case of downsampling?","options":["Increased model interpretability","Improved model convergence","Loss of valuable information and representation of the majority class","Reduced overfitting risk"],"answer":[2],"explanation":"Downsampling giúp cân bằng dữ liệu nhưng có thể làm mất nhiều thông tin quan trọng và giảm khả năng đại diện của lớp đa số."},{"id":210,"slide":224,"topic":"Clustering & khoảng cách","section":"Câu dài","question":"Why is it important to scale the features before applying K-Means clustering?","options":["Because K-Means relies on Euclidean distance, and features with larger scales can dominate the clustering result.","Because K-Means automatically normalizes distances internally, and scaling prevents this behavior.","Because K-Means performs better when categorical variables are encoded as large numerical values.","Because K-Means uses only feature rankings, and scaling helps preserve the order of features."],"answer":[0],"explanation":"K-Means dựa trên khoảng cách Euclid, các đặc trưng có thang đo lớn sẽ chi phối kết quả phân cụm. Chuẩn hóa giúp mọi đặc trưng có mức độ ảnh hưởng tương đương khi tính khoảng cách."},{"id":211,"slide":225,"topic":"Clustering & khoảng cách","section":"Câu dài","question":"What is the difference between single linkage and complete linkage in hierarchical agglomerative clustering?","options":["Single linkage measures the maximum distance between clusters, while complete linkage measures the minimum distance","Single linkage measures the minimum distance between the closest points in different clusters, while complete linkage measures the maximum distance","Single linkage takes the average distance between clusters, while complete linkage takes the median distance","Single linkage computes the centroid of clusters, while complete linkage computes the medoid"],"answer":[1],"explanation":"Single Linkage đo khoảng cách nhỏ nhất giữa hai điểm gần nhau nhất của hai cụm, còn Complete Linkage đo khoảng cách lớn nhất giữa hai cụm."},{"id":212,"slide":226,"topic":"Clustering & khoảng cách","section":"Câu dài","question":"What is the purpose of the linkage parameter in AgglomerativeClustering?","options":["It specifies the number of clusters to form","It determines the distance metric used to measure the similarity between clusters","It controls how the distance between clusters is calculated during merging","It adjusts the tolerance for merging clusters based on their proximity"],"answer":[2],"explanation":"Tham số linkage xác định cách tính khoảng cách giữa các cụm trong quá trình gộp cụm. Các lựa chọn phổ biến gồm single, complete, average và ward."},{"id":213,"slide":227,"topic":"Giảm chiều (PCA, MDS…)","section":"Câu dài","question":"How does PCA handle missing values in the input data?","options":["It imputes missing values using the mean of the feature column","It ignores missing values during the computation of principal components","It replaces missing values with zeros before computation","It imputes missing values using linear interpolation"],"answer":[0],"explanation":"Trong thực tế, PCA không xử lý trực tiếp dữ liệu thiếu; thông thường cần điền khuyết (imputation) trước khi áp dụng PCA, và phương pháp phổ biến là thay bằng giá trị trung bình của cột."}],"topicMod":{"Phân loại (Logistic…)":"m2","Đánh giá mô hình (metrics)":"m2","SVM":"m2","KNN & Decision Tree":"m3","Ensemble (RF, Bagging, Boosting)":"m4","Dữ liệu mất cân bằng":"m4","Clustering & khoảng cách":"m4","Giảm chiều (PCA, MDS…)":"m4","EDA & Xử lý dữ liệu":"m1","Train/test & Cross-validation":"m1","Tổng quan AI / ML":"m1","Regularization & Overfitting":"m1","Hồi quy tuyến tính & đa thức":"m1","Thống kê & suy luận":"m1"},"xl":{"b-1":{"q":"Bạn đang đánh giá một bộ phân loại nhị phân (binary classifier). Có 80 kết quả dương tính trong dữ liệu kiểm thử và tổng cộng 150 quan sát. Sử dụng ngưỡng 50%, bộ phân loại dự đoán 60 kết quả dương tính, trong đó có 20 kết quả không chính xác.\nĐộ chính xác (Precision) của bộ phân loại trên mẫu kiểm thử là bao nhiêu?","options":["50%","33.3%","66.7%","37.5%"]},"b-2":{"q":"Bạn đang đánh giá một bộ phân loại nhị phân (binary classifier). Có 80 kết quả dương tính trong dữ liệu kiểm thử và tổng cộng 150 quan sát. Sử dụng ngưỡng 50%, bộ phân loại dự đoán 60 kết quả dương tính, trong đó có 20 kết quả không chính xác.\nĐiểm F1 (F1 score) của bộ phân loại trên mẫu kiểm thử là bao nhiêu?","options":["75%","57.2%","67.5%","42.8%"]},"b-3":{"q":"Bạn đang đánh giá một bộ phân loại nhị phân (binary classifier). Có 80 kết quả dương tính trong dữ liệu kiểm thử và tổng cộng 150 quan sát. Sử dụng ngưỡng 50%, bộ phân loại dự đoán 60 kết quả dương tính, trong đó có 20 kết quả không chính xác.\nĐộ thu hồi (Recall) của bộ phân loại trên mẫu kiểm thử là bao nhiêu?","options":["66.7%","37.5%","50%","33.3%"]},"b-4":{"q":"Tại sao EDA (Exploratory Data Analysis - Phân tích khám phá dữ liệu) lại hữu ích?","options":["EDA cho phép chúng ta có được cảm nhận ban đầu về dữ liệu.","Nó cho phép chúng ta xác định xem dữ liệu có hợp lý hay không, hoặc liệu có cần làm sạch thêm hay cần thêm dữ liệu không.","EDA không giúp xác định các mẫu hình và xu hướng trong dữ liệu.","Không có phương án nào ở trên"]},"b-5":{"q":"Có một số cơ sở dữ liệu SQL có sẵn như là","options":["MySQL","PostgreSQL","MongoDB","Cassandra"]},"b-6":{"q":"Dữ liệu dưới đây xuất hiện trong 'data.txt', và Pandas đã được import.\n63.03 22.55 39.61 40.48 98.67 -0.25 AB\n39.06 10.06 25.02 29 114.41 4.56 AB\n68.83 22.22 50.09 46.61 105.99 -3.53 AB\nLàm thế nào chúng ta có thể sử dụng Pandas để nhập dữ liệu này vào một data frame?","options":["pandas.read_csv('data.txt', header=None, sep=\",\")","pandas.read_csv('data.txt')","pandas.read_csv('data.txt', delim_whitespace=True)","pandas.read_csv('data.txt', header=0, delim_whitespace=True)"]},"b-7":{"q":"Dữ liệu dưới đây xuất hiện trong 'data.txt', và Pandas đã được import. Lệnh Python nào sẽ đọc chính xác dữ liệu này vào một Pandas DataFrame?\n63.03 22.55 39.61 40.48 98.67 -0.25 AB\n39.06 10.06 25.02 29 114.41 4.56 AB\n68.83 22.22 50.09 46.61 105.99 -3.53 AB","options":["pandas.read('data.txt')","pandas.read_csv('data.txt', header=None, sep=',')","pandas.read_csv('data.txt', delim_whitespace=True)","pandas.read_csv('data.txt', header=0, delim_whitespace=True)"]},"b-8":{"q":"Chọn phương án có cú pháp để thu được các phần chia tách dữ liệu cần thiết nhằm huấn luyện một mô hình có tập kiểm thử (test split) bằng một phần ba kích thước dữ liệu hiện có.","options":["X_train, X_test, y_train, y_test = train_test_split(x, y, test_size=0.5)","X_train, X_test, y_train, y_test = train_test_split(x, y, test_size=0.33)","X_train, y_test = train_test_split(x, y, test_size=0.33)","X_train, y_test = train_test_split(x, y, test_size=0.5)"]},"b-9":{"q":"Phát biểu nào sau đây về giảm mẫu (Downsampling) là ĐÚNG?","options":["Giảm mẫu có khả năng làm giảm Recall.","Giảm mẫu có khả năng làm giảm Precision.","Giảm mẫu bảo toàn tất cả các quan sát ban đầu.","Giảm mẫu dẫn đến việc tập trung quá mức vào lớp xuất hiện thường xuyên hơn."]},"b-10":{"q":"Phương pháp mô hình hóa kết hợp (Ensemble modeling) nào sau đây KHÔNG phải là trường hợp đặc biệt của việc lấy trung bình mô hình (model averaging)?","options":["Các phương pháp Rừng ngẫu nhiên (Random Forest)","Các phương pháp Boosting","Phương pháp Pasting của gom tập Bootstrap (Bootstrap aggregation)","Phương pháp Bagging của gom tập Bootstrap (Bootstrap aggregation)"]},"b-11":{"q":"Điều nào sau đây KHÔNG phải là một đặc điểm của thuật toán k láng giềng gần nhất (k nearest neighbors)?","options":["Nó tự xác định giá trị cho k.","Nó nhạy cảm với việc co giãn tỉ lệ (scaling).","Nó xác định các ranh giới quyết định (decision boundaries) để đưa ra dự đoán.","Nó rất phù hợp để dự đoán các biến có nhiều lớp (multiple classes)."]},"b-12":{"q":"Ví dụ nào sau đây KHÔNG phải là một trường hợp sử dụng phổ biến của phân cụm (clustering) trong thế giới thực?","options":["Phát hiện bất thường (Anomaly detection).","Phân khúc khách hàng (Customer segmentation)","Xác định yếu tố rủi ro và các yếu tố phòng ngừa cho các bệnh như loãng xương","Cải thiện học có giám sát (supervised learning)."]},"b-13":{"q":"Lựa chọn nào sau đây KHÔNG phải là một ví dụ về học không giám sát (Unsupervised Learning)?","options":["Phân khúc khách hàng thành các nhóm khác nhau.","Giảm kích thước của một tập dữ liệu mà không làm mất quá nhiều thông tin từ tập dữ liệu ban đầu.","Giải thích mối quan hệ giữa thu nhập của một cá nhân và số tiền họ chi trả cho một chiếc ô tô.","Gom nhóm các quan sát lại với nhau để tìm ra các mẫu hình tương đồng giữa chúng."]},"b-14":{"q":"Phương án nào sau đây KHÔNG phải là một cách tiếp cận khám phá dữ liệu hợp lệ để xác định mức độ sẵn sàng của dữ liệu cho việc lập mô hình?","options":["Tạo bản đồ nhiệt tương quan (correlation heatmap) để xác nhận dấu và độ lớn của tương quan giữa các đặc trưng.","Tạo biểu đồ ô (panel plot) hiển thị các phân phối cho biến phụ thuộc và biểu đồ phân tán cho tất cả các biến độc lập.","Huấn luyện một mô hình và xác định các quan sát có phần dư (residuals) lớn nhất.","Tạo các trực quan hóa cho biểu đồ phân tán (scatter plots), biểu đồ tần suất (histograms), biểu đồ hộp (box plots) và biểu đồ lục giác (hexbin plots)."]},"b-15":{"q":"Trong trường hợp nào sau đây bạn sẽ KHÔNG sử dụng học máy có giám sát (supervised machine learning)?","options":["Phân khúc khách hàng theo đặc điểm nhân khẩu học của họ.","Dự đoán số lượng khách hàng sẽ ghé thăm một cửa hàng trong một tuần nhất định.","Dự đoán xác suất một khách hàng quay lại cửa hàng.","Giải thích các yếu tố chính quyết định việc một khách hàng có quay lại cửa hàng hay không."]},"b-16":{"q":"Phát biểu nào sau đây về sai số của mô hình là ĐÚNG?","options":["Hiện tượng dưới khớp (Underfitting) có đặc trưng là sai số thấp hơn ở cả mẫu huấn luyện và mẫu kiểm thử.","Hiện tượng dưới khớp (Underfitting) có đặc trưng là sai số cao hơn ở cả mẫu huấn luyện và mẫu kiểm thử.","Hiện tượng dưới khớp (Underfitting) có đặc trưng là sai số cao hơn ở mẫu huấn luyện và sai số thấp hơn ở mẫu kiểm thử.","Hiện tượng dưới khớp (Underfitting) có đặc trưng là sai số thấp hơn ở mẫu huấn luyện và sai số cao hơn ở mẫu kiểm thử."]},"b-17":{"q":"Phát biểu nào dưới đây về kiểm định chéo K lần (K-fold cross-validation) là ĐÚNG?","options":["Mỗi mẫu con trong kiểm định chéo K lần có ít nhất K quan sát.","Mỗi mẫu con trong kiểm định chéo K lần có ít nhất K-1 quan sát.","Mỗi mẫu con trong số K mẫu con của kiểm định chéo K lần đều được sử dụng làm tập huấn luyện.","Mỗi mẫu con trong số K mẫu con của kiểm định chéo K lần đều được sử dụng làm tập kiểm thử."]},"b-18":{"q":"Phát biểu nào sau đây về tăng mẫu tổng hợp (Synthetic Upsampling) là ĐÚNG?","options":["Tăng mẫu tổng hợp thường sẽ dẫn đến điểm F1 cao hơn.","Tăng mẫu tổng hợp sử dụng ít siêu tham số hơn so với Tăng mẫu ngẫu nhiên (Random Upsampling).","Tăng mẫu tổng hợp tạo ra các quan sát không thuộc về dữ liệu ban đầu.","Tăng mẫu tổng hợp dẫn đến việc tập trung quá mức vào lớp xuất hiện thường xuyên hơn"]},"b-19":{"q":"Phát biểu nào sau đây về độ phức tạp của mô hình là ĐÚNG?","options":["Độ phức tạp của mô hình cao hơn dẫn đến khả năng quá khớp (overfitting) thấp hơn.","Độ phức tạp của mô hình cao hơn dẫn đến khả năng quá khớp (overfitting) cao hơn.","Giảm số lượng đặc trưng đồng thời thêm các tương tác đặc trưng dẫn đến khả năng quá khớp thấp hơn.","Giảm số lượng đặc trưng đồng thời thêm các tương tác đặc trưng dẫn đến khả năng quá khớp cao hơn."]},"b-20":{"q":"Phát biểu nào về máy vectơ hỗ trợ (Support Vector Machines) là ĐÚNG?","options":["Các mô hình Máy vectơ hỗ trợ là phi tuyến tính.","Các mô hình Máy vectơ hỗ trợ hiếm khi bị quá khớp (overfit) trên dữ liệu huấn luyện nếu sử dụng chuẩn hoá (regularization).","Các mô hình Máy vectơ hỗ trợ có thể dùng cho phân loại nhưng không dùng được cho hồi quy.","Các mô hình Máy vectơ hỗ trợ có thể dùng cho hồi quy nhưng không dùng được cho phân loại."]},"b-21":{"q":"Phát biểu nào sau đây về các thuật toán học không giám sát (unsupervised algorithms) là ĐÚNG?","options":["Các thuật toán học không giám sát phù hợp khi chúng ta không có kết quả cần dự đoán và khi muốn chia nhỏ tập dữ liệu thành các nhóm nhỏ hơn.","Các thuật toán học không giám sát phù hợp khi chúng ta có kết quả cần dự đoán.","Các thuật toán học không giám sát thường được dùng để dự báo các mẫu hình theo thời gian như xu hướng thị trường chứng khoán hoặc dự báo doanh số.","Các thuật toán học không giám sát phù hợp trong các trường hợp đòi hỏi khả năng giải thích (explainability), ví dụ như so sánh tham số của mô hình này với mô hình khác."]},"b-22":{"q":"Phát biểu nào về Hồi quy Logistic (Logistic Regression) là ĐÚNG?","options":["Hồi quy Logistic là một mô hình tuyến tính tổng quát (generalized linear model).","Các mô hình Hồi quy Logistic chỉ có thể dự đoán các biến có 2 lớp.","Các mô hình Hồi quy Logistic có thể dùng cho phân loại (classification) nhưng không dùng cho hồi quy (regression).","Các mô hình Hồi quy Logistic không thể dùng cho cả hồi quy lẫn phân loại."]},"b-23":{"q":"Phát biểu nào về hàm read_csv của Pandas là ĐÚNG?","options":["Nó chỉ có thể đọc dữ liệu phân tách bằng dấu phẩy","Nó có thể đọc cả dữ liệu phân tách bằng tab và phân tách bằng dấu cách","Nó đọc dữ liệu vào một mảng NumPy 2 chiều","Nó chỉ cho phép một đối số: tên của tệp"]},"b-24":{"q":"Phát biểu nào sau đây về chính quy hóa (regularization) là ĐÚNG?","options":["Chính quy hóa luôn làm giảm số lượng đặc trưng (feature) được chọn.","Chính quy hóa làm tăng khả năng quá khớp (overfitting) so với dữ liệu huấn luyện.","Chính quy hóa làm giảm khả năng quá khớp (overfitting) so với dữ liệu huấn luyện.","Chính quy hóa thực hiện chọn đặc trưng (feature selection) mà không có tác động tiêu cực đến khả năng quá khớp so với dữ liệu huấn luyện."]},"b-25":{"q":"Phát biểu nào sau đây về một mô hình có độ phức tạp cao (high-complexity model) trong bối cảnh hồi quy tuyến tính (linear regression) là ĐÚNG?","options":["Kiểm định chéo (cross-validation) với k nhỏ sẽ giảm hoặc loại bỏ quá khớp (overfitting).","Phương sai cao của các ước lượng tham số giữa các mẫu con trong kiểm định chéo cho thấy nhiều khả năng đã xảy ra quá khớp.","Phương sai thấp của các ước lượng tham số giữa các mẫu con trong kiểm định chéo cho thấy nhiều khả năng đã xảy ra quá khớp.","Kiểm định chéo (cross-validation) với k lớn sẽ giảm hoặc loại bỏ quá khớp (overfitting)."]},"b-27":{"q":"Phát biểu nào sau đây về truy cập dữ liệu trên đám mây (cloud) bằng Pandas là ĐÚNG?","options":["Với read_csv, tệp trực tuyến phải được phân tách bằng dấu phẩy.","Hàm read_csv có thể đọc dữ liệu trực tiếp từ một trang web hoặc url.","Với read_csv, tệp đích phải có tên cột ở hàng đầu tiên.","Tệp đích ở xa phải được tải về máy cục bộ trước khi Pandas có thể đọc."]},"b-28":{"q":"Phát biểu nào sau đây về Lấy mẫu tăng ngẫu nhiên (Random Upsampling) là ĐÚNG?","options":["Random Upsampling giữ lại tất cả các quan sát gốc.","Random Upsampling nhìn chung sẽ dẫn đến điểm F1 cao hơn.","Random Upsampling tạo ra các quan sát không thuộc dữ liệu gốc.","Random Upsampling dẫn đến việc tập trung quá mức vào lớp xuất hiện thường xuyên hơn."]},"b-31":{"q":"Chọn phát biểu ĐÚNG về hàm chi phí (cost function) của SVM:","options":["SVM không dùng hàm chi phí. Chúng dùng chính quy hóa (regularization) thay cho hàm chi phí.","SVM dùng cùng hàm mất mát (loss function) như hồi quy logistic.","SVM dùng một hàm mất mát phạt các vectơ dễ bị phân loại sai.","SVM dùng hàm Hinge Loss làm hàm chi phí."]},"b-32":{"q":"Bạn đang đánh giá một bộ phân loại nhị phân (binary classifier). Có 50 kết quả dương tính trong dữ liệu kiểm tra và 100 quan sát. Với ngưỡng 50%, bộ phân loại dự đoán 40 kết quả dương tính, trong đó 10 kết quả sai.\nTăng ngưỡng lên 60% cho ra thêm 5 dự đoán dương tính, tất cả đều đúng. Phát biểu nào sau đây về mô hình mới này (so với mô hình gốc có ngưỡng 50%) là ĐÚNG?","options":["Điểm F1 của bộ phân loại sẽ giảm.","Diện tích dưới đường cong ROC (area under the ROC curve) sẽ giảm.","Điểm F1 của bộ phân loại sẽ không đổi.","Diện tích dưới đường cong ROC (area under the ROC curve) sẽ không đổi."]},"b-33":{"q":"Bạn đang đánh giá một bộ phân loại nhị phân (binary classifier). Có 50 kết quả dương tính trong dữ liệu kiểm tra và 100 quan sát. Với ngưỡng 50%, bộ phân loại dự đoán 40 kết quả dương tính, trong đó 10 kết quả sai.\nBây giờ ngưỡng được tăng thêm lên 70%. Phát biểu nào sau đây là ĐÚNG?","options":["Recall của bộ phân loại sẽ giảm.","Precision của bộ phân loại sẽ giảm.","Recall của bộ phân loại sẽ tăng hoặc không đổi.","Precision của bộ phân loại sẽ tăng hoặc không đổi."]},"b-34":{"q":"Phát biểu nào sau đây là SAI?","options":["Trong Góc nhìn giải tích (Analytic View), việc tăng các hình phạt L2/L1 buộc các hệ số nhỏ đi, giới hạn phạm vi hợp lý của chúng.","Theo cách diễn giải hình học (Geometric formulation), cực tiểu của hàm chi phí được tìm thấy tại giao điểm của biên hình phạt và một đường đồng mức của bề mặt hàm chi phí OLS truyền thống.","Theo cách diễn giải xác suất (Probabilistic formulation), chính quy hóa L2 (Ridge) áp đặt tiên nghiệm Gaussian (Gaussian prior) lên các hệ số, còn chính quy hóa L1 (Lasso) áp đặt tiên nghiệm Laplace (Laplacian prior).","Không có phát biểu nào trong số còn lại"]},"b-35":{"q":"Tất cả những điều sau đều là đặc điểm của SVM, NGOẠI TRỪ:","options":["Máy vectơ hỗ trợ (Support Vector Machines) không trả về xác suất dự đoán.","Máy vectơ hỗ trợ dùng ranh giới quyết định (decision boundaries) để phân loại.","Thuật toán đằng sau Máy vectơ hỗ trợ tính các siêu phẳng (hyperplanes) làm tối thiểu sai số phân loại sai.","Các mô hình Máy vectơ hỗ trợ là phi tuyến."]},"b-36":{"q":"Tất cả những điều sau đều là phương pháp xử lý các lớp mất cân bằng (unbalanced classes), NGOẠI TRỪ:","options":["Lấy mẫu giảm (Downsampling).","Kết hợp trong mẫu và ngoài mẫu (in-sample và out-of-sample).","Kết hợp lấy mẫu giảm và lấy mẫu tăng.","Lấy mẫu tăng (Upsampling)."]},"b-37":{"q":"Tất cả những điều sau đều là đặc điểm của thuật toán k láng giềng gần nhất (k nearest neighbors), NGOẠI TRỪ:","options":["Nó nhạy cảm với việc chuẩn hóa tỉ lệ (scaling)","Nó xác định các ranh giới quyết định (decision boundaries) để đưa ra dự đoán","Nó xác định giá trị của k","Nó phù hợp để dự đoán các biến có nhiều lớp"]},"b-38":{"q":"Tất cả những điều sau đều là đặc điểm của cây quyết định (decision trees), NGOẠI TRỪ:","options":["Chúng phân đoạn dữ liệu dựa trên các đặc trưng (features) để dự đoán kết quả","Chúng chia các nút (nodes) thành các lá (leaves)","Chúng có thể dùng cho phân loại hoặc hồi quy","Chúng có ranh giới quyết định (decision boundaries) tròn trịa, mượt mà"]},"b-39":{"q":"Bạn có thể dùng học máy có giám sát (supervised machine learning) cho tất cả các ví dụ sau, NGOẠI TRỪ:","options":["Phân khúc khách hàng theo nhân khẩu học của họ.","Dự đoán số lượng khách hàng sẽ đến cửa hàng trong một tuần nhất định.","Dự đoán xác suất một khách hàng quay lại cửa hàng.","Diễn giải các yếu tố chính quyết định việc một khách hàng có quay lại cửa hàng hay không."]},"b-41":{"q":"Vai trò của băng thông (bandwidth) trong phân cụm mean-shift là gì?","options":["Điều khiển tốc độ hội tụ","Xác định kích thước cụm","Xác định kích thước vùng lân cận","Thiết lập số lượng cụm"]},"b-42":{"q":"Mối quan ngại chính khi mô hình có độ chệch cao (high bias) là gì?","options":["Quá khớp (Overfitting)","Chưa khớp (Underfitting)","Các vấn đề về hội tụ của mô hình","Rò rỉ dữ liệu (Data leakage)"]},"b-43":{"q":"Tham số then chốt trong thuật toán K-means quyết định số lượng cụm là gì?","options":["Tốc độ học (Learning rate)","Kích thước lô (Batch size)","Số vòng lặp","K (số lượng cụm)"]},"b-44":{"q":"Các phương thức sklearn phổ biến nhất để thêm đặc trưng đa thức (polynomial features) vào dữ liệu là gì?","options":["polyFeat.add và polyFeat.transform","polyFeat.add và polyFeat.fit","polyFeat.fit và polyFeat.transform","polyFeat.transform"]},"b-45":{"q":"Nhược điểm chính của việc dùng đa thức bậc cao trong Hồi quy đa thức (Polynomial Regression) là gì?","options":["Tốn nhiều chi phí tính toán","Có thể dẫn đến quá khớp (overfitting)","Luôn dẫn đến chưa khớp (underfitting)","Hội tụ chậm"]},"b-46":{"q":"Việc tăng số lượng cây trong Rừng ngẫu nhiên (Random Forest) ảnh hưởng thế nào đến hiệu năng của nó?","options":["Cải thiện khả năng diễn giải của mô hình","Tăng nguy cơ quá khớp (overfitting)","Giảm hiệu quả tính toán","Tăng cường khả năng tổng quát hóa (generalization) của mô hình"]},"b-47":{"q":"Mô hình kết hợp (ensemble model) nào đòi hỏi bạn xem xét sai số ngoài túi (out of bag error)?","options":["Hồi quy Logistic (Logistic Regression).","Out of Bag Regression","Rừng ngẫu nhiên (Random Forest)","Xếp chồng (Stacking)"]},"b-48":{"q":"Tên gọi khác của khoảng cách L2 là gì?","options":["Khoảng cách Hamming (Hamming Distance)","Khoảng cách Euclid (Euclidean Distance)","Khoảng cách Manhattan (Manhattan Distance)","Khoảng cách Mahalanobis (Mahalanobis Distance)"]},"b-49":{"q":"Tên gọi khác của chính quy hóa L1 là gì?","options":["Chính quy hóa Ridge","Chính quy hóa Lasso","Chính quy hóa Elastic Net","Chính quy hóa quá khớp (Overfitting regularization)"]},"b-50":{"q":"Hai bước đầu tiên của một quy trình học máy điển hình là gì?","options":["Phát biểu bài toán và làm sạch dữ liệu.","Phát biểu bài toán và thu thập dữ liệu.","Thu thập dữ liệu và biến đổi dữ liệu.","Không có đáp án nào trong số còn lại"]},"b-51":{"q":"Tham số nào trong hàm SVC chỉ định việc lựa chọn hàm nhân (kernel)?","options":["neighbors","kernel","max_depth","n_estimators"]},"b-52":{"q":"Tham số nào trong hàm MDS chỉ định số chiều của không gian có chiều thấp hơn?","options":["n_components","n_features","n_dim","n_neighbors"]},"b-53":{"q":"Loại tệp nào sau đây là ví dụ về tệp sử dụng định dạng Javascript Object Notation (JSON)?","options":["Python (tệp py)","Javascript (tệp js)","Cơ sở dữ liệu SQL (tệp sql)","Jupyter/Python (tệp ipynb)"]},"b-54":{"q":"Đâu là thước đo phổ biến dùng để đánh giá mô hình khi các lớp mất cân bằng (imbalanced classes)?","options":["Độ chính xác (Accuracy)","Sai số bình phương trung bình (Mean Squared Error)","R-bình phương (R-squared)","Điểm F1 (F1 Score)"]},"b-55":{"q":"Đâu là kỹ thuật phổ biến để giảm chiều dữ liệu tuyến tính (linear dimensionality reduction)?","options":["Cây quyết định (Decision Trees)","Phân tích thành phần chính (Principal Component Analysis - PCA)","Phân cụm K-means (K-means Clustering)","Máy vectơ hỗ trợ (Support Vector Machines)"]},"b-56":{"q":"Kỹ thuật nào sau đây thường không được coi là kỹ thuật EDA (phân tích dữ liệu khám phá)?","options":["Tối ưu hóa bằng hạ gradient (Gradient descent optimization).","Phân tích tương quan.","Phân tích phân phối (ví dụ: biểu đồ histogram).","Biểu đồ hộp (boxplot) để phát hiện giá trị ngoại lai (outlier)."]},"b-57":{"q":"Thước đo khoảng cách (distance metric) nào hữu ích khi ta có các tài liệu văn bản và muốn nhóm các chủ đề tương tự lại với nhau?","options":["Khoảng cách Manhattan","Euclid","Jaccard","Khoảng cách Mahalanobis"]},"b-58":{"q":"Chính quy hóa (regularization) chủ yếu giải quyết vấn đề nào trong học máy?","options":["Quá khớp (Overfitting)","Chưa khớp (Underfitting)","Cả quá khớp và chưa khớp","Kỹ thuật đặc trưng (Feature engineering)"]},"b-59":{"q":"Mô-đun nào trong scikit-learn cung cấp cài đặt của Kernel PCA?","options":["sklearn.decomposition","sklearn.cluster","sklearn.preprocessing","sklearn.model_selection"]},"b-60":{"q":"Kỹ thuật nào liên quan đến việc nhân bản các mẫu từ lớp thiểu số (minority class) để cân bằng phân phối lớp?","options":["Lấy mẫu tăng (Upsampling)","Lấy mẫu giảm (Downsampling)","Lấy mẫu phân tầng (Stratified Sampling)","Đặt trọng số lớp (Class Weighting)"]},"b-61":{"q":"Hồi quy đa thức (Polynomial Regression) là phần mở rộng của loại hồi quy nào?","options":["Hồi quy tuyến tính (Linear Regression)","Hồi quy Logistic (Logistic Regression)","Hồi quy Ridge (Ridge Regression)","Hồi quy Poisson (Poisson Regression)"]},"b-62":{"q":"Nên dùng phép biến đổi biến nào cho dữ liệu thứ bậc (ordinal data)?","options":["Chuẩn hóa chuẩn (Standard scaling)","Mã hóa one-hot (One-hot encoding)","Mã hóa thứ bậc (Ordinal encoding)","Chuẩn hóa min-max (Min-max scaling)"]},"b-63":{"q":"Lĩnh vực nào được dùng để huấn luyện hầu hết các mô hình trong các ứng dụng thị giác máy tính (computer vision)?","options":["Học sâu (Deep Learning).","Học máy (Machine Learning).","Trí tuệ nhân tạo (Artificial Intelligence).","Học tăng cường (Reinforcement learning)."]},"b-64":{"q":"Làm thế nào để khởi tạo một mô hình PCA trong scikit-learn?","options":["pca = KMeans()","pca = PCA()","pca = DBSCAN()","pca = LogisticRegression()"]},"b-65":{"q":"Ai đã đặt ra thuật ngữ \"trí tuệ nhân tạo\" (artificial intelligence) tại Hội nghị Dartmouth năm 1956, đánh dấu sự ra đời chính thức của AI như một lĩnh vực nghiên cứu?","options":["Alan Turing","John McCarthy","Marvin Minsky","Herbert Simon"]},"b-66":{"q":"Khi xử lý quá khớp (overfitting) trong Hồi quy đa thức (Polynomial Regression), có thể dùng kỹ thuật nào để ngăn ngừa?","options":["Chính quy hóa L1 (L1 Regularization)","Chính quy hóa L2 (L2 Regularization)","Chuẩn hóa tỉ lệ đặc trưng (Feature Scaling)","Kiểm định chéo (Cross-validation)"]},"b-67":{"q":"Giả sử bạn có một tập dữ liệu tóm tắt một chiến dịch tiếp thị với thông tin về các khách hàng tiềm năng. Tập dữ liệu gồm 100 quan sát với nhiều cột tóm tắt thông tin về khách hàng tiềm năng. Nó cũng có một cột đánh dấu khách hàng tiềm năng có phản hồi hay không.\nTrong ngữ cảnh này, quan sát (observation) là từ đồng nghĩa với:","options":["nhãn (label)","các đặc trưng (features)","mục tiêu (target)","ví dụ (example)"]},"b-68":{"q":"Giả sử bạn có một tập dữ liệu tóm tắt một chiến dịch tiếp thị với thông tin về các khách hàng tiềm năng. Tập dữ liệu gồm 100 quan sát với nhiều cột tóm tắt thông tin về khách hàng tiềm năng. Nó cũng có một cột đánh dấu khách hàng tiềm năng có phản hồi hay không.\nMột mô hình học máy dự đoán phản hồi đang dùng cột Responded làm:","options":["mẫu (sample)","các đặc trưng (features)","mục tiêu (target)","ví dụ (example)"]},"b-69":{"q":"Xét các phát biểu sau về Ước lượng và Suy diễn (Estimation and Inference):\na. Nhìn chung, các tham số của tổng thể (population parameters) là chưa biết.\nb. Các mô hình tham số (parametric models) có số lượng tham số hữu hạn.","options":["a và b đúng","a và b sai","a đúng và b sai","a sai và b đúng"]},"b-70":{"q":"Thuật toán Cây quyết định (Decision Tree) có thể dùng cho","options":["Làm sạch dữ liệu","Kỹ thuật đặc trưng (Feature Engineering)","Phân loại và hồi quy","Tinh chỉnh siêu tham số (Hyperparameter Tuning)"]},"b-71":{"q":"Năm 2016, công nghệ AI nào đã đạt cột mốc quan trọng khi đánh bại kỳ thủ cờ vây vô địch thế giới Lee Sedol?","options":["Watson của IBM","DeepMind AlphaGo của Google","Amazon Alexa","Cortana của Microsoft"]},"b-72":{"q":"Sắp xếp các mô hình kết hợp cây (tree ensembles) sau theo thứ tự từ ngẫu nhiên nhiều nhất đến ít nhất:","options":["Random Forest, Random Trees, Bagging","Bagging, Random Forest, Random Trees","Random Trees, Random Forest, Bagging","Random Forest, Bagging, Random Trees"]},"b-73":{"q":"Trong học có giám sát (supervised learning), hai thành phần chính của tập dữ liệu huấn luyện là gì?","options":["Đặc trưng (Features) và Dự đoán (Predictions)","Nhãn (Labels) và Dự đoán (Predictions)","Đặc trưng (Features) và Nhãn (Labels)","Đầu vào (Inputs) và Đầu ra (Outputs)"]},"b-74":{"q":"Đây là cú pháp bạn cần để dự đoán dữ liệu mới sau khi đã huấn luyện một mô hình hồi quy tuyến tính tên là LR:","options":["LR=predict(X_test)","LR.predict(X_test)","LR.predict(LR, X_test)","predict(LR, X_test)"]},"b-75":{"q":"Mục đích chính của việc chia dữ liệu thành tập huấn luyện và tập kiểm tra là:","options":["Để cải thiện độ chính xác","Để tránh quá khớp (overfitting)","Để cải thiện chính quy hóa (regularization)","Để cải thiện kiểm định chéo (cross-validation) và quá khớp"]},"b-76":{"q":"Tính năng tự động sửa lỗi (autocorrect) trên điện thoại của bạn là ví dụ của:","options":["Học không giám sát (Unsupervised learning)","Học có giám sát (Supervised learning)","Học bán giám sát (Semi-supervised learning)","Học tăng cường (Reinforcement learning)"]},"b-78":{"q":"Cách phổ biến nhất để ước lượng tham số trong một mô hình tham số (parametric model) là:","options":["dùng ước lượng hợp lý cực đại (maximum likelihood estimation)","dùng định lý giới hạn trung tâm (central limit theorem)","ngoại suy một mô hình phi tham số (non-parametric model)","ngoại suy thống kê Bayes (Bayesian statistics)"]},"b-79":{"q":"Đây là mô hình kết hợp (ensemble model) không dùng các mẫu bootstrap để khớp các cây cơ sở, có tính đến phần dư (residuals), và khớp các cây cơ sở một cách lặp:","options":["Random Trees","Boosting","Bagging","Random Forest"]},"b-80":{"q":"Đây là loại Học máy sử dụng cả dữ liệu có kết quả được gán nhãn lẫn dữ liệu không có kết quả được gán nhãn:","options":["Học máy có giám sát (Supervised Machine Learning)","Học máy không giám sát (Unsupervised Machine Learning)","Học máy hỗn hợp (Mixed Machine Learning)","Học máy bán giám sát (Semi-Supervised Machine Learning)"]},"b-81":{"q":"Việc chọn đúng thước đo sai số (error measurement) là thiết yếu để huấn luyện và đánh giá các mô hình học máy một cách hiệu quả vì nó cho phép","options":["Xử lý mất cân bằng lớp (Class Imbalance)","Có tính bền vững trước các giá trị ngoại lai (Outliers)","Dễ diễn giải hơn","Đạt độ chính xác cao"]},"b-82":{"q":"Bạn đang làm việc với một tập dữ liệu chứa hai biến số. Dữ liệu có nhiễu và một số giá trị cực đoan. Bạn muốn xem xét liệu hai biến này có liên quan với nhau hay không, ngay cả khi mối quan hệ có thể là phi tuyến. Loại trực quan hóa nào là phù hợp nhất?","options":["Biểu đồ histogram","Biểu đồ hộp (Boxplot)","Biểu đồ phân tán (Scatter plot)","Biểu đồ cột (Bar chart)"]},"b-83":{"q":"Vào thập niên 1980, thuật ngữ nào thường được dùng để mô tả các hệ thống AI có thể mô phỏng việc ra quyết định của con người dựa trên các quy tắc và tri thức được định nghĩa trước?","options":["Mạng nơ-ron (Neural Networks)","Hệ chuyên gia (Expert Systems)","Thuật toán di truyền (Genetic Algorithms)","Học tăng cường (Reinforcement Learning)"]},"b-84":{"q":"Mục đích của ma trận nhầm lẫn (confusion matrix) trong phân loại là gì?","options":["Đánh giá hiệu năng của mô hình","Trực quan hóa mức độ quan trọng của đặc trưng","Chọn siêu tham số tối ưu","Giảm chiều dữ liệu"]},"b-85":{"q":"Mở rộng đặc trưng đa thức (polynomial feature expansion) là gì?","options":["Tạo các đặc trưng mới bằng cách kết hợp các đặc trưng hiện có","Biến đổi các biến phân loại thành biểu diễn số","Sinh các số hạng bậc cao hơn cho các đặc trưng số","Cung cấp các số hạng bậc cho các đặc trưng số"]},"b-87":{"q":"Phép biến đổi logarit (log transformation) thường được dùng để làm gì?","options":["Xử lý giá trị thiếu trong các đặc trưng số","Giảm tác động của các giá trị ngoại lai (outliers) trong các phân phối lệch (skewed distributions)","Chuyển các đặc trưng phân loại thành đặc trưng số","Chuyển các đặc trưng số thành đặc trưng phân loại"]},"b-88":{"q":"Mục đích chính của các thước đo khoảng cách (distance metrics) trong phân cụm (clustering) là gì?","options":["Đo khoảng cách vật lý giữa các điểm dữ liệu","Định lượng mức độ tương tự hoặc khác biệt giữa các điểm dữ liệu","Xác định hướng của các điểm dữ liệu","Phân loại các điểm dữ liệu vào các cụm được định nghĩa trước"]},"b-89":{"q":"Điều kiện chính để dùng xếp chồng (stacking) làm phương pháp kết hợp (ensemble method) là gì?","options":["Các mô hình phải là tham số (parametric)","Các mô hình phải là phi tham số (nonparametric)","Các mô hình phải xuất ra giá trị phần dư (residual) cho mỗi lớp","Các mô hình phải xuất ra xác suất dự đoán"]},"b-90":{"q":"Siêu phẳng (hyperplane) trong ngữ cảnh SVM là gì?","options":["Một mặt phẳng phân tách dữ liệu thành hai lớp","Một đường thẳng nối các vectơ hỗ trợ (support vectors)","Một không gian con có số chiều thấp hơn","Trục có phương sai lớn nhất trong dữ liệu"]},"b-91":{"q":"Vai trò của tham số chính quy hóa (regularization parameter) trong quá trình chính quy hóa là gì?","options":["Nó điều khiển cường độ chung của chính quy hóa","Nó đặt tốc độ học (learning rate) cho thuật toán tối ưu","Nó xác định số vòng lặp trong huấn luyện mô hình","Nó không có tác động đến chính quy hóa"]},"b-92":{"q":"Mục đích của ước lượng điểm (point estimation) trong thống kê là gì?","options":["Để ước lượng một khoảng giá trị cho một tham số","Để tóm tắt xu hướng trung tâm của một tập dữ liệu","Để đưa ra một giá trị duy nhất làm ước đoán tốt nhất cho một tham số","Để đánh giá độ biến thiên của một tập dữ liệu"]},"b-93":{"q":"Mục tiêu chính của việc dùng các phương pháp kết hợp (ensemble methods) như bagging và boosting, trong trường hợp các lớp mất cân bằng (imbalanced classes), là gì?","options":["Để giảm độ chính xác của mô hình","Để tăng độ phức tạp của mô hình","Để cải thiện khả năng tổng quát hóa (generalization) của mô hình và việc xử lý dữ liệu mất cân bằng","Để giảm tác động của lớp đa số (majority class)"]},"b-95":{"q":"Đâu là một giải pháp thực tế để khắc phục các vấn đề của lời nguyền số chiều (curse of dimensionality)?","options":["Tăng kích thước tập dữ liệu","Dùng nhiều sức mạnh tính toán hơn","Giảm số chiều của tập dữ liệu.","Cân bằng các lớp của tập dữ liệu"]},"b-97":{"q":"Trí tuệ nhân tạo (artificial intelligence) là gì?","options":["Một tập con của học sâu (deep learning).","Bất kỳ chương trình nào có thể cảm nhận, suy luận, hành động và thích nghi.","Một tập con của học máy (machine learning)","Không có đáp án nào trong số còn lại"]},"b-98":{"q":"Mục tiêu chính của học không giám sát (unsupervised learning) là gì?","options":["Dự đoán một biến mục tiêu","Phân loại dữ liệu vào các danh mục được định nghĩa trước","Khám phá các mẫu hình và cấu trúc trong dữ liệu","Đánh giá độ chính xác của mô hình"]},"b-99":{"q":"Mục đích của việc dùng bootstrapping trong thuật toán Bagging là gì?","options":["Để giảm quá khớp (overfitting)","Để tạo ra các tập con đa dạng của tập dữ liệu","Để tăng số lượng đặc trưng","Để tăng tốc quá trình huấn luyện"]},"b-100":{"q":"Các điểm yếu của phương pháp Mean shift là gì?","options":["Kết quả phụ thuộc vào kích thước cửa sổ (băng thông - bandwidth)","Việc chọn kích thước cửa sổ không dễ","Không giả định số lượng hay hình dạng của các cụm","Bền vững trước các giá trị ngoại lai (outliers)"]},"b-101":{"q":"Tập kiểm tra (test set) đại diện cho điều gì trong học máy?","options":["Phần dữ liệu dùng để huấn luyện mô hình","Một tập các ví dụ mà mô hình đã thấy trong quá trình huấn luyện","Dữ liệu mới, chưa từng thấy mà mô hình chưa gặp trong quá trình huấn luyện","Một tập dữ liệu dành riêng cho mục đích kiểm định (validation)"]},"b-102":{"q":"Các điểm mạnh của thuật toán Mean shift là gì?","options":["Không dựa trên mô hình (model-free): không giả định số lượng hay hình dạng của các cụm","Có thể chỉ dùng một tham số: kích thước cửa sổ (băng thông - bandwidth)","Bền vững trước các giá trị ngoại lai (outliers)","Tất cả các đáp án trên"]},"b-103":{"q":"\"Điểm lõi\" (core points) trong thuật toán DBSCAN là gì?","options":["Điểm lõi là các giá trị ngoại lai không thuộc cụm nào","Điểm lõi là các điểm dữ liệu có ít nhất một số lượng tối thiểu các điểm khác (minPts) trong một khoảng cách xác định (epsilon) tính từ nó","Điểm lõi là các điểm dữ liệu bị cô lập khỏi phần còn lại của tập dữ liệu","Điểm lõi là các tâm cụm (centroids) của các cụm được DBSCAN xác định"]},"b-105":{"q":"Đặc trưng đa thức (polynomial features) là gì?","options":["Chúng là các mối quan hệ bậc cao hơn trong dữ liệu.","Chúng là các hệ số của hồi quy logistic.","Chúng là các mối quan hệ bậc thấp hơn trong dữ liệu.","Chúng được biểu diễn bởi các mối quan hệ tuyến tính trong dữ liệu."]},"b-106":{"q":"Hai vấn đề dữ liệu chính mà các công ty gặp phải khi bắt đầu với trí tuệ nhân tạo/học máy là gì?","options":["Lấy mẫu dữ liệu và phân loại","Giá trị ngoại lai (outliers) và dữ liệu trùng lặp","Thiếu dữ liệu liên quan và dữ liệu xấu","Thiếu đào tạo và chuyên môn"]},"b-107":{"q":"Siêu tham số (hyperparameter) \"alpha\" điều khiển điều gì trong chính quy hóa Elastic Net?","options":["Cường độ chung của chính quy hóa","Sự cân bằng giữa các hình phạt L1 và L2","Tốc độ học (learning rate) của thuật toán tối ưu","Số vòng lặp trong huấn luyện mô hình"]},"b-108":{"q":"Thuật ngữ \"precision\" đo lường điều gì trong ngữ cảnh các thước đo phân loại?","options":["Khả năng xác định đúng các trường hợp dương tính","Khả năng xác định đúng các trường hợp âm tính","Tỷ lệ các trường hợp dương tính thực tế được xác định đúng","Sự đánh đổi giữa precision và recall"]},"b-109":{"q":"Đâu là ví dụ về kỹ thuật đặc trưng (feature engineering)?","options":["Nhập các thư viện trong Python","Chuẩn hóa (standardizing) các đặc trưng số","Tạo một đặc trưng mới dựa trên các đặc trưng hiện có","Tất cả các đáp án trên"]},"b-110":{"q":"Phát biểu nào sau đây là đặc điểm của thuật toán DBSCAN?","options":["Có thể xử lý lượng dữ liệu rất lớn và các hình dạng kỳ lạ.","Tìm ra các cụm có kích thước không đều (một cụm lớn, vài cụm rất nhỏ).","Nó sẽ hoạt động rất tốt khi tìm nhiều cụm.","Nó sẽ hoạt động rất tốt khi tìm ít cụm."]},"b-113":{"q":"Khi nào nhiều khả năng nhất một quan sát chứa giá trị ngoại lai (outlier) ở một trong các đặc trưng của nó?","options":["Một đặc trưng có giá trị phần dư chuẩn hóa nội bộ (internally studentized residual) trên 3.","Một đặc trưng có giá trị phần dư bị loại (deleted residual) trên 3.","Quan sát chứa giá trị mục tiêu lớn nhất.","Quan sát bị thiếu giá trị ở nhiều đặc trưng."]},"b-114":{"q":"Khi dùng DBSCAN, thuật toán xác định một cụm đã hoàn tất và đến lúc chuyển sang một điểm khác của tập dữ liệu để có thể bắt đầu một cụm mới như thế nào?","options":["Khi thuật toán yêu cầu bạn thay đổi đầu vào.","Khi thuật toán tạo một cụm mới từ các giá trị ngoại lai.","Khi không còn điểm nào chưa được duyệt bởi phản ứng dây chuyền.","Khi lời giải hội tụ về một cụm duy nhất."]},"b-115":{"q":"Tại sao kỹ thuật đặc trưng (feature engineering) quan trọng trong học máy?","options":["Nó cải thiện thời gian huấn luyện mô hình","Nó giúp giảm số chiều của dữ liệu","Nó nâng cao hiệu năng của các mô hình học máy","Nó giúp hiểu sâu hơn về dữ liệu"]},"b-116":{"q":"Dữ liệu kiểm tra (test data) được dùng như thế nào trong quá trình xây dựng mô hình?","options":["đo sai số và hiệu năng của mô hình.","đo các tham số và siêu tham số của mô hình.","tinh chỉnh các siêu tham số (hyperparameters) của mô hình.","tinh chỉnh các tham số (parameters) của mô hình."]},"b-117":{"q":"Việc tăng cường độ chính quy hóa (lambda) trong chính quy hóa Lasso ảnh hưởng thế nào đến tính thưa (sparsity) của lời giải?","options":["Lambda cao hơn khuyến khích các lời giải thưa hơn","Lambda thấp hơn khuyến khích các lời giải thưa hơn","Lambda không có ảnh hưởng đến tính thưa","Lambda khuyến khích sự cân bằng đồng đều của các hệ số"]},"b-118":{"q":"Làm thế nào để tạo các đặc trưng đa thức (polynomial features) trong scikit-learn?","options":["polyFeat.fit và polyFeat.transform","polyFeat.add và polyFeat.transform","polyFeat.add và polyFeat.fit","polyFeat.transform"]},"b-119":{"q":"Hoàn thành câu sau: Dữ liệu huấn luyện được dùng để khớp mô hình, còn dữ liệu kiểm tra được dùng để:","options":["đo các tham số và siêu tham số của mô hình","tinh chỉnh các siêu tham số của mô hình","tinh chỉnh các tham số của mô hình","đo sai số và hiệu năng của mô hình"]},"b-120":{"q":"So với hồi quy Lasso (giả sử cài đặt tương tự), hồi quy Ridge:","options":["ít có khả năng quá khớp (overfit) với dữ liệu huấn luyện hơn.","có nhiều khả năng quá khớp (overfit) với dữ liệu huấn luyện hơn.","ít có khả năng đặt các hệ số đặc trưng về không hơn.","có nhiều khả năng đặt các hệ số đặc trưng về không hơn."]},"b-121":{"q":"Các cây quyết định (decision trees) dùng làm bộ phân loại tính giá trị gán cho một lá (leaf) bằng cách tính tỷ lệ: số quan sát của một lớp chia cho số quan sát trong lá đó.\nVí dụ: số khách hàng dưới 50 tuổi chia cho tổng số khách hàng.\nGiá trị của lá được tính như thế nào đối với cây quyết định hồi quy?","options":["giá trị trung bình của biến được dự đoán","giá trị trung vị của biến được dự đoán","giá trị yếu vị (mode) của biến được dự đoán","giá trị trung bình có trọng số của biến được dự đoán"]},"b-122":{"q":"Từ các lựa chọn dưới đây, hãy chọn phương án KHÔNG phải là cách tiếp cận khám phá dữ liệu hợp lệ để xác nhận bằng hình ảnh liệu dữ liệu của bạn đã sẵn sàng cho việc xây dựng mô hình hay cần được làm sạch hoặc xử lý thêm:","options":["Tạo một biểu đồ dạng bảng (panel plot) hiển thị phân phối của biến phụ thuộc và biểu đồ phân tán của tất cả các biến độc lập","Huấn luyện một mô hình và xác định các quan sát có phần dư (residuals) lớn nhất","Tạo các trực quan hóa gồm biểu đồ phân tán, histogram, biểu đồ hộp (box plots) và biểu đồ hexbin","Tạo bản đồ nhiệt tương quan (correlation heatmap) để xác nhận dấu và độ lớn của tương quan giữa các đặc trưng."]},"b-123":{"q":"Nếu một mô hình có độ phức tạp thấp bị chưa khớp (underfitting) trong quá trình ước lượng, phát biểu nào sau đây NHIỀU KHẢ NĂNG đúng nhất (giữ nguyên mô hình)?","options":["Kiểm định chéo k-fold (K-fold cross-validation) vẫn sẽ dẫn đến chưa khớp, với mọi k.","Kiểm định chéo K với k nhỏ sẽ giảm hoặc loại bỏ chưa khớp.","Kiểm định chéo k-fold với k lớn sẽ giảm hoặc loại bỏ chưa khớp.","Không có đáp án nào ở trên."]},"b-124":{"q":"Trong kiểm định giả thuyết thống kê, sai lầm loại II (Type II error) là gì?","options":["Bác bỏ một giả thuyết không (null hypothesis) đúng","Chấp nhận một giả thuyết không sai","Không bác bỏ được một giả thuyết không sai","Không bác bỏ được một giả thuyết không đúng"]},"b-125":{"q":"Trong PCA, các thành phần chính (principal components) là gì?","options":["Các điểm dữ liệu trong tập dữ liệu","Các đặc trưng có mức độ quan trọng cao nhất","Các vectơ riêng (eigenvectors) của ma trận hiệp phương sai (covariance matrix)","Các giá trị trung bình của mỗi đặc trưng"]},"b-126":{"q":"Trong thuật toán K-means, các tâm cụm (centroids) ban đầu được chọn như thế nào?","options":["Ngẫu nhiên từ tập dữ liệu","Dựa trên giá trị trung bình của toàn bộ tập dữ liệu","Dùng phân cụm phân cấp (hierarchical clustering)","Bằng cách chọn điểm dữ liệu xa tâm nhất"]},"b-127":{"q":"Trong ngữ cảnh hồi quy tuyến tính, mục đích của các kỹ thuật chính quy hóa (regularization) như Lasso và Ridge là gì?","options":["Để tăng độ phức tạp của mô hình","Để thêm nhiễu vào tập dữ liệu","Để giảm quá khớp (overfitting) và ổn định các ước lượng hệ số","Để đưa tính phi tuyến vào mối quan hệ hồi quy"]},"b-128":{"q":"Trong HAC, thuật ngữ \"agglomerative\" (gộp dần) đề cập đến điều gì?","options":["Gộp các điểm dữ liệu thành các cụm","Tách các cụm thành từng điểm riêng lẻ","Gán các điểm dữ liệu cho tâm cụm (centroid) gần nhất","Tính phương sai trong cụm"]},"b-129":{"q":"Trong ứng dụng mua sắm trực tuyến, học máy thường được dùng như thế nào?","options":["Để dự đoán thời tiết","Để đề xuất sản phẩm dựa trên sở thích của người dùng","Để phát các danh sách nhạc","Để đặt vé máy bay"]},"b-130":{"q":"Mục đích của thuật toán K-means là","options":["Để tìm số lượng cụm tối ưu","Để cực tiểu hóa phương sai trong cụm (within-cluster variance)","Để cực đại hóa phương sai giữa các cụm (between-cluster variance)","Để gán nhãn cụm dựa trên độ gần nhau"]},"b-132":{"q":"Khi phân tích tương quan giữa các biến liên tục, bạn nhận thấy một số cặp có tương quan Pearson gần bằng không, nhưng biểu đồ phân tán của chúng cho thấy các mẫu hình cong rõ rệt. Điều gì có thể giải thích điều này?","options":["Đa cộng tuyến (multicollinearity) mạnh","Dữ liệu bị thiếu","Mối quan hệ phi tuyến giữa các biến","Mã hóa dữ liệu không chính xác"]},"b-133":{"q":"Mục tiêu chính của học có giám sát (supervised learning) là gì?","options":["Khám phá các mẫu ẩn trong dữ liệu","Đưa ra dự đoán dựa trên dữ liệu huấn luyện đã được gán nhãn","Phân loại dữ liệu vào các nhóm","Gom cụm các điểm dữ liệu tương tự nhau"]},"b-134":{"q":"Tác động của hình phạt điều chuẩn L1 (L1 regularization) lên các hệ số của mô hình là gì?","options":["Khuyến khích làm cho các hệ số bằng nhau","Khuyến khích tính thưa (sparsity) (một số hệ số trở thành đúng bằng 0)","Khuyến khích các hệ số lớn","Không có tác động đến các hệ số"]},"b-135":{"q":"Lý do chính để sử dụng lấy mẫu giảm (under-sampling) trong bài toán phân loại mất cân bằng (imbalanced classification) là gì?","options":["Để tăng giả tạo số lượng mẫu của lớp thiểu số bằng cách tạo ra các mẫu tổng hợp.","Để tăng thời gian huấn luyện bằng cách cung cấp nhiều mẫu hơn cho mô hình học.","Để buộc mô hình hoàn toàn bỏ qua lớp đa số trong quá trình huấn luyện.","Để cân bằng phân phối các lớp bằng cách giảm số lượng mẫu của lớp đa số, điều này có thể cải thiện khả năng phát hiện các mẫu thuộc lớp thiểu số của mô hình."]},"b-136":{"q":"Một thách thức tiềm tàng của thuật toán K-means là gì?","options":["Nó nhạy cảm với việc chọn các tâm cụm (centroid) ban đầu và có thể hội tụ về các cực trị địa phương (local optima)","Nó luôn tạo ra các cụm giống nhau bất kể tập dữ liệu nào","Nó hoạt động kém trên dữ liệu có số chiều cao","Nó chỉ phù hợp với các tập dữ liệu nhỏ"]},"b-137":{"q":"Lời nguyền số chiều (curse of dimensionality) trong học máy là gì?","options":["Lời nguyền số chiều đề cập đến hạn chế của các mô hình trong việc xử lý dữ liệu có số chiều cao.","Lời nguyền số chiều mô tả sự gia tăng hiệu quả tính toán khi số chiều cao hơn.","Lời nguyền số chiều không liên quan trong học máy","Lời nguyền số chiều chỉ xảy ra trong các mô hình hồi quy tuyến tính"]},"b-138":{"q":"Bước đầu tiên thường thấy khi khớp một mô hình hồi quy logistic (logistic regression) bằng scikit-learn là gì?","options":["nhập logistic regression từ module sklearn.linear_model\nví dụ: from sklearn.linear_model import LogisticRegression","nhập Logistic từ module sklearn.regression\nví dụ: from sklearn.regression import Logistic","nhập Logistic từ module sklearn.linear_regression\nví dụ: from sklearn.linear_regression import Logistic","nhập logistic regression từ module sklearn.linearclassifier\nví dụ: from sklearn.linear classifier import LogisticRegression"]},"b-139":{"q":"Sự khác biệt giữa hồi quy tuyến tính đơn (simple linear regression) và hồi quy tuyến tính bội (multiple linear regression) là gì?","options":["Hồi quy tuyến tính đơn có độ chính xác cao hơn","Hồi quy tuyến tính bội chỉ có một biến độc lập","Hồi quy tuyến tính đơn xử lý một biến độc lập, trong khi hồi quy tuyến tính bội xử lý nhiều biến độc lập","Hồi quy tuyến tính bội được dùng riêng cho các tác vụ phân loại"]},"b-140":{"q":"Mục đích của việc chia tập dữ liệu thành tập huấn luyện (training set) và tập kiểm tra (test set) trong học máy là gì?","options":["Để tăng kích thước tập huấn luyện nhằm cải thiện hiệu suất mô hình","Để giảm quá khớp (overfitting) bằng cách đánh giá mô hình trên dữ liệu chưa từng thấy","Để cải thiện hiệu quả tính toán của việc huấn luyện mô hình","Để đưa tính ngẫu nhiên và sự đa dạng vào quá trình huấn luyện"]},"b-141":{"q":"Kỹ thuật đặc trưng (feature engineering) là gì?","options":["Quá trình xây dựng các mô hình học máy","Quá trình biến đổi dữ liệu thô thành các đặc trưng biểu diễn tốt hơn bài toán cần giải quyết","Quá trình đánh giá hiệu suất mô hình","Không đáp án nào trong số này"]},"b-142":{"q":"Yếu tố quan trọng nhất cần cân nhắc khi đánh giá một mô hình học máy (Machine Learning) là gì?","options":["Ước lượng mô hình (model estimation) là chọn các tham số làm cực tiểu hàm chi phí (cost function).","Lựa chọn mô hình (model selection) là chọn một mô hình làm cực tiểu hàm chi phí.","Ước lượng mô hình là chọn một hàm chi phí có thể so sánh được giữa các mô hình.","Lựa chọn mô hình là chọn các tham số mô hình làm cực tiểu sai số kiểm định trong mẫu (in-sample validation error)."]},"b-143":{"q":"Mục tiêu của học máy (machine learning) là gì?","options":["Mục tiêu của học máy là đạt độ chính xác cao khi dự đoán cho các ví dụ trong tương lai, chứ không phải cho các ví dụ huấn luyện.","Mục tiêu của học máy là đạt độ chính xác cao khi dự đoán cho các ví dụ trong tương lai, và cho cả các ví dụ huấn luyện.","Mục tiêu của học máy là đạt độ chính xác thấp khi dự đoán cho các ví dụ trong tương lai, độ chính xác cao ở giai đoạn huấn luyện.","Mục tiêu của học máy là đạt độ chính xác thấp khi dự đoán cho các ví dụ trong tương lai, và độ chính xác thấp ở giai đoạn huấn luyện."]},"b-144":{"q":"Giá trị p (p-value) trong kiểm định giả thuyết thống kê là gì?","options":["Xác suất mắc sai lầm loại I (Type I error)","Xác suất bác bỏ một giả thuyết không (null hypothesis) đúng","Xác suất chấp nhận một giả thuyết không sai","Xác suất quan sát được dữ liệu với điều kiện giả thuyết không là đúng"]},"b-145":{"q":"Mục tiêu chính của việc thêm các đặc trưng đa thức (polynomial features) vào hồi quy tuyến tính là gì?","options":["Loại bỏ tính tuyến tính của hồi quy và biến nó thành mô hình đa thức.","Nắm bắt mối quan hệ của kết quả với các đặc trưng bậc cao hơn.","Tăng khả năng diễn giải của một mô hình hộp đen (black box).","Đảm bảo kết quả tương tự giữa tất cả các fold khi dùng kiểm định chéo K-fold (K-fold cross validation)."]},"b-146":{"q":"Đặc điểm then chốt của khoảng cách Cosine (Cosine Distance) là gì?","options":["Kích thước của đường cong.","Khoảng cách Cosine, có tính đến góc giữa 2 điểm.","Nó nhạy cảm với kích thước của tập dữ liệu.","Nó không nhạy cảm với kích thước của tập dữ liệu."]},"b-147":{"q":"Mục tiêu chính của việc sử dụng gom cụm K-Means (K-Means clustering) trong các tác vụ học không giám sát (unsupervised learning) là gì?","options":["Để phân hoạch tập dữ liệu thành k cụm sao cho mỗi quan sát thuộc về cụm có giá trị trung bình gần nhất, đồng thời cực tiểu hóa phương sai trong cụm (within-cluster variance).","Để xây dựng một mô hình phân loại có giám sát dựa trên các ví dụ đã gán nhãn cho các tác vụ dự đoán trong tương lai.","Để gán mỗi điểm vào nhiều cụm cùng lúc và cực đại hóa khoảng cách giữa các cụm.","Để dự đoán các giá trị mục tiêu liên tục bằng các tổ hợp tuyến tính của các đặc trưng trong tập dữ liệu."]},"b-148":{"q":"Một nhược điểm tiềm tàng của việc dùng một lần chia train-test duy nhất thay vì kiểm định chéo (cross-validation) là gì?","options":["Nó tốn nhiều thời gian tính toán hơn đáng kể","Nó có thể dẫn đến underfitting (dưới khớp)","Nó ngăn cản việc tinh chỉnh siêu tham số (hyperparameter)","Việc đánh giá có thể rất nhạy cảm với cách dữ liệu được chia"]},"b-149":{"q":"Khoảng tin cậy (confidence interval) trong suy luận thống kê là gì?","options":["Khoảng tin cậy cung cấp một khoảng giá trị mà tham số thực của tổng thể có khả năng nằm trong đó","Khoảng tin cậy được dùng để đo độ mạnh của mối liên hệ giữa hai biến.","Khoảng tin cậy biểu diễn xác suất một giả thuyết là đúng","Khoảng tin cậy chỉ áp dụng được cho các cỡ mẫu lớn"]},"b-150":{"q":"Các giá trị riêng (eigenvalue) trong PCA là gì?","options":["Giá trị riêng biểu diễn các giá trị trung bình của từng đặc trưng","Giá trị riêng cho biết mức độ quan trọng của mỗi thành phần chính (principal component) trong việc nắm bắt phương sai","Giá trị riêng là các hệ số của mô hình hồi quy tuyến tính trong PCA","Giá trị riêng không liên quan trong PCA"]},"b-151":{"q":"Những hệ quả tiềm tàng của việc sử dụng một mô hình có độ phức tạp cao trong hồi quy tuyến tính là gì?","options":["Phương sai cao của các ước lượng tham số qua các mẫu con của kiểm định chéo cho thấy khả năng cao là quá khớp (overfitting).","Kiểm định chéo (cross-validation) với k nhỏ sẽ giảm hoặc loại bỏ quá khớp.","Phương sai thấp của các ước lượng tham số qua các mẫu con của kiểm định chéo cho thấy khả năng cao là quá khớp.","Kiểm định chéo với k lớn sẽ giảm hoặc loại bỏ quá khớp."]},"b-152":{"q":"NoSQL là viết tắt của gì và nó đại diện cho điều gì?","options":["NoSQL là viết tắt của Not-only SQL, và nó đại diện cho một tập hợp các cơ sở dữ liệu có tính quan hệ, do đó chúng có cấu trúc cố định.","NoSQL là viết tắt của Non-Structured Query Language, và nó đại diện cho một tập hợp các cơ sở dữ liệu quan hệ có lược đồ cố định.","NoSQL là viết tắt của Non-Structured Query Language, và nó đại diện cho một tập hợp các cơ sở dữ liệu phi quan hệ có lược đồ đa dạng.","NoSQL là viết tắt của Not-only SQL, và nó đại diện cho một tập hợp các cơ sở dữ liệu không có tính quan hệ, do đó chúng có cấu trúc đa dạng."]},"b-153":{"q":"Kỹ thuật lấy mẫu tăng tổng hợp (synthetic oversampling) trong xử lý các tập dữ liệu mất cân bằng (imbalanced datasets) làm gì?","options":["Nó tạo ra các đặc trưng hoàn toàn mới cho lớp thiểu số","Nó sinh ra các mẫu tổng hợp cho lớp thiểu số để cân bằng tập dữ liệu","Nó loại bỏ ngẫu nhiên các mẫu từ cả hai lớp","Nó tập trung vào việc tăng kích thước của lớp đa số"]},"b-155":{"q":"Vấn đề nào xảy ra khi các lớp trong tập dữ liệu rất mất cân bằng?","options":["Mô hình có thể tập trung đều vào tất cả các lớp, dẫn đến độ chính xác cân bằng và các dự đoán công bằng.","Mô hình sẽ bỏ qua các lớp hiếm và đạt dự đoán hoàn hảo cho các lớp thiểu số.","Mô hình có xu hướng thiên lệch (bias) về lớp đa số, đưa ra các dự đoán kém cho lớp thiểu số.","Mô hình sẽ tự động điều chỉnh trọng số và xử lý mọi lớp mà không có lỗi."]},"b-156":{"q":"Kỹ thuật đặc trưng (feature engineering) đóng vai trò gì trong quy trình học máy?","options":["Nó liên quan đến việc tối ưu các siêu tham số (hyperparameter) của mô hình","Nó đề cập đến việc tạo ra các thuật toán phức tạp để huấn luyện mô hình.","Nó tập trung vào việc chọn lọc và biến đổi các biến đầu vào để nâng cao hiệu suất mô hình","Nó không liên quan trong bối cảnh học máy."]},"b-157":{"q":"Điều gì xảy ra với tâm cụm (centroid) thứ hai của chúng ta khi dùng công thức xác suất?","options":["Khi dùng công thức xác suất, ta đặt trọng số thấp hơn cho các điểm ở xa. Do đó, tâm cụm thứ hai của ta có khả năng sẽ gần hơn.","Khi dùng công thức xác suất, ta đặt trọng số cao hơn cho các điểm ở xa. Do đó, tâm cụm thứ hai của ta có khả năng sẽ xa hơn.","Khi dùng công thức xác suất, ta đặt trọng số cao hơn cho các tâm cụm nhẹ hơn, vì sẽ tốn nhiều sức mạnh tính toán hơn để vẽ các cụm của ta. Do đó, tâm cụm thứ hai có khả năng sẽ ít xa hơn.","Khi dùng công thức xác suất, ta đặt trọng số thấp hơn cho các điểm ở xa. Do đó, tâm cụm thứ hai của ta có khả năng sẽ xa hơn."]},"b-158":{"q":"Phát biểu nào sau đây là đúng về lấy mẫu giảm (downsampling) trong các tập dữ liệu mất cân bằng?","options":["Lấy mẫu giảm luôn dẫn đến hiệu suất mô hình tốt hơn","Lấy mẫu giảm liên quan đến việc loại bỏ các mẫu khỏi lớp đa số","Lấy mẫu giảm chủ yếu được dùng để tăng kích thước tập dữ liệu","Lấy mẫu giảm không có tác động đến phân phối của các lớp"]},"b-159":{"q":"Phát biểu nào sau đây là đúng về lấy mẫu tăng ngẫu nhiên (Random Over Sampling) và lấy mẫu tăng tổng hợp (Synthetic Over Sampling) trong bối cảnh các tập dữ liệu mất cân bằng?","options":["Random Over Sampling nhân bản ngẫu nhiên các mẫu của lớp thiểu số để cân bằng tập dữ liệu, trong khi Synthetic Over Sampling sinh ra các mẫu tổng hợp mới.","Random Over Sampling sinh ra các mẫu tổng hợp mới của lớp thiểu số, trong khi Synthetic Over Sampling nhân bản ngẫu nhiên các mẫu.","Random Over Sampling và Synthetic Over Sampling đều liên quan đến việc nhân bản ngẫu nhiên các mẫu của lớp thiểu số.","Random Over Sampling và Synthetic Over Sampling là các kỹ thuật giống hệt nhau với tên gọi khác nhau."]},"b-160":{"q":"Phát biểu nào sau đây định nghĩa đúng các điểm mạnh của thuật toán DBSCAN?","options":["Không cần chỉ định số lượng cụm (so với K-means), cho phép nhiễu (noise), và có thể xử lý các cụm có hình dạng tùy ý.","Hoạt động tốt với các mật độ khác nhau, chỉ cần một tham số, n_clu tự xác định.","Thuật toán sẽ tìm các điểm ngoại lai (outlier) trước, vẽ các hình dạng đều đặn, chạy nhanh hơn các thuật toán khác.","Thuật toán tốn nhiều tính toán, nhạy cảm với điểm ngoại lai, và chỉ cần tinh chỉnh ít siêu tham số."]},"b-161":{"q":"Phát biểu nào sau đây định nghĩa đúng các điểm yếu của thuật toán DBSCAN?","options":["Các cụm mà nó tìm ra có thể không đáng tin cậy, nó cần dữ liệu nhiễu để hoạt động, và nó không thể xử lý các nhóm con.","Nó cần hai tham số đầu vào, việc tìm các giá trị phù hợp của ε và n_clu có thể khó khăn, và nó hoạt động không tốt với các cụm có mật độ khác nhau.","Thuật toán sẽ tìm các điểm ngoại lai trước, nó vẽ các hình dạng đều đặn, và nó chạy nhanh hơn các thuật toán khác.","Thuật toán tốn nhiều tính toán, nhạy cảm với điểm ngoại lai, và cần tinh chỉnh quá nhiều siêu tham số."]},"b-162":{"q":"Phát biểu nào sau đây là một đặc điểm của thuật toán Mean Shift?","options":["Không yêu cầu ta đặt số lượng cụm, số lượng cụm sẽ được xác định cho ta.","Kém với các cụm có hình dạng không cầu.","Bạn cần tự quyết định số lượng cụm, chọn trực tiếp số lượng hoặc ngưỡng khoảng cách tối thiểu.","Tốt với các cụm có hình dạng không cầu."]},"b-163":{"q":"Phát biểu nào sau đây là một đặc điểm của thuật toán K-means?","options":["Nó bị giới hạn chỉ dùng khoảng cách Euclid (Euclidean distance) trong công thức của nó.","Để xác định số lượng cụm ta dùng phương pháp khuỷu tay (elbow method).","Có thể chậm khi tính toán khi số lượng quan sát tăng lên.","Nó bị giới hạn chỉ dùng khoảng cách Ward trong công thức của nó."]},"b-164":{"q":"Phát biểu nào sau đây mô tả đúng nhất phần lặp của thuật toán K-means?","options":["Thuật toán k-means gán một số lượng cụm một cách ngẫu nhiên.","Thuật toán k-means điều chỉnh các tâm cụm (centroid) về trung bình mới của mỗi cụm, rồi tiếp tục lặp lại quá trình này cho đến khi không còn ví dụ nào được gán sang cụm khác.","Thuật toán k-means lặp đi lặp lại việc xóa các điểm ngoại lai.","Thuật toán k-means lặp đi lặp lại việc tính khoảng cách từ mỗi điểm đến tâm cụm của từng cụm."]},"b-165":{"q":"Phát biểu nào sau đây là một trường hợp kinh doanh sử dụng khoảng cách Manhattan (L1)?","options":["Ta dùng nó trong các trường hợp kinh doanh có số chiều rất cao.","Ta dùng nó trong các trường hợp kinh doanh có số chiều thấp.","Ta dùng nó trong các trường hợp kinh doanh mà số chiều không xác định.","Ta dùng nó trong các trường hợp kinh doanh có điểm ngoại lai."]},"b-167":{"q":"Phát biểu nào mô tả tốt hơn \"Khởi tạo thông minh hơn cho các cụm K-mean\"?","options":["\"Vẽ một đường giữa các điểm dữ liệu để tạo ra 2 cụm lớn.\"","\"Sau khi tìm được các tâm cụm, ta tính khoảng cách giữa tất cả các điểm dữ liệu.\"","\"Chọn ngẫu nhiên một điểm làm điểm khởi đầu và với điểm thứ hai, thay vì chọn ngẫu nhiên, ta ưu tiên bằng cách gán xác suất theo khoảng cách.\"","\"Ta bắt đầu bằng việc đặt hai tâm cụm cách nhau xa nhất có thể.\""]},"b-168":{"q":"Tình huống nào nhiều khả năng được hưởng lợi nhất từ việc áp dụng SMOTE (Synthetic Minority Over-sampling Technique)?","options":["Khi dữ liệu huấn luyện có quá nhiều điểm ngoại lai ảnh hưởng đến các dự đoán của lớp đa số.","Khi các lớp cân bằng nhưng có các thang đo đặc trưng khác nhau cần chuẩn hóa.","Khi dữ liệu huấn luyện có thể phân tách tuyến tính nhưng chịu phương sai cao.","Khi một tập dữ liệu phân loại có phân phối giữa các lớp mất cân bằng nghiêm trọng, dẫn đến độ nhạy (recall) của lớp thiểu số kém."]},"b-169":{"q":"Phát biểu nào là một ứng dụng phổ biến của giảm chiều dữ liệu (Dimension Reduction) trong thực tế?","options":["Theo dõi hình ảnh","Giải thích mối quan hệ giữa lượng rượu tiêu thụ và bệnh tiểu đường.","Học sâu (Deep Learning)","Dự đoán liệu một khách hàng có quay lại cửa hàng để mua sắm lớn hay không."]},"b-170":{"q":"Việc lựa chọn tiêu chí phân tách (splitting criterion) ảnh hưởng đến mô hình cây quyết định (decision tree) như thế nào?","options":["Việc lựa chọn tiêu chí phân tách không có tác động đến mô hình cây quyết định.","Các tiêu chí phân tách khác nhau có thể dẫn đến các ranh giới quyết định và hiệu suất mô hình khác nhau.","Tiêu chí phân tách xác định độ sâu tối đa của cây.","Tiêu chí phân tách điều chỉnh cường độ điều chuẩn (regularization) của mô hình."]},"b-171":{"q":"Giải thích khái niệm tốc độ học (learning rate) trong các thuật toán Boosting như thế nào?","options":["Đó là tốc độ mà thuật toán học từ dữ liệu","Nó kiểm soát mức đóng góp của mỗi bộ học yếu (weak learner) vào dự đoán cuối cùng","Nó đo độ chính xác của mô hình","Nó xác định số vòng boosting"]},"b-172":{"q":"Khi áp dụng gom cụm K-means (K-means clustering), siêu tham số K đóng vai trò gì và nó ảnh hưởng đến kết quả như thế nào?","options":["K kiểm soát tốc độ học và tốc độ hội tụ","K xác định số lượng cụm, ảnh hưởng đến việc nhóm cuối cùng của các điểm dữ liệu","K biểu diễn số chiều của không gian đặc trưng","K không liên quan đến gom cụm; nó chỉ số lần lặp"]},"b-173":{"q":"Khi sử dụng các phương pháp bagging như Random Forest, tính ngẫu nhiên của đặc trưng (feature randomness) đóng vai trò gì trong quá trình huấn luyện từng cây riêng lẻ?","options":["Nó buộc mỗi cây quá khớp (overfit) với tập con của nó, cải thiện độ chính xác trên dữ liệu huấn luyện.","Nó giảm thời gian huấn luyện bằng cách loại bỏ nhu cầu đánh giá nhiều đặc trưng ở mỗi lần phân tách.","Nó đảm bảo rằng chỉ những đặc trưng quan trọng nhất được chọn trên tất cả các cây.","Nó làm giảm tương quan giữa các cây (decorrelate), giúp ensemble mạnh hơn và giảm phương sai mà không làm tăng độ chệch (bias) đáng kể."]},"b-174":{"q":"Khi nào gom cụm phân cấp gộp (hierarchical agglomerative clustering, HAC) được ưu tiên hơn K-Means?","options":["Khi bạn muốn có một biểu đồ cây (dendrogram) thể hiện các cụm lồng nhau mà không cần chỉ định trước số lượng cụm","Khi bạn cần gom cụm hàng triệu điểm dữ liệu một cách nhanh chóng, có khả năng mở rộng và tiết kiệm bộ nhớ.","Khi dữ liệu của bạn có các cụm hoàn toàn hình cầu và có kích thước bằng nhau, khiến K-Means tự nhiên hơn.","Khi bạn đang thực hiện chọn lọc đặc trưng (feature selection) và cần một thuật toán có điều chuẩn tích hợp sẵn."]},"b-175":{"q":"Tại sao ta cần một tiêu chí dừng (stopping criterion) khi sử dụng HAC?","options":["Thuật toán sẽ biến dữ liệu của ta thành các cụm nhỏ.","Thuật toán sẽ biến dữ liệu của ta thành chỉ một cụm.","Thuật toán sẽ không bắt đầu hoạt động nếu ta không chỉ định số lượng cụm.","Tiêu chí dừng đảm bảo các tâm cụm (centroid) được tính đúng."]},"b-176":{"q":"Giá trị p (p-value) là:","options":["mức ý nghĩa nhỏ nhất mà tại đó giả thuyết không (null hypothesis) sẽ bị bác bỏ","xác suất giả thuyết không là đúng","xác suất giả thuyết không là sai","mức ý nghĩa nhỏ nhất mà tại đó giả thuyết không được chấp nhận"]},"b-177":{"q":"Một mô hình học máy có sai số huấn luyện giảm liên tục nhưng sai số trên tập kiểm tra bắt đầu tăng khi độ phức tạp của nó tăng lên. Giải thích nào mô tả đúng nhất tình huống này?","options":["Mô hình quá đơn giản và không nắm bắt được các mẫu tiềm ẩn trong dữ liệu, dẫn đến dưới khớp (underfitting).","Tập dữ liệu quá lớn để mô hình học được điều gì có ý nghĩa, gây mất ổn định ở cả sai số huấn luyện và kiểm tra.","Mô hình quá phức tạp, nắm bắt cả nhiễu và các mẫu riêng biệt trong dữ liệu huấn luyện, làm giảm khả năng khái quát hóa (generalize) cho dữ liệu mới, dẫn đến quá khớp (overfitting).","Các đặc trưng của mô hình chưa được chuẩn hóa (normalize) hoặc tiêu chuẩn hóa (standardize) đúng cách, khiến sự khác biệt về thang đo chi phối quá trình học."]},"b-178":{"q":"Trong các loại học máy (Machine Learning), phương pháp nào hoạt động bằng cách cung cấp cho mô hình một tập dữ liệu có nhãn (gồm cả đầu vào và đầu ra đúng), để mô hình có thể học cách đưa ra dự đoán cho dữ liệu mới?","options":["Học tăng cường (Reinforcement Learning) - học thông qua thử, sai và phần thưởng.","Học có giám sát (Supervised Learning) - học với dữ liệu có nhãn.","Học không giám sát (Unsupervised Learning) - học từ dữ liệu không có nhãn.","Học sâu (Deep Learning) - một nhánh đặc biệt của Machine Learning dựa trên mạng nơ-ron nhiều lớp."]},"b-179":{"q":"Theo các đầu vào bắt buộc của DBSCAN, phát biểu nào mô tả đầu vào n_clu?","options":["Hàm để tính khoảng cách.","Bán kính của vùng lân cận cục bộ.","Xác định ngưỡng mật độ (với ε cố định) (Số lượng điểm tối thiểu để một điểm cụ thể được coi là điểm lõi (core point) của một cụm).","Số lượng quan sát tối đa để một điểm cụ thể được coi là điểm lõi của một cụm."]},"b-180":{"q":"CẢ hồi quy Ridge (Ridge regression) và hồi quy Lasso (Lasso regression)","options":["không điều chỉnh hàm chi phí dùng để ước lượng mô hình.","thêm một số hạng vào hàm mất mát (loss function) tỷ lệ với một tham số điều chuẩn (regularization parameter).","thêm một số hạng vào hàm mất mát tỷ lệ với bình phương của các hệ số tham số.","thêm một số hạng vào hàm mất mát tỷ lệ với giá trị tuyệt đối của các hệ số tham số."]},"b-182":{"q":"Nếu một mô hình cây quyết định (decision tree) đơn lẻ bị quá khớp (overfit) dữ liệu, một phương pháp ensemble như Random Forest có thể giúp như thế nào?","options":["Bằng cách xây dựng nhiều cây trên các tập dữ liệu bootstrap và lấy trung bình các dự đoán của chúng.","Bằng cách cắt tỉa cây ban đầu và áp dụng hồi quy logistic lên các phần dư (residual).","Bằng cách kết hợp nhiều phương pháp kernel để tạo ra ranh giới quyết định linh hoạt hơn.","Bằng cách buộc mỗi cây chỉ dùng các vector hỗ trợ (support vector) làm đầu vào trong quá trình huấn luyện."]},"b-183":{"q":"Trong PCA, tỷ lệ phương sai giải thích (explained variance ratio) của mỗi thành phần chính (principal component) giúp xác định số lượng thành phần tối ưu như thế nào?","options":["Bằng cách chọn các thành phần có tỷ lệ phương sai giải thích cao nhất","Bằng cách chọn các thành phần có tỷ lệ phương sai giải thích thấp nhất","Bằng cách bỏ qua tỷ lệ phương sai giải thích và luôn dùng tất cả các thành phần","Bằng cách dùng tỷ lệ phương sai giải thích tích lũy để tìm điểm khuỷu tay (elbow point) trong biểu đồ scree"]},"b-184":{"q":"Trong kiểm định chéo k-fold (k-fold cross-validation), việc tăng k sẽ ảnh hưởng thế nào đến phương sai (giữa các mẫu con) của các tham số mô hình được ước lượng?","options":["Việc tăng k sẽ không ảnh hưởng đến phương sai của các tham số được ước lượng.","Việc tăng k thường sẽ làm giảm phương sai của các tham số được ước lượng.","Việc tăng k thường sẽ làm tăng phương sai của các tham số được ước lượng.","Việc tăng k sẽ làm tăng phương sai của các tham số được ước lượng nếu mô hình bị dưới khớp (underfit), nhưng làm giảm nếu mô hình bị quá khớp (overfit)."]},"b-185":{"q":"Trong SVM, mục đích của các vector hỗ trợ (support vector) là gì?","options":["Chúng được dùng để xác định lề (margin) giữa các lớp.","Chúng là các điểm ngoại lai bị bỏ qua trong quá trình huấn luyện.","Chúng là các điểm dữ liệu nằm gần ranh giới quyết định (decision boundary) nhất.","Chúng là các trọng số được gán cho các đặc trưng trong dữ liệu đầu vào."]},"b-186":{"q":"Trong thống kê tần suất (Frequentist statistics), khoảng tin cậy (confidence interval) 95% cho giá trị trung bình của một tập dữ liệu có nghĩa là:","options":["Có xác suất 95% rằng giá trị trung bình thực nằm trong khoảng cụ thể này.","Nếu thí nghiệm giống nhau được lặp lại nhiều lần, khoảng 95% các khoảng được tính sẽ chứa giá trị trung bình thực.","Giá trị trung bình sẽ thay đổi 95% số lần tùy thuộc vào cỡ mẫu.","Khoảng tin cậy luôn chứa chính xác 95% số điểm dữ liệu."]},"b-187":{"q":"Trong một mô hình SVM, mục đích chính của tham số điều chuẩn (regularization parameter) C trong hàm chi phí là gì?","options":["C co giãn tất cả các đặc trưng đầu vào để mỗi đặc trưng đóng góp như nhau vào các phép tính khoảng cách trong mô hình.","C xác định hàm kernel nào sẽ được thuật toán tự động chọn để phân loại.","C kiểm soát sự cân bằng giữa việc cực đại hóa lề (margin) và cực tiểu hóa phân loại sai, cho phép mô hình chấp nhận một số lỗi đồng thời giảm quá khớp (overfitting).","C giới hạn số lượng vector hỗ trợ có thể được đưa vào để xác định ranh giới quyết định của mô hình."]},"b-188":{"q":"Đây là hai ưu điểm chính của cây quyết định (decision tree):","options":["Chúng không có xu hướng quá khớp (overfit) và không nhạy cảm với các thay đổi trong dữ liệu","Chúng rất trực quan và dễ diễn giải","Chúng chống chịu được điểm ngoại lai (outlier) và đầu ra là các đặc trưng đã được co giãn","Chúng đưa ra cả các tham số lẫn các mức ý nghĩa"]},"b-189":{"q":"Đây là cách tốt nhất để chọn số lượng cây cần xây dựng trong một ensemble Bagging.","options":["Chọn một số lượng cây lớn, thường trên 100","Ưu tiên các chỉ số sai số huấn luyện hơn mẫu out of bag","Điều chỉnh số lượng cây như một siêu tham số (hyperparameter) cần được tối ưu","Chọn số lượng cây vượt quá điểm lợi ích giảm dần (diminishing returns)"]},"b-190":{"q":"Tùy chọn này mô tả một cách biến đổi bài toán hồi quy thành bài toán phân loại:","options":["Tạo một biến mới đánh dấu 1 nếu trên một giá trị nhất định và 0 trong trường hợp còn lại","Dùng xử lý điểm ngoại lai (outlier)","Dùng xử lý giá trị thiếu (missing value)","Tạo một biến mới dùng autoencoding để biến đổi kết quả liên tục thành biến phân loại"]},"b-192":{"q":"Kỹ thuật lấy mẫu phân tầng (stratified sampling) trong học máy được dùng để?","options":["Tạo một tập dữ liệu cân bằng","Giảm số lượng đặc trưng","Đảm bảo mỗi lớp được đại diện theo tỷ lệ trong cả tập huấn luyện và tập kiểm tra","Tăng kích thước của tập dữ liệu"]},"b-193":{"q":"Sự khác biệt giữa khoảng cách Euclid (Euclidean distance) và khoảng cách Manhattan (Manhattan distance) là","options":["Khoảng cách Euclid chỉ xét các chuyển động ngang hoặc dọc, trong khi khoảng cách Manhattan cho phép chuyển động chéo.","Khoảng cách Euclid là tổng các chênh lệch tuyệt đối, trong khi khoảng cách Manhattan là tổng các chênh lệch bình phương.","Khoảng cách Euclid đo khoảng cách đường thẳng, trong khi khoảng cách Manhattan đo tổng các chênh lệch tuyệt đối dọc theo từng chiều","Khoảng cách Euclid chỉ áp dụng cho dữ liệu số, trong khi khoảng cách Manhattan được dùng cho dữ liệu phân loại"]},"b-194":{"q":"Phát biểu sau đây là ví dụ về một trường hợp kinh doanh mà ta có thể dùng khoảng cách Cosine (Cosine Distance)?","options":["Cosine hữu ích cho các phép đo dựa trên tọa độ.","Cosine tốt hơn cho dữ liệu như văn bản, nơi vị trí xuất hiện ít quan trọng hơn.","Khoảng cách Cosine nhạy cảm hơn với lời nguyền số chiều (curse of dimensionality)","Khoảng cách Cosine ít nhạy cảm hơn với lời nguyền số chiều (curse of dimensionality)"]},"b-195":{"q":"Mục đích chính của việc co giãn (scale) các đặc trưng trước khi khớp một mô hình k láng giềng gần nhất (k nearest neighbor) là:","options":["Giúp tìm giá trị phù hợp của k","Đảm bảo các ranh giới quyết định có kích thước gần như nhau cho tất cả các lớp","Đảm bảo các đặc trưng có ảnh hưởng tương tự lên phép tính khoảng cách","Phá thế hòa trong trường hợp có cùng số lượng láng giềng thuộc các lớp khác nhau ở cạnh một quan sát cho trước"]},"b-196":{"q":"Sự đánh đổi độ chệch-phương sai (bias-variance tradeoff) là một khái niệm quan trọng trong lựa chọn mô hình. Phát biểu nào mô tả đúng nhất sự đánh đổi này?","options":["Tăng độ phức tạp của mô hình luôn làm giảm đồng thời cả độ chệch và phương sai.","Độ chệch và phương sai hoàn toàn độc lập và có thể được cực tiểu hóa riêng rẽ trong bất kỳ mô hình nào.","Khi độ phức tạp của mô hình tăng, độ chệch giảm và phương sai tăng, do đó mục tiêu là cân bằng cả hai để cực tiểu hóa tổng sai số.","Một mô hình có cả độ chệch cao và phương sai cao sẽ đạt sai số kiểm tra thấp nhất vì hai sai số triệt tiêu lẫn nhau."]},"b-197":{"q":"Chọn phương án hoàn thành câu sau một cách tốt nhất:\nĐối với dữ liệu có nhiều đặc trưng, phân tích thành phần chính (principal components analysis)","options":["xác định những đặc trưng nào có thể bị loại bỏ một cách an toàn","giảm số lượng đặc trưng mà không mất bất kỳ thông tin nào.","thiết lập số lượng đặc trưng khả thi tối thiểu để dùng trong phân tích.","tạo ra các đặc trưng mới là tổ hợp tuyến tính của các đặc trưng ban đầu."]},"b-198":{"q":"Thông thường bước đầu tiên để khớp một bộ phân loại k láng giềng gần nhất (k nearest neighbor classifier) bằng scikit learn là:","options":["nhập KNN từ module sklearn.knearest neighbors\nví dụ: from sklearn.knearestneighbors import KNN","nhập KNeighbors Classifier từ module sklearn.neighbors\nví dụ: from sklearn.neighbors import KNeighborsClassifier","nhập Classifier từ module sklearn.nearestneighbors\nví dụ: from sklearn.nearestneighbors import Classifier","nhập KNNClassifier từ module sklearn.knearestneighbors\nví dụ: from sklearn.knearest neighbors import KNNClassifier"]},"b-199":{"q":"Thông thường bước đầu tiên để khớp một mô hình hồi quy logistic (logistic regression) bằng scikit learn là:","options":["nhập logistic regression từ module sklearn.linear_model\nví dụ: from sklearn.linear_model import LogisticRegression","nhập Logistic từ module sklearn.regression\nví dụ: from sklearn.regression import Logistic","nhập Logistic từ module sklearn.linear_regression\nví dụ: from sklearn.linear_regression import Logistic","nhập logistic regression từ module sklearn.linear classifier\nví dụ: from sklearn.linearclassifier import Logistic Regression"]},"b-200":{"q":"Mục đích của kỹ thuật đặc trưng (feature engineering) trong quy trình học máy là gì?","options":["Chọn các đặc trưng quan trọng nhất trong tập dữ liệu","Tạo các đặc trưng mới hoặc biến đổi các đặc trưng hiện có để cải thiện hiệu suất mô hình","Huấn luyện mô hình học máy","Đánh giá hiệu suất của mô hình trên tập kiểm tra"]},"b-201":{"q":"Mục đích chính của việc thực hiện phân tích khám phá dữ liệu (Exploratory Data Analysis, EDA) trên một tập dữ liệu là gì?","options":["Để huấn luyện và đánh giá một mô hình học máy dự đoán.","Để loại bỏ tất cả lỗi và giá trị thiếu khỏi tập dữ liệu.","Để có được những hiểu biết ban đầu về dữ liệu, phát hiện các xu hướng và làm nổi bật các điểm bất thường.","Để chuyển đổi tập dữ liệu sang một định dạng tệp khác (ví dụ: CSV sang Excel)."]},"b-202":{"q":"Sự khác biệt giữa phương pháp tham số (parametric) và phi tham số (non-parametric) trong suy luận thống kê là gì?","options":["Các phương pháp tham số giả định một phân phối cụ thể cho dữ liệu, trong khi các phương pháp phi tham số không đưa ra giả định nào về phân phối nền tảng","Các phương pháp tham số chỉ áp dụng cho cỡ mẫu lớn, trong khi các phương pháp phi tham số phù hợp với mọi cỡ mẫu","Các phương pháp tham số được dùng để ước lượng các tham số tổng thể, trong khi các phương pháp phi tham số tập trung vào việc tóm tắt dữ liệu","Các phương pháp tham số tốn ít tính toán hơn các phương pháp phi tham số"]},"b-203":{"q":"Một nhà khoa học dữ liệu đang so sánh ba mô hình có độ phức tạp tăng dần trên cùng một tập dữ liệu. Sai số huấn luyện giảm đều đặn ở cả ba mô hình, nhưng sai số kiểm định (validation error) ban đầu giảm rồi bắt đầu tăng ở mô hình phức tạp nhất. Cô quyết định áp dụng kiểm định chéo 10-fold (10-fold cross-validation) để đánh giá từng mô hình tốt hơn. Phát biểu nào giải thích tốt nhất tại sao kiểm định chéo đặc biệt hữu ích trong trường hợp này?","options":["Nó cho phép nhà khoa học dữ liệu gộp tập huấn luyện và tập kiểm tra thành một tập dữ liệu lớn, điều này đảm bảo độ chính xác huấn luyện cao hơn cho tất cả các mô hình.","Nó cung cấp nhiều lần chia ngẫu nhiên dữ liệu huấn luyện, tạo ra các ước lượng ổn định hơn về hiệu suất khái quát hóa (generalization) của từng mô hình và cho thấy điểm mà tại đó việc tăng độ phức tạp dẫn đến quá khớp (overfitting).","Nó đảm bảo tất cả các mô hình đạt sai số tối thiểu trên dữ liệu huấn luyện bằng cách liên tục điều chỉnh các tham số mô hình dùng các fold khác nhau của cùng một tập dữ liệu.","Nó tự động loại bỏ nhiễu và điểm ngoại lai khỏi tập dữ liệu, ngăn các mô hình phức tạp hơn khớp với bất kỳ mẫu bất thường nào trong dữ liệu."]},"b-204":{"q":"Tình huống nào sau đây nhiều khả năng được hưởng lợi nhất từ việc dùng hồi quy logistic (Logistic Regression) thay vì KNN?","options":["Khi mục tiêu là khả năng diễn giải và hiểu đóng góp của từng đặc trưng.","Khi dữ liệu có các mẫu phức tạp và đòi hỏi ranh giới quyết định rất linh hoạt.","Khi việc ra quyết định dựa trên mẫu (instance-based) là then chốt cho độ chính xác dự đoán cục bộ.","Khi số lượng mẫu huấn luyện rất nhỏ so với số lượng đặc trưng."]},"b-205":{"q":"Trong SVM, việc đặt giá trị rất lớn cho tham số điều chuẩn (regularization parameter) C có tác động gì?","options":["Mô hình trở nên nghiêm ngặt hơn trong việc cực tiểu hóa phân loại sai, có thể khớp cả nhiễu và dẫn đến khái quát hóa kém.","Lề (margin) trở nên rộng hơn, làm tăng độ vững của mô hình đối với nhiễu và cải thiện độ chính xác.","Mô hình cho phép nhiều biến chùng (slack variable) hơn, làm tăng độ chệch (bias) và dưới khớp (underfitting) dữ liệu huấn luyện.","Kernel trở nên phức tạp hơn, đòi hỏi tinh chỉnh thêm tham số gamma để đạt hiệu suất tối ưu."]},"b-206":{"q":"Đặc điểm then chốt của máy vector hỗ trợ (Support Vector Machine) là gì?","options":["Các mô hình Support Vector Machine hiếm khi quá khớp (overfit) trên dữ liệu huấn luyện.","Các mô hình Support Vector Machine là phi tuyến.","Các mô hình Support Vector Machine có thể dùng cho phân loại nhưng không dùng cho hồi quy.","Các mô hình Support Vector Machine có thể dùng cho hồi quy nhưng không dùng cho phân loại."]},"b-207":{"q":"Trong học ensemble (ensemble learning), chiến lược nào mô tả đúng nhất cách stacking hoạt động?","options":["Nó điều chỉnh trọng số mô hình một cách lặp để tập trung vào các ví dụ khó và cực đại hóa độ chính xác.","Nó huấn luyện nhiều mô hình trên cùng dữ liệu và lấy trung bình các dự đoán của chúng mà không có bước học bổ sung.","Nó chỉ chọn mô hình hoạt động tốt nhất trong số tất cả các mô hình đã huấn luyện để đưa ra dự đoán cuối cùng.","Nó kết hợp nhiều mô hình cơ sở (base model) và huấn luyện một mô hình meta (meta-model) để học cách tối ưu nhằm hợp nhất các dự đoán của chúng."]},"b-208":{"q":"Một nhà khoa học dữ liệu đang dùng Random Forest để xử lý một tập dữ liệu mất cân bằng (imbalanced). Kỹ thuật bổ sung nào có thể cải thiện hiệu suất của mô hình trên lớp thiểu số?","options":["Giảm số lượng cây để tránh quá khớp với lớp đa số.","Chỉ chọn các đặc trưng có tương quan thấp trước khi huấn luyện rừng.","Dùng kích thước mẫu bootstrap nhỏ hơn cho mỗi cây để tập trung nhiều hơn vào lớp thiểu số.","Áp dụng trọng số lớp (class weighting) để phạt nặng hơn các phân loại sai của lớp thiểu số."]},"b-209":{"q":"Những vấn đề tiềm ẩn nào có thể phát sinh khi loại bỏ các mẫu khỏi lớp đa số trong trường hợp lấy mẫu giảm (downsampling)?","options":["Tăng khả năng diễn giải của mô hình","Cải thiện sự hội tụ của mô hình","Mất thông tin có giá trị và tính đại diện của lớp đa số","Giảm nguy cơ quá khớp (overfitting)"]},"b-210":{"q":"Tại sao việc co giãn (scale) các đặc trưng trước khi áp dụng gom cụm K-Means (K-Means clustering) lại quan trọng?","options":["Vì K-Means dựa trên khoảng cách Euclid (Euclidean distance), và các đặc trưng có thang đo lớn hơn có thể chi phối kết quả gom cụm.","Vì K-Means tự động chuẩn hóa các khoảng cách bên trong, và việc co giãn ngăn chặn hành vi này.","Vì K-Means hoạt động tốt hơn khi các biến phân loại được mã hóa thành các giá trị số lớn.","Vì K-Means chỉ dùng thứ hạng của các đặc trưng, và việc co giãn giúp bảo toàn thứ tự của các đặc trưng."]},"b-211":{"q":"Sự khác biệt giữa liên kết đơn (single linkage) và liên kết đầy đủ (complete linkage) trong gom cụm phân cấp gộp (hierarchical agglomerative clustering) là gì?","options":["Liên kết đơn đo khoảng cách tối đa giữa các cụm, trong khi liên kết đầy đủ đo khoảng cách tối thiểu","Liên kết đơn đo khoảng cách tối thiểu giữa các điểm gần nhất ở các cụm
