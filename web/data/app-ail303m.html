 biên giúp tăng độ chính xác, nhưng đổi lại mô hình ít nhạy cảm với việc ước lượng xác suất."},{"id":"r-m2-020","module":"m2","ref":"2.4","type":"recall","kind":"manual","q":"Trong scikit-learn, để khởi tạo một mô hình SVM tuyến tính với hàm mất mát Hinge, ta sử dụng cú pháp nào?","correct":"`LinearSVC(C=1.0, loss='hinge', max_iter=10000)`","wrong":["`SVC(kernel='rbf', loss='sse')`","`SGDClassifier(loss='log_loss')`","`LogisticRegression(penalty='hinge')`"],"explain":"Cú pháp khởi tạo Linear SVM với Hinge Loss trong sklearn là `LinearSVC(C=1.0, loss='hinge', max_iter=10000)`."},{"id":"r-m2-021","module":"m2","ref":"2.5","type":"recall","kind":"manual","q":"Mô hình SVM có đặc điểm như thế nào đối với các điểm dữ liệu ngoại lai (Outliers)?","correct":"Có thể bị ảnh hưởng bởi các điểm ngoại lai, làm thay đổi đáng kể ranh giới quyết định nếu không xử lý đúng cách","wrong":["Hoàn toàn miễn nhiễm với dữ liệu ngoại lai nhờ cơ chế tự động cắt tỉa nhánh","Tự động biến đổi các điểm ngoại lai về trung tâm phân phối chuẩn","Luôn loại bỏ các điểm ngoại lai ra khỏi tập dữ liệu trước khi tối ưu siêu phẳng"],"explain":"SVM rất nhạy cảm với outliers; các điểm ngoại lai nằm gần hoặc lọt vào vùng phân tách có thể kéo lệch siêu phẳng đáng kể."},{"id":"r-m2-022","module":"m2","ref":"2.5","type":"recall","kind":"manual","q":"Vai trò của tham số điều chuẩn C trong mô hình SVM là gì?","correct":"Kiểm soát sự cân bằng giữa việc tối đa hóa khoảng cách (margin) và tối thiểu hóa lỗi phân loại","wrong":["Quy định số lượng điểm lân cận cần xem xét để gán nhãn cho một mẫu","Xác định số lượng cây quyết định cơ sở trong mô hình học kết hợp","Đo lường mức độ giảm độ vẩn đục Entropy sau mỗi lần chia nhánh"],"explain":"Tham số C trong SVM đóng vai trò kiểm soát sự đánh đổi giữa độ rộng của margin và số lượng lỗi phân loại được chấp nhận."},{"id":"r-m2-023","module":"m2","ref":"2.5","type":"recall","kind":"manual","q":"Khi thiết lập giá trị tham số C nhỏ trong SVM, mô hình sẽ có xu hướng hành xử như thế nào?","correct":"Cho phép nhiều lỗi phân loại hơn để đạt được khoảng cách (margin) lớn hơn, giúp giảm hiện tượng quá khớp (overfitting)","wrong":["Cố gắng phân loại đúng tất cả các điểm dữ liệu bằng mọi giá, dẫn đến margin hẹp và dễ bị overfitting","Triệt tiêu hoàn toàn tất cả các vectơ hỗ trợ ra khỏi mô hình","Tự động chuyển đổi từ nhân tuyến tính sang nhân Gaussian RBF"],"explain":"C nhỏ phạt lỗi nhẹ hơn, chấp nhận một số lỗi để tạo ra margin rộng và phẳng hơn, giúp mô hình tổng quát hóa tốt hơn (giảm overfitting)."},{"id":"r-m2-024","module":"m2","ref":"2.5","type":"recall","kind":"manual","q":"Hậu quả có thể xảy ra khi ta thiết lập giá trị tham số C quá lớn trong SVM là gì?","correct":"Khoảng cách (margin) bị thu hẹp lại để cố gắng phân loại đúng mọi điểm, dễ dẫn đến hiện tượng quá khớp (overfitting)","wrong":["Mô hình bỏ qua hầu hết dữ liệu huấn luyện dẫn đến hiện tượng dưới khớp nghiêm trọng","Thời gian tính toán dự đoán giảm về mức bằng 0","Thuật toán bắt buộc phải gán nhãn -1 cho tất cả các điểm biên"],"explain":"C lớn phạt lỗi phân loại rất nặng, ép mô hình phải phân loại đúng mọi điểm, làm cho margin hẹp lại và dễ bị overfitting."},{"id":"r-m2-025","module":"m2","ref":"2.6","type":"recall","kind":"manual","q":"Ý nghĩa cốt lõi của kỹ thuật Kernel Trick trong SVM là gì?","correct":"Thực hiện phân loại phi tuyến tính bằng cách ánh xạ dữ liệu vào không gian nhiều chiều hơn mà không cần tính toán trực tiếp tọa độ","wrong":["Giảm chiều dữ liệu từ không gian nhiều chiều về không gian 2 chiều để tăng tốc độ tính toán","Chuyển đổi bài toán phân loại có giám sát thành bài toán phân cụm không giám sát","Lấy mẫu ngẫu nhiên có thay thế trên tập dữ liệu để xây dựng các mô hình độc lập"],"explain":"Kernel Trick cho phép tính tích vô hướng trong không gian chiều cao mà không cần trực tiếp tính toán tọa độ ánh xạ của các điểm."},{"id":"r-m2-026","module":"m2","ref":"2.6","type":"recall","kind":"manual","q":"Loại Kernel nào thường được sử dụng trong SVM để biến đổi dữ liệu phi tuyến tính sao cho có thể phân tách bằng siêu phẳng?","correct":"Gaussian (RBF) Kernel","wrong":["Linear Kernel","Manhattan Kernel","Jaccard Kernel"],"explain":"Gaussian (RBF) Kernel là nhân phi tuyến phổ biến nhất, giúp ánh xạ dữ liệu phức tạp thành không gian có thể phân tách tuyến tính."},{"id":"r-m2-027","module":"m2","ref":"2.6","type":"recall","kind":"manual","q":"Trong mô hình `SVC(kernel='rbf', gamma='scale')`, tham số `gamma` có vai trò gì?","correct":"Kiểm soát tầm ảnh hưởng của một điểm dữ liệu huấn luyện duy nhất","wrong":["Xác định số lượng cụm K cần phân tách trong không gian","Giới hạn độ sâu tối đa của siêu phẳng phân cách","Đo lường mức độ tương quan đa biến giữa các cặp đặc trưng"],"explain":"Tham số gamma trong RBF kernel xác định bán kính ảnh hưởng của từng điểm huấn luyện (gamma lớn thì tầm ảnh hưởng hẹp, gamma nhỏ thì tầm ảnh hưởng rộng)."},{"id":"r-m2-028","module":"m2","ref":"2.6","type":"recall","kind":"manual","q":"Loại Kernel nào trong SVM thích hợp nhất khi dữ liệu ban đầu vốn đã có khả năng phân tách tuyến tính?","correct":"Linear Kernel","wrong":["Gaussian (RBF) Kernel","Polynomial Kernel bậc 5","Sigmoid Kernel phi tuyến"],"explain":"Nếu dữ liệu có thể phân tách tuyến tính trong không gian ban đầu, Linear Kernel là lựa chọn đơn giản và hiệu quả nhất."},{"id":"r-m2-029","module":"m2","ref":"2.7","type":"recall","kind":"manual","q":"Hạn chế lớn nhất về mặt hiệu năng của các phương pháp Kernel truyền thống trong SVM là gì?","correct":"Chạy rất chậm đối với các tập dữ liệu lớn hơn vài nghìn mẫu nếu không xử lý song song","wrong":["Không thể tìm thấy ranh giới quyết định cho dữ liệu có từ 2 thuộc tính trở lên","Bắt buộc dữ liệu huấn luyện phải tuân theo phân phối Poisson","Luôn làm cho hệ số xác định R-squared giảm xuống dưới 0"],"explain":"Kernel SVM truyền thống yêu cầu tính toán ma trận Gram có kích thước N x N, nên cực kỳ chậm khi kích thước dữ liệu vượt quá vài nghìn mẫu."},{"id":"r-m2-030","module":"m2","ref":"2.7","type":"recall","kind":"manual","q":"Kỹ thuật RBFSampler (Random Fourier Features) giúp tăng tốc độ huấn luyện mô hình SVM bằng cách nào?","correct":"Xấp xỉ ánh xạ đặc trưng cho kernel RBF, giúp mô hình huấn luyện nhanh hơn trên các tập dữ liệu lớn","wrong":["Loại bỏ ngẫu nhiên 90% số lượng hàng trong tập dữ liệu huấn luyện","Thay thế toàn bộ các phép đo khoảng cách Euclidean bằng khoảng cách Manhattan","Chuyển đổi nhãn phân loại thành các giá trị số thực liên tục"],"explain":"RBFSampler sử dụng các đặc trưng Fourier ngẫu nhiên để xấp xỉ ánh xạ đặc trưng RBF, chuyển bài toán sang dạng tuyến tính trên tập đặc trưng mới."},{"id":"r-m2-031","module":"m2","ref":"2.7","type":"recall","kind":"manual","q":"Kỹ thuật Nystroem trong tối ưu hóa SVM phục vụ mục đích gì?","correct":"Xấp xỉ ánh xạ đặc trưng kernel nhằm tăng tốc quá trình huấn luyện","wrong":["Cắt tỉa các nhánh cây quyết định có độ sâu vượt mức cho phép","Gán nhãn cho các điểm dữ liệu nhiễu trong thuật toán DBSCAN","Ước lượng băng thông tối ưu cho thuật toán Mean-Shift"],"explain":"Phương pháp Nystroem xấp xỉ ma trận kernel thông qua một tập con các mẫu dữ liệu, giúp giảm khối lượng tính toán."},{"id":"r-m2-032","module":"m2","ref":"2.7","type":"recall","kind":"manual","q":"Trong đoạn mã minh họa tăng tốc với `RBFSampler`, mô hình tuyến tính nhanh nào được sử dụng trên các đặc trưng mới được tạo ra?","correct":"`SGDClassifier(max_iter=1000)`","wrong":["`DecisionTreeClassifier(max_depth=5)`","`KNeighborsClassifier(n_neighbors=3)`","`AgglomerativeClustering(linkage='ward')`"],"explain":"Sau khi RBFSampler ánh xạ dữ liệu sang không gian đặc trưng mới, mô hình tuyến tính nhanh SGDClassifier được dùng để huấn luyện hiệu quả."},{"id":"r-m2-033","module":"m2","ref":"2.8","type":"recall","kind":"manual","q":"Bước đầu tiên trong Quy trình làm việc cơ bản (Workflow) khi huấn luyện mô hình SVM là gì?","correct":"Thu thập và chuẩn bị dữ liệu (Gán nhãn, chuẩn hóa đặc trưng)","wrong":["Điều chỉnh siêu tham số C và gamma qua kiểm chéo","Chọn loại Kernel phi tuyến phù hợp","Đánh giá mô hình trên tập dữ liệu kiểm tra cuối cùng"],"explain":"Workflow SVM bắt đầu từ: 1. Thu thập và chuẩn bị dữ liệu (Gán nhãn, chuẩn hóa đặc trưng) -> 2. Chọn Kernel -> 3. Tinh chỉnh siêu tham số -> 4. Đánh giá."},{"id":"r-m2-034","module":"m2","ref":"2.8","type":"recall","kind":"manual","q":"Sau khi đã chọn loại Kernel phù hợp, bước tiếp theo trong quy trình làm việc với SVM là gì?","correct":"Điều chỉnh các siêu tham số (C, gamma) thông qua kiểm chéo (Cross-validation)","wrong":["Thu thập lại dữ liệu từ đầu từ các nguồn API hoặc NoSQL","Biến đổi nhãn phân loại bằng kỹ thuật One-hot encoding","Triển khai ngay mô hình vào hệ thống sản xuất mà không cần đánh giá"],"explain":"Sau khi chọn Kernel, bước thứ 3 là tinh chỉnh siêu tham số (C, gamma) bằng Cross-validation trước khi đánh giá và dự đoán."},{"id":"r-m2-035","module":"m2","ref":"2.8","type":"recall","kind":"manual","q":"Tại sao việc chuẩn hóa đặc trưng là thao tác bắt buộc trong bước chuẩn bị dữ liệu của SVM?","correct":"Để đảm bảo các biến có đơn vị lớn không chi phối việc tính toán khoảng cách và độ rộng của biên (margin)","wrong":["Để biến đổi các điểm dữ liệu ngoại lai thành các điểm nằm trên siêu phẳng","Để ép buộc hàm mất mát Hinge Loss luôn đạt giá trị bằng đúng 0","Để loại bỏ hoàn toàn yêu cầu phải chia dữ liệu thành tập Train và Test"],"explain":"Biên margin của SVM phụ thuộc vào khoảng cách hình học; nếu không chuẩn hóa đặc trưng, các biến có thang đo lớn sẽ áp đặt siêu phẳng phân tách."},{"id":"r-m3-001","module":"m3","ref":"3.1","type":"recall","kind":"manual","q":"Về bản chất thuật toán, Cây Quyết định (Decision Tree) hoạt động dựa trên nguyên lý giải thuật nào?","correct":"Thuật toán tham lam (greedy algorithm) phân tách dữ liệu dựa trên các thước đo độ vẩn đục (impurity measures)","wrong":["Thuật toán quy hoạch động tối ưu hóa toàn cục các đường phân cách","Thuật toán bầy đàn tối thiểu hóa khoảng cách giữa các điểm dữ liệu","Thuật toán hạ độ dốc ngẫu nhiên cực tiểu hóa hàm mất mát Hinge Loss"],"explain":"Cây Quyết định là thuật toán tham lam (greedy algorithm) lựa chọn phân tách tối ưu cục bộ tại mỗi nút dựa trên các thước đo độ vẩn đục.","tip":"Cây quyết định = greedy algorithm + impurity measures."},{"id":"r-m3-002","module":"m3","ref":"3.1","type":"recall","kind":"manual","q":"Khi so sánh tốc độ Dự đoán (Prediction) với KNN và Hồi quy Logistic, Cây Quyết định có đặc điểm gì?","correct":"Rất nhanh, vì chỉ cần duyệt theo các nhánh cây từ gốc xuống lá","wrong":["Chậm nhất, vì phải tính khoảng cách với toàn bộ các điểm dữ liệu trong tập huấn luyện","Rất chậm, vì phải giải hệ phương trình tối ưu hóa tại thời điểm nhận mẫu mới","Tương đương với KNN vì cả hai đều là mô hình học lười (Lazy learner)"],"explain":"Trong giai đoạn dự đoán, Cây Quyết định duyệt qua các điều kiện phân nhánh rất nhanh chóng, vượt trội hơn KNN vốn phải quét khoảng cách toàn bộ tập mẫu.","tip":"Dự đoán: Cây quyết định duyệt nhánh cực nhanh."},{"id":"r-m3-003","module":"m3","ref":"3.1","type":"recall","kind":"manual","q":"Đặc điểm của ranh giới quyết định (Decision Boundary) trong mô hình Cây Quyết định là gì?","correct":"Có cấu trúc trực quan và mang tính phân cấp (hierarchical)","wrong":["Là một siêu phẳng phẳng tuyệt đối không có tính phân cấp","Là đường cong mịn được định nghĩa bởi hàm kích hoạt Sigmoid","Luôn cố định và không thể thay đổi khi thêm dữ liệu huấn luyện mới"],"explain":"Ranh giới quyết định của Cây Quyết định được tạo bởi các phép cắt trực giao từng bước theo đặc trưng, mang tính phân cấp và rất trực quan.","tip":"Cây quyết định: ranh giới trực quan, phân cấp."},{"id":"r-m3-004","module":"m3","ref":"3.1","type":"recall","kind":"manual","q":"Thước đo Entropy trong cơ chế phân tách của Cây Quyết định phản ánh điều gì?","correct":"Mức độ hỗn loạn của thông tin trong tập dữ liệu","wrong":["Khoảng cách biên cực đại giữa hai lớp phân loại đối nghịch","Số lượng mẫu tối thiểu cần thiết để tạo một nút lá mới","Tỷ lệ giữa các mẫu dự đoán đúng và tổng số mẫu kiểm tra"],"explain":"Entropy là thước đo mức độ hỗn loạn (độ vẩn đục) của thông tin; entropy càng cao thì dữ liệu tại nút càng hỗn tạp.","tip":"Entropy = độ hỗn loạn thông tin."},{"id":"r-m3-005","module":"m3","ref":"3.1","type":"recall","kind":"manual","q":"Khái niệm Information Gain (Độ lợi thông tin) được định nghĩa như thế nào?","correct":"Độ lệch giữa entropy trước và sau khi phân tách dữ liệu","wrong":["Tổng độ vẩn đục của tất cả các nút lá sau khi kết thúc quá trình cắt tỉa","Tỷ lệ phần trăm dữ liệu được mô hình giải thích tương đương R-squared","Mức tăng độ chính xác phân loại khi chuyển từ cây đơn lẻ sang rừng ngẫu nhiên"],"explain":"Information Gain đo lường lượng thông tin nhận được sau phép phân tách, tính bằng độ chênh lệch giữa Entropy ban đầu và Entropy sau khi chia tách.","tip":"Information Gain = Entropy trước - Entropy sau chia."},{"id":"r-m3-006","module":"m3","ref":"3.1","type":"recall","kind":"manual","q":"Chỉ số Gini Index trong phân tách Cây Quyết định đo lường điều gì?","correct":"Thước đo mức độ phân loại sai nếu chọn ngẫu nhiên một phần tử trong tập dữ liệu","wrong":["Tổng bình phương khoảng cách giữa các phần tử và trọng tâm lớp","Xác suất phần tử đó rơi vào vùng biên không thể quyết định","Mức độ tương quan đa biến giữa các cặp thuộc tính đầu vào"],"explain":"Gini Index là thước đo độ vẩn đục biểu thị xác suất một phần tử bị gán nhãn sai nếu nó được phân loại ngẫu nhiên theo phân phối nhãn trong nút.","tip":"Gini Index = đo mức độ phân loại sai ngẫu nhiên."},{"id":"r-m3-007","module":"m3","ref":"3.2","type":"recall","kind":"manual","q":"Vấn đề thường gặp nhất và là nhược điểm lớn của Cây Quyết định là gì?","correct":"Có xu hướng quá khớp (overfit) với dữ liệu huấn luyện và có phương sai cao (high variance)","wrong":["Bị dưới khớp (underfitting) nghiêm trọng do các giả định thống kê khắt khe","Chỉ hoạt động được với dữ liệu có nhãn nhị phân dạng 0 và 1","Không thể biểu diễn được các luật quyết định logic trực quan"],"explain":"Cây Quyết định dễ phát triển quá sâu để khớp từng điểm nhiễu, làm cho cây nhạy cảm với biến động nhỏ và dẫn đến phương sai cao (Overfitting).","tip":"Cây quyết định: dễ Overfitting và phương sai cao."},{"id":"r-m3-008","module":"m3","ref":"3.2","type":"recall","kind":"manual","q":"Kỹ thuật Cắt tỉa (Pruning) được áp dụng trên Cây Quyết định nhằm mục đích chính nào?","correct":"Loại bỏ các nhánh không mang lại nhiều giá trị dự đoán để cải thiện khả năng tổng quát hóa","wrong":["Chuyển đổi toàn bộ các biến danh mục sang dạng biến liên tục","Mở rộng thêm nhiều tầng lá để khớp hoàn hảo 100% dữ liệu huấn luyện","Kết hợp ngẫu nhiên nhiều cây lại với nhau thành mô hình Bagging"],"explain":"Pruning loại bỏ những cành/lá dư thừa hoặc quá chi tiết nhằm giúp cây đơn giản hơn, từ đó tăng cường khả năng tổng quát hóa trên dữ liệu mới.","tip":"Pruning = cắt cành thừa để giảm Overfitting."},{"id":"r-m3-009","module":"m3","ref":"3.2","type":"recall","kind":"manual","q":"Việc cắt tỉa (Pruning) trong Cây Quyết định thường được căn cứ trên tiêu chí nào?","correct":"Ngưỡng lỗi phân loại (classification error threshold)","wrong":["Khoảng cách Manhattan giữa các điểm lân cận","Hệ số điều chuẩn L2 của các biến độc lập","Mức độ tăng dung lượng bộ nhớ của mô hình"],"explain":"Cắt tỉa nhánh thường dựa trên việc kiểm tra xem nếu bỏ một nhánh thì lỗi phân loại (classification error) có vượt ngưỡng cho phép hay không.","tip":"Pruning dựa trên classification error threshold."},{"id":"r-m3-010","module":"m3","ref":"3.3","type":"recall","kind":"manual","q":"Cây Quyết định được đánh giá là rất dễ giải thích cho con người nhờ vào việc sử dụng cấu trúc logic nào?","correct":"Logic 'nếu... thì... nếu không' (if... then... else)","wrong":["Hàm tích phân phi tuyến nhiều lớp","Các phương trình hồi quy siêu phẳng trong không gian vô hạn chiều","Ma trận chuyển đổi Markov bậc cao"],"explain":"Cây Quyết định biểu diễn tri thức dưới dạng các mệnh đề điều kiện if-then-else tuần tự, giúp con người dễ dàng đọc hiểu và giải thích nguyên nhân.","tip":"Cây quyết định = logic if... then... else."},{"id":"r-m3-011","module":"m3","ref":"3.3","type":"recall","kind":"manual","q":"Nhận định nào sau đây đúng về tính linh hoạt trong việc xử lý kiểu dữ liệu của Cây Quyết định?","correct":"Xử lý được mọi loại dữ liệu từ nhị phân, thứ tự đến liên tục","wrong":["Chỉ xử lý được dữ liệu số liên tục, không dùng được cho dữ liệu danh mục","Bắt buộc tất cả các biến phải được chuyển thành biến phân loại nhị phân 0/1","Chỉ hoạt động được với dữ liệu đã chuyển đổi bằng hàm Log"],"explain":"Cây Quyết định rất linh hoạt, có thể xử lý trực tiếp nhiều dạng dữ liệu khác nhau như nhị phân, thứ tự (ordinal) hay liên tục (continuous).","tip":"Cây quyết định cân được mọi loại dữ liệu: nhị phân, thứ tự, liên tục."},{"id":"r-m3-012","module":"m3","ref":"3.3","type":"recall","kind":"manual","q":"Về mặt tiền xử lý dữ liệu, Cây Quyết định có ưu điểm vượt trội nào so với KNN và SVM?","correct":"Không yêu cầu tiền xử lý dữ liệu phức tạp hay chuẩn hóa đặc trưng (scaling)","wrong":["Tự động điền tất cả các giá trị thiếu bằng phương pháp trung vị","Tự động tạo ra các đặc trưng bậc cao đa thức mà không cần thư viện hỗ trợ","Bắt buộc phải áp dụng kiểm định giả thuyết trước khi đọc dữ liệu"],"explain":"Cây Quyết định phân tách chỉ dựa trên thứ tự giá trị của từng đặc trưng độc lập, không dựa vào khoảng cách hình học nên không cần chuẩn hóa thang đo (scaling).","tip":"Cây quyết định: không cần Feature Scaling."},{"id":"r-m3-013","module":"m3","ref":"3.4","type":"recall","kind":"manual","q":"Trong đoạn mã `DecisionTreeClassifier(criterion='entropy', max_depth=5)`, tham số `criterion='entropy'` có ý nghĩa gì?","correct":"Sử dụng thước đo Entropy để đánh giá và lựa chọn đặc trưng phân tách","wrong":["Sử dụng chỉ số Gini Index để đo mức độ phân loại sai","Áp dụng hàm mất mát Hinge Loss trong quá trình huấn luyện","Tính toán khoảng cách theo chuẩn Euclidean cho các điểm lân cận"],"explain":"Tham số `criterion='entropy'` yêu cầu thuật toán sử dụng thước đo Entropy (thay vì Gini) để tính toán Information Gain khi phân nhánh.","tip":"criterion='entropy' là dùng thước đo Entropy để chia nhánh."},{"id":"r-m3-014","module":"m3","ref":"3.4","type":"recall","kind":"manual","q":"Vai trò của tham số `max_depth=5` trong khởi tạo `DecisionTreeClassifier` là gì?","correct":"Giới hạn độ sâu tối đa của cây để ngăn ngừa hiện tượng quá khớp (overfitting)","wrong":["Xác định số lượng cây con được tạo ra trong rừng ngẫu nhiên","Quy định số lượng đặc trưng tối đa được chọn tại mỗi lần phân tách","Chia dữ liệu thành 5 phần bằng nhau để kiểm chéo K-fold"],"explain":"`max_depth` giới hạn số tầng tối đa của cây, chặn không cho cây phát triển quá sâu để tránh overfitting.","tip":"max_depth giới hạn độ sâu cây để chống overfit."},{"id":"r-m3-015","module":"m3","ref":"3.4","type":"recall","kind":"manual","q":"Để kiểm soát và phòng ngừa hiện tượng quá khớp (overfitting) trong Cây Quyết định, ta có thể tinh chỉnh những yếu tố nào?","correct":"Tinh chỉnh các tham số như `max_depth`, `min_samples_leaf` hoặc sử dụng kiểm chéo (cross-validation)","wrong":["Tăng số bậc đa thức của các đặc trưng đầu vào lên bậc 4 hoặc bậc 5","Chuyển hàm mất mát sang hàm mũ Exponential Loss và tăng số mẫu ngoại lai","Bỏ qua bước gán nhãn dữ liệu để chuyển sang mô hình học không giám sát"],"explain":"Kiểm soát overfitting ở Cây Quyết định được thực hiện bằng cách giới hạn độ sâu `max_depth`, đặt số mẫu tối thiểu ở nút lá `min_samples_leaf` hoặc dùng cross-validation.","tip":"Chống overfit cây: max_depth, min_samples_leaf, cross-validation."},{"id":"r-m4-001","module":"m4","ref":"4.1","type":"recall","kind":"manual","q":"Kỹ thuật Học kết hợp (Ensemble Learning) được định nghĩa là gì?","correct":"Kỹ thuật kết hợp dự đoán từ nhiều mô hình đơn lẻ (base learners) để tạo ra mô hình tổng thể có khả năng tổng quát hóa tốt hơn và ổn định hơn","wrong":["Phương pháp thay thế toàn bộ dữ liệu huấn luyện bằng các thành phần chính sau khi giảm chiều bằng PCA","Kỹ thuật chỉ huấn luyện một cây quyết định duy nhất với độ sâu không giới hạn nhằm loại bỏ hoàn toàn sai số","Mô hình học máy không giám sát chuyên dùng để gom nhóm các quan sát có cùng phân phối xác suất"],"explain":"Ensemble Learning kết hợp nhiều mô hình cơ sở (base learners) để tạo ra một mô hình mạnh có độ ổn định và khả năng tổng quát hóa vượt trội.","tip":"Ensemble = kết hợp nhiều base learners."},{"id":"r-m4-002","module":"m4","ref":"4.1","type":"recall","kind":"manual","q":"Mục tiêu cốt lõi của phương pháp Ensemble Learning là nhằm giảm thiểu hai loại sai số nào?","correct":"Giảm phương sai (variance) và giảm độ chệch (bias)","wrong":["Giảm số lượng mẫu dữ liệu và giảm số lượng đặc trưng đầu vào","Giảm độ vẩn đục Gini Index và triệt tiêu khoảng cách Manhattan","Giảm số lượng cụm K và giảm bán kính lân cận Epsilon"],"explain":"Mục tiêu của Ensemble là giảm Variance (lỗi do quá nhạy cảm với dữ liệu) và giảm Bias (lỗi do mô hình quá đơn giản).","tip":"Mục tiêu Ensemble: giảm Variance và giảm Bias."},{"id":"r-m4-003","module":"m4","ref":"4.1","type":"recall","kind":"manual","q":"Ba hướng tiếp cận chính trong Ensemble Learning được đề cập trong tài liệu là gì?","correct":"Bagging, Boosting và Stacking","wrong":["K-Means, HAC và DBSCAN","Regression, Classification và Clustering","Underfitting, Overfitting và Regularization"],"explain":"Ba trường phái nền tảng của Ensemble Learning là Bagging, Boosting và Stacking.","tip":"Bộ ba Ensemble: Bagging, Boosting, Stacking."},{"id":"r-m4-004","module":"m4","ref":"4.2","type":"recall","kind":"manual","q":"Cơ chế 'Bootstrap' trong kỹ thuật Bagging được thực hiện như thế nào?","correct":"Lấy mẫu dữ liệu có thay thế để tạo ra các tập dữ liệu huấn luyện con mới","wrong":["Lấy mẫu dữ liệu tuần tự không thay thế và loại bỏ dần các mẫu bị phân loại sai","Chia đều tập dữ liệu gốc thành K phần bằng nhau và độc lập tuyệt đối","Nội suy tuyến tính giữa các điểm dữ liệu láng giềng gần nhất để sinh thêm mẫu"],"explain":"Bootstrap là kỹ thuật lấy mẫu ngẫu nhiên có hoàn lại (có thay thế) từ tập dữ liệu gốc để tạo ra các tập con huấn luyện.","tip":"Bootstrap = lấy mẫu có thay thế (with replacement)."},{"id":"r-m4-005","module":"m4","ref":"4.2","type":"recall","kind":"manual","q":"Trong kỹ thuật Bagging, kết quả dự đoán của các mô hình cơ sở được kết hợp (Aggregation) theo hình thức nào?","correct":"Lấy trung bình kết quả đối với bài toán hồi quy hoặc bỏ phiếu đa số đối với bài toán phân loại","wrong":["Sử dụng một mô hình meta phức tạp để học trọng số phi tuyến của từng cây","Nhân liên tiếp các giá trị dự đoán của từng mô hình theo một chuỗi nối tiếp","Chỉ giữ lại dự đoán của mô hình cơ sở có điểm số cao nhất trên tập kiểm tra"],"explain":"Giai đoạn Aggregation trong Bagging thực hiện lấy trung bình (cho bài toán Regression) hoặc bỏ phiếu theo số đông (cho Classification).","tip":"Bagging = Bootstrap + Aggregation (trung bình / bỏ phiếu)."},{"id":"r-m4-006","module":"m4","ref":"4.2","type":"recall","kind":"manual","q":"Thuật toán Rừng ngẫu nhiên (Random Forest) bổ sung tính ngẫu nhiên so với Bagging thông thường bằng cách nào?","correct":"Chỉ chọn ngẫu nhiên một tập con các đặc trưng (features) tại mỗi điểm phân tách cây","wrong":["Huấn luyện các cây theo chuỗi tuần tự để cây sau sửa sai cho cây trước","Gán nhãn ngẫu nhiên cho một nửa số quan sát trong tập dữ liệu huấn luyện","Tự động chọn ngẫu nhiên hàm mất mát giữa Hinge Loss và SSE cho từng cây"],"explain":"Random Forest tạo thêm sự đa dạng giữa các cây bằng cách chỉ chọn ngẫu nhiên một tập con đặc trưng (thường là sqrt) tại mỗi lần phân nhánh.","tip":"Random Forest = Bagging + chọn ngẫu nhiên tập con đặc trưng tại mỗi split."},{"id":"r-m4-007","module":"m4","ref":"4.2","type":"recall","kind":"manual","q":"Điểm khác biệt quan trọng của thuật toán Extra Trees (Extremely Randomized Trees) so với Random Forest là gì?","correct":"Chọn điểm phân tách (split point) hoàn toàn ngẫu nhiên thay vì tìm điểm tối ưu, giúp giảm phương sai mạnh và tính toán nhanh hơn","wrong":["Sử dụng hàm mất mát hàm mũ Exponential Loss thay vì độ vẩn đục Gini","Bắt buộc kết hợp các mô hình khác loại như SVM và KNN thay vì cây quyết định","Chỉ sử dụng được cho các bài toán hồi quy liên tục, không áp dụng cho phân loại"],"explain":"Extra Trees tăng tối đa tính ngẫu nhiên bằng cách chọn ngưỡng phân tách hoàn toàn ngẫu nhiên cho mỗi đặc trưng thay vì tìm ngưỡng tối ưu.","tip":"Extra Trees = ngưỡng phân tách ngẫu nhiên hoàn toàn."},{"id":"r-m4-008","module":"m4","ref":"4.2","type":"recall","kind":"manual","q":"Trong đoạn mã `RandomForestClassifier(n_estimators=100, max_features='sqrt')`, tham số `n_estimators=100` có ý nghĩa gì?","correct":"Xây dựng 100 cây quyết định cơ sở trong mô hình rừng ngẫu nhiên","wrong":["Số lần lặp tối đa của thuật toán hạ độ dốc ngẫu nhiên","Số lượng mẫu tối thiểu được phép có tại mỗi nút lá của cây","Tỷ lệ phần trăm dữ liệu bootstrap được lấy từ tập huấn luyện gốc"],"explain":"Tham số `n_estimators=100` quy định số lượng cây quyết định (trees) được tạo ra trong mô hình Random Forest.","tip":"n_estimators là số lượng cây cơ sở."},{"id":"r-m4-009","module":"m4","ref":"4.3","type":"recall","kind":"manual","q":"Nguyên lý hoạt động cốt lõi của kỹ thuật Boosting là gì?","correct":"Xây dựng các mô hình theo chuỗi nối tiếp (sequential), mô hình sau cố gắng sửa lỗi của mô hình trước","wrong":["Xây dựng nhiều mô hình hoàn toàn độc lập và thực thi song song trên phần cứng đa nhân","Huấn luyện một mô hình meta để kết hợp các kết quả dự đoán của các bộ phân loại khác loại","Phân chia dữ liệu thành K phần bằng nhau và huấn luyện K mô hình độc lập"],"explain":"Boosting hoạt động theo cơ chế tuần tự (sequential); mỗi mô hình mới được thêm vào nhằm khắc phục sai số của các mô hình phía trước.","tip":"Boosting = tuần tự (sequential), cây sau sửa sai cho cây trước."},{"id":"r-m4-010","module":"m4","ref":"4.3","type":"recall","kind":"manual","q":"Trong quy trình huấn luyện của Boosting, các quan sát bị dự đoán sai ở bước trước sẽ được xử lý như thế nào?","correct":"Được gán trọng số cao hơn để mô hình phía sau tập trung học vào chúng","wrong":["Bị loại bỏ hoàn toàn ra khỏi tập huấn luyện của các mô hình tiếp theo","Được tự động gán nhãn lại theo đa số các quan sát láng giềng gần nhất","Được chuyển sang tập kiểm tra để đánh giá hiệu suất out-of-bag"],"explain":"Boosting tăng trọng số cho các mẫu bị đoán sai, buộc các mô hình tiếp theo phải tập trung nhiều hơn vào các trường hợp khó này.","tip":"Đoán sai ở bước trước thì bước sau tăng trọng số."},{"id":"r-m4-011","module":"m4","ref":"4.3","type":"recall","kind":"manual","q":"Mô hình cơ sở (Base Learner) trong Boosting thường là các 'Decision Stumps', khái niệm này được hiểu là gì?","correct":"Cây quyết định chỉ có đúng 1 tầng, đưa ra quyết định chỉ dựa trên 1 đặc trưng cụ thể","wrong":["Cây quyết định phát triển đầy đủ với độ sâu tối đa không bị giới hạn","Mạng thần kinh sâu có nhiều lớp ẩn được huấn luyện bằng lan truyền ngược","Mô hình SVM sử dụng nhân phi tuyến Gaussian RBF với tham số gamma lớn"],"explain":"Decision Stump là cây quyết định tối giản chỉ có 1 nút gốc và 2 nút lá (1 tầng), thường chỉ phân nhánh dựa trên 1 đặc trưng duy nhất.","tip":"Decision Stumps = cây 1 tầng, quyết định dựa trên 1 feature."},{"id":"r-m4-012","module":"m4","ref":"4.3","type":"recall","kind":"manual","q":"Điểm khác biệt chính giữa AdaBoost và Gradient Boosting về hàm mất mát và độ kháng ngoại lai là gì?","correct":"AdaBoost dùng hàm mất mát lũy thừa rất nhạy cảm với ngoại lai, còn Gradient Boosting thường dùng hàm Deviance kháng ngoại lai tốt hơn","wrong":["AdaBoost dùng hàm Hinge Loss kháng ngoại lai, còn Gradient Boosting dùng hàm SSE nhạy cảm với ngoại lai","AdaBoost tối ưu hàm chi phí bằng Gradient Descent, còn Gradient Boosting tối ưu bằng giải thuật di truyền","AdaBoost chạy song song trên phần cứng đa nhân, còn Gradient Boosting chạy tuần tự trên một luồng duy nhất"],"explain":"AdaBoost sử dụng Exponential Loss khiến nó rất nhạy với outliers; trong khi Gradient Boosting thường dùng Deviance (binomial log-likelihood) kháng ngoại lai tốt hơn.","tip":"AdaBoost: exponential loss nhạy outliers; Gradient Boosting: deviance kháng outliers tốt hơn."},{"id":"r-m4-013","module":"m4","ref":"4.3","type":"recall","kind":"manual","q":"Trong khai báo `GradientBoostingClassifier(n_estimators=100, learning_rate=0.1, max_depth=3)`, tham số `learning_rate` đóng vai trò gì?","correct":"Kiểm soát tốc độ co giãn mức độ đóng góp của từng cây con vào mô hình tổng thể","wrong":["Quy định bán kính lân cận epsilon để tìm kiếm các điểm dữ liệu lõi","Xác định số lượng đặc trưng ngẫu nhiên được lựa chọn tại mỗi điểm phân tách","Tỷ lệ phần trăm các mẫu dữ liệu ngoại lai cần được loại bỏ trước khi fit"],"explain":"Tham số `learning_rate` điều chỉnh mức độ đóng góp (bước thu hẹp) của mỗi cây con khi được cộng dồn vào mô hình tổng thể.","tip":"learning_rate kiểm soát mức đóng góp của từng cây con."},{"id":"r-m4-014","module":"m4","ref":"4.4","type":"recall","kind":"manual","q":"Đặc trưng lớn nhất phân biệt phương pháp Stacking (Học xếp chồng) với Bagging và Boosting là gì?","correct":"Kết hợp các mô hình thuộc các loại khác nhau (heterogeneous) như SVM, KNN, Hồi quy Logistic","wrong":["Chỉ sử dụng duy nhất một loại mô hình cơ sở đồng nhất là cây quyết định 1 tầng","Bắt buộc phải huấn luyện các mô hình cơ sở theo chuỗi nối tiếp sửa sai","Hoàn toàn không sử dụng nhãn dữ liệu trong toàn bộ quy trình huấn luyện"],"explain":"Stacking kết hợp các thuật toán khác nhau (heterogeneous), tận dụng thế mạnh đa dạng của nhiều họ mô hình như SVM, KNN, Logistic Regression.","tip":"Stacking = kết hợp mô hình khác loại (heterogeneous)."},{"id":"r-m4-015","module":"m4","ref":"4.4","type":"recall","kind":"manual","q":"Cơ chế phân tầng trong kỹ thuật Stacking hoạt động như thế nào?","correct":"Các mô hình lớp cơ sở (level-0) đưa ra dự đoán, các dự đoán này làm đầu vào cho mô hình meta (level-1) đưa ra kết luận","wrong":["Mô hình meta (level-1) dự đoán trước, sau đó chuyển kết quả cho các mô hình lớp cơ sở (level-0) lọc nhiễu","Các mô hình cơ sở chỉ huấn luyện trên tập kiểm tra, còn mô hình meta chỉ huấn luyện trên tập huấn luyện","Dữ liệu gốc được chia thành nhiều tầng theo độ sâu của biểu đồ phân nhánh Dendrogram"],"explain":"Stacking tổ chức theo tầng: mô hình cơ sở level-0 sinh ra các dự đoán, sau đó mô hình meta level-1 học cách kết hợp các dự đoán đó.","tip":"Stacking: level-0 (base) đưa dự đoán -> level-1 (meta) tổng hợp."},{"id":"r-m4-016","module":"m4","ref":"4.4","type":"recall","kind":"manual","q":"Đầu vào của mô hình meta (level-1) trong kiến trúc Stacking là gì?","correct":"Các kết quả dự đoán (chẳng hạn như xác suất các lớp) xuất ra từ các mô hình lớp cơ sở (level-0)","wrong":["Tập dữ liệu thô ban đầu cùng với toàn bộ các đặc trưng chưa chuẩn hóa","Khoảng cách Manhattan giữa các quan sát và các tâm phân cụm","Các chỉ số độ vẩn đục Entropy và Gini Index tại từng nút lá"],"explain":"Mô hình meta level-1 nhận đầu vào là các giá trị dự đoán hoặc xác suất phân loại do các mô hình level-0 tạo ra.","tip":"Đầu vào level-1 là dự đoán từ level-0."},{"id":"r-m4-017","module":"m4","ref":"4.4","type":"recall","kind":"manual","q":"Các phương thức phổ biến để kết hợp dự đoán ở tầng mô hình meta trong Stacking là gì?","correct":"Bỏ phiếu đa số hoặc gán trọng số cho từng mô hình dựa trên hiệu suất của chúng","wrong":["Lấy mẫu bootstrap có thay thế trên ma trận tương quan đa biến","Cắt tỉa các mô hình có độ sâu lớn hơn ngưỡng lỗi phân loại cho phép","Ánh xạ các dự đoán vào không gian nhân RBF với tham số gamma cố định"],"explain":"Mô hình meta thường kết hợp kết quả bằng cách bỏ phiếu đa số hoặc gán trọng số theo hiệu suất dự đoán của từng mô hình cơ sở.","tip":"Kết hợp Stacking: bỏ phiếu đa số hoặc gán trọng số theo hiệu suất."},{"id":"r-m4-018","module":"m4","ref":"4.5","type":"recall","kind":"manual","q":"Khi so sánh về mục đích tối ưu hóa sai số giữa Bagging và Boosting, nhận định nào sau đây là chính xác?","correct":"Bagging nhằm mục đích chính là giảm Variance (tránh quá khớp), còn Boosting nhằm giảm Bias (khắc phục dưới khớp)","wrong":["Bagging nhằm mục đích giảm Bias, còn Boosting nhằm mục đích chính là giảm Variance","Cả hai phương pháp đều chỉ nhằm giảm Bias mà không có tác động đến Variance","Bagging dùng để tối ưu mô hình meta, còn Boosting dùng để chọn đặc trưng ngẫu nhiên"],"explain":"Bagging kết hợp nhiều mô hình độc lập giúp giảm Variance; Boosting xây dựng chuỗi mô hình sửa sai giúp giảm Bias.","tip":"Bagging giảm Variance; Boosting giảm Bias."},{"id":"r-m4-019","module":"m4","ref":"4.5","type":"recall","kind":"manual","q":"Về cấu trúc thực thi tính toán, nhận định nào sau đây đúng khi so sánh giữa Bagging và Boosting?","correct":"Bagging có cấu trúc song song (Parallel) tận dụng tốt phần cứng đa nhân, trong khi Boosting có cấu trúc nối tiếp (Sequential)","wrong":["Bagging bắt buộc phải thực thi nối tiếp, trong khi Boosting luôn thực thi song song hoàn toàn","Cả Bagging và Boosting đều bắt buộc phải chạy phân tầng nối tiếp qua mô hình meta","Bagging chỉ chạy đơn luồng, còn Boosting chạy đa luồng trên nhiều máy chủ phân tán"],"explain":"Bagging xây dựng các cây độc lập nên có thể chạy song song (multithreaded), trong khi Boosting cây sau phụ thuộc cây trước nên chạy nối tiếp.","tip":"Bagging song song (parallel); Boosting nối tiếp (sequential)."},{"id":"r-m4-020","module":"m4","ref":"4.5","type":"recall","kind":"manual","q":"Nguy cơ tiềm ẩn của mô hình Boosting khi số lượng vòng lặp quá lớn là gì và giải pháp khắc phục?","correct":"Dễ bị hiện tượng quá khớp (Overfitting), cần sử dụng kiểm chéo (Cross-validation) để dừng sớm","wrong":["Dễ bị hiện tượng dưới khớp (Underfitting), cần tăng thêm tham số learning_rate","Gây tràn bộ nhớ do phải lưu trữ toàn bộ ma trận khoảng cách giữa các điểm","Hàm mất mát tự động chuyển sang dạng hàm mất mát đối xứng SSE"],"explain":"Boosting lặp quá nhiều sẽ cố khớp cả nhiễu và ngoại lai dẫn đến Overfitting, do đó cần dùng Cross-validation để dừng sớm (early stopping).","tip":"Boosting lặp nhiều dễ Overfit -> dùng Cross-validation dừng sớm."},{"id":"r-m4-021","module":"m4","ref":"4.5","type":"recall","kind":"manual","q":"Trong bài toán xử lý dữ liệu không cân bằng, biến thể nào của Bagging được sử dụng để tích hợp việc lấy mẫu lại dữ liệu?","correct":"Balanced Bagging (Blagging)","wrong":["Extreme Bagging","Sequential Bagging","Adaptive Bagging"],"explain":"Balanced Bagging (Blagging) tích hợp việc lấy mẫu lại cân bằng dữ liệu trực tiếp trong quá trình tạo mẫu bootstrap của từng cây.","tip":"Blagging = Balanced Bagging cho dữ liệu mất cân bằng."},{"id":"r-m4-022","module":"m4","ref":"4.5","type":"recall","kind":"manual","q":"Điểm khác biệt về loại mô hình cơ sở giữa Stacking so với Bagging và Boosting là gì?","correct":"Stacking sử dụng các mô hình cơ sở khác loại (không đồng nhất), trong khi Bagging và Boosting thường dùng các mô hình cùng loại (đồng nhất)","wrong":["Cả ba phương pháp đều bắt buộc phải sử dụng các mô hình cơ sở khác loại","Bagging dùng mô hình khác loại, còn Stacking chỉ dùng duy nhất cây quyết định 1 tầng","Boosting chỉ sử dụng các mô hình học không giám sát làm mô hình cơ sở"],"explain":"Bagging và Boosting thường dùng các cây quyết định (đồng nhất), còn Stacking kết hợp các mô hình khác loại như SVM, KNN, Logistic Regression.","tip":"Stacking = không đồng nhất (heterogeneous); Bagging/Boosting = đồng nhất."},{"id":"r-m4-023","module":"m4","ref":"4.7","type":"recall","kind":"manual","q":"Nhóm mô hình nào sau đây thuộc loại Tự giải thích (Self-interpretable)?","correct":"Mô hình tuyến tính, Cây quyết định đơn giản và K-Nearest Neighbors (KNN)","wrong":["Mạng thần kinh sâu (Deep Neural Networks)","Các mô hình Ensemble lớn (Random Forest, Boosting)","Máy vectơ hỗ trợ (SVM) sử dụng nhân Gaussian RBF phức tạp"],"explain":"Mô hình tự giải thích có cấu trúc đơn giản, trực quan, dễ dàng theo dõi trực tiếp như Linear Regression, Decision Tree đơn giản, KNN.","tip":"Tự giải thích: Tuyến tính, Cây đơn giản, KNN."},{"id":"r-m4-024","module":"m4","ref":"4.7","type":"recall","kind":"manual","q":"Đặc điểm quan trọng của các phương pháp giải thích Bất khả tri (Model-agnostic) là gì?","correct":"Có thể áp dụng cho bất kỳ mô hình nào mà không phụ thuộc vào cấu trúc bên trong của nó","wrong":["Chỉ áp dụng được riêng cho các mô hình tự giải thích đơn giản","Yêu cầu phải can thiệp trực tiếp vào mã nguồn giải thuật tối ưu hóa trọng số","Chỉ sử dụng được cho các bài toán phân cụm không giám sát"],"explain":"Model-agnostic là các kỹ thuật giải thích có thể áp dụng cho bất kỳ mô hình hộp đen nào mà không cần biết cấu trúc bên trong của nó.","tip":"Model-agnostic = bất khả tri mô hình, dùng cho mô hình nào cũng được."},{"id":"r-m4-025","module":"m4","ref":"4.7","type":"recall","kind":"manual","q":"Phương pháp Permutation Feature Importance đánh giá mức độ quan trọng của đặc trưng bằng cách nào?","correct":"Xếp hạng tầm quan trọng của đặc trưng bằng cách hoán vị giá trị của chúng và đo lường độ suy giảm hiệu suất","wrong":["Xóa bỏ vĩnh viễn cột đặc trưng đó khỏi bảng dữ liệu gốc rồi huấn luyện lại","Tính hệ số tương quan tuyến tính giữa đặc trưng đó với biến mục tiêu","Ép trọng số của đặc trưng về 0 thông qua kỹ thuật điều chuẩn LASSO"],"explain":"Permutation Feature Importance xáo trộn (hoán vị) ngẫu nhiên giá trị của từng đặc trưng để xem độ chính xác của mô hình giảm sút bao nhiêu.","tip":"Permutation Feature Importance = hoán vị giá trị đặc trưng để đo độ sụt giảm hiệu suất."},{"id":"r-m4-026","module":"m4","ref":"4.7","type":"recall","kind":"manual","q":"Trong kỹ thuật Mô hình Thay thế Toàn cục (Global Surrogate), mô hình đơn giản được huấn luyện dựa trên nhãn mục tiêu nào?","correct":"Nhãn do mô hình hộp đen phức tạp dự đoán ra, chứ không phải nhãn thực tế của dữ liệu","wrong":["Nhãn thực tế ban đầu (ground truth) của tập dữ liệu huấn luyện","Nhãn ngẫu nhiên được sinh ra từ phân phối Gauss nhiều chiều","Nhãn chỉ số cụm nhận được từ thuật toán phân cụm K-Means"],"explain":"Mô hình thay thế huấn luyện một mô hình đơn giản để dự đoán bắt chước theo kết quả của mô hình hộp đen, nhằm giải thích hành vi của hộp đen đó.","tip":"Global Surrogate học cách bắt chước đầu ra của hộp đen."},{"id":"r-m4-027","module":"m4","ref":"4.7","type":"recall","kind":"manual","q":"Giả định cốt lõi của phương pháp LIME (Local Surrogate) khi giải thích quyết định của mô hình là gì?","correct":"Dù mô hình hộp đen phức tạp trên toàn cục, nhưng trong một vùng rất nhỏ xung quanh một điểm dữ liệu, nó có thể được xấp xỉ bằng một đường thẳng (tuyến tính)","wrong":["Toàn bộ dữ liệu huấn luyện có thể được phân tách hoàn hảo bằng một siêu phẳng tuyến tính toàn cục","Mọi đặc trưng đầu vào đều độc lập hoàn toàn với nhau trên không gian nhiều chiều","Mô hình hộp đen có thể được thay thế hoàn toàn bởi một cây quyết định 1 tầng duy nhất"],"explain":"LIME giả định rằng xung quanh vùng lân cận hẹp của một điểm dữ liệu cụ thể, ranh giới quyết định phức tạp có thể xấp xỉ tốt bằng mô hình tuyến tính.","tip":"LIME: cục bộ hẹp xấp xỉ bằng đường thẳng tuyến tính."},{"id":"r-m4-028","module":"m4","ref":"4.7","type":"recall","kind":"manual","q":"Trong quy trình thực hiện của LIME, các biến thể (perturbations) được gán trọng số theo nguyên tắc nào?","correct":"Những biến thể càng nằm gần điểm gốc thì trọng số càng cao, những điểm xa thì trọng số thấp","wrong":["Tất cả các biến thể đều được gán trọng số bằng nhau tuyệt đối","Những biến thể nằm càng xa điểm gốc thì được gán trọng số càng lớn","Trọng số được gán ngẫu nhiên theo phân phối đều từ 0 đến 1"],"explain":"LIME gán trọng số dựa trên khoảng cách tới điểm gốc: biến thể càng gần điểm cần giải thích thì càng quan trọng và nhận trọng số càng cao.","tip":"LIME: càng gần điểm gốc thì trọng số càng cao."},{"id":"r-m4-029","module":"m4","ref":"4.8","type":"recall","kind":"manual","q":"Tại sao chỉ số Accuracy (Độ chính xác) tuyệt đối không nên dùng để đánh giá mô hình trên dữ liệu mất cân bằng?","correct":"Vì mô hình chỉ cần dự đoán đúng lớp đa số đã đạt Accuracy rất cao trong khi hoàn toàn bỏ qua hoặc dự đoán sai lớp thiểu số","wrong":["Vì công thức của Accuracy sẽ bị chia cho 0 khi lớp thiểu số có số lượng mẫu quá ít","Vì Accuracy chỉ áp dụng cho các bài toán hồi quy liên tục, không dùng cho phân loại","Vì ma trận nhầm lẫn sẽ tự động đảo ngược các giá trị TP và TN khi tính toán"],"explain":"Khi dữ liệu mất cân bằng (vd 99% âm tính), mô hình chỉ cần đoán 100% âm tính đã đạt 99% Accuracy nhưng vô dụng vì bỏ sót hoàn toàn lớp thiểu số.","tip":"Dữ liệu lệch tuyệt đối không dùng Accuracy."},{"id":"r-m4-030","module":"m4","ref":"4.8","type":"recall","kind":"manual","q":"Ba thước đo đánh giá phù hợp được khuyến nghị sử dụng thay cho Accuracy đối với dữ liệu không cân bằng là gì?","correct":"AUC (Area Under Curve), F1 Score và Cohen's Kappa","wrong":["SSE, TSS và R-squared","Entropy, Information Gain và Gini Index","Inertia, Distortion và Bandwidth"],"explain":"Đối với dữ liệu mất cân bằng, tài liệu khuyến nghị sử dụng AUC, F1 Score và Cohen's Kappa thay cho Accuracy.","tip":"Thước đo dữ liệu mất cân bằng: AUC, F1 Score, Cohen's Kappa."},{"id":"r-m4-031","module":"m4","ref":"4.8","type":"recall","kind":"manual","q":"Kỹ thuật SMOTE tạo ra các điểm dữ liệu mới cho lớp thiểu số bằng cơ chế nào?","correct":"Tạo ra các mẫu mới dựa trên các mẫu hiện có thông qua nội suy toán học","wrong":["Nhân bản sao chép trực tiếp các hàng dữ liệu có sẵn của lớp thiểu số","Loại bỏ các điểm lớp đa số nằm quá gần ranh giới quyết định","Ánh xạ các điểm dữ liệu sang không gian đặc trưng vô hạn chiều bằng nhân RBF"],"explain":"SMOTE (Synthetic Minority Oversampling Technique) tổng hợp mẫu mới bằng cách nội suy toán học giữa các điểm dữ liệu lớp thiểu số láng giềng.","tip":"SMOTE = nội suy toán học tạo điểm thiểu số mới."},{"id":"r-m4-032","module":"m4","ref":"4.8","type":"recall","kind":"manual","q":"Trong quy trình xử lý dữ liệu không cân bằng, thao tác Resampling bắt buộc phải thực hiện ở thời điểm nào?","correct":"Chỉ thực hiện sau khi đã chia tách tập dữ liệu Train và Test (sau Stratified Split)","wrong":["Thực hiện trên toàn bộ dữ liệu gốc trước khi tiến hành chia tách tập Train và Test","Chỉ thực hiện trên tập kiểm tra (Test set) sau khi mô hình đã huấn luyện xong","Thực hiện đồng thời trong quá trình tính toán ma trận nhầm lẫn cuối cùng"],"explain":"Phải chia Train/Test trước rồi mới Resampling trên tập Train để tránh rò rỉ thông tin từ tập kiểm tra vào tập huấn luyện (data leakage).","tip":"Chia Train/Test trước -> Resampling sau."},{"id":"r-m4-033","module":"m4","ref":"4.8","type":"recall","kind":"manual","q":"Tiêu chí giữ lại điểm dữ liệu lớp đa số của thuật toán NearMiss-1 là gì?","correct":"Các điểm có khoảng cách trung bình đến 3 điểm lớp thiểu số gần nhất là nhỏ nhất","wrong":["Các điểm có khoảng cách trung bình đến 3 điểm lớp thiểu số xa nhất là nhỏ nhất","Các điểm là láng giềng gần nhất của từng điểm thuộc lớp thiểu số","Các điểm có tọa độ trùng với tâm cụm K-Means của lớp đa số"],"explain":"NearMiss-1 giữ lại các điểm đa số có khoảng cách trung bình tới 3 điểm thiểu số gần nhất là nhỏ nhất.","tip":"NearMiss-1: trung bình đến 3 điểm thiểu số GẦN NHẤT là nhỏ nhất."},{"id":"r-m4-034","module":"m4","ref":"4.8","type":"recall","kind":"manual","q":"Điểm khác biệt giữa hai kỹ thuật làm sạch ranh giới Tomek Links và ENN (Edited Nearest Neighbors) là gì?","correct":"Tomek Links loại bỏ các điểm lớp đa số nằm quá gần lớp thiểu số, còn ENN loại bỏ các điểm có nhãn khác với đa số các láng giềng xung quanh","wrong":["Tomek Links nhân bản thêm mẫu thiểu số, còn ENN giảm bớt mẫu đa số","Tomek Links chỉ áp dụng cho bài toán hồi quy, còn ENN chỉ áp dụng cho phân loại","Tomek Links đo khoảng cách Cosine, còn ENN bắt buộc đo khoảng cách Manhattan"],"explain":"Tomek Links loại bỏ các cặp điểm đa số/thiểu số quá sát nhau gây nhiễu ranh giới; ENN loại bỏ điểm có nhãn lệch pha so với đa số láng giềng để làm mượt ranh giới.","tip":"Tomek Links loại đa số sát ranh giới; ENN loại điểm khác nhãn láng giềng."},{"id":"r-m4-035","module":"m4","ref":"4.9","type":"recall","kind":"manual","q":"Bản chất cốt lõi của Học không giám sát (Unsupervised Learning) là gì?","correct":"Mô hình được huấn luyện trên dữ liệu không có nhãn (unlabeled data) và tự tìm ra các cấu trúc hoặc quy luật ẩn","wrong":["Mô hình bắt buộc phải có nhãn mục tiêu dạng danh mục rời rạc được gán sẵn","Mô hình sử dụng hàm mất mát Hinge Loss để tối đa hóa biên phân cách margin","Mô hình chỉ huấn luyện trên các tập dữ liệu đã được cân bằng tỷ lệ mẫu bằng SMOTE"],"explain":"Unsupervised Learning làm việc với dữ liệu không gán nhãn, hệ thống tự động khám phá cấu trúc, quy luật hoặc cụm tiềm ẩn trong dữ liệu.","tip":"Unsupervised Learning = huấn luyện trên unlabeled data."},{"id":"r-m4-036","module":"m4","ref":"4.9","type":"recall","kind":"manual","q":"Hai dạng bài toán chính của Học không giám sát được nêu trong tài liệu là gì?","correct":"Phân cụm (Clustering) và Giảm chiều dữ liệu (Dimension Reduction)","wrong":["Hồi quy (Regression) và Phân loại (Classification)","Học tăng cường (Reinforcement) và Học chuyển giao (Transfer Learning)","Kiểm định giả thuyết (Hypothesis Testing) và Ước lượng Bayes (Bayesian Estimation)"],"explain":"Hai dạng chính của Unsupervised Learning là Phân cụm (gom nhóm tương đồng) và Giảm chiều dữ liệu (giảm số biến đặc trưng).","tip":"Học không giám sát gồm: Phân cụm & Giảm chiều dữ liệu."},{"id":"r-m4-037","module":"m4","ref":"4.9","type":"recall","kind":"manual","q":"Vấn đề 'Lời nguyền chiều dữ liệu' (Curse of Dimensionality) xảy ra do nguyên nhân nào?","correct":"Số lượng mẫu huấn luyện cần thiết tăng theo cấp số nhân với số chiều, khiến quá nhiều đặc trưng dẫn đến hiệu suất mô hình kém đi","wrong":["Số lượng cụm K tăng quá nhanh làm cho thuật toán phân cụm không thể hội tụ","Dữ liệu bị trùng lặp quá nhiều khiến trọng số mô hình bị thiên lệch","Khoảng cách Euclidean giữa các điểm luôn hội tụ về giá trị 0"],"explain":"Curse of Dimensionality xảy ra khi số chiều tăng cao, không gian trở nên cực kỳ thưa thớt và số mẫu cần thiết tăng lũy thừa, làm suy giảm hiệu suất mô hình.","tip":"Lời nguyền chiều dữ liệu: số mẫu cần tăng theo cấp số nhân với số chiều."},{"id":"r-m4-038","module":"m4","ref":"4.9","type":"recall","kind":"manual","q":"Thuật toán nào được tài liệu nhấn mạnh với công dụng giúp giảm chiều dữ liệu (Dimension Reduction)?","correct":"PCA (Principal Component Analysis)","wrong":["K-Means","DBSCAN","AdaBoost"],"explain":"Tài liệu ghi chú rõ: 'PCA giúp giảm chiều dữ liệu' bằng cách tìm các thành phần biến thiên chính của tập dữ liệu.","tip":"PCA giúp giảm chiều dữ liệu."},{"id":"r-m4-039","module":"m4","ref":"4.10","type":"recall","kind":"manual","q":"Trong thuật toán K-Means, vị trí của tâm cụm (centroid) được cập nhật lại ở mỗi bước lặp bằng cách nào?","correct":"Lấy trung bình tọa độ của tất cả các điểm dữ liệu trong cụm đó","wrong":["Chọn ngẫu nhiên một điểm dữ liệu bất kỳ nằm trong cụm làm tâm mới","Tính trung vị khoảng cách Manhattan từ các điểm tới gốc tọa độ","Tìm điểm có mật độ lân cận lớn hơn tham số MinPts trong bán kính Epsilon"],"explain":"K-Means tính lại tâm cụm bằng cách lấy trung bình cộng tọa độ của tất cả các quan sát hiện được gán vào cụm đó.","tip":"K-Means cập nhật centroid = trung bình tọa độ các điểm trong cụm."},{"id":"r-m4-040","module":"m4","ref":"4.10","type":"recall","kind":"manual","q":"Cải tiến của phương pháp khởi tạo K-Means++ so với K-Means truyền thống mang lại lợi ích gì?","correct":"Khởi tạo tâm cụm thông minh hơn giúp thuật toán hội tụ nhanh hơn và tránh các nghiệm tối ưu cục bộ kém","wrong":["Tự động tìm ra số lượng cụm K tối ưu mà không cần người dùng chỉ định","Cho phép thuật toán xử lý tốt các cụm có hình dạng bất kỳ không phải hình cầu","Loại bỏ hoàn toàn các điểm dữ liệu ngoại lai ra khỏi quá trình tính toán"],"explain":"K-Means++ phân bổ các tâm cụm ban đầu cách xa nhau một cách có tính toán, giúp tăng tốc độ hội tụ và tránh cực tiểu cục bộ không tốt.","tip":"K-Means++ khởi tạo tâm cụm thông minh, hội tụ nhanh, tránh cực tiểu kém."},{"id":"r-m4-041","module":"m4","ref":"4.10","type":"recall","kind":"manual","q":"Phương pháp Điểm khuỷu tay (Elbow Method) dùng để xác định số lượng cụm K tối ưu bằng cách nào?","correct":"Vẽ biểu đồ giá trị Inertia theo K và chọn điểm mà tại đó tốc độ giảm của Inertia chậm lại rõ rệt","wrong":["Vẽ biểu đồ ROC và chọn điểm có diện tích dưới đường cong AUC lớn nhất","Cắt ngang qua đường thẳng đứng dài nhất trên biểu đồ phân cấp Dendrogram","Tìm giá trị K tại đó toàn bộ dữ liệu có nhãn phân loại chính xác 100%"],"explain":"Elbow Method vẽ đồ thị Inertia theo K; điểm khuỷu tay (elbow) là nơi tốc độ suy giảm của Inertia bắt đầu chững lại rõ rệt.","tip":"Elbow Method: điểm tốc độ giảm của Inertia chậm lại rõ rệt."},{"id":"r-m4-042","module":"m4","ref":"4.10","type":"recall","kind":"manual","q":"Chỉ số Inertia (SSE) trong thuật toán K-Means được định nghĩa như thế nào?","correct":"Tổng bình phương khoảng cách từ các điểm đến tâm cụm của chúng","wrong":["Trung bình bình phương khoảng cách giữa các cặp tâm cụm với nhau","Khoảng cách Euclidean lớn nhất giữa hai điểm bất kỳ trong cùng một cụm","Tỷ lệ giữa phương sai nội cụm và phương sai giữa các cụm"],"explain":"Inertia (SSE) đo độ chặt của các cụm, tính bằng tổng bình phương khoảng cách từ mỗi điểm dữ liệu đến tâm cụm tương ứng.","tip":"Inertia = tổng bình phương khoảng cách từ các điểm đến tâm cụm."},{"id":"r-m4-043","module":"m4","ref":"4.10","type":"recall","kind":"manual","q":"Khi số lượng cụm K tăng lên, giá trị của chỉ số Inertia trong K-Means sẽ biến thiên như thế nào?","correct":"Inertia luôn luôn giảm khi tăng K","wrong":["Inertia luôn luôn tăng khi tăng K","Inertia giữ nguyên không đổi với mọi giá trị của K","Inertia chỉ giảm khi K là số chẵn và tăng khi K là số lẻ"],"explain":"Khi tăng số cụm K, các điểm càng ở gần tâm cụm của chúng hơn nên tổng bình phương khoảng cách Inertia luôn luôn giảm.","tip":"Inertia luôn giảm khi tăng K."},{"id":"r-m4-044","module":"m4","ref":"4.11","type":"recall","kind":"manual","q":"Ứng dụng nào sau đây của kỹ thuật phân cụm giúp doanh nghiệp tối ưu hóa các chiến dịch tiếp thị?","correct":"Phân khúc khách hàng theo hành vi mua sắm và nhân khẩu học","wrong":["Dự đoán giá trị doanh thu chứng khoán trong tương lai bằng hồi quy","Tự động điền dữ liệu thiếu bằng phương pháp gán nhãn Masking","Phát hiện lỗi sai lầm loại I trong quy trình kiểm định giả thuyết"],"explain":"Phân cụm được dùng rộng rãi trong Marketing để phân khúc khách hàng theo nhóm hành vi, độ tuổi, sở thích.","tip":"Phân khúc khách hàng: gom nhóm theo hành vi, nhân khẩu học."},{"id":"r-m4-045","module":"m4","ref":"4.11","type":"recall","kind":"manual","q":"Thuật toán phân cụm hỗ trợ bài toán Phát hiện bất thường (Anomaly Detection) dựa trên cơ chế nào?","correct":"Xác định các điểm dữ liệu nằm cô lập, không thuộc về cụm nào một cách rõ rệt","wrong":["Xác định các điểm dữ liệu nằm sát trung tâm của cụm có mật độ cao nhất","Đếm số lượng điểm rơi vào các nút lá có độ vẩn đục Entropy bằng 0","Tìm kiếm các biến có hệ số hồi quy bị triệt tiêu về 0 bởi LASSO"],"explain":"Các điểm dữ liệu bất thường (gian lận, lỗi hệ thống) thường nằm tách biệt, không thuộc vào bất kỳ cụm chính nào.","tip":"Phát hiện bất thường: điểm không thuộc về cụm nào rõ rệt."},{"id":"r-m4-046","module":"m4","ref":"4.11","type":"recall","kind":"manual","q":"Trong xử lý hình ảnh, kỹ thuật phân cụm được ứng dụng vào bài toán Nén hình ảnh (Image Compression) như thế nào?","correct":"Giảm số lượng màu sắc hoặc độ phân giải nhưng vẫn giữ được nội dung chính của bức ảnh","wrong":["Chuyển đổi hình ảnh màu thành ảnh đen trắng nhị phân 0 và 1","Tăng gấp đôi độ phân giải của bức ảnh bằng phép nội suy điểm ảnh","Tự động xóa bỏ hoàn toàn nền phía sau của vật thể chính trong ảnh"],"explain":"Phân cụm gom các màu tương tự thành các màu đại diện (centroids), giúp giảm bớt số lượng màu cần lưu trữ mà vẫn giữ được nội dung ảnh.","tip":"Nén hình ảnh: giảm số màu/độ phân giải nhưng giữ nội dung chính."},{"id":"r-m4-047","module":"m4","ref":"4.12","type":"recall","kind":"manual","q":"Trong thư viện scikit-learn, thuộc tính nào của đối tượng `KMeans` sau khi huấn luyện lưu trữ giá trị Inertia (tổng bình phương khoảng cách tới tâm cụm)?","correct":"`kmeans.inertia_`","wrong":["`kmeans.cluster_centers_`","`kmeans.labels_`","`kmeans.distortion_`"],"explain":"Thuộc tính `.inertia_` của đối tượng `KMeans` chứa tổng bình phương khoảng cách từ các điểm tới tâm cụm tương ứng.","tip":"kmeans.inertia_ lưu giá trị Inertia."},{"id":"r-m4-048","module":"m4","ref":"4.12","type":"recall","kind":"manual","q":"Để truy xuất tọa độ vị trí của các tâm cụm sau khi mô hình `KMeans` hoàn tất huấn luyện, ta sử dụng thuộc tính nào?","correct":"`kmeans.cluster_centers_`","wrong":["`kmeans.inertia_`","`kmeans.centroids_`","`kmeans.centers_`"],"explain":"Thuộc tính `.cluster_centers_` chứa ma trận tọa độ các tâm cụm sau khi thuật toán hội tụ.","tip":"kmeans.cluster_centers_ lưu tọa độ các tâm cụm."},{"id":"r-m4-049","module":"m4","ref":"4.12","type":"recall","kind":"manual","q":"Phương thức nào của `KMeans` vừa thực hiện huấn luyện mô hình vừa trả về trực tiếp nhãn cụm dự đoán cho tập dữ liệu đầu vào?","correct":"`kmeans.fit_predict(X)`","wrong":["`kmeans.transform(X)`","`kmeans.score(X)`","`kmeans.fit_transform(X)`"],"explain":"`fit_predict(X)` kết hợp cả bước huấn luyện (fit) và trả về nhãn cụm được gán cho từng mẫu trong X.","tip":"fit_predict() vừa huấn luyện vừa gán nhãn cụm."},{"id":"r-m4-050","module":"m4","ref":"4.14","type":"recall","kind":"manual","q":"Đặc điểm của Khoảng cách Euclid (Euclidean / L2 Distance) là gì?","correct":"Tính đường thẳng ngắn nhất giữa hai điểm, phù hợp cho dữ liệu tọa độ nhưng nhạy cảm với lời nguyền chiều dữ liệu","wrong":["Tính tổng chênh lệch tuyệt đối giữa các tọa độ và không bị ảnh hưởng bởi số chiều","Đo góc giữa hai vectơ và hoàn toàn không bị ảnh hưởng bởi độ lớn (scaling)","Đo tỷ lệ giữa phần tử chung trên tổng số phần tử độc nhất của hai tập hợp"],"explain":"Khoảng cách Euclidean là độ dài đường thẳng ngắn nhất giữa 2 điểm (L2), rất trực quan trên tọa độ nhưng suy giảm hiệu quả khi số chiều quá cao.","tip":"Euclidean (L2): đường thẳng ngắn nhất, nhạy với số chiều cao."},{"id":"r-m4-051","module":"m4","ref":"4.14","type":"recall","kind":"manual","q":"Khoảng cách Manhattan (L1 / City Block) thường được ưu tiên sử dụng trong trường hợp nào?","correct":"Khi các đặc trưng không có cùng đơn vị đo hoặc dữ liệu di chuyển trong mạng lưới ô bàn cờ","wrong":["Khi cần đo mức độ tương đồng giữa các tài liệu văn bản dài","Khi dữ liệu là các tập hợp nhị phân cần tính tỷ lệ Intersection over Union","Khi cần tìm các cụm có hình dạng phức tạp lồi lõm bất kỳ"],"explain":"Khoảng cách Manhattan (L1) tính tổng khoảng cách chênh lệch tuyệt đối từng trục, phù hợp khi các biến không cùng đơn vị hoặc đi theo lưới đường phố bàn cờ.","tip":"Manhattan (L1): ô bàn cờ, đặc trưng không cùng đơn vị."},{"id":"r-m4-052","module":"m4","ref":"4.14","type":"recall","kind":"manual","q":"Tại sao Khoảng cách Cosine (Cosine Distance) lại đặc biệt hiệu quả trong khai phá dữ liệu văn bản (Text Mining)?","correct":"Đo góc giữa hai vectơ nên không bị ảnh hưởng bởi độ lớn (độ dài văn bản), chỉ quan tâm đến tần suất và hướng tương đối","wrong":["Tính toán khoảng cách theo đường thẳng ngắn nhất giữa các từ khóa xuất hiện","Tự động chuẩn hóa phân phối từ vựng về phân phối chuẩn có trung bình bằng 0","Có khả năng kháng hoàn toàn các điểm dữ liệu ngoại lai dựa vào khoảng cách tứ phân vị"],"explain":"Cosine đo góc giữa 2 vectơ, không bị chi phối bởi độ dài văn bản (scaling) mà tập trung vào sự tương đồng về tỷ lệ phân bổ từ vựng.","tip":"Cosine: đo góc giữa 2 vector, không bị ảnh hưởng bởi độ dài văn bản."},{"id":"r-m4-053","module":"m4","ref":"4.14","type":"recall","kind":"manual","q":"Khoảng cách Jaccard (Jaccard Distance) được tính toán dựa trên nguyên lý nào?","correct":"Dựa trên tỷ lệ phần tử chung trên tổng số phần tử độc nhất (Intersection over Union)","wrong":["Căn bậc hai của tổng bình phương chênh lệch giữa các tọa độ","Tích vô hướng của hai vectơ chia cho tích độ dài của chúng","Tổng độ chênh lệch tuyệt đối giữa các biến đặc trưng"],"explain":"Khoảng cách Jaccard đo độ khác biệt giữa các tập hợp dựa trên tỷ lệ giao trên hợp (IoU), phù hợp cho dữ liệu nhị phân hoặc tập hợp từ.","tip":"Jaccard = Intersection over Union (IoU)."},{"id":"r-m4-054","module":"m4","ref":"4.14","type":"recall","kind":"manual","q":"Theo ví dụ tính tay trong tài liệu, với hai vectơ `a = [[1, 2, 3]]` và `b = [[4, 5, 6]]`, khoảng cách Euclidean được tính như thế nào?","correct":"sqrt((1-4)^2 + (2-5)^2 + (3-6)^2) = sqrt(9 + 9 + 9) = sqrt(27) (xấp xỉ 5.196)","wrong":["|1-4| + |2-5| + |3-6| = 3 + 3 + 3 = 9","(1*4 + 2*5 + 3*6) = 4 + 10 + 18 = 32","(1-4)^2 + (2-5)^2 + (3-6)^2 = 27"],"explain":"Khoảng cách Euclidean là căn bậc hai của tổng bình phương các hiệu tọa độ: sqrt((-3)^2 + (-3)^2 + (-3)^2) = sqrt(27) ≈ 5.196.","tip":"Euclidean = căn bậc 2 tổng hiệu bình phương."},{"id":"r-m4-055","module":"m4","ref":"4.15","type":"recall","kind":"manual","q":"Thuật toán Phân cụm Phân cấp kết tụ (Hierarchical Agglomerative Clustering - HAC) xây dựng các cụm theo mô hình nào?","correct":"Mô hình phân cấp từ dưới lên (Bottom-up), ban đầu mỗi điểm là một cụm rồi gộp dần các cụm gần nhất","wrong":["Mô hình phân cấp từ trên xuống (Top-down), chia đôi toàn bộ dữ liệu thành các cụm nhỏ","Chọn ngẫu nhiên K tâm cụm rồi gán các điểm vào tâm gần nhất cho đến khi hội tụ","Di chuyển tâm của cửa sổ tìm kiếm về phía có mật độ điểm cao nhất"],"explain":"HAC là giải thuật Bottom-up: bắt đầu từ việc mỗi điểm là 1 cụm riêng lẻ, sau đó lặp lại việc gộp 2 cụm gần nhau nhất lại cho đến khi chỉ còn 1 cụm lớn.","tip":"HAC = Bottom-up, gộp dần từ dưới lên."},{"id":"r-m4-056","module":"m4","ref":"4.15","type":"recall","kind":"manual","q":"Phương pháp liên kết Ward Linkage trong phân cụm phân cấp hoạt động theo tiêu chí nào?","correct":"Kết hợp các cụm sao cho tổng phương sai (Inertia) tăng lên là ít nhất","wrong":["Đo khoảng cách nhỏ nhất giữa hai điểm thuộc hai cụm khác nhau","Đo khoảng cách lớn nhất giữa hai điểm thuộc hai cụm khác nhau","Tính khoảng cách trung bình của tất cả các cặp điểm giữa hai cụm"],"explain":"Ward Linkage gộp các cụm sao cho mức tăng của tổng phương sai nội cụm (Inertia) là nhỏ nhất; đây là phương pháp phổ biến nhất trong HAC.","tip":"Ward Linkage: tổng phương sai (inertia) tăng lên là ít nhất."},{"id":"r-m4-057","module":"m4","ref":"4.15","type":"recall","kind":"manual","q":"Phương pháp liên kết nào trong HAC dễ bị ảnh hưởng bởi nhiễu do gây ra hiệu ứng 'chuỗi' (chaining)?","correct":"Single Linkage","wrong":["Complete Linkage","Average Linkage","Ward Linkage"],"explain":"Single Linkage đo khoảng cách nhỏ nhất giữa 2 cụm nên các điểm nhiễu có thể đóng vai trò cầu nối, gây ra hiệu ứng dây chuyền kết nối các cụm xa nhau.","tip":"Single Linkage dễ bị hiệu ứng chuỗi (chaining)."},{"id":"r-m4-058","module":"m4","ref":"4.15","type":"recall","kind":"manual","q":"Khi quan sát biểu đồ phân nhánh Dendrogram, việc cắt ngang cây phân cấp ở vị trí nào thường mang lại kết quả phân cụm tự nhiên và ổn định nhất?","correct":"Cắt ngang qua các đường thẳng đứng dài nhất (nơi khoảng cách giữa các lần gộp cụm là lớn nhất)","wrong":["Cắt ngang qua các nhánh nằm ngang ở vị trí thấp nhất sát đáy biểu đồ","Cắt tại điểm có số lượng nhánh con đúng bằng số lượng thuộc tính đầu vào","Cắt tại điểm mà tất cả các điểm dữ liệu đều trở thành các cụm đơn lẻ"],"explain":"Các đường thẳng đứng dài nhất biểu thị khoảng cách gộp cụm lớn nhất (các cụm cách xa nhau rõ rệt), do đó cắt tại đây cho kết quả phân cụm tự nhiên nhất.","tip":"Cắt Dendrogram tại đường thẳng đứng dài nhất."},{"id":"r-m4-059","module":"m4","ref":"4.15","type":"recall","kind":"manual","q":"Tiêu chí đo khoảng cách giữa hai cụm của phương pháp liên kết Complete Linkage là gì?","correct":"Khoảng cách lớn nhất giữa hai điểm thuộc hai cụm khác nhau","wrong":["Khoảng cách nhỏ nhất giữa hai điểm thuộc hai cụm khác nhau","Khoảng cách trung bình giữa tất cả các cặp điểm của hai cụm","Khoảng cách giữa hai tâm cụm tính theo phân phối chuẩn"],"explain":"Complete Linkage lấy khoảng cách xa nhất giữa hai điểm của hai cụm làm thước đo khoảng cách giữa hai cụm đó.","tip":"Complete Linkage = khoảng cách lớn nhất giữa 2 điểm."},{"id":"r-m4-060","module":"m4","ref":"4.16","type":"recall","kind":"manual","q":"Hai ưu điểm nổi bật của thuật toán phân cụm DBSCAN là gì?","correct":"Có thể tìm thấy các cụm có hình dạng bất kỳ và tự động loại bỏ nhiễu (noise)","wrong":["Tốc độ tính toán nhanh hơn K-Means trên tập dữ liệu hàng triệu mẫu","Không yêu cầu bất kỳ tham số đầu vào nào từ phía người sử dụng","Luôn chia dữ liệu thành các cụm hình cầu đồng đều và hoàn hảo"],"explain":"DBSCAN phân cụm dựa trên mật độ nên nhận diện được các cụm có hình dạng ngoằn ngoèo, lồi lõm bất kỳ và tự động tách biệt các điểm nhiễu.","tip":"DBSCAN: cụm hình dạng bất kỳ + tự loại nhiễu."},{"id":"r-m4-061","module":"m4","ref":"4.16","type":"recall","kind":"manual","q":"Trong DBSCAN, một điểm dữ liệu được xác định là 'Điểm lõi' (Core Point) khi thỏa mãn điều kiện nào?","correct":"Có nhiều hơn MinPts điểm lân cận nằm trong bán kính Epsilon (eps)","wrong":["Nằm trong bán kính eps của điểm khác nhưng bản thân có ít hơn MinPts lân cận","Hoàn toàn không có bất kỳ điểm lân cận nào nằm trong bán kính eps","Có tọa độ trùng khớp chính xác với tâm cụm K-Means"],"explain":"Core Point là điểm có mật độ dày đặc: số lượng điểm nằm trong bán kính eps xung quanh nó phải lớn hơn ngưỡng MinPts.","tip":"Core Point: > MinPts lân cận trong bán kính eps."},{"id":"r-m4-062","module":"m4","ref":"4.16","type":"recall","kind":"manual","q":"Khái niệm 'Điểm biên' (Density-reachable) trong DBSCAN có đặc trưng gì?","correct":"Nằm trong vùng bán kính eps của một điểm lõi nhưng bản thân nó không có đủ MinPts lân cận","wrong":["Có nhiều hơn MinPts lân cận nhưng nằm ngoài bán kính eps của mọi điểm lõi","Không thuộc bất kỳ cụm nào và luôn bị gán nhãn -1","Là điểm có khoảng cách tới tâm cụm nhỏ nhất trong toàn bộ tập dữ liệu"],"explain":"Điểm biên nằm trong vùng lân cận eps của một Core Point nên vẫn thuộc về cụm đó, nhưng bản thân nó không đủ MinPts lân cận để thành Core Point.","tip":"Điểm biên: trong eps của Core Point nhưng bản thân không đủ MinPts."},{"id":"r-m4-063","module":"m4","ref":"4.16","type":"recall","kind":"manual","q":"Trong scikit-learn, thuật toán `DBSCAN` gán nhãn giá trị nào để đại diện cho các điểm dữ liệu nhiễu (Noise)?","correct":"Nhãn -1","wrong":["Nhãn 0","Nhãn 99","Nhãn None"],"explain":"DBSCAN gán nhãn -1 cho tất cả các điểm không thỏa mãn điều kiện thuộc về bất kỳ cụm mật độ nào (điểm nhiễu / noise).","tip":"DBSCAN gán nhãn -1 cho nhiễu."},{"id":"r-m4-064","module":"m4","ref":"4.16","type":"recall","kind":"manual","q":"Hai siêu tham số quan trọng nhất cần thiết lập khi khởi tạo `DBSCAN(eps=0.5, min_samples=5)` là gì?","correct":"Bán kính vùng lân cận `eps` và số lượng điểm tối thiểu trong vùng lân cận `min_samples` (MinPts)","wrong":["Số lượng cụm `n_clusters` và phương pháp liên kết `linkage`","Kích thước cửa sổ `bandwidth` và số lượng thành phần chính `n_components`","Tham số điều chuẩn `C` và hàm mất mát `loss`"],"explain":"DBSCAN được điều khiển bởi 2 tham số chính: eps (bán kính lân cận) và min_samples (số điểm tối thiểu để tạo thành vùng mật độ cao).","tip":"DBSCAN: eps và min_samples (MinPts)."},{"id":"r-m4-065","module":"m4","ref":"4.17","type":"recall","kind":"manual","q":"Thuật toán Mean-Shift Clustering hoạt động dựa trên cơ chế nào?","correct":"Tìm kiếm các vùng có mật độ dữ liệu cao nhất (mốt - mode) bằng cách di chuyển tâm của một cửa sổ về phía có mật độ cao hơn cho đến khi hội tụ","wrong":["Cực tiểu hóa hàm mất mát SSE bằng cách cập nhật các trọng số theo đạo hàm bậc một","Chia dữ liệu thành các cụm hình cầu dựa trên việc gán điểm vào tâm cụm gần nhất","Gộp dần các điểm dữ liệu từ dưới lên trên biểu đồ phân cấp Dendrogram"],"explain":"Mean-Shift là thuật toán tìm mốt (mode): nó trượt cửa sổ tìm kiếm dần về phía vùng có mật độ điểm cao hơn cho tới khi đạt đỉnh mật độ.","tip":"Mean-Shift: di chuyển tâm cửa sổ về phía mật độ cao nhất (mode)."},{"id":"r-m4-066","module":"m4","ref":"4.17","type":"recall","kind":"manual","q":"Ưu điểm nổi bật của thuật toán phân cụm Mean-Shift là gì?","correct":"Không cần khai báo trước số lượng cụm K và có thể tìm thấy các cụm có kích thước không đều","wrong":["Tốc độ xử lý cực kỳ nhanh trên các tập dữ liệu có quy mô hàng triệu mẫu","Hoàn toàn không phụ thuộc vào bất kỳ siêu tham số kích thước cửa sổ nào","Có thể hoạt động hiệu quả với mọi độ đo khoảng cách phi tuyến tính"],"explain":"Mean-Shift không cần người dùng chỉ định trước K và có khả năng phát hiện các cụm có hình dạng, kích thước không đồng đều.","tip":"Mean-Shift: không cần khai báo trước K, cụm kích thước không đều."},{"id":"r-m4-067","module":"m4","ref":"4.17","type":"recall","kind":"manual","q":"Nhược điểm lớn của thuật toán Mean-Shift được nêu trong tài liệu là gì?","correct":"Chạy chậm với dữ liệu lớn và phụ thuộc nhiều vào tham số 'bandwidth' (kích thước cửa sổ)","wrong":["Bắt buộc người dùng phải phỏng đoán chính xác số lượng cụm K ban đầu","Không thể tìm thấy các cụm có kích thước và mật độ khác nhau","Tự động biến đổi toàn bộ nhãn mục tiêu sang dạng biến liên tục"],"explain":"Mean-Shift có độ phức tạp cao nên chạy chậm với dữ liệu lớn, đồng thời kết quả phụ thuộc rất lớn vào việc chọn bandwidth phù hợp.","tip":"Mean-Shift chạy chậm với dữ liệu lớn, phụ thuộc bandwidth."},{"id":"r-m4-068","module":"m4","ref":"4.17","type":"recall","kind":"manual","q":"Hàm nào trong scikit-learn được dùng để hỗ trợ ước lượng tự động tham số kích thước cửa sổ (bandwidth) cho Mean-Shift?","correct":"`estimate_bandwidth(X, quantile=0.2)`","wrong":["`find_optimal_k(X)`","`calculate_inertia(X)`","`get_eps_radius(X)`"],"explain":"Hàm `estimate_bandwidth` trong `sklearn.cluster` giúp ước lượng giá trị bandwidth phù hợp dựa trên phân vị khoảng cách dữ liệu.","tip":"estimate_bandwidth() để ước lượng bandwidth cho Mean-Shift."},{"id":"r-m4-069","module":"m4","ref":"4.18","type":"recall","kind":"manual","q":"Khi làm việc với tập dữ liệu cực lớn và cần thuật toán phân cụm chạy rất nhanh, phương pháp nào là lựa chọn phù hợp nhất?","correct":"K-Means","wrong":["Hierarchical Clustering","Mean-Shift","DBSCAN với nhiều mức mật độ khác nhau"],"explain":"K-Means có ưu điểm nổi bật là tốc độ tính toán rất nhanh, phù hợp cho các tập dữ liệu có kích thước cực lớn.","tip":"Dữ liệu cực lớn, cần rất nhanh -> K-Means."},{"id":"r-m4-070","module":"m4","ref":"4.18","type":"recall","kind":"manual","q":"Nhược điểm về độ phức tạp tính toán của thuật toán Phân cụm Phân cấp (Hierarchical) khi xử lý tập dữ liệu lớn là gì?","correct":"Chạy chậm với dữ liệu lớn do độ phức tạp tính toán lên tới O(N^2) và phải chọn K để cắt cây","wrong":["Chỉ tìm được các cụm có hình dạng ngoằn ngoèo bất kỳ và nhạy cảm với eps","Không thể biểu diễn trực quan quá trình gom cụm bằng biểu đồ Dendrogram","Bắt buộc phải khởi tạo tâm cụm bằng kỹ thuật thông minh K-Means++"],"explain":"Hierarchical Clustering có độ phức tạp O(N^2) nên chạy rất chậm trên các bộ dữ liệu lớn, ngoài ra vẫn phải chọn K để cắt cây.","tip":"Hierarchical chậm với dữ liệu lớn (O(N^2))."},{"id":"r-m4-071","module":"m4","ref":"4.18","type":"recall","kind":"manual","q":"Nhược điểm chính của thuật toán DBSCAN trong so sánh tổng quan giữa các thuật toán phân cụm là gì?","correct":"Nhạy cảm với tham số eps và hoạt động không tốt với các cụm có mật độ khác nhau","wrong":["Bắt buộc người dùng phải biết trước và khai báo chính xác số lượng cụm K","Chỉ có thể phát hiện được các cụm có hình dạng hình cầu đối xứng","Không có khả năng tự động phát hiện và lọc bỏ các điểm dữ liệu nhiễu"],"explain":"DBSCAN nhạy cảm với việc chọn eps và gặp khó khăn khi các cụm trong dữ liệu có mật độ chênh lệch lớn.","tip":"DBSCAN nhạy cảm với eps, không tốt với các cụm mật độ khác nhau."},{"id":"r-m4-072","module":"m4","ref":"4.18","type":"recall","kind":"manual","q":"Đặc điểm hạn chế nào sau đây là của thuật toán Mean-Shift khi so sánh với các thuật toán phân cụm khác?","correct":"Chạy chậm và chỉ dùng khoảng cách Euclidean","wrong":["Chỉ hiệu quả với các cụm hình cầu và bắt buộc phải biết trước số lượng cụm K","Độ phức tạp tính toán O(N^2) và bắt buộc phải cắt cây phân cấp","Rất nhạy cảm với tham số eps và không phát hiện được điểm nhiễu"],"explain":"Mean-Shift có nhược điểm là tốc độ thực thi chậm và chỉ áp dụng được với thước đo khoảng cách Euclidean.","tip":"Mean-Shift chạy chậm và chỉ dùng khoảng cách Euclidean."}],"bank":[{"id":1,"slide":7,"topic":"Đánh giá mô hình (metrics)","section":"Dạng số","question":"You are evaluating a binary classifier. There are 80 positive outcomes in the test data, and 150 observations. Using a 50% threshold, the classifier predicts 60 positive outcomes, of which 20 are incorrect.\nWhat is the classifier's Precision on the test sample?","options":["50%","33.3%","66.7%","37.5%"],"answer":[2],"explanation":"**Đáp án đúng: 66.7%** vì `Precision = TP / (TP + FP)`. Mô hình dự đoán 60 ca dương tính với 20 ca sai (FP = 20), suy ra số ca đúng TP = 40, do đó `Precision = 40 / 60 ≈ 66.7%`.\n- 50%: Đây là Recall (`TP / Actual Positive = 40 / 80 = 50%`), học viên rất dễ nhầm giữa Precision và Recall.\n- 33.3%: Là tỷ lệ dự đoán sai trên tổng số dự đoán dương tính (`20 / 60`).\n- 37.5%: Tính sai số liệu mẫu hoặc nhầm lẫn mẫu số.\nMẹo nhớ: Precision nhìn vào dự đoán (mẫu số là tổng số ca máy đoán Positive)."},{"id":2,"slide":8,"topic":"Đánh giá mô hình (metrics)","section":"Dạng số","question":"You are evaluating a binary classifier. There are 80 positive outcomes in the test data, and 150 observations. Using a 50% threshold, the classifier predicts 60 positive outcomes, of which 20 are incorrect.\nWhat is the classifier's F1 score on the test sample?","options":["75%","57.2%","67.5%","42.8%"],"answer":[1],"explanation":"**Đáp án đúng: 57.2%** vì F1-score là trung bình điều hoà giữa Precision và Recall: `F1 = 2 * (Precision * Recall) / (Precision + Recall)`. Với `Precision = 40 / 60 = 2/3` và `Recall = 40 / 80 = 1/2`, ta có `F1 = 2 * (1/3) / (7/6) = 4/7 ≈ 57.2%`.\n- 75%, 67.5%, 42.8%: Đều là kết quả tính sai công thức F1 (như lấy trung bình cộng thường hoặc tính nhầm nghịch đảo tỉ số).\nMẹo nhớ: F1-score luôn bị kéo về phía giá trị nhỏ hơn giữa Precision và Recall (ở đây nhỏ hơn trung bình cộng 58.3%)."},{"id":3,"slide":9,"topic":"Đánh giá mô hình (metrics)","section":"Dạng số","question":"You are evaluating a binary classifier. There are 80 positive outcomes in the test data, and 150 observations. Using a 50% threshold, the classifier predicts 60 positive outcomes, of which 20 are incorrect.\nWhat is the classifier's Recall on the test sample?","options":["66.7%","37.5%","50%","33.3%"],"answer":[2],"explanation":"**Đáp án đúng: 50%** vì `Recall = TP / (TP + FN) = TP / Actual Positives`. Thực tế có 80 ca dương tính, mô hình đoán đúng 40 ca (TP = 60 - 20 = 40), do đó `Recall = 40 / 80 = 50%`.\n- 66.7%: Là chỉ số Precision (`40 / 60`), dễ nhầm khi không phân biệt mẫu số là thực tế hay dự đoán.\n- 33.3%: Là tỷ lệ lỗi FP trên tổng số dự đoán dương (`20 / 60`).\n- 37.5%: Tính sai các thành phần trong ma trận nhầm lẫn (Confusion Matrix).\nMẹo nhớ: Recall (độ nhạy) đo lường khả năng tìm ra thực tế, mẫu số là tổng số ca thực sự Positive."},{"id":4,"slide":11,"topic":"EDA & Xử lý dữ liệu","section":"Nhiều đáp án","question":"Why is EDA Useful?","options":["EDA allows us to get an initial feel for the data.","It lets us determine if the data makes sense, or if further cleaning or more data is needed.","EDA does not help to identify patterns and trends in the data.","None of these"],"answer":[0,1],"explanation":"**Đáp án đúng:**\n- **EDA allows us to get an initial feel for the data**: EDA giúp người phân tích có cái nhìn trực quan ban đầu về cấu trúc, kiểu dữ liệu và phân phối.\n- **It lets us determine if the data makes sense, or if further cleaning or more data is needed**: EDA giúp phát hiện giá trị ngoại lai, missing values và đánh giá xem dữ liệu đã hợp lý hay cần tiền xử lý thêm.\n- \"EDA does not help to identify patterns...\": Sai vì mục tiêu cốt lõi của EDA chính là phát hiện quy luật và xu hướng (patterns and trends).\n- \"None of these\": Sai vì hai ý trên đều đúng."},{"id":5,"slide":12,"topic":"EDA & Xử lý dữ liệu","section":"Nhiều đáp án","question":"There are several SQL databases available such as","options":["MySQL","PostgreSQL","MongoDB","Cassandra"],"answer":[0,1],"explanation":"**Đáp án đúng:**\n- **MySQL**: Hệ quản trị cơ sở dữ liệu quan hệ (RDBMS) chuẩn SQL mã nguồn mở rất phổ biến.\n- **PostgreSQL**: Hệ quản trị cơ sở dữ liệu quan hệ - đối tượng (ORDBMS) hỗ trợ chuẩn SQL mạnh mẽ và mở rộng cao.\n- MongoDB: Sai vì thuộc loại cơ sở dữ liệu phi quan hệ NoSQL hướng tài liệu (document store).\n- Cassandra: Sai vì thuộc loại NoSQL dạng cột rộng (wide-column store) phân tán.\nMẹo nhớ: MySQL và PostgreSQL là SQL kinh điển; MongoDB và Cassandra thuộc hệ NoSQL."},{"id":6,"slide":14,"topic":"EDA & Xử lý dữ liệu","section":"Function","question":"The data below appears in 'data.txt', and Pandas has been imported.\n63.03 22.55 39.61 40.48 98.67 -0.25 AB\n39.06 10.06 25.02 29 114.41 4.56 AB\n68.83 22.22 50.09 46.61 105.99 -3.53 AB\nHow can we use Pandas to import this data into a data frame?","options":["pandas.read_csv('data.txt', header=None, sep=\",\")","pandas.read_csv('data.txt')","pandas.read_csv('data.txt', delim_whitespace=True)","pandas.read_csv('data.txt', header=0, delim_whitespace=True)"],"answer":[2],"explanation":"**Đáp án đúng: `pandas.read_csv('data.txt', delim_whitespace=True)`** vì dữ liệu trong file phân tách bằng khoảng trắng chứ không phải dấu phẩy, tham số `delim_whitespace=True` sẽ phân tách chính xác các cột.\n- `sep=\",\"` hoặc mặc định `pandas.read_csv('data.txt')`: Sai vì mặc định dùng dấu phẩy `,` làm dấu phân cách, khiến cả dòng bị gộp vào một cột.\n- `header=0`: Sai vì file dữ liệu không có dòng tiêu đề cột, nếu đặt `header=0` dòng số đầu tiên sẽ bị biến thành tên cột.\nMẹo nhớ: Dữ liệu phân cách bởi khoảng trắng -> dùng `delim_whitespace=True` (hoặc `sep=r'\\s+'`)."},{"id":7,"slide":15,"topic":"EDA & Xử lý dữ liệu","section":"Function","question":"The data below appears in 'data.txt', and Pandas has been imported. Which Python command will read it correctly into a Pandas DataFrame?\n63.03 22.55 39.61 40.48 98.67 -0.25 AB\n39.06 10.06 25.02 29 114.41 4.56 AB\n68.83 22.22 50.09 46.61 105.99 -3.53 AB","options":["pandas.read('data.txt')","pandas.read_csv('data.txt', header=None, sep=',')","pandas.read_csv('data.txt', delim_whitespace=True)","pandas.read_csv('data.txt', header=0, delim_whitespace=True)"],"answer":[2],"explanation":"**Đáp án đúng: `pandas.read_csv('data.txt', delim_whitespace=True)`** vì các trường dữ liệu phân cách nhau bằng khoảng trắng và file không chứa dòng tiêu đề.\n- `pandas.read('data.txt')`: Sai vì Pandas không có hàm nào tên là `read()`.\n- `sep=','`: Sai vì phân tách bằng khoảng trắng, dùng dấu phẩy sẽ không tách được cột.\n- `header=0`: Sai vì làm mất dòng dữ liệu đầu tiên thành tên cột.\nMẹo nhớ: Pandas đọc file phân cách bằng khoảng trắng bằng `read_csv` cùng tuỳ chọn `delim_whitespace=True`."},{"id":8,"slide":16,"topic":"Train/test & Cross-validation","section":"Function","question":"Select the option that has the syntax to obtain the data splits you will need to train a model having a test split that is a third the size of your available data.","options":["X_train, X_test, y_train, y_test = train_test_split(x, y, test_size=0.5)","X_train, X_test, y_train, y_test = train_test_split(x, y, test_size=0.33)","X_train, y_test = train_test_split(x, y, test_size=0.33)","X_train, y_test = train_test_split(x, y, test_size=0.5)"],"answer":[1],"explanation":"**Đáp án đúng: `X_train, X_test, y_train, y_test = train_test_split(x, y, test_size=0.33)`** vì hàm `train_test_split` trả về 4 phần tử theo thứ tự `X_train, X_test, y_train, y_test`, và tỷ lệ 1/3 tương ứng với `test_size=0.33`.\n- `test_size=0.5`: Sai vì 0.5 là tỷ lệ một nửa (50%), không phải một phần ba (1/3).\n- Các phương án chỉ gán cho 2 biến `X_train, y_test`: Sai cú pháp vì hàm trả về bộ 4 biến (gây lỗi `ValueError: too many values to unpack`).\nMẹo nhớ: 1/3 ≈ 0.33; thứ tự biến nhận luôn là Train trước, Test sau cho cả X và y."},{"id":9,"slide":18,"topic":"Dữ liệu mất cân bằng","section":"Not / is true","question":"Which of the following statements about Downsampling is TRUE?","options":["Downsampling is likely to decrease Recall.","Downsampling is likely to decrease Precision.","Downsampling preserves all the original observations.","Downsampling results in excessive focus on the more frequently-occurring class."],"answer":[1],"explanation":"**Đáp án đúng: Downsampling is likely to decrease Precision.** vì khi giảm mẫu lớp đa số (thường là âm tính), mô hình có xu hướng dự đoán dương tính nhiều hơn, dẫn đến số ca dương tính giả (FP) tăng, làm giảm Precision.\n- \"Downsampling is likely to decrease Recall\": Sai vì mô hình mạnh dạn đoán dương tính nên Recall thường tăng lên.\n- \"Downsampling preserves all the original observations\": Sai vì kỹ thuật này chủ động loại bỏ bớt dữ liệu của lớp đa số.\n- \"results in excessive focus...\": Sai vì mục đích của nó là khắc phục sự thiên lệch về lớp đa số.\nMẹo nhớ: Downsampling kéo lớp đa số xuống -> dự đoán Positive nhiều hơn -> FP tăng -> Precision giảm."},{"id":10,"slide":19,"topic":"Ensemble (RF, Bagging, Boosting)","section":"Not / is true","question":"Which type of Ensemble modeling approach is NOT a special case of model averaging?","options":["Random Forest methods","Boosting methods","The Pasting method of Bootstrap aggregation","The Bagging method of Bootstrap aggregation"],"answer":[1],"explanation":"**Đáp án đúng: Boosting methods** vì Boosting là phương pháp học tuần tự (sequential learning), các mô hình sau tập trung sửa lỗi cho mô hình trước và kết hợp có trọng số, không phải lấy trung bình độc lập (model averaging).\n- Random Forest, Bagging, Pasting: Đều là các phương pháp trung bình hoá mô hình (model averaging / bagging) xây dựng các cây/mô hình độc lập song song rồi lấy trung bình dự đoán để giảm phương sai.\nMẹo nhớ: Bagging/Random Forest = Averaging (song song, giảm variance); Boosting = Sequential/Additive (tuần tự, giảm bias)."},{"id":11,"slide":20,"topic":"KNN & Decision Tree","section":"Not / is true","question":"Which of the following is NOT a characteristic of the k nearest neighbors algorithm?","options":["It determines the value for k.","It is sensitive to scaling.","It determines decision boundaries to make predictions.","It is well suited to predict variables with multiple classes."],"answer":[0],"explanation":"**Đáp án đúng: It determines the value for k.** vì `k` là một siêu tham số (hyperparameter) do người dùng tự chỉ định hoặc tìm qua Cross-Validation, thuật toán k-NN không tự xác định giá trị này.\n- \"It is sensitive to scaling\": Đúng vì k-NN tính khoảng cách, đặc trưng có thang đo lớn sẽ lấn át.\n- \"It determines decision boundaries...\": Đúng vì k-NN tạo ra ranh giới quyết định cục bộ dựa trên láng giềng.\n- \"It is well suited to predict variables with multiple classes\": Đúng vì k-NN tự nhiên hỗ trợ phân loại đa lớp bằng bầu chọn đa số.\nMẹo nhớ: k trong k-NN là hyperparameter do người dùng quyết định."},{"id":12,"slide":21,"topic":"Clustering & khoảng cách","section":"Not / is true","question":"Which of the following examples is NOT a common use case of clustering in the real world?","options":["Anomaly detection.","Customer segmentation","Determine risk factor and prevention factors for diseases such as osteoporosis","Improve supervised learning."],"answer":[2],"explanation":"**Đáp án đúng: Determine risk factor and prevention factors for diseases such as osteoporosis** vì việc tìm yếu tố nguy cơ của một căn bệnh cụ thể đòi hỏi bài toán học
