 có giám sát (Supervised Learning như hồi quy Logistic) hoặc suy luận thống kê nhân quả, không phù hợp với gom cụm (Clustering).\n- Customer segmentation: Ứng dụng kinh điển nhất của gom cụm để phân khúc khách hàng.\n- Anomaly detection: Các điểm dữ liệu xa lạ không thuộc cụm nào được coi là điểm bất thường.\n- Improve supervised learning: Gom cụm dùng để trích xuất đặc trưng hoặc gán nhãn hỗ trợ học có giám sát.\nMẹo nhớ: Tìm nguyên nhân gây bệnh cụ thể cần nhãn bệnh (supervised), không dùng clustering (unsupervised)."},{"id":13,"slide":22,"topic":"Tổng quan AI / ML","section":"Not / is true","question":"Which of these options is NOT an example of Unsupervised Learning?","options":["Segmenting costumers into different groups.","Reducing the size of a data set without losing too much information from our original data set.","Explaining the relationship between an individual's income and the price they pay for a car.","Grouping observations together to find similar patterns across them."],"answer":[2],"explanation":"**Đáp án đúng: Explaining the relationship between an individual's income and the price they pay for a car.** vì đây là bài toán hồi quy (học có giám sát - Supervised Learning) nhằm mô hình hoá mối quan hệ giữa biến đầu vào (income) và biến mục tiêu (car price).\n- Segmenting customers... và Grouping observations...: Đều là bài toán gom cụm (Clustering), tiêu biểu cho Unsupervised Learning.\n- Reducing the size of a data set...: Là giảm chiều dữ liệu (Dimensionality Reduction như PCA), một kỹ thuật Unsupervised Learning kinh điển.\nMẹo nhớ: Cứ có biến mục tiêu cụ thể cần giải thích/dự đoán là Supervised Learning."},{"id":14,"slide":23,"topic":"EDA & Xử lý dữ liệu","section":"Not / is true","question":"Which of the following options is NOT a valid exploratory data approach for determining data readiness for modeling?","options":["Create a correlation heatmap to confirm the sign and magnitude of correlation across your features.","Create a panel plot that shows distributions for the dependent variable and scatter plots for all independent variables.","Train a model and identify the observations with the largest residuals.","Create visualizations for scatter plots, histograms, box plots, and hexbin plots."],"answer":[2],"explanation":"**Đáp án đúng: Train a model and identify the observations with the largest residuals.** vì việc huấn luyện mô hình và kiểm tra phần dư (residuals) thuộc giai đoạn đánh giá và chẩn đoán mô hình (Model Evaluation/Diagnostics), không phải bước phân tích khám phá dữ liệu (EDA) diễn ra trước khi lập mô hình.\n- Heatmap, panel plot, scatter plot, box plot: Đều là các công cụ trực quan hoá chuẩn của EDA nhằm khảo sát phân phối, tương quan và ngoại lai.\nMẹo nhớ: EDA diễn ra trước khi fit mô hình; chưa có mô hình thì chưa có phần dư (residuals)."},{"id":15,"slide":24,"topic":"Tổng quan AI / ML","section":"Not / is true","question":"In which of the following cases would you NOT use supervised machine learning?","options":["Segment customers by their demographics.","Predict the number of customers that will visit a store on a given week.","Predict the probability of a customer returning to a store.","Interpret the main drivers that determine if a customer will return to a store."],"answer":[0],"explanation":"**Đáp án đúng: Segment customers by their demographics.** vì phân khúc khách hàng khi không có nhãn đầu ra cho trước là bài toán học không giám sát (Unsupervised Learning / Clustering).\n- \"Predict the number...\": Là bài toán hồi quy (Regression) trong Supervised Learning.\n- \"Predict the probability...\" và \"Interpret the main drivers...\": Đều là bài toán phân loại (Classification/Logistic Regression) có nhãn giám sát.\nMẹo nhớ: Cứ \"phân nhóm/phân khúc\" khách hàng không nhãn thì dùng Unsupervised."},{"id":16,"slide":25,"topic":"Regularization & Overfitting","section":"Not / is true","question":"Which of the following statements about model errors is TRUE?","options":["Underfitting is characterized by lower errors in both training and test samples.","Underfitting is characterized by higher errors in both training and test samples.","Underfitting is characterized by higher errors in training samples and lower errors in test samples.","Underfitting is characterized by lower errors in training samples and higher errors in test samples."],"answer":[1],"explanation":"**Đáp án đúng: Underfitting is characterized by higher errors in both training and test samples.** vì hiện tượng chưa khớp (Underfitting / High Bias) xảy ra khi mô hình quá đơn giản, không nắm bắt được quy luật dữ liệu, dẫn đến sai số cao trên cả tập Train lẫn tập Test.\n- \"lower errors in both...\": Đây là mô hình lý tưởng (Good fit).\n- \"lower errors in training and higher in test\": Đây là đặc trưng của quá khớp (Overfitting).\n- \"higher in training and lower in test\": Không thực tế trong điều kiện phân phối dữ liệu chuẩn.\nMẹo nhớ: Underfitting = Train tệ và Test cũng tệ; Overfitting = Train tốt nhưng Test tệ."},{"id":17,"slide":26,"topic":"Train/test & Cross-validation","section":"Not / is true","question":"Which statement about K-fold cross-validation below is TRUE?","options":["Each subsample in K-fold cross-validation has at least K observations.","Each subsample in K-fold cross-validation has at least K-1 observations.","Each of the K subsamples in K-fold cross-validation is used as a training set.","Each of the K subsamples in K-fold cross-validation is used as a test set."],"answer":[3],"explanation":"**Đáp án đúng: Each of the K subsamples in K-fold cross-validation is used as a test set.** vì trong K-fold Cross-Validation, tập dữ liệu được chia làm K phần; qua K lần lặp, mỗi phần đều được đóng vai trò làm tập kiểm thử (Test set) đúng một lần duy nhất.\n- \"used as a training set\": Sai vì mỗi lần lặp có K-1 phần làm tập train, không phải một phần riêng lẻ là \"a training set\".\n- \"has at least K observations\" hoặc \"K-1 observations\": Kích thước mỗi fold là `N / K` (với N là tổng số quan sát), không liên quan đến quy tắc K tối thiểu.\nMẹo nhớ: K-fold xoay tua để mỗi fold đều được làm Test set 1 lần."},{"id":18,"slide":27,"topic":"Dữ liệu mất cân bằng","section":"Not / is true","question":"Which of the following statements about Synthetic Upsampling is TRUE?","options":["Synthetic Upsampling will generally lead to a higher F1 score.","Synthetic Upsampling uses fewer hyperparameters than Random Upsampling.","Synthetic Upsampling generates observations that were not part of the original data.","Synthetic Upsampling results in excessive focus on the more frequently-occurring class"],"answer":[2],"explanation":"**Đáp án đúng: Synthetic Upsampling generates observations that were not part of the original data.** vì phương pháp tăng mẫu nhân tạo (như SMOTE) tổng hợp dữ liệu mới bằng cách nội suy giữa các điểm lân cận của lớp thiểu số, tạo ra các quan sát hoàn toàn mới so với tập gốc.\n- \"uses fewer hyperparameters...\": Sai vì tăng mẫu ngẫu nhiên (Random) ít tham số hơn, Synthetic cần thêm tham số như số láng giềng `k`.\n- \"excessive focus on the more frequently-occurring class\": Sai vì kỹ thuật này tập trung vào lớp thiểu số.\n- \"will generally lead to a higher F1 score\": Không đảm bảo trong mọi trường hợp do có nguy cơ tạo nhiễu.\nMẹo nhớ: Synthetic = Nhân tạo -> tạo ra điểm dữ liệu mới không có trong tập gốc."},{"id":19,"slide":28,"topic":"Regularization & Overfitting","section":"Not / is true","question":"Which of the following statements about model complexity is TRUE?","options":["Higher model complexity leads to a lower chance of overfitting.","Higher model complexity leads to a higher chance of overfitting.","Reducing the number of features while adding feature interactions leads to a lower chance of overfitting.","Reducing the number of features while adding feature interactions leads to a higher chance of overfitting."],"answer":[1],"explanation":"**Đáp án đúng: Higher model complexity leads to a higher chance of overfitting.** vì mô hình càng phức tạp (nhiều tham số, bậc cao) thì càng dễ học thuộc cả các nhiễu trong tập huấn luyện, làm giảm khả năng tổng quát hoá và tăng nguy cơ Overfitting.\n- \"lower chance of overfitting\": Ngược hoàn toàn với lý thuyết cân bằng Bias-Variance.\n- Các ý về thêm bớt tương tác: Không phải nguyên lý cơ bản tổng quát.\nMẹo nhớ: Độ phức tạp cao = linh hoạt quá mức = Overfitting."},{"id":20,"slide":29,"topic":"SVM","section":"Not / is true","question":"Which statement about Support Vector Machines is TRUE?","options":["Support Vector Machine models are non-linear.","Support Vector Machine models rarely overfit on training data if using regularization.","Support Vector Machine models can be used for classification but not for regression.","Support Vector Machine models can be used for regression but not for classification."],"answer":[1],"explanation":"**Đáp án đúng: Support Vector Machine models rarely overfit on training data if using regularization.** vì SVM tối đa hoá lề (margin) kết hợp cùng kỹ thuật điều chuẩn (tham số C) giúp kiểm soát chặt chẽ độ phức tạp, hạn chế tối đa nguy cơ quá khớp ngay cả trong không gian số chiều lớn.\n- \"models are non-linear\": Sai vì SVM có cả dạng tuyến tính gốc (Linear SVM) lẫn phi tuyến (Kernel SVM).\n- \"can be used for classification but not for regression\" (và ngược lại): Đều sai vì SVM dùng tốt cho cả phân loại (SVC) lẫn hồi quy (SVR).\nMẹo nhớ: SVM có Regularization và Margin lớn chống Overfitting tốt; áp dụng cho cả Classification lẫn Regression."},{"id":21,"slide":30,"topic":"Tổng quan AI / ML","section":"Not / is true","question":"Which following statement about unsupervised algorithms is CORRECT?","options":["Unsupervised algorithms are relevant when we don't have the outcomes we are trying to predict and when we want to break down our data set into smaller groups.","Unsupervised algorithms are relevant when we have outcomes we are trying to predict.","Unsupervised algorithms are typically used to forecast time related patterns like stock market trends or sales forecasts.","Unsupervised algorithms are relevant in cases that require explainability, for example comparing parameters from one model to another."],"answer":[0],"explanation":"**Đáp án đúng: Unsupervised algorithms are relevant when we don't have the outcomes we are trying to predict and when we want to break down our data set into smaller groups.** vì học không giám sát hoạt động trên dữ liệu không có nhãn/kết quả mục tiêu và mục đích chính là phân nhóm dữ liệu (Clustering) hoặc khám phá cấu trúc ẩn.\n- \"when we have outcomes we are trying to predict\": Đây là định nghĩa của Supervised Learning.\n- \"forecast time related patterns...\": Dự báo chuỗi thời gian là bài toán có giám sát.\n- \"require explainability...\": Không phải tiêu chí định nghĩa học không giám sát.\nMẹo nhớ: Unsupervised = Không có nhãn (no target outcome) -> Gom nhóm, phân cụm."},{"id":22,"slide":31,"topic":"Phân loại (Logistic…)","section":"Not / is true","question":"Which statement about Logistic Regression is TRUE?","options":["Logistic Regression is a generalized linear model.","Logistic Regression models can only predict variables with 2 classes.","Logistic Regression models can be used for classification but not for regression.","Logistic Regression models cannot be used for regression and classification."],"answer":[0],"explanation":"**Đáp án đúng: Logistic Regression is a generalized linear model.** vì hồi quy Logistic thuộc họ mô hình tuyến tính tổng quát (GLM), sử dụng hàm liên kết logit để ánh xạ tổ hợp tuyến tính thành xác suất.\n- \"can only predict variables with 2 classes\": Sai vì có thể mở rộng sang đa lớp với Multinomial Logistic Regression (Softmax).\n- \"cannot be used for regression and classification\": Hoàn toàn sai.\nMẹo nhớ: Logistic Regression là mô hình GLM (Generalized Linear Model) với hàm liên kết logit."},{"id":23,"slide":32,"topic":"EDA & Xử lý dữ liệu","section":"Not / is true","question":"Which statement about the Pandas read_csv function is TRUE?","options":["It can only read comma-delimited data","It can read both tab-delimited and space-delimited data","It reads data into a 2-dimensional NumPy array","It allows only one argument: the name of the file"],"answer":[1],"explanation":"**Đáp án đúng: It can read both tab-delimited and space-delimited data** vì hàm `pd.read_csv` có thể xử lý nhiều loại dấu phân cách khác nhau thông qua tham số `sep` (ví dụ `\\t`) hoặc `delim_whitespace=True`.\n- \"only read comma-delimited data\": Sai vì đọc được hầu hết các ký tự phân tách.\n- \"reads data into a 2-dimensional NumPy array\": Sai vì trả về đối tượng Pandas `DataFrame`.\n- \"allows only one argument\": Sai vì hàm có rất nhiều tham số tuỳ chọn.\nMẹo nhớ: `pd.read_csv` rất linh hoạt với dấu phân cách và trả về DataFrame."},{"id":24,"slide":33,"topic":"Regularization & Overfitting","section":"Not / is true","question":"Which of the following statements about regularization is TRUE?","options":["Regularization always reduces the number of selected features.","Regularization increases the likelihood of overfitting relative to training data.","Regularization decreases the likelihood of overfitting relative to training data.","Regularization performs feature selection without a negative impact in the likelihood of overfitting relative to the training data."],"answer":[2],"explanation":"**Đáp án đúng: Regularization decreases the likelihood of overfitting relative to training data.** vì điều chuẩn (như L1 Lasso, L2 Ridge) áp hình phạt lên các trọng số lớn, ép mô hình đơn giản hơn và giảm nguy cơ Overfitting.\n- \"always reduces the number of selected features\": Sai vì L2 (Ridge) chỉ thu nhỏ trọng số chứ không triệt tiêu về 0, chỉ có L1 (Lasso) mới loại bỏ biến.\n- \"increases the likelihood of overfitting\": Trái ngược hoàn toàn với bản chất của Regularization.\nMẹo nhớ: Regularization thêm hàm phạt kìm hãm trọng số -> giảm Overfitting; Lasso triệt tiêu biến, Ridge thì không."},{"id":25,"slide":34,"topic":"Regularization & Overfitting","section":"Not / is true","question":"Which of the following statements about a high-complexity model in a linear regression setting is TRUE?","options":["Cross-validation with a small k will reduce or eliminate overfitting.","A high variance of parameter estimates across cross-validation subsamples indicates likely overfitting.","A low variance of parameter estimates across cross-validation subsamples indicates likely overfitting.","Cross-validation with a large k will reduce or eliminate overfitting."],"answer":[1],"explanation":"**Đáp án đúng: A high variance of parameter estimates across cross-validation subsamples indicates likely overfitting.** vì khi mô hình quá phức tạp, nó rất nhạy cảm với các biến động nhỏ giữa các tập con huấn luyện (High Variance), dẫn đến các hệ số ước lượng thay đổi thất thường giữa các fold.\n- \"Cross-validation with small/large k will reduce or eliminate overfitting\": Sai vì Cross-Validation chỉ là công cụ đo lường và đánh giá, tự nó không làm giảm Overfitting.\n- \"A low variance... indicates likely overfitting\": Sai vì phương sai thấp là biểu hiện của mô hình ổn định hoặc Underfitting (High Bias).\nMẹo nhớ: Overfitting luôn gắn liền với High Variance (ước lượng tham số dao động mạnh qua các tập con)."},{"id":27,"slide":36,"topic":"EDA & Xử lý dữ liệu","section":"Not / is true","question":"Which of the following statements about cloud data access using Pandas is TRUE?","options":["With read_csv, the online file must be comma-delimited.","The read_csv function can read data directly from a website or url.","With read_csv, the destination file must have column names in the first row.","A remote destination file must be downloaded locally before it can be read by Pandas."],"answer":[1],"explanation":"**Đáp án đúng: The read_csv function can read data directly from a website or url.** vì hàm `pd.read_csv()` hỗ trợ truyền trực tiếp một đường dẫn URL (như HTTP, HTTPS, FTP, S3) để đọc dữ liệu mà không cần tải file về máy trước.\n- \"must be downloaded locally...\": Sai vì Pandas tự động tải nội dung từ URL qua bộ nhớ đệm.\n- \"must be comma-delimited\" và \"must have column names...\": Sai vì có thể tuỳ biến bằng tham số `sep` và `header=None`.\nMẹo nhớ: `pd.read_csv()` nhận trực tiếp URL như một file path cục bộ."},{"id":28,"slide":37,"topic":"Dữ liệu mất cân bằng","section":"Not / is true","question":"Which of the following statements about Random Upsampling is TRUE?","options":["Random Upsampling preserves all original observations.","Random Upsampling will generally lead to a higher F1 score.","Random Upsampling generates observations that were not part of the original data.","Random Upsampling results in excessive focus on the more frequently-occurring class."],"answer":[0],"explanation":"**Đáp án đúng: Random Upsampling preserves all original observations.** vì tăng mẫu ngẫu nhiên (Random Upsampling) sao chép có hoàn lại các mẫu thuộc lớp thiểu số và giữ nguyên toàn bộ các quan sát gốc (không loại bỏ mẫu nào như Downsampling).\n- \"generates observations that were not part of the original data\": Sai vì đây là đặc trưng của tăng mẫu nhân tạo (Synthetic Upsampling / SMOTE), Random chỉ nhân bản điểm có sẵn.\n- \"results in excessive focus on the more frequently-occurring class\": Sai vì mục tiêu là cân bằng lớp bằng cách bổ sung lớp thiểu số.\nMẹo nhớ: Random Upsampling giữ nguyên 100% dữ liệu gốc và chỉ duplicate thêm lớp thiểu số."},{"id":31,"slide":40,"topic":"SVM","section":"Not / is true","question":"Select the TRUE statement regarding the cost function for SVMs:","options":["SVMs do not use a cost function. They use regularization instead of a cost function.","SVMs use same loss function as logistic regression.","SVMs use a loss function that penalizes vectors prone to misclassification.","SVMs use the Hinge Loss function as a cost function."],"answer":[3],"explanation":"**Đáp án đúng: SVMs use the Hinge Loss function as a cost function.** vì hàm mất mát tiêu chuẩn của Support Vector Machine là Hinge Loss: `max(0, 1 - y * f(x))`, chỉ phạt các điểm nằm sai phía hoặc vi phạm vùng lề an toàn.\n- \"do not use a cost function\": Sai vì SVM tối ưu hoá hàm mục tiêu gồm Hinge Loss kết hợp với điều chuẩn `L2`.\n- \"use same loss function as logistic regression\": Sai vì hồi quy Logistic dùng Log Loss (Binary Cross-Entropy).\nMẹo nhớ: SVM đi liền với Hinge Loss; Logistic Regression đi liền với Log Loss."},{"id":32,"slide":41,"topic":"Đánh giá mô hình (metrics)","section":"Not / is true","question":"You are evaluating a binary classifier. There are 50 positive outcomes in the test data, and 100 observations. Using a 50% threshold, the classifier predicts 40 positive outcomes, of which 10 are incorrect.\nIncreasing the threshold to 60% results in 5 additional positive predictions, all of which are correct. Which of the following statements about this new model (compared with the original model that had a 50% threshold) is TRUE?","options":["The F1 score of the classifier would decrease.","The area under the ROC curve would decrease.","The F1 score of the classifier would remain the same.","The area under the ROC curve would remain the same."],"answer":[3],"explanation":"**Đáp án đúng: The area under the ROC curve would remain the same.** vì diện tích dưới đường cong ROC (AUC-ROC) là chỉ số đánh giá khả năng xếp hạng xác suất tổng thể của mô hình trên toàn bộ các ngưỡng; việc thay đổi ngưỡng phân loại cụ thể chỉ dịch chuyển điểm hoạt động trên đường cong chứ không làm thay đổi đường cong ROC hay giá trị AUC.\n- \"The F1 score... decrease / remain the same\": Sai vì có thêm 5 ca đoán đúng (TP tăng từ 30 lên 35, FP giữ nguyên 10) nên cả Precision và Recall đều tăng, dẫn tới F1-score thực tế tăng lên.\n- \"area under the ROC curve would decrease\": Sai vì AUC độc lập với ngưỡng phân loại đã chọn.\nMẹo nhớ: AUC-ROC đo năng lực phân loại trên mọi ngưỡng -> Đổi threshold không làm đổi AUC.\nLưu ý: Đề bài nêu tăng ngưỡng nhưng lại tăng số ca dương tính là quy ước ngược với thông thường (threshold càng cao thì dự đoán positive càng ít), tuy nhiên tính chất AUC không đổi theo threshold luôn đúng."},{"id":33,"slide":42,"topic":"Đánh giá mô hình (metrics)","section":"Not / is true","question":"You are evaluating a binary classifier. There are 50 positive outcomes in the test data, and 100 observations. Using a 50% threshold, the classifier predicts 40 positive outcomes, of which 10 are incorrect.\nThe threshold is now increased further, to 70%. Which of the following statements is TRUE?","options":["The Recall of the classifier would decrease.","The Precision of the classifier would decrease.","The Recall of the classifier would increase or remain the same.","The Precision of the classifier would increase or remain the same."],"answer":[0],"explanation":"**Đáp án đúng: The Recall of the classifier would decrease.** vì khi tăng ngưỡng quyết định (threshold từ 50% lên 70%), mô hình khắt khe hơn trong việc gán nhãn dương tính, làm giảm số lượng ca được đoán là Positive; do đó số ca True Positive (TP) giảm, kéo theo Recall (`TP / Actual Positives`) giảm xuống.\n- \"The Recall... would increase or remain the same\": Sai vì tăng ngưỡng không thể làm tăng số ca TP.\n- \"The Precision of the classifier would decrease\": Sai vì thông thường khi lọc chặt hơn, Precision có xu hướng tăng lên.\nMẹo nhớ: Tăng threshold -> Máy khắt khe hơn -> Đoán Positive ít đi -> Bỏ sót nhiều hơn -> Recall giảm."},{"id":34,"slide":44,"topic":"Regularization & Overfitting","section":"Not / is true","question":"Which of the following statements is FALSE?","options":["In Analytic View, increasing L2/L1 penalties force coefficients to be smaller, restricting their plausible range.","Under the Geometric formulation, the cost function minimum is found at the intersection of the penalty boundary and a contour of the traditional OLS cost function surface.","Under the Probabilistic formulation, L2 (Ridge) regularization imposes Gaussian prior on the coefficients, while L1 (Lasso) regularization imposes Laplacian prior.","None of the others"],"answer":[3],"explanation":"**Đáp án đúng: None of the others** vì cả ba phát biểu còn lại đều hoàn toàn chính xác theo các góc nhìn toán học của Regularization:\n- Góc nhìn giải tích (Analytic View): Tăng hệ số phạt ép trọng số co về gần 0, giới hạn miền giá trị của hệ số.\n- Góc nhìn hình học (Geometric View): Nghiệm tối ưu nằm tại tiếp điểm giữa đường mức (contour) của hàm mất mát OLS và biên vùng ràng buộc tham số (hình tròn với L2, hình thoi với L1).\n- Góc nhìn xác suất (Probabilistic/Bayesian View): Ridge tương đương với tiền nghiệm Gauss (Gaussian prior), Lasso tương đương với tiền nghiệm Laplace (Laplacian prior).\nMẹo nhớ: Cả 3 phát biểu về Analytic, Geometric, Probabilistic đều là lý thuyết chuẩn của L1/L2, không có câu nào sai."},{"id":35,"slide":45,"topic":"SVM","section":"Not / is true","question":"All of these are characteristics of SVMs, EXCEPT:","options":["Support Vector Machines do not return predicted probabilities.","Support Vector Machines use decision boundaries for classification.","The algorithm behind Support Vector Machines calculates hyperplanes that minimize misclassification error.","Support Vector Machine models are non-linear."],"answer":[3],"explanation":"**Đáp án đúng: Support Vector Machine models are non-linear.** vì về bản chất gốc, SVM là một bộ phân loại tuyến tính (tìm siêu phẳng cực đại hoá biên margin); khi dữ liệu không tách biệt tuyến tính mới dùng Kernel Trick để ánh xạ lên không gian chiều cao hơn, do đó không thể khẳng định SVM chỉ là mô hình phi tuyến.\n- \"do not return predicted probabilities\": Đúng vì SVM xuất ra khoảng cách đại số tới siêu phẳng quyết định chứ không tự nhiên tạo ra xác suất (cần qua Platt scaling).\n- \"use decision boundaries...\": Đúng vì siêu phẳng chính là ranh giới quyết định.\n- \"calculates hyperplanes...\": Đúng vì thuật toán tìm siêu phẳng tối ưu hoá biên và giảm thiểu lỗi phân loại.\nMẹo nhớ: Bản chất SVM là tìm siêu phẳng tuyến tính (linear hyperplane)."},{"id":36,"slide":46,"topic":"Dữ liệu mất cân bằng","section":"Not / is true","question":"These are all methods of dealing with unbalanced classes EXCEPT:","options":["Downsampling.","Mix of in-sample and out-of-sample.","Mix of downsampling and upsampling.","Upsampling."],"answer":[1],"explanation":"**Đáp án đúng: Mix of in-sample and out-of-sample.** vì in-sample và out-of-sample là thuật ngữ chỉ tập dữ liệu huấn luyện và tập dữ liệu kiểm thử, việc trộn hai tập này không phải là phương pháp xử lý mất cân bằng lớp (thậm chí gây rò rỉ dữ liệu - Data Leakage).\n- Downsampling, Upsampling, Mix of downsampling and upsampling: Đều là các kỹ thuật tái lấy mẫu (Resampling) tiêu chuẩn để cân bằng tỷ lệ mẫu giữa các lớp.\nMẹo nhớ: Xử lý mất cân bằng dùng Re-sampling (Up/Down sampling) hoặc Cost-sensitive learning, không dùng in/out-of-sample."},{"id":37,"slide":47,"topic":"KNN & Decision Tree","section":"Not / is true","question":"These are all characteristics of the k nearest neighbors algorithm EXCEPT:","options":["It is sensitive to scaling","It determines decision boundaries to make predictions","It determines the value for k","It is well suited to predict variables with multiple classes"],"answer":[2],"explanation":"**Đáp án đúng: It determines the value for k** vì `k` là siêu tham số (hyperparameter) do người dùng lựa chọn thông qua thực nghiệm hoặc Cross-Validation, thuật toán k-NN không tự học hay xác định được giá trị `k`.\n- \"sensitive to scaling\": Đặc tính đúng vì khoảng cách bị chi phối bởi biến có độ lớn thang đo cao.\n- \"determines decision boundaries...\": Đúng vì ranh giới được tạo thành từ các vùng lân cận Voronoi.\n- \"well suited to predict variables with multiple classes\": Đúng vì áp dụng biểu quyết đa số tự nhiên cho nhiều lớp.\nMẹo nhớ: k là hyperparameter ngoại sinh, người dùng phải tự truyền vào."},{"id":38,"slide":48,"topic":"KNN & Decision Tree","section":"Not / is true","question":"These are all characteristics of decision trees, EXCEPT:","options":["They segment data based on features to predict results","They split nodes into leaves","They can be used for either classification or regression","They have well rounded decision boundaries"],"answer":[3],"explanation":"**Đáp án đúng: They have well rounded decision boundaries** vì cây quyết định phân tách dữ liệu bằng các đường cắt vuông góc với từng trục toạ độ (axis-aligned splits), tạo ra các ranh giới dạng khối hộp/bậc thang chữ nhật chứ không bao giờ có đường biên uốn cong mềm mại (well rounded).\n- \"segment data based on features...\": Đúng vì cây phân chia không gian dữ liệu tại từng nút điều kiện.\n- \"split nodes into leaves\": Đúng vì cấu trúc cây phân nhánh từ nút gốc qua các nút quyết định đến lá (leaves).\n- \"used for either classification or regression\": Đúng vì thuật toán CART hỗ trợ cả cây phân loại và cây hồi quy.\nMẹo nhớ: Ranh giới cây quyết định luôn vuông góc theo trục toạ độ (góc cạnh bậc thang, không uốn cong)."},{"id":39,"slide":49,"topic":"Tổng quan AI / ML","section":"Not / is true","question":"You can use supervised machine learning for all of the following examples, EXCEPT:","options":["Segment customers by their demographics.","Predict the number of customers that will visit a store on a given week.","Predict the probability of a customer returning to a store.","Interpret the main drivers that determine if a customer will return to a store."],"answer":[0],"explanation":"**Đáp án đúng: Segment customers by their demographics.** vì gom cụm/phân khúc khách hàng dựa trên nhân khẩu học khi không có nhãn mục tiêu cho trước là bài toán học không giám sát (Unsupervised Learning / Clustering).\n- \"Predict the number...\": Là bài toán hồi quy (Regression) có giám sát.\n- \"Predict the probability...\" và \"Interpret the main drivers...\": Đều là bài toán phân loại (Classification) có nhãn giám sát.\nMẹo nhớ: Phân đoạn khách hàng không có nhãn mục tiêu là việc của Unsupervised Learning."},{"id":41,"slide":52,"topic":"Clustering & khoảng cách","section":"Câu ngắn","question":"What is the role of bandwidth in mean-shift clustering?","options":["Controls convergence speed","Determines cluster size","Defines neighborhood size","Sets the number of clusters"],"answer":[2],"explanation":"**Đáp án đúng: Defines neighborhood size** vì trong thuật toán Mean-Shift, tham số băng thông (bandwidth `h`) xác định bán kính của cửa sổ hàm nhân (kernel window), tức quy định độ lớn vùng lân cận để tính toán mật độ và dịch chuyển tâm điểm.\n- \"Sets the number of clusters\": Sai vì Mean-Shift tự động tìm ra số lượng cụm dựa trên các đỉnh mật độ, người dùng không thể gán trước số cụm.\n- \"Controls convergence speed\" / \"Determines cluster size\": Đây chỉ là các hệ quả gián tiếp, vai trò trực tiếp cốt lõi là định nghĩa kích thước lân cận (neighborhood size).\nMẹo nhớ: Bandwidth trong Mean-Shift = Bán kính cửa sổ láng giềng."},{"id":42,"slide":53,"topic":"Regularization & Overfitting","section":"Câu ngắn","question":"What is the main concern with high bias in a model?","options":["Overfitting","Underfitting","Model convergence issues","Data leakage"],"answer":[1],"explanation":"**Đáp án đúng: Underfitting** vì độ chệch cao (High Bias) đồng nghĩa với việc mô hình áp đặt các giả định quá cứng nhắc và đơn giản, không học được quy luật thực tế của dữ liệu, dẫn đến hiện tượng chưa khớp (Underfitting).\n- Overfitting: Đi liền với phương sai cao (High Variance), trái ngược với High Bias.\n- Model convergence issues / Data leakage: Là các vấn đề kỹ thuật và tiền xử lý, không phản ánh trực tiếp sự đánh đổi Bias-Variance.\nMẹo nhớ: High Bias = Underfitting (quá cứng nhắc); High Variance = Overfitting (quá nhạy cảm)."},{"id":43,"slide":54,"topic":"Clustering & khoảng cách","section":"Câu ngắn","question":"What is the key parameter in the K-means algorithm that determines the number of clusters?","options":["Learning rate","Batch size","Number of iterations","K (number of clusters)"],"answer":[3],"explanation":"**Đáp án đúng: K (number of clusters)** vì trong thuật toán K-means, tham số `K` đại diện cho số lượng cụm (clusters) cần phân chia và bắt buộc phải được người dùng khai báo trước khi huấn luyện (`n_clusters=k`).\n- Learning rate / Batch size: Là các siêu tham số trong tối ưu hoá Gradient Descent và học sâu (Deep Learning).\n- Number of iterations: Chỉ quy định số vòng lặp tối đa để cập nhật toạ độ centroid đến khi hội tụ.\nMẹo nhớ: Chữ `K` trong K-means chính là số lượng cụm (clusters)."},{"id":44,"slide":55,"topic":"Hồi quy tuyến tính & đa thức","section":"Câu ngắn","question":"What is the most common sklearn methods to add polynomial features to your data?","options":["polyFeat.add and polyFeat.transform","polyFeat.add and polyFeat.fit","polyFeat.fit and polyFeat.transform","polyFeat.transform"],"answer":[2],"explanation":"**Đáp án đúng: polyFeat.fit and polyFeat.transform** vì theo chuẩn thiết kế API của scikit-learn (Transformer), lớp `PolynomialFeatures` sử dụng phương thức `fit()` để học cấu trúc bậc đặc trưng và `transform()` để tạo ra ma trận đặc trưng đa thức mới (hoặc gọi gộp `fit_transform()`).\n- Các phương án có `polyFeat.add`: Sai vì trong scikit-learn không tồn tại phương thức `add()`.\n- Chỉ `polyFeat.transform`: Sai vì nếu không `fit()` trước thì đối tượng không có thông tin đầu vào để thực hiện chuyển đổi.\nMẹo nhớ: Chuẩn scikit-learn transformer luôn là `fit` và `transform`."},{"id":45,"slide":56,"topic":"Hồi quy tuyến tính & đa thức","section":"Câu ngắn","question":"What is the main disadvantage of using a high-degree polynomial in Polynomial Regression?","options":["It is computationally expensive","It may lead to overfitting","It always results in underfitting","It converges slowly"],"answer":[1],"explanation":"**Đáp án đúng: It may lead to overfitting** vì khi bậc đa thức quá cao, đường cong hồi quy trở nên cực kỳ phức tạp và uốn lượn để đi qua mọi điểm dữ liệu, ghi nhớ cả nhiễu và gây ra hiện tượng quá khớp (Overfitting).\n- \"always results in underfitting\": Sai vì bậc cao làm tăng độ phức tạp của mô hình, giúp giảm Bias chứ không gây Underfitting.\n- \"It is computationally expensive\": Dù có làm tăng khối lượng tính toán, nhưng nhược điểm nghiêm trọng nhất đối với hiệu năng mô hình ML luôn là rủi ro Overfitting.\nMẹo nhớ: Đa thức bậc càng cao -> đường cong càng ngoằn ngoèo -> Overfitting."},{"id":46,"slide":57,"topic":"Ensemble (RF, Bagging, Boosting)","section":"Câu ngắn","question":"What is the impact of increasing the number of trees in a Random Forest on its performance?","options":["Improved model interpretability","Increased risk of overfitting","Decreased computational efficiency","Enhanced model generalization"],"answer":[3],"explanation":"**Đáp án đúng: Enhanced model generalization** vì Random Forest hoạt động dựa trên cơ chế Bagging; việc tăng số lượng cây giúp giảm phương sai (variance) của tổng thể mô hình thông qua lấy trung bình biểu quyết, từ đó tăng cường khả năng tổng quát hoá (generalization).\n- \"Increased risk of overfitting\": Sai vì theo định lý của Leo Breiman, việc thêm cây trong Random Forest không làm tăng nguy cơ quá khớp mà trái lại giúp mô hình ổn định hơn.\n- \"Improved model interpretability\": Sai vì càng nhiều cây thì mô hình càng phức tạp và khó giải thích.\nMẹo nhớ: Random Forest thêm cây KHÔNG gây Overfitting mà giúp mô hình tổng quát hoá tốt hơn."},{"id":47,"slide":58,"topic":"Ensemble (RF, Bagging, Boosting)","section":"Câu ngắn","question":"What is an ensemble model that needs you to look at out of bag error?","options":["Logistic Regression.","Out of Bag Regression","Random Forest","Stacking"],"answer":[2],"explanation":"**Đáp án đúng: Random Forest** vì Random Forest sử dụng kỹ thuật Bootstrap Aggregation (lấy mẫu có hoàn lại), trong đó khoảng 36.8% dữ liệu không được chọn vào tập huấn luyện của mỗi cây gọi là Out-Of-Bag (OOB); tập mẫu này được dùng để đánh giá sai số OOB error mà không cần chia thêm tập validation.\n- Logistic Regression: Là mô hình tuyến tính đơn lẻ, không dùng bootstrap nên không có OOB.\n- Out of Bag Regression: Tên bịa, không phải thuật toán ensemble.\n- Stacking: Thường dùng K-fold cross-validation để tạo out-of-fold predictions, không dựa trên cơ chế OOB của bootstrap.\nMẹo nhớ: Cứ thấy Bootstrap / Bagging / Random Forest là có Out-of-Bag (OOB)."},{"id":48,"slide":59,"topic":"Clustering & khoảng cách","section":"Câu ngắn","question":"What is the other name we can give to the L2 distance?","options":["Hamming Distance","Euclidean Distance","Manhattan Distance","Mahalanobis Distance"],"answer":[1],"explanation":"**Đáp án đúng: Euclidean Distance** vì chuẩn $L_2$ chính là khoảng cách Euclid (đường chim bay) theo công thức $\\sqrt{\\sum (x_i - y_i)^2}$.\n- Manhattan Distance: Là khoảng cách chuẩn $L_1$ ($\\sum |x_i - y_i|$).\n- Hamming Distance: Đo số lượng vị trí khác biệt giữa hai chuỗi ký tự/nhị phân.\n- Mahalanobis Distance: Khoảng cách có tính đến ma trận hiệp phương sai của dữ liệu.\nMẹo nhớ: $L_1$ là Manhattan (đường phố ô cờ); $L_2$ là Euclidean (đường thẳng nối hai điểm)."},{"id":49,"slide":60,"topic":"Regularization & Overfitting","section":"Câu ngắn","question":"What is another name for L1 regularization?","options":["Ridge regularization","Lasso regularization","Elastic Net regularization","Overfitting regularization"],"answer":[1],"explanation":"**Đáp án đúng: Lasso regularization** vì điều chuẩn $L_1$ thêm tổng trị tuyệt đối của trọng số $|\\mathbf{w}|$ vào hàm mất mát, thường được gọi là hồi quy Lasso (Least Absolute Shrinkage and Selection Operator).\n- Ridge regularization: Là tên gọi của điều chuẩn $L_2$ (phạt tổng bình phương trọng số $\\mathbf{w}^2$).\n- Elastic Net: Là phương pháp kết hợp đồng thời cả điều chuẩn $L_1$ và $L_2$.\nMẹo nhớ: L1 = Lasso (có chữ L và số 1); L2 = Ridge."},{"id":50,"slide":61,"topic":"Tổng quan AI / ML","section":"Câu ngắn","question":"What are the first two steps of a typical machine learning workflow?","options":["Problem statement and data cleaning.","Problem statement and data collection.","Data collection and data transformation.","None of the others"],"answer":[1],"explanation":"**Đáp án đúng: Problem statement and data collection.** vì quy trình Machine Learning chuẩn luôn bắt đầu bằng việc xác định rõ bài toán kinh doanh/mục tiêu (Problem statement), sau đó mới tiến hành thu thập dữ liệu liên quan (Data collection).\n- Data cleaning / Data transformation: Đều là các bước diễn ra sau khi đã có dữ liệu trong tay, không thể làm sạch hay biến đổi khi chưa thu thập dữ liệu.\nMẹo nhớ: Phải biết cần giải quyết cái gì (Problem), rồi mới đi tìm dữ liệu về (Collection)."},{"id":51,"slide":62,"topic":"SVM","section":"Câu ngắn","question":"What parameter in the SVC function specifies the choice of kernel?","options":["neighbors","kernel","max_depth","n_estimators"],"answer":[1],"explanation":"**Đáp án đúng: kernel** vì trong hàm `SVC()` của scikit-learn, tham số `kernel` dùng để chỉ định hàm nhân sử dụng (ví dụ: `'linear'`, `'rbf'`, `'poly'`, `'sigmoid'`).\n- neighbors: Là tham số `n_neighbors` của mô hình k-NN.\n- max_depth: Là tham số độ sâu tối đa của Decision Tree / Random Forest.\n- n_estimators: Là tham số số lượng cây của Random Forest / Gradient Boosting.\nMẹo nhớ: Chọn hàm nhân trong SVC dùng tham số mang đúng tên `kernel`."},{"id":52,"slide":63,"topic":"Giảm chiều (PCA, MDS…)","section":"Câu ngắn","question":"What parameter in the MDS function specifies the number of dimensions in the lower-dimensional space?","options":["n_components","n_features","n_dim","n_neighbors"],"answer":[0],"explanation":"**Đáp án đúng: n_components** vì trong scikit-learn (`sklearn.manifold.MDS`), tham số `n_components` quy định số chiều của không gian hạ chiều đích (mặc định là 2).\n- n_features: Không phải tham số trong MDS (chỉ là thuộc tính số đặc trưng gốc).\n- n_dim: Tên tự đặt, không tồn tại trong scikit-learn.\n- n_neighbors: Là tham số của k-NN, Isomap hoặc LLE.\nMẹo nhớ: Tất cả các thuật toán giảm chiều trong sklearn (PCA, MDS, t-SNE) đều dùng `n_components`."},{"id":53,"slide":64,"topic":"EDA & Xử lý dữ liệu","section":"Câu ngắn","question":"Which of the following is an example of a file type that uses Javascript Object Notation (JSON) formatting?","options":["Python (py files)","Javascript (js files)","SQL Database (sql files)","Jupyter/Python (ipynb files)"],"answer":[3],"explanation":"**Đáp án đúng: Jupyter/Python (ipynb files)** vì các file Jupyter Notebook (`.ipynb`) có định dạng cấu trúc bên dưới chính là một chuỗi văn bản JSON chứa các ô cell mã nguồn, markdown và metadata.\n- `.py`, `.js`, `.sql`: Đều là các tệp mã nguồn văn bản thuần tuý (plain text code), không lưu theo định dạng JSON.\nMẹo nhớ: File `.ipynb` mở bằng text editor chính là file JSON."},{"id":54,"slide":65,"topic":"Dữ liệu mất cân bằng","section":"Câu ngắn","question":"Which of the following is a common metric used to evaluate models in the presence of imbalanced classes?","options":["Accuracy","Mean Squared Error","R-squared","F1 Score"],"answer":[3],"explanation":"**Đáp án đúng: F1 Score** vì F1-score là trung bình điều hoà giữa Precision và Recall, giúp đánh giá chính xác năng lực dự đoán trên lớp thiểu số mà không bị thiên lệch bởi số lượng áp đảo của lớp đa số.\n- Accuracy: Rất dễ bị ngộ nhận (Accuracy Paradox) khi dữ liệu lệch lớp (ví dụ đoán toàn bộ là đa số vẫn đạt độ chính xác 99%).\n- Mean Squared Error và R-squared: Là các chỉ số đo lường cho bài toán hồi quy (Regression), không dùng cho phân loại.\nMẹo nhớ: Dữ liệu mất cân bằng nhãn tuyệt đối không dùng Accuracy, hãy dùng F1-score / PR-AUC."},{"id":55,"slide":66,"topic":"Giảm chiều (PCA, MDS…)","section":"Câu ngắn","question":"Which of the following is a common technique for linear dimensionality reduction?","options":["Decision Trees","Principal Component Analysis (PCA)","K-means Clustering","Support Vector Machines"],"answer":[1],"explanation":"**Đáp án đúng: Principal Component Analysis (PCA)** vì PCA là kỹ thuật giảm chiều dữ liệu tuyến tính (linear dimensionality reduction) phổ biến nhất, hoạt động bằng cách chiếu dữ liệu lên các trục thành phần chính trực giao có phương sai lớn nhất.\n- Decision Trees và Support Vector Machines: Là các thuật toán học có giám sát phục vụ phân loại hoặc hồi quy.\n- K-means Clustering: Là thuật toán gom cụm (Clustering), không phải kỹ thuật giảm chiều.\nMẹo nhớ: PCA = Giảm chiều tuyến tính kinh điển (Linear Dimensionality Reduction)."},{"id":56,"slide":67,"topic":"EDA & Xử lý dữ liệu","section":"Câu ngắn","question":"Which of the following is not typically considered an EDA technique?","options":["Gradient descent optimization.","Correlation analysis.","Distribution analysis (e.g., histograms).","Boxplots for detecting outliers."],"answer":[0],"explanation":"**Đáp án đúng: Gradient descent optimization.** vì Gradient Descent là thuật toán tối ưu hoá dùng trong quá trình huấn luyện mô hình để tìm bộ trọng số tối thiểu hoá hàm mất mát, không phải là kỹ thuật phân tích khám phá dữ liệu (EDA).\n- Correlation analysis, histograms, boxplots: Đều là các phương pháp thống kê và trực quan hoá cốt lõi của EDA để tìm hiểu tương quan, phân phối và ngoại lai.\nMẹo nhớ: Gradient Descent để train model (tối ưu hoá), không phải để khám phá dữ liệu (EDA)."},{"id":57,"slide":68,"topic":"Clustering & khoảng cách","section":"Câu ngắn","question":"Which distance metric is useful when we have text documents and we want to group similar topics together?","options":["Manhattan Distance","Euclidean","Jaccard","Mahalanobis Distance"],"answer":[2],"explanation":"**Đáp án đúng: Jaccard** vì khoảng cách/độ tương đồng Jaccard đo tỷ lệ giao trên hợp giữa các tập hợp từ vựng, rất phù hợp để so sánh mức độ tương tự chủ đề giữa các văn bản biểu diễn dạng túi từ (bag-of-words).\n- Euclidean / Manhattan: Rất nhạy cảm với độ dài văn bản và sự thưa thớt (sparsity) trong không gian nhiều chiều.\n- Mahalanobis: Cần ma trận hiệp phương sai khả nghịch, không khả thi với dữ liệu văn bản số chiều lớn.\nMẹo nhớ: Dữ liệu văn bản dạng tập hợp từ (sets of words) -> Dùng độ đo Jaccard."},{"id":58,"slide":69,"topic":"Regularization & Overfitting","section":"Câu ngắn","question":"Which problem in machine learning does regularization primarily address?","options":["Overfitting","Underfitting","Both overfitting and underfitting","Feature engineering"],"answer":[0],"explanation":"**Đáp án đúng: Overfitting** vì điều chuẩn (Regularization) thêm số hạng phạt vào hàm mất mát để hạn chế độ lớn của các trọng số, giảm độ phức tạp của mô hình và trực tiếp ngăn ngừa hiện tượng quá khớp (Overfitting).\n- Underfitting: Sai vì Regularization kìm hãm mô hình, nếu lạm dụng sẽ gây ra Underfitting chứ không phải giải quyết nó.\n- Feature engineering: Là bước tạo/biến đổi đặc trưng trước khi train, không phải nhiệm vụ của Regularization.\nMẹo nhớ: Regularization sinh ra là để khắc chế Overfitting."},{"id":59,"slide":70,"topic":"Giảm chiều (PCA, MDS…)","section":"Câu ngắn","question":"Which module in scikit-learn provides the implementation of Kernel PCA?","options":["sklearn.decomposition","sklearn.cluster","sklearn.preprocessing","sklearn.model_selection"],"answer":[0],"explanation":"**Đáp án đúng: sklearn.decomposition** vì module `sklearn.decomposition` trong scikit-learn chứa tất cả các thuật toán phân tích ma trận và giảm chiều dữ liệu như `PCA`, `KernelPCA`, `FastICA`, `NMF`.\n- sklearn.cluster: Chứa các thuật toán gom cụm như `KMeans`, `DBSCAN`.\n- sklearn.preprocessing: Chứa các công cụ chuẩn hoá dữ liệu như `StandardScaler`, `OneHotEncoder`.\n- sklearn.model_selection: Chứa các công cụ chia dữ liệu và tìm siêu tham số như `train_test_split`, `GridSearchCV`.\nMẹo nhớ: Các kỹ thuật phân rã/giảm chiều (PCA, KernelPCA) nằm trong `sklearn.decomposition`."},{"id":60,"slide":71,"topic":"Dữ liệu mất cân bằng","section":"Câu ngắn","question":"Which technique involves duplicating samples from the minority class to balance the class distribution?","options":["Upsampling","Downsampling","Stratified Sampling","Class Weighting"],"answer":[0],"explanation":"**Đáp án đúng: Upsampling** vì tăng mẫu (Upsampling / Oversampling) cân bằng dữ liệu bằng cách nhân bản (sao chép có hoàn lại) các quan sát thuộc lớp thiểu số.\n- Downsampling: Giảm bớt số lượng mẫu của lớp đa số.\n- Stratified Sampling: Phân tầng dữ liệu khi chia tập để giữ nguyên tỷ lệ các lớp, không nhân bản dữ liệu.\n- Class Weighting: Gán trọng số phạt lớn hơn cho lớp thiểu số trong hàm mất mát.\nMẹo nhớ: Upsampling = Kéo số lượng lớp thiểu số tăng lên (bằng cách nhân bản)."},{"id":61,"slide":72,"topic":"Hồi quy tuyến tính & đa thức","section":"Câu ngắn","question":"Which type of regression is Polynomial Regression an extension of?","options":["Linear Regression","Logistic Regression","Ridge Regression","Poisson Regression"],"answer":[0],"explanation":"**Đáp án đúng: Linear Regression** vì hồi quy đa thức (Polynomial Regression) là dạng mở rộng trực tiếp của Linear Regression; mô hình thêm các đặc trưng bậc cao ($x^2, x^3...$) nhưng hàm số vẫn tuyến tính theo các hệ số trọng số $\\beta$.\n- Logistic Regression: Dùng để phân loại nhị phân/đa lớp dựa trên hàm sigmoid/softmax.\n- Ridge Regression: Là hồi quy tuyến tính có thêm điều chuẩn $L_2$.\n- Poisson Regression: Dùng để mô hình hoá dữ liệu đếm (count data).\nMẹo nhớ: Polynomial Regression thực chất là Linear Regression trên không gian đặc trưng đa thức."},{"id":62,"slide":73,"topic":"EDA & Xử lý dữ liệu","section":"Câu ngắn","question":"Which variable transformation should you use for ordinal data?","options":["Standard scaling","One-hot encoding","Ordinal encoding","Min-max scaling"],"answer":[2],"explanation":"**Đáp án đúng: Ordinal encoding** vì dữ liệu thứ bậc (Ordinal data) có mối quan hệ thứ tự tự nhiên (ví dụ: Thấp, Trung bình, Cao), nên Ordinal Encoding mã hoá chúng thành các số nguyên tăng dần (0, 1, 2...) để bảo toàn thứ tự đó.\n- One-hot encoding: Tạo biến nhị phân giả định các giá trị độc lập nhau, làm mất đi tính thứ bậc tự nhiên.\n- Standard scaling / Min-max scaling: Dùng để co giãn thang đo cho dữ liệu dạng số (numerical), không dùng để mã hoá biến phân loại (categorical).\nMẹo nhớ: Dữ liệu có thứ bậc (Ordinal) thì dùng Ordinal Encoding."},{"id":63,"slide":74,"topic":"Tổng quan AI / ML","section":"Câu ngắn","question":"Which discipline is used to train most models used in computer vision applications?","options":["Deep Learning.","Machine Learning.","Artificial Intelligence.","Reinforcement learning."],"answer":[0],"explanation":"**Đáp án đúng: Deep Learning.** vì thị giác máy tính hiện đại (Computer Vision) chủ yếu sử dụng các mạng nơ-ron tích chập (CNN) và Vision Transformers, vốn là các kiến trúc cốt lõi thuộc lĩnh vực Học sâu (Deep Learning).\n- Machine Learning / Artificial Intelligence: Là các khái niệm bao trùm rộng hơn, câu hỏi hỏi cụ thể phân ngành trực tiếp huấn luyện hầu hết mô hình CV hiện đại.\n- Reinforcement learning: Học tăng cường chủ yếu dùng cho bài toán điều khiển, trò chơi hoặc ra quyết định tuần tự.\nMẹo nhớ: Computer Vision hiện đại gắn liền với Deep Learning (CNNs)."},{"id":64,"slide":75,"topic":"Giảm chiều (PCA, MDS…)","section":"Câu ngắn","question":"How do you instantiate a PCA model in scikit-learn?","options":["pca = KMeans()","pca = PCA()","pca = DBSCAN()","pca = LogisticRegression()"],"answer":[1],"explanation":"**Đáp án đúng: `pca = PCA()`** vì trong scikit-learn (`sklearn.decomposition`), lớp mô hình PCA được khởi tạo trực tiếp bằng cú pháp `PCA()`.\n- `KMeans()` và `DBSCAN()`: Khởi tạo mô hình gom cụm.\n- `LogisticRegression()`: Khởi tạo mô hình phân loại hồi quy Logistic.\nMẹo nhớ: Muốn dùng PCA thì gọi hàm tạo `PCA()`."},{"id":65,"slide":76,"topic":"Tổng quan AI / ML","section":"Câu ngắn","question":"Who coined the term \"artificial intelligence\" at the Dartmouth Conference in 1956, marking the official birth of AI as a field of study?","options":["Alan Turing","John McCarthy","Marvin Minsky","Herbert Simon"],"answer":[1],"explanation":"**Đáp án đúng: John McCarthy** vì ông là người đầu tiên đặt ra thuật ngữ \"Artificial Intelligence\" (Trí tuệ nhân tạo) trong đề xuất cho Hội nghị Dartmouth năm 1956, đánh dấu sự ra đời chính thức của ngành AI.\n- Alan Turing: Tác giả của Phép thử Turing (Turing Test, 1950) và nền tảng khoa học máy tính lý thuyết.\n- Marvin Minsky và Herbert Simon: Là các nhà khoa học đồng sáng lập tiên phong tại hội nghị Dartmouth nhưng không phải người đặt ra thuật ngữ.\nMẹo nhớ: John McCarthy được coi là \"cha đẻ của thuật ngữ AI\" tại Dartmouth 1956."},{"id":66,"slide":77,"topic":"Regularization & Overfitting","section":"Câu ngắn","question":"When dealing with overfitting in Polynomial Regression, what technique can be employed to prevent it?","options":["L1 Regularization","L2 Regularization","Feature Scaling","Cross-validation"],"answer":[1],"explanation":"**Đáp án đúng: L2 Regularization** vì điều chuẩn $L_2$ (Ridge Regression) phạt bình phương độ lớn trọng số, ép các hệ số bậc cao thu nhỏ về gần 0, trực tiếp triệt tiêu sự dao động mạnh của đa thức và ngăn ngừa Overfitting hiệu quả.\n- L1 Regularization: Cũng có tác dụng điều chuẩn nhưng thiên về chọn lọc đặc trưng (ép trọng số bằng 0), trong bài giảng chuẩn thì Ridge ($L_2$) là lựa chọn kinh điển nhất cho hồi quy đa thức.\n- Feature Scaling: Giúp thuật toán tối ưu hội tụ nhanh hơn chứ tự nó không kìm hãm trọng số để chống Overfitting.\n- Cross-validation: Là kỹ thuật kiểm định mô hình, không trực tiếp thay đổi hàm mất mát để chống Overfitting.\nMẹo nhớ: Chống Overfitting trong Polynomial Regression dùng Regularization ($L_2$ Ridge là kỹ thuật chuẩn)."},{"id":67,"slide":78,"topic":"Tổng quan AI / ML","section":"Câu ngắn","question":"Assume you have a data set that summarizes a marketing campaign with information related to prospective customers. The data set contains 100 observations with several columns that summarize information about the prospective customer. It also has a column that flags whether the prospect responded or not.\nIn this context, observation is a synonym of:","options":["label","features","target","example"],"answer":[3],"explanation":"**Đáp án đúng: example** vì trong thuật ngữ Machine Learning, một quan sát (observation - mỗi dòng dữ liệu) đồng nghĩa với `example`, `instance`, `sample` hoặc `record`.\n- features: Là các cột thuộc tính/biến độc lập mô tả thông tin khách hàng.\n- label / target: Là cột nhãn/biến mục tiêu cần dự đoán (ở đây là biến phản hồi - responded).\nMẹo nhớ: Dòng = observation = instance = example = sample; Cột = feature = attribute."},{"id":68,"slide":79,"topic":"Tổng quan AI / ML","section":"Câu ngắn","question":"Assume you have a data set that summarizes a marketing campaign with information related to prospective customers. The data set contains 100 observations with several columns that summarize information about the prospective customer. It also has a column that flags whether the prospect responded or not.\nA machine learning model that predicts response, is using the column Responded as:","options":["sample","features","target","example"],"answer":[2],"explanation":"Trong Machine Learning: Features là các thông tin đầu vào (tuổi, thu nhập, hành vi…); Target (label) là thứ cần dự đoán. Cột Responded (có phản hồi hay không) chính là kết quả cần dự đoán → nên là target (biến mục tiêu)."},{"id":69,"slide":80,"topic":"Thống kê & suy luận","section":"Câu ngắn","question":"Consider the following statements about Estimation and Inference:\na. In general, the population parameters are unknown.\nb. Parametric models have finite number of parameters.","options":["a and b are true","a and b are false","a is true and b is false","a is false and b is true"],"answer":[0],"explanation":"**Đáp án đúng: a and b are true** vì:\n- Phát biểu a đúng: Trong thống kê suy luận, các tham số của tổng thể (population parameters như $\\mu, \\sigma$) là không biết trước và phải được ước lượng thông qua mẫu dữ liệu.\n- Phát biểu b đúng: Mô hình tham số (Parametric models) giả định dạng hàm phân phối cố định nên chỉ có một số lượng tham số hữu hạn, không phụ thuộc vào kích thước tập dữ liệu.\n- Các phương án khác đều sai vì cả hai phát biểu a và b đều là chân lý thống kê.\nMẹo nhớ: Tổng thể luôn ẩn (unknown parameters); mô hình tham số luôn có số lượng tham số cố định hữu hạn."},{"id":70,"slide":82,"topic":"KNN & Decision Tree","section":"Câu ngắn","question":"Decision Tree algorithm can use for","options":["Data Cleaning","Feature Engineering","Classification and Regression","Hyperparameter Tuning"],"answer":[2],"explanation":"**Đáp án đúng: Classification and Regression** vì thuật toán Cây quyết định (Decision Tree / CART) được thiết kế để giải quyết cả hai bài toán cơ bản của học có giám sát: phân loại (Classification) và hồi quy (Regression).\n- Data Cleaning: Là bước làm sạch dữ liệu (xử lý null, ngoại lai), không phải bài toán mô hình hoá của Decision Tree.\n- Feature Engineering: Là bước tạo đặc trưng.\n- Hyperparameter Tuning: Là quá trình tối ưu siêu tham số (như Grid Search).\nMẹo nhớ: CART = Classification And Regression Trees."},{"id":71,"slide":83,"topic":"Tổng quan AI / ML","section":"Câu ngắn","question":"In 2016, which AI technology achieved a significant milestone by defeating the world champion Go player, Lee Sedol?","options":["IBM's Watson","Google's DeepMind AlphaGo","Amazon Alexa","Microsoft's Cortana"],"answer":[1],"explanation":"**Đáp án đúng: Google's DeepMind AlphaGo** vì vào tháng 3 năm 2016, chương trình AlphaGo của Google DeepMind đã làm nên lịch sử khi đánh bại đại kiện tướng cờ vây thế giới Lee Sedol với tỷ số 4-1.\n- IBM's Watson: Nổi tiếng với chiến thắng trong trò chơi truyền hình Jeopardy! năm 2011.\n- Amazon Alexa và Microsoft Cortana: Là các trợ lý ảo giọng nói thương mại.\nMẹo nhớ: Đánh cờ vây 2016 = AlphaGo của Google DeepMind."},{"id":72,"slide":84,"topic":"Ensemble (RF, Bagging, Boosting)","section":"Câu ngắn","question":"Order these tree ensembles in order of most randomness to least randomness:","options":["Random Forest, Random Trees, Bagging","Bagging, Random Forest, Random Trees","Random Trees, Random Forest, Bagging","Random Forest, Bagging, Random Trees"],"answer":[2],"explanation":"**Đáp án đúng: Random Trees, Random Forest, Bagging** theo thứ tự giảm dần mức độ ngẫu nhiên:\n- Random Trees (Extra-Trees): Ngẫu nhiên nhiều nhất vì chọn ngẫu nhiên cả tập con đặc trưng lẫn ngưỡng cắt (split thresholds).\n- Random Forest: Ngẫu nhiên trung bình vì lấy mẫu bootstrap và chọn tập con đặc trưng ngẫu nhiên, nhưng vẫn tìm điểm cắt tối ưu nhất.\n- Bagging: Ngẫu nhiên ít nhất vì chỉ lấy mẫu ngẫu nhiên dữ liệu (bootstrap), tại mỗi nút vẫn duyệt qua toàn bộ các đặc trưng để tìm điểm cắt tối ưu.\nMẹo nhớ: Random Trees (ngẫu nhiên cả threshold) > Random Forest (ngẫu nhiên feature) > Bagging (chỉ ngẫu nhiên mẫu)."},{"id":73,"slide":85,"topic":"Tổng quan AI / ML","section":"Câu ngắn","question":"In supervised learning, what are the two main components of the training dataset?","options":["Features and Predictions","Labels and Predictions","Features and Labels","Inputs and Outputs"],"answer":[2],"explanation":"**Đáp án đúng: Features and Labels** vì tập huấn luyện trong học có giám sát bắt buộc phải bao gồm hai thành phần cốt lõi: các thuộc tính đầu vào (Features - $X$) và nhãn mục tiêu tương ứng (Labels - $y$).\n- Predictions: Là đầu ra do mô hình dự đoán được sau khi học, không phải thành phần có sẵn trong tập dữ liệu huấn luyện gốc.\n- Inputs and Outputs: Là thuật ngữ tổng quát trong kỹ thuật hệ thống, còn trong Machine Learning thuật ngữ chuyên ngành chuẩn là Features và Labels.\nMẹo nhớ: Supervised = Có Features ($X$) đi kèm với Labels ($y$)."},{"id":74,"slide":86,"topic":"Hồi quy tuyến tính & đa thức","section":"Câu ngắn","question":"This is the syntax you need to predict new data after you have trained a linear regression called LR:","options":["LR=predict(X_test)","LR.predict(X_test)","LR.predict(LR, X_test)","predict(LR, X_test)"],"answer":[1],"explanation":"**Đáp án đúng: `LR.predict(X_test)`** vì theo chuẩn hướng đối tượng của scikit-learn, sau khi fit mô hình `LR`, phương thức dự đoán được gọi dưới dạng `model_object.predict(X_new)`.\n- `LR=predict(X_test)` hoặc `predict(LR, X_test)`: Đây là cú pháp dạng ngôn ngữ R, không phải cú pháp phương thức đối tượng của Python scikit-learn.\n- `LR.predict(LR, X_test)`: Sai vì biến thể hiện `LR` đã là đối tượng gọi (`self`), không truyền lặp lại vào tham số.\nMẹo nhớ: scikit-learn gọi phương thức đối tượng: `model.predict(X_test)`."},{"id":75,"slide":87,"topic":"Train/test & Cross-validation","section":"Câu ngắn","question":"The main purpose of splitting your data into a training and testing sets is:","options":["To improve accuracy","To avoid overfitting","To improve regularization","To improve crossvalidation and overfitting"],"answer":[1],"explanation":"**Đáp án đúng: To avoid overfitting** vì việc chia dữ liệu thành tập huấn luyện (train) và kiểm thử (test) giúp đánh giá khách quan khả năng tổng quát hoá trên dữ liệu chưa từng thấy, phát hiện và ngăn ngừa hiện tượng học vẹt/quá khớp (Overfitting).\n- \"To improve accuracy\": Tách tập dữ liệu không làm tăng độ chính xác của bản thân mô hình mà chỉ giúp đo lường độ chính xác thực tế.\n- \"To improve regularization\": Điều chuẩn là kỹ thuật trong hàm mất mát, không phải mục đích của việc chia dữ liệu.\nMẹo nhớ: Chia Train/Test để kiểm tra năng lực tổng quát hoá và phát hiện/tránh Overfitting."},{"id":76,"slide":88,"topic":"Tổng quan AI / ML","section":"Câu ngắn","question":"The autocorrect on your phone is an example of:","options":["Unsupervised learning","Supervised learning","Semi-supervised learning","Reinforcement learning"],"answer":[1],"explanation":"**Đáp án đúng: Supervised learning** vì tính năng tự động sửa lỗi (autocorrect) được huấn luyện dựa trên các cặp dữ liệu có nhãn gồm từ bị gõ sai và từ sửa đúng tương ứng (hoặc mô hình ngôn ngữ dự đoán từ tiếp theo với nhãn là từ thực tế).\n- Unsupervised learning: Sai vì bài toán có nhãn từ chuẩn xác rõ ràng để học.\n- Reinforcement learning: Học dựa trên phần thưởng phản hồi từ môi trường (như chơi game, robot), không phải cơ chế huấn luyện chuẩn của autocorrect.\nMẹo nhớ: Sửa từ sai thành từ đúng cần dữ liệu đối chiếu nhãn đúng -> Supervised Learning."},{"id":78,"slide":90,"topic":"Thống kê & suy luận","section":"Câu ngắn","question":"The most common way of estimating parameters in a parametric model is:","options":["using the maximum likelihood estimation","using the central limit theorem","extrapolating a non-parametric model","extrapolating Bayesian statistics"],"answer":[0],"explanation":"**Đáp án đúng: using the maximum likelihood estimation** vì ước lượng hợp lý cực đại (MLE - Maximum Likelihood Estimation) là phương pháp thống kê chuẩn mực và phổ biến nhất để tìm bộ tham số tối đa hoá xác suất sinh ra tập dữ liệu quan sát trong các mô hình tham số.\n- \"using the central limit theorem\": Sai vì Định lý giới hạn trung tâm là một định lý phân phối xác suất, không phải thuật toán ước lượng tham số.\n- Các phương án về ngoại suy mô hình: Không phải phương pháp ước lượng tham số cơ bản.\nMẹo nhớ: Ước lượng tham số mô hình tham số = Maximum Likelihood Estimation (MLE)."},{"id":79,"slide":91,"topic":"Ensemble (RF, Bagging, Boosting)","section":"Câu ngắn","question":"This is an ensemble model that does not use bootstrapped samples to fit the base trees, takes residuals into account, and fits the base trees iteratively:","options":["Random Trees","Boosting","Bagging","Random Forest"],"answer":[1],"explanation":"**Đáp án đúng: Boosting** vì mô hình Boosting (như Gradient Boosting) huấn luyện các cây tuần tự (iteratively), cây sau học trực tiếp trên phần dư (residuals) hoặc lỗi sai của cây trước và không dựa trên cơ chế lấy mẫu bootstrap.\n- Bagging và Random Forest: Sử dụng mẫu lấy có hoàn lại (bootstrap samples) để huấn luyện các cây song song, không học trên phần dư tuần tự.\n- Random Trees: Một biến thể của Random Forest/Bagging, không học lặp trên sai số.\nMẹo nhớ: Không bootstrap + học tuần tự trên phần dư (residuals) = Boosting."},{"id":80,"slide":92,"topic":"Tổng quan AI / ML","section":"Câu ngắn","question":"This is the type of Machine Learning that uses both data with labeled outcomes and data without labeled outcomes:","options":["Supervised Machine Learning","Unsupervised Machine Learning","Mixed Machine Learning","Semi-Supervised Machine Learning"],"answer":[3],"explanation":"**Đáp án đúng: Semi-Supervised Machine Learning** vì học bán giám sát (Semi-Supervised Learning) kết hợp cả một lượng nhỏ dữ liệu đã gán nhãn (labeled) với một lượng lớn dữ liệu chưa gán nhãn (unlabeled) trong quá trình huấn luyện.\n- Supervised Machine Learning: Chỉ sử dụng dữ liệu đã có nhãn đầy đủ.\n- Unsupervised Machine Learning: Chỉ sử dụng dữ liệu hoàn toàn không có nhãn.\n- Mixed Machine Learning: Không phải thuật ngữ khoa học chuẩn trong Machine Learning.\nMẹo nhớ: Semi (bán) = Nửa có nhãn + Nửa không nhãn (Semi-Supervised)."},{"id":81,"slide":93,"topic":"Đánh giá mô hình (metrics)","section":"Câu ngắn","question":"Selecting the right error measurement is essential for training and evaluating machine learning models effectively because it allows to","options":["Handle Class Imbalance","Be robust to Outliers","Be more interpretable","Get high accuracy"],"answer":[0],"explanation":"**Đáp án đúng: Handle Class Imbalance** vì việc chọn đúng độ đo sai số (như F1-score, Balanced Accuracy, PR-AUC thay vì Accuracy thuần tuý) giúp đánh giá chính xác hiệu năng khi dữ liệu bị mất cân bằng lớp trầm trọng, tránh tình trạng điểm số cao ảo do lớp đa số áp đảo.\n- \"Get high accuracy\": Sai vì chọn độ đo không nhằm mục đích \"lấy điểm ảo\" mà để phản ánh trung thực bản chất mô hình.\n- Be robust to Outliers / Be more interpretable: Dù một số hàm mất mát (như MAE) kháng ngoại lai tốt, nhưng lý do hàng đầu trong việc lựa chọn độ đo đánh giá phân loại ở môn học là xử lý mất cân bằng lớp.\nMẹo nhớ: Chọn đúng metric để tránh bẫy Accuracy Paradox khi mất cân bằng lớp."},{"id":82,"slide":94,"topic":"EDA & Xử lý dữ liệu","section":"Câu ngắn","question":"You are working with a dataset containing two numerical variables. The data includes noise and some extreme values. You want to examine whether these two variables are related, even if the relationship might be non-linear. Which type of visualization would be the most appropriate?","options":["Histogram","Boxplot","Scatter plot","Bar chart"],"answer":[2],"explanation":"**Đáp án đúng: Scatter plot** – biểu đồ phân tán vẽ từng cặp (x, y) nên cho thấy trực tiếp mối quan hệ (kể cả phi tuyến), nhiễu và outlier.\n- Histogram: chỉ mô tả phân phối của một biến.\n- Boxplot: tóm tắt phân phối/outlier của một biến (hoặc theo nhóm), không thể hiện quan hệ giữa hai biến số.\n- Bar chart: dùng cho biến phân loại/giá trị tổng hợp.\nMẹo nhớ: hai biến số liên tục, xét quan hệ → scatter plot."},{"id":83,"slide":95,"topic":"Tổng quan AI / ML","section":"Câu ngắn","question":"In the 1980s, what term was commonly used to describe AI systems that could simulate human decision-making based on predefined rules and knowledge?","options":["Neural Networks","Expert Systems","Genetic Algorithms","Reinforcement Learning"],"answer":[1],"explanation":"Expert Systems (Hệ chuyên gia) là công nghệ AI nổi bật trong thập niên 1980, sử dụng cơ sở tri thức (knowledge base) và bộ suy diễn (inference engine) để mô phỏng quá trình ra quyết định của chuyên gia."},{"id":84,"slide":96,"topic":"Đánh giá mô hình (metrics)","section":"Câu ngắn","question":"What is the purpose of a confusion matrix in classification?","options":["Evaluate model performance","Visualize feature importance","Select optimal hyperparameters","Reduce dimensionality"],"answer":[0],"explanation":"Confusion Matrix giúp đánh giá kết quả phân loại thông qua các giá trị True Positive (TP), True Negative (TN), False Positive (FP) và False Negative (FN), từ đó tính các chỉ số như Accuracy, Precision, Recall và F1-score."},{"id":85,"slide":98,"topic":"Hồi quy tuyến tính & đa thức","section":"Câu trung bình","question":"What is polynomial feature expansion?","options":["Creating new features by combining existing features","Transforming categorical variables into numeric representations","Generating higher-degree terms for numeric features","Providing degree terms for numeric features"],"answer":[2],"explanation":"**Đáp án đúng: Generating higher-degree terms for numeric features** – ví dụ từ $x$ tạo thêm $x^2, x^3$ (và các tích chéo) để mô hình tuyến tính nắm bắt quan hệ phi tuyến.\n- Creating new features by combining existing features: mô tả chung của feature engineering, không đặc trưng cho bậc cao của polynomial.\n- Transforming categorical variables into numeric: đó là encoding (one-hot, label).\n- Providing degree terms: diễn đạt mơ hồ, không phải định nghĩa chính xác."},{"id":87,"slide":100,"topic":"EDA & Xử lý dữ liệu","section":"Câu trung bình","question":"What is log transformation commonly used for?","options":["Handling missing values in numeric features","Reducing the impact of outliers in skewed distributions","Converting categorical features into numeric features","Converting numerical features into categorical features"],"answer":[1],"explanation":"**Đáp án đúng: Reducing the impact of outliers in skewed distributions** – log nén các giá trị lớn, làm phân phối lệch phải gần đối xứng hơn và giảm ảnh hưởng của giá trị cực đoan.\n- Handling missing values: dùng imputation, log không xử lý giá trị thiếu.\n- Converting categorical to numeric: là encoding.\n- Converting numerical to categorical: là binning/discretization."},{"id":88,"slide":101,"topic":"Clustering & khoảng cách","section":"Câu trung bình","question":"What is the major purpose of distance metrics in clustering?","options":["To measure the physical distance between data points","To quantify the similarity or dissimilarity between data points","To determine the direction of data points","To classify data points into predefined clusters"],"answer":[1],"explanation":"**Đáp án đúng: To quantify the similarity or dissimilarity between data points** – clustering gom các điểm gần nhau, nên cần độ đo (Euclidean, Manhattan, cosine...) để định lượng mức giống/khác.\n- Physical distance: khoảng cách ở đây là khoảng cách trong không gian đặc trưng, không phải khoảng cách vật lý.\n- Direction of data points: không phải mục đích của metric.\n- Classify into predefined clusters: clustering là unsupervised, không có cụm định sẵn."},{"id":89,"slide":102,"topic":"Ensemble (RF, Bagging, Boosting)","section":"Câu trung bình","question":"What is the main condition to use stacking as ensemble method?","options":["Models need to be parametric","Models need to be nonparametric","Models need to output residual values for each class","Models need to output predicted probabilities"],"answer":[3],"explanation":"**Đáp án đúng: Models need to output predicted probabilities** – stacking dùng đầu ra (xác suất dự đoán) của các base model làm đầu vào cho meta-model, nên các model phải cho ra xác suất.\n- Parametric / nonparametric: stacking không yêu cầu loại mô hình cụ thể, có thể trộn cả hai.\n- Residual values for each class: residual là khái niệm của boosting/hồi quy, không phải điều kiện của stacking."},{"id":90,"slide":103,"topic":"SVM","section":"Câu trung bình","question":"What is a hyperplane in the context of SVM?","options":["A plane that separates the data into two classes","A line that connects support vectors","A subspace of lower dimensionality","The axis of the highest variance in the data"],"answer":[0],"explanation":"**Đáp án đúng: A plane that separates the data into two classes** – hyperplane là biên quyết định $w^Tx + b = 0$ chia hai lớp; SVM chọn hyperplane có margin lớn nhất.\n- A line that connects support vectors: sai, support vectors nằm trên/gần margin, không phải đường nối chúng.\n- A subspace of lower dimensionality: hyperplane đúng là có chiều thấp hơn 1, nhưng lựa chọn này không nêu vai trò phân tách nên không phải ý chính.\n- Axis of highest variance: đó là principal component của PCA."},{"id":91,"slide":104,"topic":"Regularization & Overfitting","section":"Câu trung bình","question":"What is the role of the regularization parameter in the regularization process?","options":["It controls the overall strength of regularization","It sets the learning rate for the optimization algorithm","It defines the number of iterations in model training","It has no impact on regularization"],"answer":[0],"explanation":"**Đáp án đúng: It controls the overall strength of regularization** – tham số (lambda/alpha) nhân với số hạng phạt: càng lớn, hệ số càng bị co mạnh, mô hình đơn giản hơn.\n- Learning rate: là siêu tham số khác của thuật toán tối ưu.\n- Number of iterations: không liên quan đến regularization.\n- No impact: sai, nó là núm điều chỉnh bias-variance."},{"id":92,"slide":105,"topic":"Thống kê & suy luận","section":"Câu trung bình","question":"What is the purpose of point estimation in statistics?","options":["To estimate a range of values for a parameter","To summarize the central tendency of a dataset","To provide a single value as the best guess for a parameter","To assess the variability of a dataset"],"answer":[2],"explanation":"**Đáp án đúng: To provide a single value as the best guess for a parameter** – point estimation cho một giá trị duy nhất (ví dụ $\\bar{x}$ ước lượng $\\mu$).\n- Estimate a range of values: đó là interval estimation (khoảng tin cậy).\n- Summarize central tendency: là thống kê mô tả, không phải mục đích ước lượng tham số.\n- Assess variability: thuộc về độ phân tán/độ không chắc chắn."},{"id":93,"slide":106,"topic":"Dữ liệu mất cân bằng","section":"Câu trung bình","question":"What is the main objective of using ensemble methods such as bagging and boosting, in the case of imbalanced classes?","options":["To decrease the model's accuracy","To increase the model's complexity","To improve the model's generalization and handling of imbalanced data","To reduce the impact of the majority class"],"answer":[2],"explanation":"**Đáp án đúng: To improve the model's generalization and handling of imbalanced data** – bagging giảm variance, boosting tập trung vào mẫu khó (thường là lớp thiểu số) nên cải thiện tổng quát hoá và xử lý mất cân bằng.\n- Decrease accuracy / increase complexity: không phải mục tiêu.\n- Reduce the impact of the majority class: gần đúng với một số kỹ thuật (undersampling) nhưng không phải mục tiêu tổng quát của ensemble."},{"id":95,"slide":108,"topic":"Giảm chiều (PCA, MDS…)","section":"Câu trung bình","question":"What is one of the real-world solutions to fix the problems of the curse dimensionality?","options":["Increase the size of the data set","Use more computational power","Reduce the dimension of the data set.","Balance the classes of a data set"],"answer":[2],"explanation":"**Đáp án đúng: Reduce the dimension of the data set.** – dùng PCA, feature selection... để giảm số chiều, tránh dữ liệu thưa và khoảng cách mất ý nghĩa ở chiều cao.\n- Increase the size of the data set: cần lượng dữ liệu tăng theo hàm mũ theo số chiều nên khó khả thi trong thực tế.\n- More computational power: không giải quyết bản chất vấn đề.\n- Balance the classes: xử lý mất cân bằng lớp, không liên quan đến số chiều."},{"id":97,"slide":110,"topic":"Tổng quan AI / ML","section":"Câu trung bình","question":"What is artificial intelligence?","options":["A subset of deep learning.","Any program that can sense, reason, act, and adapt.","A subset of machine learning","None of the others"],"answer":[1],"explanation":"**Đáp án đúng: Any program that can sense, reason, act, and adapt.** – AI là khái niệm rộng nhất, bao gồm các chương trình có khả năng cảm nhận, suy luận, hành động và thích nghi.\n- A subset of deep learning: ngược quan hệ, deep learning là tập con của AI.\n- A subset of machine learning: cũng ngược, ML là tập con của AI.\nMẹo nhớ: AI ⊃ ML ⊃ Deep Learning."},{"id":98,"slide":111,"topic":"Tổng quan AI / ML","section":"Câu trung bình","question":"What is the main goal of unsupervised learning?","options":["Predicting a target variable","Classifying data into predefined categories","Discovering patterns and structures in data","Evaluating model accuracy"],"answer":[2],"explanation":"**Đáp án đúng: Discovering patterns and structures in data** – unsupervised learning làm việc với dữ liệu không nhãn (clustering, giảm chiều).\n- Predicting a target variable: supervised learning.\n- Classifying into predefined categories: classification, cần nhãn.\n- Evaluating model accuracy: bước đánh giá, không phải mục tiêu học."},{"id":99,"slide":112,"topic":"Ensemble (RF, Bagging, Boosting)","section":"Câu trung bình","question":"What is the purpose of using bootstrapping in the Bagging algorithm?","options":["To reduce overfitting","To create diverse subsets of the dataset","To increase the number of features","To speed up the training process"],"answer":[1],"explanation":"**Đáp án đúng: To create diverse subsets of the dataset** – bootstrapping lấy mẫu có hoàn lại để tạo nhiều tập con khác nhau, mỗi tập huấn luyện một model.\n- To reduce overfitting: là kết quả của việc trung bình nhiều model đa dạng, không phải mục đích trực tiếp của bootstrapping.\n- Increase the number of features: bootstrap lấy mẫu dòng, không thêm đặc trưng.\n- Speed up training: không phải mục đích.\nLưu ý: lựa chọn 'To reduce overfitting' cũng có thể chấp nhận, nhưng theo bộ đề đáp án là tạo các tập con đa dạng."},{"id":100,"slide":113,"topic":"Clustering & khoảng cách","section":"Câu trung bình","question":"What are the Weaknesses of the Mean shift method?","options":["Result depends on window size (bandwidth)","Selection of window size is not easy","Does not assume number or shape of clusters","Robust to outliers"],"answer":[0,1],"explanation":"**Đáp án đúng: Result depends on window size (bandwidth)** và **Selection of window size is not easy** – Mean shift chỉ có một tham số bandwidth nhưng kết quả nhạy với nó và khó chọn giá trị phù hợp.\n- Does not assume number or shape of clusters: là điểm mạnh (model-free).\n- Robust to outliers: cũng là điểm mạnh."},{"id":101,"slide":114,"topic":"Train/test & Cross-validation","section":"Câu trung bình","question":"What does the test set represent in machine learning?","options":["The part of the data used for model training","A set of examples the model has already seen during training","New, unseen data the model has not encountered during training","A set of data reserved for validation purposes"],"answer":[2],"explanation":"**Đáp án đúng: New, unseen data the model has not encountered during training** – test set mô phỏng dữ liệu mới để ước lượng khả năng tổng quát hoá.\n- Part used for training: là training set.\n- Examples already seen: sẽ gây data leakage và đánh giá quá lạc quan.\n- Reserved for validation: validation set dùng để tinh chỉnh siêu tham số, tách biệt với test set."},{"id":102,"slide":115,"topic":"Clustering & khoảng cách","section":"Câu trung bình","question":"What are the strengths of the Mean shift algorithm?","options":["Model-free: does not assume number or shape of clusters","Can use just one parameter: window size (bandwidth)","Robust to outliers","All of these"],"answer":[3],"explanation":"**Đáp án đúng: All of these** – cả ba ý đều là điểm mạnh của Mean shift.\n- Model-free: không giả định số cụm hay hình dạng cụm.\n- Một tham số duy nhất: bandwidth.\n- Robust to outliers: outlier ít ảnh hưởng đến các mode mật độ."},{"id":103,"slide":116,"topic":"Clustering & khoảng cách","section":"Câu trung bình","question":"What are \"core points\" in the DBSCAN algorithm?","options":["Core points are outliers that do not belong to any cluster","Core points are data points that has at least a minimum number of other points (minPts) within a specified distance (epsilon) from it","Core points are data points that are isolated from the rest of the dataset","Core points are centroids of the clusters identified by DBSCAN"],"answer":[1],"explanation":"**Đáp án đúng: Core points có ít nhất minPts điểm lân cận trong bán kính epsilon** – đây là điểm có vùng lân cận đủ dày đặc, làm hạt nhân để mở rộng cụm.\n- Outliers not in any cluster: đó là noise points.\n- Isolated points: cũng là noise.\n- Centroids of clusters: là khái niệm của K-means; DBSCAN không có centroid."},{"id":105,"slide":118,"topic":"Hồi quy tuyến tính & đa thức","section":"Câu trung bình","question":"What are polynomial features?","options":["They are higher order relationships in the data.","They are logistic regression coefficients.","They are lower order relationships in the data.","They are represented by linear relationships in the data."],"answer":[0],"explanation":"**Đáp án đúng: They are higher order relationships in the data.** – polynomial features ($x^2, x^3, x_1x_2$...) biểu diễn quan hệ bậc cao giữa các biến.\n- Logistic regression coefficients: là tham số mô hình, không phải đặc trưng.\n- Lower order relationships: ngược với bản chất bậc cao.\n- Linear relationships: quan hệ tuyến tính là bậc 1, không phải đặc trưng bậc cao."},{"id":106,"slide":119,"topic":"EDA & Xử lý dữ liệu","section":"Câu trung bình","question":"What are the two main data problems companies face when getting started with artificial intelligence/machine learning?","options":["Data sampling and categorization","Outliers and duplicated data","Lack of relevant data and bad data","Lack of training and expertise"],"answer":[2],"explanation":"**Đáp án đúng: Lack of relevant data and bad data** – hai vấn đề dữ liệu phổ biến: thiếu dữ liệu phù hợp và dữ liệu chất lượng kém.\n- Data sampling and categorization: không phải vấn đề chính.\n- Outliers and duplicated data: chỉ là các dạng của bad data.\n- Lack of training and expertise: là vấn đề về con người, không phải về dữ liệu."},{"id":107,"slide":120,"topic":"Regularization & Overfitting","section":"Câu trung bình","question":"What does the hyperparameter \"alpha\" control in Elastic Net regularization?","options":["Overall strength of regularization","Balance between L1 and L2 penalties","Learning rate of the optimization algorithm","Number of iterations in model training"],"answer":[0],"explanation":"**Đáp án đúng: Overall strength of regularization** – trong Elastic Net (theo cách gọi của scikit-learn), `alpha` là cường độ phạt tổng thể.\n- Balance between L1 and L2: do `l1_ratio` điều khiển.\n- Learning rate / number of iterations: không phải vai trò của alpha.\nLưu ý: tên gọi khác nhau theo thư viện (glmnet dùng alpha cho tỉ lệ L1/L2), nhưng theo bộ đề và scikit-learn đáp án là đúng."},{"id":108,"slide":121,"topic":"Đánh giá mô hình (metrics)","section":"Câu trung bình","question":"What does the term \"precision\" measure in the context of classification metrics?","options":["The ability to correctly identify positive instances","The ability to correctly identify negative instances","The proportion of actual positive instances correctly identified","The trade-off between precision and recall"],"answer":[0],"explanation":"**Đáp án đúng: The ability to correctly identify positive instances** – theo bộ đề; precision $=\\dfrac{TP}{TP+FP}$ cho biết trong các mẫu dự đoán positive thì bao nhiêu đúng.\n- Correctly identify negative instances: gần với specificity.\n- Proportion of actual positives correctly identified: là recall.\n- Trade-off between precision and recall: là F1/đường PR.\nLưu ý: cách diễn đạt đáp án khá mơ hồ; chặt chẽ thì precision là độ chính xác của các dự đoán positive."},{"id":109,"slide":122,"topic":"EDA & Xử lý dữ liệu","section":"Câu trung bình","question":"Which of the following is an example of feature engineering?","options":["Importing libraries in Python","Standardizing numeric features","Creating a new feature based on existing ones","All of these"],"answer":[2],"explanation":"**Đáp án đúng: Creating a new feature based
