quá nhạy cảm với biến động nhỏ trong dữ liệu (Overfitting).</li></ul><h4>Các phương pháp Regularization</h4><table><tr><th><div>Phương pháp</div></th><th><div>Hình thức phạt (Penalty)</div></th><th><div>Đặc điểm chính</div></th></tr><tr><td><div><b>Ridge (L2)</b></div></td><td><div>Tổng bình phương hệ số</div></td><td><div>Giảm kích thước hệ số nhưng không triệt tiêu về 0. Giảm Overfitting hiệu quả.</div></td></tr><tr><td><div><b>LASSO (L1)</b></div></td><td><div>Tổng trị tuyệt đối hệ số</div></td><td><div>Có khả năng triệt tiêu hệ số về 0. Hỗ trợ <b>lựa chọn đặc trưng (Feature Selection)</b>.</div></td></tr><tr><td><div><b>Elastic Net</b></div></td><td><div>Kết hợp L1 + L2</div></td><td><div>Dùng khi có nhiều biến tương quan với nhau.</div></td></tr></table><table><tr><th><div><code>from</code><code> sklearn.linear_model </code><code>import</code><code> Ridge, Lasso, ElasticNet<br><br></code><code># Ridge Regression</code><code><br>ridge = Ridge(alpha=</code><code>1.0</code><code>) </code><code># alpha chính là lambda trong slide</code><code><br>ridge.fit(X_train, y_train)<br><br></code><code># Lasso Regression (Có thể dùng để loại bỏ biến không cần thiết)</code><code><br>lasso = Lasso(alpha=</code><code>0.1</code><code>)<br>lasso.fit(X_train, y_train)</code></div></th></tr></table><h4>Note</h4><ol><li>Luôn thực hiện Scaling (ví dụ StandardScaler) trước khi dùng Regularization để các hệ số có cùng đơn vị đo.</li><li>Sử dụng Cross Validation để chọn tham số điều chuẩn (<span class=\"mj\" data-tex=\"\\alpha\">\\alpha</span>) tối ưu.</li></ol><p><b><b>Basic Models/Algorithms</b></b></p>"}]},{"id":"m2","short":"C2","title":"Hồi quy Logistic, Đánh giá lỗi và Thuật toán KNN","color":"#7048e8","weight":21,"priority":3,"keyPoints":[],"sections":[{"id":"2.1","t":"Hồi quy Logistic và Phân loại cơ bản","h":"<h4>1.1. Phân biệt Hồi quy và Phân loại</h4><ul><li>Hồi quy (Regression): Dự đoán kết quả là một giá trị số liên tục. Ví dụ: Giá nhà, doanh thu phòng vé, tải lượng mạng.</li><li>Phân loại (Classification): Dự đoán kết quả là một danh mục hoặc nhãn rời rạc. Ví dụ: Phát hiện giao dịch gian lận, khách hàng rời bỏ, email rác.</li></ul><h4>1.2. Hồi quy Logistic (Logistic Regression)</h4><p>Hồi quy Logistic là một loại hồi quy mô hình hóa xác suất xảy ra của một lớp cụ thể dựa trên các biến độc lập. Nó sử dụng hàm <b>Sigmoid</b> để đưa kết quả về khoảng từ 0 đến 1.</p><ul><li>Công thức hàm Sigmoid: <span class=\"mj\" data-tex=\"\\sigma(z) = \\dfrac{1}{1 + e^{-z}}\">\\sigma(z) = \\dfrac{1}{1 + e^{-z}}</span>.</li><li>Ưu điểm: Có tính diễn giải cao, giúp hiểu rõ tầm quan trọng của từng yếu tố ảnh hưởng.</li></ul><table><tr><th><div><code># Logistic Regression</code><code><br></code><code>from</code><code> sklearn.linear_model </code><code>import</code><code> LogisticRegression<br><br></code><code># Khởi tạo mô hình với tham số điều chuẩn L2</code><code><br>lr = LogisticRegression(penalty=</code><code>'l2'</code><code>, C=</code><code>10.0</code><code>)<br><br></code><code># Huấn luyện mô hình trên tập Train</code><code><br>lr.fit(X_train, y_train)<br><br></code><code># Dự đoán nhãn cho tập Test</code><code><br>y_pred = lr.predict(X_test)<br></code></div></th></tr></table>"},{"id":"2.2","t":"Các chỉ số đánh giá lỗi (Error Metrics)","h":"<p>Việc chọn chỉ số đo lường phù hợp là rất quan trọng, đặc biệt khi dữ liệu bị mất cân bằng (ví dụ: chỉ 1% bệnh nhân mắc bệnh).</p><h4>2.1. Ma trận nhầm lẫn (Confusion Matrix)</h4><p>Tabulating các giá trị dự đoán so với thực tế:</p><table><tr><th><div></div></th><th><div>Dự đoán Dương tính (Predicted Positive)</div></th><th><div>Dự đoán Âm tính (Predicted Negative)</div><div> </div></th></tr><tr><td><div><b>Thực tế Dương tính (Actual Positive)</b></div></td><td><div>True Positive (TP)</div></td><td><div>False Negative (FN) - Sai lầm loại II</div></td></tr><tr><td><div><b>Thực tế Âm tính (Actual Negative)</b></div></td><td><div>False Positive (FP) - Sai lầm loại I</div></td><td><div>True Negative (TN)</div></td></tr></table><h4>2.2. Các chỉ số đo lường chính</h4><ul><li>Accuracy (Độ chính xác): Tỷ lệ dự đoán đúng (TP+TN) trên tổng số quan sát.</li><li>Recall/Sensitivity (Độ nhạy): Tỷ lệ dương tính được nhận diện đúng: <span class=\"mj\" data-tex=\"\\text{Recall} = \\dfrac{TP}{TP + FN}\">\\text{Recall} = \\dfrac{TP}{TP + FN}</span> .</li><li>Precision (Độ chính xác dự đoán): Tỷ lệ thực sự dương tính trong các mẫu dự đoán là dương tính: <span class=\"mj\" data-tex=\"\\text{Precision} = \\dfrac{TP}{TP + FP}\">\\text{Precision} = \\dfrac{TP}{TP + FP}</span>.</li><li>Specificity (Độ đặc hiệu): Khả năng tránh báo động giả: <span class=\"mj\" data-tex=\"\\text{Specificity} = \\dfrac{TN}{TN + FP}\">\\text{Specificity} = \\dfrac{TN}{TN + FP}</span>.</li><li>ROC Curve &amp; AUC: Vẽ biểu đồ True Positive Rate vs False Positive Rate. AUC là diện tích dưới đường cong, dùng để chọn mô hình tốt nhất.</li></ul><table><tr><th><div><code>#đánh giá mô hình</code><code><br></code><code>from</code><code> sklearn.metrics </code><code>import</code><code> accuracy_score, confusion_matrix, classification_report<br><br></code><code># Tính Accuracy</code><code><br>acc = accuracy_score(y_test, y_pred)<br><br></code><code># Hiển thị Ma trận nhầm lẫn</code><code><br>print(confusion_matrix(y_test, y_pred))<br><br></code><code># Báo cáo chi tiết Precision, Recall, F1</code><code><br>print(classification_report(y_test, y_pred))</code></div></th></tr></table>"},{"id":"2.3","t":"Thuật toán K-Láng giềng gần nhất (KNN)","h":"<h4>3.1. Đặc điểm</h4><ul><li>Non-parametric: Không đưa ra giả định về phân phối dữ liệu.</li><li>Lazy learner: Không học ngay lập tức mà chỉ lưu trữ dữ liệu, tính toán khi có yêu cầu dự đoán.</li></ul><h4>3.2. Quy trình</h4><ol><li>Chọn giá trị K (số láng giềng gần nhất).</li><li>Tính khoảng cách (thường dùng Euclidean).</li><li>Sắp xếp khoảng cách và chọn ra K điểm gần nhất.</li><li>Gán nhãn theo đa số lớp trong K điểm đó.</li></ol><p><b>Cần thực hiện Feature Scaling vì KNN rất nhạy cảm với thang đo của dữ liệu.</b></p><h4>3.3. Lựa chọn K (Elbow Method)</h4><p>Giá trị K tốt nhất thường nằm ở \"điểm khuỷu tay\" (Elbow point) trên biểu đồ tỷ lệ lỗi, nơi mà việc tăng K không còn mang lại sự cải thiện đáng kể.</p><table><tr><th><div><code># KNN</code><code><br></code><code>from</code><code> sklearn.neighbors </code><code>import</code><code> KNeighborsClassifier<br></code><code>from</code><code> sklearn.preprocessing </code><code>import</code><code> StandardScaler<br><br></code><code># Chuẩn hóa dữ liệu (quan trọng đối với KNN)</code><code><br>scaler = StandardScaler()<br>X_train_scaled = scaler.fit_transform(X_train)<br><br></code><code># Khởi tạo mô hình với K=3</code><code><br>knn = KNeighborsClassifier(n_neighbors=</code><code>3</code><code>)<br>knn.fit(X_train_scaled, y_train)<br><br></code><code># Dự đoán</code><code><br>y_pred = knn.predict(scaler.transform(X_test))</code></div></th></tr></table><table><tr><th><div>Đặc điểm</div></th><th><div>Linear Regression</div></th><th><div>K Nearest Neighbors</div></th></tr><tr><td><div><b>Quá trình Fit</b></div></td><td><div>Tối thiểu hóa hàm chi phí (Chậm) </div></td><td><div>Lưu trữ dữ liệu huấn luyện (Nhanh) </div></td></tr><tr><td><div><b>Bộ nhớ</b></div></td><td><div>Ít tham số, hiệu quả bộ nhớ </div></td><td><div>Nhiều tham số, tốn bộ nhớ </div></td></tr><tr><td><div><b>Dự đoán</b></div></td><td><div>Tính toán nhanh</div></td><td><div>Tìm láng giềng gần nhất (Chậm)</div></td></tr></table><p><b><b>SVM</b></b></p>"},{"id":"2.4","t":"Giới thiệu về Support Vector Machines (SVM)","h":"<p>Nên tìm hiểu thêm về PCA và cách SVM kết hợp với PCA</p><h4>Khái niệm cơ bản</h4><ul><li>Định nghĩa: SVM là mô hình học máy có giám sát được sử dụng cho cả bài toán phân loại và hồi quy.</li><li>Mục tiêu chính: Tìm một siêu phẳng (hyperplane) để phân tách các lớp bằng cách xác định ranh giới quyết định sao cho khoảng cách (margin) giữa các lớp là lớn nhất.</li><li>Vectơ hỗ trợ (Support Vectors): Là các điểm dữ liệu nằm gần bề mặt quyết định nhất. Chúng có tác động trực tiếp đến vị trí tối ưu của siêu phẳng.</li></ul><h4>So sánh với Hồi quy Logistic</h4><ul><li>Hồi quy Logistic: Hàm mất mát giảm dần về 0 nhưng hiếm khi đạt đến 0 hoàn toàn.</li><li>SVM: Sử dụng hàm Hinge Loss để phạt các lỗi phân loại sai. Điều này dẫn đến độ chính xác tốt hơn nhưng ít nhạy cảm hơn đối với các xác suất dự đoán.</li></ul><table><tr><th><div><code>#Linear SVM </code><code><br></code><code>from</code><code> sklearn.svm </code><code>import</code><code> LinearSVC<br><br></code><code># Khởi tạo mô hình</code><code><br></code><code># C là tham số điều chuẩn</code><code><br>clf = LinearSVC(C=</code><code>1.0</code><code>, loss=</code><code>'hinge'</code><code>, max_iter=</code><code>10000</code><code>)<br><br></code><code># Huấn luyện mô hình</code><code><br>clf.fit(X_train, y_train)<br><br></code><code># Dự đoán</code><code><br>y_pred = clf.predict(X_test)</code></div></th></tr></table>"},{"id":"2.5","t":"Độ nhạy với Outliers và Regularization","h":"<h4>Độ nhạy với dữ liệu ngoại lai (Outliers)</h4><p>SVM có thể bị ảnh hưởng bởi các điểm ngoại lai, làm thay đổi đáng kể ranh giới quyết định nếu không được xử lý đúng cách.</p><h4>Tham số điều chuẩn (Regularization)</h4><ul><li>Tham số C trong SVM giúp kiểm soát sự cân bằng giữa việc tối đa hóa khoảng cách (margin) và tối thiểu hóa lỗi phân loại.</li><li>C nhỏ: Cho phép nhiều lỗi phân loại hơn để có khoảng cách lớn hơn (giảm overfitting).</li><li>C lớn: Cố gắng phân loại đúng tất cả các điểm dữ liệu, dẫn đến khoảng cách nhỏ hơn (có thể gây overfitting).</li></ul>"},{"id":"2.6","t":"SVM với Kernels (Nhân)","h":"<h4>Tại sao cần Kernel?</h4><ul><li>Dữ liệu thực tế thường không thể phân tách tuyến tính trong không gian 2 chiều.</li><li>Kernel Trick: Cho phép SVM thực hiện phân loại phi tuyến tính bằng cách ánh xạ dữ liệu vào không gian đặc trưng có số chiều cao hơn mà không cần tính toán trực tiếp tọa độ trong không gian đó</li></ul><h4>Các loại Kernel phổ biến</h4><ul><li>Linear Kernel: Dùng cho dữ liệu có thể phân tách tuyến tính.</li><li>Gaussian (RBF) Kernel: Biến đổi không gian tọa độ sao cho các dữ liệu phi tuyến có thể được phân tách bởi một siêu phẳng.</li></ul><table><tr><th><div><code>#SVM với Kernel RBF</code><code><br></code><code>from</code><code> sklearn.svm </code><code>import</code><code> SVC<br><br></code><code># Khởi tạo mô hình với kernel='rbf'</code><code><br></code><code># gamma kiểm soát tầm ảnh hưởng của một điểm huấn luyện duy nhất</code><code><br>clf_rbf = SVC(kernel=</code><code>'rbf'</code><code>, C=</code><code>1.0</code><code>, gamma=</code><code>'scale'</code><code>)<br><br></code><code># Huấn luyện</code><code><br>clf_rbf.fit(X_train, y_train)<br></code></div></th></tr></table>"},{"id":"2.7","t":"Tối ưu hóa hiệu suất (Faster Kernel Transformations)","h":"<p>Các phương pháp Kernel truyền thống thường chậm đối với các tập dữ liệu lớn hơn vài nghìn mẫu nếu không xử lý song song. Để khắc phục, ta có thể sử dụng các kỹ thuật xấp xỉ:</p><ul><li>Nystroem: Xấp xỉ ánh xạ đặc trưng kernel.</li><li>RBFSampler (Random Fourier Features): Xấp xỉ ánh xạ đặc trưng cho kernel RBF, giúp huấn luyện nhanh hơn trên tập dữ liệu lớn.</li></ul><table><tr><th><div><code># RBFSampler để tăng tốc</code><code><br></code><code>from</code><code> sklearn.kernel_approximation </code><code>import</code><code> RBFSampler<br></code><code>from</code><code> sklearn.linear_model </code><code>import</code><code> SGDClassifier<br><br></code><code># Tạo bộ tạo đặc trưng xấp xỉ RBF</code><code><br>rbf_feature = RBFSampler(gamma=</code><code>1</code><code>, n_components=</code><code>100</code><code>)<br>X_features = rbf_feature.fit_transform(X_train)<br><br></code><code># Sử dụng mô hình tuyến tính nhanh trên các đặc trưng mới</code><code><br>clf_fast = SGDClassifier(max_iter=</code><code>1000</code><code>)<br>clf_fast.fit(X_features, y_train)<br></code></div></th></tr></table>"},{"id":"2.8","t":"Workflow cơ bản khi làm với SVM","h":"<ol><li>Thu thập và chuẩn bị dữ liệu (Gán nhãn, chuẩn hóa đặc trưng).</li><li>Chọn loại Kernel phù hợp (Linear hoặc phi tuyến).</li><li>Điều chỉnh các siêu tham số (C, gamma) thông qua kiểm chéo (Cross-validation).</li><li>Đánh giá mô hình và sử dụng để dự đoán.</li></ol><p><b><b>Decision Tree</b></b></p>"}]},{"id":"m3","short":"C3","title":"Cây Quyết định (Decision Trees)","color":"#d6336c","weight":10,"priority":3,"keyPoints":[],"sections":[{"id":"3.1","t":"Tổng quan về Cây Quyết định","h":"<ul><li>Cây Quyết định là một thuật toán tham lam (greedy algorithm) dùng để phân tách dữ liệu dựa trên các thước đo độ vẩn đục (impurity measures).</li><li>Thuật toán này không dựa trên các giả định thống kê khắt khe như một số mô hình tuyến tính.</li><li>Phân loại:</li></ul><ul><li>Decision Trees: Dự đoán các kết quả phân loại (categorical) .</li><li>Regression Trees: Dự đoán các giá trị liên tục (continuous)</li></ul><h4>So sánh với các bộ phân loại khác</h4><table><tr><th><div><b>Đặc điểm</b></div></th><th><div><b>K-Nearest Neighbors (KNN)</b></div></th><th><div><b>Logistic Regression</b></div></th><th><div><b>Decision Trees</b></div></th></tr><tr><td><div>Huấn luyện (Fitting)</div></td><td><div>Rất nhanh (chỉ lưu trữ dữ liệu)</div></td><td><div>Chậm (phải tìm tham số tối ưu) </div></td><td><div>Trung bình (xây dựng cấu trúc cây).</div></td></tr><tr><td><div>Dự đoán (Prediction)</div></td><td><div>Chậm (phải đo khoảng cách với nhiều điểm)</div></td><td><div>Nhanh (tính giá trị kỳ vọng)</div></td><td><div>Rất nhanh (duyệt theo các nhánh cây).</div></td></tr><tr><td><div>Ranh giới quyết định</div></td><td><div>Linh hoạt (Flexible)</div></td><td><div>Đơn giản, ít linh hoạt</div></td><td><div>Trực quan, phân cấp.</div></td></tr></table><h4>2. Cơ chế phân tách (Splitting)</h4><p>Cây Quyết định phân tách dữ liệu bằng cách chọn đặc trưng giúp giảm độ vẩn đục nhiều nhất.</p><h4>Các thước đo độ vẩn đục phổ biến:</h4><ul><li>Entropy: Đo lường mức độ hỗn loạn của thông tin</li><li>Information Gain: Độ lệch giữa entropy trước và sau khi phân tách.</li><li>Gini Index: Thước đo mức độ phân loại sai nếu chọn ngẫu nhiên một phần tử</li></ul>"},{"id":"3.2","t":"Vấn đề Quá khớp và Cắt tỉa (Overfitting & Pruning)","h":"<ul><li>Vấn đề: Cây Quyết định có xu hướng quá khớp (overfit) với dữ liệu huấn luyện. Những thay đổi nhỏ trong dữ liệu có thể làm thay đổi hoàn toàn cấu trúc cây, dẫn đến phương sai cao (high variance)</li><li>Giải pháp - Cắt tỉa (Pruning): Loại bỏ các nhánh không mang lại nhiều giá trị dự đoán để cải thiện khả năng tổng quát hóa. Việc cắt tỉa thường dựa trên ngưỡng lỗi phân loại (classification error threshold)</li></ul>"},{"id":"3.3","t":"Ưu điểm và Khả năng giải thích","h":"<ul><li>Dễ giải thích: Sử dụng logic \"nếu... thì... nếu không\" (if... then... else), rất trực quan cho con người </li><li>Linh hoạt: Xử lý được mọi loại dữ liệu từ nhị phân, thứ tự đến liên tục</li><li>Tiết kiệm thời gian: Không yêu cầu tiền xử lý dữ liệu phức tạp hay chuẩn hóa đặc trưng (scaling)</li></ul>"},{"id":"3.4","t":"Mã nguồn minh họa (Python)","h":"<p>Sử dụng thư viện scikit-learn để triển khai mô hình phân loại bằng cây quyết định:</p><table><tr><th><div><code>from</code><code> sklearn.tree </code><code>import</code><code> DecisionTreeClassifier<br><br></code><code># 1. Khởi tạo mô hình</code><code><br></code><code># criterion='entropy': sử dụng thước đo entropy để phân tách</code><code><br></code><code># max_depth=5: giới hạn độ sâu để tránh overfitting</code><code><br>clf = DecisionTreeClassifier(criterion=</code><code>'entropy'</code><code>, max_depth=</code><code>5</code><code>) [cite: </code><code>14</code><code>]<br><br></code><code># 2. Huấn luyện mô hình với dữ liệu đã chia (X_train, y_train)</code><code><br>clf.fit(X_train, y_train)<br><br></code><code># 3. Dự đoán trên tập dữ liệu mới (X_test)</code><code><br>y_pred = clf.predict(X_test)</code></div></th></tr></table><p><br><i>Kiểm soát việc overfitting, bằng cách tinh chỉnh các tham số như max_depth, min_samples_leaf hoặc sử dụng kiểm chéo (cross-validation)</i></p><p><b><b>Ensemble Learning</b></b></p>"}]},{"id":"m4","short":"C4","title":"Ensemble Learning","color":"#e8590c","weight":73,"priority":3,"keyPoints":[],"sections":[{"id":"4.1","t":"Overview","h":"<ul><li>Định nghĩa: Ensemble là kỹ thuật kết hợp dự đoán từ nhiều mô hình đơn lẻ (base learners) để tạo ra một mô hình tổng thể có khả năng tổng quát hóa tốt hơn và ổn định hơn so với bất kỳ mô hình riêng lẻ nào.</li><li>Mục tiêu: Giảm phương sai (variance) - lỗi do mô hình quá nhạy cảm với dữ liệu, và giảm độ chệch (bias) - lỗi do mô hình quá đơn giản.</li><li>Các hướng tiếp cận chính: Bagging, Boosting và Stacking.</li></ul>"},{"id":"4.2","t":"Bagging (Bootstrap Aggregation)","h":"<h4>Nguyên lý hoạt động</h4><ul><li>Xây dựng nhiều mô hình độc lập trên các tập con khác nhau của dữ liệu huấn luyện.</li><li>Bootstrap: Lấy mẫu dữ liệu có thay thế để tạo ra các tập huấn luyện mới.</li><li>Aggregation: Kết hợp kết quả bằng cách lấy trung bình (hồi quy) hoặc bỏ phiếu đa số (phân loại).</li></ul><h4>Các thuật toán phổ biến</h4><ul><li>Random Forest: Một cải tiến của Bagging cho cây quyết định. Nó thêm tính ngẫu nhiên bằng cách chỉ chọn một tập con các đặc trưng (features) tại mỗi điểm phân tách, giúp các cây trong rừng khác biệt nhau hơn.</li><li>Extra Trees (Extremely Randomized Trees): Tăng tính ngẫu nhiên bằng cách chọn điểm phân tách (split point) hoàn toàn ngẫu nhiên thay vì tìm điểm tối ưu. Điều này giúp giảm phương sai mạnh mẽ và tốc độ tính toán nhanh hơn.</li></ul><table><tr><th><div><code>#Random Forest</code><code><br></code><code>from</code><code> sklearn.ensemble </code><code>import</code><code> RandomForestClassifier<br><br></code><code># Khởi tạo mô hình với 100 cây</code><code><br>rf = RandomForestClassifier(n_estimators=</code><code>100</code><code>, max_features=</code><code>'sqrt'</code><code>)<br><br></code><code># Huấn luyện</code><code><br>rf.fit(X_train, y_train)<br><br></code><code># Đánh giá bằng out-of-bag error (nếu cấu hình)</code><code><br>y_pred = rf.predict(X_test)<br></code></div></th></tr></table>"},{"id":"4.3","t":"Boosting","h":"<h4>Nguyên lý hoạt động</h4><ul><li>Xây dựng các mô hình theo chuỗi (sequential). Mô hình sau cố gắng sửa lỗi của mô hình trước đó.</li><li>Các quan sát bị dự đoán sai ở bước trước sẽ được gán trọng số cao hơn để mô hình sau tập trung vào chúng.</li><li>Base Learner: Thường là các \"Decision Stumps\" (cây quyết định chỉ có 1 tầng) -&gt;thường thì các cây con này đưa ra quyết định chỉ dựa trên 1 feature cụ thể </li></ul><h4>Các thuật toán phổ biến</h4><ul><li>AdaBoost (Adaptive Boosting): Sử dụng hàm mất mát lũy thừa (exponential loss), rất nhạy cảm với các điểm ngoại lai (outliers).</li><li>Gradient Boosting: Tối ưu hóa hàm mất mát bằng cách sử dụng Gradient Descent. Thường sử dụng hàm Deviance (binomial log-likelihood), giúp nó kháng ngoại lai tốt hơn AdaBoost.</li></ul><table><tr><th><div><code># Gradient Boosting</code><code><br></code><code>from</code><code> sklearn.ensemble </code><code>import</code><code> GradientBoostingClassifier<br><br></code><code># Khởi tạo mô hình</code><code><br>gbc = GradientBoostingClassifier(n_estimators=</code><code>100</code><code>, learning_rate=</code><code>0.1</code><code>, max_depth=</code><code>3</code><code>)<br><br></code><code># Huấn luyện</code><code><br>gbc.fit(X_train, y_train)</code></div></th></tr></table>"},{"id":"4.4","t":"Stacking (Học xếp chồng)","h":"<ul><li>Khái niệm: Kết hợp các mô hình thuộc các loại khác nhau (heterogeneous) như SVM, KNN, Logistic Regression.</li><li>Cơ chế: Các mô hình lớp cơ sở (level-0) đưa ra dự đoán. Các dự đoán này (xác suất các lớp) sẽ được dùng làm đầu vào cho một mô hình meta (level-1) để đưa ra kết luận cuối cùng.</li><li>Cách kết hợp: Thường dùng bỏ phiếu đa số hoặc gán trọng số cho từng mô hình dựa trên hiệu suất của chúng.</li></ul>"},{"id":"4.5","t":"So sánh","h":"<table><tr><th><div><b>Đặc điểm</b></div></th><th><div><b>Bagging</b></div></th><th><div><b>Boosting</b></div></th><th><div><b>Stacking</b></div></th></tr><tr><td><div>Cấu trúc</div></td><td><div>Song song (Parallel)</div></td><td><div>Nối tiếp (Sequential)</div></td><td><div>Song song &amp; Phân tầng</div></td></tr><tr><td><div>Loại mô hình</div></td><td><div>Thường là cùng loại (đồng nhất)</div></td><td><div>Thường là cùng loại (đồng nhất)</div></td><td><div>Khác loại (không đồng nhất)</div></td></tr><tr><td><div>Mục đích</div></td><td><div>Giảm Variance (Quá khớp)</div></td><td><div>Giảm Bias (Dưới khớp)</div></td><td><div>Tối ưu hóa dự đoán tổng thể</div></td></tr><tr><td><div>Cách kết hợp</div></td><td><div>Lấy trung bình/Bỏ phiếu</div></td><td><div>Cộng dồn có trọng số</div></td><td><div>Sử dụng mô hình Meta</div></td></tr></table><p><i>Bagging là tổ chức họp lớp xong bên nào đông phiếu hơn thì nghe. Boosting là làm bài tập đưa giáo viên check sai chỗ nào thì note lại chỗ đó học lại. Stacking là chép bài của n đứa trong lớp, thằng nào giỏi hơn thì mình sẽ ưu tiên đáp án nó hơn - đánh trọng số nó cao hơn (nhưng vẫn check bài những thằng khác để so đáp án cho chắc)</i></p><ul><li>Overfitting: Boosting dễ bị quá khớp nếu số vòng lặp quá lớn, cần dùng kiểm chéo (cross-validation) để dừng sớm.</li><li>Tính toán: Bagging có thể chạy song song (multithreaded) nên thường nhanh hơn trên phần cứng đa nhân.</li><li>Dữ liệu không cân bằng: Có thể sử dụng Balanced Bagging (Blagging) để kết hợp việc lấy mẫu lại dữ liệu ngay trong quy trình ensemble.</li></ul><p><b><b>Interpretability vs Unbalanced Dât</b></b></p>"},{"id":"4.7","t":"Khả năng Giải thích Mô hình (Model Interpretability)","h":"<h4>1.1. Tầm quan trọng</h4><ul><li>Giúp con người có thể tin tưởng và gỡ lỗi (debug) các mô hình học máy một cách hiệu quả.</li><li>Đảm bảo tính minh bạch trong các quyết định quan trọng của AI.</li></ul><h4>1.2. Phân loại Mô hình theo tính giải thích</h4><table><tr><th><div>Loại mô hình</div></th><th><div>Đặc điểm</div></th><th><div>Ví dụ</div></th></tr><tr><td><div><b>Tự giải thích (Self-interpretable)</b></div></td><td><div>Cấu trúc đơn giản, trực quan.</div></td><td><div>Mô hình tuyến tính, Cây quyết định đơn giản, K-Nearest Neighbors (KNN).</div></td></tr><tr><td><div><b>Hộp đen (Non-self-interpretable)</b></div></td><td><div>Cấu trúc phức tạp, khó hiểu trực tiếp.</div></td><td><div>Các mô hình Ensemble lớn (Random Forest, Boosting), SVM, Mạng thần kinh.</div></td></tr></table><h4>1.3. Các phương pháp giải thích</h4><ul><li>Intrinsic (Nội tại): Sử dụng cho các mô hình vốn đã dễ hiểu.</li><li>Post-hoc: Giải thích các mô hình sau khi chúng đã được huấn luyện xong.</li><li>Model-agnostic (Bất khả tri): Có thể áp dụng cho bất kỳ mô hình nào, không phụ thuộc vào cấu trúc bên trong.</li></ul><ul><li>Permutation Feature Importance: Xếp hạng tầm quan trọng của đặc trưng bằng cách hoán vị giá trị của chúng.</li><li>Partial Dependency Plot (PDP): Minh họa mối quan hệ giữa một đặc trưng cụ thể và kết quả đầu ra của mô hình.</li></ul><h4>1.4. Mô hình Thay thế (Surrogate Models)</h4><h4>Global Surrogate (Mô hình thay thế toàn cục)</h4><ul><li>Mục tiêu: Giải thích hành vi tổng quát của toàn bộ mô hình phức tạp trên tất cả các tập dữ liệu.</li><li>Cơ chế hoạt động:</li></ul><p>Thay vì cố gắng hiểu trực tiếp cấu trúc bên trong của hộp đen, chúng ta coi nó như một hàm số và huấn luyện một mô hình đơn giản (như Cây quyết định hoặc Hồi quy tuyến tính) để dự đoán giống hệt như hộp đen đó.</p><ol><li>Lấy tập dữ liệu <span class=\"mj\" data-tex=\"X\">X</span>.</li><li>Dùng mô hình phức tạp (Hộp đen) để dự đoán kết quả cho <span class=\"mj\" data-tex=\"X\">X</span>. Gọi kết quả này là <span class=\"mj\" data-tex=\"\\hat{y}\">\\hat{y}</span>.</li><li>Huấn luyện một mô hình đơn giản (Mô hình thay thế - ví dụ: Cây quyết định) trên tập <span class=\"mj\" data-tex=\"(X,\\ \\hat{y})\">(X,\\ \\hat{y})</span>. Lưu ý: Chúng ta huấn luyện để mô hình đơn giản dự đoán theo kết quả của hộp đen, chứ không phải theo nhãn thực tế của dữ liệu.</li><li>Đo lường độ chính xác của mô hình thay thế (thường dùng <span class=\"mj\" data-tex=\"R^2\">R^2</span>). Nếu <span class=\"mj\" data-tex=\"R^2\">R^2</span> cao, mô hình đơn giản này là một \"bản sao\" đáng tin cậy để ta dùng nó giải thích cho hộp đen.</li></ol><h4>Local Surrogate - LIME (Mô hình thay thế cục bộ)</h4><ul><li>Mục tiêu: Giải thích tại sao mô hình lại đưa ra một quyết định cụ thể cho duy nhất một điểm dữ liệu.</li><li>Cơ chế hoạt động:</li></ul><p>LIME giả định rằng dù mô hình hộp đen có phức tạp đến đâu trên toàn cục, nhưng nếu ta chỉ xét một vùng rất nhỏ xung quanh một điểm dữ liệu, mô hình đó có thể được xấp xỉ bằng một đường thẳng (tuyến tính).</p><ol><li>Chọn một điểm dữ liệu cần giải thích.</li><li>Tạo ra hàng nghìn \"biến thể\" xung quanh điểm đó bằng cách thay đổi nhẹ các giá trị đặc trưng (gọi là perturbation).</li><li>Dùng mô hình hộp đen để dự đoán nhãn cho tất cả các biến thể này.</li><li>Gán trọng số: Những biến thể nào càng nằm gần điểm gốc thì càng quan trọng (trọng số cao), những điểm xa thì trọng số thấp.</li><li>Huấn luyện một mô hình tuyến tính đơn giản trên các biến thể đã có trọng số này. Trọng số của mô hình tuyến tính chính là \"lời giải thích\" (ví dụ: đặc trưng nào đóng góp bao nhiêu % vào kết quả).</li></ol><p><i><b>Phần này nếu có hứng thú thì có thể tham khảo thêm SHAP</b></i></p>"},{"id":"4.8","t":"Xử lý Dữ liệu Không cân bằng (Modeling Unbalanced Classes)","h":"<p>Các thuật toán phân loại thường tối ưu hóa độ chính xác (Accuracy), dẫn đến việc chúng dự đoán rất tốt lớp đa số nhưng bỏ qua hoặc dự đoán sai lớp thiểu số (lớp quan trọng).</p><h4>2.1. Các thước đo đánh giá phù hợp</h4><p>Tuyệt đối <b>không dùng Accuracy</b> cho dữ liệu không cân bằng. Thay vào đó hãy dùng:</p><ul><li>AUC (Area Under Curve) </li><li>F1 Score</li><li>Cohen's Kappa</li></ul><h4>2.2. Các kỹ thuật Resampling</h4><table><tr><th><div>Kỹ thuật</div></th><th><div>Mô tả</div></th><th><div>Thuật toán tiêu biểu</div></th></tr><tr><td><div><b>Upsampling (Tăng mẫu)</b></div></td><td><div>Nhân bản hoặc tạo mới dữ liệu cho lớp thiểu số.</div></td><td><div>Random Oversampling, SMOTE, ADASYN.</div></td></tr><tr><td><div><b>Downsampling (Giảm mẫu)</b></div></td><td><div>Loại bỏ bớt dữ liệu của lớp đa số.</div></td><td><div>NearMiss (1, 2, 3), Tomek Links, Edited Nearest Neighbors (ENN).</div></td></tr><tr><td><div><b>Hybrid (Kết hợp)</b></div></td><td><div>Sử dụng cả tăng và giảm mẫu.</div></td><td><div>SMOTE + Tomek Links, SMOTE + ENN.</div></td></tr></table><h4>2.4. Quy trình xử lý</h4><ol><li>Thực hiện Stratified Test-Train Split để giữ nguyên tỷ lệ lớp.</li><li>Thực hiện Resampling (chỉ thực hiện sau khi đã chia Test set).</li><li>Xây dựng mô hình trên dữ liệu đã cân bằng.</li></ol><h4>2.5. Balanced Bagging (Blagging)</h4><p>Kỹ thuật này tích hợp việc giảm mẫu lớp đa số trực tiếp vào quá trình xây dựng từng cây trong mô hình Ensemble. Mỗi cây sẽ được huấn luyện trên một mẫu bootstrap đã được cân bằng, giúp cải thiện khả năng nhận diện lớp thiểu số mà không làm mất quá nhiều thông tin của lớp đa số.</p><h4>2.6 SMOTE (Synthetic Minority Oversampling Technique)</h4><p>Thay vì chỉ đơn giản là nhân bản các hàng dữ liệu có sẵn, SMOTE tạo ra các mẫu mới dựa trên các mẫu hiện có thông qua nội suy toán học.</p><ul><li>Công thức tạo điểm mới: <span class=\"mj\" data-tex=\"x_{new} = x_i + \\lambda\\,(x_{zi} - x_i),\\quad \\lambda \\in [0, 1]\">x_{new} = x_i + \\lambda\\,(x_{zi} - x_i),\\quad \\lambda \\in [0, 1]</span>.</li><li>Lưu ý: Nên thực hiện SMOTE sau khi đã chia tập huấn luyện và kiểm tra để tránh rò rỉ dữ liệu (data leakage).</li></ul><h4>2.7. Nhóm thuật toán NearMiss (Undersampling)</h4><p>NearMiss lựa chọn các điểm dữ liệu lớp đa số để giữ lại dựa trên khoảng cách tới lớp thiểu số:</p><table><tr><th><div><b>Phiên bản</b></div></th><th><div><b>Tiêu chí giữ lại điểm lớp đa số</b></div><div> </div></th></tr><tr><td><div><b>NearMiss-1</b></div></td><td><div>Các điểm có khoảng cách trung bình đến 3 điểm lớp thiểu số gần nhất là nhỏ nhất.</div></td></tr><tr><td><div><b>NearMiss-2</b></div></td><td><div>Các điểm có khoảng cách trung bình đến 3 điểm lớp thiểu số xa nhất là nhỏ nhất.</div></td></tr><tr><td><div><b>NearMiss-3</b></div></td><td><div>Các điểm là láng giềng gần nhất của từng điểm thuộc lớp thiểu số.</div></td></tr></table><h4>2.8. Làm sạch ranh giới: Tomek Links và ENN</h4><ul><li>Tomek Links: Loại bỏ các điểm lớp đa số nằm quá gần lớp thiểu số (gây nhiễu ranh giới).</li><li>Edited Nearest Neighbors (ENN): Loại bỏ các điểm có nhãn khác với đa số các láng giềng xung quanh nó, giúp làm mượt đường quyết định. </li></ul><p><b><b>Unsupervised Learning</b></b></p>"},{"id":"4.9","t":"Overview","h":"<h4>Khái niệm</h4><ul><li>Định nghĩa: Là loại học máy mà mô hình được huấn luyện trên dữ liệu không có nhãn (unlabeled data). Máy tự tìm ra các cấu trúc hoặc quy luật ẩn trong dữ liệu.</li><li>Các dạng chính:</li></ul><ul><li>Phân cụm (Clustering): Gom nhóm các điểm dữ liệu tương đồng.</li><li>Giảm chiều dữ liệu (Dimension Reduction): Giảm số lượng biến đặc trưng nhưng vẫn giữ lại thông tin quan trọng nhất.</li></ul><h4>Curse of Dimensionality</h4><p>Về lý thuyết, tăng thêm đặc trưng sẽ cải thiện hiệu suất. Tuy nhiên, trong thực tế, quá nhiều đặc trưng dẫn đến hiệu suất kém đi vì số lượng mẫu huấn luyện cần thiết tăng theo cấp số nhân với số chiều. Phân cụm và Giảm chiều dữ liệu giúp giải quyết vấn đề này bằng cách xác định các nhóm tương đồng hoặc yếu tố cốt lõi.</p><p><b>=&gt; PCA giúp giảm chiều dữ liệu</b></p>"},{"id":"4.10","t":"Phân cụm K-Means (K-Means Clustering)","h":"<h4>Thuật toán K-Means</h4><ol><li>Bước 1: Chọn ngẫu nhiên <span class=\"mj\" data-tex=\"K\">K</span> điểm làm các tâm cụm (centroids).</li><li>Bước 2: Gán mỗi điểm dữ liệu vào cụm có tâm gần nó nhất.</li><li>Bước 3: Tính toán lại vị trí của tâm cụm bằng cách lấy trung bình tọa độ của tất cả các điểm trong cụm đó.</li><li>Bước 4: Lặp lại bước 2 và 3 cho đến khi vị trí các tâm cụm không còn thay đổi (hội tụ).</li></ol><h4>Khởi tạo và Lựa chọn K</h4><ul><li>K-Means++: Một phương pháp khởi tạo tâm cụm thông minh hơn thay vì chọn hoàn toàn ngẫu nhiên, giúp thuật toán hội tụ nhanh hơn và tránh các nghiệm tối ưu cục bộ kém.</li><li>Phương pháp Khuỷu tay (Elbow Method): Dùng để tìm số lượng cụm <span class=\"mj\" data-tex=\"K\">K</span> tối ưu bằng cách vẽ biểu đồ giá trị Inertia theo <span class=\"mj\" data-tex=\"K\">K</span>. Điểm mà tại đó tốc độ giảm của Inertia chậm lại rõ rệt chính là \"khuỷu tay\" (elbow)</li></ul><h4>Các thước đo lỗi</h4><ul><li>Inertia (SSE): Tổng bình phương khoảng cách từ các điểm đến tâm cụm của chúng. Inertia luôn giảm khi tăng <span class=\"mj\" data-tex=\"K\">K</span>.</li><li>Distortion: Trung bình bình phương khoảng cách từ mỗi điểm đến tâm cụm của nó.</li></ul>"},{"id":"4.11","t":"Ứng dụng thực tế","h":"<ul><li>Phân khúc khách hàng: Nhóm khách hàng theo hành vi mua sắm, nhân khẩu học để tối ưu marketing.</li><li>Phát hiện bất thường: Xác định các giao dịch gian lận hoặc lỗi hệ thống (các điểm không thuộc về cụm nào rõ rệt).</li><li>Nén hình ảnh: Giảm số lượng màu sắc hoặc độ phân giải nhưng vẫn giữ được nội dung chính.</li></ul>"},{"id":"4.12","t":"Code minh họa (Python)","h":"<table><tr><th><div><code>import</code><code> matplotlib.pyplot </code><code>as</code><code> plt<br></code><code>from</code><code> sklearn.cluster </code><code>import</code><code> KMeans<br></code><code>from</code><code> sklearn.datasets </code><code>import</code><code> make_blobs<br><br></code><code># 1. Tạo dữ liệu giả lập</code><code><br>X, _ = make_blobs(n_samples=</code><code>300</code><code>, centers=</code><code>4</code><code>, cluster_std=</code><code>0.60</code><code>, random_state=</code><code>0</code><code>)<br><br></code><code># 2. Tìm K tối ưu bằng Elbow Method</code><code><br>inertia = []<br></code><code>for</code><code> i </code><code>in</code><code> range(</code><code>1</code><code>, </code><code>11</code><code>):<br>    kmeans = KMeans(n_clusters=i, init=</code><code>'k-means++'</code><code>, max_iter=</code><code>300</code><code>, n_init=</code><code>10</code><code>, random_state=</code><code>0</code><code>)<br>    kmeans.fit(X)<br>    inertia.append(kmeans.inertia_)<br><br></code><code># 3. Huấn luyện mô hình với K=4</code><code><br>kmeans = KMeans(n_clusters=</code><code>4</code><code>, init=</code><code>'k-means++'</code><code>, random_state=</code><code>0</code><code>)<br>y_kmeans = kmeans.fit_predict(X)<br><br></code><code># 4. Trực quan hóa</code><code><br>plt.scatter(X[:, </code><code>0</code><code>], X[:, </code><code>1</code><code>], c=y_kmeans, s=</code><code>50</code><code>, cmap=</code><code>'viridis'</code><code>)<br>centers = kmeans.cluster_centers_<br>plt.scatter(centers[:, </code><code>0</code><code>], centers[:, </code><code>1</code><code>], c=</code><code>'red'</code><code>, s=</code><code>200</code><code>, alpha=</code><code>0.5</code><code>)<br>plt.title(</code><code>\"K-Means Clustering (K=4)\"</code><code>)<br>plt.show()<br></code></div></th></tr></table><p><b><b>Clustering algorithms</b></b></p>"},{"id":"4.14","t":"Các Độ đo Khoảng cách (Distance Metrics)","h":"<p>Mỗi loại dữ liệu sẽ phù hợp với một thước đo khác nhau.</p><ul><li>Khoảng cách Euclidean (L2 Distance): Phổ biến nhất, tính đường thẳng ngắn nhất giữa hai điểm. Phù hợp cho dữ liệu dựa trên tọa độ nhưng nhạy cảm với \"lời nguyền chiều dữ liệu\".</li><li>Khoảng cách Manhattan (L1/City Block): Tính tổng chênh lệch tuyệt đối giữa các tọa độ. Thường dùng khi các đặc trưng không có cùng đơn vị hoặc trong mạng lưới ô bàn cờ.</li><li>Khoảng cách Cosine: Đo góc giữa hai vectơ. Không bị ảnh hưởng bởi độ lớn (scaling), rất hiệu quả cho dữ liệu văn bản (text mining) nơi tần suất xuất hiện quan trọng hơn số lượng từ.</li><li>Khoảng cách Jaccard: Tính toán dựa trên tỷ lệ phần tử chung trên tổng số phần tử độc nhất (Intersection over Union). Thường dùng cho dữ liệu nhị phân hoặc so sánh tập hợp các từ xuất hiện trong văn bản.</li></ul><table><tr><th><div><code>from</code><code> sklearn.metrics.pairwise </code><code>import</code><code> euclidean_distances, cosine_distances<br></code><code>import</code><code> numpy </code><code>as</code><code> np<br><br></code><code># Khởi tạo hai vectơ</code><code><br>a = np.array([[</code><code>1</code><code>, </code><code>2</code><code>, </code><code>3</code><code>]])<br>b = np.array([[</code><code>4</code><code>, </code><code>5</code><code>, </code><code>6</code><code>]])<br><br></code><code># 1. TÍNH KHOẢNG CÁCH EUCLIDEAN</code><code><br></code><code># Cách tính tay: (tính bằng công thức căn bậc 2 của tổng hiệu bình các khoảng cách)</code><code><br></code><code># Công thức: sqrt((x1-x2)^2 + (y1-y2)^2 + (z1-z2)^2)</code><code><br></code><code># = sqrt((1-4)^2 + (2-5)^2 + (3-6)^2)</code><code><br></code><code># = sqrt((-3)^2 + (-3)^2 + (-3)^2)</code><code><br></code><code># = sqrt(9 + 9 + 9) = sqrt(27)</code><code><br>euc = euclidean_distances(a, b)<br>print(</code><code>f\"Euclidean Distance: {euc[</code><code>0</code><code>][</code><code>0</code><code>]}\"</code><code>) <br><br></code><code># 2. TÍNH KHOẢNG CÁCH COSINE</code><code><br></code><code># Cách tính tay: (bấm máy casio trong phần vector)</code><code><br><br>cos = cosine_distances(a, b)<br>print(</code><code>f\"Cosine Distance: {cos[</code><code>0</code><code>][</code><code>0</code><code>]}\"</code><code>)<br><br></code><code># TÓM TẮT KẾT QUẢ:</code><code><br></code><code># Euclidean: [[5.19615242]]</code><code><br></code><code># Cosine:    [[0.02536815]]</code><code><br></code></div></th></tr></table>"},{"id":"4.15","t":"Phân cụm Phân cấp (Hierarchical Agglomerative Clustering) HAC","h":"<p>Thuật toán này xây dựng các cụm theo mô hình phân cấp từ dưới lên (Bottom-up). Ban đầu mỗi điểm là một cụm, sau đó gộp dần các cụm gần nhất lại với nhau.</p><h4>Các loại Linkage (Cách đo khoảng cách giữa các cụm):</h4><ul><li>Single Linkage: Khoảng cách nhỏ nhất giữa hai điểm thuộc hai cụm. Dễ bị ảnh hưởng bởi nhiễu (hiệu ứng \"chaining\").</li><li>Complete Linkage: Khoảng cách lớn nhất giữa hai điểm. Giúp tách biệt cụm tốt hơn nếu có nhiễu nhẹ.</li><li>Average Linkage: Trung bình khoảng cách của tất cả các cặp điểm giữa hai cụm.</li><li>Ward Linkage: Kết hợp các cụm sao cho tổng phương sai (inertia) tăng lên là ít nhất. Đây là phương pháp phổ biến nhất.</li></ul><table><tr><th><div><code>from</code><code> sklearn.cluster </code><code>import</code><code> AgglomerativeClustering<br></code><code>import</code><code> scipy.cluster.hierarchy </code><code>as</code><code> sch<br><br></code><code># Vẽ Dendrogram</code><code><br></code><code># dendrogram = sch.dendrogram(sch.linkage(X, method='ward'))</code><code><br></code><code># quan sát các đường thẳng đứng dài nhất trong Dendrogram (nơi mà khoảng cách giữa các lần gộp cụm là lớn nhất). Việc cắt ngang qua các đường này thường mang lại kết quả phân cụm tự nhiên và ổn định nhất. </code><code><br><br></code><code># Huấn luyện mô hình</code><code><br>agg_clustering = AgglomerativeClustering(n_clusters=</code><code>3</code><code>, affinity=</code><code>'euclidean'</code><code>, linkage=</code><code>'ward'</code><code>)<br>labels = agg_clustering.fit_predict(X)</code></div></th></tr></table>"},{"id":"4.16","t":"DBSCAN (Density-Based Spatial Clustering of Applications with Noise)","h":"<p>DBSCAN phân cụm dựa trên mật độ. Nó có thể tìm thấy các cụm có hình dạng bất kỳ và tự động loại bỏ nhiễu (noise).</p><h4>Các tham số và khái niệm chính:</h4><ul><li>Epsilon (eps): Bán kính vùng lân cận.</li><li>MinPts: Số lượng điểm tối thiểu trong vùng eps để một điểm được coi là điểm lõi.</li><li>Core Point (Điểm lõi): Có nhiều hơn MinPts lân cận trong bán kính eps.</li><li>Density-reachable (Điểm biên): Nằm trong vùng eps của một điểm lõi nhưng bản thân nó không có đủ MinPts lân cận.</li><li>Noise (Nhiễu): Không thuộc bất kỳ cụm nào.</li></ul><table><tr><th><div><code>from</code><code> sklearn.cluster </code><code>import</code><code> DBSCAN<br><br>dbscan = DBSCAN(eps=</code><code>0.5</code><code>, min_samples=</code><code>5</code><code>)<br>labels = dbscan.fit_predict(X)<br></code><code># Nhãn -1 đại diện cho nhiễu (noise)</code></div></th></tr></table>"},{"id":"4.17","t":"Mean-Shift Clustering","h":"<p>Thuật toán này tìm kiếm các vùng có mật độ dữ liệu cao nhất (mốt - mode). Nó di chuyển tâm của một cửa sổ (window) về phía có mật độ cao hơn cho đến khi hội tụ.</p><ul><li>Ưu điểm: Không cần khai báo trước số lượng cụm K. Có thể tìm thấy các cụm có kích thước không đều.</li><li>Nhược điểm: Chạy chậm với dữ liệu lớn. Phụ thuộc nhiều vào tham số \"bandwidth\" (kích thước cửa sổ).</li></ul><table><tr><th><div><code>from</code><code> sklearn.cluster </code><code>import</code><code> MeanShift, estimate_bandwidth<br><br></code><code># Ước lượng bandwidth tự động</code><code><br>bandwidth = estimate_bandwidth(X, quantile=</code><code>0.2</code><code>)<br><br>ms = MeanShift(bandwidth=bandwidth, bin_seeding=</code><code>True</code><code>)<br>ms.fit(X)<br>labels = ms.labels_<br>cluster_centers = ms.cluster_centers_</code></div></th></tr></table>"},{"id":"4.18","t":"So sánh","h":"<table><tr><th><div>Thuật toán</div></th><th><div>Ưu điểm</div></th><th><div>Nhược điểm</div><div> </div></th></tr><tr><td><div><b>K-Means</b></div></td><td><div>Rất nhanh, phù hợp dữ liệu cực lớn.</div></td><td><div>Cần biết trước K; Chỉ hiệu quả với cụm hình cầu.</div></td></tr><tr><td><div><b>Hierarchical</b></div></td><td><div>Cung cấp biểu đồ phân cấp (Dendrogram); Nhiều tùy chọn linkage.</div></td><td><div>Chậm với dữ liệu lớn ($O(N^2)$); Phải chọn K để cắt cây.</div></td></tr><tr><td><div><b>DBSCAN</b></div></td><td><div>Tìm cụm hình dạng bất kỳ; Tự phát hiện nhiễu; Không cần K.</div></td><td><div>Nhạy cảm với tham số eps; Không tốt với các cụm mật độ khác nhau.</div></td></tr><tr><td><div><b>Mean-Shift</b></div></td><td><div>Không cần K; Tìm cụm kích thước không đều.</div></td><td><div>Chạy chậm; Chỉ dùng khoảng cách Euclidean.</div></td></tr></table>"}]}],"questions":[],"past":[],"pastExams":[],"glossary":[],"quick":[],"compares":[],"keyq":[],"recall":[{"id":"r-m1-001","module":"m1","ref":"1.2","type":"recall","kind":"manual","q":"Điểm khác biệt cốt lõi giúp Học sâu (Deep Learning) giải quyết các hạn chế của Học máy (Machine Learning) cổ điển là gì?","correct":"Tự xác định và trích xuất các đặc trưng (features) tốt nhất từ dữ liệu gốc thông qua mạng thần kinh đa lớp","wrong":["Bắt buộc chuyên gia phải tự thiết kế và trích xuất đặc trưng thủ công từ dữ liệu thô","Chỉ xử lý tốt các tập dữ liệu nhỏ dạng bảng với số lượng thuộc tính hạn chế","Dựa hoàn toàn vào các tập luật if-then cố định do con người thiết lập sẵn"],"explain":"Deep Learning sử dụng mạng thần kinh đa lớp để học từ lượng dữ liệu khổng lồ và có khả năng tự động xác định các đặc trưng tốt nhất từ dữ liệu gốc.","tip":"DL = Deep Learning = tự động trích xuất feature từ raw data."},{"id":"r-m1-002","module":"m1","ref":"1.2","type":"recall","kind":"manual","q":"Sự kiện nào đánh dấu Trí tuệ nhân tạo (AI) chính thức được công nhận là một lĩnh vực nghiên cứu khoa học?","correct":"Hội nghị Dartmouth (1956)","wrong":["Alan Turing phát triển bài kiểm tra Turing Test (1950)","Thuật toán Perceptron ra đời (1957)","Thuật toán lan truyền ngược Backpropagation ra đời (1986)"],"explain":"Hội nghị Dartmouth năm 1956 là cột mốc chính thức chấp nhận AI là một lĩnh vực nghiên cứu khoa học.","tip":"Dartmouth 1956 khai sinh thuật ngữ AI."},{"id":"r-m1-003","module":"m1","ref":"1.2","type":"recall","kind":"manual","q":"Nguyên nhân chính dẫn đến Mùa đông AI lần thứ nhất (AI Winter 1) trong thập niên 1960 - 1970 là gì?","correct":"Cắt giảm ngân sách do các báo cáo về sự thất bại của dịch thuật máy móc (ALPAC) và hạn chế của Perceptron","wrong":["Chi phí duy trì Hệ chuyên gia (Expert Systems) quá tốn kém và khó mở rộng quy mô","Sự thất bại của siêu máy tính Deep Blue trước đại kiện tướng cờ vua Garry Kasparov","Mạng thần kinh nhân tạo không thể mở rộng để giải quyết các bài toán lớn trong doanh nghiệp"],"explain":"Mùa đông AI lần 1 xuất phát từ báo cáo ALPAC chỉ ra thất bại của dịch máy cùng với việc Perceptron bộc lộ nhiều hạn chế, dẫn đến việc bị cắt giảm ngân sách.","tip":"Mùa đông 1 do ALPAC & Perceptron; Mùa đông 2 do Hệ chuyên gia tốn kém."},{"id":"r-m1-004","module":"m1","ref":"1.2","type":"recall","kind":"manual","q":"Thuật toán lan truyền ngược (Backpropagation) ra đời vào giai đoạn nào trong lịch sử phát triển AI?","correct":"Năm 1986, trong giai đoạn bùng nổ của Hệ chuyên gia (1980s)","wrong":["Năm 1957, cùng thời điểm với thuật toán Perceptron","Năm 1950, cùng thời điểm Alan Turing công bố Turing Test","Năm 2012, cùng thời điểm bùng nổ của mạng AlexNet"],"explain":"Thuật toán lan truyền ngược (Backpropagation) ra đời năm 1986 thuộc giai đoạn bùng nổ Hệ chuyên gia (1980s).","tip":"Backpropagation xuất hiện năm 1986."},{"id":"r-m1-005","module":"m1","ref":"1.2","type":"recall","kind":"manual","q":"Khái niệm Học máy (Machine Learning) được định nghĩa chuẩn xác như thế nào?","correct":"Nghiên cứu về các chương trình không được lập trình rõ ràng nhưng học các mẫu từ dữ liệu theo thời gian","wrong":["Nhánh khoa học mô phỏng hành vi thông minh ở máy tính để bắt chước nhận thức của con người","Mô hình mạng thần kinh đa lớp chuyên dùng để xử lý dữ liệu phi tuyến tính quy mô lớn","Hệ thống dựa trên các luật chuyên gia cố định nhằm đưa ra suy luận tự động"],"explain":"Machine Learning (ML) là nghiên cứu về các chương trình không cần lập trình rõ ràng mà tự học các mẫu (patterns) từ dữ liệu theo thời gian."},{"id":"r-m1-006","module":"m1","ref":"1.3","type":"recall","kind":"manual","q":"Trong quy trình làm việc (Workflow) của Machine Learning, bước nào diễn ra ngay sau bước 'Thu thập dữ liệu (Data Collection)'?","correct":"Khám phá & Tiền xử lý (Data Exploration & Preprocessing)","wrong":["Xây dựng mô hình (Modeling)","Đánh giá mô hình (Validation)","Triển khai (Deployment)"],"explain":"Quy trình ML: 1. Problem Statement -> 2. Data Collection -> 3. Data Exploration & Preprocessing -> 4. Modeling -> 5. Validation -> 6. Deployment."},{"id":"r-m1-007","module":"m1","ref":"1.3","type":"recall","kind":"manual","q":"Trong các thuật ngữ cơ bản của học máy, 'Target' được định nghĩa là gì?","correct":"Danh mục hoặc giá trị mà chúng ta đang cố gắng dự đoán","wrong":["Các thuộc tính của dữ liệu được sử dụng làm biến giải thích để dự đoán","Một điểm dữ liệu duy nhất tương ứng với một hàng trong bảng dữ liệu","Giá trị mục tiêu cụ thể đã được gán nhãn cho từng quan sát"],"explain":"Target là danh mục (phân loại) hoặc giá trị (hồi quy) mà mô hình đang tìm cách dự đoán."},{"id":"r-m1-008","module":"m1","ref":"1.3","type":"recall","kind":"manual","q":"Thuật ngữ 'Features' trong mô hình Machine Learning dùng để chỉ thành phần nào?","correct":"Các thuộc tính của dữ liệu được sử dụng để dự đoán (biến giải thích)","wrong":["Giá trị nhãn mục tiêu mà mô hình cần xuất ra ở đầu ra","Một quan sát duy nhất trong tập dữ liệu kiểm tra","Sai số phần dư giữa kết quả dự đoán và kết quả thực tế"],"explain":"Features là các thuộc tính của dữ liệu được sử dụng làm biến giải thích để dự đoán giá trị mục tiêu (Target)."},{"id":"r-m1-009","module":"m1","ref":"1.3","type":"recall","kind":"manual","q":"Một điểm dữ liệu duy nhất trong bảng dữ liệu (thường tương ứng với một hàng) được gọi là gì?","correct":"Observation hoặc Example","wrong":["Feature","Target","Label"],"explain":"Một điểm dữ liệu duy nhất trong bộ dữ liệu được gọi là Observation hoặc Example."},{"id":"r-m1-010","module":"m1","ref":"1.4","type":"recall","kind":"manual","q":"Việc dữ liệu bị trùng lặp (Duplicate Data) trong tập huấn luyện gây ra tác hại gì cho mô hình?","correct":"Gây sai lệch trọng số khi huấn luyện","wrong":["Làm mô hình luôn bị hiện tượng Underfitting do thiếu dữ liệu","Khiến các biến danh mục không thể chuyển đổi bằng One-hot encoding","Tự động xóa các quan sát ngoại lai trong tập kiểm tra"],"explain":"Dữ liệu trùng lặp làm phân bổ dữ liệu bị thiên lệch, dẫn đến việc gây sai lệch trọng số trong quá trình huấn luyện."},{"id":"r-m1-011","module":"m1","ref":"1.4","type":"recall","kind":"manual","q":"Phương pháp Điền khuyết (Imputation) khi xử lý dữ liệu thiếu thường sử dụng những giá trị nào để thay thế?","correct":"Giá trị trung bình, trung vị hoặc giá trị phổ biến nhất","wrong":["Giá trị 0 cố định hoặc giá trị ngoại lai lớn nhất của thuộc tính","Giá trị ngẫu nhiên từ phân phối chuẩn bất kỳ không liên quan đến tập dữ liệu","Khoảng cách Euclidean giữa hai quan sát xa nhau nhất"],"explain":"Điền khuyết (Imputation) thay thế ô bị thiếu bằng giá trị trung bình (mean), trung vị (median) hoặc giá trị xuất hiện nhiều nhất (mode)."},{"id":"r-m1-012","module":"m1","ref":"1.4","type":"recall","kind":"manual","q":"Kỹ thuật Gán nhãn (Masking) trong xử lý dữ liệu thiếu được hiểu là phương pháp nào?","correct":"Tạo một danh mục riêng biệt dành cho các giá trị thiếu","wrong":["Xóa hoàn toàn các hàng hoặc các cột có chứa giá trị thiếu","Nội suy toán học dựa trên các điểm dữ liệu láng giềng gần nhất","Chuẩn hóa dữ liệu về khoảng [0, 1] trước khi huấn luyện"],"explain":"Gán nhãn (Masking) giải quyết dữ liệu khuyết bằng cách tạo thêm một danh mục riêng đại diện cho giá trị bị thiếu."},{"id":"r-m1-013","module":"m1","ref":"1.4","type":"recall","kind":"manual","q":"Biểu đồ trực quan hóa nào được nêu trong tài liệu nhằm giúp phát hiện dữ liệu ngoại lai (Outliers)?","correct":"Box plot","wrong":["Histogram","Scatter plot","Pair plot"],"explain":"Dữ liệu ngoại lai (Outliers) có thể được nhận diện trực quan thông qua biểu đồ hộp (Box plot) hoặc qua các chỉ số thống kê."},{"id":"r-m1-014","module":"m1","ref":"1.5","type":"recall","kind":"manual","q":"Mục đích chính của việc tiến hành Phân tích Dữ liệu Khám phá (EDA) trước khi xây dựng mô hình là gì?","correct":"Hiểu sơ bộ về dữ liệu, xác định các mẫu và xu hướng trước khi mô hình hóa","wrong":["Tối ưu hóa các siêu tham số của thuật toán phân loại","Cắt tỉa các nhánh cây quyết định nhằm giảm phương sai","Tạo thêm các mẫu nhân tạo cho lớp thiểu số bị mất cân bằng"],"explain":"EDA giúp khám phá cấu trúc dữ liệu, hiểu sơ bộ các đặc trưng và tìm ra các quy luật, xu hướng trước khi mô hình hóa."},{"id":"r-m1-015","module":"m1","ref":"1.5","type":"recall","kind":"manual","q":"Trong các kỹ thuật trực quan hóa của EDA, biểu đồ Scatter plot chủ yếu được sử dụng nhằm mục đích gì?","correct":"Quan sát mối quan hệ giữa hai biến định lượng","wrong":["Quan sát hình dạng phân phối tần suất của một biến đơn lẻ","Hiển thị ma trận tương quan đa biến của tất cả các biến cùng lúc","Phát hiện các điểm lỗi nhãn phân loại sai trên tập kiểm tra"],"explain":"Scatter plot (biểu đồ phân tán) dùng để trực quan hóa mối quan hệ giữa các biến; phân phối đơn biến dùng Histogram và tương quan đa biến dùng Pair plot."},{"id":"r-m1-016","module":"m1","ref":"1.5","type":"recall","kind":"manual","q":"Để khảo sát mối tương quan đa biến giữa nhiều cặp thuộc tính cùng một lúc trong EDA, biểu đồ nào được ưu tiên lựa chọn?","correct":"Pair plot","wrong":["Histogram","Box plot","Scatter plot đơn lẻ"],"explain":"Pair plot hiển thị các biểu đồ phân tán kết hợp cho từng cặp biến, giúp nhận diện tương quan đa biến hiệu quả."},{"id":"r-m1-017","module":"m1","ref":"1.6","type":"recall","kind":"manual","q":"Tác dụng chủ yếu của phép biến đổi Log (Log Transformation) trong kỹ thuật đặc trưng là gì?","correct":"Giúp dữ liệu bị lệch (skewed) trở nên giống phân phối chuẩn hơn, hữu ích cho Hồi quy Tuyến tính","wrong":["Chuyển đổi dữ liệu danh mục thành các biến nhị phân 0 hoặc 1","Tăng số chiều của không gian đặc trưng bằng các bậc lũy thừa 2 và 3","Tạo ra các điểm dữ liệu mới nhằm cân bằng tỷ lệ các lớp phân loại"],"explain":"Log Transformation giúp đưa phân phối dữ liệu bị lệch (skewed) về gần phân phối chuẩn hơn, cải thiện hiệu quả của Linear Regression."},{"id":"r-m1-018","module":"m1","ref":"1.6","type":"recall","kind":"manual","q":"Phương pháp mã hóa One-hot encoding phù hợp nhất cho loại biến danh mục nào?","correct":"Nominal (danh mục không có thứ tự)","wrong":["Ordinal (danh mục có thứ tự phân cấp)","Continuous (biến số liên tục có giá trị âm)","Discrete (biến số nguyên đếm được)"],"explain":"One-hot encoding chuyển mỗi giá trị của biến danh mục không có thứ tự (Nominal) thành một biến nhị phân 0/1."},{"id":"r-m1-019","module":"m1","ref":"1.6","type":"recall","kind":"manual","q":"Trong trường hợp nào ta nên áp dụng Ordinal encoding thay vì One-hot encoding?","correct":"Khi biến danh mục có thứ tự rõ ràng (Ordinal), gán giá trị số theo thứ tự 1, 2, 3...","wrong":["Khi biến danh mục hoàn toàn không có thứ bậc ưu tiên nào (Nominal)","Khi dữ liệu chứa nhiều ngoại lai cần kháng nhiễu","Khi muốn biến đổi dữ liệu bị lệch về phân phối chuẩn"],"explain":"Ordinal encoding được áp dụng khi các giá trị danh mục có mối quan hệ thứ tự rõ ràng (như mức độ hài lòng, cấp bậc)."},{"id":"r-m1-020","module":"m1","ref":"1.6","type":"recall","kind":"manual","q":"Phương pháp chuẩn hóa nào sử dụng khoảng cách tứ phân vị và có khả năng kháng ngoại lai (outliers) tốt hơn?","correct":"Robust Scaling","wrong":["Min-Max Scaling","Standard Scaling","One-hot Encoding"],"explain":"Robust Scaling dựa trên khoảng cách tứ phân vị (IQR), nhờ đó không bị chi phối mạnh bởi các điểm ngoại lai như Min-Max Scaling hay Standard Scaling."},{"id":"r-m1-021","module":"m1","ref":"1.6","type":"recall","kind":"manual","q":"Phương pháp Standard Scaling biến đổi dữ liệu về dạng phân phối chuẩn với các tham số trung bình (mean) và độ lệch chuẩn (std) là bao nhiêu?","correct":"mean = 0, std = 1","wrong":["mean = 0, std = 0","mean = 1, std = 1","mean = 0.5, std = 0.5"],"explain":"Standard Scaling biến đổi đặc trưng sao cho trung bình bằng 0 và độ lệch chuẩn bằng 1."},{"id":"r-m1-022","module":"m1","ref":"1.7","type":"recall","kind":"manual","q":"Sự khác biệt cốt lõi giữa Ước lượng (Estimation) và Suy diễn (Inference) trong thống kê là gì?","correct":"Ước lượng áp dụng thuật toán để tính toán giá trị, còn suy diễn xác định độ chính xác của ước lượng đó","wrong":["Ước lượng dùng cho mô hình phi tham số, còn suy diễn dùng cho mô hình tham số","Ước lượng tính toán trên tập kiểm tra, còn suy diễn chỉ thực hiện trên tập huấn luyện","Ước lượng cập nhật phân phối hậu nghiệm, còn suy diễn chỉ lặp lại các thử nghiệm độc lập"],"explain":"Ước lượng (Estimation) là việc tính ra một giá trị đại diện (ví dụ tính trung bình), còn Suy diễn (Inference) là xác định độ chính xác của ước lượng đó (ví dụ sai số chuẩn)."},{"id":"r-m1-023","module":"m1","ref":"1.7","type":"recall","kind":"manual","q":"Đặc trưng chính của mô hình tham số (Parametric model) là gì?","correct":"Giả định dữ liệu thuộc một phân phối cụ thể (ví dụ: Phân phối chuẩn)","wrong":["Hoàn toàn không đưa ra giả định nào về phân phối xác suất của dữ liệu","Chỉ lưu trữ toàn bộ dữ liệu huấn luyện và trì hoãn tính toán đến khi dự đoán","Luôn sử dụng số lượng tham số tăng tỷ lệ thuận với số mẫu dữ liệu"],"explain":"Mô hình tham số (Parametric) đưa ra các giả định cụ thể về dạng phân phối của dữ liệu, chẳng hạn như giả định phân phối chuẩn."},{"id":"r-m1-024","module":"m1","ref":"1.7","type":"recall","kind":"manual","q":"Ví dụ nào sau đây được nêu trong tài liệu đại diện cho phương pháp phi tham số (Non-parametric)?","correct":"Biểu đồ phân phối tần suất (Histogram)","wrong":["Phân phối chuẩn (Normal distribution)","Hồi quy Tuyến tính cổ điển","Phân phối nhị thức Bernoulli"],"explain":"Mô hình phi tham số có ít giả định hơn và không giả định phân phối cố định, tài liệu nêu ví dụ Histogram."},{"id":"r-m1-025","module":"m1","ref":"1.7","type":"recall","kind":"manual","q":"Quan điểm suy luận thống kê Bayes (Bayesian) khác với trường phái Frequentist ở điểm nào?","correct":"Mô tả tham số qua các phân phối xác suất và cập nhật niềm tin từ tiên nghiệm (prior) sang hậu nghiệm (posterior) khi thấy dữ liệu","wrong":["Chỉ tập trung vào tần suất xuất hiện thông qua các lần lặp lại thử nghiệm vô hạn","Coi tham số luôn là một giá trị hằng số cố định duy nhất và không thể có phân phối","Tuyệt đối không sử dụng thông tin xác suất tiên nghiệm trong quá trình suy luận"],"explain":"Trường phái Frequentist tập trung vào các lần lặp lại thử nghiệm, còn Bayesian mô tả tham số qua phân phối xác suất và cập nhật niềm tin (prior -> posterior)."},{"id":"r-m1-026","module":"m1","ref":"1.8","type":"recall","kind":"manual","q":"Trong kiểm định giả thuyết thống kê, Giả thuyết không (H0) thường biểu thị điều gì?","correct":"Giả định không có hiệu ứng hoặc không có sự khác biệt","wrong":["Giả định chắc chắn tồn tại một hiệu ứng hoặc sự khác biệt rõ rệt","Mức ý nghĩa tối đa cho phép chấp nhận sai số dương tính giả","Xác suất dữ liệu rơi vào miền bác bỏ của phân phối chuẩn"],"explain":"Giả thuyết không (H0) luôn đặt giả định là không có hiệu ứng hay không có sự khác biệt giữa các nhóm/biến."},{"id":"r-m1-027","module":"m1","ref":"1.8","type":"recall","kind":"manual","q":"Quy tắc ra quyết định trong kiểm định giả thuyết khi so sánh giá trị p (p-value) với mức ý nghĩa alpha (thường là 0.05) là gì?","correct":"Nếu p-value < alpha thì bác bỏ H0","wrong":["Nếu p-value < alpha thì bắt buộc chấp nhận H0","Nếu p-value > alpha thì bác bỏ H0","Nếu p-value = 1 thì bác bỏ hoàn toàn giả thuyết đối H1"],"explain":"p-value là mức ý nghĩa nhỏ nhất để bác bỏ H0; nếu p-value < alpha (thường là 0.05) thì ta đủ cơ sở bác bỏ H0."},{"id":"r-m1-028","module":"m1","ref":"1.8","type":"recall","kind":"manual","q":"Sai lầm loại I (Type I Error) trong kiểm định giả thuyết xảy ra khi nào?","correct":"Bác bỏ H0 khi H0 đúng (Dương tính giả)","wrong":["Chấp nhận H0 khi H1 đúng (Âm tính giả)","Chấp nhận H0 khi H0 đúng","Bác bỏ H0 khi H1 đúng"],"explain":"Sai lầm loại I là bác bỏ giả thuyết H0 dù trên thực tế H0 là đúng (Dương tính giả)."},{"id":"r-m1-029","module":"m1","ref":"1.8","type":"recall","kind":"manual","q":"Phát biểu nào sau đây đúng về mối liên hệ giữa Tương quan (Correlation) và Nhân quả (Causation)?","correct":"Tương quan giúp dự đoán nhưng không ngụ ý nhân quả do có thể có biến gây nhiễu hoặc tương quan ảo","wrong":["Nếu hai biến có hệ số tương quan cao thì chắc chắn tồn tại mối quan hệ nhân quả trực tiếp","Tương quan không thể dùng để dự đoán nếu không chứng minh được quan hệ nhân quả","Biến gây nhiễu (Confounding variables) chỉ tồn tại khi hai biến hoàn toàn độc lập"],"explain":"Tương quan giúp dự đoán nhưng không ngụ ý quan hệ nhân quả; cần lưu ý hiện tượng tương quan ảo hoặc ảnh hưởng của các biến gây nhiễu."},{"id":"r-m1-030","module":"m1","ref":"1.9","type":"recall","kind":"manual","q":"Đặc điểm bắt buộc của dữ liệu đưa vào huấn luyện trong Học có giám sát (Supervised Learning) là gì?","correct":"Dữ liệu đưa vào huấn luyện phải được gán nhãn (labeled)","wrong":["Dữ liệu huấn luyện hoàn toàn không được có nhãn đi kèm","Dữ liệu chỉ bao gồm một biến đặc trưng duy nhất dạng chuỗi ký tự","Tất cả các nhãn bắt buộc phải là biến số liên tục lớn hơn 0"],"explain":"Trong Supervised Learning, tập dữ liệu huấn luyện bắt buộc phải có sẵn nhãn (label) để mô hình học ánh xạ từ đặc trưng sang nhãn."},{"id":"r-m1-031","module":"m1","ref":"1.9","type":"recall","kind":"manual","q":"Hai từ khóa quan trọng cốt lõi (Keywords) của Học tăng cường (Reinforcement Learning) là gì?","correct":"Policy và Action","wrong":["Target và Feature","Entropy và Information Gain","Centroid và Inertia"],"explain":"Tài liệu nhấn mạnh từ khóa cốt lõi của Reinforcement Learning là Policy (chính sách) và Action (hành động)."},{"id":"r-m1-032","module":"m1","ref":"1.9","type":"recall","kind":"manual","q":"Điểm khác biệt chính giữa bài toán Hồi quy (Regression) và Phân loại (Classification) trong Học có giám sát là gì?","correct":"Biến mục tiêu của Hồi quy là dạng số liên tục, còn Phân loại là dạng danh mục rời rạc","wrong":["Hồi quy không cần nhãn mục tiêu, còn phân loại bắt buộc phải có nhãn","Hồi quy sử dụng hàm mất mát Hinge Loss, còn phân loại luôn dùng hàm mất mát SSE","Hồi quy chỉ áp dụng cho dữ liệu văn bản, còn phân loại chỉ áp dụng cho dữ liệu âm thanh"],"explain":"Regression dự đoán giá trị liên tục (dạng số như giá nhà, doanh thu), còn Classification dự đoán danh mục rời rạc (nhãn như Spam/Not Spam)."},{"id":"r-m1-033","module":"m1","ref":"1.9","type":"recall","kind":"manual","q":"Trong scikit-learn, phương thức nào được gọi trên đối tượng mô hình để thực hiện huấn luyện với tập dữ liệu?","correct":"`model.fit(X_train, y_train)`","wrong":["`model.predict(X_train, y_train)`","`model.transform(X_train, y_train)`","`model.evaluate(X_train, y_train)`"],"explain":"Cú pháp chuẩn để huấn luyện mô hình học có giám sát trong scikit-learn là gọi phương thức `fit()` với dữ liệu đầu vào và nhãn tương ứng."},{"id":"r-m1-034","module":"m1","ref":"1.10","type":"recall","kind":"manual","q":"Trong quy trình chia dữ liệu, tập kiểm định (Validation Set) được sử dụng nhằm mục đích gì?","correct":"Tối ưu hóa các siêu tham số (hyperparameters) của mô hình","wrong":["Huấn luyện trực tiếp các trọng số cơ sở của mô hình","Đánh giá hiệu suất tổng thể cuối cùng của mô hình trước khi triển khai","Kiểm tra tính đúng đắn của việc mã hóa One-hot encoding"],"explain":"Training Set dùng để huấn luyện mô hình, Validation Set dùng để tối ưu hóa siêu tham số, còn Test Set dùng để đánh giá hiệu suất cuối cùng."},{"id":"r-m1-035","module":"m1","ref":"1.10","type":"recall","kind":"manual","q":"Mục đích cơ bản của việc phân chia dữ liệu thành tập huấn luyện (Train) và tập kiểm tra (Test) là gì?","correct":"Kiểm tra khả năng tổng quát hóa (generalization) trên dữ liệu mới và tránh quá khớp (overfitting)","wrong":["Đảm bảo kích thước dữ liệu giảm xuống để thuật toán hội tụ nhanh hơn","Chuyển đổi dữ liệu từ dạng phi tuyến tính sang dạng tuyến tính","Tự động điền các giá trị thiếu trong toàn bộ tập dữ liệu"],"explain":"Mục đích chia dữ liệu là đánh giá khả năng tổng quát hóa của mô hình trên dữ liệu độc lập chưa từng thấy và phòng ngừa quá khớp."},{"id":"r-m1-036","module":"m1","ref":"1.10","type":"recall","kind":"manual","q":"Phương pháp Kiểm chéo K-lần (K-fold Cross Validation) hoạt động như thế nào?","correct":"Chia dữ liệu thành K phần, mỗi phần lần lượt làm tập kiểm tra trong khi các phần còn lại làm tập huấn luyện","wrong":["Chia dữ liệu thành K phần độc lập và huấn luyện K mô hình khác nhau không liên quan","Lặp lại việc huấn luyện K lần trên toàn bộ tập dữ liệu gốc mà không phân chia","Chọn ngẫu nhiên K điểm dữ liệu làm các tâm phân cụm đại diện"],"explain":"K-fold Cross Validation chia dữ liệu làm K phần (folds), luân phiên lấy 1 phần làm tập kiểm tra và K-1 phần còn lại làm tập huấn luyện."},{"id":"r-m1-037","module":"m1","ref":"1.10","type":"recall","kind":"manual","q":"Trong đoạn mã `cross_val_score(lr, X, y, cv=5)`, tham số `cv=5` biểu thị điều gì?","correct":"Số phần chia (folds) trong quy trình kiểm chéo là 5","wrong":["Tỷ lệ dữ liệu của tập kiểm tra là 5%","Số lượng đặc trưng đầu vào được lựa chọn là 5","Số vòng lặp tối đa của mô hình hồi quy là 5"],"explain":"Tham số `cv=5` chỉ định thực hiện kiểm chéo với 5 folds (K-fold cross validation với k=5)."},{"id":"r-m1-038","module":"m1","ref":"1.11","type":"recall","kind":"manual","q":"Trong Hồi quy Tuyến tính, khái niệm 'Phần dư (Residual)' được hiểu là gì?","correct":"Khoảng cách giữa giá trị thực tế và giá trị dự đoán của mô hình","wrong":["Tổng bình phương của tất cả các sai số trên tập huấn luyện","Khoảng cách giữa các quan sát và giá trị trung bình của biến độc lập","Tỷ lệ phương sai của biến mục tiêu được giải thích bởi mô hình"],"explain":"Phần dư (Residual) là độ lệch hay khoảng cách giữa giá trị thực tế quan sát được và giá trị do mô hình dự đoán ra."},{"id":"r-m1-039","module":"m1","ref":"1.11","type":"recall","kind":"manual","q":"Hàm mất mát (Cost Function) thường được sử dụng trong Hồi quy Tuyến tính để tìm đường khớp tối ưu là gì?","correct":"SSE (Sum of Squared Errors) nhằm cực tiểu hóa tổng bình phương phần dư","wrong":["Hinge Loss nhằm phạt các lỗi phân loại sai trên biên","Deviance (binomial log-likelihood) nhằm tối đa hóa độ hợp lý","Exponential Loss nhằm gán trọng số lũy thừa cho các mẫu sai"],"explain":"Hồi quy tuyến tính sử dụng SSE (Sum of Squared Errors) để cực tiểu hóa tổng bình phương của các phần dư."},{"id":"r-m1-040","module":"m1","ref":"1.11","type":"recall","kind":"manual","q":"Ý nghĩa của Hệ số xác định (R-squared / Coefficient of Determination) trong đánh giá mô hình hồi quy là gì?","correct":"Tỷ lệ phương sai của biến mục tiêu được giải thích bởi mô hình; giá trị càng gần 1 mô hình càng tốt","wrong":["Tổng độ lớn các phần dư tuyệt đối; giá trị càng lớn mô hình càng chính xác","Tỷ lệ giữa số mẫu phân loại đúng và tổng số mẫu trong ma trận nhầm lẫn","Độ dốc của siêu phẳng phân tách trong không gian đặc trưng nhiều chiều"],"explain":"R-squared biểu thị tỷ lệ phương sai của biến phụ thuộc được giải thích bởi các biến độc lập trong mô hình; càng gần 1 chứng tỏ mô hình khớp càng tốt."},{"id":"r-m1-041","module":"m1","ref":"1.11","type":"recall","kind":"manual","q":"Khi gọi lệnh `model.score(X_test, y_test)` với `model` là một đối tượng `LinearRegression`, kết quả nhận được là chỉ số nào?","correct":"Hệ số xác định R-squared (R^2)","wrong":["Tổng bình phương sai số SSE","Sai số tuyệt đối trung bình MAE","Độ chính xác phân loại Accuracy"],"explain":"Đối với mô hình `LinearRegression` trong scikit-learn, phương thức `.score()` tính và trả về chỉ số R-squared trên tập dữ liệu truyền vào."},{"id":"r-m1-042","module":"m1","ref":"1.12","type":"recall","kind":"manual","q":"Hồi quy Đa thức (Polynomial Regression) được sử dụng nhằm mục đích chính nào?","correct":"Nắm bắt các mối quan hệ phi tuyến tính bằng cách thêm các bậc cao của biến đặc trưng","wrong":["Ép các hệ số hồi quy không quan trọng về bằng 0 để chọn đặc trưng","Chuyển đổi bài toán hồi quy liên tục thành bài toán phân loại danh mục","Tạo thêm các mẫu giả lập cho lớp dữ liệu thiểu số"],"explain":"Polynomial Regression mở rộng hồi quy tuyến tính bằng cách đưa thêm các bậc lũy thừa cao hơn của đặc trưng để biểu diễn quan hệ phi tuyến."},{"id":"r-m1-043","module":"m1","ref":"1.12","type":"recall","kind":"manual","q":"Rủi ro chính khi tăng bậc đa thức (degree) lên quá cao trong Hồi quy Đa thức là gì?","correct":"Mô hình rất dễ dẫn đến hiện tượng quá khớp (Overfitting)","wrong":["Mô hình bị dưới khớp (Underfitting) do giả định quá đơn giản","Phương sai của mô hình giảm mạnh về mức bằng 0","Dữ liệu huấn luyện tự động bị chuẩn hóa về khoảng [0, 1]"],"explain":"Bậc càng cao mô hình càng uốn lượn để khớp sát tập huấn luyện, làm tăng phương sai và rất dễ dẫn đến Overfitting."},{"id":"r-m1-044","module":"m1","ref":"1.12","type":"recall","kind":"manual","q":"Trong scikit-learn, lớp nào được sử dụng để tạo ra các đặc trưng bậc cao cho mô hình Hồi quy Đa thức?","correct":"`PolynomialFeatures` từ thư viện `sklearn.preprocessing`","wrong":["`StandardScaler` từ thư viện `sklearn.preprocessing`","`LinearRegression` từ thư viện `sklearn.linear_model`","`DecisionTreeRegressor` từ thư viện `sklearn.tree`"],"explain":"Để tạo ra các đặc trưng bậc 2, bậc 3..., ta sử dụng `PolynomialFeatures(degree=...)` trong `sklearn.preprocessing`."},{"id":"r-m1-045","module":"m1","ref":"1.13","type":"recall","kind":"manual","q":"Mục đích cơ bản của kỹ thuật Điều chuẩn (Regularization) trong học máy là gì?","correct":"Giúp giảm phương sai (Variance) bằng cách phạt các hệ số hồi quy lớn, ép chúng nhỏ lại hoặc bằng 0","wrong":["Giúp giảm độ chệch (Bias) bằng cách tăng vô hạn số lượng đặc trưng đa thức","Tự động loại bỏ tất cả các hàng dữ liệu có chứa giá trị ngoại lai","Tối ưu hóa tốc độ huấn luyện mô hình bằng cách song song hóa các luồng xử lý"],"explain":"Regularization phạt các hệ số lớn trong hàm mất mát, giúp kiềm chế độ phức tạp của mô hình để giảm Variance và hạn chế Overfitting."},{"id":"r-m1-046","module":"m1","ref":"1.13","type":"recall","kind":"manual","q":"Phương pháp điều chuẩn LASSO (L1) có đặc điểm nổi bật nào so với Ridge (L2)?","correct":"Phạt tổng trị tuyệt đối hệ số và có khả năng triệt tiêu hệ số về 0, hỗ trợ lựa chọn đặc trưng (Feature Selection)","wrong":["Phạt tổng bình phương hệ số và không bao giờ triệt tiêu hệ số về 0","Luôn kết hợp cả hai hình thức phạt L1 và L2 cùng lúc","Không yêu cầu chuẩn hóa thang đo dữ liệu trước khi huấn luyện"],"explain":"LASSO (L1) sử dụng hình thức phạt theo tổng trị tuyệt đối các hệ số, có khả năng ép các hệ số không quan trọng về đúng bằng 0 (hỗ trợ Feature Selection)."},{"id":"r-m1-047","module":"m1","ref":"1.13","type":"recall","kind":"manual","q":"Đặc điểm chính của phương pháp hồi quy Ridge (L2) là gì?","correct":"Phạt theo tổng bình phương hệ số, giúp giảm kích thước hệ số nhưng không triệt tiêu về 0","wrong":["Phạt theo tổng trị tuyệt đối hệ số, giúp triệt tiêu hoàn toàn hệ số về 0","Tự động gán nhãn cho các điểm dữ liệu thiếu trước khi huấn luyện","Chỉ sử dụng được khi các biến đặc trưng hoàn toàn không có tương quan"],"explain":"Ridge (L2) phạt tổng bình phương hệ số, làm co nhỏ các hệ số lại để giảm Overfitting nhưng không đưa hệ số về 0 tuyệt đối."},{"id":"r-m1-048","module":"m1","ref":"1.13","type":"recall","kind":"manual","q":"Phương pháp điều chuẩn Elastic Net được khuyến nghị sử dụng trong trường hợp nào?","correct":"Khi tập dữ liệu có nhiều biến đặc trưng tương quan mạnh với nhau","wrong":["Khi tất cả các biến đặc trưng đều hoàn toàn độc lập và không tương quan","Khi tập dữ liệu chỉ có một biến giải thích duy nhất và không có nhiễu","Khi bài toán yêu cầu chuyển đổi dữ liệu thành các cụm phân cấp"],"explain":"Elastic Net kết hợp hình phạt L1 và L2, rất hữu ích khi dữ liệu có nhiều đặc trưng tương quan (collinear) với nhau."},{"id":"r-m1-049","module":"m1","ref":"1.13","type":"recall","kind":"manual","q":"Tại sao luôn cần thực hiện Scaling (ví dụ StandardScaler) trước khi áp dụng kỹ thuật Regularization?","correct":"Để các hệ số có cùng đơn vị đo, đảm bảo hình phạt được áp dụng công bằng lên mọi đặc trưng","wrong":["Để biến đổi toàn bộ nhãn mục tiêu về phân phối chuẩn có trung bình bằng 0","Để biến đổi các bài toán hồi quy phi tuyến tính thành bài toán phân loại","Để loại bỏ hoàn toàn hiện tượng đa cộng tuyến giữa các biến độc lập"],"explain":"Nếu không Scaling, các đặc trưng có thang đo lớn sẽ có hệ số nhỏ và ít bị phạt hơn, trong khi đặc trưng có thang đo nhỏ sẽ bị phạt nặng bất hợp lý."},{"id":"r-m2-001","module":"m2","ref":"2.1","type":"recall","kind":"manual","q":"Hồi quy Logistic (Logistic Regression) sử dụng hàm toán học nào để chuyển đổi giá trị đầu ra về khoảng xác suất từ 0 đến 1?","correct":"Hàm Sigmoid","wrong":["Hàm Hinge Loss","Hàm Softmax đa biến","Hàm mất mát SSE"],"explain":"Logistic Regression sử dụng hàm Sigmoid để ánh xạ giá trị đầu ra thành xác suất trong khoảng từ 0 đến 1.","tip":"Logistic Regression gắn liền với hàm kích hoạt Sigmoid."},{"id":"r-m2-002","module":"m2","ref":"2.1","type":"recall","kind":"manual","q":"Điểm phân biệt cơ bản giữa bài toán Hồi quy (Regression) và Phân loại (Classification) là gì?","correct":"Hồi quy dự đoán kết quả là một giá trị số liên tục, còn phân loại dự đoán danh mục hoặc nhãn rời rạc","wrong":["Hồi quy chỉ áp dụng khi dữ liệu có ít hơn 100 mẫu, còn phân loại áp dụng cho dữ liệu lớn","Hồi quy sử dụng mô hình học không giám sát, còn phân loại dùng mô hình học có giám sát","Hồi quy bắt buộc phải dùng hàm kernel RBF, còn phân loại chỉ dùng siêu phẳng tuyến tính"],"explain":"Hồi quy dự đoán giá trị liên tục (như giá nhà, doanh thu), còn Phân loại dự đoán nhãn rời rạc (như gian lận/hợp lệ, spam/not spam)."},{"id":"r-m2-003","module":"m2","ref":"2.1","type":"recall","kind":"manual","q":"Ưu điểm nổi bật của mô hình Hồi quy Logistic là gì?","correct":"Có tính diễn giải cao, giúp hiểu rõ tầm quan trọng và mức độ tác động của từng yếu tố","wrong":["Có khả năng tự động học các đặc trưng phi tuyến tính phức tạp như mạng nơ-ron sâu","Hoàn toàn không bị ảnh hưởng bởi thang đo của các biến đặc trưng đầu vào","Tự động triệt tiêu hoàn toàn sai số phân loại trên tập kiểm tra về 0"],"explain":"Hồi quy Logistic có cấu trúc tường minh với tính diễn giải cao, cho phép đánh giá trọng số và tầm ảnh hưởng của từng đặc trưng."},{"id":"r-m2-004","module":"m2","ref":"2.1","type":"recall","kind":"manual","q":"Trong khai báo `LogisticRegression(penalty='l2', C=10.0)`, tham số `penalty='l2'` thể hiện điều gì?","correct":"Sử dụng hình thức phạt điều chuẩn L2 (tổng bình phương các hệ số)","wrong":["Sử dụng khoảng cách Manhattan L1 để đo độ tương đồng","Giới hạn số lượng lớp phân loại tối đa là 2 lớp nhị phân","Chỉ định độ sâu tối đa của mô hình phân loại là 2 tầng"],"explain":"Tham số `penalty='l2'` kích hoạt kỹ thuật điều chuẩn Ridge (L2) nhằm kiểm soát độ lớn của các hệ số hồi quy."},{"id":"r-m2-005","module":"m2","ref":"2.2","type":"recall","kind":"manual","q":"Trong Ma trận nhầm lẫn (Confusion Matrix), trường hợp một mẫu thực tế là Dương tính (Actual Positive) nhưng mô hình lại dự đoán là Âm tính (Predicted Negative) được gọi là gì?","correct":"False Negative (FN) - Sai lầm loại II","wrong":["False Positive (FP) - Sai lầm loại I","True Positive (TP)","True Negative (TN)"],"explain":"Thực tế Dương tính nhưng dự đoán Âm tính là bỏ sót ca dương tính, gọi là False Negative (FN), tương ứng với Sai lầm loại II."},{"id":"r-m2-006","module":"m2","ref":"2.2","type":"recall","kind":"manual","q":"Trường hợp mẫu thực tế là Âm tính (Actual Negative) nhưng mô hình lại dự đoán là Dương tính (Predicted Positive) tương ứng với khái niệm nào?","correct":"False Positive (FP) - Sai lầm loại I","wrong":["False Negative (FN) - Sai lầm loại II","True Positive (TP)","True Negative (TN)"],"explain":"Thực tế Âm tính nhưng dự đoán Dương tính là báo động giả, tức False Positive (FP) hay Sai lầm loại I."},{"id":"r-m2-007","module":"m2","ref":"2.2","type":"recall","kind":"manual","q":"Chỉ số Recall (Độ nhạy / Sensitivity) trong bài toán phân loại đo lường điều gì?","correct":"Tỷ lệ mẫu dương tính được nhận diện đúng trong tổng số các mẫu thực tế dương tính","wrong":["Tỷ lệ mẫu thực sự dương tính trong tổng số các mẫu mà mô hình dự đoán là dương tính","Tỷ lệ tổng số mẫu dự đoán đúng (cả âm tính và dương tính) trên toàn bộ tập dữ liệu","Khả năng tránh báo động giả trên các mẫu thực tế âm tính"],"explain":"Recall đo lường tỷ lệ bao phủ các mẫu thực tế mang nhãn dương tính: TP / (TP + FN)."},{"id":"r-m2-008","module":"m2","ref":"2.2","type":"recall","kind":"manual","q":"Chỉ số Precision (Độ chính xác dự đoán) phản ánh điều gì?","correct":"Tỷ lệ thực sự dương tính trong các mẫu mà mô hình dự đoán là dương tính","wrong":["Tỷ lệ các mẫu âm tính được nhận diện đúng trên tổng số mẫu thực tế âm tính","Tổng số dự đoán đúng của cả lớp dương tính và lớp âm tính chia cho tổng số mẫu","Diện tích nằm dưới đường cong hiệu năng biểu diễn tỷ lệ TPR so với FPR"],"explain":"Precision đo mức độ tin cậy của các cảnh báo dương tính: TP / (TP + FP)."},{"id":"r-m2-009","module":"m2","ref":"2.2","type":"recall","kind":"manual","q":"Đường cong ROC (ROC Curve) biểu diễn mối quan hệ giữa hai đại lượng nào?","correct":"True Positive Rate (TPR) và False Positive Rate (FPR)","wrong":["Precision và Recall","Accuracy và F1-Score","Bias và Variance"],"explain":"ROC Curve vẽ đồ thị thể hiện sự đánh đổi giữa True Positive Rate (trục tung) và False Positive Rate (trục hoành)."},{"id":"r-m2-010","module":"m2","ref":"2.3","type":"recall","kind":"manual","q":"Hai đặc điểm lý thuyết cơ bản nhất của thuật toán K-Láng giềng gần nhất (KNN) là gì?","correct":"Phi tham số (Non-parametric) và Học lười (Lazy learner)","wrong":["Có tham số (Parametric) và Học tích cực (Eager learner)","Tham lam (Greedy) và Tự động trích xuất đặc trưng (Feature extraction)","Phân cấp từ dưới lên (Bottom-up) và Tối ưu hàm mục tiêu toàn cục"],"explain":"KNN là mô hình Non-parametric (không giả định phân phối dữ liệu) và Lazy learner (chỉ lưu trữ dữ liệu, đến lúc dự đoán mới tính toán)."},{"id":"r-m2-011","module":"m2","ref":"2.3","type":"recall","kind":"manual","q":"Tại sao việc Chuẩn hóa đặc trưng (Feature Scaling) lại đặc biệt quan trọng đối với thuật toán KNN?","correct":"Vì KNN dựa trên các phép đo khoảng cách (như Euclidean), nên biến có biên độ lớn sẽ chi phối toàn bộ kết quả","wrong":["Vì KNN yêu cầu tất cả các biến đầu vào phải có phân phối chuẩn tắc với mean=0 và std=1","Vì nếu không chuẩn hóa, thuật toán không thể tính được hàm mất mát Hinge Loss","Vì Feature Scaling giúp KNN chuyển đổi từ thuật toán phân loại sang thuật toán hồi quy"],"explain":"KNN tính khoảng cách giữa các điểm dữ liệu; nếu không chuẩn hóa thang đo, đặc trưng có khoảng giá trị lớn sẽ lấn át hoàn toàn các đặc trưng khác."},{"id":"r-m2-012","module":"m2","ref":"2.3","type":"recall","kind":"manual","q":"Để chọn giá trị K tối ưu trong thuật toán KNN, người ta thường áp dụng phương pháp nào trên biểu đồ tỷ lệ lỗi?","correct":"Phương pháp Điểm khuỷu tay (Elbow Method)","wrong":["Biểu đồ phân nhánh Dendrogram","Khoảng cách Cosine cực tiểu","Phương pháp lấy mẫu lại SMOTE"],"explain":"Giá trị K tốt nhất thường nằm ở điểm khuỷu tay (Elbow point) trên biểu đồ tỷ lệ lỗi theo K, nơi lỗi bắt đầu chững lại."},{"id":"r-m2-013","module":"m2","ref":"2.3","type":"recall","kind":"manual","q":"Quy trình dự đoán nhãn cho một điểm dữ liệu mới của thuật toán KNN diễn ra như thế nào?","correct":"Tính khoảng cách tới mọi điểm, chọn K điểm gần nhất và gán nhãn theo đa số lớp trong K điểm đó","wrong":["Tìm nghiệm tối ưu của siêu phẳng bằng cách cực tiểu hóa tổng bình phương sai số phần dư","Ánh xạ điểm dữ liệu sang không gian vô hạn chiều rồi dùng hàm Sigmoid để tính xác suất","Duyệt qua các nhánh rẽ từ gốc đến lá theo tiêu chí giảm độ vẩn đục Entropy nhiều nhất"],"explain":"KNN tính khoảng cách từ điểm mới tới tất cả các điểm đã lưu, lấy ra K điểm gần nhất và bỏ phiếu đa số để gán nhãn."},{"id":"r-m2-014","module":"m2","ref":"2.3","type":"recall","kind":"manual","q":"Khi so sánh quá trình Huấn luyện (Fit) giữa Hồi quy Tuyến tính và KNN, nhận định nào sau đây là chính xác?","correct":"Hồi quy Tuyến tính huấn luyện chậm do phải tối thiểu hóa hàm chi phí, còn KNN huấn luyện rất nhanh vì chỉ cần lưu trữ dữ liệu","wrong":["Hồi quy Tuyến tính huấn luyện nhanh vì không có tham số, còn KNN huấn luyện chậm do tìm kiếm láng giềng","Cả hai mô hình đều huấn luyện với tốc độ như nhau do cùng sử dụng thuật toán lan truyền ngược","KNN huấn luyện chậm vì phải xây dựng ma trận trọng số tối ưu trước khi nhận dữ liệu mới"],"explain":"KNN là Lazy learner nên giai đoạn Fit chỉ là lưu trữ dữ liệu huấn luyện (rất nhanh); ngược lại Linear Regression phải giải bài toán tối ưu tìm trọng số."},{"id":"r-m2-015","module":"m2","ref":"2.3","type":"recall","kind":"manual","q":"Về giai đoạn Dự đoán (Prediction) và Tiêu tốn bộ nhớ, KNN có nhược điểm gì so với Hồi quy Tuyến tính?","correct":"KNN dự đoán chậm (phải tìm láng giềng gần nhất) và tốn bộ nhớ (phải lưu toàn bộ tập huấn luyện)","wrong":["KNN dự đoán rất nhanh nhưng chiếm ít bộ nhớ hơn do chỉ lưu một vài trọng số cơ bản","KNN không thể thực hiện dự đoán nếu tập kiểm tra có nhiều hơn 3 thuộc tính","KNN bắt buộc phải giải hệ phương trình đạo hàm bậc hai tại mỗi bước dự đoán"],"explain":"KNN tốn bộ nhớ vì phải lưu toàn bộ dữ liệu mẫu, và dự đoán chậm vì phải tính khoảng cách từ điểm mới tới toàn bộ dữ liệu."},{"id":"r-m2-016","module":"m2","ref":"2.4","type":"recall","kind":"manual","q":"Mục tiêu chính của thuật toán Máy vectơ hỗ trợ (Support Vector Machines - SVM) là gì?","correct":"Tìm một siêu phẳng (hyperplane) phân tách các lớp sao cho khoảng cách (margin) giữa các lớp là lớn nhất","wrong":["Tối đa hóa diện tích dưới đường cong ROC bằng cách ước lượng xác suất phân phối chuẩn","Gom cụm các điểm dữ liệu dựa trên tiêu chí cực tiểu hóa độ vẩn đục Gini Index","Tạo ra các cây quyết định độc lập trên các tập con ngẫu nhiên có thay thế"],"explain":"Mục tiêu cốt lõi của SVM là tìm một siêu phẳng tối ưu phân tách các lớp sao cho khoảng cách biên (margin) giữa hai lớp là lớn nhất."},{"id":"r-m2-017","module":"m2","ref":"2.4","type":"recall","kind":"manual","q":"Các 'Vectơ hỗ trợ' (Support Vectors) trong mô hình SVM có vai trò then chốt gì?","correct":"Là các điểm dữ liệu nằm gần bề mặt quyết định nhất và có tác động trực tiếp đến vị trí tối ưu của siêu phẳng","wrong":["Là các điểm ngoại lai nằm xa nhất khỏi đám mây dữ liệu cần được thuật toán loại bỏ","Là các vectơ biểu diễn trung bình tọa độ của tất cả các điểm trong cùng một cụm","Là các trọng số điều chuẩn được gán cho mô hình sau khi kết thúc quá trình fit"],"explain":"Support Vectors là những điểm dữ liệu nằm sát ranh giới quyết định nhất, quyết định trực tiếp tới vị trí và hướng của siêu phẳng phân tách."},{"id":"r-m2-018","module":"m2","ref":"2.4","type":"recall","kind":"manual","q":"Điểm khác biệt về hàm mất mát giữa SVM và Hồi quy Logistic là gì?","correct":"SVM sử dụng hàm Hinge Loss để phạt lỗi phân loại sai, trong khi Logistic Regression dùng hàm mất mát tiệm cận giảm dần về 0","wrong":["SVM sử dụng hàm mất mát bình phương tối thiểu SSE, còn Logistic Regression dùng hàm Deviance","SVM sử dụng hàm mất mát hàm mũ Exponential Loss, còn Logistic Regression dùng Hinge Loss","Cả hai mô hình đều dùng chung hàm Hinge Loss nhưng SVM không có tham số điều chuẩn C"],"explain":"Hồi quy Logistic có hàm mất mát giảm dần về 0 nhưng hiếm khi triệt tiêu hoàn toàn, còn SVM sử dụng Hinge Loss để phạt trực tiếp các lỗi vi phạm ranh giới."},{"id":"r-m2-019","module":"m2","ref":"2.4","type":"recall","kind":"manual","q":"Việc sử dụng hàm mất mát Hinge Loss mang lại ưu và nhược điểm gì cho SVM so với Hồi quy Logistic?","correct":"Độ chính xác phân loại tốt hơn nhưng ít nhạy cảm hơn đối với việc ước lượng xác suất dự đoán","wrong":["Tăng tốc độ dự đoán lên gấp nhiều lần nhưng đòi hỏi dung lượng bộ nhớ lớn hơn","Tính được chính xác xác suất phần trăm đầu ra nhưng dễ bị ảnh hưởng bởi đa cộng tuyến","Loại bỏ hoàn toàn tính phụ thuộc vào siêu tham số điều chuẩn C"],"explain":"Hinge Loss tập trung tối đa vào việc phân tách đúng các lớp sát
