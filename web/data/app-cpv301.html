ểm là các phép toán xử lý ảnh trên từng điểm ảnh độc lập <b>(pixel-by-pixel)</b>. Giá trị của điểm ảnh đầu ra tại tọa độ (x, y) chỉ phụ thuộc vào chính giá trị điểm ảnh đầu vào tại vị trí đó hoặc thông qua một ánh xạ hàm số, không phụ thuộc vào các điểm lân cận.</p><h4>Các phép toán tuyến tính và phi tuyến tính cơ bản</h4><ul><li>Hàm biến đổi tuyến tính (Gain &amp; Bias): Được biểu diễn qua phương trình g(x,y) = a * f(x,y) + b. Trong đó, hệ số tỷ lệ a (Gain) kiểm soát độ tương phản (contrast), và hệ số cộng b (Bias) kiểm soát độ sáng (brightness) của bức ảnh.</li><li>Phép trộn ảnh tuyến tính (Linear Blend / Dyadic Operator): Phép toán nhận hai bức ảnh đầu vào và thực hiện tổ hợp tuyến tính theo trọng số alpha: g(x,y) = (1 - alpha) * f0(x,y) + alpha * f1(x,y). Ứng dụng phổ biến trong kỹ thuật chồng mờ ảnh (cross-fading) và hiệu ứng alpha blending.</li></ul><h4>Các phép toán dựa trên Lược đồ xám (Histogram-based Operations)</h4><table><tr><th><div>Phép toán</div></th><th><div>Mục tiêu &amp; Cơ chế hoạt động</div><div> </div></th></tr><tr><td><div><b>Cân bằng lược đồ xám (Histogram Equalization)</b></div></td><td><div>Tăng cường độ tương phản toàn cục bằng cách dàn đều các giá trị cường độ sáng hẹp tập trung sang toàn dải phổ từ 0 đến 255. Quá trình này chuẩn hóa giá trị mức xám dựa trên hàm phân phối tích lũy (CDF) để ảnh không bị ảnh hưởng quá nhiều bởi sự thay đổi đột ngột của điều kiện chiếu sáng.</div></td></tr><tr><td><div><b>Phân ngưỡng (Thresholding)</b></div></td><td><div>Chuyển đổi ảnh xám thành ảnh nhị phân (chỉ gồm 0 và 255). Nếu cường độ điểm ảnh nhỏ hơn ngưỡng T thì gán bằng 0 (đen), ngược lại gán bằng 255 (trắng).</div></td></tr><tr><td><div><b>Kéo giãn tương phản (Contrast Stretching)</b></div></td><td><div>Tự động co giãn dải giá trị pixel hiện tại sang dải động tối đa cho phép (0-255) nhằm cải thiện các bức ảnh bị mờ hoặc thiếu sáng trầm trọng.</div></td></tr></table><h4>DEMO</h4><p><b>Ví dụ:</b> Làm sáng một bức ảnh tối bằng cách tăng Bias, và làm rõ nét chi tiết bằng cách tăng Gain.</p><table><tr><th><div><code>import</code><code> cv2<br></code><code>import</code><code> numpy </code><code>as</code><code> np<br><br></code><code># Đọc ảnh gốc ở dạng ảnh xám</code><code><br>img = cv2.imread(</code><code>'input.jpg'</code><code>, cv2.IMREAD_GRAYSCALE)<br><br></code><code># 1. Điều chỉnh Gain (a=1.5) và Bias (b=30)</code><code><br>adjusted_img = cv2.convertScaleAbs(img, alpha=</code><code>1.5</code><code>, beta=</code><code>30</code><code>)<br><br></code><code># 2. Cân bằng lược đồ xám (Histogram Equalization)</code><code><br>equalized_img = cv2.equalizeHist(img)<br><br></code><code># 3. Phân ngưỡng nhị phân với T = 127</code><code><br>_, thresholded_img = cv2.threshold(img, </code><code>127</code><code>, </code><code>255</code><code>, cv2.THRESH_BINARY)</code></div></th></tr></table>"},{"id":"2.3","t":"Lọc tuyến tính và Phi tuyến tính (Linear & Non-linear Filtering)","h":"<p>Kỹ thuật lọc ảnh là các thao tác dựa trên vùng lân cận (neighborhood operations). Giá trị của điểm ảnh đầu ra được quyết định bởi việc áp dụng một thuật toán/mặt nạ lên các điểm ảnh xung quanh điểm ảnh mục tiêu.</p><h4>Lọc tuyến tính (Linear Filtering)</h4><p>Giá trị điểm ảnh đầu ra là một tổ hợp tuyến tính của các điểm ảnh trong vùng lân cận kết hợp với hệ số của bộ lọc (kernel). Phép toán này được thực hiện qua hai cơ chế tương tự nhau:</p><ul><li>Tương quan (Correlation): Di chuyển mặt nạ lọc qua từng pixel và tính tổng tích chập trực tiếp giữa hệ số bộ lọc và giá trị ảnh vùng tương ứng.</li><li>Tích chập (Convolution): Giống như tương quan nhưng hạt nhân bộ lọc (kernel) được lật ngược theo cả chiều ngang và chiều dọc trước khi thực hiện tính toán nhân tổng.</li></ul><h4>Các bộ lọc thông dụng</h4><ul><li>Bộ lọc trung bình (Mean Filter): Thay thế pixel trung tâm bằng giá trị trung bình của vùng lân cận. Có tác dụng làm mịn, mờ ảnh nhưng làm nhòe các đường biên cạnh.</li><li>Bộ lọc Gaussian (Gaussian Smoothing): Sử dụng hàm phân phối Gaussian để tính trọng số cho kernel. Các điểm ở gần tâm có trọng số cao hơn các điểm ở xa, giúp làm mờ ảnh một cách tự nhiên hơn.</li><li>Bộ lọc trung vị (Median Filter - Phi tuyến tính): Sắp xếp tất cả các giá trị pixel trong cửa sổ lọc theo thứ tự tăng dần rồi lấy giá trị ở giữa (trung vị) thay cho pixel trung tâm. Đây là giải pháp hoàn hảo để loại bỏ nhiễu hạt tiêu (Salt and Pepper noise) mà vẫn giữ lại được độ sắc nét của biên cạnh.</li><li>Bộ lọc song phương (Bilateral Filter - Phi tuyến tính): Kết hợp cả khoảng cách không gian lẫn sự sai khác về cường độ màu sắc/độ sáng khi tính trọng số. Nhờ vậy, bộ lọc này có khả năng làm mịn các vùng phẳng nhưng bảo toàn cực tốt các đường biên có độ tương phản cao.</li></ul><h4>Xử lý biên ảnh (Border Handling)</h4><p>Khi đặt kernel ở các pixel cạnh biên, vùng lân cận sẽ bị tràn ra ngoài ma trận ảnh. Các phương pháp xử lý phổ biến bao gồm: Giữ nguyên giá trị biên không lọc, sao chép kéo dài giá trị biên ra ngoài (replicate), hoặc chèn thêm các dải pixel có giá trị bằng 0 (zero padding).</p><h4>DEMO</h4><p><b>Ví dụ:</b> Khử nhiễu muối tiêu bằng bộ lọc trung vị và làm mịn ảnh giữ biên bằng bộ lọc song phương.</p><table><tr><th><div><code># Áp dụng bộ lọc Gaussian làm mịn ảnh, kích thước kernel 5x5</code><code><br>gaussian_blur = cv2.GaussianBlur(img, (</code><code>5</code><code>, </code><code>5</code><code>), </code><code>0</code><code>)<br><br></code><code># Áp dụng bộ lọc trung vị để khử nhiễu hạt tiêu, kích thước cửa sổ là 5</code><code><br>median_blur = cv2.medianBlur(img, </code><code>5</code><code>)<br><br></code><code># Áp dụng bộ lọc song phương bảo toàn cạnh biên</code><code><br>bilateral_filtered = cv2.bilateralFilter(img, d=</code><code>9</code><code>, sigmaColor=</code><code>75</code><code>, sigmaSpace=</code><code>75</code><code>)</code></div></th></tr></table>"},{"id":"2.4","t":"Biến đổi Fourier trong Xử lý Ảnh (Fourier Transforms)","h":"<p>Biến đổi Fourier là một công cụ toán học mạnh mẽ giúp chuyển đổi một bức ảnh từ không gian không gian (Spatial Domain - ma trận pixel thông thường) sang không gian tần số (Frequency Domain). Bản chất lý thuyết khẳng định rằng mọi tín hiệu phức tạp hoặc dạng sóng đều có thể phân tách thành tổng của các hàm tuần hoàn sin và cosin với các tần số, biên độ và pha khác nhau.</p><h4>Đặc trưng không gian tần số của Ảnh 2D</h4><ul><li>Tần số thấp (Low Frequencies): Đại diện cho các vùng cấu trúc lớn, các vùng có cường độ sáng thay đổi chậm hoặc các bề mặt mịn màng trong bức ảnh (ví dụ: bầu trời, làn da phẳng).</li><li>Tần số cao (High Frequencies): Đại diện cho các chi tiết nhỏ, các vùng thay đổi cường độ sáng đột ngột, các đường biên cạnh (edges) hoặc nhiễu (noise).</li></ul><h4>Các cặp biến đổi Fourier kinh điển (Fourier Transform Pairs)</h4><table><tr><th><div>Tín hiệu ở miền Không gian</div></th><th><div>Tín hiệu tương ứng ở miền Tần số</div><div> </div></th></tr><tr><td><div>Xung đơn độc (Impulse response)</div></td><td><div>Hàm hằng số (Chứa tất cả các tần số với biên độ bằng nhau)</div></td></tr><tr><td><div>Bộ lọc hộp (Box filter / Moving average)</div></td><td><div>Hàm Sinc (Gây ra hiện tượng gợn sóng vòng vèo khi lọc)</div></td></tr><tr><td><div>Hàm Gaussian</div></td><td><div>Hàm Gaussian khác (Hàm Gaussian có đặc tính mượt mà ở cả hai miền)</div></td></tr></table><h4>Ứng dụng thực tế</h4><ul><li>Lọc ảnh (Image Filtering): Thiết kế bộ lọc thông thấp (Low-pass filter) để giữ lại tần số thấp giúp làm mờ nhiễu, hoặc bộ lọc thông cao (High-pass filter) để giữ lại tần số cao nhằm làm sắc nét các đường biên cạnh.</li><li>Nén ảnh (Image Compression): Cơ sở của thuật toán nén JPEG (sử dụng biến đổi Cosine rời rạc - DCT, một biến thể của Fourier). Phép nén tận dụng đặc điểm mắt người ít nhạy bén với sự thay đổi của tần số màu sắc cao để loại bỏ bớt dữ liệu mà không làm giảm chất lượng cảm nhận trực quan một cách rõ rệt.</li></ul><h4>DEMO</h4><p><b>Ví dụ:</b> Chuyển đổi một bức ảnh sang miền tần số để phân tích phổ biên độ của nó.</p><table><tr><th><div><code># Thực hiện biến đổi Fourier rời rạc 2D bằng NumPy</code><code><br>dft = np.fft.fft2(img)<br></code><code># Dịch chuyển thành phần tần số thấp (0,0) vào trung tâm ma trận</code><code><br>dft_shift = np.fft.fftshift(dft)<br><br></code><code># Tính toán phổ biên độ (Amplitude Spectrum) để hiển thị trực quan</code><code><br>magnitude_spectrum = </code><code>20</code><code> * np.log(np.abs(dft_shift) + </code><code>1</code><code>)<br>magnitude_spectrum = np.uint8(magnitude_spectrum)</code></div></th></tr></table>"},{"id":"2.5","t":"Phép biến đổi Hình học Nâng cao (Geometric Transformations cont.)","h":"<p>Khác với toán tử điểm thay đổi dải giá trị pixel (range), biến đổi hình học tác động trực tiếp lên miền tọa độ không gian (domain) theo công thức x' = h(x). Phép biến đổi được gọi là <b>có tham số (parametric)</b> khi toàn bộ hành vi của nó được kiểm soát hoàn toàn bởi một số lượng nhỏ các tham số cố định (thường biểu diễn bằng ma trận toàn cục như Affine hay Homography).</p><p><b>Mọi phép \"Parametric transformations\" đều là \"Transformations\". Nhưng có rất nhiều \"Transformations\" (như đổi màu ảnh, hay bóp méo lưới Mesh-based warping một cách tự do) thì hoàn toàn không phải là \"Parametric transformations\"</b></p><h4>Forward Warping vs. Inverse Warping</h4><ul><li>Biến đổi tiến (Forward Warping): Duyệt qua từng pixel x của ảnh gốc và tính toán vị trí mới x' trong ảnh đích dựa trên hàm số h(x). Nhược điểm lớn của phương pháp này là khi x' nhận giá trị số thực không nguyên, việc làm tròn tọa độ sẽ tạo ra các lỗ trống (holes) và vết nứt (cracks) cấu trúc dữ liệu trên ảnh đích, đặc biệt khi phóng to ảnh.</li><li>Biến đổi ngược (Inverse Warping): Duyệt qua từng pixel x' của ảnh đích và tìm ngược lại vị trí gốc tương ứng x = h_inverse(x') trên ảnh nguồn. Do tọa độ tính toán có thể rơi vào khoảng giữa các pixel gốc, kỹ thuật này bắt buộc phải sử dụng các thuật toán nội suy (Interpolation) như nội suy láng giềng gần nhất (Nearest Neighbor) hoặc nội suy song tuyến tính (Bilinear Interpolation). Phương pháp này giải quyết triệt để vấn đề lỗ trống.</li></ul><h4>Chống răng cưa và Các bộ lọc đồ họa nâng cao (Anti-aliasing & Graphics Filtering)</h4><ul><li>MIP-mapping: Kỹ thuật tạo sẵn một chuỗi các phiên bản ảnh thu nhỏ với nhiều mức độ phân giải giảm dần (chia đôi kích thước liên tiếp). Khi hiển thị vật thể ở khoảng cách xa, hệ thống tự động chọn mức MIP-map phù hợp để tránh hiện tượng răng cưa (aliasing) một cách hiệu quả và tiết kiệm tài nguyên.</li><li>Lọc bất đẳng hướng (Anisotropic Filtering): Cải tiến vượt bậc so với các bộ lọc thông thường bằng cách giảm độ nhòe và bảo toàn độ sắc nét, chi tiết của bề mặt vật liệu khi nhìn ở các góc nghiêng cực hạn (extreme viewing angles).</li><li>Biến đổi đa bước (Multi-pass Transforms): Giải pháp chia tách một phép biến đổi hình học 2D phức tạp thành một chuỗi các phép biến đổi 1D (resampling và shearing) nối tiếp nhau giúp tăng tối đa tốc độ tính toán của phần cứng.</li><li>Biến đổi dựa trên lưới (Mesh-based Warping): Kỹ thuật làm biến dạng ảnh dựa trên cấu trúc các điểm nút lưới, giúp xử lý các bề mặt ảnh cong, không phẳng hoặc mô phỏng các hiệu ứng uốn lượn tự do tùy ý.</li></ul><p>Feature, Edge, and Line Detection</p>"}]},{"id":"m3","short":"C3","title":"Trích xuất Đặc trưng, Phát hiện Biên và Đường (Feature, Edge, and Line Detection)","color":"#d6336c","weight":54,"priority":3,"keyPoints":[],"sections":[{"id":"3.1","t":"Tổng quan","h":"<p>Các nội dung trong phần này là: Points and Patches (Điểm và vùng), Edges (Biên), và Lines (Đường thẳng).</p>"},{"id":"3.2","t":"Đặc trưng, Điểm và Vùng lân cận (Points, Patches and Features)","h":"<h4>Khái niệm Cơ bản</h4><ul><li>Feature (Đặc trưng): Là một phần thông tin nổi bật và có ý nghĩa về nội dung của bức ảnh (như một điểm, một góc, một đường biên hay một đối tượng).</li><li>Image Patch: Một nhóm các điểm ảnh lân cận xung quanh một điểm, dùng để so sánh sự tương đồng giữa các ảnh.</li><li>Feature extraction (Trích xuất đặc trưng): Quá trình giảm thiểu lượng dữ liệu lớn của bức ảnh thành một tập hợp các đặc trưng tiêu biểu.</li></ul><h4>Bộ phát hiện Đặc trưng (Feature Detectors)</h4><p>Mục tiêu là tìm ra các vị trí trên ảnh có thể dùng để đối chiếu (matching) một cách đáng tin cậy giữa nhiều ảnh khác nhau.</p><ul><li>Hàm Tự tương quan (Auto-correlation function): Đánh giá sự thay đổi cường độ sáng khi dịch chuyển một vùng patch đi một khoảng (u, v). Nếu sự thay đổi (E) lớn ở mọi hướng, đó là một góc (corner).</li><li>Harris Corner Detector: Thuật toán phổ biến để tìm góc. Thuật toán tính toán ma trận đạo hàm bậc nhất (Ix, Iy) và dựa vào các giá trị riêng (eigenvalues λ1, λ2) của ma trận M để phân loại:</li></ul><ul><li>Vùng phẳng (Flat): λ1 và λ2 đều nhỏ (R nhỏ).</li><li>Biên (Edge): λ1 &gt;&gt; λ2 hoặc ngược lại (R &lt; 0).</li><li>Góc (Corner): λ1 và λ2 đều lớn và xấp xỉ nhau (R lớn).</li></ul><ul><li>SIFT (Scale-Invariant Feature Transform): Thuật toán cực kỳ mạnh mẽ, bất biến với tỷ lệ (scale) và phép xoay. Các bước gồm: Tìm đỉnh trên không gian tỷ lệ (Scale-space peak selection) → Định vị Keypoint → Gán hướng (Orientation) → Tạo Vector mô tả (Descriptor) → Khớp.</li><li>Các thuật toán khác: SURF (nhanh hơn SIFT), FAST (cực nhanh cho góc), BRIEF (descriptor dạng chuỗi nhị phân tiết kiệm bộ nhớ), ORB (kết hợp FAST và BRIEF).</li></ul><h4>Bộ mô tả và Khớp Đặc trưng (Descriptors & Matching)</h4><ul><li>Feature Descriptors: Mã hóa thông tin vùng quanh điểm đặc trưng thành một vector số học (như một \"dấu vân tay\"). Ví dụ: SIFT descriptor, HOG (Histogram of Oriented Gradients).</li><li>Feature Matching: So sánh các vector để tìm ra cặp điểm tương đồng (dùng khoảng cách Euclid). Thường thiết lập một ngưỡng (threshold) để loại bỏ nhiễu. Sử dụng cấu trúc dữ liệu như k-d trees hoặc Hashing để tăng tốc độ tìm kiếm.</li></ul><h4>DEMO SIFT Feature Detection</h4><table><tr><th><div><code>import</code><code> cv2<br><br>img = cv2.imread(</code><code>'image.jpg'</code><code>)<br>gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)<br><br></code><code># Khởi tạo đối tượng SIFT</code><code><br>sift = cv2.SIFT_create()<br><br></code><code># Tìm keypoints và descriptors</code><code><br>kp, des = sift.detectAndCompute(gray, </code><code>None</code><code>)<br><br></code><code># Vẽ các điểm đặc trưng lên ảnh</code><code><br>img_kp = cv2.drawKeypoints(gray, kp, img)<br>cv2.imwrite(</code><code>'sift_keypoints.jpg'</code><code>, img_kp)</code></div></th></tr></table><p><code><br></code><b>2. Phát hiện Biên (Edge Detection)</b></p><h4>Định nghĩa Toán học của Biên</h4><p>Biên là khu vực có sự thay đổi (discontinuity) cục bộ đáng kể về cường độ sáng. Về mặt toán học, nó được biểu diễn qua <b>Gradient</b> (Đạo hàm của hàm cường độ ảnh):</p><ul><li>Độ lớn (Magnitude): <span class=\"mj\" data-tex=\"\\lVert \\nabla f \\rVert = \\sqrt{\\left(\\dfrac{\\partial f}{\\partial x}\\right)^2 + \\left(\\dfrac{\\partial f}{\\partial y}\\right)^2}\">\\lVert \\nabla f \\rVert = \\sqrt{\\left(\\dfrac{\\partial f}{\\partial x}\\right)^2 + \\left(\\dfrac{\\partial f}{\\partial y}\\right)^2}</span> (Xác định độ rõ nét của biên).</li><li>Hướng (Direction): <span class=\"mj\" data-tex=\"\\theta = \\tan^{-1}\\!\\left(\\dfrac{\\partial f / \\partial y}{\\partial f / \\partial x}\\right)\">\\theta = \\tan^{-1}\\!\\left(\\dfrac{\\partial f / \\partial y}{\\partial f / \\partial x}\\right)</span> (Vuông góc với hướng của đường biên).</li></ul><p><b>4 Bước Phát hiện Biên:</b> Lọc nhiễu (Filtering) → Tăng cường chi tiết (Enhancement) → Phân ngưỡng phát hiện (Detection/Thresholding) → Định vị chính xác (Localization).</p><h4>Các Toán tử Phát hiện Biên</h4><table><tr><th><div>Toán tử</div></th><th><div>Loại</div></th><th><div>Đặc điểm &amp; Ưu/Nhược điểm</div><div> </div></th></tr><tr><td><div><b>Sobel</b></div></td><td><div>Gradient (Bậc 1)</div></td><td><div>Dùng 2 kernel 3x3 (Gx, Gy). Tính toán nhanh, mượt. Tuy nhiên nhạy cảm với nhiễu và độ chính xác vị trí không quá cao.</div></td></tr><tr><td><div><b>Prewitt</b></div></td><td><div>Gradient (Bậc 1)</div></td><td><div>Tương tự Sobel nhưng trọng số cố định (các số 1). Tốt cho việc tìm hướng ưu tiên nhưng kém ở các đường chéo.</div></td></tr><tr><td><div><b>Robert</b></div></td><td><div>Gradient (Bậc 1)</div></td><td><div>Kernel chéo 2x2. Rất nhạy với nhiễu, kém chính xác.</div></td></tr><tr><td><div><b>LoG (Laplacian of Gaussian)</b></div></td><td><div>Gaussian (Bậc 2)</div></td><td><div>Dùng đạo hàm bậc 2 (tìm điểm Zero-crossing). Kết hợp Gaussian để lọc nhiễu. Tuy nhiên vẫn nhạy nhiễu và dễ sai lệch ở các góc cong.</div></td></tr><tr><td><div><b>Canny</b></div></td><td><div>Gaussian (Tối ưu)</div></td><td><div>Được xem là chuẩn mực tối ưu nhất. Ít nhạy nhiễu, định vị biên cực tốt và chỉ trả về 1 đường biên mỏng duy nhất (dùng thuật toán triệt tiêu phi cực đại và phân ngưỡng kép). Tốn kém tính toán hơn.</div></td></tr></table><h4>DEMO Canny Edge Detection</h4><table><tr><th><div><code>import</code><code> cv2<br><br>img = cv2.imread(</code><code>'image.jpg'</code><code>, cv2.IMREAD_GRAYSCALE)<br><br></code><code># Xóa nhiễu bằng Gaussian Blur trước</code><code><br>blurred = cv2.GaussianBlur(img, (</code><code>5</code><code>, </code><code>5</code><code>), </code><code>0</code><code>)<br><br></code><code># Áp dụng thuật toán Canny (ngưỡng dưới = 50, ngưỡng trên = 150)</code><code><br>edges = cv2.Canny(blurred, </code><code>50</code><code>, </code><code>150</code><code>)<br></code></div></th></tr></table>"},{"id":"3.3","t":"Phát hiện Đường thẳng (Line Detection)","h":"<h4>Quy trình và Hough Transform</h4><p>Mục tiêu là kết nối tập hợp các điểm biên (edge points) thành các đường thẳng có ý nghĩa. Quy trình chuẩn: Tiền xử lý (Blur) → Canny (Tìm biên) → Lọc vùng quan tâm (Masking ROI) → <b>Hough Transform</b>.</p><p><b>Biến đổi Hough (Hough Transform):</b></p><ul><li>Biểu diễn đường thẳng bằng phương trình tọa độ cực: d = x*cos(θ) + y*sin(θ). Trong đó d là khoảng cách từ gốc tọa độ đến đường thẳng, và θ là góc pháp tuyến.</li><li>Mỗi điểm ảnh (x, y) trên không gian thực sẽ tạo thành một đường cong hình sin trong không gian tham số (Hough space).</li><li>Hệ thống \"bỏ phiếu\" (voting): Giao điểm của nhiều đường cong trong không gian Hough (nơi có giá trị tích lũy/bin cao nhất) chính là đại diện cho một đường thẳng đi qua các điểm đó trên ảnh thực.</li></ul><h4>Kỹ thuật dựa trên Tích chập (Convolution-based)</h4><p>Dùng các mặt nạ (masks) cụ thể để tìm các đường có độ dày cố định (ví dụ mỏng 1 pixel):</p><ul><li>Mặt nạ ngang (Horizontal mask): Trọng số cao ở hàng giữa.</li><li>Mặt nạ dọc (Vertical mask): Trọng số cao ở cột giữa.</li><li>Mặt nạ chéo ±45 độ.</li></ul><p>Dựa vào độ phản hồi (response) của từng mặt nạ để quyết định pixel đó thuộc đường thẳng hướng nào.</p><h4>DEMO Hough Line Transform</h4><table><tr><th><div><code>import</code><code> cv2<br></code><code>import</code><code> numpy </code><code>as</code><code> np<br><br>img = cv2.imread(</code><code>'road.jpg'</code><code>)<br>gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)<br>edges = cv2.Canny(gray, </code><code>50</code><code>, </code><code>150</code><code>)<br><br></code><code># Chạy thuật toán Hough Transform cơ bản</code><code><br>lines = cv2.HoughLines(edges, rho=</code><code>1</code><code>, theta=np.pi/</code><code>180</code><code>, threshold=</code><code>200</code><code>)<br><br></code><code>if</code><code> lines </code><code>is</code> <code>not</code> <code>None</code><code>:<br>    </code><code>for</code><code> line </code><code>in</code><code> lines:<br>        r, theta = line[</code><code>0</code><code>]<br>        </code><code># Tính toán tọa độ để vẽ đường thẳng</code><code><br>        a = np.cos(theta)<br>        b = np.sin(theta)<br>        x0 = a * r<br>        y0 = b * r<br>        pt1 = (int(x0 + </code><code>1000</code><code>*(-b)), int(y0 + </code><code>1000</code><code>*(a)))<br>        pt2 = (int(x0 - </code><code>1000</code><code>*(-b)), int(y0 - </code><code>1000</code><code>*(a)))<br>        cv2.line(img, pt1, pt2, (</code><code>0</code><code>,</code><code>0</code><code>,</code><code>255</code><code>), </code><code>2</code><code>)<br></code></div></th></tr></table><p>Image Segmentation</p>"}]},{"id":"m4","short":"C4","title":"Các Phương pháp Phân đoạn Ảnh (Image Segmentation)","color":"#e8590c","weight":46,"priority":3,"keyPoints":[],"sections":[{"id":"4.1","t":"Tổng quan","h":"<p>Các nội dung trong phần này là: Active Contours (Đường viền chủ động), Split and Merge (Chia và Trộn), và Mean Shift &amp; Clustering (Dịch chuyển trung vị và Gom cụm).</p>"},{"id":"4.2","t":"Overview","h":"<p>Phân đoạn ảnh là quá trình chia một bức ảnh thành các vùng riêng biệt dựa trên các đặc trưng của điểm ảnh (như màu sắc, cường độ sáng, kết cấu) nhằm xác định các đối tượng hoặc ranh giới, giúp đơn giản hóa và phân tích ảnh hiệu quả hơn. Kết quả của quá trình này là gán nhãn cho từng pixel sao cho các pixel có cùng nhãn sẽ chia sẻ các đặc trưng chung.</p><p><b>Tầm quan trọng thực tế:</b> Trong y tế, việc phân đoạn giúp xác định hình dạng chính xác của các tế bào ung thư để đánh giá mức độ nghiêm trọng, điều mà các hộp bao (bounding boxes) của Object Detection thông thường không thể làm được.</p><ul><li>Semantic Segmentation (Phân đoạn ngữ nghĩa): Phân loại từng điểm ảnh thuộc về lớp đối tượng nào (ví dụ: người, đường sá, bầu trời).</li><li>Instance Segmentation (Phân đoạn thực thể): Không chỉ phân loại lớp đối tượng mà còn tách biệt rõ ràng từng cá thể thực thể khác nhau trong cùng một lớp.</li></ul>"},{"id":"4.3","t":"Phân đoạn bằng đường viền chủ động (Active Contours / Snakes)","h":"<p>Mô hình Snakes hay Active Contours là một đường cong biến dạng linh hoạt chuyển động dưới tác động của các lực nội tại (internal forces - giữ cho đường cong mượt mà) và lực ngoại tại (external forces - kéo đường cong về phía biên cạnh của đối tượng).</p><ul><li>Khởi tạo (Initialization): Người dùng thiết lập các điểm ban đầu để tạo thành một vòng khép kín xung quanh đối tượng. Số lượng và vị trí điểm khởi tạo quyết định lớn đến độ chính xác của thuật toán.</li><li>Dynamic Snakes &amp; CONDENSATION: Sử dụng bộ lọc Kalman hoặc thuật toán Condensation (dựa trên kỹ thuật lấy mẫu theo hệ số - factored sampling) áp dụng lặp đi lặp lại qua các chuỗi khung hình liên tiếp để theo dõi (track) đường viền chuyển động theo thời gian.</li><li>Intelligent Scissors (Kéo thông minh): Hệ thống tối ưu hóa đường cong theo thời gian thực khi người dùng vẽ tay. Khi người dùng kéo một đường thô (màu trắng), thuật toán tự động bám chặt và uốn lượn theo biên có độ tương phản cao (màu cam).</li><li>Level Sets (Tập mức): Một mô hình active contour tiên tiến biểu diễn đường cong 2D dưới dạng tập mức bằng 0 (zero level set) của một hàm số mặt phẳng bậc cao hơn. Phương pháp này xử lý cực tốt các thay đổi về cấu trúc hình học phức tạp (chia tách hoặc hợp nhất vùng) và ứng dụng mạnh mẽ trong ảnh y tế hoặc ảnh radar (SAR) có cường độ sáng không đồng nhất.</li></ul>"},{"id":"4.4","t":"Phương pháp chia và trộn vùng (Split and Merge Segmentation)","h":"<p>Khi một ngưỡng (threshold) cố định không đủ để phân đoạn toàn bộ bức ảnh do sự thay đổi của ánh sáng hoặc biến thiên thống kê nội bộ đối tượng, phương pháp tiếp cận theo cấu trúc phân cấp vùng được sử dụng.</p><h4>Thuật toán Split and Merge (Dựa trên cấu trúc Quadtree)</h4><ol><li>Định nghĩa một tiêu chí kiểm tra tính đồng nhất (homogeneity criterion) cho vùng ảnh (ví dụ: phương sai cường độ sáng nhỏ hơn một ngưỡng).</li><li>Split (Chia): Nếu một vùng không đồng nhất, chia vùng đó thành 4 vùng con bằng nhau. Quá trình này lặp lại đệ quy cho đến khi các vùng con đạt tính đồng nhất hoặc kích thước giảm xuống bằng 1 pixel.</li><li>Merge (Trộn): Sau khi chia, các vùng lân cận có thuộc tính tương đồng hoặc thỏa mãn tiêu chí đồng nhất khi kết hợp lại sẽ được trộn vào nhau để tránh việc ảnh bị phân rã thành quá nhiều mảnh nhỏ.</li></ol><h4>Thuật toán Watershed (Phân đoạn lưu vực)</h4><p>Giải pháp xử lý ảnh xám bằng cách xem cường độ sáng của mỗi pixel như một độ cao địa hình (topographic map). Các pixel sáng tương ứng với đỉnh núi/đường phân thủy (ridges), các pixel tối tương ứng với thung lũng/lưu vực thoát nước (drainage basins). Thuật toán thực hiện \"ngập nước\" từ các thung lũng, khi nước từ các lưu vực khác nhau chuẩn bị tràn vào nhau, một đường đập (watershed line) sẽ được dựng lên để phân đoạn ranh giới đối tượng.</p><h4>Các phương pháp nâng cao khác</h4><ul><li>Graph-based Segmentation (Phân đoạn dựa trên đồ thị): Mô hình hóa bức ảnh thành một mạng lưới đồ thị, các pixel/vùng là các nút (nodes), các cạnh (edges) mang trọng số thể hiện mức độ tương đồng giữa chúng để thực hiện các phép cắt đồ thị (graph cut).</li><li>Probabilistic Aggregation (Gom cụm xác suất): Thuật toán trộn dựa trên hai manh mối chính: độ tương đồng mức xám (dựa trên sai biệt ngoại vi tối thiểu của các vùng kề cận) và độ tương đồng kết cấu (định nghĩa qua sự sai biệt tương đối giữa các thùng lược đồ histogram của bộ lọc Sobel hướng).</li></ul><h4>DEMO phân đoạn bằng thuật toán Watershed</h4><table><tr><th><div><code>import</code><code> cv2<br></code><code>import</code><code> numpy </code><code>as</code><code> np<br><br>img = cv2.imread(</code><code>'coins.jpg'</code><code>)<br>gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)<br>_, thresh = cv2.threshold(gray, </code><code>0</code><code>, </code><code>255</code><code>, cv2.THRESH_BINARY_INV + cv2.THRESH_OTSU)<br><br></code><code># Loại bỏ nhiễu và tìm vùng chắc chắn là nền (background)</code><code><br>kernel = np.ones((</code><code>3</code><code>,</code><code>3</code><code>), np.uint8)<br>opening = cv2.morphologyEx(thresh, cv2.MORPH_OPEN, kernel, iterations=</code><code>2</code><code>)<br>sure_bg = cv2.dilate(opening, kernel, iterations=</code><code>3</code><code>)<br><br></code><code># Tìm vùng chắc chắn là đối tượng (foreground) bằng Distance Transform</code><code><br>dist_transform = cv2.distanceTransform(opening, cv2.DIST_L2, </code><code>5</code><code>)<br>_, sure_fg = cv2.threshold(dist_transform, </code><code>0.7</code><code> * dist_transform.max(), </code><code>255</code><code>, </code><code>0</code><code>)<br><br></code><code># Tìm vùng không xác định (unknown region)</code><code><br>sure_fg = np.uint8(sure_fg)<br>unknown = cv2.subtract(sure_bg, sure_fg)<br><br></code><code># Đánh dấu nhãn (Marker labeling)</code><code><br>_, markers = cv2.connectedComponents(sure_fg)<br>markers = markers + </code><code>1</code><code><br>markers[unknown == </code><code>0</code><code>] = </code><code>0</code><code><br><br></code><code># Áp dụng thuật toán Watershed</code><code><br>markers = cv2.watershed(img, markers)<br>img[markers == </code><code>-1</code><code>] = [</code><code>0</code><code>, </code><code>0</code><code>, </code><code>255</code><code>] </code><code># Đường biên phân đoạn có màu đỏ</code></div></th></tr></table>"},{"id":"4.5","t":"Clustering, K-Means & Mean Shift","h":"<h4>Thuật toán K-Means trong phân đoạn màu</h4><p>K-Means là một thuật toán học không giám sát dùng để gom cụm dữ liệu điểm ảnh dựa trên khoảng cách không gian màu (ví dụ ma trận vector 3D gồm R, G, B) thành K cụm cố định được chỉ định trước.</p><ol><li>Khởi tạo ngẫu nhiên vị trí của K tâm cụm (centroids).</li><li>Assign (Gán): Duyệt qua từng pixel trong ảnh, tính khoảng cách từ màu của pixel đó tới K tâm cụm và gán pixel đó vào cụm có tâm gần nhất.</li><li>Update (Cập nhật): Tính toán lại vị trí của mỗi tâm cụm bằng cách lấy giá trị trung bình cộng (mean) tọa độ màu của tất cả các pixel thuộc về cụm đó.</li><li>Lặp lại bước 2 và 3 cho đến khi vị trí các tâm cụm hội tụ hoặc không còn sự thay đổi nhãn.</li></ol><p><b>Mô hình hỗn hợp Gaussian (GMM):</b> Là mô hình mở rộng nâng cao mang tính xác suất của K-Means, giả định dữ liệu không gian màu được tạo ra từ một tập hợp các phân phối chuẩn Gaussian khác nhau.</p><h4>Thuật toán Mean Shift (Dịch chuyển trung vị)</h4><p>Khác với K-Means cần biết trước số lượng cụm K, Mean Shift là một thuật toán phi tham số (non-parametric) tự động tìm kiếm các đỉnh/mốt (modes - nơi có mật độ dữ liệu cao nhất) của hàm mật độ xác suất một cách lặp đi lặp lại.</p><p><b>Cơ chế hoạt động từng bước:</b></p><ol><li>Thiết lập một cửa sổ tìm kiếm (kernel) với một băng thông (bandwidth/size) xác định xung quanh điểm dữ liệu.</li><li>Tính toán trọng tâm (trung bình cộng tọa độ) của tất cả các điểm nằm bên trong cửa sổ hiện tại.</li><li>Dịch chuyển tâm của cửa sổ tới vị trí trọng tâm vừa tính được.</li><li>Lặp lại quá trình dịch chuyển này cho đến khi cửa sổ đứng im (hội tụ tại đỉnh mật độ cực đại).</li><li>Gán tất cả các điểm ảnh có đường đi hội tụ về cùng một đỉnh vào chung một cụm phân đoạn.</li></ol><table><tr><th><div>Tiêu chí so sánh</div></th><th><div>Thuật toán K-Means</div></th><th><div>Thuật toán Mean Shift</div><div> </div></th></tr><tr><td><div><b>Số lượng cụm K</b></div></td><td><div>Bắt buộc phải khai báo trước.</div></td><td><div>Tự động tìm kiếm dựa trên phân phối mật độ dữ liệu thực tế.</div></td></tr><tr><td><div><b>Hình dáng vùng phân đoạn</b></div></td><td><div>Thường có xu hướng tạo ra các vùng cụm dạng hình cầu lồi.</div></td><td><div>Cực kỳ linh hoạt, có thể bám theo bất kỳ hình dạng vùng phức tạp nào.</div></td></tr><tr><td><div><b>Độ nhạy nhiễu</b></div></td><td><div>Dễ bị ảnh hưởng nhiễu bởi các điểm ngoại lai (outliers).</div></td><td><div>Rất bền vững (robust) trước các điểm nhiễu ngoại lai.</div></td></tr><tr><td><div><b>Tham số chính cần chọn</b></div></td><td><div>Số lượng K cụm.</div></td><td><div>Kích thước cửa sổ tìm kiếm / Băng thông hạt nhân (Bandwidth).</div></td></tr></table><h4>DEMO gom cụm màu sắc phân đoạn ảnh bằng K-Means</h4><table><tr><th><div><code>import</code><code> cv2<br></code><code>import</code><code> numpy </code><code>as</code><code> np<br><br>img = cv2.imread(</code><code>'landscape.jpg'</code><code>)<br></code><code># Biến đổi ma trận ảnh 2D thành mảng một chiều các vector màu 3D (R,G,B)</code><code><br>data = img.reshape((</code><code>-1</code><code>, </code><code>3</code><code>))<br>data = np.float32(data)<br><br></code><code># Thiết lập tiêu chí dừng thuật toán (Lặp 100 lần hoặc tâm cụm dịch chuyển ít hơn 0.2)</code><code><br>criteria = (cv2.TERM_CRITERIA_EPS + cv2.TERM_CRITERIA_MAX_ITER, </code><code>100</code><code>, </code><code>0.2</code><code>)<br>K = </code><code>3</code> <code># Phân đoạn thành 3 màu chủ đạo</code><code><br><br></code><code># Thực hiện gom cụm K-Means</code><code><br>_, labels, centers = cv2.kmeans(data, K, </code><code>None</code><code>, criteria, </code><code>10</code><code>, cv2.KMEANS_RANDOM_CENTERS)<br><br></code><code># Chuyển đổi ngược dữ liệu về ma trận ảnh ban đầu</code><code><br>centers = np.uint8(centers)<br>segmented_data = centers[labels.flatten()]<br>segmented_img = segmented_data.reshape((img.shape))<br><br>cv2.imwrite(</code><code>'kmeans_segmented.jpg'</code><code>, segmented_img)</code></div></th></tr></table><p>Feature-Based Alignment</p>"}]},{"id":"m5","short":"C5","title":"Feature-Based Alignment","color":"#0c8599","weight":59,"priority":3,"keyPoints":[],"sections":[{"id":"5.1","t":"Tổng quan","h":"<p>Các nội dung trong phần này là: phương pháp căn chỉnh ảnh dựa trên tập hợp đặc trưng điểm rời rạc (Sparse Features) từ không gian 2D đến 3D, tập trung vào các giải pháp toán học sử dụng phương pháp bình phương tối thiểu (Least Squares) và thuật toán RANSAC để xử lý dữ liệu thực tế chứa nhiều điểm nhiễu.</p>"},{"id":"5.2","t":"Tổng quan về căn chỉnh dựa trên đặc trưng (Feature-Based Alignment)","h":"<p>Sau khi trích xuất và đối chiếu các điểm đặc trưng giữa các ảnh, bài toán đặt ra là phải đảm bảo tập hợp các cặp điểm trùng khớp này nhất quán về mặt hình học. Căn chỉnh dựa trên đặc trưng là bài toán ước lượng chuyển động (motion estimation) giữa hai hoặc nhiều tập hợp các điểm 2D hoặc 3D đã được so khớp.</p><p><b>Cơ chế hoạt động:</b> Thuật toán phát hiện một tập hợp đặc trưng thưa (sparse set of features) trong ảnh thứ nhất, tìm các điểm tương ứng trong ảnh thứ hai, sau đó tính toán một phép biến đổi hình học (transformation matrix) để làm mượt hoặc biến đổi ảnh này khớp chồng khít lên ảnh kia.</p>"},{"id":"5.3","t":"Căn chỉnh 2D bằng phương pháp bình phương tối thiểu (Least Squares)","h":"<p>Giả sử ta có một tập hợp các điểm đặc trưng đã được so khớp: xi (tọa độ ảnh gốc) và x'i (tọa độ ảnh đích). Mối quan hệ biến đổi hình học được biểu diễn qua hàm số x'i = f(xi; p), với p là vector chứa các tham số chuyển động cần tìm.</p><p>Để tìm được ước lượng tối ưu nhất cho tập tham số p, mục tiêu là tối thiểu hóa tổng bình phương sai số khoảng cách (Least Squares Error):</p><p><span class=\"mj mj-d\" data-tex=\"E_{LS} = \\sum_i \\lVert \\mathbf{r}_i \\rVert^2 = \\sum_i \\lVert f(\\mathbf{x}_i;\\,\\mathbf{p}) - \\mathbf{x}'_i \\rVert^2\">E_{LS} = \\sum_i \\lVert \\mathbf{r}_i \\rVert^2 = \\sum_i \\lVert f(\\mathbf{x}_i;\\,\\mathbf{p}) - \\mathbf{x}'_i \\rVert^2</span></p><h4>Các kỹ thuật nâng cao mở rộng</h4><ul><li>Trọng số bất định (Uncertainty Weighting): Trong thực tế, độ chính xác khi định vị các điểm đặc trưng không giống nhau. Thuật toán tối ưu bằng cách thêm trọng số nghịch đảo phương sai để giảm ảnh hưởng của các điểm có độ bất định cao: Σ σ_i⁻² || x'_i - f(x_i; p) ||².</li><li>Thuật toán lặp (Iterative Algorithms): Hầu hết các bài toán trong thị giác máy tính không có mối quan hệ tuyến tính đơn giản giữa dữ liệu đo đạc và các biến số chưa biết. Khi đó, các phương pháp bình phương tối thiểu phi tuyến tính hoặc kỹ thuật ước lượng bền vững (M-estimation) sẽ được áp dụng để giải lặp.</li></ul>"},{"id":"5.4","t":"Thuật toán RANSAC (RANdom SAmple Consensus)","h":"<p>Phương pháp Bình phương tối thiểu thông thường (Least Squares) rất nhạy cảm với điểm nhiễu ngoại lai (outliers) — chỉ cần một vài cặp điểm khớp sai nghiêm trọng có thể làm lệch hoàn toàn ma trận biến đổi. RANSAC ra đời như một giải pháp ước lượng tham số mạnh mẽ, được thiết kế đặc biệt để đối phó với dữ liệu chứa tỷ lệ outliers cực lớn.</p><p>RANSAC là một kỹ thuật tái lấy mẫu (resampling) tạo ra các giải pháp ứng viên bằng cách chỉ sử dụng số lượng điểm dữ liệu tối thiểu cần thiết để xác định các tham số của mô hình .</p><h4>Các bước thực hiện của thuật toán RANSAC:</h4><ol><li>Chọn ngẫu nhiên N điểm dữ liệu từ tập đầu vào (N là số điểm tối thiểu để xác định mô hình, ví dụ N=4 đối với phép Homography).</li><li>Ước lượng tập tham số mô hình ứng viên x từ N điểm này.</li><li>Kiểm tra toàn bộ các điểm dữ liệu còn lại xem có bao nhiêu điểm khớp với mô hình vừa tính trong phạm vi sai số cho phép (user-given tolerance). Tập hợp này gọi là các điểm nội tại (inliers), đặt số lượng là K.</li><li>Nếu số lượng inliers K đủ lớn, chấp nhận mô hình và kết thúc với kết quả thành công.</li><li>Lặp lại các bước 1 đến 4 trong tổng số L lần </li><li>Nếu sau L lần lặp vẫn không tìm thấy mô hình thỏa mãn, thuật toán báo lỗi thất bại </li></ol>"},{"id":"5.5","t":"Căn chỉnh đặc trưng không gian 3D (3D Alignment)","h":"<p>Nếu các phép biến đổi hình học 3D là tuyến tính theo các tham số chuyển động, ta có thể sử dụng phương pháp bình phương tối thiểu thông thường để giải quyết. Đối với trường hợp chuyển động vật thể cứng (Rigid / Euclidean Motion) bao gồm cả phép quay và tịnh tiến không gian, hai thuật toán kinh điển thường được sử dụng là :</p><ul><li>Thuật toán Orthogonal Procrustes: Sử dụng phân tích suy biến ma trận (SVD) để tìm ma trận quay tối ưu giữa hai tập hợp điểm.</li><li>Thuật toán Định hướng Tuyệt đối (Absolute Orientation): Tìm kiếm trực tiếp các tham số dịch chuyển, quay và co giãn đồng dạng.</li></ul><p><i><b>Sai số về độ chính xác giữa hai phương pháp này trong các ứng dụng thực tế là hoàn toàn không đáng kể nên hay được dùng thay cho nhau</b></i></p>"},{"id":"5.6","t":"Ứng dụng","h":"<p>Kỹ thuật căn chỉnh đặc trưng có vai trò cốt lõi trong các ứng dụng</p><ul><li>Xử lý tài liệu văn bản: Căn chỉnh hình ảnh tài liệu được quét hoặc chụp từ điện thoại về đúng khung mẫu tiêu chuẩn (template).</li><li>Ứng dụng Y tế: Căn chỉnh chồng khít các ảnh quét mô (scans) được chụp tại các thời điểm khác nhau để so sánh, theo dõi sự phát triển của bệnh lý .</li><li>Tạo ảnh toàn cảnh (Panorama): Ghép nối nhiều bức ảnh có vùng chồng lấn cấu trúc góc nhìn lại với nhau để tạo ra một bức ảnh góc rộng .</li></ul><h4>DEMO: Căn chỉnh ảnh 2D sử dụng RANSAC trong OpenCV</h4><table><tr><th><div><code>import</code><code> cv2<br></code><code>import</code><code> numpy </code><code>as</code><code> np<br><br></code><code># Đọc hai bức ảnh cần căn chỉnh góc nhìn (ví dụ ảnh gốc và ảnh chụp xiên)</code><code><br>img1 = cv2.imread(</code><code>'image_template.jpg'</code><code>, cv2.IMREAD_GRAYSCALE)<br>img2 = cv2.imread(</code><code>'image_scanned.jpg'</code><code>, cv2.IMREAD_GRAYSCALE)<br><br></code><code># 1. Khởi tạo bộ dò đặc trưng ORB</code><code><br>orb = cv2.ORB_create()<br>kp1, des1 = orb.detectAndCompute(img1, </code><code>None</code><code>)<br>kp2, des2 = orb.detectAndCompute(img2, </code><code>None</code><code>)<br><br></code><code># 2. Khớp các đặc trưng bằng Brute-Force Matcher</code><code><br>bf = cv2.BFMatcher(cv2.NORM_HAMMING, crossCheck=</code><code>True</code><code>)<br>matches = bf.match(des1, des2)<br><br></code><code># Sắp xếp các cặp điểm khớp theo khoảng cách sai biệt tăng dần</code><code><br>matches = sorted(matches, key=</code><code>lambda</code><code> x: x.distance)<br><br></code><code># Trích xuất tọa độ điểm tương ứng dạng ma trận phục vụ tính toán</code><code><br>src_pts = np.float32([kp1[m.queryIdx].pt </code><code>for</code><code> m </code><code>in</code><code> matches]).reshape(</code><code>-1</code><code>, </code><code>1</code><code>, </code><code>2</code><code>)<br>dst_pts = np.float32([kp2[m.trainIdx].pt </code><code>for</code><code> m </code><code>in</code><code> matches]).reshape(</code><code>-1</code><code>, </code><code>1</code><code>, </code><code>2</code><code>)<br><br></code><code># 3. Sử dụng RANSAC để tính ma trận Homography (Xóa bỏ hoàn toàn các outliers)</code><code><br></code><code># sai số cho phép là 5.0 pixel</code><code><br>M, mask = cv2.findHomography(src_pts, dst_pts, cv2.RANSAC, </code><code>5.0</code><code>)<br><br></code><code># 4. Warp ảnh thứ nhất theo ma trận cấu trúc góc nhìn của ảnh thứ hai</code><code><br>h, w = img2.shape<br>aligned_img = cv2.warpPerspective(img1, M, (w, h))<br><br>cv2.imwrite(</code><code>'aligned_output.jpg'</code><code>, aligned_img)<br></code></div></th></tr></table><p>Motion Models &amp; Global Alignment</p>"}]},{"id":"m6","short":"C6","title":"Motion Models & Global Alignment","color":"#2f9e44","weight":14,"priority":3,"keyPoints":[],"sections":[{"id":"6.1","t":"Tổng quan","h":"<p>Các nội dung trong phần này là:  Mô hình chuyển động (Motion Models) và Căn chỉnh toàn cục (Global Alignment), thường được sử dụng trong các bài toán ghép ảnh (Image Stitching) và nhận dạng toàn cảnh (Panorama).</p>"},{"id":"6.2","t":"Mô hình chuyển động (Motion Models)","h":"<h4>Ghép ảnh (Image Stitching)</h4><p>Ghép ảnh là quá trình kết hợp nhiều bức ảnh chụp có trường nhìn chồng lấn (overlapping fields of view) để tạo ra một bức ảnh toàn cảnh (panorama) phân đoạn hoặc một bức ảnh có độ phân giải siêu cao.</p><ul><li>Ứng dụng: Phục hồi dữ liệu gốc từ dữ liệu bị rách (như tái tạo lại giấy bị xé trong khoa học pháp y), lập bản đồ (mapping) toàn diện một khu vực cụ thể.</li></ul><h4>Chuyển động và luồng quang học (Optical Flow)</h4><p>Để ước lượng chuyển động của điểm ảnh từ thời điểm t (ảnh I(x,y,t)) sang thời điểm t+1 (ảnh I(x,y,t+1)), chúng ta phải giải quyết <b>bài toán tương ứng điểm ảnh (pixel correspondence problem)</b> - tức là tìm các điểm ảnh lân cận có cùng màu sắc trong khung hình tiếp theo.</p><ul><li>Ràng buộc hằng số độ sáng (Brightness Constancy Constraint): Giả định rằng độ sáng của một điểm ảnh không thay đổi khi nó di chuyển từ khung hình này sang khung hình khác.</li></ul><h4>Các mô hình chuyển động phổ biến</h4><table><tr><th><div>Mô hình</div></th><th><div>Đặc điểm &amp; Ứng dụng</div><div> </div></th></tr><tr><td><div><b>Planar perspective motion (Chuyển động phối cảnh phẳng)</b></div></td><td><div>Căn chỉnh các bức ảnh bằng cách tịnh tiến và xoay chúng trong không gian 2D. Tương tự như việc bạn xếp chồng các tấm ảnh in vật lý lên nhau. Biến đổi phối cảnh xử lý việc chuyển đổi một vật thể 3D vào mặt phẳng 2D.</div></td></tr><tr><td><div><b>Hệ tọa độ Trụ và Cầu (Cylindrical and Spherical Coordinates)</b></div></td><td><div>Thay vì dùng homography, ta có thể \"warp\" (bẻ cong) ảnh vào một mặt trụ hoặc mặt cầu. Sau đó, ta chỉ cần sử dụng mô hình tịnh tiến thuần túy để căn chỉnh. Cách này chỉ hiệu quả nếu các ảnh được chụp bởi camera đặt ngang hoặc có góc nghiêng (tilt angle) đã biết.</div><div></div><div><i>Phương trình tọa độ trụ:</i> Điểm trên bề mặt trụ được biểu diễn bằng góc θ và chiều cao h: (sin θ, h, cos θ) ∝ (x, y, f).</div></td></tr><tr><td><div><b>Cylindrical Panorama (Toàn cảnh hình trụ)</b></div></td><td><div>Được sử dụng khi camera đặt ngang và chỉ có chuyển động xoay quanh trục dọc của nó. Lúc này, ta chỉ cần ước lượng một phép tịnh tiến.</div></td></tr></table><h4>Ứng dụng: Tóm tắt và nén video</h4><p>Mô hình chuyển động cho phép ghép các cảnh nền trong video lại thành một ảnh \"sprite\" duy nhất. Thay vì truyền toàn bộ video, hệ thống chỉ cần truyền ảnh background sprite này để tái tạo lại phông nền cho từng khung hình, giúp nén video cực kỳ hiệu quả.</p>"},{"id":"6.3","t":"Căn chỉnh toàn cục (Global Alignment)","h":"<h4>Định nghĩa</h4><p>Căn chỉnh toàn cục là bài toán tìm ra các tham số đăng ký ảnh (registration parameters) thỏa mãn tốt nhất các ràng buộc được tạo ra từ quá trình khớp ảnh. Mục tiêu là tìm ra một tập hợp tham số căn chỉnh nhất quán trên toàn hệ thống để <b>giảm thiểu sai số đăng ký (mis-registration) giữa tất cả các cặp ảnh</b>.</p><h4>Điều chỉnh chùm tia (Bundle Adjustment)</h4><p>Thay vì ghép từng ảnh một vào panorama (dễ gây tích lũy sai số), <b>Bundle Adjustment</b> là quá trình điều chỉnh đồng thời (simultaneously) các tham số tư thế (pose parameters) cho một bộ sưu tập lớn các bức ảnh chồng lấp lên nhau.</p><ul><li>Phương trình ánh xạ một điểm 3D xi vào điểm xij trong khung hình j: xij ~ Kj Rj xi (Trong đó Rj là ma trận quay, Kj là ma trận hiệu chuẩn camera).</li><li>Tối ưu hóa: Trong thực tế, nếu trích xuất đủ số lượng đặc trưng, hệ thống có thể tối thiểu hóa trực tiếp sai số thông qua phương pháp bình phương tối thiểu phi tuyến tính (non-linear least squares) để đạt độ chính xác cực cao.</li></ul><h4>Nhận diện Panorama (Recognizing Panoramas)</h4><p>Đây là phần khó nhất để tự động hóa hoàn toàn thuật toán ghép ảnh: Quyết định xem những cặp ảnh nào thực sự thuộc về cùng một cảnh (scene).</p><ol><li>Trích xuất đặc trưng: Hệ thống sử dụng SIFT (Scale Invariant Feature Transform) để trích xuất các điểm đặc trưng từ tất cả các ảnh và đưa vào một cấu trúc chỉ mục (indexing structure) để tìm kiếm nhanh.</li><li>Ghép nhóm: Các ảnh được nhóm thành các thành phần liên thông (connected components) tương ứng với các panorama khác nhau.</li><li>Thách thức - Cấu trúc lặp lại: Các cấu trúc lặp đi lặp lại trong cảnh (ví dụ: các ô cửa sổ giống nhau trên tòa nhà) có thể dẫn đến việc khớp sai (false matches).</li><li>Giải pháp:</li></ol><ul><li>Thực hiện so sánh pixel trực tiếp (direct pixel-based comparison) giữa các ảnh đã được căn chỉnh để xem chúng có thực sự là một cảnh hay không.</li><li>Tuy nhiên, so sánh pixel trực tiếp sẽ thất bại nếu trong cảnh có vật thể chuyển động. Giải pháp triệt để nhất hiện nay là ứng dụng Học máy (Machine Learning) để xác thực.</li></ul>"},{"id":"6.4","t":"DEMO","h":"<p>Sử dụng thư viện OpenCV để thực hiện toàn bộ quy trình: Tìm đặc trưng (SIFT) -&gt; mô hình chuyển động (biến đổi phối cảnh/Homography) và căn chỉnh toàn cục để ghép các bức ảnh (Image Stitching) thành một ảnh Panorama.</p><p><i>Có thể thử nhiều hình ghép vào thử để hiểu hơn về cách nó hoạt động, nếu ghép ½ ảnh trái với ½ ảnh phải thì nó không tìm được vùng chồng lấn đâu nhá :))). Phải là 51% trái, 50% phải và chỉnh thông số vùng chồng lấn thì nó mới ghép được nhá. Và cũng có trường hợp nhìn chả giống nhau chỗ nào nhưng nó vẫn tình cờ phát hiện được vùng chồng lấn (trùng hợp ngẫu nhiên) =&gt; nói chung cái này khá hay, ai có hứng thú cũng nên tìm hiểu tại sao nhá</i></p><table><tr><th><div><code>import</code><code> cv2<br></code><code>import</code><code> numpy </code><code>as</code><code> np<br><br></code><code># 1. Đọc các bức ảnh đầu vào (Cần có trường nhìn chồng lấp)</code><code><br>img1 = cv2.imread(</code><code>'left_image.jpg'</code><code>)<br>img2 = cv2.imread(</code><code>'right_image.jpg'</code><code>)<br>images = [img1, img2]<br><br></code><code># 2. Khởi tạo đối tượng Stitcher tích hợp sẵn của OpenCV</code><code><br></code><code># Stitcher này đã bao gồm: trích xuất đặc trưng (như SIFT/ORB), </code><code><br></code><code># ước lượng mô hình chuyển động và Bundle Adjustment (Căn chỉnh toàn cục)</code><code><br>stitcher = cv2.Stitcher_create()<br><br></code><code># 3. Thực hiện ghép ảnh</code><code><br>status, stitched_panorama = stitcher.stitch(images)<br><br></code><code>if</code><code> status == cv2.Stitcher_OK:<br>    print(</code><code>\"Ghép ảnh thành công! Các ảnh đã được căn chỉnh toàn cục.\"</code><code>)<br>    cv2.imshow(</code><code>\"Panorama\"</code><code>, stitched_panorama)<br>    cv2.imwrite(</code><code>\"panorama_result.jpg\"</code><code>, stitched_panorama)<br>    cv2.waitKey(</code><code>0</code><code>)<br>    cv2.destroyAllWindows()<br></code><code>else</code><code>:<br>    print(</code><code>f\"Ghép ảnh thất bại. Mã lỗi: {status}\"</code><code>)<br>    </code><code># Lỗi thường xảy ra do không đủ đặc trưng khớp (không đủ vùng chồng lấp)</code></div></th></tr></table><p>Object Detection, Tracking &amp; Face Recognition</p>"}]},{"id":"m7","short":"C7","title":"Object Detection, Face Recognition, Object Tracking","color":"#c2255c","weight":25,"priority":3,"keyPoints":[],"sections":[{"id":"7.1","t":"Tổng quan","h":"<p>Phần này làm project liên quan face recognition để điểm danh thì recommend nên tìm hiểu dùng thư viện face_recognition nhen. Thư viện này đã được có sẵn nhận dạng mặt người rồi, chỉ cần chỉnh chỉnh lại xíu là áp dụng vào nhận diện điểm danh được luôn.</p>"},{"id":"7.2","t":"Phát hiện đối tượng (Object Detection)","h":"<h4>Khái niệm cơ bản</h4><p><b>Phát hiện đối tượng (Object Detection)</b> là một tác vụ trong thị giác máy tính nhằm phát hiện các thực thể của một lớp đối tượng ngữ nghĩa (như con người, tòa nhà, ô tô, chó, mèo) trong hình ảnh kỹ thuật số và video. Không giống như phân loại ảnh (chỉ cho biết trong ảnh có gì), phát hiện đối tượng trả về vị trí chính xác của đối tượng thông qua <b>hộp giới hạn (Bounding Box)</b>.</p><h4>Các phương pháp phát hiện đối tượng</h4><table><tr><th><div>Nhóm phương pháp</div></th><th><div>Các thuật toán tiêu biểu</div><div> </div></th></tr><tr><td><div><b>Tiếp cận không dùng Mạng nơ-ron (Non-neural approaches)</b></div></td><td><ul><li><b>Viola-Jones:</b> Thuật toán kinh điển dùng đặc trưng Haar, rất nổi tiếng trong phát hiện khuôn mặt truyền thống.</li><li><b>SIFT &amp; HOG:</b> Trích xuất đặc trưng điểm (SIFT) hoặc biểu đồ dốc hướng (HOG) kết hợp với bộ phân loại SVM.</li></ul></td></tr><tr><td><div><b>Tiếp cận bằng Mạng nơ-ron sâu (Neural network approaches)</b></div></td><td><ul><li><b>Họ R-CNN (Region Proposals):</b> R-CNN, Fast R-CNN, Faster R-CNN, Cascade R-CNN. Chạy qua 2 giai đoạn: Đề xuất vùng chứa vật thể, sau đó phân loại vùng đó. Độ chính xác rất cao nhưng chậm.</li><li><b>One-stage Detectors:</b> SSD (Single Shot MultiBox Detector), YOLO (You Only Look Once). Chạy 1 bước duy nhất dự đoán trực tiếp tọa độ hộp và nhãn. Tốc độ cực nhanh (real-time).</li></ul></td></tr></table><h4>Ứng dụng & thách thức</h4><ul><li>Các lĩnh vực ứng dụng: Giám sát video, Lái xe tự động, Hình ảnh y tế, Robot, Đếm đám đông, Nhận dạng khuôn mặt, Bán lẻ, Nhiếp ảnh, Marketing. Hai mảng nổi bật là Face detection (Tìm vị trí khuôn mặt) và Pedestrian detection (Tìm người đi bộ).</li><li>Thách thức (Challenges):</li></ul><ul><li>Viewpoint variation: Góc nhìn thay đổi làm đối tượng trông khác hẳn.</li><li>Deformation: Đối tượng bị biến dạng hình dáng (ví dụ: tư thế uốn dẻo của người).</li><li>Occlusion: Đối tượng bị che khuất bởi vật cản.</li><li>Illumination: Điều kiện ánh sáng (quá sáng, quá tối, đổ bóng).</li><li>Background clutter: Phông nền lộn xộn, có kết cấu hoặc màu sắc lẫn vào đối tượng.</li><li>Speed: Đòi hỏi thuật toán phải chạy cực nhanh (thời gian thực) để bắt kịp các chuyển động trong video.</li></ul><h4>DEMO phát hiện khuôn mặt bằng Haar Cascade</h4><table><tr><th><div><code>import</code><code> cv2<br><br></code><code># Tải mô hình nhận diện khuôn mặt Viola-Jones (Haar Cascade) có sẵn của OpenCV</code><code><br>face_cascade = cv2.CascadeClassifier(cv2.data.haarcascades + </code><code>'haarcascade_frontalface_default.xml'</code><code>)<br><br>img = cv2.imread(</code><code>'group_photo.jpg'</code><code>)<br>gray = cv2.cvtColor(img, cv2.COLOR_BGR2GRAY)<br><br></code><code># Phát hiện các khuôn mặt trong ảnh</code><code><br>faces = face_cascade.detectMultiScale(gray, scaleFactor=</code><code>1.1</code><code>, minNeighbors=</code><code>5</code><code>, minSize=(</code><code>30</code><code>, </code><code>30</code><code>))<br><br></code><code># Vẽ hộp giới hạn (bounding box) quanh các khuôn mặt</code><code><br></code><code>for</code><code> (x, y, w, h) </code><code>in</code><code> faces:<br>    cv2.rectangle(img, (x, y), (x+w, y+h), (</code><code>0</code><code>, </code><code>255</code><code>, </code><code>0</code><code>), </code><code>2</code><code>)<br>    <br>cv2.imwrite(</code><code>'detected_faces.jpg'</code><code>, img)</code></div></th></tr></table>"},{"id":"7.3","t":"Nhận dạng đối tượng và khuôn mặt (Object / Face Recognition)","h":"<h4>Phân biệt Detection và Recognition</h4><ul><li>Detection (Phát hiện): Trả lời câu hỏi \"Ở đây có đối tượng (khuôn mặt) không và nó nằm ở đâu?\".</li><li>Recognition (Nhận dạng): Khả năng nhận biết, định danh và xác định thuộc tính ngữ nghĩa của đối tượng (Trả lời câu hỏi \"Khuôn mặt này là của ai?\"). Dùng trong bảo mật sinh trắc học (Biometric security).</li></ul><h4>Các bước nhận dạng đối tượng</h4><ol><li>Feature extraction (Trích xuất đặc trưng): Rút trích các đặc trưng đáng tin cậy.</li><li>Feature-model matching (Khớp đặc trưng với mô hình): So khớp đặc trưng của ảnh đầu vào với dữ liệu đã lưu trong cơ sở dữ liệu.</li><li>Hypotheses formation (Hình thành giả thuyết): Chọn lọc tập hợp các đối tượng có khả năng đúng nhất và gán xác suất.</li><li>Object verification (Xác thực đối tượng): Chọn ra kết quả đúng nhất.</li></ol><h4>Nhận dạng khuôn mặt 3D và các phương pháp tiếp cận</h4><p>Nhận dạng khuôn mặt 3D phân tích kết cấu hình học độc nhất của khuôn mặt như: Khoảng cách giữa 2 mắt, độ sâu của hốc mắt, khoảng cách từ trán đến cằm, hình dáng xương gò má, và đường viền môi, tai, cằm.</p><table><tr><th><div>Hướng tiếp cận</div></th><th><div>Mô tả chi tiết</div><div> </div></th></tr><tr><td><div><b>Type 1: Holistic Matching (Khớp toàn cục)</b></div></td><td><div>Coi khuôn mặt là một bài toán nhận dạng mảng 2D tổng thể. Các phương pháp: Eigenfaces (dựa trên PCA - Phân tích thành phần chính), LDA (Phân tích phân biệt tuyến tính), ICA (Phân tích thành phần độc lập).</div></td></tr><tr><td><div><b>Type 2: Feature-based (Dựa trên đặc trưng cục bộ)</b></div></td><td><div>Chỉ trích xuất các đặc trưng cục bộ (mắt, mũi, miệng) và thống kê vị trí, cấu trúc của chúng để đưa vào bộ phân loại.</div></td></tr><tr><td><div><b>Type 3: Hybrid Methods (Phương pháp Lai)</b></div></td><td><div>Kết hợp cả đặc điểm toàn cục (Holistic) và đặc trưng cục bộ để tăng độ chính xác.</div></td></tr></table><p><b>Phương pháp Eigenfaces (Sử dụng PCA):</b> Tính toán một tập hợp các \"khuôn mặt cơ sở\" (Eigenfaces) từ cơ sở dữ liệu. Một khuôn mặt mới đưa vào sẽ được biểu diễn dưới dạng tổ hợp tuyến tính của các Eigenfaces này. Nếu sự khác biệt (khoảng cách) giữa vector của ảnh mới và ảnh trong cơ sở dữ liệu nhỏ hơn một ngưỡng, hệ thống sẽ xác nhận danh tính.</p>"},{"id":"7.4","t":"Theo dõi đối tượng (Object Tracking)","h":"<h4>Theo dõi đối tượng là gì?</h4><p><b>Object Tracking</b> là bài toán lấy đầu vào là kết quả của bộ phát hiện đối tượng (detections) ở frame đầu tiên, tạo một ID duy nhất cho mỗi đối tượng, và sau đó <b>tiếp tục theo dõi tọa độ hộp giới hạn của đối tượng đó qua các frame (khung hình) tiếp theo</b> của video trong khi vẫn duy trì đúng ID ban đầu.</p><h4>Các hướng tiếp cận Tracking</h4><ul><li>Type 1: Point Tracking (Theo dõi điểm): Biểu diễn đối tượng bằng các điểm đặc trưng trong các khung hình liên tiếp (dùng thuật toán tất định hoặc xác suất). Nhược điểm là cần một cơ chế phát hiện đối tượng chạy song song ở mọi khung hình để xử lý các đối tượng mới xuất hiện hoặc biến mất.</li><li>Type 2: Kernel Tracking (Theo dõi Kernel/Vùng): Đại diện đối tượng bằng một vùng hình học cơ bản (kernel/template) mang thông tin về hình dáng, màu sắc hoặc kết cấu. Thuật toán tìm kiếm vị trí mới của kernel này ở frame tiếp theo (Ví dụ: Thuật toán Mean-shift, CAMShift theo dõi qua biểu đồ màu sắc).</li></ul><h4>Các bước khởi tạo Multiple Object Tracking (Theo dõi đa đối tượng)</h4><ol><li>Đọc frame đầu tiên của video.</li><li>Sử dụng thuật toán Detection hoặc tự vẽ hộp (Bounding Box) để xác định vị trí ban đầu của các đối tượng.</li><li>Khởi tạo bộ theo dõi (MultiTracker) với các hộp giới hạn vừa thu được.</li><li>Trong vòng lặp xử lý video, gọi phương thức update() của MultiTracker để lấy tọa độ mới cho từng đối tượng trên khung hình mới.</li></ol><h4>Thách thức (Challenges) của Tracking</h4><ul><li>Occlusion (Sự che khuất): Đối tượng bị che mất hoàn toàn hoặc một phần bởi vật thể khác trong chốc lát, khiến ID bị mất hoặc chuyển nhầm sang đối tượng che khuất.</li><li>Scale Change: Kích thước đối tượng thay đổi khi di chuyển lại gần hoặc ra xa camera.</li><li>Background clutter &amp; Appearance change: Nền có màu giống đối tượng, hoặc đối tượng tự biến dạng, xoay mặt khác khiến hệ thống không nhận diện được.</li></ul><h4>DEMO theo dõi đối tượng trong Video</h4><table><tr><th><div><code>import</code><code> cv2<br><br></code><code># Đọc video</code><code><br>cap = cv2.VideoCapture(</code><code>'walking.mp4'</code><code>)<br>ret, frame = cap.read()<br><br></code><code># Chọn vùng đối tượng cần theo dõi bằng chuột ở frame đầu tiên</code><code><br>bbox = cv2.selectROI(</code><code>\"Tracking\"</code><code>, frame, </code><code>False</code><code>)<br><br></code><code># Khởi tạo bộ theo dõi CSRT (chính xác cao, chống biến dạng tốt)</code><code><br>tracker = cv2.TrackerCSRT_create()<br>tracker.init(frame, bbox)<br><br></code><code>while</code> <code>True</code><code>:<br>    ret, frame = cap.read()<br>    </code><code>if</code> <code>not</code><code> ret:<br>        </code><code>break</code><code><br>        <br>    </code><code># Cập nhật vị trí bộ theo dõi</code><code><br>    success, bbox = tracker.update(frame)<br>    <br>    </code><code>if</code><code> success:<br>        </code><code># Nếu theo dõi thành công, vẽ hộp mới</code><code><br>        (x, y, w, h) = [int(v) </code><code>for</code><code> v </code><code>in</code><code> bbox]<br>        cv2.rectangle(frame, (x, y), (x + w, y + h), (</code><code>255</code><code>, </code><code>0</code><code>, </code><code>0</code><code>), </code><code>2</code><code>)<br>        cv2.putText(frame, </code><code>\"Tracking\"</code><code>, (x, y - </code><code>10</code><code>), cv2.FONT_HERSHEY_SIMPLEX, </code><code>0.7</code><code>, (</code><code>255</code><code>,</code><code>0</code><code>,</code><code>0</code><code>), </code><code>2</code><code>)<br>    </code><code>else</code><code>:<br>        </code><code># Mất dấu đối tượng (Lost)</code><code><br>        cv2.putText(frame, </code><code>\"Lost\"</code><code>, (</code><code>100</code><code>,</code><code>80</code><code>), cv2.FONT_HERSHEY_SIMPLEX, </code><code>0.7</code><code>, (</code><code>0</code><code>,</code><code>0</code><code>,</code><code>255</code><code>), </code><code>2</code><code>)<br>        <br>    cv2.imshow(</code><code>\"Tracking\"</code><code>, frame)<br>    </code><code>if</code><code> cv2.waitKey(</code><code>30</code><code>) &amp; </code><code>0xFF</code><code> == ord(</code><code>'q'</code><code>):<br>        </code><code>break</code><code><br><br>cap.release()<br>cv2.destroyAllWindows()</code></div></th></tr></table><p>PE Theory</p><ol><li>Computer Vision (Thị giác máy tính) là lĩnh vực khoa học máy tính giúp máy móc \"nhìn\", hiểu và xử lý thông tin từ hình ảnh/video giống như con người.</li><li>Phép biến đổi ảnh (Image transformation) là quá trình thay đổi tọa độ không gian hoặc dải giá trị màu của các điểm ảnh.</li><li>Phép biến đổi hình học (Geometric transformation) bao gồm việc can thiệp vào tọa độ không gian của bức ảnh thông qua các thao tác như tịnh tiến, xoay, co giãn hoặc bẻ xiên.</li><li>Hệ tọa độ đồng nhất (Homogeneous coordinates) bổ sung thêm một chiều phụ (w) để cho phép thực hiện mọi phép biến đổi hình học (kể cả tịnh tiến và phối cảnh) chỉ bằng phép nhân ma trận.</li><li>Phép bẻ xiên (Shearing) trong biến đổi ảnh là thao tác kéo lệch hình ảnh dọc theo trục X hoặc trục Y, làm biến dạng một hình chữ nhật ban đầu thành hình bình hành.</li><li>Khi ánh sáng chiếu vào bề mặt vật thể, một phần ánh sáng sẽ bị tán xạ (scattered) và một phần bị phản xạ (reflected) ngược lại môi trường.</li><li>Định luật cosin Lambert phát biểu rằng cường độ ánh sáng phản xạ khuếch tán từ một bề mặt nhám tỷ lệ thuận với cosin của góc tạo bởi tia sáng tới và vector pháp tuyến của bề mặt đó.</li><li>Mô hình thấu kính mỏng (Thin lens model) là mô hình toán học cơ bản mô phỏng cách một thấu kính hội tụ ánh sáng đi qua quang tâm để tạo thành bức ảnh rõ nét trên cảm biến.</li><li>Quang sai màu (Chromatic aberration) xảy ra do chiết suất của thủy tinh thay đổi nhẹ theo các bước sóng ánh sáng khác nhau, khiến các tia sáng màu khác nhau hội tụ lệch điểm trên cảm biến.</li><li>Mipmaps là một chuỗi các phiên bản ảnh thu nhỏ dần (độ phân giải giảm đi một nửa liên tiếp) nhằm mục đích chống hiện tượng răng cưa và tăng tốc độ kết xuất đồ họa khi vật thể ở xa camera.</li><li>Xử lý ảnh kỹ thuật số (Digital image processing) là việc sử dụng các thuật toán máy tính để can thiệp, nâng cao chất lượng hoặc trích xuất dữ liệu hữu ích từ hình ảnh số.</li><li>Các tham số camera (Camera parameters) đóng vai trò định nghĩa cách hệ thống quang học chiếu thế giới 3D thực tế vào mặt phẳng 2D của bức ảnh (bao gồm tiêu cự, kích thước cảm biến, góc xoay).</li><li>Không gian màu (Color space) là một mô hình toán học tiêu chuẩn hóa dùng để biểu diễn màu sắc dưới dạng các con số định lượng (Ví dụ: RGB, HSV, YCbCr).</li><li>Mắt người nhận biết màu sắc nhờ các tế bào hình nón (cones) trên võng mạc có khả năng cảm nhận các bước sóng ánh sáng khác nhau phản xạ từ vật thể.</li><li>Cân bằng lược đồ xám (Histogram equalization) là kỹ thuật giúp tăng cường độ tương phản toàn cục của bức ảnh bằng cách dàn đều sự phân bố của các mức cường độ sáng hẹp.</li><li>Kéo giãn tương phản (Contrast stretching) là thao tác mở rộng dải cường độ sáng hạn chế hiện tại của một bức ảnh (thường bị mờ, tối) ra toàn bộ dải động tối đa có thể (ví dụ 0-255).</li><li>Phân ngưỡng (Thresholding) là thao tác chuyển một bức ảnh xám thành ảnh nhị phân (chỉ có trắng và đen) dựa trên việc so sánh giá trị mỗi pixel với một ngưỡng cường độ cố định.</li><li>Điểm khác biệt giữa lọc tuyến tính và phi tuyến tính: Lọc tuyến tính tính toán giá trị pixel mới bằng tổng có trọng số của vùng lân cận (VD: bộ lọc Mean), trong khi lọc phi tuyến tính dùng các phép thống kê hoặc sắp xếp giá trị (VD: bộ lọc Median).</li><li>Bộ lọc trung bình (Mean filter) là một bộ lọc tuyến tính có tác dụng làm mờ ảnh bằng cách thay thế pixel trung tâm bằng giá trị trung bình cộng của tất cả các pixel lân cận trong cửa sổ lọc.</li><li>Phép tích chập (Convolution) là thao tác nhân một mặt nạ ma trận (kernel) đã được lật ngược 180 độ với vùng lân cận tương ứng của ảnh để thực hiện lọc nhiễu hoặc tìm biên.</li><li>Phép tương quan (Correlation) có cơ chế toán học giống hệt tích chập nhưng mặt nạ kernel không bị lật ngược, thường được sử dụng nhiều nhất để đối chiếu, tìm kiếm một mẫu nhỏ trong ảnh lớn (template matching).</li><li>Làm mờ Gaussian (Gaussian smoothing) là kỹ thuật làm mờ ảnh một cách tự nhiên và mềm mại bằng cách sử dụng hàm phân phối chuẩn Gaussian làm trọng số cho kernel lọc.</li><li>Biến đổi Fourier (Fourier Transform) được sử dụng để chuyển đổi bức ảnh từ miền không gian (không gian tọa độ x,y) sang miền tần số, giúp hệ thống dễ dàng phân tích cấu trúc, lọc nhiễu phức tạp hoặc nén ảnh.</li><li>Các tính chất cơ bản của biến đổi Fourier bao gồm tính tuyến tính, tính tịnh tiến (dịch chuyển), tính xoay, tỷ lệ đồng dạng kích thước và định lý tích chập.</li><li>Trung bình trọng số elip (Elliptical weighted average - EWA) là một bộ lọc tái mẫu không gian (resampling) tiên tiến giúp chống lại hiện tượng răng cưa cực kỳ hiệu quả khi làm biến dạng (warping) ảnh.</li><li>Lọc bất đẳng hướng (Anisotropic filtering) được dùng trong đồ họa để loại bỏ hiện tượng nhòe và bảo toàn tối đa độ sắc nét của kết cấu bề mặt khi người dùng quan sát ở các góc nghiêng cực hạn.</li><li>Bộ phát hiện đặc trưng (Feature detectors) là các thuật toán chuyên tìm kiếm các điểm nổi bật (như góc, cạnh, các đốm thay đổi độ sáng đột ngột) trên ảnh để có thể dùng so khớp một cách đáng tin cậy.</li><li>Bộ mô tả đặc trưng (Feature descriptor) là một vector số học đóng vai trò như \"dấu vân tay\", tóm tắt lại toàn bộ thông tin về cấu trúc, độ dốc hướng của vùng lân cận xung quanh một điểm đặc trưng.</li><li>So khớp đặc trưng (Feature matching) là quá trình tính toán khoảng cách toán học giữa các vector mô tả (descriptors) để tìm ra các cặp điểm giống hệt nhau giữa hai hoặc nhiều bức ảnh.</li><li>Hai loại phương pháp phát hiện biên chính là phương pháp dựa trên đạo hàm bậc 1 (tính Gradient, VD: Sobel) và phương pháp dựa trên đạo hàm bậc 2 (tìm điểm giao cắt trục hoành / Zero-crossing, VD: Laplacian).</li><li>Gradient trong xử lý ảnh là một vector toán học chỉ ra chính xác hướng và độ lớn của sự thay đổi cường độ sáng nhanh nhất tại một điểm ảnh cụ thể.</li><li>Toán tử Sobel tính toán gradient theo trục x và trục y để phát hiện đường biên, đồng thời nó được tích hợp sẵn khả năng làm mờ nhẹ để giảm bớt ảnh hưởng của nhiễu.</li><li>Toán tử Prewitt phát hiện đường biên tương tự như Sobel nhưng sử dụng ma trận có các trọng số đồng đều, tỏ ra rất hiệu quả trong việc nhận diện các hướng ưu tiên cụ thể của đường biên.</li><li>Laplacian of Gaussian (LoG) là phương pháp dùng bộ lọc Gaussian để làm mờ nhiễu trước, sau đó áp dụng đạo hàm bậc 2 (Laplacian) để tìm ra các đường biên sắc mỏng thông qua các điểm giao cắt bằng không (zero-crossings).</li><li>Toán tử Canny được coi là thuật toán phát hiện biên chuẩn mực nhất vì nó kết hợp cả lọc nhiễu, tính gradient, triệt tiêu phi cực đại (làm mỏng biên) và phân ngưỡng kép để cho ra duy nhất một đường biên sắc nét, liên tục.</li><li>Phân đoạn ảnh (Image segmentation) là quá trình chia nhỏ một bức ảnh thành nhiều vùng hoặc phân đoạn riêng biệt có chung đặc điểm (màu sắc, kết cấu, độ sáng) để hệ thống dễ dàng phân tích từng đối tượng độc lập.</li><li>Phân đoạn dựa trên biên (Edge-based segmentation) có mục đích tìm ranh giới giữa các vùng bằng cách phát hiện và liên kết các đường biên khép kín nhằm tách các vật thể ra khỏi nhau.</li><li>Phân ngưỡng trong phân đoạn ảnh (Thresholding) là kỹ thuật đơn giản để tách đối tượng khỏi nền bằng cách gán nhãn pixel thành hai cực (trắng/đen) dựa trên cường độ sáng so với một giá trị ngưỡng quy định.</li><li>Phân đoạn ảnh đóng vai trò sinh tử trong phát hiện ung thư vì nó giúp bác sĩ xác định chính xác hình dáng, kích thước và đường viền của tế bào (điều kiện tiên quyết để chẩn đoán mức độ bệnh), thay vì chỉ vẽ một hộp bao (bounding box) đơn thuần.</li><li>Phân đoạn ngữ nghĩa (Semantic segmentation) thực hiện phân loại và gán nhãn lớp ngữ nghĩa cho từng pixel (VD: vùng này là đường, vùng kia là xe) nhưng không thể phân biệt rạch ròi giữa 2 chiếc xe đứng cạnh nhau.</li><li>Phân đoạn thực thể (Instance segmentation) ưu việt hơn phân đoạn ngữ nghĩa ở chỗ nó không chỉ gán nhãn lớp mà còn tách biệt rõ ràng từng cá thể đối tượng độc lập trong cùng một lớp.</li><li>Đường viền chủ động (Active contours / Snakes) là một mô hình đường cong linh hoạt có khả năng tự động co giãn và uốn lượn bám sát vào đường viền của đối tượng dưới sự tác động của các lực nội tại và ngoại tại.</li><li>Các yếu tố then chốt trong phân tích đặc điểm khuôn mặt bao gồm khoảng cách giữa hai mắt, độ sâu của hốc mắt, khoảng cách từ trán đến cằm, và cấu trúc hình học của xương gò má, môi, tai.</li><li>SIFT (Scale-Invariant Feature Transform) là thuật toán trích xuất đặc trưng cục bộ cực kỳ mạnh mẽ, đặc trưng sinh ra có khả năng bất biến (không thay đổi) trước sự biến thiên về tỷ lệ thu phóng, phép xoay và điều kiện ánh sáng.</li><li>Một giá trị ngưỡng duy nhất hiếm khi đủ tốt cho phân đoạn ảnh thực tế bởi vì sự phân bố ánh sáng thường không đồng đều (có bóng đổ) và bản thân các đối tượng có sự đa dạng rất lớn về màu sắc nội bộ.</li><li>Phân đoạn chia và trộn (Split and merge) là thuật toán đệ quy chia bức ảnh thành 4 vùng nhỏ hơn nếu vùng đó không đồng nhất, và sau đó trộn các vùng lân cận lại với nhau nếu chúng có tính chất tương đồng.</li><li>Phép biến đổi lưu vực (Watershed) xem cường độ sáng của ảnh như một bản đồ địa hình 3D, mô phỏng quá trình \"bơm nước\" từ các thung lũng lên để tạo thành các đường đập phân thủy chia cắt đối tượng.</li><li>Phân chia vùng (Region splitting) là bước chia nhỏ liên tục một vùng ảnh cho đến khi tất cả các vùng con được sinh ra đều thỏa mãn tiêu chí đồng nhất về màu sắc hoặc độ sáng.</li><li>Mô hình hỗn hợp Gaussian (Gaussian Mixture Model - GMM) là một mô hình xác suất giả định rằng dữ liệu trong ảnh được tạo ra từ một tập hợp nhiều phân phối chuẩn Gaussian khác nhau, chuyên dùng để gom cụm (clustering).</li><li>Thuật toán K-means phân chia dữ liệu pixel thành K cụm bằng cách tính khoảng cách và gán liên tục mỗi pixel vào vị trí tâm cụm có màu sắc hoặc tọa độ không gian gần nó nhất.</li><li>Căn chỉnh dựa trên đặc trưng (Feature-based alignment) là bài toán tính toán ra một ma trận biến đổi hình học (như Homography) để khớp và chồng các ảnh lại với nhau dựa trên các cặp điểm đặc trưng.</li><li>Thuật toán RANSAC sử dụng cơ chế lặp lấy mẫu ngẫu nhiên để ước lượng các tham số mô hình toán học, cực kỳ hiệu quả trong việc phát hiện và loại bỏ các điểm khớp sai (outliers) ra khỏi bộ dữ liệu.</li><li>Ghép ảnh (Image stitching) là quá trình kết hợp nhiều bức ảnh chụp có vùng góc nhìn chồng lấp lại với nhau để tạo ra một bức ảnh toàn cảnh (panorama) liền mạch.</li><li>Điều chỉnh chùm tia (Bundle adjustment) trong ghép ảnh là quá trình tối ưu hóa phi tuyến tính đồng thời các tham số tư thế (pose parameters) của camera cho toàn bộ các ảnh nhằm giảm thiểu sai số ghép nối trên toàn hệ thống.</li><li>Thị sai (Parallax) là hiện tượng dịch chuyển tương đối của các vật thể ở khoảng cách khác nhau khi camera đổi góc nhìn; bắt buộc phải loại bỏ hiện tượng này để tránh tạo ra các bóng ma (ghosting) khi ghép ảnh panorama.</li><li>Phát hiện đối tượng (Object detection) là tác vụ thị giác máy tính nhằm tìm ra vị trí chính xác (khoanh vùng bằng hộp giới hạn - bounding box) và định danh phân lớp của các đối tượng có trong bức ảnh.</li><li>Biểu đồ dốc hướng (Histogram of Oriented Gradients - HOG) trích xuất đặc trưng bằng cách đếm tần suất hướng của gradient cục bộ, là bộ mô tả thành công và phổ biến nhất trong các bài toán phát hiện người đi bộ.</li><li>Mục đích của phân tích khuôn mặt (Face analysis) là nhận diện danh tính sinh trắc học hoặc trích xuất các thuộc tính phi danh tính (như đánh giá cảm xúc, giới tính, ước lượng tuổi tác).</li><li>Theo dõi đối tượng (Object tracking) là tác vụ gán một ID duy nhất cho đối tượng ở khung hình đầu tiên và liên tục cập nhật, bám đuổi vị trí hộp giới hạn của nó qua các khung hình liên tiếp trong video.</li><li>Các bước của thuật toán phát hiện biên Canny bao gồm: (1) Lọc nhiễu bằng Gaussian, (2) Tính toán Gradient, (3) Triệt tiêu phi cực đại để giữ lại đường biên mỏng, và (4) Phân ngưỡng kép (Hysteresis thresholding) để liên kết biên.</li><li>Quy trình ghép ảnh Panorama diễn ra qua các bước: (1) Trích xuất đặc trưng, (2) Ghép cặp đặc trưng, (3) Tính toán ma trận Homography bằng RANSAC, (4) Căn chỉnh toàn cục, và (5) Bẻ cong (Warping) và trộn mượt ảnh (Blending).</li><li>Quy trình căn chỉnh ảnh dựa trên đặc trưng bao gồm: (1) Tìm các Keypoints, (2) Tính toán Descriptors, (3) So khớp cặp điểm giữa 2 ảnh, (4) Dùng thuật toán RANSAC tính ma trận biến đổi để loại nhiễu, (5) Dùng ma trận đó để Warp ảnh.</li><li>Quy trình phân đoạn ảnh bằng K-means thực hiện qua: (1) Khởi tạo vị trí K tâm cụm ngẫu nhiên, (2) Gán pixel vào tâm có màu gần nhất, (3) Tính lại tọa độ tâm cụm mới dựa trên trung bình cộng, (4) Lặp lại bước 2-3 cho đến khi vị trí các tâm hội tụ.</li><li>Quy trình phát hiện khuôn mặt bằng HOG gồm: (1) Tính toán độ lớn và hướng gradient, (2) Chia ảnh thành các ô nhỏ (cells) và lập biểu đồ hướng, (3) Chuẩn hóa độ tương phản theo khối lớn (blocks), (4) Dùng vector HOG trích xuất được để huấn luyện bộ phân loại SVM.</li><li>Quy trình phát hiện đường thẳng bằng Hough Transform thực hiện bằng cách: (1) Tìm các điểm biên bằng Canny, (2) Chuyển tọa độ từng điểm biên thành đường cong hình sin trong không gian Hough, (3) Tích lũy số phiếu (Voting) tại các giao điểm, (4) Giao điểm có số phiếu cao nhất chính là phương trình của đường thẳng cần tìm.</li></ol><p>PE Exercise</p>"},{"id":"7.5","t":"Này là tôi đi mua cho các ông học đấy nhá, cạn lúa luôn rồiTổng hợp công thức sẽ sử dụng:","h":"<h4>Đại số Tuyến tính & Thống kê</h4><ul><li>Dot Product (Tích vô hướng): x · y = Σ (x_i * y_i)</li><li>Euclidean Distance (Khoảng cách Euclid): d(x,y) = √[ Σ (x_i - y_i)² ]</li><li>Cosine Similarity: cos(θ) = (x · y) / (||x|| * ||y||)</li><li>Mean (Trung bình): μ = (Σ x_i) / N</li><li>Variance (Phương sai): σ² = (Σ (x_i - μ)²) / N</li><li>Frobenius Norm: ||A||_F = √[ Σ |A_ij|² ]</li><li>Trace (Vết ma trận): Tr(A) = Σ A_ii (Tổng đường chéo chính)</li></ul><h4>Biến đổi Hình học (Geometric Transformations 2D)</h4><p>Sử dụng Hệ tọa độ đồng nhất [x, y, 1]^T:</p><ul><li>Translation (Tịnh tiến):<br>[x', y', 1]^T = [1 0 t_x ; 0 1 t_y ; 0 0 1] * [x, y, 1]^T</li><li>Scaling (Thu phóng):<br>[x', y', 1]^T = [s_x 0 0 ; 0 s_y 0 ; 0 0 1] * [x, y, 1]^T</li><li>Rotation (Xoay góc θ):<br>[x', y', 1]^T = [cosθ -sinθ 0 ; sinθ cosθ 0 ; 0 0 1] * [x, y, 1]^T</li></ul><h4>Lọc không gian (Spatial Filtering)</h4><ul><li>Convolution (Tích chập 1D): (f * g)[n] = Σ f[k] * g[n - k]</li><li>Median Filter (Lọc trung vị): y[n] = Median( x[n-k], ..., x[n+k] )</li></ul><h4>Phát hiện Biên và Góc (Edge & Corner Detection)</h4><ul><li>Gradient Magnitude (Độ lớn biên): G = √(I_x² + I_y²)</li><li>Gradient Direction (Hướng biên): θ = arctan(I_y / I_x)</li><li>Harris Corner Score: R = det(M) - k*(Tr(M))²<br>(Trong đó det(M) = λ1*λ2, Tr(M) = λ1 + λ2, k thường là 0.04)</li><li>Gaussian Distribution (Phân phối chuẩn - Lọc mịn):<br>G(x,y) = (1 / (2πσ²)) * exp( -(x² + y²) / (2σ²) )</li></ul>"},{"id":"7.6","t":"ALGEBRA REVIEW & TRANSFORMATIONS","h":"<h4>1.1. Algebra Review</h4><p><b>Dữ liệu ban đầu:</b></p><p><code>x = [2, 6, 6]^T<br>y = [1, 0, 1]^T<br>A = [10 20 30; 40 50 60; 70 80 90]<br>B = [110 120 130; 140 150 160; 170 180 190]</code></p><h4>1.1.1. Tính Tích vô hướng (Dot Product) của hai vector x, y:</h4><p>Tích vô hướng được tính bằng tổng của tích các phần tử tương ứng.</p><p>x · y = (2 * 1) + (6 * 0) + (6 * 1) = 2 + 0 + 6 = <b>8</b></p><h4>1.1.2. Độ tương đồng Cosine (Cosine Similarity) và Khoảng cách Euclidean:</h4><ul><li>Norm (Độ dài) vector x: ||x|| = √(2² + 6² + 6²) = √(4 + 36 + 36) = √76 ≈ 8.7178</li><li>Norm vector y: ||y|| = √(1² + 0² + 1²) = √2 ≈ 1.4142</li><li>Độ tương đồng Cosine: cos(θ) = (x · y) / (||x|| * ||y||) = 8 / (√76 * √2) = 8 / √152 ≈ 0.6489</li><li>Khoảng cách Euclidean: d(x,y) = √((2-1)² + (6-0)² + (6-1)²) = √(1 + 36 + 25) = √62 ≈ 7.8740</li></ul><h4>1.1.3. Tính Mean (Trung bình) và Standard Deviation (Độ lệch chuẩn) của ma trận A:</h4><p>Ma trận A có 9 phần tử. Tổng = 10+20+30+40+50+60+70+80+90 = 450.</p><ul><li>Mean (μ): 450 / 9 = 50.0</li><li>Phương sai (Variance - σ²): Tính trung bình của bình phương độ lệch so với Mean:<br>σ² = [(-40)² + (-30)² + ... + 40²] / 9 = 6000 / 9 = 666.67</li><li>Độ lệch chuẩn (Standard Deviation - σ): √666.67 ≈ 25.8199</li></ul><h4>1.1.4. Tính Tổng (Sum) và Tích (Product) của hai ma trận ảnh (Patches) A, B:</h4><p><b>Tổng A + B:</b></p><p><code>[ 120  140  160 ]<br>[ 180  200  220 ]<br>[ 240  260  280 ]<br>    </code></p><p><b>Tích A × B (Nhân ma trận):</b></p><p><code>[ 9000   9600   10200 ]<br>[ 21600  23100  24600 ]<br>[ 34200  36600  39000 ]</code></p><h4>1.1.5. Frobenius norm và Trace (Vết ma trận) của A, B:</h4><ul><li>Frobenius Norm của A (||A||_F): √(10² + 20² + ... + 90²) = √28500 ≈ 168.8194</li><li>Frobenius Norm của B (||B||_F): √(110² + ... + 190²) = √208500 ≈ 456.6180</li><li>Trace của A: Tổng đường chéo chính (10 + 50 + 90) = 150</li><li>Trace của B: Tổng đường chéo chính (110 + 150 + 190) = 450</li></ul><h4>1.1.6. Tính Nghịch đảo (Inverse) và Chuyển vị (Transpose) của A, B:</h4><p><b>Chuyển vị (Transpose):</b> Đổi hàng thành cột.</p><p><code>A^T = [10 40 70; 20 50 80; 30 60 90]<br>B^T = [110 140 170; 120 150 180; 130 160 190]  </code></p><p><b>Nghịch đảo (Inverse):</b> Định thức det(A) = 0 và det(B) = 0 do các hàng phụ thuộc tuyến tính (cấp số cộng). Do đó, <b>ma trận A và B không thể khả nghịch (Non-invertible / Singular matrix).</b></p><h4>1.1.7. Hệ số tương quan (Correlation Coefficient) giữa A và B:</h4><p>Quan sát ma trận, ta thấy B_ij = A_ij + 100. Đây là một mối quan hệ tuyến tính hoàn hảo. Do đó, hệ số tương quan Pearson giữa hai ma trận là <b>1.0</b>.</p><h4>1.2. Image Transformations (Biến đổi hình học 2D)</h4><p><b>Tọa độ 4 pixels ban đầu:</b> A(10, -10), B(20, 10), C(-10, 0), D(-20, -10).</p><p>Mọi phép biến đổi sẽ dùng tọa độ đồng nhất [x, y, 1]^T nhân với ma trận biến đổi tương ứng.</p><h4>1.2.2. Dịch chuyển (Shift) ảnh 5 pixels theo chiều ngang:</h4><p>Công thức: x' = x + 5, y' = y</p><p><code>A'(15, -10); B'(25, 10); C'(-5, 0); D'(-15, -10)</code></p><h4>1.2.3. Thu phóng (Scale) ảnh 2 lần:</h4><p>Công thức: x' = 2x, y' = 2y</p><p><code>A'(20, -20); B'(40, 20); C'(-20, 0); D'(-40, -20)</code></p><h4>1.2.4. Xoay (Rotate) ảnh 60 độ cùng chiều kim đồng hồ (θ = -60°):</h4><p>Sử dụng ma trận xoay R(θ) = [cos(-60°) -sin(-60°); sin(-60°) cos(-60°)] = [0.5, 0.866; -0.866, 0.5].</p><ul><li>A': x = 10(0.5) -10(0.866) = -3.66 | y = 10(-0.866) -10(0.5) = -13.66</li><li>B': x = 20(0.5) + 10(0.866) = 18.66 | y = 20(-0.866) + 10(0.5) = -12.32</li><li>C': (-5, 8.66)</li><li>D': (-18.66, 12.32)</li></ul><h4>1.2.5. Xoay 45 độ ngược chiều kim đồng hồ (θ = 45°) & Scale 1.5 lần:</h4><p>Ma trận kết hợp = 1.5 * [cos(45°) -sin(45°); sin(45°) cos(45°)] = [1.061 -1.061; 1.061 1.061]</p><p><code>A'(21.22, 0)<br>B'(10.61, 31.83)<br>C'(-10.61, -10.61)<br>D'(-10.61, -31.83)</code></p>"},{"id":"7.7","t":"IMAGE PROCESSING (THỐNG KÊ VÀ LỌC ẢNH)","h":"<h4>2.1. Thống kê cấp độ xám (Grayscale Statistics)</h4><p>Nếu ta có một khối ảnh (patch) một chiều (1D) A = [1, 3, 4, 5, 7, 8, 7, 12]. Ta sẽ thực hành phân tích trực tiếp trên mảng này.</p><h4>2.1.1 & 2.1.2. Tính Mean, Median, Mode, Variance, và Tần suất tương đối:</h4><ul><li>Sắp xếp: [1, 3, 4, 5, 7, 7, 8, 12]</li><li>Mean: (1+3+4+5+7+7+8+12) / 8 = 47 / 8 = 5.875</li><li>Median (Trung vị): Giá trị ở giữa (5 và 7) =&gt; (5 + 7) / 2 = 6.0</li><li>Mode (Yếu vị): Số xuất hiện nhiều nhất là 7 (2 lần).</li><li>Variance (Phương sai): (Σ(x - 5.875)²) / 8 ≈ 10.11</li><li>Tần suất tương đối (Relative Frequency): Số 7 chiếm tỷ lệ 2/8 = 25%. Các số còn lại mỗi số chiếm 1/8 = 12.5%.</li></ul><h4>2.1.5. Histogram Equalization (Cân bằng lược đồ xám):</h4><p>Giả sử ảnh 8-bit (Max = 255). Tính CDF (Xác suất tích lũy) và nhân với 255:</p><table><tr><th><div><b>Giá trị cũ</b></div></th><th><div><b>PDF</b></div></th><th><div><b>CDF</b></div></th><th><div><b>Giá trị mới (CDF * 255)</b></div></th></tr><tr><td><div>1</div></td><td><div>0.125</div></td><td><div>0.125</div></td><td><div>32</div></td></tr><tr><td><div>3</div></td><td><div>0.125</div></td><td><div>0.250</div></td><td><div>64</div></td></tr><tr><td><div>4</div></td><td><div>0.125</div></td><td><div>0.375</div></td><td><div>96</div></td></tr><tr><td><div>5</div></td><td><div>0.125</div></td><td><div>0.500</div></td><td><div>128</div></td></tr><tr><td><div>7</div></td><td><div>0.250</div></td><td><div>0.750</div></td><td><div>191</div></td></tr><tr><td><div>8</div></td><td><div>0.125</div></td><td><div>0.875</div></td><td><div>223</div></td></tr><tr><td><div>12</div></td><td><div>0.125</div></td><td><div>1.000</div></td><td><div>255</div></td></tr></table><h4>2.2. Kỹ thuật lọc Không gian (Spatial Filtering)</h4><p>Dữ liệu dòng ảnh: A = [1, 3, 4, 5, 7, 8, 7, 12].</p><h4>2.2.1. Áp dụng Lọc Median cửa sổ 3x1 (Padding: Zero):</h4><p>A_padded = [0, 1, 3, 4, 5, 7, 8, 7, 12, 0]</p><ul><li>Tại index 0 (cửa sổ 0,1,3): Median = 1</li><li>Tại index 1 (cửa sổ 1,3,4): Median = 3</li><li>Tại index 2 (cửa sổ 3,4,5): Median = 4</li><li>Kết quả đầu ra toàn mảng: [1, 3, 4, 5, 7, 7, 8, 7]</li></ul><h4>2.2.2. Tích chập (Convolution) với Kernel K1 = [-1, 0, 1]:</h4><p>Công thức: Output[i] = -1 * A[i-1] + 0 * A[i] + 1 * A[i+1].</p><ul><li>Index 0 (Giá trị 1): -1*(0) + 0*(1) + 1*(3) = 3</li><li>Index 1 (Giá trị 3): -1*(1) + 0*(3) + 1*(4) = 3</li><li>Index 2 (Giá trị 4): -1*(3) + 0*(4) + 1*(5) = 2</li><li>Index 3 (Giá trị 5): -1*(4) + 0*(5) + 1*(7) = 3</li><li>Kết quả với Stride = 1: [3, 3, 2, 3, 3, 0, 4, -7]</li><li>Với Stride = 2, ta chỉ lấy các kết quả ở bước nhảy cách 1 phần tử: [3, 2, 3, 4]</li></ul>"},{"id":"7.8","t":"EDGE AND FEATURE DETECTION","h":"<h4>3.1. Đạo hàm Rời rạc bằng Convolution</h4><p>Chứng minh rằng có thể xấp xỉ đạo hàm bậc 1 của hàm số rời rạc f(x) bằng Kernel Convolution:</p><ul><li>Forward [0, -1, 1]: Tích chập ngược trả về công thức f(x+1) - f(x). Đây là sai phân tiến.</li><li>Backward [-1, 1, 0]: Trả về f(x) - f(x-1). Đây là sai phân lùi.</li><li>Central [-1, 0, 1]: Trả về f(x+1) - f(x-1). Đại diện cho độ dốc qua điểm trung tâm.</li></ul><h4>3.2. Tìm Vị trí Biên (Edge Location)</h4><p>Dòng pixel 1D: P = [39, 40, 43, 46, 59, 69, 88, 98, 109, 115, 121, 128, 132]</p><p>Áp dụng Central Kernel [-1, 0, 1] để tìm cường độ thay đổi lớn nhất:</p><ul><li>Tại x=43: 46 - 40 = 6</li><li>Tại x=46: 59 - 43 = 16</li><li>Tại x=59: 69 - 46 = 23</li><li>Tại x=69: 88 - 59 = 29 (Đỉnh Đạo hàm)</li><li>Tại x=88: 98 - 69 = 29 (Đỉnh Đạo hàm)</li><li>Tại x=98: 109 - 88 = 21</li></ul><p><b>Kết luận:</b> Biên (Edge) nằm ở vị trí có giá trị thay đổi cường độ đột ngột và mạnh nhất. Các pixel tạo thành biên sắc nét nhất là <b>69 và 88</b>.</p><h4>3.3 & 3.4. Gradient và Tính Điểm Harris Corner</h4><p>Khi áp dụng các bộ lọc đạo hàm (Sobel, Prewitt, hoặc đạo hàm rời rạc [1, -1] lên ma trận ảnh 2D), chúng ta tính được Gradient cho trục X (I_x) và trục Y (I_y).</p><ul><li>Độ lớn Gradient (Magnitude): G = √(I_x² + I_y²)</li><li>Hướng Gradient (Direction): θ = arctan(I_y / I_x)</li></ul><p><b>Tính điểm Harris (Harris Corner Score):</b></p><p>Sử dụng ma trận cấu trúc (Structure Tensor) <b>M = [ Σ I_x², Σ I_x I_y ; Σ I_x I_y, Σ I_y² ]</b></p><p>Điểm R = det(M) - k * (Trace(M))², với k = 0.04. Nếu R có giá trị dương rất lớn (λ1 và λ2 đều lớn), điểm đó được xác nhận là một <b>Corner (Góc)</b>. Ngược lại, nếu R âm, nó là <b>Biên (Edge)</b>.</p><p><i>Nếu mọi người khum chê chữ xấu thì có thể tham khảo:</i></p><p><span class=\"img-ph\">[hình minh hoạ]</span></p><p><span class=\"img-ph\">[hình minh hoạ]</span></p><p><span class=\"img-
