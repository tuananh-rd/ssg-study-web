s in the Fourier transform of a signal?","options":["A higher sampling rate increases frequency accuracy.","A lower sampling rate increases frequency accuracy.","It has no effect on frequency representation.","A higher sampling rate decreases frequency accuracy."],"answer":[0],"explanation":"**Đáp án đúng: A higher sampling rate increases frequency accuracy.** Tần số lấy mẫu cao hơn mở rộng dải tần biểu diễn được (Nyquist $f_s/2$) và giảm aliasing, nên phổ Fourier phản ánh tín hiệu chính xác hơn.\n- Sampling rate thấp gây aliasing, làm sai tần số.\n- Sampling rate chắc chắn ảnh hưởng đến biểu diễn tần số."},{"id":206,"slide":232,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu trung bình","question":"How does the scale-invariance property benefit feature detection and matching algorithms?","options":["It allows features to be detected regardless of their size.","It reduces the computational complexity of feature matching.","It enhances the overall image resolution.","It improves color consistency across images."],"answer":[0],"explanation":"**Đáp án đúng: It allows features to be detected regardless of their size.** Bất biến tỉ lệ nghĩa là cùng một cấu trúc vẫn được phát hiện khi zoom in/out.\n- Không nhằm giảm độ phức tạp tính toán.\n- Không tăng độ phân giải hay cải thiện tính nhất quán màu."},{"id":207,"slide":233,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu trung bình","question":"How does SIFT achieve scale invariance in feature detection?","options":["By downscaling the image at different resolutions","By using an adaptive window size for feature detection","By applying a Gaussian filter to the entire image","By normalizing pixel intensities across the image"],"answer":[0],"explanation":"**Đáp án đúng: By downscaling the image at different resolutions.** SIFT xây scale-space (pyramid nhiều octave, làm mờ Gaussian và thu nhỏ ảnh), rồi tìm cực trị DoG qua các tỉ lệ.\n- Cửa sổ thích nghi không phải cơ chế của SIFT.\n- Chỉ lọc Gaussian trên một tỉ lệ thì không đạt scale invariance.\n- Chuẩn hoá cường độ giúp với độ sáng, không phải tỉ lệ."},{"id":208,"slide":234,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu trung bình","question":"How does feature-based alignment achieve image alignment between two images?","options":["By directly comparing pixel values between images","By detecting and matching a sparse set of features","By applying random transformations to the images","By segmenting the images into regions"],"answer":[1],"explanation":"**Đáp án đúng: By detecting and matching a sparse set of features.** Feature-based alignment tìm keypoint, ghép descriptor, rồi ước lượng phép biến đổi (ví dụ dùng RANSAC).\n- So sánh trực tiếp giá trị pixel là direct (pixel-based) alignment.\n- Biến đổi ngẫu nhiên và phân vùng ảnh không phải cách tiếp cận này."},{"id":209,"slide":235,"topic":"Nhận dạng & học máy","section":"Câu trung bình","question":"How can facial landmarks be helpful in face detection and recognition?","options":["By providing anchor points for accurate face alignment.","By directly identifying a person's unique facial features.","By segmenting the face region from the background.","By estimating the age and gender of the person in the image."],"answer":[0],"explanation":"**Đáp án đúng: By providing anchor points for accurate face alignment.** Landmark (mắt, mũi, miệng) cho phép căn chỉnh khuôn mặt về dạng chuẩn trước khi nhận dạng.\n- Landmark không tự nó xác định danh tính.\n- Không dùng để tách nền hay ước lượng tuổi/giới tính (đó là các tác vụ riêng)."},{"id":210,"slide":236,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu trung bình","question":"When detecting lines using Hough Transform, after voting, how are the lines detected in the image?","options":["All bins with non-zero votes are considered lines.","Lines are formed by connecting all edge points that participated in a specific bin.","Lines are identified by locating the peaks (highest vote counts) in the parameter space.","The Hough Transform directly outputs line segments based on the voting process."],"answer":[2],"explanation":"**Đáp án đúng: Lines are identified by locating the peaks (highest vote counts) in the parameter space.** Sau khi voting trong accumulator $(\\rho, \\theta)$, các đỉnh (local maxima vượt ngưỡng) tương ứng các đường thẳng.\n- Bin có phiếu khác 0 chưa chắc là đường (có thể do nhiễu).\n- Hough cho tham số đường thẳng chứ không trực tiếp cho đoạn thẳng."},{"id":211,"slide":237,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu trung bình","question":"When preventing aliasing, what additional step may be required before applying a shearing transformation in image processing?","options":["Downsampling in the both directions","Applying a non-separable filter kernel","Adjusting the color space transformation","Upsampling in the opposite direction"],"answer":[3],"explanation":"**Đáp án đúng: Upsampling in the opposite direction.** Khi tách biến đổi shear thành các bước 1D, cần upsample theo hướng ngược lại trước để tránh mất mẫu và aliasing khi shear.\n- Downsampling cả hai hướng làm mất chi tiết.\n- Non-separable kernel và đổi color space không giải quyết vấn đề này."},{"id":212,"slide":238,"topic":"Lọc ảnh & tích chập","section":"Câu trung bình","question":"Why is pre-filtering necessary to prevent aliasing in computer graphics?","options":["To enhance image resolution","To reduce the computational cost","To minimize distortion during texture mapping","To maintain a consistent resampling rate"],"answer":[2],"explanation":"**Đáp án đúng: To minimize distortion during texture mapping.** Pre-filtering (low-pass trước khi lấy mẫu lại) loại bỏ tần số cao vượt Nyquist, giảm aliasing và méo khi ánh xạ texture.\n- Không nhằm tăng độ phân giải.\n- Mục đích chính không phải giảm chi phí tính toán."},{"id":213,"slide":239,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu trung bình","question":"Edge detection techniques in segmentation aim to identify:","options":["Regions with uniform color or intensity.","Boundaries between distinct image regions.","Areas with high texture and local variations.","The presence of specific objects or shapes in the image."],"answer":[1],"explanation":"**Đáp án đúng: Boundaries between distinct image regions.** Edge detection tìm các điểm có thay đổi cường độ đột ngột, tức là biên giữa các vùng.\n- Vùng đồng nhất là mục tiêu của region-based segmentation.\n- Vùng nhiều texture hay nhận dạng đối tượng cụ thể là tác vụ khác."},{"id":214,"slide":240,"topic":"Chuyển động & optical flow","section":"Câu trung bình","question":"It is the motion of objects between consecutive frames of the sequence, caused by the relative movement between the object and camera. What is the exact name of this process?","options":["What is the exact name of this process?","Image stitching","Optical flow","Object moving"],"answer":[2],"explanation":"**Đáp án đúng: Optical flow.** Optical flow là trường chuyển động biểu kiến của các pixel giữa các frame liên tiếp do chuyển động tương đối giữa vật thể và camera.\n- Image stitching là ghép ảnh thành panorama.\n- \"Object moving\" không phải thuật ngữ chuẩn."},{"id":215,"slide":241,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu trung bình","question":"In the context of mesh-based warping, what is a \"mesh\"?","options":["A collection of vertices and edges","A visual distortion effect","A 2D matrix of pixel intensity","A type of texture map with 2D dimension"],"answer":[0],"explanation":"**Đáp án đúng: A collection of vertices and edges.** Trong mesh-based warping, ảnh được chia bằng lưới các đỉnh (control points) và cạnh, và mỗi ô được warp theo vị trí đỉnh mới.\n- Không phải hiệu ứng méo hình trực quan.\n- Không phải ma trận cường độ hay texture map."},{"id":216,"slide":242,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu trung bình","question":"In Harris corner detector, after computing score R which determine if a window can contain a corner or not. When does the window contain a corner?","options":["|R| is small and λ1, λ2 are small","|R| is large and λ1 ≈ λ2","|R| < 0 and λ1 >> λ2","cannot determine |R|"],"answer":[1],"explanation":"**Đáp án đúng: |R| is large and λ1 ≈ λ2.** Harris dùng $R = \\det(M) - k\\,\\mathrm{trace}(M)^2$; góc có $R$ lớn dương, cả hai eigenvalue lớn và gần bằng nhau.\n- $|R|$ nhỏ và cả hai λ nhỏ: vùng phẳng.\n- $R < 0$ và $\\lambda_1 \\gg \\lambda_2$: cạnh (edge)."},{"id":217,"slide":244,"topic":"Phân đoạn & phân cụm","section":"Câu trung bình","question":"In K-means for Segmentation, what is the meaning of K value?","options":["It represents the number of clusters.","It represents the number of images.","It represents the step of clusters.","It represents the color groups."],"answer":[0],"explanation":"**Đáp án đúng: It represents the number of clusters.** Trong K-means, $K$ là số cụm; mỗi pixel (theo màu/vị trí) được gán cho tâm cụm gần nhất, mỗi cụm tạo một vùng.\n- Không phải số ảnh hay bước lặp.\n- \"Color groups\" chỉ đúng khi đặc trưng là màu, không phải định nghĩa tổng quát của $K$."},{"id":218,"slide":245,"topic":"Phân đoạn & phân cụm","section":"Câu trung bình","question":"In image segmentation, which is the limitation of using region growing methods?","options":["Difficulty handling objects with disconnected parts.","Inability to segment images with multiple dominant colors.","High sensitivity to noise and slight intensity variations.","Significant computational cost for processing large images."],"answer":[2],"explanation":"**Đáp án đúng: High sensitivity to noise and slight intensity variations.** Region growing dựa trên tiêu chí tương đồng với seed nên nhiễu hoặc thay đổi cường độ nhỏ làm vùng dừng sớm hoặc rò rỉ.\n- Vẫn có thể xử lý các vùng nhiều màu nếu chọn nhiều seed.\n- Chi phí tính toán không phải nhược điểm chính."},{"id":219,"slide":246,"topic":"Tổng quan & toán cơ bản","section":"Câu trung bình","question":"Pixel operator is a function is used to process pixel forest. What are the input and output of pixel operators? Choose the best correct answer.","options":["Input is an image and output is an image.","Input is an image and output is the images.","Input is one or more images and output is the images.","Input is one or more images and output is an image."],"answer":[3],"explanation":"**Đáp án đúng: Input is one or more images and output is an image.** Pixel operator $g(x) = h(f_0(x), \\dots, f_n(x))$ nhận một hoặc nhiều ảnh đầu vào và cho ra một ảnh.\n- Chỉ nhận một ảnh là thiếu trường hợp nhiều ảnh (ví dụ blending, difference).\n- Đầu ra là một ảnh, không phải nhiều ảnh."},{"id":220,"slide":247,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu trung bình","question":"How does convolution-based line detection contribute to the field of autonomous vehicles and robotics?","options":["By identifying lane boundaries.","By enhancing image resolution.","By calculating pixel intensities.","By applying a median filter to reduce noise."],"answer":[0],"explanation":"**Đáp án đúng: By identifying lane boundaries.** Line detection bằng convolution/Hough tìm các đường thẳng như vạch kẻ làn đường, hữu ích cho xe tự hành và robot.\n- Tăng độ phân giải không phải việc của line detection.\n- Median filter là lọc nhiễu, không phải phát hiện đường."},{"id":221,"slide":248,"topic":"Nhận dạng & học máy","section":"Câu trung bình","question":"Some traditional face recognition systems require user enrollment, which involves:","options":["Calibrating the camera for optimal lighting conditions.","Capturing multiple face images of an individual from different angles.","Training the recognition algorithm on a large dataset of faces.","Specifying facial landmarks for each enrolled individual."],"answer":[1],"explanation":"**Đáp án đúng: Capturing multiple face images of an individual from different angles.** Enrollment là đăng ký người dùng: chụp nhiều ảnh (nhiều góc, biểu cảm) để lưu làm mẫu tham chiếu.\n- Hiệu chỉnh camera và huấn luyện trên tập lớn là bước khác.\n- Landmark thường được phát hiện tự động chứ không do người dùng chỉ định."},{"id":222,"slide":249,"topic":"Miền tần số & Fourier","section":"Câu trung bình","question":"What is the consequence of the Parseval's theorem in the context of the Fourier transform?","options":["It relates to the energy in the time and frequency domain.","It guarantees that the Fourier transform is reversible.","It establishes a connection between amplitude and frequency.","It ensures that the Fourier transform is always real-valued."],"answer":[0],"explanation":"Định lý Parseval phát biểu rằng tổng năng lượng của tín hiệu trong miền thời gian bằng tổng năng lượng của tín hiệu trong miền tần số, giúp phân tích và xử lý tín hiệu hiệu quả."},{"id":223,"slide":250,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu trung bình","question":"What is not the advantage of Canny Operator?","options":["It has good localization.","It extracts image features without altering the features.","Less sensitive to noise.","True zero crossing."],"answer":[3],"explanation":"Canny có các ưu điểm như định vị biên tốt (good localization), ít nhạy với nhiễu (less sensitive to noise) và phát hiện biên chính xác. True zero crossing là đặc trưng của các phương pháp phát hiện biên dựa trên Laplacian of Gaussian (LoG), không phải ưu điểm của Canny."},{"id":224,"slide":251,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu trung bình","question":"How does the Prewitt operator differ from the Sobel operator in edge detection?","options":["It uses different kernel.","It uses a 3×3 convolution kernel.","It is less sensitive to diagonal edges.","It does not involve convolution with a kernel."],"answer":[0],"explanation":"Cả Prewitt và Sobel đều sử dụng kernel 3×3, nhưng giá trị của các kernel khác nhau. Sobel đặt trọng số lớn hơn ở hàng hoặc cột trung tâm nên nhạy hơn với biên."},{"id":225,"slide":252,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu trung bình","question":"What is the primary objective of global alignment in image registration?","options":["Minimizing the distortion within individual images.","Minimizing the number of matched features between images.","Finding a globally consistent set of alignment parameters.","Focusing on global details within the images."],"answer":[2],"explanation":"Global alignment nhằm đảm bảo tất cả các ảnh được căn chỉnh theo một hệ quy chiếu thống nhất, giảm sai lệch tích lũy và cải thiện chất lượng ghép ảnh."},{"id":226,"slide":253,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu trung bình","question":"How are elements selected for the histogram bins in HOG calculation?","options":["Randomly assigned based on pixel values","Based on the brightness of pixels","Based on the direction of gradients","Based on the size of objects in the image"],"answer":[2],"explanation":"**Đáp án đúng: Based on the direction of gradients.** Trong HOG, mỗi pixel bỏ phiếu vào bin hướng (orientation) theo hướng gradient, trọng số theo độ lớn gradient.\n- Không gán ngẫu nhiên.\n- Độ sáng pixel hay kích thước đối tượng không quyết định bin."},{"id":227,"slide":255,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu dài","question":"What is the primary purpose of applying Gaussian filter in Canny edge detection algorithm?","options":["To sharpen the image and enhance high-frequency details.","To reduce noise in the image, preventing it from influencing the edge detection process.","To increase the overall contrast of the image for better edge visualization.","To remove objects or regions of interest from the image before edge detection."],"answer":[1],"explanation":"**Đáp án đúng: To reduce noise in the image, preventing it from influencing the edge detection process.** Gaussian làm mờ nhẹ để gradient không phản ứng với nhiễu.\n- Làm sắc nét sẽ khuếch đại nhiễu, ngược mục đích.\n- Không tăng contrast.\n- Không loại bỏ vùng quan tâm."},{"id":228,"slide":256,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu dài","question":"What is the mechanism of Laplacian of Gaussian?","options":["Gaussian-based operator relies on random level transitions in the image","Gaussian-based operator employs the Laplacian to compute the first derivative of an image","Gaussian-based operator uses the zero-crossing method based on the first-order derivative","Gaussian-based operator employs the Laplacian to calculate the second derivative of an image, detecting edges at zero crossings"],"answer":[3],"explanation":"**Đáp án đúng: ... employs the Laplacian to calculate the second derivative of an image, detecting edges at zero crossings.** LoG làm mờ Gaussian rồi áp Laplacian $\\nabla^2$; biên nằm tại điểm zero-crossing của đạo hàm bậc hai.\n- Laplacian là đạo hàm bậc hai, không phải bậc nhất.\n- Không dựa trên \"random level transitions\"."},{"id":229,"slide":257,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu dài","question":"What is true about the global alignment?","options":["It finds the image registration parameters that best comply with the constraints introduced by the image matching","It finds a globally inconsistent set of alignment parameters that minimize the mis-registration between all pairs of images","It finds the image registration parameters that suitably comply with the constraints introduced by the image matching","It finds a globally inconsistent set of alignment parameters that maximize the mis-registration between all pairs of images"],"answer":[0],"explanation":"**Đáp án đúng: It finds the image registration parameters that best comply with the constraints introduced by the image matching.** Global alignment tìm tập tham số đăng ký nhất quán toàn cục, tối thiểu hoá sai số ghép giữa các cặp ảnh.\n- \"Globally inconsistent\" mâu thuẫn với mục tiêu.\n- \"Maximize mis-registration\" sai hướng tối ưu.\n- Phương án \"suitably comply\" kém chính xác hơn \"best comply\"."},{"id":230,"slide":258,"topic":"Tổng quan & toán cơ bản","section":"Câu dài","question":"What is computer vision?","options":["Computer Vision uses images and videos to understand a real-world scene.","Just like Humans use eyes for capturing light, receptors in the brain for accessing it, and the visual cortex for processing it.","It makes a computer understand images, videos.","All of the answers"],"answer":[3],"explanation":"**Đáp án đúng: All of the answers.** Computer vision dùng ảnh/video để hiểu cảnh thực, mô phỏng hệ thị giác người (mắt thu sáng, não xử lý) và giúp máy hiểu ảnh/video.\n- Cả ba mô tả đều đúng nên chọn đáp án gộp."},{"id":231,"slide":259,"topic":"Tổng quan & toán cơ bản","section":"Câu dài","question":"What is computer vision?","options":["Computer Vision is a field of computer science that enables the computer to understand just like a human.","Computer Vision is the analysis and manipulation of a digitized image, especially in order to improve its quality.","Computer Vision is the study of computers and computational systems like electrical and computer engineers.","Computer Vision is a task defined as the technical analysis of an image by using complex algorithms."],"answer":[0],"explanation":"Computer Vision là một lĩnh vực của khoa học máy tính cho phép máy tính hiểu và diễn giải hình ảnh giống như con người (Computer Vision is a field of computer science that enables the computer to understand just like a human). Computer Vision giúp máy tính thu nhận, phân tích và hiểu thông tin từ hình ảnh hoặc video để thực hiện các nhiệm vụ như nhận dạng đối tượng, phát hiện khuôn mặt và phân đoạn ảnh."},{"id":232,"slide":260,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu dài","question":"What is the benefit of using feature-based alignment techniques?","options":["It significantly reduces the file size of images.","It automatically adjusts image brightness and contrast for consistency.","It enables robust alignment even with image variations like rotation or scale changes.","It simplifies image editing tasks by automatically cropping unnecessary areas."],"answer":[2],"explanation":"**Đáp án đúng: It enables robust alignment even with image variations like rotation or scale changes.** Đặc trưng bất biến (như SIFT) cho phép ghép ảnh dù có xoay, đổi tỉ lệ.\n- Không giảm kích thước file.\n- Không tự chỉnh sáng/tương phản.\n- Không tự động crop."},{"id":233,"slide":261,"topic":"Lọc ảnh & tích chập","section":"Câu dài","question":"What is image filter? Choose the best answer","options":["Filtering is a technique for modifying or enhancing an image.","Filters are just systems that form a new, and preferably enhanced, image from a combination of the original image's pixel values.","Filtering is a neighborhood operation, in which the value of any given pixel in the output image is determined by applying some algorithm to the values of the pixels in the neighborhood of the corresponding input pixel.","All of the others"],"answer":[3],"explanation":"**Đáp án đúng: All of the others.** Ba mô tả đều đúng: lọc là kỹ thuật chỉnh sửa/tăng cường ảnh; là hệ thống tạo ảnh mới từ tổ hợp giá trị pixel gốc; là phép toán lân cận (neighborhood operation)."},{"id":234,"slide":262,"topic":"Màu sắc & histogram","section":"Câu dài","question":"What is the difference between Phong model of light sources and the reality?","options":["Phong assumes infinite light sources, while in reality, shadows and inter-reflections occur","Phong assumes diffuse light only, while in reality, discrete light sources create shadows","Phong assumes continuous light sources, while in reality, inter-reflections are negligible","Phong assumes direct light paths, while in reality, sources may be shadowed, and inter-reflections occur"],"answer":[3],"explanation":"**Đáp án đúng: Phong assumes direct light paths, while in reality, sources may be shadowed, and inter-reflections occur.** Phong là mô hình cục bộ: chỉ tính ánh sáng trực tiếp, bỏ qua bóng đổ và phản xạ qua lại.\n- Phong không giả định nguồn sáng vô hạn như phương án 1 mô tả.\n- Phong có cả diffuse và specular.\n- Inter-reflection không thể bỏ qua trong thực tế."},{"id":235,"slide":263,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu dài","question":"What is bundle adjustment primarily used for in image processing?","options":["Adding new images to a panorama","Adjusting the pose parameters for an image to reduce size of an image","Simultaneously adjusting pose parameters for a large collection of overlapping images","Aligning images in a sequential manner"],"answer":[2],"explanation":"**Đáp án đúng: Simultaneously adjusting pose parameters for a large collection of overlapping images.** Bundle adjustment tối ưu đồng thời pose camera (và điểm 3D) bằng cách tối thiểu hoá reprojection error.\n- Không phải thêm ảnh vào panorama.\n- Không giảm kích thước ảnh.\n- Không căn chỉnh tuần tự."},{"id":236,"slide":264,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu dài","question":"What is the core concept behind the Hough Transform?","options":["It transforms edge points in the image space to a parameter space to identify lines.","It directly identifies lines in an image based on pixel intensity changes.","It segments the image into connected regions to form line segments.","It requires manually specifying the starting and ending points of lines to be detected."],"answer":[0],"explanation":"**Đáp án đúng: It transforms edge points in the image space to a parameter space to identify lines.** Mỗi điểm biên bỏ phiếu cho các tham số đường thẳng; đường thật tạo đỉnh trong accumulator.\n- Không trực tiếp suy ra đường từ cường độ pixel.\n- Không phân vùng liên thông.\n- Không cần chỉ định điểm đầu cuối thủ công."},{"id":237,"slide":265,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu dài","question":"What is a key advantage of the Canny algorithm compared to simpler edge detection methods?","options":["It is significantly faster to compute and requires minimal processing power.","It is highly sensitive to noise and can easily miss important edges.","It combines multiple steps to achieve robust edge detection, including noise reduction, gradient calculation, and non-maximum suppression.","It can directly identify the specific color of edges in the image."],"answer":[2],"explanation":"**Đáp án đúng: It combines multiple steps to achieve robust edge detection, including noise reduction, gradient calculation, and non-maximum suppression.** Canny gồm Gaussian smoothing, gradient, NMS và hysteresis thresholding.\n- Không nhanh hơn các phương pháp đơn giản.\n- Nó chống nhiễu tốt, không nhạy nhiễu.\n- Không xác định màu của biên."},{"id":238,"slide":266,"topic":"Lọc ảnh & tích chập","section":"Câu dài","question":"What is true about the Elliptical Weighted Average (EWA) filter?","options":["It relies on a single-pixel computation","Affine mapping introduces a skewed two-dimensional coordinate system in the distance of each source pixel x","Ellipsoidal projection of a small pixel grid in source pixel onto destination pixel is computed","Gaussian filtering whose inverse covariance matrix is this ellipsoid is used"],"answer":[3],"explanation":"**Đáp án đúng: Gaussian filtering whose inverse covariance matrix is this ellipsoid is used.** EWA dùng bộ lọc Gaussian có ma trận hiệp phương sai nghịch đảo xác định bởi elip, là ảnh của pixel đích trong không gian nguồn.\n- Không phải tính trên một pixel đơn.\n- Phương án về affine mapping và phép chiếu ellipsoid mô tả bước trung gian không chính xác.\nLưu ý: câu có phần mơ hồ; theo bộ đề chọn phương án Gaussian."},{"id":239,"slide":267,"topic":"Phân đoạn & phân cụm","section":"Câu dài","question":"What is true about image segmentation?","options":["An image is broken into many regions using the characteristics of pixels to identify objects","The representation of an image is changed into something containing more complex information to analyze","Color is assigned to every pixel of an image","Not at all"],"answer":[0],"explanation":"**Đáp án đúng: An image is broken into many regions using the characteristics of pixels to identify objects.** Segmentation chia ảnh thành các vùng dựa trên đặc tính pixel (màu, cường độ, texture).\n- Không phải chuyển sang biểu diễn phức tạp hơn.\n- Không phải gán màu cho từng pixel."},{"id":240,"slide":268,"topic":"Phân đoạn & phân cụm","section":"Câu dài","question":"What is meant by image segmentation in image processing?","options":["Image segmentation is the division of an image into regions or categories, which correspond to different objects or parts of objects.","Image segmentation is a method in which a digital image is broken down into various subgroups based their color or position.","All of the others","None of the others"],"answer":[2],"explanation":"**Đáp án đúng: All of the others.** Cả hai mô tả đều đúng: chia ảnh thành vùng/lớp tương ứng các đối tượng hoặc phần của đối tượng, và chia thành các nhóm con theo màu hoặc vị trí."},{"id":241,"slide":270,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu dài","question":"What is the Difference Between Cylindrical and Spherical Panoramas?","options":["By using spherical panoramas you can effortlessly capture any area in all directions.","Cylindrical panoramas cover an entire 360 degree, except for the up and down view.","Spherical panoramas on the other hand not only capture the 360-degree view but also take into account the horizontal and vertical view.","Cylindrical panoramas are the best of the lot, as they can be taken without the tripod being seen or the photographer's shadow."],"answer":[2],"explanation":"**Đáp án đúng: Spherical panoramas ... take into account the horizontal and vertical view.** Spherical panorama phủ toàn bộ 360° ngang và dọc; cylindrical chỉ phủ 360° ngang, thiếu phần trên/dưới.\n- Phương án 1 và 2 là mô tả đúng một phần nhưng không nêu sự khác biệt như phương án 3.\n- Phương án 4 là nhận xét chủ quan, không phải khác biệt kỹ thuật."},{"id":242,"slide":271,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu dài","question":"What is translation transformation?","options":["We rotate the object at a particular angle θ (theta) from its origin","It moves an object to a different position on the screen.","It changes the size of an object.","It is scaling, skewing, and rotation."],"answer":[1],"explanation":"**Đáp án đúng: It moves an object to a different position on the screen.** Translation dịch chuyển đối tượng theo $(t_x, t_y)$, giữ nguyên hình dạng và kích thước.\n- Xoay theo góc $\\theta$ là rotation.\n- Đổi kích thước là scaling.\n- Scaling, skewing, rotation gộp lại không phải định nghĩa của translation."},{"id":243,"slide":272,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu dài","question":"What is the main approach of feature-based alignment?","options":["Align the 4 corners of two photos","Finding a way to recover an image's angle through spatial transformations","Overlap the pictures together and find similarities between them","Find a few matching features in both images then compute alignment"],"answer":[3],"explanation":"**Đáp án đúng: Find a few matching features in both images then compute alignment.** Cách tiếp cận chính: tìm vài đặc trưng khớp giữa hai ảnh rồi ước lượng phép biến đổi.\n- Căn bốn góc ảnh không tổng quát.\n- Chồng ảnh và tìm điểm giống nhau là direct alignment."},{"id":244,"slide":273,"topic":"Nhận dạng & học máy","section":"Câu dài","question":"What is the basic principle of object detection?","options":["Object detection is based on the features that make up the object.","Each object's surface has a different structure and shape. Hence object detection relies on color relevance","Object detection is based on the semantics of the objects in the image.","All of the others"],"answer":[0],"explanation":"**Đáp án đúng: Object detection is based on the features that make up the object.** Phát hiện đối tượng dựa trên các đặc trưng cấu thành (cạnh, texture, hình dạng, v.v.).\n- Không chỉ dựa trên màu.\n- Ngữ nghĩa là mức cao hơn, không phải nguyên lý cơ bản của phát hiện."},{"id":245,"slide":274,"topic":"Tổng quan & toán cơ bản","section":"Câu dài","question":"What is the difference between image processing and computer vision? Choose the most correct answer","options":["Image processing and computer vision are two different concepts.","The task of computer vision is an analysis of an image.","Computer vision can be understood as the steps to increase image clarity, through noise filtering steps.","Image processing performs tasks such as analyzing what objects are in the image"],"answer":[1],"explanation":"**Đáp án đúng: The task of computer vision is an analysis of an image.** Computer vision phân tích và hiểu ảnh (ví dụ xác định vật thể).\n- Làm rõ ảnh, lọc nhiễu là image processing.\n- Phương án \"two different concepts\" quá chung, không nêu sự khác biệt.\n- Phương án cuối gán nhầm nhiệm vụ phân tích cho image processing."},{"id":246,"slide":276,"topic":"Phân đoạn & phân cụm","section":"Câu dài","question":"What is meant by image segmentation in image processing?","options":["Image segmentation is the division of an image into regions or categories, which correspond to different objects or parts of objects.","Image segmentation is a method in which a digital image is broken down into various subgroups based their color or position","All of the others","None of the others"],"answer":[2],"explanation":"**Đáp án đúng: All of the others.** Cả hai định nghĩa đều đúng: chia ảnh thành vùng/lớp tương ứng đối tượng và chia thành các nhóm con theo màu hoặc vị trí."},{"id":247,"slide":277,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu dài","question":"What is the underlying principle behind feature-based alignment?","options":["It identifies and matches distinctive features (e.g., corners, edges) across images to achieve alignment.","It relies on manual user input to specify corresponding points between images for alignment.","It directly matches and aligns entire image regions without any processing.","It aligns images based on their overall brightness and color distributions."],"answer":[0],"explanation":"**Đáp án đúng: It identifies and matches distinctive features (e.g., corners, edges) across images to achieve alignment.** Nguyên lý là phát hiện đặc trưng nổi bật rồi ghép chúng giữa các ảnh.\n- Không dựa vào nhập thủ công.\n- Không khớp trực tiếp toàn vùng.\n- Không chỉ dựa vào phân bố sáng/màu tổng thể."},{"id":248,"slide":278,"topic":"Màu sắc & histogram","section":"Câu dài","question":"What are the two traditional methods suggested for modeling light effects based on surface characteristics?","options":["Ray tracing for matte surfaces and radiosity for specular surfaces","Ray tracing for mostly specular surfaces and radiosity for mostly matte surfaces","Radiosity for both matte and specular surfaces","Ray tracing for both matte and specular surfaces"],"answer":[1],"explanation":"**Đáp án đúng: Ray tracing for mostly specular surfaces and radiosity for mostly matte surfaces.** Ray tracing mạnh với phản xạ gương (phụ thuộc điểm nhìn); radiosity mô hình tương tác ánh sáng khuếch tán giữa các bề mặt mờ.\n- Phương án đảo ngược hai phương pháp là sai.\n- Mỗi phương pháp không phủ cả hai loại bề mặt."},{"id":249,"slide":279,"topic":"Lọc ảnh & tích chập","section":"Câu dài","question":"What are the differences between correlation and convolution?","options":["Convolution is measurement of total noise of one image on the other image.","The mathematical calculation of Correlation is difference as convolution in time domain","If the filter is asymmetrical then the output of both the expression would be same.","Correlation is measurement of the similarity between two image."],"answer":[3],"explanation":"**Đáp án đúng: Correlation is measurement of the similarity between two image.** Correlation đo mức tương đồng giữa kernel và vùng ảnh (template matching).\n- Convolution không phải đo tổng nhiễu.\n- Với kernel đối xứng thì hai phép cho kết quả như nhau, còn bất đối xứng thì khác.\n- Convolution lật kernel 180°, nên hai phép không giống hệt nhau.\nLưu ý: câu hỏi hơi mơ hồ; đáp án bộ đề là lựa chọn ít sai nhất."},{"id":250,"slide":280,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu dài","question":"What role does the edge linking process play in image processing after edge detection?","options":["It introduces disorder to the detected edge pixels.","It randomly rearranges the order of edge pixels.","It organizes an unordered set of edge pixels into an ordered list of edges.","It eliminates edge information by breaking connections between neighboring pixels."],"answer":[3],"explanation":"Lưu ý: bộ đề gốc ghi D (loại bỏ thông tin biên bằng cách ngắt kết nối các pixel lân cận) và web giữ đáp án này theo nguồn đề, nhưng theo giáo trình đáp án đúng là C (tổ chức tập edge pixels chưa có thứ tự thành danh sách biên có thứ tự). Sau edge detection, edge linking nối các điểm biên lân cận có cùng hướng thành đường biên liên tục. Nếu đề thi theo bộ đề gốc thì chọn D."},{"id":251,"slide":281,"topic":"Miền tần số & Fourier","section":"Câu dài","question":"What property of the Fourier transform makes it particularly useful for image processing tasks like noise reduction or edge detection?","options":["It reveals the spatial distribution of brightness in the image.","It decomposes an image into its constituent sinusoidal frequency components.","It increases the resolution of the image.","It directly removes noise pixels from the image"],"answer":[1],"explanation":"**Đáp án đúng: It decomposes an image into its constituent sinusoidal frequency components.** Biến đổi Fourier cho biết tần số nào có mặt, nên dễ lọc nhiễu (tần số cao) hay làm nổi biên.\n- Không tăng độ phân giải.\n- Không tự xoá pixel nhiễu mà cần lọc trong miền tần số.\n- Phân bố độ sáng theo không gian là miền không gian, không phải đặc tính của Fourier."},{"id":252,"slide":282,"topic":"Ảnh số & thu nhận ảnh","section":"Câu dài","question":"What happens in the thin lens model?","options":["The object is inverted.","The image is discolored.","Objects placed before or after Len produce the same results.","The image will stay the same size when you use white light as the source (sun)."],"answer":[2],"explanation":"**Đáp án đúng: Objects placed before or after Len produce the same results.** Theo đáp án bộ đề, vị trí vật trước/sau thấu kính được xem là cho kết quả tương đương trong mô hình thấu kính mỏng.\n- \"Object is inverted\" và các phương án màu/kích thước không được chọn.\nLưu ý: câu mơ hồ; về vật lý, ảnh thật bị đảo ngược khi vật ở ngoài tiêu cự, và vị trí vật thay đổi vị trí/kích thước ảnh. Vẫn giải thích theo bộ đề."},{"id":253,"slide":283,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu dài","question":"Which of these describes a desirable characteristic for features used in alignment?","options":["They should be easily affected by lighting changes.","They should be distinctive and easily identifiable in both images.","They should be evenly distributed across the entire image.","They should be large and occupy a significant portion of the image."],"answer":[1],"explanation":"**Đáp án đúng: They should be distinctive and easily identifiable in both images.** Đặc trưng tốt phải đặc trưng riêng và dễ nhận lại ở cả hai ảnh để ghép chính xác.\n- Nhạy với thay đổi ánh sáng là điểm yếu, không phải ưu điểm.\n- Kích thước lớn không cần thiết.\n- Phân bố đều giúp ích nhưng không phải tính chất cốt lõi của từng đặc trưng."},{"id":254,"slide":284,"topic":"Nhận dạng & học máy","section":"Câu dài","question":"Which of these statements is incorrect about face recognition in traditional methods?","options":["It typically requires pre-processing steps like normalization and alignment.","It often involves extracting facial features like eigenfaces or Fisherfaces.","It can achieve high accuracy in controlled environments with good lighting.","It can easily identify individuals from large variations in pose and expression."],"answer":[3],"explanation":"**Đáp án đúng (phát biểu sai): It can easily identify individuals from large variations in pose and expression.** Phương pháp truyền thống (eigenfaces, Fisherfaces) nhạy với biến thiên lớn về tư thế và biểu cảm.\n- Cần tiền xử lý chuẩn hoá/căn chỉnh: đúng.\n- Dùng eigenfaces/Fisherfaces: đúng.\n- Chính xác cao trong môi trường kiểm soát ánh sáng: đúng."},{"id":255,"slide":285,"topic":"Chuyển động & optical flow","section":"Câu dài","question":"Which of the following is incorrect about object tracking?","options":["A way of identifying or confirming an individual's identity using their face.","Taking an initial set of object detections (such as an input set of bounding box coordinates).","Creating a unique ID for each of the initial detections.","Tracking each of the objects as they move around frames in a video, maintaining the assignment of unique IDs."],"answer":[0],"explanation":"**Đáp án đúng (phát biểu sai): A way of identifying or confirming an individual's identity using their face.** Đó là định nghĩa face recognition/verification, không phải object tracking.\n- Ba phương án còn lại mô tả đúng quy trình tracking: nhận tập detection ban đầu, gán ID duy nhất, theo dõi qua các frame và giữ nguyên ID."},{"id":256,"slide":286,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu dài","question":"Which scenario benefits most from Line detection with Hough Transform?","options":["Segmenting and analyzing individual characters in handwritten text.","Identifying and classifying different types of flowers based on color and texture.","Detecting lane markings on a road in an image for autonomous driving applications.","Blur detection and image sharpening techniques that rely on accurate edge information."],"answer":[2],"explanation":"**Đáp án đúng: Detecting lane markings on a road in an image for autonomous driving applications.** Vạch làn đường gần như là đường thẳng, phù hợp với Hough line detection.\n- Ký tự viết tay và hoa không phải cấu trúc đường thẳng.\n- Làm sắc nét/phát hiện mờ không đòi hỏi Hough."},{"id":257,"slide":287,"topic":"Màu sắc & histogram","section":"Câu dài","question":"How is an \"Illumination model\" formed?","options":["It refers to the source of visible electromagnetic radiation","It describes the linear projection model of light","It outlines the inputs, assumptions, and outputs for calculating surface color and brightness","It focuses on the off-axis distance of light sources"],"answer":[2],"explanation":"**Đáp án đúng: It outlines the inputs, assumptions, and outputs for calculating surface color and brightness.** Illumination model xác định đầu vào (nguồn sáng, bề mặt, hướng nhìn), giả định và đầu ra là màu/độ sáng bề mặt.\n- Nguồn bức xạ điện từ chỉ là một thành phần.\n- Không phải mô hình chiếu tuyến tính hay khoảng cách lệch trục của nguồn sáng."},{"id":258,"slide":288,"topic":"Tổng quan & toán cơ bản","section":"Câu dài","question":"How are pixel transforms understood? Choose the best correct answer","options":["Those are transformation techniques based on pixel-by-pixel processing.","Those are transformation techniques based on pixel-by-cluster processing.","Those are transformation techniques based on pixel-by-image processing.","Those are transformation techniques based on cluster-by-cluster processing."],"answer":[0],"explanation":"**Đáp án đúng: Those are transformation techniques based on pixel-by-pixel processing.** Pixel transform biến đổi từng pixel độc lập dựa trên giá trị của nó.\n- Các phương án cluster hay image đều không đúng bản chất phép biến đổi điểm."},{"id":259,"slide":289,"topic":"Phân đoạn & phân cụm","section":"Câu dài","question":"How are thresholding methods implemented? Choose the best answer","options":["It replaces each pixel in an image with a black pixel if the image intensity is less than some fixed constant.","It replaces each pixel in an image with a white pixel if the image intensity is greater than that constant.","The first and second is correct","The first or second is correct"],"answer":[2],"explanation":"**Đáp án đúng: The first and second is correct.** Thresholding: pixel có cường độ nhỏ hơn ngưỡng thành đen và lớn hơn ngưỡng thành trắng; cả hai vế đều là một phần của định nghĩa.\n- \"The first or second\" sai vì cần cả hai vế để mô tả đầy đủ."},{"id":260,"slide":290,"topic":"Ảnh số & thu nhận ảnh","section":"Câu dài","question":"How does the shutter speed parameter in digital cameras work?","options":["Adjusting amplification and black level to get a \"good fit\" of the incident light power to the range of the image","Controls the amount of light reaching the sensor","The physical spacing between adjacent sensor cells on the imaging chip","The active sensing area size as a fraction of the theoretically available sensing area"],"answer":[1],"explanation":"**Đáp án đúng: Controls the amount of light reaching the sensor.** Shutter speed là thời gian phơi sáng; thời gian dài thì nhiều ánh sáng đến cảm biến hơn.\n- Khuếch đại và black level thuộc về gain/ISO.\n- Khoảng cách giữa các cell là sensor pitch.\n- Phần diện tích hoạt động là fill factor."},{"id":261,"slide":291,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu dài","question":"How does image noise affect the performance of line detection with Hough Transform?","options":["Noise has minimal impact as the voting process inherently filters out noise.","Noise can cause edge points to deviate slightly, potentially affecting the accuracy of line parameters.","High levels of noise can create false peaks in the parameter space, leading to inaccurate line detection.","The Hough Transform is not suitable for images with any level of noise."],"answer":[2],"explanation":"**Đáp án đúng: High levels of noise can create false peaks in the parameter space, leading to inaccurate line detection.** Nhiễu sinh điểm biên giả, làm bỏ phiếu sai và tạo đỉnh giả.\n- Voting chống nhiễu tốt phần nào nhưng không loại hoàn toàn.\n- Ảnh hưởng nhỏ chỉ làm lệch nhẹ tham số.\n- Hough vẫn dùng được với ảnh có nhiễu vừa phải."},{"id":262,"slide":292,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu dài","question":"How is the Haar calculation performed for edge detection?","options":["By measuring the sharpness of pixel values in darker and lighter regions","By computing the ratio of pixel intensities in darker and lighter regions","By finding the difference between averages of pixel values in darker and lighter regions","By comparing the histograms of pixel distributions in darker and lighter regions"],"answer":[2],"explanation":"**Đáp án đúng: By finding the difference between averages of pixel values in darker and lighter regions.** Haar feature tính hiệu giữa tổng/trung bình pixel vùng sáng và vùng tối (dùng integral image để nhanh).\n- Không dùng tỉ số, độ sắc nét hay so sánh histogram."},{"id":263,"slide":293,"topic":"Lọc ảnh & tích chập","section":"Câu dài","question":"How does linear filtering differ from non-linear filtering in image processing?","options":["Linear filtering involves non-sequential combinations of pixel values, while non-linear filtering follows a linear pattern","In linear filtering, the output pixel value is a linear combination of input pixel values, whereas non-linear filtering employs ordering mechanisms","Non-linear filtering exclusively utilizes spatial masks for convolution, while linear filtering relies on pixel ordering mechanisms","Linear and non-linear filtering both use spatial masks interchangeably to modify input pixel values"],"answer":[1],"explanation":"Đáp án B: trong linear filtering, giá trị pixel đầu ra là tổ hợp tuyến tính của các pixel đầu vào với các trọng số xác định bởi bộ lọc. Non-linear filtering không thoả tính tuyến tính; ordering mechanisms như lấy median là một ví dụ, nhưng không phải mọi bộ lọc phi tuyến đều dựa vào sắp thứ tự. A và C đảo lẫn bản chất hai nhóm, còn D chỉ nói về spatial masks nên không nêu được khác biệt cốt lõi giữa chúng."},{"id":264,"slide":294,"topic":"Ảnh số & thu nhận ảnh","section":"Câu dài","question":"How does a computer understand input images?","options":["The computer understands the image as a matrix of pixels.","The computer understands the image as a single color matrix.","The computer reads the input image as an integer array of values stored in the binary image.","All of the others"],"answer":[0],"explanation":"Đáp án A: máy tính biểu diễn ảnh dưới dạng một ma trận pixel, mỗi phần tử chứa giá trị cường độ hoặc các giá trị kênh màu. Ảnh grayscale thường dùng mảng hai chiều, còn ảnh RGB thường có thêm chiều kênh màu. B giới hạn ảnh vào một màu duy nhất, còn C giới hạn cách biểu diễn vào integer array của binary image, trong khi ảnh số còn có thể là ảnh màu hoặc dữ liệu floating-point, nên D không đúng."},{"id":265,"slide":295,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu dài","question":"How does the window size in HOG object detection affect the ability to detect small objects?","options":["A larger window size might miss small objects entirely if they fall outside the window boundaries.","A smaller window size is ideal for all object sizes, including small ones.","Window size has no impact on the detection of objects of any size.","A larger window size improves the detection accuracy for small objects."],"answer":[0],"explanation":"Đáp án A là lựa chọn bộ đề muốn nhấn mạnh: window size không phù hợp có thể làm HOG object detection bỏ sót small objects. Khi vật thể quá nhỏ so với cửa sổ phát hiện, đặc trưng HOG dễ bị nền lấn át hoặc không khớp tỷ lệ đã học; việc nằm ngoài window boundaries không phải nguyên nhân duy nhất như cách diễn đạt của A có thể gợi ra. B sai vì cửa sổ nhỏ không tối ưu cho mọi kích thước, C phủ nhận ảnh hưởng của tỷ lệ, còn D khẳng định quá mức rằng cửa sổ lớn luôn giúp vật thể nhỏ. Thực tế thường cần image pyramid hoặc phát hiện ở nhiều scale để xử lý chênh lệch kích thước."},{"id":266,"slide":296,"topic":"Lọc ảnh & tích chập","section":"Câu dài","question":"How can we compute convolution using correlation?","options":["No difference exists, convolution and correlation produce the same results.","By rotating the kernel 180 degree around it's center before performing the correlation operation.","We can directly use the correlation result without any modifications.","By dividing the results of correlation by a constant factor"],"answer":[1],"explanation":"Đáp án B: để tính convolution bằng correlation, cần xoay kernel 180 độ quanh tâm trước khi thực hiện correlation. Thao tác này tương đương đảo thứ tự hệ số theo cả hai trục của kernel hai chiều. A và C chỉ cho cùng kết quả trong các trường hợp đặc biệt như kernel đối xứng tâm, còn D chỉ đổi biên độ nên không thực hiện được phép đảo kernel cần thiết."},{"id":267,"slide":297,"topic":"Lọc ảnh & tích chập","section":"Câu dài","question":"How can we compute convolution using correlation?","options":["No difference exists, convolution and correlation produce the same results.","By rotating the kernel 180 degree around it's center before performing the correlation operation.","We can directly use the correlation result without any modifications.","By dividing the results of correlation by a constant factor."],"answer":[1],"explanation":"Đáp án B: convolution khác correlation ở việc kernel được đảo theo cả hai chiều, tương đương xoay 180 độ quanh tâm trong không gian hai chiều. Vì vậy, correlation với kernel đã xoay cho kết quả convolution với kernel ban đầu khi dùng cùng quy ước biên và vị trí tâm. A và C không đúng với kernel tổng quát, còn chia kết quả cho một hằng số như D không thay đổi thứ tự hệ số để tạo convolution."},{"id":268,"slide":298,"topic":"Màu sắc & histogram","section":"Câu dài","question":"How to calculate the intensity value of pixel in color space?","options":["It is the average of the color values.","It is represented through three color values: Red, Green, and Blue.","The color component with the largest value will be represented as a representation of the intensity value.","It is a combination of colors in the color space."],"answer":[0],"explanation":"Đáp án A: theo định nghĩa intensity là trung bình các thành phần màu trong câu hỏi, ảnh RGB có I = (R + G + B) / 3. B nêu bộ ba giá trị biểu diễn màu chứ chưa tính một giá trị intensity, còn C lấy thành phần lớn nhất, gần với Value trong HSV hơn là công thức intensity này. D chỉ nói chung về kết hợp màu nên không đưa ra quy tắc tính. Lưu ý: chuyển RGB sang grayscale theo luminance có thể dùng tổng có trọng số, vì vậy công thức trung bình không phải quy tắc chung cho mọi color space."},{"id":269,"slide":299,"topic":"Nhận dạng & học máy","section":"Câu dài","question":"How do you understand object detection?","options":["Object detection is merely to recognize the object with a different color in the image.","Object detection is the task of detecting instances of objects of a certain class within an image.","Object detection allows us to classify and locates objects in an image or video.","All of the others"],"answer":[2],"explanation":"Đáp án C: Object detection vừa xác định lớp của đối tượng vừa định vị từng đối tượng trong ảnh hoặc video, thường bằng bounding boxes. B cũng là mô tả đúng ở mức khái quát, nhưng C thể hiện rõ cả classification và localization nên là lựa chọn đầy đủ hơn theo bộ đề. A sai vì detection không chỉ nhận ra đối tượng khác màu, do đó D cũng không đúng."},{"id":270,"slide":300,"topic":"Phân đoạn & phân cụm","section":"Câu dài","question":"How do thresholding methods process pixels in an image based on intensity?","options":["By randomly assigning black or white pixels to each pixel in the image","By replacing pixels with a black pixel if intensity is greater than a fixed constant","By replacing pixels with a white pixel if intensity is less than a fixed constant","By applying color inversion to all pixels in the image"],"answer":[1],"explanation":"Đáp án B theo bộ đề tương ứng với inverse binary thresholding: pixel có intensity lớn hơn ngưỡng T được gán màu đen, còn các pixel còn lại được gán màu trắng. A gán ngẫu nhiên và D đảo màu toàn ảnh nên không phải quy tắc so sánh cường độ với ngưỡng. C mô tả một phần của cùng quy ước đảo ngưỡng khi intensity nhỏ hơn T, nên câu hỏi chưa phân biệt các lựa chọn thật chặt chẽ. Lưu ý: với binary thresholding thông thường, pixel vượt ngưỡng lại được gán màu trắng, vì vậy B không phải quy tắc chung cho mọi thresholding method."},{"id":271,"slide":301,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu dài","question":"Why use the image feature for processing, rather than using the whole image","options":["In the photo, we are only interested in the color, as well as the size of the photo.","Use features to be able to apply more advanced techniques later like deep learning.","It reduces the number of resources required to describe a large set of data","All of the others"],"answer":[2],"explanation":"Đáp án C: dùng image features giúp biểu diễn thông tin cần thiết gọn hơn, từ đó giảm tài nguyên lưu trữ và tính toán so với xử lý toàn bộ dữ liệu pixel. Features có thể giữ cấu trúc hữu ích cho matching, recognition hoặc các bước phân tích tiếp theo. A sai vì không chỉ màu và kích thước ảnh mới quan trọng, còn B nêu một khả năng sử dụng về sau chứ không phải lợi ích cốt lõi và deep learning cũng có thể học trực tiếp từ pixel. Vì A không đúng nên không thể chọn D."},{"id":272,"slide":302,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu dài","question":"Why do we need image stitching?","options":["Image stitching is a widely used technique for recovering original data from ripped data.","Image stitching is used in forensic and investigative science for the reconstruction of torn paper which is a big problem.","In image mapping, stitching of images is done to do the complete mapping of a particular place.","All of the others"],"answer":[3],"explanation":"**Đáp án đúng: The weights should be chosen to emphasize the type of edge you want to detect.** Trọng số kernel quyết định hướng và loại biên phát hiện được (ví dụ Sobel dọc/ngang).\n- Trọng số lớn nhất ở tâm không đảm bảo gradient chính xác.\n- Không phải mọi trọng số đều âm (tổng thường bằng 0).\n- Trọng số ngẫu nhiên không cho kết quả tốt."},{"id":273,"slide":303,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu dài","question":"When designing your own kernel for edge detection, what is an important consideration when choosing the weights within the kernel?","options":["Assigning the highest weight to the center pixel ensures the most accurate gradient calculation.","The weights should be chosen to emphasize the type of edge you want to detect (e.g., stronger weights for sharper edges).","All weights within the kernel must be negative to achieve effective edge detection.","Using a random distribution of weights often leads to better edge detection results."],"answer":[1],"explanation":"**Đáp án đúng: More complex and require additional training data to differentiate individual objects.** Instance segmentation phải phân tách từng thể hiện riêng, phức tạp hơn semantic segmentation chỉ gán nhãn lớp.\n- Các phương án \"ít phức tạp\" hay \"tương đương\" sai.\n- Không yêu cầu đặc biệt về độ phân giải cao."},{"id":274,"slide":304,"topic":"Phân đoạn & phân cụm","section":"Câu dài","question":"Compared to semantic segmentation models, instance segmentation models are generally","options":["More complex and require additional training data to differentiate individual objects.","Less complex and require less training data.","Equally complex with similar training data requirements.","Simpler but require very high-resolution images for accurate results."],"answer":[0],"explanation":"**Đáp án đúng: The shape of the cancerous cells plays a vital role in determining the severity of cancer.** Segmentation cho hình dạng chính xác của tế bào, còn bounding box thì không.\n- \"Bounding boxes\" đúng một phần nhưng không nêu lý do giá trị.\n- Segmentation không nhanh hơn detection.\n- \"All of the others\" sai vì phương án nhanh hơn là sai."},{"id":275,"slide":305,"topic":"Phân đoạn & phân cụm","section":"Câu dài","question":"Detecting cancerous cells as quickly as possible can potentially save millions of lives. Object detection will not be very useful here. So why is image segmentation so useful in this area?","options":["We will generate bounding boxes which will not help us in identifying the shape of the cells.","Segmentation processing is many times faster than object detection, thus helping to quickly prevent cancer cells.","The shape of the cancerous cells plays a vital role in determining the severity of cancer.","All of the others."],"answer":[2],"explanation":"**Đáp án đúng: Edge detection allows users to observe the features of an image for a significant change in the gray level.** Biên là nơi mức xám thay đổi mạnh.\n- Phương án 1 và 3 cũng mô tả liên quan (vùng liên tục, biên giữa hai vùng rời nhau) nhưng không phải định nghĩa trực tiếp.\nLưu ý: câu mơ hồ vì \"All of the others\" cũng có thể được chấp nhận; theo bộ đề chọn phương án 2."},{"id":276,"slide":306,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu dài","question":"Edge detection is a technique widely used in image processing, as well as computer vision. It reduces the amount of data in an image and preserves the structural properties of an image. So what do you understand about edge detection?","options":["Edge Detection is a method of segmenting an image into regions of continuity.","Edge detection allows users to observe the features of an image for a significant change in the gray level.","Edge detection can be defined as a set of connected pixels that forms a boundary between two disjoint regions","All of the others"],"answer":[1],"explanation":"**Đáp án đúng: The most distinctive facial features across different individuals.** Eigenfaces là các thành phần chính (PCA) của tập khuôn mặt, nắm bắt biến thiên đặc trưng giữa các cá nhân.\n- Không phải mặt trung bình (đó là mean face).\n- Không phải mẫu biểu cảm.\n- Không phải mô hình 3D."},{"id":277,"slide":307,"topic":"Nhận dạng & học máy","section":"Câu dài","question":"Eigenfaces, used in some face recognition algorithms, represent:","options":["Average face features from a training dataset.","The most distinctive facial features across different individuals.","Templates for specific facial expressions (e.g., smiling, frowning).","A 3D model of a face for high-resolution recognition."],"answer":[1],"explanation":"Lưu ý: bộ đề gốc ghi trống đáp án, nhưng theo giáo trình đáp án đúng là B (The most distinctive facial features across different individuals). Chính xác hơn, Eigenfaces là các principal components của tập ảnh khuôn mặt đã trừ mean face, biểu diễn các hướng có phương sai lớn chứ không nhất thiết là từng bộ phận khuôn mặt hay các đặc trưng phân lớp tối ưu. A chỉ nói về khuôn mặt trung bình, C chỉ các template biểu cảm cụ thể, còn D là mô hình 3D nên không mô tả Eigenfaces. Khi nhận dạng, ảnh mới được chiếu lên không gian Eigenfaces để so sánh các hệ số biểu diễn."},{"id":278,"slide":308,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu dài","question":"Given the Sobel kernel for horizontal edge detection: [-1, 0, 1; -2, 0, 2; -1, 0, 1]. How does this kernel compute the horizontal gradient at a pixel?","options":["It subtracts the intensity of the left pixel from the right pixel.","It averages the intensity of all surrounding pixels.","It calculates a weighted sum of the pixel's intensity and its horizontal neighbors, emphasizing changes.","It directly compares the pixel's intensity to a pre-defined threshold."],"answer":[2],"explanation":""},{"id":279,"slide":309,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu dài","question":"Hough transform is used to recognize complex lines in photographs. How do you understand Hough transform?","options":["The purpose of the technique is to find imperfect instances of objects within a certain class of shapes by a voting procedure.","For the Hough Transform algorithm, it is crucial to perform point detection first to produce a point image which will then be used as input into the algorithm.","The Hough technique is particularly useful for computing a local description of a feature.","All of the others"],"answer":[0],"explanation":""},{"id":280,"slide":310,"topic":"Ảnh số & thu nhận ảnh","section":"Câu dài","question":"In light reflection models, what does the full Phong model encompass?","options":["Only the ambient term for other light incidents","Diffuse and ambient components without specular contributions","Diffuse and specular components from the main illuminant with an ambient term","Exclusively specular components contributed by various light sources"],"answer":[2],"explanation":""},{"id":281,"slide":311,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu dài","question":"In the edge detection methods, what is the main advantage of the Canny algorithm over simpler?","options":["It is significantly faster to compute and requires minimal processing power.","It is highly sensitive to noise and can easily miss important edges.","It combines multiple steps to achieve robust edge detection, including noise reduction, gradient calculation, and non-maximum suppression.","It can directly identify the specific color of edges in the image."],"answer":[2],"explanation":""},{"id":282,"slide":312,"topic":"Chuyển động & optical flow","section":"Câu dài","question":"Object tracking takes an approach that uses point tracking techniques. So how is the approach to using point tracking understood? Choose the best answer","options":["Objects detected in consecutive frames are represented by object deterministic, probabilistic methods, and the association of the object is based on the previous object state which can include object position and motion.","It is usually performed by locating the moving object, which is represented by an embryonic object region, from one frame to the next: a multi- view based, template-based.","It refers to the object's shape and appearance.","This approach requires an external mechanism to detect the object in every frame."],"answer":[0],"explanation":""},{"id":283,"slide":313,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu dài","question":"The most difficult part of getting a fully automated stitching algorithm to work is deciding which pairs of images actually correspond to the same parts of the scene. What is the best solution to solve these issues? Choose the best correct answer","options":["Using a feature-based approach to remove objects from image frames. Then we get a completed panoramas image.","Using a direct pixel-based comparison between the registered images to determine if they actually are different views of the same scene.","To find the similarity of adjacent images, we determine whether the properties match or not, using the image combination method.","All of the others"],"answer":[1],"explanation":""},{"id":284,"slide":314,"topic":"Chuyển động & optical flow","section":"Câu dài","question":"The object tracking level can be divided into two basic types. The first type is Single Object Tracking (SOT). Choose the best description of Single Object Tracking (SOT)","options":["It creates bounding boxes that are given to the tracker based on the first frame of the input image.","Single Object Tracking is also sometimes known as Visual Object Tracking.","SOT implies that one singular object is tracked, even in environments involving other objects.","All of the others"],"answer":[3],"explanation":""},{"id":285,"slide":315,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu dài","question":"There are many applications for image alignment, such as tracking objects on video, motion analysis, and many other tasks of computer vision. How do you understand image alignment?","options":["It is the image that has been created using elements from a variety of different pictures.","Image alignment is the process of matching one image called a template with another image.","The images are more paired together as a collection of stand-alone images that may follow a theme or story.","All of the others"],"answer":[1],"explanation":""},{"id":286,"slide":316,"topic":"Chuyển động & optical flow","section":"Câu dài","question":"Suppose we have two images at two different times: I(x,y,t) and I(x,y,t+1). How to estimate pixel motion from image I(x,y,t) to I(x,y,t+1)?","options":["Put two images on top of each other and calculate the closest distance of I(x,y,t) and I(x,y,t+1)","Given a pixel in I(x,y,t), look for nearby pixels of the same color in I(x,y,t+1)","Use the interpolation method to estimate the next positions of I(x,y,t).","Based on the color of each pixel at the position I(x,y,t) relative to the overall image at time t+1"],"answer":[1],"explanation":"**Đáp án đúng: To find the closed pixels at time t+1 which have the same color at time t.** Bài toán optical flow: với pixel ở $t$, tìm pixel gần (\"closed\" = close) ở $t+1$ có cùng màu.\n- Tìm pixel \"faraway\" trái với giả định chuyển động nhỏ.\n- Chiều thời gian đảo ngược không đúng.\nLưu ý: \"closed\" là lỗi chính tả của \"close\"."},{"id":287,"slide":317,"topic":"Chuyển động & optical flow","section":"Câu dài","question":"The optical flow problem for estimating pixel motion is","options":["To find the closed pixels at time t+1 which have the same color at time t","To find the faraway pixels at time t which have the same color at time t+1","To find the faraway pixels at time t+1 which have the same color at time t","To find the closed pixels at time t which have the same color at time t+1"],"answer":[0],"explanation":"**Đáp án đúng: Shifting the image.** Translation dịch chuyển ảnh theo $(t_x, t_y)$.\n- Co/giãn theo ngang hoặc dọc là scaling.\n- Xoay là rotation."},{"id":288,"slide":318,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu dài","question":"Translation is:","options":["Shrinking or expanding the image in a horizontal and/or vertical direction","Shifting the image","Rotating the images","None of the above"],"answer":[1],"explanation":"**Đáp án đúng: The output is the interpretation of an image.** Đầu ra của computer vision là sự hiểu/diễn giải ảnh (vật thể, cảnh, ngữ nghĩa).\n- Ảnh đã xử lý hay ảnh khôi phục nhiễu là kết quả của image processing.\n- \"All of the others\" sai."},{"id":289,"slide":319,"topic":"Ảnh số & thu nhận ảnh","section":"Câu dài","question":"The input of computer vision is an image. So what is the output of computer vision?","options":["The output is the interpretation of an image.","The output is a processed image.","The output is the image that has been recovered with the parts that have been noisy.","All of the others"],"answer":[0],"explanation":"**Đáp án đúng: By comparing feature descriptors, which capture the local structure around each feature.** Descriptor (như SIFT, HOG) mã hoá cấu trúc cục bộ, và tương ứng được tìm bằng khoảng cách giữa descriptor.\n- So sánh trực tiếp cường độ pixel kém bền với thay đổi ánh sáng và biến đổi hình học.\n- Không chọn thủ công hay theo gần tâm ảnh."},{"id":290,"slide":320,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu dài","question":"With feature-based alignment, how do we determine corresponding features between images?","options":["By comparing feature descriptors, which capture the local structure around each feature.","By directly comparing pixel intensities in local neighborhoods around each feature.","By manually selecting matching features based on visual similarity.","By prioritizing features closest to the image center for alignment."],"answer":[0],"explanation":"**Đáp án đúng: By rotating the kernel 180 degree around its center before performing the correlation operation.** Convolution là correlation với kernel đã lật theo cả hai trục.\n- Hai phép khác nhau nếu kernel không đối xứng.\n- Không chia cho hằng số."},{"id":291,"slide":321,"topic":"Lọc ảnh & tích chập","section":"Câu dài","question":"We are using the correlation; how can the convolution be computed?","options":["No difference exists, convolution and correlation produce the same results.","By rotating the kernel 180 degree around its center before performing the correlation operation.","We can directly use the correlation result without any modifications.","By dividing the results of correlation by a constant factor."],"answer":[1],"explanation":""},{"id":292,"slide":322,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu dài","question":"With Hough Transform, which situation gains the most from using line detection?","options":["Segmenting and analyzing individual characters in handwritten text.","Identifying and classifying different types of flowers based on color and texture.","Detecting lane markings on a road in an image for autonomous driving applications.","Blur detection and image sharpening techniques that rely on accurate edge information."],"answer":[2],"explanation":""},{"id":293,"slide":324,"topic":"Lọc ảnh & tích chập","section":"Câu dài","question":"Which of the following statements best describes the relationship between convolution and Fourier transform in image processing?","options":["Convolution in the time domain corresponds to multiplication in the frequency domain.","Convolution in the time domain corresponds to addition in the frequency domain.","Fourier transform in the time domain corresponds to convolution in the frequency domain.","They do not have any relationship."],"answer":[0],"explanation":"Phép tích chập trong miền thời gian (hoặc miền không gian) tương ứng với phép nhân trong miền tần số (Convolution in the time domain corresponds to multiplication in the frequency domain). Theo định lý tích chập (Convolution Theorem), thực hiện tích chập trong miền không gian tương đương với phép nhân trong miền tần số, giúp tăng tốc nhiều thuật toán xử lý ảnh."},{"id":294,"slide":325,"topic":"Lọc ảnh & tích chập","section":"Câu dài","question":"In image processing, which of the following statements most accurately explains the relationship between convolution and the Fourier transform?","options":["Convolution in the time domain corresponds to multiplication in the frequency domain.","Convolution in the time domain corresponds to addition in the frequency domain.","Fourier transform in the time domain corresponds to convolution in the frequency domain.","They do not have any relationship."],"answer":[0],"explanation":"Phép tích chập trong miền thời gian (hoặc miền không gian) tương ứng với phép nhân trong miền tần số (Convolution in the time domain corresponds to multiplication in the frequency domain). Đây là một trong những tính chất quan trọng nhất của phép biến đổi Fourier và được sử dụng rộng rãi trong lọc ảnh và xử lý tín hiệu."},{"id":295,"slide":326,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu dài","question":"Why is Difference of Gaussian (DoG) used instead of Normalized Laplacian of Gaussian (NLoG)?","options":["DoG approximates NLoG but more efficient calculation.","DoG is better than NLoG and more efficient calculation.","DoG is better than NLoG although having not efficient calculation.","DoG approximates NLoG even though having the same calculation requirement."],"answer":[0],"explanation":"DoG xấp xỉ NLoG nhưng có tính toán hiệu quả hơn (DoG approximates NLoG but more efficient calculation). DoG cho kết quả gần giống Laplacian of Gaussian nhưng yêu cầu ít phép tính hơn, nên được sử dụng rộng rãi trong các thuật toán như SIFT."},{"id":296,"slide":327,"topic":"Phân đoạn & phân cụm","section":"Câu dài","question":"The watershed algorithm in segmentation is analogous to:","options":["Filling a landscape with water, where catchment basins represent objects.","Merging adjacent regions with similar intensity values.","Identifying edges based on the gradient magnitude in the image.","Splitting an image into a predefined number of segments."],"answer":[0],"explanation":"Đổ nước vào một địa hình, trong đó các lưu vực (catchment basins) đại diện cho các đối tượng (Filling a landscape with water, where catchment basins represent objects). Watershed xem ảnh như một địa hình, với các vùng thấp là lưu vực. Khi \"nước\" dâng lên, các lưu vực phát triển và đường phân cách giữa chúng tạo thành ranh giới của các đối tượng trong ảnh."},{"id":297,"slide":16,"topic":"Chuyển động & optical flow","section":"Điền vào chỗ trống","question":"_____ is based on factored sampling but extended to apply iteratively to successive images in a sequence.","options":["Feature descriptor","Condensation","Feature matching","Hough transform"],"answer":[1],"explanation":"Đáp án B: Condensation (Conditional Density Propagation). Đây là thuật toán theo dõi đối tượng dựa trên factored sampling (lấy mẫu có trọng số) và được mở rộng để áp dụng lặp đi lặp lại cho các ảnh liên tiếp trong một chuỗi, về bản chất là một bộ lọc hạt (particle filter). Feature descriptor dùng để mô tả đặc trưng cục bộ, feature matching dùng để ghép đặc trưng giữa các ảnh, còn Hough transform phát hiện đường hoặc hình dạng bằng cách bỏ phiếu; cả ba đều không phải kỹ thuật lấy mẫu lặp theo chuỗi ảnh."}],"topicMod":{"Màu sắc & histogram":"m2","Lọc ảnh & tích chập":"m2","Miền tần số & Fourier":"m2","Biên & đặc trưng (edge, corner, SIFT…)":"m3","Phân đoạn & phân cụm":"m4","Biến đổi hình học & ghép ảnh":"m5","Chuyển động & optical flow":"m6","Nhận dạng & học máy":"m7","Ảnh số & thu nhận ảnh":"m1","Khác":"m1","Camera, stereo & 3D":"m1","Tổng quan & toán cơ bản":"m1"},"xl":{"b-1":{"q":"Công thức nào để tính Laplacian của hàm Gauss đã chuẩn hoá (normalized Laplacian of Gaussian)?","options":["IV","I","III","II"]},"b-2":{"q":"Hướng của gradient (gradient orientation) được tính toán như thế nào? (I: cường độ sáng tại các điểm ảnh, x: toạ độ x của điểm ảnh, y: toạ độ y của điểm ảnh)","options":["I","II","III","IV"]},"b-3":{"q":"Kernel nào sau đây được sử dụng để phát hiện đường xiên +45 độ trong kỹ thuật dựa trên phép tích chập (convolution)?","options":["III","I","II","IV"]},"b-4":{"q":"Cho ảnh tích hợp (integral image) của một hình ảnh (Hình 1).\nTổng cường độ sáng của tất cả các điểm ảnh trong một vùng (hình chữ nhật đỏ) hiển thị ở Hình 2 là bao nhiêu?","options":["15","17","12","19"]},"b-5":{"q":"Cho một hình ảnh như sau. Hình ảnh sau khi được lọc bởi bộ lọc trung bình (mean filter) kích thước 3x3 là hình nào?","options":["II","III","I","IV"]},"b-6":{"q":"Những yếu tố nào ảnh hưởng đến sự phát triển của xử lý ảnh số (digital image processing)? (chọn 2 đáp án)","options":["Sự phát triển của máy tính","Tiến bộ toán học","Xu hướng mạng xã hội","Phạm vi hẹp của một ứng dụng cụ thể"]},"b-7":{"q":"______ là một ý tưởng thay thế mỗi điểm ảnh bằng giá trị trung bình của các điểm ảnh trong một vùng lân cận và có giá trị nằm trong khoảng cách d.","options":["Mean-shift","Watershed","K-mean","Không có đáp án nào trong số này"]},"b-8":{"q":"______ thực hiện ghép ảnh (image stitching) hoàn toàn tự động, là một kỹ thuật nhận biết những bức ảnh nào thực sự ghép nối cùng nhau","options":["Nhận diện ảnh toàn cảnh (panoramas)","Theo dõi đối tượng (object tracking)","Nhận diện khuôn mặt","Phát hiện đối tượng (object detection)"]},"b-9":{"q":"______ được sử dụng để xác định các lớp hoặc cụm khác nhau trong dữ liệu đã cho dựa trên mức độ tương đồng của dữ liệu.","options":["Bộ mô tả đặc trưng (feature descriptor)","Watershed","Harris","K-means"]},"b-10":{"q":"______ là quá trình kết hợp nhiều hình ảnh chụp có trường nhìn chồng lấn để tạo ra ảnh toàn cảnh (panorama) phân đoạn hoặc hình ảnh độ phân giải cao.","options":["Tiền xử lý ảnh (image preprocessing)","Trừ ảnh (image subtraction)","Ghép ảnh (image stitching)","Thu nhận ảnh (image acquisition)"]},"b-11":{"q":"______ là một phương pháp ước lượng tham số được thiết kế để xử lý tỷ lệ lớn các giá trị ngoại lai (outliers) trong dữ liệu đầu vào","options":["RANSAC","Mean shift","K-mean","Phát hiện biên Canny (Canny edge detection)"]},"b-12":{"q":"______ là một quy trình tính toán chuyên sâu tập trung vào các giá trị ngoại lai trong các biến hồi quy","options":["Ước lượng MM (MM-estimation)","Ước lượng M (M-estimation)","Ước lượng S (S-estimation)","Tất cả các đáp án trên"]},"b-13":{"q":"______ là quá trình phân chia một hình ảnh thành các vùng khác nhau dựa trên đặc tính của các điểm ảnh nhằm xác định các đối tượng hoặc ranh giới, giúp đơn giản hóa hình ảnh và phân tích hiệu quả hơn. Chọn câu trả lời đúng nhất","options":["Phân đoạn ảnh (image segmentation)","Phân tích ảnh (image analysis)","Phát hiện đối tượng (object detection)","Nhận dạng đối tượng (object recognition)"]},"b-14":{"q":"______ là một phương pháp nâng cao chất lượng hình ảnh của kết cấu (textures) trên bề mặt đồ họa máy tính ở các góc nhìn xiên so với camera nơi kết cấu được chiếu lên. Chọn câu trả lời đúng nhất","options":["Bộ lọc MIP Mapping","Bộ lọc trung bình trọng số elip (EWA)","Lọc dị hướng (anisotropic filtering)","Bộ lọc Gauss trắng (Gaussian White filter)"]},"b-15":{"q":"______ là một kỹ thuật xử lý ảnh được sử dụng để xác định các điểm trong ảnh số có sự gián đoạn ~ thay đổi đột ngột về độ sáng của ảnh. Chọn đáp án đúng nhất","options":["Bộ phát hiện đỉnh (peak detector)","Bộ mô tả đỉnh (peak descriptor)","Phát hiện biên (edge detection).","Bộ mô tả biên (edge descriptor)"]},"b-16":{"q":"______ là một hàm hoặc toán tử nhận một hình ảnh làm đầu vào và tạo ra một hình ảnh làm đầu ra. Chọn câu trả lời đúng nhất","options":["Biến đổi hình học (geometric transformation)","Biến đổi ảnh (image transformation)","Tính toán hình học (geometric computing)","Tính toán ảnh (image computing)"]},"b-17":{"q":"______ là quá trình mà một đồ thị hiện có, hoặc phương trình được vẽ đồ thị, được sửa đổi để tạo ra một biến thể của đồ thị trước đó. Chọn câu trả lời đúng nhất","options":["Biến đổi đồ thị (graph transformation)","Biến đổi ảnh (image transformation)","Tính toán đồ thị (graph computing)","Tính toán ảnh (image computing)"]},"b-18":{"q":"______ là hình ảnh được thiết kế để xem như nhìn qua bên trong của một hình trụ. Bạn có thể xem hình ảnh theo chiều ngang ở góc 360 độ. Chọn câu trả lời đúng nhất","options":["Phép chiếu hình trụ (cylindrical projection)","Chế độ xem hình trụ (cylindrical viewing)","Toàn cảnh hình trụ (cylindrical panoramic)","Không có đáp án nào khác"]},"b-19":{"q":"______ là các mô hình xác suất và sử dụng phương pháp phân cụm mềm (soft clustering) để phân bố các điểm vào các cụm khác nhau. Chọn đáp án đúng nhất","options":["Mô hình phân cụm K-means","Mô hình SVN","Mô hình hỗn hợp Gauss (Gaussian Mixture Models)","Mô hình K lân cận (K-nearest)"]},"b-20":{"q":"______ có thể được sử dụng để tìm một tập thưa các vị trí tương ứng trong các hình ảnh khác nhau. Chọn câu trả lời đúng nhất","options":["Đặc trưng cạnh (edge features)","Đặc trưng đường thẳng (line features)","Đặc trưng đối tượng (object features)","Đặc trưng điểm (point features)"]},"b-21":{"q":"______ là phép biến đổi bảo toàn tính thẳng hàng (collinearity) và tỉ lệ khoảng cách. Chọn đáp án đúng nhất","options":["Phép biến đổi xạ ảnh (Projective transformation)","Phép biến đổi Euclid (Euclidean transformation)","Phép biến đổi affine (Affine transformation)","Phép biến đổi đồng dạng (Similarity transformation)"]},"b-22":{"q":"Một ứng dụng thú vị của ghép ảnh (image stitching) là khả năng ______ được quay bằng camera xoay quét (panning)","options":["Hệ thống Video Brush","Ghép nhiều ảnh (Multiple-image stitching)","Kết cấu video toàn cảnh (Panoramic video textures)","Tóm tắt và nén video"]},"b-23":{"q":"Trong một ______, toán tử phát hiện đường (line detector) bao gồm một mặt nạ tích chập (convolution mask) được điều chỉnh để phát hiện sự hiện diện của các đường có độ rộng n và hướng θ cụ thể. Chọn đáp án đúng nhất","options":["Các kỹ thuật dựa trên nội dung (Content-based techniques)","Kỹ thuật Gauss (Gaussian
