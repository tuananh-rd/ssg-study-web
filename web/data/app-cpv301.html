ph\">[hình minh hoạ]</span><span class=\"img-ph\">[hình minh hoạ]</span></p><p><span class=\"img-ph\">[hình minh hoạ]</span></p><p><span class=\"img-ph\">[hình minh hoạ]</span></p>"}]}],"questions":[],"past":[],"pastExams":[],"glossary":[],"quick":[],"compares":[],"keyq":[],"recall":[{"id":"r-m1-001","module":"m1","ref":"1.1","type":"recall","kind":"manual","q":"Mục tiêu cốt lõi của lĩnh vực Thị giác máy tính (Computer Vision) là gì?","correct":"Cho phép máy móc \"nhìn\" và hiểu thế giới trực quan giống như con người","wrong":["Tối ưu hóa tốc độ truyền tải các tệp tin hình ảnh dung lượng lớn qua mạng Internet","Tự động hóa việc nén dung lượng các video mà không cần qua giải mã dữ liệu","Thiết kế các phần cứng chuyên dụng để lưu trữ ma trận điểm ảnh độc lập"],"explain":"Thị giác máy tính là lĩnh vực khoa học máy tính cho phép máy móc \"nhìn\" và hiểu thế giới trực quan giống như con người.","tip":"Mục tiêu của Computer Vision là giúp máy móc hiểu hình ảnh như con người."},{"id":"r-m1-002","module":"m1","ref":"1.1","type":"recall","kind":"manual","q":"Trong chuẩn biểu diễn ảnh số 8-bit, giá trị điểm ảnh (pixel value) của ảnh xám (Grayscale Image) có ý nghĩa như thế nào?","correct":"Đại diện cho cường độ sáng với dải giá trị từ 0 (đen hoàn toàn) đến 255 (trắng hoàn toàn)","wrong":["Đại diện cho bước sóng ánh sáng với dải giá trị từ 0 (tia hồng ngoại) đến 255 (tia tử ngoại)","Biểu thị tần số quét của màn hình hiển thị trong phạm vi từ 0 Hz đến 255 Hz","Xác định tọa độ không gian 2D của điểm ảnh trong ma trận dữ liệu"],"explain":"Ảnh xám 8-bit chỉ mang 1 giá trị duy nhất từ 0 đến 255 đại diện cho cường độ sáng, trong đó 0 là màu đen hoàn toàn và 255 là màu trắng hoàn toàn.","tip":"Ảnh xám: 0 = đen, 255 = trắng, nằm giữa là các mức xám."},{"id":"r-m1-003","module":"m1","ref":"1.1","type":"recall","kind":"manual","q":"Trong không gian màu RGB, điểm ảnh mang cụm giá trị [255, 255, 0] sẽ hiển thị màu sắc nào?","correct":"Màu vàng","wrong":["Màu cánh sen (Magenta)","Màu xanh lơ (Cyan)","Màu trắng"],"explain":"Trong mô hình RGB, khi trộn tối đa kênh Đỏ (255) và kênh Xanh lá (255) trong khi kênh Xanh dương bằng 0, màu tạo thành là màu vàng.","tip":"Đỏ + Xanh lá = Vàng (Red + Green = Yellow)."},{"id":"r-m1-004","module":"m1","ref":"1.1","type":"recall","kind":"manual","q":"Điểm khác biệt cơ bản giữa cách thu nhận hình ảnh của máy tính so với mắt người là gì?","correct":"Máy tính nhìn hình ảnh dưới dạng cấu trúc ma trận gồm các con số đại diện cho cường độ sáng","wrong":["Máy tính tự nhiên diễn dịch câu chuyện và ngữ cảnh cảm xúc tốt hơn mắt người","Máy tính chỉ có thể tiếp nhận ánh sáng đơn sắc mà không xử lý được các kênh màu","Máy tính giải mã hình ảnh trực tiếp thông qua sóng âm thanh từ cảm biến môi trường"],"explain":"Máy tính không nhìn thấy hình ảnh nguyên bản như mắt người mà chỉ thấy cấu trúc ma trận số chứa các giá trị pixel đại diện cho cường độ sáng.","tip":"Mắt người cảm nhận ngữ cảnh, máy tính chỉ thấy ma trận số."},{"id":"r-m1-005","module":"m1","ref":"1.1","type":"recall","kind":"manual","q":"Trong thư viện OpenCV bằng ngôn ngữ Python, hàm nào được dùng để hiển thị hình ảnh trong một cửa sổ giao diện?","correct":"cv2.imshow()","wrong":["cv2.imread()","cv2.imwrite()","cv2.display()"],"explain":"`cv2.imshow()` được sử dụng để hiển thị ảnh trong một cửa sổ, trong khi `cv2.imread()` dùng để đọc ảnh từ file.","tip":"imread = đọc ảnh, imshow = hiển thị ảnh lên cửa sổ."},{"id":"r-m1-006","module":"m1","ref":"1.2","type":"recall","kind":"manual","q":"Trong không gian tọa độ đồng nhất (Homogeneous coordinates), điểm 2D được biểu diễn dưới dạng vector (x, y, w) khi w = 0 đại diện cho vị trí nào?","correct":"Điểm tại vô cực","wrong":["Điểm gốc tọa độ (0, 0)","Điểm trung tâm của ma trận ảnh","Điểm không xác định do lỗi tràn số"],"explain":"Tọa độ thực tế là (x/w, y/w), do đó khi w = 0, điểm đó đại diện cho một điểm nằm tại vô cực.","tip":"Trong tọa độ đồng nhất, w = 0 tương ứng với điểm ở vô cực."},{"id":"r-m1-007","module":"m1","ref":"1.2","type":"recall","kind":"manual","q":"Phép biến đổi hình học (Geometric Transformation) có đặc điểm cốt lõi nào sau đây?","correct":"Làm thay đổi cấu trúc không gian của bức ảnh mà không làm thay đổi giá trị điểm ảnh","wrong":["Làm thay đổi cường độ sáng và màu sắc của điểm ảnh nhưng giữ nguyên tọa độ không gian","Chuyển đổi bức ảnh thành ma trận nhị phân để giảm dung lượng lưu trữ","Tự động khử bỏ toàn bộ quang sai màu của hệ thống thấu kính quang học"],"explain":"Phép biến đổi hình học làm thay đổi cấu trúc không gian của bức ảnh mà không làm thay đổi giá trị điểm ảnh (cường độ sáng/màu sắc).","tip":"Biến đổi hình học thay đổi tọa độ không gian (domain), không đổi giá trị pixel (range)."},{"id":"r-m1-008","module":"m1","ref":"1.2","type":"recall","kind":"manual","q":"Phép biến đổi Affine luôn bảo toàn (preserves) đặc tính hình học nào của các đối tượng trong ảnh?","correct":"Tính song song của các đường thẳng","wrong":["Góc vuông giữa các đường thẳng cắt nhau","Khoảng cách tuyệt đối Euclid giữa hai điểm bất kỳ","Tỷ lệ diện tích của các hình khối phức tạp"],"explain":"Phép biến đổi Affine bao gồm co giãn, xoay và làm xiên (skew), và luôn giữ nguyên tính song song của các đường thẳng.","tip":"Affine giữ tính song song; Projective chỉ giữ độ thẳng."},{"id":"r-m1-009","module":"m1","ref":"1.2","type":"recall","kind":"manual","q":"Phép biến đổi phối cảnh (Projective Transformation) bảo toàn đặc tính nào của các đường trong ảnh?","correct":"Giữ nguyên độ thẳng của các đường thẳng","wrong":["Giữ nguyên tính song song của các đường thẳng","Giữ nguyên góc giữa các đường thẳng giao nhau","Giữ nguyên diện tích và chu vi của đối tượng"],"explain":"Phép biến đổi Projective mô phỏng phối cảnh khi thay đổi điểm nhìn, các đường thẳng song song có thể hội tụ tại điểm ảo nhưng vẫn giữ nguyên độ thẳng của các đường.","tip":"Phối cảnh làm các đường song song hội tụ tại điểm ảo, nhưng đường thẳng vẫn là đường thẳng."},{"id":"r-m1-010","module":"m1","ref":"1.2","type":"recall","kind":"manual","q":"Bậc tự do (Degrees of Freedom - DoF) của một phép biến đổi hình học được định nghĩa là gì?","correct":"Số lượng các tham số độc lập tối thiểu cần thiết để xác định hoàn toàn phép biến đổi đó","wrong":["Số lượng điểm ảnh tối đa có thể dịch chuyển trong một bước biến đổi","Tổng số chiều không gian của ma trận tọa độ đồng nhất cộng thêm một","Số bước lặp cần thiết để thuật toán biến đổi hình học đạt trạng thái hội tụ"],"explain":"DOF là số lượng các tham số độc lập tối thiểu cần thiết để xác định hoàn toàn một phép biến đổi.","tip":"DoF = số tham số độc lập tối thiểu để xác định biến đổi (ví dụ Translation 2D có DoF = 2)."},{"id":"r-m1-011","module":"m1","ref":"1.2","type":"recall","kind":"manual","q":"Điểm khác biệt chính giữa phép chiếu trực giao (Orthography) và phép chiếu phối cảnh (Perspective) từ không gian 3D sang 2D là gì?","correct":"Phép chiếu trực giao bỏ qua hiệu ứng độ sâu bằng cách loại bỏ trục z mà không cần phép chia","wrong":["Phép chiếu trực giao bảo tồn tỷ lệ vật thể ở xa trông nhỏ hơn vật thể ở gần","Phép chiếu trực giao yêu cầu tính toán điểm hội tụ ảo trên mặt phẳng hình ảnh","Phép chiếu trực giao chỉ có thể áp dụng với các camera có ống kính góc siêu rộng"],"explain":"Phép chiếu trực giao đơn giản loại bỏ trục z để lấy tọa độ (x, y) và bỏ qua hiệu ứng độ sâu (không cần phép chia), trong khi phép chiếu phối cảnh mô hình camera thực tế với vật ở xa nhỏ hơn.","tip":"Trực giao (Orthography) = bỏ trục z, không cần chia, không có chiều sâu."},{"id":"r-m1-012","module":"m1","ref":"1.2","type":"recall","kind":"manual","q":"Trong OpenCV, hàm nào được sử dụng để tính ma trận biến đổi quay 2D quanh một tâm với góc quay và tỷ lệ xác định?","correct":"cv2.getRotationMatrix2D()","wrong":["cv2.warpAffine()","cv2.findHomography()","cv2.rotateMatrix()"],"explain":"`cv2.getRotationMatrix2D((center), angle, scale)` dùng để tính ma trận quay 2x3, sau đó áp dụng biến đổi bằng `cv2.warpAffine()`."},{"id":"r-m1-013","module":"m1","ref":"1.3","type":"recall","kind":"manual","q":"Theo Định luật Cosine Lambert, cường độ ánh sáng phản xạ khuếch tán (Diffuse Reflection) từ một bề mặt nhám phụ thuộc vào yếu tố nào?","correct":"Góc giữa tia sáng tới và vector pháp tuyến của bề mặt","wrong":["Khoảng cách giữa mắt người quan sát và cảm biến camera","Tỷ lệ chiết suất của thủy tinh làm ống kính đối với ánh sáng trắng","Độ mở khẩu độ và thời gian phơi sáng của màn trập máy ảnh"],"explain":"Phản xạ khuếch tán tán xạ đều ra mọi hướng; lượng ánh sáng phản xạ phụ thuộc vào góc giữa tia sáng tới và pháp tuyến của bề mặt theo Định luật Cosine Lambert.","tip":"Lambert: phản xạ khuếch tán tỷ lệ với cosin góc tới so với pháp tuyến."},{"id":"r-m1-014","module":"m1","ref":"1.3","type":"recall","kind":"manual","q":"Mô hình chiếu sáng Phong (Phong Shading) kết hợp những thành phần ánh sáng nào để mô phỏng chiếu sáng hoàn chỉnh?","correct":"Ánh sáng môi trường (Ambient) + Phản xạ khuếch tán (Diffuse) + Phản xạ gương (Specular)","wrong":["Phản xạ khuếch tán (Diffuse) + Khúc xạ ánh sáng (Refraction) + Tán xạ Rayleigh","Ánh sáng môi trường (Ambient) + Bức xạ nhiệt (Radiosity) + Tán xạ quang sai","Phản xạ gương (Specular) + Chiết suất thấu kính + Dò tia (Ray tracing)"],"explain":"Phong Shading là mô hình kết hợp Ambient (môi trường) + Diffuse (khuếch tán) + Specular (gương) để tạo ra mô phỏng chiếu sáng hoàn chỉnh.","tip":"Phong Shading = Ambient + Diffuse + Specular."},{"id":"r-m1-015","module":"m1","ref":"1.3","type":"recall","kind":"manual","q":"Kỹ thuật Dò tia (Ray Tracing) và Radiosity phù hợp nhất với những loại bề mặt tương tác ánh sáng nào?","correct":"Ray tracing phù hợp bề mặt gương/phản xạ mạnh, còn Radiosity dùng cho các bề mặt nhám","wrong":["Ray tracing phù hợp bề mặt nhám hoàn toàn, còn Radiosity chỉ dùng cho gương cầu lồi","Cả hai kỹ thuật đều chỉ áp dụng cho bề mặt chất lỏng có độ trong suốt tuyệt đối","Ray tracing dùng cho nguồn sáng diện tích, còn Radiosity dùng cho nguồn sáng điểm"],"explain":"Ray tracing truy vết tia sáng từ camera ngược về nguồn sáng qua nhiều lần nảy, phù hợp với bề mặt gương/phản xạ mạnh. Radiosity giải quyết bài toán tương tác ánh sáng giữa các mặt phẳng nhám.","tip":"Ray tracing = bề mặt gương; Radiosity = bề mặt nhám."},{"id":"r-m1-016","module":"m1","ref":"1.3","type":"recall","kind":"manual","q":"Hiện tượng quang sai màu (Chromatic aberration) trong hệ thống quang học bắt nguồn từ nguyên nhân vật lý nào?","correct":"Chiết suất của thủy tinh thay đổi nhẹ theo các bước sóng ánh sáng khác nhau","wrong":["Cường độ nguồn sáng điểm không đồng đều khi chiếu qua khẩu độ ống kính","Hiện tượng tràn điện tích giữa các tế bào cảm biến lân cận trên mảng cảm biến","Màn trập camera đóng mở quá nhanh làm sai lệch thời gian phơi sáng"],"explain":"Quang sai màu xảy ra do chiết suất của thủy tinh thay đổi nhẹ theo các bước sóng ánh sáng khác nhau, đòi hỏi ống kính phức hợp để khắc phục.","tip":"Quang sai màu là do chiết suất thấu kính thay đổi theo bước sóng màu."},{"id":"r-m1-017","module":"m1","ref":"1.3","type":"recall","kind":"manual","q":"Đặc tính quan trọng nào của hàm phân phối phản xạ hai chiều BRDF (Bidirectional Reflectance Distribution Function) được nêu trong tài liệu?","correct":"Hàm BRDF có tính thuận nghịch","wrong":["Hàm BRDF luôn có giá trị bằng hằng số đối với mọi bước sóng ánh sáng","Hàm BRDF chỉ phụ thuộc vào góc quan sát mà không phụ thuộc vào góc tới","Hàm BRDF chỉ áp dụng được cho nguồn sáng diện tích vô hạn"],"explain":"Hàm BRDF mô tả tỷ lệ ánh sáng phản xạ tới các hướng dựa trên góc tới của ánh sáng và hàm này có tính thuận nghịch.","tip":"BRDF có tính chất đối xứng thuận nghịch (reciprocity)."},{"id":"r-m1-018","module":"m1","ref":"1.4","type":"recall","kind":"manual","q":"So với cảm biến CCD, cảm biến CMOS có ưu điểm đặc trưng nào trong cơ chế đọc dữ liệu tín hiệu?","correct":"Có thể đọc dữ liệu từ từng pixel riêng biệt một cách độc lập","wrong":["Có độ nhạy sáng cao hơn và hoàn toàn không bị ảnh hưởng bởi nhiễu nhiệt","Không bao giờ bị hiện tượng tràn sáng chói (blooming) ở mọi điều kiện chiếu sáng","Tiêu thụ năng lượng cao hơn giúp tăng tốc độ chuyển đổi tín hiệu ADC"],"explain":"Cảm biến CMOS có thể đọc dữ liệu từ từng pixel riêng biệt một cách độc lập và rẻ hơn, trong khi CCD không thể đọc từng pixel độc lập.","tip":"CMOS: đọc từng pixel độc lập, tiết kiệm điện hơn; CCD: nhạy sáng cao hơn nhưng dễ bị blooming."},{"id":"r-m1-019","module":"m1","ref":"1.4","type":"recall","kind":"manual","q":"Hiện tượng tràn sáng chói (blooming) là hạn chế thường dễ gặp nhất ở loại cảm biến nào?","correct":"Cảm biến CCD (Charge-Coupled Device)","wrong":["Cảm biến CMOS","Cảm biến nhiệt hồng ngoại","Cảm biến mảng lọc màu CFA"],"explain":"Cảm biến CCD có độ nhạy sáng cao nhưng dễ bị hiện tượng \"blooming\" (tràn sáng chói).","tip":"Blooming (tràn sáng chói) đặc trưng của cảm biến CCD."},{"id":"r-m1-020","module":"m1","ref":"1.4","type":"recall","kind":"manual","q":"Trong không gian màu HSV, thành phần Hue (sắc độ) biểu diễn giá trị góc 120 độ tương ứng với màu nào?","correct":"Màu xanh lá (Green)","wrong":["Màu đỏ (Red)","Màu xanh dương (Blue)","Màu vàng (Yellow)"],"explain":"Trong HSV, Hue là góc từ 0 đến 360 độ: 0 độ là đỏ, 120 độ là xanh lá, 240 độ là xanh dương.","tip":"HSV Hue: 0° Đỏ, 120° Xanh lá, 240° Xanh dương."},{"id":"r-m1-021","module":"m1","ref":"1.4","type":"recall","kind":"manual","q":"Trong không gian màu YCbCr được ứng dụng rộng rãi cho nén ảnh JPEG và video, kênh Y đại diện cho thành phần nào?","correct":"Kênh độ sáng (Luma)","wrong":["Kênh màu xanh dương (Blue Chroma)","Kênh màu đỏ (Red Chroma)","Kênh độ bão hòa màu sắc (Saturation)"],"explain":"Không gian YCbCr phân tách kênh độ sáng (Luma - Y) và kênh màu (Chroma - Cb, Cr).","tip":"Y = Luma (độ sáng), Cb và Cr = Chroma (thông tin màu sắc)."},{"id":"r-m1-022","module":"m1","ref":"1.4","type":"recall","kind":"manual","q":"Chỉ số nào thường được sử dụng phổ biến nhất để đánh giá chất lượng của bức ảnh sau khi nén?","correct":"PSNR (Peak Signal-to-Noise Ratio)","wrong":["BRDF (Bidirectional Reflectance Distribution Function)","DoF (Degrees of Freedom)","AGC (Automatic Gain Control)"],"explain":"Chất lượng nén ảnh thường được đánh giá bằng chỉ số PSNR (Peak Signal-to-Noise Ratio).","tip":"PSNR: Tỷ số tín hiệu cực đại trên nhiễu dùng để đo chất lượng ảnh nén."},{"id":"r-m1-023","module":"m1","ref":"1.4","type":"recall","kind":"manual","q":"Thuật toán nén ảnh JPEG tận dụng đặc tính thị giác nào của mắt người để thực hiện lấy mẫu phụ (subsample) kênh màu?","correct":"Mắt người kém nhạy bén với sự thay đổi màu sắc hơn là chi tiết không gian","wrong":["Mắt người chỉ cảm nhận được dải phổ ánh sáng xanh lá và đỏ","Mắt người nhạy cảm với kênh Chroma hơn kênh Luma trong điều kiện thiếu sáng","Mắt người tự động cân bằng trắng đối với mọi loại ánh sáng đơn sắc"],"explain":"Thuật toán JPEG lấy mẫu phụ kênh màu dựa trên việc mắt người kém nhạy với màu sắc hơn là chi tiết không gian, kết hợp biến đổi DCT để nén.","tip":"JPEG subsample kênh màu vì mắt người nhạy với độ sáng (chi tiết) hơn màu sắc."},{"id":"r-m1-024","module":"m1","ref":"1.4","type":"recall","kind":"manual","q":"Nhóm định dạng tệp hình ảnh nào sau đây hoàn toàn thuộc nhóm nén không mất dữ liệu (Lossless)?","correct":"BMP, GIF, TIFF","wrong":["JPEG, MP4, WebP tổn thất","MPEG, H.264, JPEG","AVI, WMV, FLV"],"explain":"Các định dạng tiêu biểu của nhóm nén không mất dữ liệu (Lossless / Non-lossy) gồm BMP, GIF, TIFF, pbm/pgm/ppm/pnm. Trong khi JPEG là định dạng nén mất dữ liệu (Lossy).","tip":"Lossless: BMP, GIF, TIFF; Lossy: JPEG."},{"id":"r-m2-001","module":"m2","ref":"2.2","type":"recall","kind":"manual","q":"Toán tử điểm (Point Operators) trong xử lý ảnh có đặc điểm cơ bản nào sau đây?","correct":"Giá trị của điểm ảnh đầu ra tại mỗi vị trí chỉ phụ thuộc vào chính giá trị điểm ảnh đầu vào tại vị trí đó","wrong":["Giá trị của điểm ảnh đầu ra được tính từ tổ hợp tuyến tính của các điểm ảnh trong vùng lân cận","Thuật toán bắt buộc phải sắp xếp toàn bộ ma trận điểm ảnh trước khi thực hiện tính toán","Phép toán chỉ áp dụng được trên ảnh màu ba kênh RGB mà không xử lý được ảnh xám"],"explain":"Toán tử điểm là các phép toán xử lý ảnh trên từng điểm ảnh độc lập (pixel-by-pixel), giá trị điểm ảnh đầu ra chỉ phụ thuộc vào giá trị đầu vào tại chính vị trí đó mà không phụ thuộc vào các điểm lân cận.","tip":"Toán tử điểm = xử lý pixel-by-pixel, không phụ thuộc lân cận."},{"id":"r-m2-002","module":"m2","ref":"2.2","type":"recall","kind":"manual","q":"Trong hàm biến đổi tuyến tính g(x,y) = a * f(x,y) + b, hai tham số a (Gain) và b (Bias) lần lượt kiểm soát đặc tính nào của ảnh?","correct":"Tham số a kiểm soát độ tương phản (contrast), tham số b kiểm soát độ sáng (brightness)","wrong":["Tham số a kiểm soát độ sáng (brightness), tham số b kiểm soát độ tương phản (contrast)","Tham số a kiểm soát góc xoay, tham số b kiểm soát hệ số co giãn không gian","Tham số a kiểm soát độ bão hòa màu sắc, tham số b kiểm soát sắc độ ảnh"],"explain":"Trong phương trình tuyến tính, hệ số tỷ lệ a (Gain) kiểm soát độ tương phản (contrast), và hệ số cộng b (Bias) kiểm soát độ sáng (brightness).","tip":"Gain = contrast (nhân), Bias = brightness (cộng)."},{"id":"r-m2-003","module":"m2","ref":"2.2","type":"recall","kind":"manual","q":"Kỹ thuật Cân bằng lược đồ xám (Histogram Equalization) chuẩn hóa mức xám của bức ảnh dựa trên hàm số nào?","correct":"Hàm phân phối tích lũy (Cumulative Distribution Function - CDF)","wrong":["Hàm mật độ xác suất chuẩn một chiều Gaussian","Hàm biến đổi Fourier rời rạc hai chiều","Hàm tự tương quan đạo hàm bậc nhất của ma trận ảnh"],"explain":"Cân bằng lược đồ xám dàn đều các giá trị cường độ sáng sang toàn dải 0-255 và chuẩn hóa giá trị mức xám dựa trên hàm phân phối tích lũy (CDF).","tip":"Histogram Equalization dùng hàm CDF để dàn đều dải mức xám."},{"id":"r-m2-004","module":"m2","ref":"2.2","type":"recall","kind":"manual","q":"Mục đích chính của thao tác Kéo giãn tương phản (Contrast Stretching) là gì?","correct":"Tự động co giãn dải giá trị pixel hiện tại sang dải động tối đa cho phép (0-255)","wrong":["Chuyển đổi toàn bộ điểm ảnh xám thành hai mức nhị phân duy nhất 0 và 255","Làm mờ nhẹ vùng lân cận để triệt tiêu hiện tượng nhiễu hạt tiêu","Phân tách bức ảnh thành nhiều thành phần liên thông độc lập"],"explain":"Kéo giãn tương phản tự động co giãn dải giá trị pixel hiện tại sang dải động tối đa cho phép (0-255) nhằm cải thiện các bức ảnh bị mờ hoặc thiếu sáng trầm trọng.","tip":"Contrast Stretching = mở rộng dải mức xám hẹp ra toàn dải 0-255."},{"id":"r-m2-005","module":"m2","ref":"2.2","type":"recall","kind":"manual","q":"Trong phép trộn ảnh tuyến tính g(x,y) = (1 - alpha) * f0(x,y) + alpha * f1(x,y), kỹ thuật này thường được ứng dụng phổ biến nhất trong trường hợp nào?","correct":"Hiệu ứng chồng mờ ảnh (cross-fading) và pha trộn kênh alpha (alpha blending)","wrong":["Khử nhiễu muối tiêu và bảo toàn các đường biên có độ tương phản cao","Tìm giao điểm của các đường thẳng trong không gian tọa độ cực","Căn chỉnh tự động các góc nghiêng của tài liệu văn bản"],"explain":"Phép trộn ảnh tuyến tính thực hiện tổ hợp tuyến tính hai ảnh theo trọng số alpha, được ứng dụng phổ biến trong kỹ thuật chồng mờ ảnh (cross-fading) và alpha blending.","tip":"Linear blend kết hợp 2 ảnh qua alpha, dùng trong cross-fading."},{"id":"r-m2-006","module":"m2","ref":"2.3","type":"recall","kind":"manual","q":"Điểm khác biệt mấu chốt về mặt toán học giữa phép Tích chập (Convolution) và phép Tương quan (Correlation) trong xử lý ảnh là gì?","correct":"Hạt nhân bộ lọc (kernel) trong phép tích chập được lật ngược theo cả chiều ngang và chiều dọc trước khi nhân tổng","wrong":["Phép tích chập chỉ áp dụng được trên ảnh màu còn phép tương quan chỉ dùng cho ảnh xám","Phép tích chập sử dụng phép nhân ma trận phi tuyến tính thay vì tổ hợp tuyến tính","Phép tích chập bắt buộc phải sắp xếp các giá trị pixel trong cửa sổ lân cận theo thứ tự tăng dần"],"explain":"Tích chập giống tương quan nhưng kernel được lật ngược theo cả chiều ngang và chiều dọc (lật 180 độ) trước khi thực hiện tính toán nhân tổng.","tip":"Convolution = Correlation + lật ngược kernel 180°."},{"id":"r-m2-007","module":"m2","ref":"2.3","type":"recall","kind":"manual","q":"Bộ lọc nào là giải pháp tối ưu nhất để loại bỏ nhiễu hạt tiêu (Salt and Pepper noise) mà vẫn bảo toàn độ sắc nét của đường biên cạnh?","correct":"Bộ lọc trung vị (Median Filter)","wrong":["Bộ lọc trung bình (Mean Filter)","Bộ lọc Gaussian (Gaussian Smoothing)","Bộ lọc thông cao Laplacian"],"explain":"Bộ lọc trung vị sắp xếp các pixel trong cửa sổ rồi lấy giá trị ở giữa, là giải pháp hoàn hảo để loại bỏ nhiễu hạt tiêu mà vẫn giữ được độ sắc nét của biên cạnh.","tip":"Nhiễu hạt tiêu (Salt & Pepper) -> dùng bộ lọc Median."},{"id":"r-m2-008","module":"m2","ref":"2.3","type":"recall","kind":"manual","q":"Cơ chế hoạt động nào giúp Bộ lọc song phương (Bilateral Filter) vừa làm mịn bề mặt phẳng vừa bảo toàn đường biên cạnh có độ tương phản cao?","correct":"Kết hợp cả khoảng cách không gian lẫn sự sai khác về cường độ màu sắc/độ sáng khi tính trọng số","wrong":["Lật ngược mặt nạ lọc 180 độ và chỉ lấy giá trị trung vị của các pixel lân cận","Sử dụng đạo hàm bậc hai để xác định các điểm giao cắt bằng không (zero-crossings)","Nhân trực tiếp ma trận ảnh với ma trận quay trong không gian tọa độ đồng nhất"],"explain":"Bộ lọc song phương kết hợp cả khoảng cách không gian lẫn sự sai khác về cường độ màu sắc/độ sáng khi tính trọng số, nhờ đó làm mịn vùng phẳng nhưng bảo toàn cực tốt các đường biên.","tip":"Bilateral filter: lọc 2 tiêu chí (khoảng cách không gian + sai biệt độ sáng) để giữ biên."},{"id":"r-m2-009","module":"m2","ref":"2.3","type":"recall","kind":"manual","q":"Hạn chế lớn nhất của Bộ lọc trung bình (Mean Filter) khi áp dụng để làm mịn hình ảnh là gì?","correct":"Làm mờ và nhòe các đường biên cạnh sắc nét của đối tượng","wrong":["Làm tăng độ nhiễu hạt tiêu do khuếch đại các điểm ngoại lai","Tạo ra các lỗ trống không xác định trên ma trận điểm ảnh đích","Làm biến dạng hình học của các đường thẳng song song trong ảnh"],"explain":"Bộ lọc trung bình thay thế pixel trung tâm bằng giá trị trung bình của vùng lân cận, có tác dụng làm mịn nhưng làm nhòe các đường biên cạnh.","tip":"Mean filter tính trung bình cộng nên làm nhòe biên."},{"id":"r-m2-010","module":"m2","ref":"2.3","type":"recall","kind":"manual","q":"Khi đặt mặt nạ kernel ở các pixel cạnh biên của bức ảnh, các phương pháp xử lý biên ảnh (Border Handling) phổ biến gồm những kỹ thuật nào?","correct":"Giữ nguyên giá trị biên không lọc, sao chép kéo dài giá trị biên (replicate), hoặc chèn thêm dải pixel bằng 0 (zero padding)","wrong":["Tự động xoay ảnh một góc 45 độ, chuyển đổi hệ màu sang HSV, hoặc nội suy song tuyến tính","Loại bỏ hoàn toàn kênh màu xanh lá, cân bằng lược đồ xám, hoặc nhân với ma trận nghịch đảo","Cắt bỏ toàn bộ các hàng và cột có chứa giá trị cường độ sáng lớn hơn 128"],"explain":"Các phương pháp xử lý biên ảnh phổ biến bao gồm: Giữ nguyên giá trị biên không lọc, sao chép kéo dài giá trị biên ra ngoài (replicate), hoặc chèn thêm các dải pixel có giá trị bằng 0 (zero padding).","tip":"Xử lý biên: no filter, replicate (sao chép biên), zero padding."},{"id":"r-m2-011","module":"m2","ref":"2.4","type":"recall","kind":"manual","q":"Biến đổi Fourier thực hiện chuyển đổi bức ảnh giữa hai không gian biểu diễn nào?","correct":"Từ miền không gian (Spatial Domain) sang miền tần số (Frequency Domain)","wrong":["Từ miền màu RGB sang không gian màu cảm nhận trực quan HSV","Từ không gian tọa độ Descartes sang không gian tọa độ cực (Hough Space)","Từ ma trận số nguyên 8-bit sang ma trận nhị phân sau phân ngưỡng"],"explain":"Biến đổi Fourier chuyển đổi bức ảnh từ không gian không gian (Spatial Domain - ma trận pixel thông thường) sang không gian tần số (Frequency Domain).","tip":"Fourier: Spatial Domain -> Frequency Domain."},{"id":"r-m2-012","module":"m2","ref":"2.4","type":"recall","kind":"manual","q":"Trong miền tần số của ảnh 2D, các thành phần tần số cao (High Frequencies) đại diện cho thông tin nào của bức ảnh?","correct":"Các chi tiết nhỏ, các vùng thay đổi cường độ sáng đột ngột, đường biên cạnh hoặc nhiễu","wrong":["Các vùng cấu trúc phẳng rộng lớn có cường độ sáng thay đổi chậm hoặc đồng đều","Giá trị trung bình độ sáng của toàn bộ bức ảnh tại gốc tọa độ","Tỷ lệ co giãn đồng dạng của các đối tượng hình học trong không gian"],"explain":"Tần số thấp đại diện cho cấu trúc lớn, vùng mịn; tần số cao đại diện cho chi tiết nhỏ, thay đổi cường độ đột ngột, đường biên cạnh (edges) hoặc nhiễu (noise).","tip":"Low frequency = vùng mịn/bề mặt; High frequency = biên cạnh, chi tiết, nhiễu."},{"id":"r-m2-013","module":"m2","ref":"2.4","type":"recall","kind":"manual","q":"Trong các cặp biến đổi Fourier kinh điển, tín hiệu dạng Bộ lọc hộp (Box filter) ở miền không gian tương ứng với hàm nào ở miền tần số?","correct":"Hàm Sinc","wrong":["Hàm Gaussian","Hàm hằng số","Hàm xung đơn độc (Impulse)"],"explain":"Bộ lọc hộp ở miền không gian tương ứng với hàm Sinc ở miền tần số, gây ra hiện tượng gợn sóng khi lọc.","tip":"Box filter <-> Sinc; Gaussian <-> Gaussian; Impulse <-> Hằng số."},{"id":"r-m2-014","module":"m2","ref":"2.4","type":"recall","kind":"manual","q":"Để làm mịn ảnh và triệt tiêu bớt nhiễu trong miền tần số, người ta thiết kế bộ lọc nào sau đây?","correct":"Bộ lọc thông thấp (Low-pass filter) để giữ lại các thành phần tần số thấp","wrong":["Bộ lọc thông cao (High-pass filter) để giữ lại các thành phần tần số cao","Bộ lọc trung vị phi tuyến tính để đảo ngược pha của các sóng điều hòa","Bộ lọc bất đẳng hướng để khuếch đại các biên cạnh sắc nhọn"],"explain":"Thiết kế bộ lọc thông thấp (Low-pass filter) để giữ lại tần số thấp giúp làm mờ nhiễu, trong khi bộ lọc thông cao (High-pass filter) giữ lại tần số cao giúp làm sắc nét biên.","tip":"Low-pass = giữ tần số thấp (làm mờ, khử nhiễu); High-pass = giữ tần số cao (sắc nét biên)."},{"id":"r-m2-015","module":"m2","ref":"2.4","type":"recall","kind":"manual","q":"Thuật toán nén ảnh JPEG sử dụng biến thể nào của biến đổi Fourier làm nền tảng cốt lõi?","correct":"Biến đổi Cosine rời rạc (Discrete Cosine Transform - DCT)","wrong":["Biến đổi Hough (Hough Transform)","Biến đổi Affine (Affine Transform)","Phân tích suy biến ma trận (SVD)"],"explain":"Thuật toán nén JPEG sử dụng biến đổi Cosine rời rạc (DCT) - một biến thể của Fourier - để loại bỏ bớt các thành phần tần số màu sắc cao.","tip":"Nén ảnh JPEG dùng biến đổi DCT (biến thể của Fourier)."},{"id":"r-m2-016","module":"m2","ref":"2.5","type":"recall","kind":"manual","q":"Hạn chế lớn nhất của kỹ thuật Biến đổi tiến (Forward Warping) khi thực hiện biến đổi hình học ảnh là gì?","correct":"Tạo ra các lỗ trống (holes) và vết nứt (cracks) trên ảnh đích do việc làm tròn tọa độ số thực","wrong":["Làm sai lệch toàn bộ dải màu của ảnh đích do hiện tượng mất kênh Luma","Đòi hỏi ma trận biến đổi bắt buộc phải có tính chất khả nghịch và trực giao","Tốn bộ nhớ gấp đôi do phải lưu trữ toàn bộ các mức phân giải MIP-map"],"explain":"Trong Forward Warping, khi tọa độ mới x' nhận giá trị thực không nguyên, việc làm tròn tọa độ sẽ tạo ra các lỗ trống (holes) và vết nứt (cracks) trên ảnh đích.","tip":"Forward Warping: làm tròn tọa độ đích sinh ra holes và cracks."},{"id":"r-m2-017","module":"m2","ref":"2.5","type":"recall","kind":"manual","q":"Kỹ thuật Biến đổi ngược (Inverse Warping) khắc phục triệt để vấn đề lỗ trống bằng cách thức nào?","correct":"Duyệt qua từng pixel của ảnh đích, tìm ngược tọa độ trên ảnh nguồn và sử dụng các thuật toán nội suy","wrong":["Duyệt qua từng pixel ảnh nguồn và làm tròn tọa độ đến số nguyên gần nhất trên ảnh đích","Áp dụng trực tiếp bộ lọc Gaussian lên ma trận ảnh trước khi thực hiện tịnh tiến","Khởi tạo lại toàn bộ giá trị điểm ảnh bằng phân phối tích lũy CDF"],"explain":"Inverse Warping duyệt qua từng pixel của ảnh đích, tìm ngược tọa độ x = h_inverse(x') trên ảnh nguồn và dùng các thuật toán nội suy (Interpolation) để giải quyết triệt để vấn đề lỗ trống.","tip":"Inverse Warping: từ pixel đích tra ngược về ảnh gốc kết hợp nội suy."},{"id":"r-m2-018","module":"m2","ref":"2.5","type":"recall","kind":"manual","q":"Kỹ thuật MIP-mapping trong đồ họa máy tính hoạt động dựa trên nguyên lý nào để chống hiện tượng răng cưa?","correct":"Tạo sẵn chuỗi các phiên bản ảnh thu nhỏ với độ phân giải giảm dần (chia đôi kích thước liên tiếp)","wrong":["Tăng gấp đôi độ phân giải của ảnh gốc bằng phương pháp nội suy song tuyến tính liên tục","Chia tách ma trận biến đổi 2D thành hai phép biến đổi 1D gồm lấy mẫu lại và bẻ xiên","Áp dụng hàm phân phối Gaussian có độ lệch chuẩn vô hạn lên toàn bộ bề mặt đối tượng"],"explain":"MIP-mapping tạo sẵn chuỗi các phiên bản ảnh thu nhỏ với nhiều mức độ phân giải giảm dần (chia đôi kích thước liên tiếp), giúp chống răng cưa và tiết kiệm tài nguyên khi hiển thị vật thể ở xa.","tip":"MIP-map: chuỗi ảnh thu nhỏ chia đôi liên tiếp."},{"id":"r-m2-019","module":"m2","ref":"2.5","type":"recall","kind":"manual","q":"Bộ lọc nào sau đây được thiết kế chuyên biệt để bảo toàn độ sắc nét của kết cấu bề mặt khi quan sát ở các góc nghiêng cực hạn (extreme viewing angles)?","correct":"Lọc bất đẳng hướng (Anisotropic Filtering)","wrong":["Bộ lọc trung bình (Mean Filter)","Bộ lọc hộp (Box Filter)","Bộ lọc trung vị (Median Filter)"],"explain":"Lọc bất đẳng hướng (Anisotropic Filtering) giảm độ nhòe và bảo toàn độ sắc nét, chi tiết của bề mặt vật liệu khi nhìn ở các góc nghiêng cực hạn.","tip":"Góc nghiêng cực hạn (extreme viewing angles) -> Anisotropic Filtering."},{"id":"r-m2-020","module":"m2","ref":"2.5","type":"recall","kind":"manual","q":"Kỹ thuật Biến đổi đa bước (Multi-pass Transforms) tối ưu hóa tốc độ xử lý phần cứng bằng phương pháp nào?","correct":"Chia tách một phép biến đổi hình học 2D phức tạp thành một chuỗi các phép biến đổi 1D nối tiếp nhau","wrong":["Lặp lại phép biến đổi 2D qua nhiều khung hình với các hệ số tỷ lệ giảm dần","Thực hiện đồng thời cả biến đổi tiến và biến đổi ngược trên cùng một ma trận ảnh","Chuyển toàn bộ tọa độ điểm ảnh sang không gian Fourier trước khi thực hiện phép quay"],"explain":"Biến đổi đa bước chia tách một phép biến đổi hình học 2D phức tạp thành một chuỗi các phép biến đổi 1D (resampling và shearing) nối tiếp nhau giúp tăng tối đa tốc độ tính toán phần cứng.","tip":"Multi-pass Transforms: tách biến đổi 2D thành chuỗi 1D (resampling + shearing)."},{"id":"r-m3-001","module":"m3","ref":"3.2","type":"recall","kind":"manual","q":"Trong thuật toán phát hiện góc Harris Corner Detector, khi nào một điểm ảnh được xác định là thuộc về một Góc (Corner)?","correct":"Khi cả hai giá trị riêng λ1 và λ2 của ma trận cấu trúc đều lớn và xấp xỉ nhau (điểm R dương lớn)","wrong":["Khi một giá trị riêng rất lớn còn giá trị riêng kia xấp xỉ bằng không (điểm R có giá trị âm)","Khi cả hai giá trị riêng λ1 và λ2 đều rất nhỏ và xấp xỉ bằng không (điểm R nhỏ)","Khi hiệu số giữa hai giá trị riêng luôn vượt qua ngưỡng phân kỳ cực đại"],"explain":"Harris Corner Detector phân loại dựa trên các giá trị riêng: Vùng phẳng khi λ1 và λ2 đều nhỏ; Biên khi một giá trị vượt trội (R < 0); Góc khi λ1 và λ2 đều lớn và xấp xỉ nhau (R lớn).","tip":"Harris Corner: λ1 và λ2 đều lớn -> Góc (Corner); một lớn một nhỏ -> Biên (Edge); đều nhỏ -> Phẳng (Flat)."},{"id":"r-m3-002","module":"m3","ref":"3.2","type":"recall","kind":"manual","q":"Thuật toán trích xuất đặc trưng SIFT (Scale-Invariant Feature Transform) có đặc tính vượt trội nào giúp nhận dạng điểm đặc trưng bền vững?","correct":"Bất biến với tỷ lệ thu phóng (scale) và phép xoay (rotation) của bức ảnh","wrong":["Tự động chuyển đổi toàn bộ ảnh sang ma trận nhị phân không mất thông tin","Triệt tiêu hoàn toàn hiện tượng nhòe chuyển động bằng biến đổi Fourier rời rạc","Chỉ cần một giá trị ngưỡng cố định để tìm kiếm góc mà không cần tính gradient"],"explain":"SIFT là thuật toán cực kỳ mạnh mẽ, có khả năng bất biến với tỷ lệ (scale) và phép xoay (rotation).","tip":"SIFT: Scale-Invariant (bất biến tỷ lệ) + bất biến phép xoay."},{"id":"r-m3-003","module":"m3","ref":"3.2","type":"recall","kind":"manual","q":"Thứ tự chuẩn của các bước trong quy trình trích xuất đặc trưng của thuật toán SIFT là gì?","correct":"Tìm đỉnh trên không gian tỷ lệ → Định vị Keypoint → Gán hướng → Tạo Vector mô tả","wrong":["Gán hướng → Tạo Vector mô tả → Lọc nhiễu Gaussian → Tìm điểm Zero-crossing","Định vị Keypoint → Phân ngưỡng kép → Triệt tiêu phi cực đại → So khớp đặc trưng","Tạo Vector mô tả → Tìm ma trận Homography → Lấy mẫu MIP-mapping → Định vị Keypoint"],"explain":"Quy trình SIFT gồm: Tìm đỉnh trên không gian tỷ lệ (Scale-space peak selection) → Định vị Keypoint → Gán hướng (Orientation) → Tạo Vector mô tả (Descriptor) → Khớp.","tip":"Quy trình SIFT: Scale-space peak -> Keypoint localization -> Orientation assignment -> Keypoint descriptor."},{"id":"r-m3-004","module":"m3","ref":"3.2","type":"recall","kind":"manual","q":"Thuật toán ORB trong thị giác máy tính được phát triển dựa trên sự kết hợp của hai kỹ thuật nào?","correct":"Bộ phát hiện điểm FAST và bộ mô tả nhị phân BRIEF","wrong":["Bộ phát hiện góc Harris và bộ mô tả SIFT","Bộ lọc đạo hàm Sobel và biến đổi Cosine rời rạc DCT","Thuật toán RANSAC và bộ phân loại SVM"],"explain":"ORB là thuật toán trích xuất đặc trưng kết hợp giữa bộ dò điểm FAST và bộ mô tả dạng chuỗi nhị phân BRIEF.","tip":"ORB = Oriented FAST and Rotated BRIEF."},{"id":"r-m3-005","module":"m3","ref":"3.2","type":"recall","kind":"manual","q":"Trong kỹ thuật phát hiện biên ảnh, vector Gradient có hướng (direction) như thế nào so với hướng của đường biên thực tế?","correct":"Vuông góc với hướng của đường biên","wrong":["Song song hoàn toàn với hướng của đường biên","Tạo một góc cố định 45 độ so với đường biên","Ngược chiều với vector pháp tuyến của bề mặt vật thể"],"explain":"Vector Gradient trong xử lý ảnh có độ lớn biểu thị độ rõ nét của biên và hướng vuông góc với hướng của đường biên.","tip":"Gradient chỉ hướng thay đổi độ sáng mạnh nhất, tức vuông góc với đường biên."},{"id":"r-m3-006","module":"m3","ref":"3.2","type":"recall","kind":"manual","q":"Thứ tự chuẩn của 4 bước trong quy trình phát hiện biên (Edge Detection) là gì?","correct":"Lọc nhiễu (Filtering) → Tăng cường chi tiết (Enhancement) → Phân ngưỡng phát hiện (Detection/Thresholding) → Định vị chính xác (Localization)","wrong":["Phân ngưỡng phát hiện → Lọc nhiễu → Định vị chính xác → Tăng cường chi tiết","Tăng cường chi tiết → Định vị chính xác → Phân ngưỡng phát hiện → Lọc nhiễu","Lọc nhiễu → Định vị chính xác → Tạo Vector mô tả → Phân ngưỡng phát hiện"],"explain":"4 bước chuẩn để phát hiện biên là: Lọc nhiễu (Filtering) → Tăng cường chi tiết (Enhancement) → Phân ngưỡng phát hiện (Detection/Thresholding) → Định vị chính xác (Localization).","tip":"4 bước tìm biên: Lọc nhiễu -> Tăng cường -> Phân ngưỡng -> Định vị."},{"id":"r-m3-007","module":"m3","ref":"3.2","type":"recall","kind":"manual","q":"Phương pháp phát hiện biên Laplacian of Gaussian (LoG) xác định vị trí của đường biên dựa trên dấu hiệu toán học nào?","correct":"Điểm giao cắt qua giá trị không (Zero-crossing) của đạo hàm bậc hai","wrong":["Điểm cực đại toàn cục của hàm phân phối tích lũy CDF","Giao điểm của các đường cong hình sin trong không gian tham số","Điểm có giá trị đạo hàm bậc nhất tiến tới vô hạn"],"explain":"LoG dùng đạo hàm bậc 2 kết hợp làm mờ Gaussian để tìm điểm Zero-crossing nhằm xác định vị trí biên.","tip":"LoG dùng đạo hàm bậc 2 để tìm điểm Zero-crossing."},{"id":"r-m3-008","module":"m3","ref":"3.2","type":"recall","kind":"manual","q":"Vì sao thuật toán Canny được xem là chuẩn mực tối ưu nhất (optimal) trong các kỹ thuật phát hiện biên?","correct":"Ít nhạy với nhiễu, định vị biên cực tốt và chỉ trả về một đường biên mỏng duy nhất nhờ triệt tiêu phi cực đại và phân ngưỡng kép","wrong":["Chỉ sử dụng các phép tính cộng trừ số nguyên đơn giản trên kernel 2x2 giúp tiết kiệm bộ nhớ nhất","Không cần thiết lập bất kỳ tham số ngưỡng nào mà tự động thích ứng trên mọi loại ảnh","Hoạt động hoàn toàn độc lập với đạo hàm gradient và không bị ảnh hưởng bởi phép quay"],"explain":"Toán tử Canny được xem là chuẩn mực tối ưu nhất vì ít nhạy nhiễu, định vị biên cực tốt và chỉ trả về 1 đường biên mỏng duy nhất thông qua thuật toán triệt tiêu phi cực đại và phân ngưỡng kép.","tip":"Canny tối ưu nhờ: khử nhiễu Gaussian + Gradient + triệt tiêu phi cực đại + phân ngưỡng kép."},{"id":"r-m3-009","module":"m3","ref":"3.3","type":"recall","kind":"manual","q":"Trong thuật toán Biến đổi Hough (Hough Transform), phương trình đường thẳng được biểu diễn trong hệ tọa độ cực có dạng như thế nào?","correct":"d = x * cos(θ) + y * sin(θ)","wrong":["y = a * x + b","d = x * sin(θ) - y * cos(θ)","d^2 = (x - x0)^2 + (y - y0)^2"],"explain":"Biến đổi Hough biểu diễn đường thẳng bằng phương trình tọa độ cực: d = x*cos(θ) + y*sin(θ), trong đó d là khoảng cách từ gốc tọa độ đến đường thẳng và θ là góc pháp tuyến.","tip":"Hough Line biểu diễn cực: d = x*cos(θ) + y*sin(θ)."},{"id":"r-m3-010","module":"m3","ref":"3.3","type":"recall","kind":"manual","q":"Mỗi điểm biên (x, y) trong không gian ảnh thực khi chuyển sang không gian tham số Hough (Hough Space) sẽ tạo thành hình dạng nào?","correct":"Một đường cong hình sin","wrong":["Một điểm tọa độ duy nhất","Một đường thẳng dốc đứng","Một đường tròn đồng tâm"],"explain":"Mỗi điểm ảnh (x, y) trên không gian thực sẽ tạo thành một đường cong hình sin trong không gian tham số (Hough space).","tip":"Một điểm trong không gian ảnh = Một đường hình sin trong không gian Hough."},{"id":"r-m3-011","module":"m3","ref":"3.3","type":"recall","kind":"manual","q":"Trong không gian tham số Hough, vị trí của một đường thẳng thực tế trên ảnh được xác định bằng cách thức nào?","correct":"Tìm giao điểm có số phiếu tích lũy (voting) cao nhất của các đường cong hình sin","wrong":["Tính trung bình cộng tọa độ của tất cả các điểm nằm trên trục hoành","Tìm điểm có giá trị đạo hàm bậc hai bằng 0 (Zero-crossing)","Lấy mẫu ngẫu nhiên 4 điểm biên và giải ma trận Homography"],"explain":"Trong hệ thống bỏ phiếu (voting), giao điểm của nhiều đường cong trong không gian Hough (nơi có giá trị tích lũy/bin cao nhất) đại diện cho đường thẳng đi qua các điểm đó trên ảnh thực.","tip":"Giao điểm có số phiếu voting cao nhất trong Hough space = đường thẳng thực tế."},{"id":"r-m3-012","module":"m3","ref":"3.3","type":"recall","kind":"manual","q":"Thứ tự chuẩn của các bước trong quy trình phát hiện đường thẳng bằng Hough Transform là gì?","correct":"Tiền xử lý (Blur) → Canny (Tìm biên) → Lọc vùng quan tâm (Masking ROI) → Hough Transform","wrong":["Hough Transform → Canny (Tìm biên) → Lọc vùng quan tâm → Tiền xử lý (Blur)","Masking ROI → Hough Transform → Làm mờ Gaussian → Phân ngưỡng Otsu","Canny (Tìm biên) → Hough Transform → Trích xuất đặc trưng SIFT → Lọc Median"],"explain":"Quy trình chuẩn để phát hiện đường thẳng: Tiền xử lý (Blur) → Canny (Tìm biên) → Lọc vùng quan tâm (Masking ROI) → Hough Transform.","tip":"Blur -> Canny -> Mask ROI -> Hough Transform."},{"id":"r-m3-013","module":"m3","ref":"3.3","type":"recall","kind":"manual","q":"Phương pháp phát hiện đường thẳng dựa trên tích chập (Convolution-based) sử dụng các mặt nạ (masks) như thế nào để nhận diện hướng đường thẳng?","correct":"Dùng các mặt nạ có trọng số cao ở hàng giữa, cột giữa hoặc đường chéo để đánh giá độ phản hồi (response)","wrong":["Nhân ma trận ảnh với bộ lọc Gaussian hai chiều có độ lệch chuẩn biến thiên liên tục","Lật ngược ma trận ảnh theo chiều thẳng đứng và tính sai phân tích phân CDF","Dùng mặt nạ hình elip để gom cụm các pixel có cùng mức xám lại thành một điểm"],"explain":"Kỹ thuật dùng mặt nạ cụ thể như mặt nạ ngang (trọng số cao ở hàng giữa), mặt nạ dọc (trọng số cao ở cột giữa), mặt nạ chéo ±45 độ để đo phản hồi (response) xác định hướng đường thẳng.","tip":"Convolution-based line detection dùng các mask ngang/dọc/chéo để so khớp phản hồi."},{"id":"r-m4-001","module":"m4","ref":"4.2","type":"recall","kind":"manual","q":"Mục tiêu cốt lõi của bài toán Phân đoạn ảnh (Image Segmentation) là gì?","correct":"Chia bức ảnh thành các vùng riêng biệt và gán nhãn cho từng pixel có cùng đặc trưng chung","wrong":["Tạo ra một khung hình ảnh có độ phân giải siêu cao từ các ảnh thành phần có vùng chồng lấn","Tìm kiếm ma trận biến đổi phối cảnh 3x3 để căn chỉnh ảnh chụp tài liệu về dạng chuẩn","Lọc bỏ hoàn toàn các thành phần tần số cao để làm mịn toàn bộ phông nền bức ảnh"],"explain":"Phân đoạn ảnh là quá trình chia bức ảnh thành các vùng riêng biệt dựa trên các đặc trưng điểm ảnh (màu sắc, cường độ sáng, kết cấu) và gán nhãn cho từng pixel có cùng đặc trưng.","tip":"Segmentation = chia ảnh thành các vùng và gán nhãn cho từng pixel."},{"id":"r-m4-002","module":"m4","ref":"4.2","type":"recall","kind":"manual","q":"Vì sao kỹ thuật phân đoạn ảnh (Segmentation) đóng vai trò sinh tử trong chẩn đoán ung thư y tế hơn là phát hiện đối tượng (Object Detection)?","correct":"Giúp xác định hình dạng và đường viền chính xác của tế bào thay vì chỉ đóng khung bằng một hộp bao đơn thuần","wrong":["Cho phép trích xuất đặc trưng SIFT nhanh hơn gấp nhiều lần so với các mô hình mạng nơ-ron","Tự động phân tách các kênh màu YCbCr thành các thành phần tần số độc lập để nén ảnh","Triệt tiêu hoàn toàn hiện tượng blooming phát sinh từ cảm biến quang học CCD"],"explain":"Trong y tế, phân đoạn giúp xác định hình dạng chính xác của các tế bào ung thư để đánh giá mức độ nghiêm trọng, điều mà các bounding boxes của Object Detection thông thường không làm được.","tip":"Ung thư y tế cần hình dạng/đường viền chính xác của tế bào -> cần Segmentation."},{"id":"r-m4-003","module":"m4","ref":"4.2","type":"recall","kind":"manual","q":"Điểm khác biệt quan trọng giữa Phân đoạn thực thể (Instance Segmentation) và Phân đoạn ngữ nghĩa (Semantic Segmentation) là gì?","correct":"Phân đoạn thực thể phân tách rõ ràng từng cá thể đối tượng độc lập trong cùng một lớp ngữ nghĩa","wrong":["Phân đoạn thực thể chỉ phân loại toàn bộ bức ảnh vào đúng một nhãn duy nhất mà không gán nhãn pixel","Phân đoạn thực thể chỉ áp dụng được trên ảnh đa phổ mà không hoạt động trên ảnh màu RGB thông thường","Phân đoạn thực thể không thể phân biệt được đối tượng thuộc lớp người và đối tượng thuộc lớp xe cộ"],"explain":"Semantic Segmentation chỉ phân loại pixel thuộc lớp nào, còn Instance Segmentation vừa phân loại lớp vừa tách biệt rõ ràng từng cá thể thực thể khác nhau trong cùng một lớp.","tip":"Semantic: nhãn theo lớp; Instance: tách từng cá thể trong lớp."},{"id":"r-m4-004","module":"m4","ref":"4.2","type":"recall","kind":"manual","q":"Trong bài toán Phân đoạn ngữ nghĩa (Semantic Segmentation), mô hình thực hiện gán nhãn ở cấp độ nào?","correct":"Gán nhãn lớp đối tượng cho từng điểm ảnh (pixel-level)","wrong":["Gán nhãn phân loại cho toàn bộ bức ảnh (image-level)","Gán nhãn cho một hộp giới hạn hình chữ nhật (bounding-box level)","Gán nhãn cho từng chuỗi khung hình video liên tiếp (video-level)"],"explain":"Semantic Segmentation phân loại từng điểm ảnh thuộc về lớp đối tượng nào (ví dụ: người, đường sá, bầu trời).","tip":"Semantic Segmentation = phân loại gán nhãn từng pixel."},{"id":"r-m4-005","module":"m4","ref":"4.3","type":"recall","kind":"manual","q":"Trong mô hình đường viền chủ động (Active Contours / Snakes), hai loại lực tác động chính lên đường cong biến dạng là gì?","correct":"Lực nội tại (internal forces) giữ mượt mà và lực ngoại tại (external forces) kéo về phía biên đối tượng","wrong":["Lực ly tâm của điểm ảnh và lực hấp dẫn của nguồn sáng môi trường","Lực ma sát bề mặt cảm biến và lực cản của hàm phân phối tích lũy CDF","Lực phân ngưỡng nhị phân và lực xoay theo góc pháp tuyến của biến đổi Hough"],"explain":"Mô hình Snakes chuyển động dưới tác động của lực nội tại (internal forces - giữ cho đường cong mượt mà) và lực ngoại tại (external forces - kéo đường cong về phía biên cạnh đối tượng).","tip":"Snakes: Lực nội tại (internal) giữ mượt + Lực ngoại tại (external) kéo về biên."},{"id":"r-m4-006","module":"m4","ref":"4.3","type":"recall","kind":"manual","q":"Yếu tố nào sau đây có ảnh hưởng mang tính quyết định nhất đến độ chính xác của mô hình Snakes truyền thống?","correct":"Số lượng và vị trí của các điểm khởi tạo ban đầu tạo thành vòng khép kín quanh đối tượng","wrong":["Tỷ số tín hiệu cực đại trên nhiễu PSNR của thuật toán nén ảnh JPEG","Bậc tự do của ma trận biến đổi phối cảnh Projective 3x3","Tần số quét của cảm biến quang học kỹ thuật số CMOS"],"explain":"Người dùng thiết lập các điểm ban đầu để tạo thành vòng khép kín quanh đối tượng; số lượng và vị trí điểm khởi tạo quyết định lớn đến độ chính xác của thuật toán.","tip":"Độ chính xác của Snakes phụ thuộc lớn vào việc khởi tạo điểm ban đầu."},{"id":"r-m4-007","module":"m4","ref":"4.3","type":"recall","kind":"manual","q":"Kỹ thuật Kéo thông minh (Intelligent Scissors) hoạt động dựa trên cơ chế tương tác nào giữa người dùng và thuật toán?","correct":"Khi người dùng kéo đường vẽ thô, thuật toán tự động bám chặt và uốn lượn theo đường biên có độ tương phản cao","wrong":["Người dùng chỉ định trước K tâm cụm và thuật toán tự động chia ảnh thành 4 vùng con theo Quadtree","Thuật toán tự động tìm kiếm các điểm cực đại trong không gian tham số Hough mà không cần người dùng thao tác","Người dùng xoay ma trận ảnh một góc 45 độ để thuật toán tìm đường biên mỏng bằng bộ lọc Canny"],"explain":"Khi người dùng kéo một đường thô (màu trắng), thuật toán Intelligent Scissors tự động bám chặt và uốn lượn theo biên có độ tương phản cao trong thời gian thực.","tip":"Intelligent Scissors: người dùng vẽ thô, thuật toán tự bám biên tương phản cao."},{"id":"r-m4-008","module":"m4","ref":"4.3","type":"recall","kind":"manual","q":"Thuật toán Dynamic Snakes sử dụng công cụ nào để theo dõi (track) đường viền đối tượng chuyển động qua các khung hình liên tiếp?","correct":"Bộ lọc Kalman hoặc thuật toán Condensation dựa trên kỹ thuật lấy mẫu theo hệ số (factored sampling)","wrong":["Biến đổi Cosine rời rạc DCT kết hợp với bộ lọc trung vị cửa sổ 5x5","Phân tích suy biến ma trận SVD kết hợp với toán tử tích chập Sobel","Bảng băm đa chiều và cấu trúc cây k-d trees phân nhánh nhị phân"],"explain":"Dynamic Snakes & CONDENSATION sử dụng bộ lọc Kalman hoặc thuật toán Condensation (dựa trên factored sampling) để theo dõi đường viền chuyển động qua các chuỗi khung hình.","tip":"Dynamic Snakes: dùng Kalman filter hoặc CONDENSATION để tracking."},{"id":"r-m4-009","module":"m4","ref":"4.3","type":"recall","kind":"manual","q":"Ưu điểm vượt trội của phương pháp Tập mức (Level Sets) so với mô hình Snakes thông thường là gì?","correct":"Xử lý cực tốt các thay đổi cấu trúc hình học phức tạp như chia tách hoặc hợp nhất vùng","wrong":["Hoàn toàn không cần sử dụng hàm toán học bậc cao để biểu diễn đường cong","Luôn đảm bảo tốc độ tính toán nhanh hơn gấp mười lần so với phân ngưỡng nhị phân","Không phụ thuộc vào bất kỳ hàm chi phí năng lượng nào khi tối ưu hóa"],"explain":"Level Sets biểu diễn đường cong 2D dưới dạng zero level set của một hàm mặt phẳng bậc cao hơn, xử lý cực tốt các thay đổi cấu trúc hình học phức tạp (chia tách hoặc hợp nhất vùng).","tip":"Level Sets: xử lý tốt chia tách và hợp nhất vùng (topology changes)."},{"id":"r-m4-010","module":"m4","ref":"4.4","type":"recall","kind":"manual","q":"Thuật toán phân đoạn Chia và Trộn (Split and Merge) dựa trên cấu trúc dữ liệu phân cấp nào?","correct":"Cây tứ phân (Quadtree)","wrong":["Cây nhị phân k-d (k-d Tree)","Danh sách liên kết đơn","Đồ thị phẳng hai phía (Bipartite Graph)"],"explain":"Thuật toán Split and Merge dựa trên cấu trúc phân cấp cây tứ phân (Quadtree) để chia và trộn các vùng ảnh.","tip":"Split and Merge gắn liền với cấu trúc Quadtree (cây tứ phân)."},{"id":"r-m4-011","module":"m4","ref":"4.4","type":"recall","kind":"manual","q":"Trong bước Chia (Split) của thuật toán Split and Merge, điều kiện nào kích hoạt việc chia một vùng ảnh thành 4 vùng con bằng nhau?","correct":"Khi vùng ảnh đó không thỏa mãn tiêu chí đồng nhất (ví dụ phương sai cường độ sáng lớn hơn ngưỡng)","wrong":["Khi diện tích của vùng ảnh vượt quá một nửa kích thước toàn bộ ma trận ảnh ban đầu","Khi tất cả các pixel trong vùng đều có cùng một giá trị mức xám duy nhất","Khi vùng ảnh chứa ít nhất một điểm góc được phát hiện bởi thuật toán Harris"],"explain":"Nếu một vùng không thỏa mãn tiêu chí kiểm tra tính đồng nhất (homogeneity criterion, ví dụ phương sai lớn hơn ngưỡng), nó sẽ bị chia thành 4 vùng con bằng nhau.","tip":"Split: không đồng nhất (homogeneity) -> chia thành 4 vùng con."},{"id":"r-m4-012","module":"m4","ref":"4.4","type":"recall","kind":"manual","q":"Mục đích chính của bước Trộn (Merge) trong thuật toán Split and Merge là gì?","correct":"Kết hợp các vùng lân cận có thuộc tính tương đồng để tránh việc ảnh bị phân rã thành quá nhiều mảnh nhỏ","wrong":["Tự động lật ngược mặt nạ lọc để thực hiện phép tích chập không gian","Gán lại nhãn của tất cả các pixel về hai giá trị nhị phân duy nhất 0 và 255","Tính toán ma trận biến đổi phối cảnh giữa các vùng ảnh độc lập"],"explain":"Sau khi chia, các vùng lân cận có thuộc tính tương đồng hoặc thỏa mãn tiêu chí đồng nhất khi kết hợp lại sẽ được trộn vào nhau để tránh ảnh bị phân rã thành quá nhiều mảnh nhỏ.","tip":"Merge: gộp các vùng lân cận tương đồng để ảnh không bị vụn vặt."},{"id":"r-m4-013","module":"m4","ref":"4.4","type":"recall","kind":"manual","q":"Trong thuật toán Watershed (Phân đoạn lưu vực), cường độ sáng của các pixel được mô phỏng tương đương với khái niệm địa hình nào?","correct":"Độ cao địa hình, trong đó pixel sáng là đỉnh núi và pixel tối là thung lũng","wrong":["Hướng gió thổi, trong đó pixel sáng là hướng gió thuận và pixel tối là hướng gió nghịch","Độ sâu của dòng chảy ngầm, trong đó pixel sáng là đáy sông và pixel tối là mặt nước","Khoảng cách Euclid từ tâm bức ảnh đến các biên giới hạn địa hình"],"explain":"Watershed xem cường độ sáng như độ cao địa hình: pixel sáng là đỉnh núi/đường phân thủy (ridges), pixel tối là thung lũng/lưu vực thoát nước (drainage basins).","tip":"Watershed: cường độ sáng = độ cao; sáng = đỉnh núi, tối = thung lũng."},{"id":"r-m4-014","module":"m4","ref":"4.4","type":"recall","kind":"manual","q":"Trong cơ chế hoạt động của thuật toán Watershed, đường đập (watershed line) phân chia ranh giới đối tượng được dựng lên tại thời điểm nào?","correct":"Khi dòng nước ngập dâng lên từ các lưu vực khác nhau chuẩn bị tràn vào nhau","wrong":["Khi toàn bộ các pixel trong ảnh đều đạt giá trị cường độ sáng tối đa 255","Khi hàm phân phối tích lũy CDF của vùng lân cận đạt giá trị trung vị bằng 0","Khi gradient của ảnh giảm xuống bằng 0 tại tất cả các điểm yên ngựa"],"explain":"Thuật toán thực hiện 'ngập nước' từ các thung lũng, khi nước từ các lưu vực khác nhau chuẩn bị tràn vào nhau, một đường đập (watershed line) sẽ được dựng lên để phân đoạn ranh giới.","tip":"Watershed line được dựng khi nước từ 2 lưu vực chuẩn bị tràn vào nhau."},{"id":"r-m4-015","module":"m4","ref":"4.5","type":"recall","kind":"manual","q":"Thuật toán gom cụm K-Means phân đoạn ảnh dựa trên tiêu chí đo lường nào giữa các điểm ảnh?","correct":"Khoảng cách trong không gian màu giữa vector màu của điểm ảnh và các tâm cụm (centroids)","wrong":["Khoảng cách địa lý thực tế giữa hai máy ảnh chụp tại các góc nhìn khác nhau","Độ lệch góc quay trong ma trận biến đổi tọa độ đồng nhất 3 chiều","Tần số rung động của màn trập máy ảnh khi ghi nhận dữ liệu"],"explain":"K-Means gom cụm dữ liệu điểm ảnh dựa trên khoảng cách không gian màu (ví dụ vector 3D gồm R, G, B) tới K tâm cụm chỉ định trước.","tip":"K-Means phân đoạn màu: đo khoảng cách vector RGB tới centroid gần nhất."},{"id":"r-m4-016","module":"m4","ref":"4.5","type":"recall","kind":"manual","q":"Thứ tự các bước chuẩn trong một chu trình lặp của thuật toán K-Means là gì?","correct":"Gán mỗi điểm ảnh vào tâm cụm gần nhất → Cập nhật vị trí tâm cụm bằng trung bình cộng các điểm trong cụm","wrong":["Cập nhật vị trí tâm cụm bằng trung vị → Chia cụm thành 4 vùng con theo cấu trúc Quadtree","Gán điểm ảnh vào cụm ngẫu nhiên → Tính toán ma trận biến đổi Affine giữa các tâm cụm","Tìm đỉnh mật độ xác suất cực đại → Dịch chuyển cửa sổ tìm kiếm theo băng thông"],"explain":"Chu trình lặp của K-Means gồm: Bước Gán (Assign - gán pixel vào tâm cụm gần nhất) và Bước Cập nhật (Update - tính lại tâm cụm bằng trung bình cộng tọa độ các điểm trong cụm).","tip":"K-Means lặp 2 bước: Assign (gán cụm) -> Update (tính lại mean)."},{"id":"r-m4-017","module":"m4","ref":"4.5","type":"recall","kind":"manual","q":"Mô hình hỗn hợp Gaussian (Gaussian Mixture Model - GMM) mở rộng thuật toán K-Means dựa trên giả định toán học nào?","correct":"Dữ liệu không gian màu được tạo ra từ một tập hợp các phân phối chuẩn Gaussian khác nhau","wrong":["Dữ liệu điểm ảnh luôn tuân theo phân phối đều trên dải tần số từ 0 đến 255","Mọi cụm dữ liệu bắt buộc phải có cùng một phương sai và kích thước đối xứng","Toàn bộ ảnh có thể phân tách thành chuỗi các hàm tuần hoàn sin và cosin độc lập"],"explain":"GMM là mô hình mở rộng mang tính xác suất của K-Means, giả định dữ liệu không gian màu được tạo ra từ một tập hợp các phân phối chuẩn Gaussian khác nhau.","tip":"GMM: mô hình xác suất giả định dữ liệu sinh từ tổ hợp các Gaussian."},{"id":"r-m4-018","module":"m4","ref":"4.5","type":"recall","kind":"manual","q":"Điểm khác biệt căn bản nhất về số lượng cụm K giữa thuật toán K-Means và thuật toán Mean Shift là gì?","correct":"K-Means bắt buộc phải chỉ định trước số cụm K, trong khi Mean Shift tự động xác định số cụm dựa trên mật độ dữ liệu","wrong":["K-Means tự động dò tìm số cụm K, trong khi Mean Shift chỉ hoạt động khi số cụm K bằng 2","K-Means yêu cầu số cụm K phải là lũy thừa của 4, trong khi Mean Shift yêu cầu K là số nguyên tố","Cả hai thuật toán đều không thể kiểm soát được số lượng cụm sinh ra sau phân đoạn"],"explain":"K-Means bắt buộc phải khai báo trước số lượng cụm K, trong khi Mean Shift là thuật toán phi tham số tự động tìm kiếm các mốt/đỉnh mật độ dữ liệu thực tế.","tip":"K-Means: cần khai báo trước K; Mean Shift: tự động tìm số cụm."},{"id":"r-m4-019","module":"m4","ref":"4.5","type":"recall","kind":"manual","q":"Trong thuật toán Mean Shift, tham số quan trọng nhất mà người dùng cần thiết lập là gì?","correct":"Băng thông hạt nhân hay kích thước cửa sổ tìm kiếm (Bandwidth)","wrong":["Số lượng cụm K cố định ban đầu","Tỷ số nén ảnh cực đại PSNR","Ngưỡng phân tách nhị phân T của thuật toán Otsu"],"explain":"Tham số chính cần chọn trong thuật toán Mean Shift là kích thước cửa sổ tìm kiếm hay băng thông hạt nhân (Bandwidth).","tip":"Mean Shift: tham số mấu chốt là Bandwidth (băng thông cửa sổ)."},{"id":"r-m4-020","module":"m4","ref":"4.5","type":"recall","kind":"manual","q":"So với K-Means, hình dáng của các vùng phân đoạn được tạo ra bởi thuật toán Mean Shift có đặc điểm gì?","correct":"Cực kỳ linh hoạt, có thể bám theo bất kỳ hình dạng vùng phức tạp bất kỳ nào","wrong":["Bắt buộc luôn có dạng hình cầu lồi đối xứng xung quanh tâm cụm","Luôn có dạng hình chữ nhật song song với các trục tọa độ ảnh","Chỉ tạo ra các đường thẳng phân tách mỏng có độ dày đúng một pixel"],"explain":"K-Means có xu hướng tạo ra các vùng cụm hình cầu lồi, trong khi Mean Shift cực kỳ linh hoạt và có thể bám theo bất kỳ hình dạng vùng phức tạp nào.","tip":"K-Means: hình cầu lồi; Mean Shift: hình dạng tùy ý linh hoạt."},{"id":"r-m4-021","module":"m4","ref":"4.5","type":"recall","kind":"manual","q":"Khả năng chống chịu đối với các điểm nhiễu ngoại lai (outliers) của K-Means và Mean Shift khác nhau như thế nào?","correct":"K-Means dễ bị ảnh hưởng bởi outliers, trong khi Mean Shift rất bền vững (robust) trước các điểm ngoại lai","wrong":["K-Means hoàn toàn miễn nhiễm với outliers, trong khi Mean Shift bị sai lệch nặng nề","Cả hai thuật toán đều nhạy cảm như nhau đối với các điểm dữ liệu nằm xa tâm cụm","Outliers bị triệt tiêu hoàn toàn bởi bộ lọc Gaussian tích hợp sẵn trong cả hai thuật toán"],"explain":"K-Means dễ bị ảnh hưởng nhiễu bởi các điểm ngoại lai (outliers), trong khi Mean Shift rất bền vững (robust) trước các điểm nhiễu ngoại lai.","tip":"Mean Shift bền vững (robust) với outliers hơn K-Means."},{"id":"r-m5-001","module":"m5","ref":"5.2","type":"recall","kind":"manual","q":"Bản chất của bài toán Căn chỉnh dựa trên đặc trưng (Feature-Based Alignment) trong thị giác máy tính là gì?","correct":"Ước lượng chuyển động (motion estimation) giữa các tập hợp điểm 2D hoặc 3D đã được so khớp","wrong":["Phân đoạn ngữ nghĩa gán nhãn cho từng điểm ảnh dựa trên lược đồ màu","Khử nhiễu muối tiêu bằng cách thay thế pixel bằng giá trị trung vị","Nén dung lượng bức ảnh thông qua biến đổi Cosine rời rạc DCT"],"explain":"Căn chỉnh dựa trên đặc trưng là bài toán ước lượng chuyển động (motion estimation) giữa hai hoặc nhiều tập hợp các điểm 2D hoặc 3D đã được so khớp để đảm bảo chúng nhất quán về mặt hình học.","tip":"Feature-Based Alignment bản chất là bài toán motion estimation giữa các tập điểm."},{"id":"r-m5-002","module":"m5","ref":"5.2","type":"recall","kind":"manual","q":"Kỹ thuật Căn chỉnh dựa trên đặc trưng (Feature-Based Alignment) sử dụng loại đặc trưng nào làm đầu vào chính?","correct":"Tập hợp các đặc trưng thưa (sparse set of features) được trích xuất từ ảnh","wrong":["Toàn bộ ma trận điểm ảnh dày đặc (dense pixel matrix) của cả bức ảnh","Lược đồ phân phối tích lũy CDF của các kênh màu RGB","Các đường bao liên tục thu được từ thuật toán phân đoạn Watershed"],"explain":"Thuật toán phát hiện một tập hợp đặc trưng thưa (sparse set of features) trong ảnh thứ nhất và tìm các điểm tương ứng trong ảnh thứ hai để căn chỉnh.","tip":"Feature-based alignment sử dụng sparse set of features (tập đặc trưng thưa)."},{"id":"r-m5-003","module":"m5","ref":"5.2","type":"recall","kind":"manual","q":"Mục đích cuối cùng của việc tính toán ma trận biến đổi hình học trong Feature-Based Alignment là gì?","correct":"Biến đổi hình ảnh nguồn để khớp chồng khít nhất quán về mặt hình học lên ảnh đích","wrong":["Thay đổi dải màu của ảnh nguồn để đồng bộ với dải phổ màu của ảnh đích","Tăng cường độ tương phản toàn cục của ảnh đích lên mức tối đa 255","Tạo ra một mô hình phân loại nhị phân để nhận diện khuôn mặt"],"explain":"Sau khi tìm điểm tương ứng, thuật toán tính toán một ma trận biến đổi hình học (transformation matrix) để làm mượt hoặc biến đổi ảnh này khớp chồng khít lên ảnh kia.","tip":"Mục đích căn chỉnh là làm cho các ảnh khớp chồng khít lên nhau."},{"id":"r-m5-004","module":"m5","ref":"5.3","type":"recall","kind":"manual","q":"Trong bài toán căn chỉnh 2D bằng phương pháp bình phương tối thiểu, hàm mục tiêu cần tối ưu hóa là gì?","correct":"Tối thiểu hóa tổng bình phương sai số khoảng cách giữa các cặp điểm đặc trưng","wrong":["Tối đa hóa khoảng cách Euclid giữa các điểm đặc trưng trên hai ảnh","Tối thiểu hóa số lượng tham số chuyển động p trong ma trận biến đổi","Tối đa hóa giá trị định thức của ma trận tọa độ đồng nhất"],"explain":"Để tìm ước lượng tối ưu cho vector tham số p, mục tiêu là tối thiểu hóa tổng bình phương sai số khoảng cách (Least Squares Error).","tip":"Least Squares = tối thiểu hóa tổng bình phương sai số khoảng cách."},{"id":"r-m5-005","module":"m5","ref":"5.3","type":"recall","kind":"manual","q":"Kỹ thuật Trọng số bất định (Uncertainty Weighting) cải tiến phương pháp bình phương tối thiểu bằng cách nào?","correct":"Gán trọng số bằng nghịch đảo của phương sai để giảm thiểu ảnh hưởng của các điểm có độ bất định cao","wrong":["Nhân gấp đôi trọng số của tất cả các điểm nằm ở góc ngoài cùng của bức ảnh","Loại bỏ ngẫu nhiên 50% số điểm đặc trưng trước khi thực hiện tối ưu hóa","Thay thế toàn bộ sai số Euclid bằng hàm khoảng cách Manhattan"],"explain":"Thuật toán tối ưu bằng cách thêm trọng số nghịch đảo phương sai để giảm ảnh hưởng của các điểm có độ bất định cao: Σ σ_i⁻² || x'_i - f(x_i; p) ||².","tip":"Uncertainty Weighting: gán trọng số nghịch đảo phương sai σ⁻² để giảm ảnh hưởng của điểm bất định cao."},{"id":"r-m5-006","module":"m5","ref":"5.3","type":"recall","kind":"manual","q":"Khi mối quan hệ giữa dữ liệu đo đạc và các biến số cần tìm không mang tính chất tuyến tính đơn giản, phương pháp nào thường được áp dụng?","correct":"Phương pháp bình phương tối thiểu phi tuyến tính hoặc kỹ thuật ước lượng bền vững (M-estimation) để giải lặp","wrong":["Phân tích suy biến ma trận SVD một bước không cần lặp","Thuật toán phân ngưỡng nhị phân Otsu toàn cục","Phép nhân ma trận trực tiếp với bộ lọc Gaussian một chiều"],"explain":"Khi không có mối quan hệ tuyến tính đơn giản, các phương pháp bình phương tối thiểu phi tuyến tính hoặc kỹ thuật ước lượng bền vững (M-estimation) sẽ được áp dụng để giải lặp.","tip":"Phi tuyến tính -> dùng non-linear least squares hoặc M-estimation giải lặp."},{"id":"r-m5-007","module":"m5","ref":"5.3","type":"recall","kind":"manual","q":"Trong công thức x'_i = f(x_i; p) của bài toán căn chỉnh 2D, ký hiệu p đại diện cho yếu tố nào?","correct":"Vector chứa các tham số chuyển động cần ước lượng","wrong":["Tọa độ không gian 3 chiều của nguồn sáng điểm","Bậc tự do của cảm biến camera kỹ thuật số","Giá trị mức xám trung bình của vùng lân cận"],"explain":"Trong mô hình x'_i = f(x_i; p), p là vector chứa các tham số chuyển động cần tìm.","tip":"p là vector motion parameters (tham số chuyển động)."},{"id":"r-m5-008","module":"m5","ref":"5.4","type":"recall","kind":"manual","q":"Lý do chính khiến phương pháp Bình phương tối thiểu thông thường (Least Squares) thất bại khi áp dụng trên dữ liệu so khớp đặc trưng thực tế là gì?","correct":"Cực kỳ nhạy cảm với các điểm ngoại lai (outliers), chỉ một vài cặp điểm khớp sai có thể làm lệch hoàn toàn mô hình","wrong":["Không có khả năng giải quyết các bài toán có số lượng điểm dữ liệu vượt quá 100 điểm","Đòi hỏi thời gian tính toán gấp nhiều lần so với các thuật toán lấy mẫu ngẫu nhiên","Chỉ hoạt động được trên dữ liệu không gian 1 chiều chứ không mở rộng được sang 2D"],"explain":"Least Squares rất nhạy cảm với outliers — chỉ cần một vài cặp điểm khớp sai nghiêm trọng có thể làm lệch hoàn toàn ma trận biến đổi.","tip":"Least Squares thất bại khi có outliers; RANSAC ra đời để giải quyết bài toán này."},{"id":"r-m5-009","module":"m5","ref":"5.4","type":"recall","kind":"manual","q":"Để ước lượng ma trận biến đổi đồng hình (Homography) 2D trong thuật toán RANSAC, số lượng điểm dữ liệu tối thiểu N cần lấy mẫu ngẫu nhiên ở mỗi vòng lặp là bao nhiêu?","correct":"N = 4 điểm","wrong":["N = 2 điểm","N = 3 điểm","N = 8 điểm"],"explain":"Thuật toán chọn ngẫu nhiên N điểm dữ liệu tối thiểu cần thiết để xác định mô hình, đối với phép Homography thì N = 4.","tip":"Homography cần tối thiểu N = 4 cặp điểm."},{"id":"r-m5-010","module":"m5","ref":"5.4","type":"recall","kind":"manual","q":"Trong thuật toán RANSAC, khái niệm điểm nội tại (inliers) được định nghĩa như thế nào?","correct":"Các điểm dữ liệu khớp với mô hình ước lượng ứng viên trong phạm vi sai số cho phép","wrong":["Các điểm dữ liệu nằm ngoài rìa biên của bức ảnh có cường độ sáng bằng 0","Các điểm đặc trưng bị gán nhãn sai do hiện tượng rung lắc của cảm biến","Các điểm có khoảng cách lớn nhất tới tâm cụm của thuật toán K-Means"],"explain":"Inliers là tập hợp các điểm dữ liệu khớp với mô hình vừa tính trong phạm vi sai số cho phép (tolerance).","tip":"Inliers = điểm dữ liệu phù hợp với mô hình trong ngưỡng sai số."},{"id":"r-m5-011","module":"m5","ref":"5.4","type":"recall","kind":"manual","q":"Thuật toán RANSAC sẽ đưa ra kết luận thất bại trong trường hợp nào sau đây?","correct":"Sau tổng số L lần lặp vẫn không tìm thấy mô hình có số lượng inliers thỏa mãn yêu cầu","wrong":["Khi số lượng inliers vượt quá 80% tổng số điểm dữ liệu đầu vào","Khi thời gian xử lý của một vòng lặp vượt quá chu kỳ của màn trập máy ảnh","Khi ma trận hiệp phương sai của các điểm đặc trưng có định thức bằng 1"],"explain":"Nếu sau L lần lặp vẫn không tìm thấy mô hình thỏa mãn (số lượng inliers không đủ lớn), thuật toán sẽ báo lỗi thất bại.","tip":"RANSAC thất bại khi hết L lần lặp mà không đủ số lượng inliers."},{"id":"r-m5-012","module":"m5","ref":"5.4","type":"recall","kind":"manual","q":"Bản chất cơ chế hoạt động của thuật toán RANSAC thuộc nhóm kỹ thuật tính toán nào?","correct":"Kỹ thuật tái lấy mẫu ngẫu nhiên (resampling)","wrong":["Kỹ thuật quy hoạch động chia để trị (Dynamic Programming)","Kỹ thuật phân rã ma trận suy biến trực giao (SVD)","Kỹ thuật xấp xỉ đạo hàm bậc hai qua phép tích chập"],"explain":"RANSAC là một kỹ thuật tái lấy mẫu (resampling) tạo ra các giải pháp ứng viên bằng cách chỉ sử dụng số lượng điểm dữ liệu tối thiểu cần thiết.","tip":"RANSAC: Random Sample Consensus = kỹ thuật resampling (tái lấy mẫu)."},{"id":"r-m5-013","module":"m5","ref":"5.5","type":"recall","kind":"manual","q":"Trong bài toán căn chỉnh chuyển động vật thể cứng 3D (Rigid / Euclidean Motion), thuật toán Orthogonal Procrustes sử dụng công cụ toán học nào để tìm ma trận quay tối ưu?","correct":"Phân tích suy biến ma trận (Singular Value Decomposition - SVD)","wrong":["Biến đổi Fourier nhanh 2 chiều (FFT)","Thuật toán phân cụm xác suất GMM","Phép biến đổi Cosine rời rạc DCT"],"explain":"Thuật toán Orthogonal Procrustes sử dụng phân tích suy biến ma trận (SVD) để tìm ma trận quay tối ưu giữa hai tập hợp điểm 3D.","tip":"Orthogonal Procrustes dùng SVD để tìm ma trận quay."},{"id":"r-m5-014","module":"m5","ref":"5.5","type":"recall","kind":"manual","q":"Hai thuật toán kinh điển thường được sử dụng thay thế cho nhau để căn chỉnh đặc trưng 3D của chuyển động vật thể cứng là gì?","correct":"Orthogonal Procrustes và Định hướng Tuyệt đối (Absolute Orientation)","wrong":["Harris Corner và Scale-Invariant Feature Transform (SIFT)","Mean Shift và K-Means Clustering","Viola-Jones và Single Shot MultiBox Detector (SSD)"],"explain":"Đối với chuyển động vật thể cứng (Rigid Motion) gồm quay và tịnh tiến không gian, hai thuật toán kinh điển là Orthogonal Procrustes và Absolute Orientation.","tip":"Căn chỉnh 3D vật thể cứng: Orthogonal Procrustes và Absolute Orientation."},{"id":"r-m5-015","module":"m5","ref":"5.5","type":"recall","kind":"manual","q":"Sai số về độ chính xác giữa thuật toán Orthogonal Procrustes và thuật toán Định hướng Tuyệt đối trong thực tế có đặc điểm gì?","correct":"Sai số giữa hai phương pháp hoàn toàn không đáng kể nên thường được dùng thay cho nhau","wrong":["Orthogonal Procrustes luôn có sai số gấp đôi phương pháp Định hướng Tuyệt đối","Phương pháp Định hướng Tuyệt đối chỉ chính xác khi số điểm dữ liệu lớn hơn 10.000 điểm","Orthogonal Procrustes chỉ áp dụng được khi có sự biến dạng co giãn phi tuyến"],"explain":"Sai số về độ chính xác giữa Orthogonal Procrustes và Absolute Orientation trong các ứng dụng thực tế là hoàn toàn không đáng kể nên hay được dùng thay cho nhau.","tip":"Sai số giữa Procrustes và Absolute Orientation không đáng kể trong thực tế."},{"id":"r-m5-016","module":"m5","ref":"5.6","type":"recall","kind":"manual","q":"Trong thực tế, kỹ thuật căn chỉnh ảnh dựa trên đặc trưng được ứng dụng cho mục đích y tế nào?","correct":"Căn chỉnh chồng khít các ảnh chụp quét mô tại các thời điểm khác nhau để theo dõi sự phát triển của bệnh lý","wrong":["Nén các tệp dữ liệu hồ sơ bệnh án thành định dạng nhị phân để tiết kiệm bộ nhớ","Tự động phóng to độ phân giải của hình ảnh siêu âm mà không cần tái lấy mẫu","Tách các tế bào máu bằng thuật toán biến đổi Hough tìm đường tròn"],"explain":"Trong y tế, căn chỉnh đặc trưng giúp chồng khít các ảnh quét mô (scans) được chụp tại các thời điểm khác nhau để so sánh, theo dõi sự phát triển của bệnh lý.","tip":"Ứng dụng y tế của alignment: chồng khít ảnh quét mô qua các thời điểm."},{"id":"r-m5-017","module":"m5","ref":"5.6","type":"recall","kind":"manual","q":"Trong mã nguồn OpenCV để căn chỉnh ảnh 2D, hàm nào được sử dụng để ước lượng ma trận Homography kết hợp loại bỏ điểm ngoại lai bằng RANSAC?","correct":"cv2.findHomography(src_pts, dst_pts, cv2.RANSAC, ...)","wrong":["cv2.getRotationMatrix2D()","cv2.warpAffine()","cv2.drawKeypoints()"],"explain":"`cv2.findHomography(src_pts, dst_pts, cv2.RANSAC, 5.0)` dùng RANSAC để tính ma trận Homography và loại bỏ các điểm outliers.","tip":"findHomography kết hợp cờ cv2.RANSAC để lọc outlier."},{"id":"r-m5-018","module":"m5","ref":"5.6","type":"recall","kind":"manual","q":"Sau khi tính toán được ma trận biến đổi phối cảnh (Homography) M, hàm nào trong OpenCV được dùng để bẻ cong (warp) bức ảnh nguồn về khung nhìn của ảnh đích?","correct":"cv2.warpPerspective()","wrong":["cv2.convertScaleAbs()","cv2.filter2D()","cv2.equalizeHist()"],"explain":"`cv2.warpPerspective(img1, M, (w, h))` được dùng để warp ảnh theo ma trận cấu trúc góc nhìn Homography.","tip":"Homography là phép chiếu phối cảnh nên dùng cv2.warpPerspective."},{"id":"r-m5-019","module":"m5","ref":"5.6","type":"recall","kind":"manual","q":"Ứng dụng nào sau đây KHÔNG phải là ứng dụng tiêu biểu của kỹ thuật Căn chỉnh dựa trên đặc trưng (Feature-Based Alignment) được nêu trong tài liệu?","correct":"Đổi không gian màu từ BGR sang YCrCb để phân tích phổ màu","wrong":["Căn chỉnh hình ảnh tài liệu chụp nghiêng từ điện thoại về đúng khung mẫu tiêu chuẩn","Chồng khít các ảnh quét mô y tế chụp tại các mốc thời gian khác nhau","Ghép nối nhiều bức ảnh có trường nhìn chồng lấn để tạo ảnh Panorama"],"explain":"Tài liệu nêu 3 ứng dụng cốt lõi: xử lý tài liệu văn bản, ứng dụng y tế, và tạo ảnh toàn cảnh (Panorama). Đổi không gian màu là xử lý điểm ảnh cơ bản.","tip":"3 ứng dụng căn chỉnh đặc trưng: tài liệu văn bản, y tế, ảnh toàn cảnh Panorama."},{"id":"r-m6-001","module":"m6","ref":"6.2","type":"recall","kind":"manual","q":"Trong bài toán ước lượng chuyển động và luồng quang học (Optical Flow), giả định cốt lõi của Ràng buộc hằng số độ sáng (Brightness Constancy Constraint) là gì?","correct":"Độ sáng của một điểm ảnh không thay đổi khi nó di chuyển từ khung hình này sang khung hình khác","wrong":["Cường độ sáng của toàn bộ bức ảnh luôn bằng giá trị trung bình 128 qua mọi thời điểm","Nguồn sáng môi trường bắt buộc phải là nguồn sáng điểm đặt tại vô cực","Mọi điểm ảnh trên cùng một hàng đều có cùng một vector vận tốc chuyển động"],"explain":"Ràng buộc hằng số độ sáng (Brightness Constancy Constraint) giả định rằng độ sáng của một điểm ảnh không thay đổi khi nó di chuyển từ khung hình này sang khung hình tiếp theo.","tip":"Brightness Constancy: độ sáng điểm ảnh không đổi khi dịch chuyển giữa các frame."},{"id":"r-m6-002","module":"m6","ref":"6.2","type":"recall","kind":"manual","q":"Khi đưa các bức ảnh về Hệ tọa độ Trụ (Cylindrical Coordinates) để ghép toàn cảnh Panorama, mô hình chuyển động cần ước lượng được đơn giản hóa thành phép toán nào?","correct":"Phép tịnh tiến thuần túy (Pure Translation)","wrong":["Phép biến đổi Affine đầy đủ 6 bậc tự do","Phép biến đổi phối cảnh Projective với ma trận 3x3","Phép quay không gian quanh ba trục Euler"],"explain":"Khi warp ảnh vào một mặt trụ hoặc mặt cầu, ta chỉ cần sử dụng mô hình tịnh tiến thuần túy để căn chỉnh thay vì phải dùng ma trận Homography phức tạp.","tip":"Hệ tọa độ trụ (Cylindrical): chỉ cần ước lượng phép tịnh tiến thuần túy."},{"id":"r-m6-003","module":"m6","ref":"6.2","type":"recall","kind":"manual","q":"Phương pháp ghép toàn cảnh hình trụ (Cylindrical Panorama) chỉ phát huy hiệu quả cao trong điều kiện chụp ảnh nào của camera?","correct":"Camera được đặt ngang và chỉ thực hiện chuyển động xoay quanh trục dọc của nó","wrong":["Camera di chuyển tịnh tiến tự do theo cả ba trục không gian x, y, z","Camera liên tục thay đổi tiêu cự ống kính khi xoay tròn quanh vật thể","Camera chụp các vật thể chuyển động với tốc độ cao hơn chu kỳ màn trập"],"explain":"Cylindrical Panorama được sử dụng khi camera đặt ngang và chỉ có chuyển động xoay quanh trục dọc của nó.","tip":"Cylindrical Panorama: camera đặt ngang và chỉ xoay quanh trục dọc."},{"id":"r-m6-004","module":"m6","ref":"6.2","type":"recall","kind":"manual","q":"Trong nén và truyền tải video, mô hình chuyển động cho phép trích xuất thành phần nào để giảm thiểu tối đa dung lượng dữ liệu truyền qua mạng?","correct":"Ảnh phông nền duy nhất (Background Sprite) kết hợp tái tạo cho từng khung hình","wrong":["Toàn bộ ma trận đạo hàm bậc hai LoG của mọi khung hình","Lược đồ phân phối tần số DCT của tất cả các kênh màu","Tập hợp các điểm ảnh biên mỏng sau khi phân ngưỡng kép Canny"],"explain":"Mô hình chuyển động cho phép ghép các cảnh nền trong video thành một ảnh background sprite duy nhất, giúp nén video cực kỳ hiệu quả bằng cách chỉ truyền ảnh sprite này thay vì cả video.","tip":"Sprite background: truyền ảnh nền duy nhất để tái tạo các frame video."},{"id":"r-m6-005","module":"m6","ref":"6.2","type":"recall","kind":"manual","q":"Phương trình biểu diễn một điểm trên bề mặt hình trụ trong hệ tọa độ trụ có mối liên hệ tỷ lệ như thế nào với tọa độ ảnh (x, y) và tiêu cự f?","correct":"(sin θ, h, cos θ) ∝ (x, y, f)","wrong":["(cos θ, sin θ, 1) ∝ (x, y, f)","(θ, h, r) ∝ (x^2, y^2, f^2)","(tan θ, h, 0) ∝ (x, y, 1/f)"],"explain":"Phương trình tọa độ trụ biểu diễn điểm trên bề mặt trụ bằng góc θ và chiều cao h theo quan hệ tỷ lệ: (sin θ, h, cos θ) ∝ (x, y, f).","tip":"Tọa độ trụ: (sin θ, h, cos θ) tỷ lệ với (x, y, f)."},{"id":"r-m6-006","module":"m6","ref":"6.3","type":"recall","kind":"manual","q":"Hạn chế lớn nhất của việc ghép nối lần lượt từng bức ảnh một cách tuần tự vào ảnh toàn cảnh Panorama là gì?","correct":"Dễ gây ra hiện tượng tích lũy sai số (accumulated error) dẫn đến sai lệch lớn ở các khung hình sau","wrong":["Làm suy giảm độ sâu màu của ảnh từ 24-bit xuống chuẩn nhị phân 8-bit","Không thể áp dụng thuật toán SIFT để tìm kiếm các điểm đặc trưng","Gây tràn bộ nhớ đệm do các ma trận xoay 2D không có tính trực giao"],"explain":"Ghép từng ảnh một tuần tự vào panorama dễ gây tích lũy sai số (accumulated error), khiến các bức ảnh cuối cùng bị lệch khớp nghiêm trọng.","tip":"Ghép tuần tự dễ gây tích lũy sai số; cần dùng Bundle Adjustment để tối ưu đồng thời."},{"id":"r-m6-007","module":"m6","ref":"6.3","type":"recall","kind":"manual","q":"Kỹ thuật Điều chỉnh chùm tia (Bundle Adjustment) giải quyết vấn đề tích lũy sai số bằng cơ chế nào?","correct":"Tối ưu hóa đồng thời các tham số tư thế (pose parameters) của toàn bộ các bức ảnh chồng lấp","wrong":["Cắt bỏ tất cả các bức ảnh có tỷ lệ vùng chồng lấn thấp hơn 70%","Chỉ giữ lại bức ảnh trung tâm và bỏ qua tất cả các bức ảnh ngoại vi","Áp dụng bộ lọc trung vị để làm nhòe toàn bộ các điểm đặc trưng bị khớp sai"],"explain":"Bundle Adjustment là quá trình điều chỉnh đồng thời (simultaneously) các tham số tư thế (pose parameters) cho một bộ sưu tập lớn các bức ảnh chồng lấp lên nhau.","tip":"Bundle Adjustment tối ưu đồng thời (simultaneously) pose parameters của tất cả ảnh."},{"id":"r-m6-008","module":"m6","ref":"6.3","type":"recall","kind":"manual","q":"Trong bài toán nhận diện Panorama tự động, thách thức nào sau đây dễ dẫn đến các kết quả khớp sai (false matches) nhất?","correct":"Cảnh chụp có các cấu trúc lặp đi lặp lại như các ô cửa sổ giống hệt nhau trên tòa nhà","wrong":["Cảnh chụp có quá nhiều vùng bầu trời phẳng hoặc bề mặt tường trơn mịn","Camera sử dụng cảm biến CMOS thay vì cảm biến quang học CCD","Các bức ảnh được lưu dưới định dạng nén không tổn thất TIFF"],"explain":"Các cấu trúc lặp đi lặp lại trong cảnh (ví dụ các ô cửa sổ giống nhau trên tòa nhà) là thách thức lớn vì có thể dẫn đến việc khớp sai (false matches).","tip":"Cấu trúc lặp lại (repetitive structures) dễ gây false matches khi ghép panorama."},{"id":"r-m6-009","module":"m6","ref":"6.3","type":"recall","kind":"manual","q":"Để xác thực xem hai bức ảnh đã căn chỉnh có thực sự thuộc về cùng một cảnh hay không, phương pháp so sánh pixel trực tiếp sẽ gặp thất bại trong tình huống nào?","correct":"Khi trong cảnh chụp xuất hiện các vật thể chuyển động","wrong":["Khi camera được giữ hoàn toàn cố định trên chân máy","Khi các bức ảnh được chụp dưới cùng một nguồn sáng khuếch tán Lambertian","Khi số lượng điểm đặc trưng SIFT vượt quá 1.000 điểm"],"explain":"So sánh pixel trực tiếp (direct pixel-based comparison) sẽ thất bại nếu trong cảnh có vật thể chuyển động, khi đó cần ứng dụng Học máy (Machine Learning) để xác thực.","tip":"So sánh pixel trực tiếp thất bại khi có vật thể chuyển động (moving objects)."},{"id":"r-m6-010","module":"m6","ref":"6.3","type":"recall","kind":"manual","q":"Trong công thức ánh xạ x_ij ~ K_j * R_j * x_i của Bundle Adjustment, các ma trận R_j và K_j lần lượt đại diện cho thành phần nào?","correct":"R_j là ma trận quay tư thế camera, K_j là ma trận hiệu chuẩn camera","wrong":["R_j là ma trận phản xạ ánh sáng, K_j là ma trận độ tương phản toàn cục","R_j là ma trận lọc nhiễu Gaussian, K_j là ma trận tọa độ cực trong không gian Hough","R_j là hệ số co giãn đa bước, K_j là độ dài tiêu cự của thấu kính mỏng"],"explain":"Trong phương trình ánh xạ, R_j là ma trận quay (pose parameters), còn K_j là ma trận hiệu chuẩn camera (camera calibration matrix).","tip":"R_j = ma trận quay tư thế (pose), K_j = ma trận hiệu chuẩn camera (calibration)."},{"id":"r-m6-011","module":"m6","ref":"6.4","type":"recall","kind":"manual","q":"Trong lớp Stitcher tích hợp sẵn của OpenCV (cv2.Stitcher_create()), quy trình tự động đã bao gồm những bước kỹ thuật cốt lõi nào?","correct":"Trích xuất đặc trưng, ước lượng mô hình chuyển động và Điều chỉnh chùm tia (Bundle Adjustment)","wrong":["Phân đoạn tế bào ung thư, phân tích suy biến SVD và cân bằng lược đồ xám CDF","Biến đổi Fourier miền tần số, lọc bất đẳng hướng và nén tổn hao JPEG","Vẽ hộp bao Viola-Jones, theo dõi đối tượng CSRT và phân ngưỡng nhị phân Otsu"],"explain":"`cv2.Stitcher_create()` tích hợp sẵn: trích xuất đặc trưng (SIFT/ORB), ước lượng mô hình chuyển động và Bundle Adjustment (Căn chỉnh toàn cục).","tip":"OpenCV Stitcher bao gồm trích xuất đặc trưng, mô hình chuyển động và Bundle Adjustment."},{"id":"r-m6-012","module":"m6","ref":"6.4","type":"recall","kind":"manual","q":"Khi sử dụng công cụ ghép ảnh trong OpenCV, điều kiện tiên quyết về khung nhìn giữa hai bức ảnh kề nhau để ghép thành công là gì?","correct":"Bắt buộc phải có vùng trường nhìn chồng lấn (overlapping field of view) giữa các bức ảnh","wrong":["Hai bức ảnh phải được cắt đôi chính xác 50% bên trái và 50% bên phải không có phần chung","Hai bức ảnh phải có dải phổ tần số Fourier hoàn toàn trực giao với nhau","Hai bức ảnh bắt buộc phải chụp cùng một thời điểm với hai cảm biến CCD khác nhau"],"explain":"Các bức ảnh đầu vào cần có trường nhìn chồng lấp (overlapping fields of view), nếu không có vùng chồng lấn thì thuật toán không thể tìm được đặc trưng khớp để ghép ảnh.","tip":"Ghép ảnh bắt buộc phải có vùng trường nhìn chồng lấn (overlap)."},{"id":"r-m6-013","module":"m6","ref":"6.4","type":"recall","kind":"manual","q":"Khi hàm stitcher.stitch() trong OpenCV trả về mã lỗi thất bại, nguyên nhân phổ biến nhất trong thực tế là gì?","correct":"Không tìm đủ số lượng đặc trưng trùng khớp do diện tích vùng chồng lấn giữa các ảnh quá nhỏ","wrong":["Bức ảnh có kích thước tệp vượt quá giới hạn 8-bit của cảm biến CMOS","Hệ số tương quan Pearson giữa hai bức ảnh đạt giá trị tuyệt đối bằng 1.0","Ma trận xoay của camera không chứa thành phần tịnh tiến theo trục z"],"explain":"Lỗi ghép ảnh trong OpenCV thường xảy ra do không đủ đặc trưng khớp (không đủ vùng chồng lấp giữa các ảnh).","tip":"Lỗi ghép ảnh chủ yếu do thiếu đặc trưng khớp vì vùng chồng lấn không đủ."},{"id":"r-m7-001","module":"m7","ref":"7.2","type":"recall","kind":"manual","q":"Điểm khác biệt cơ bản giữa tác vụ Phát hiện đối tượng (Object Detection) và Phân loại ảnh (Image Classification) là gì?","correct":"Phát hiện đối tượng trả về vị trí chính xác của đối tượng thông qua hộp giới hạn (Bounding Box)","wrong":["Phân loại ảnh có khả năng xác định tọa độ pixel của từng cá thể đối tượng độc lập","Phát hiện đối tượng chỉ áp dụng được trên video mà không áp dụng được trên ảnh tĩnh","Phân loại ảnh bắt buộc phải sử dụng bộ mô tả biểu đồ dốc hướng HOG"],"explain":"Không giống như phân loại ảnh (chỉ cho biết trong ảnh có gì), phát hiện đối tượng trả về vị trí chính xác của đối tượng thông qua hộp giới hạn (Bounding Box).","tip":"Classification = có gì trong ảnh; Object Detection = có gì và ở đâu (Bounding Box)."},{"id":"r-m7-002","module":"m7","ref":"7.2","type":"recall","kind":"manual","q":"Thuật toán phát hiện khuôn mặt truyền thố
