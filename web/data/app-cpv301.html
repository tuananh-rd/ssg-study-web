 technique)","Kỹ thuật dựa trên tích chập (Convolution based technique)","Kỹ thuật phát hiện biên (Edge detection technique)"]},"b-24":{"q":"Nhận dạng đối tượng (Object recognition) bao gồm ______ các đối tượng trong một bức ảnh với một mức độ tin cậy nhất định. Chọn đáp án đúng nhất","options":["Phát hiện, nhận diện và định vị","Nhận diện và định vị","Phát hiện và định vị","Nhận biết, nhận diện và định vị"]},"b-25":{"q":"Dải động (dynamic range) của hệ thống tạo ảnh là một quan hệ định lượng mà giới hạn trên có thể được xác định bởi ____","options":["Độ bão hòa (Saturation)","Độ tương phản (Contrast)","Nhiễu (Noise)","Độ sáng (Brightness)"]},"b-26":{"q":"______ dựa trên nhận xét rằng ánh xạ affine x = Ax' xác định một hệ tọa độ hai chiều bị xiên (skewed) lân cận mỗi điểm ảnh nguồn x. Chọn đáp án đúng nhất","options":["Bộ lọc MIP Mapping","Bộ lọc Gaussian White","Bộ lọc trung bình có trọng số hình elip (Elliptical Weighted Average - EWA)","Bộ lọc nhiều lượt (Multi pass filter)"]},"b-27":{"q":"______ coi ảnh mà nó xử lý như một bản đồ địa hình, với độ sáng của mỗi điểm biểu diễn độ cao của điểm đó, và tìm các đường chạy dọc theo đỉnh các sườn núi. Chọn đáp án đúng nhất","options":["Biến đổi ảnh (Image transformation)","Biến đổi heuristic (Heuristic transformation)","Biến đổi lai (Hybrid transformation)","Biến đổi phân thủy (Watershed transformation)"]},"b-28":{"q":"______ là thước đo sự thay đổi của một hàm, và một ảnh có thể được xem là một mảng các mẫu của một hàm liên tục nào đó biểu diễn cường độ ảnh. Chọn đáp án đúng nhất","options":["Gradient","Biên (Edge)","Ảnh xám (Grayscale)","Đường viền (Contour)"]},"b-29":{"q":"Ý tưởng cơ bản của ______ là chia ảnh thành một tập các vùng rời nhau, trong đó mỗi vùng có tính đồng nhất nội tại. Chọn đáp án đúng nhất","options":["Kết hợp vùng (Region combination)","Kết hợp đối tượng (Object combination)","Tách vùng (Region splitting)","Tách đối tượng (Object splitting)"]},"b-30":{"q":"Giới hạn dưới của tỉ số dải động (dynamic range) có thể được xác định bởi ____","options":["Độ tương phản (Contrast)","Độ bão hòa (Saturation)","Nhiễu (Noise)","Độ sáng (Brightness)"]},"b-31":{"q":"Phát biểu nào sau đây là ĐÚNG?","options":["Thị giác máy tính (computer vision) tập trung vào các thao tác mức thấp như lọc và giảm nhiễu, trong khi xử lý ảnh (image processing) liên quan đến việc hiểu và ra quyết định mức cao từ dữ liệu thị giác.","Thị giác máy tính và xử lý ảnh là một và được dùng thay thế cho nhau trong bối cảnh phân tích dữ liệu thị giác.","Thị giác máy tính nhằm diễn giải và ra quyết định dựa trên dữ liệu thị giác, trong khi xử lý ảnh liên quan đến việc thao tác và biến đổi dữ liệu điểm ảnh trong ảnh.","Xử lý ảnh tập trung vào việc hiểu và diễn giải ảnh, trong khi thị giác máy tính liên quan đến các thao tác như giảm nhiễu và phát hiện biên."]},"b-32":{"q":"Điều nào sau đây KHÔNG phải là ứng dụng của căn chỉnh ảnh (image alignment)?","options":["Nhận dạng mẫu tài liệu","Tạo ảnh toàn cảnh (panorama)","So sánh nhiều lần quét mô được chụp ở các thời điểm khác nhau","Nâng cao chất lượng tài liệu được quét hoặc chụp ảnh"]},"b-33":{"q":"Điều nào KHÔNG liên quan đến thuật toán trung bình có trọng số hình elip (Elliptical Weighted Average - EWA)?","options":["Tính toán ánh xạ affine","Hệ tọa độ hai chiều bị xiên","Ma trận hiệp phương sai nghịch đảo cho lưới điểm ảnh","Phép chiếu hình tròn của các điểm ảnh đích"]},"b-34":{"q":"Điều nào KHÔNG đúng về ghép ảnh (image stitching)?","options":["Đó là quá trình kết hợp nhiều ảnh chụp có vùng nhìn chồng lấn","Nó được dùng trong khoa học pháp y và điều tra để tái dựng giấy bị xé rách","Nó được dùng để hoàn thiện việc lập bản đồ một địa điểm cụ thể","Nó ánh xạ hai điểm ảnh có cường độ tương tự nhau từ hai ảnh kề nhau"]},"b-35":{"q":"Điều nào KHÔNG đúng về phát hiện đối tượng (object detection)?","options":["Đó là nhiệm vụ phát hiện các thể hiện của đối tượng thuộc một lớp nhất định trong ảnh","Nó cho phép nhận diện và định vị các đối tượng trong video","Nó nhận biết bằng một đường viền (contour) trong ảnh","Nó phát hiện các thể hiện của các đối tượng ngữ nghĩa thuộc một lớp nhất định"]},"b-36":{"q":"Điều nào KHÔNG đúng về thuật toán RANSAC?","options":["Nó ước lượng tham số khi có số lượng lớn các điểm ngoại lai (outlier)","Nó sinh ra các nghiệm ứng viên bằng cách dùng số điểm dữ liệu tối đa cần thiết để ước lượng các tham số mô hình cơ sở","Nó chọn ngẫu nhiên các phần tử dữ liệu rồi tìm xem có bao nhiêu phần tử dữ liệu khớp với mô hình","Nếu ngưỡng dung sai (tolerance) đủ lớn, thuật toán sẽ chấp nhận độ khớp và thoát với kết quả thành công"]},"b-37":{"q":"Điều nào đúng về mô hình hỗn hợp Gauss (Gaussian mixture models)?","options":["Nó xem các phân phối là tổng của nhiều mô hình Gauss","Nó phân tích phân phối thành tích của nhiều mô hình Gauss","Nó xem cường độ của mỗi điểm ảnh là tổng của nhiều mô hình Gauss","Nó phân tích cường độ của mỗi điểm ảnh thành tích của nhiều mô hình Gauss"]},"b-38":{"q":"Luồng quang học (Optical Flow) KHÔNG cung cấp loại thông tin nào?","options":["Gia tốc của đối tượng","Vận tốc chuyển động của điểm ảnh","Hướng chuyển động của điểm ảnh","Vị trí của các điểm khóa (keypoint)"]},"b-39":{"q":"\"Mô hình hỗn hợp Gauss (Gaussian Mixture Model)\" mô hình hóa mỗi cụm thành một phân phối Gauss với trung bình và phương sai xác định","options":["Đúng","Sai"]},"b-40":{"q":"Nếu _____ chia vùng quan tâm (thường thành bốn vùng con bằng nhau) và lần lượt xem mỗi vùng con là vùng quan tâm.","options":["Đúng","Sai"]},"b-41":{"q":"Phép chiếu trụ (Cylindrical) được dùng nếu camera nằm ngang và chỉ có phép quay quanh trục thẳng đứng của nó","options":["Đúng","Sai"]},"b-42":{"q":"Kích thước (số chiều) điển hình của vector mô tả (descriptor vector) được sinh ra bởi thuật toán SIFT là bao nhiêu?","options":["128","64","256","512"]},"b-43":{"q":"Dải phổ mà con người có thể nhìn thấy dưới dạng màu sắc là bao nhiêu?","options":["200nm- 500nm","300nm- 600nm","400nm-700nm","500nm- 900nm"]},"b-44":{"q":"Ảnh xám (Grayscale) có bao nhiêu kênh màu?","options":["1","2","3","4"]},"b-45":{"q":"Nhiệm vụ nhận dạng khuôn mặt (face recognition) có bao nhiêu bước?","options":["1","4","2","3"]},"b-46":{"q":"Cần tối thiểu bao nhiêu điểm để tìm ma trận biến đổi affine?","options":["3","4","5","6"]},"b-47":{"q":"Một kỹ thuật dựa trên tích chập được dùng để phát hiện đường. Dưới đây là bốn mặt nạ tích chập để phát hiện các đường nằm ngang, thẳng đứng và xiên ± trong ảnh. Giá trị cụ thể của góc xiên là bao nhiêu độ?","options":["15","45","90","180"]},"b-48":{"q":"Một tập dữ liệu có 100 ảnh, kích thước mỗi ảnh là 112x112 điểm ảnh. Phân tích thành phần chính (Principal component analysis - PCA) được áp dụng để giữ lại 200 thành phần quan trọng nhất. Ban đầu, PCA tách ảnh thành bao nhiêu thành phần?","options":["11200","1254400","20000","12544"]},"b-49":{"q":"Cho một đạo hàm bậc hai (2nd gradient): [-1, -7, 4, -2, 8, -5, 0, 9, -3, 6, -1, -9, 3, 2, 7, -8, 5, 10, -6, -4]. Có bao nhiêu điểm cắt không (zero-crossing) trong đạo hàm bậc hai trên?","options":["12","11","5","7","13"]},"b-50":{"q":"Nếu muốn vẽ một hình và tô đầy bên trong, ta phải viết:","options":["1","fillInside = 1","fillInside = True","-1"]},"b-51":{"q":"Sắp xếp lại các bước sau của thuật toán đồng thuận mẫu ngẫu nhiên (RAndom SAmple Consensus - RANSAC)\n1.Chọn ngẫu nhiên N phần tử dữ liệu\n2.Nếu K đủ lớn, chấp nhận độ khớp và thoát với kết quả thành công.\n3.Tìm xem có bao nhiêu phần tử dữ liệu (trong M) khớp với mô hình có vector tham số x trong ngưỡng dung sai do người dùng cho. Gọi số này là K.\n4.Thất bại nếu đến được bước này\n5.Lặp lại các bước trên L lần\n6.Ước lượng tham số của vector x","options":["163254","123465","254613","123654"]},"b-52":{"q":"Sắp xếp lại các bước sau của phân đoạn dựa trên K-means (K-means based segmentation)\n\nGán mỗi quan sát vào nhóm có tâm cụm (centroid) gần nhất\nLặp lại cho đến khi vị trí tâm cụm hoặc việc gán các quan sát không còn thay đổi\nĐoán vị trí của K tâm cụm, mỗi tâm cụm cho một cụm kết quả\nKhi tất cả các quan sát đã được gán, tính lại vị trí của K tâm cụm","options":["3124","3214","1324","4231"]},"b-53":{"q":"Chúng ta đang làm việc với OpenCV và muốn vẽ một đường thẳng lên ảnh. Chúng ta cần dùng bao nhiêu điểm?","options":["2","4","5","3"]},"b-54":{"q":"Chọn mô tả đúng nhất về biên (edge) trong ảnh","options":["Biên là những thay đổi cục bộ đáng kể của cường độ trong ảnh số.","Biên có thể được định nghĩa là một tập các điểm ảnh liên thông tạo thành ranh giới giữa hai vùng tiếp giáp nhau.","Ba loại biên gồm biên ngang, biên dọc và biên tròn","Tất cả các đáp án còn lại"]},"b-55":{"q":"Chọn đáp án đúng nhất về điểm 2D","options":["Đó là một thiết lập hình học trong đó cần hai giá trị để xác định vị trí của một phần tử.","Nó biểu diễn một vị trí trong không gian tọa độ (x,y).","Đó là thuộc tính của một vật thể tạo ra các cảm giác khác nhau trên mắt do cách vật thể phản xạ hoặc phát ra ánh sáng.","Tất cả các đáp án còn lại"]},"b-56":{"q":"Chọn mô tả đúng nhất về biểu đồ histogram của ảnh (image histogram)","options":["Đó là một loại histogram đóng vai trò biểu diễn đồ họa sự phân bố sắc độ trong một ảnh số.","Đó là histogram biểu diễn cách tổ chức bố cục của ảnh, chẳng hạn màu sắc và vị trí điểm ảnh tương ứng.","Hai ảnh có bố cục khác nhau sẽ cho hai histogram ảnh khác nhau.","Histogram ảnh được dùng để tổng hợp màu sắc trong ảnh."]},"b-57":{"q":"Chọn mô tả đúng nhất về bộ mô tả đặc trưng (feature descriptor)","options":["Bộ mô tả đặc trưng là một thuật toán nhận vào một ảnh và xuất ra các vector đặc trưng.","Bộ mô tả đặc trưng được dùng để tìm các đặc trưng thiết yếu từ ảnh đã cho","Bộ mô tả đặc trưng được dùng để chuyển các đặc trưng sang các biểu diễn khác thông qua các phép biến đổi không gian.","Tất cả các đáp án còn lại"]},"b-58":{"q":"Chọn mô tả đúng nhất về phân đoạn ảnh (image segmentation)","options":["Phân đoạn là kỹ thuật chia hoặc phân vùng một ảnh thành các phần.","Phân đoạn ảnh là quá trình gán một màu cho mọi điểm ảnh trong ảnh.","Phân đoạn ảnh thường được dùng để nhận dạng các đối tượng và tên của chúng trong ảnh.","Tất cả các đáp án còn lại."]},"b-59":{"q":"Chọn mô tả đúng nhất về phân đoạn Mean Shift","options":["Đó là một kỹ thuật đồng nhất hóa cục bộ rất hữu ích đối với nhiễu muối tiêu hoặc các khác biệt sắc độ trong các đối tượng toàn cục.","Mean shift mô hình hóa ngầm phân phối này bằng một mô hình phi tham số liên tục và trơn.","Ý tưởng là thay mỗi điểm ảnh bằng khối 3x3 các điểm ảnh trong một lân cận theo khoảng giá trị (range) và có giá trị nằm trong khoảng cách d","Tất cả các đáp án còn lại"]},"b-60":{"q":"Chọn mô tả đúng nhất về các phép biến đổi hình học (Geometric Transformations)","options":["Trong các phép biến đổi này, giá trị điểm ảnh không bị thay đổi, vị trí của các giá trị điểm ảnh bị thay đổi.","Phép biến đổi hình học của một ảnh là một phép biến đổi không gian của hệ tọa độ ảnh.","Biến đổi hình học là hình học của ảnh bị thay đổi cùng với việc thay đổi các giá trị điểm ảnh thực của nó.","Tất cả các đáp án còn lại"]},"b-61":{"q":"Chọn mô tả đúng nhất về K-Means dùng cho phân đoạn (segmentation)","options":["Thuật toán phân cụm k-means cố gắng điền vào các khoảng dữ liệu bị thiếu để tạo ra các cụm mới.","Nó được dùng để xác định nhãn dữ liệu dựa trên một tập dữ liệu có nhãn cho trước.","K Means là một thuật toán phân loại.","Trong thuật toán K-Means, trong cùng một nhóm dữ liệu, càng gần điểm dữ liệu trung tâm thì sự khác biệt dữ liệu càng lớn."]},"b-62":{"q":"Chọn đáp án đúng nhất về không gian màu (color space)","options":["Không gian màu là thuật ngữ chỉ một hệ thống dùng một mô hình ảnh cụ thể để chuyển màu sắc thành các con số.","Không gian màu là một cách tổ chức cụ thể của các màu.","Hệ thống biến ảnh thành các con số.","Không gian màu là các mô hình toán học mô tả cách ảnh có thể được biểu diễn."]},"b-63":{"q":"Chọn đáp án đúng nhất về ảnh số (digital image)","options":["Ảnh số là một mảng hai chiều của màu sắc","Ảnh số là một ma trận các điểm ảnh (pixel).","Ảnh số được tạo thành từ sự kết hợp của các màu.","Ảnh số được tạo ra từ máy ảnh kỹ thuật số thông qua một hệ thống cơ học."]},"b-64":{"q":"Chọn mô tả đúng nhất về biến đổi Fourier (Fourier Transform)","options":["Biến đổi Fourier là một hàm toán học biến đổi tín hiệu từ miền tần số sang miền thời gian.","Biến đổi Fourier là một công cụ xử lý ảnh quan trọng dùng để phân tích một ảnh thành các thành phần sin và cosin","Trong ảnh miền Fourier, mỗi điểm biểu diễn một thành phần không gian cụ thể có trong ảnh miền tần số.","Tất cả các đáp án còn lại"]},"b-65":{"q":"Chọn đáp án đúng nhất về trắc quang (Photometry):","options":["Trắc quang tỉ lệ với lượng ánh sáng do mảnh bề mặt hướng tới và được chiếu lên máy tính.","Trắc quang là khoa học đo ánh sáng xét theo độ sáng mà mắt người cảm nhận được","Trắc quang là hiện tượng ánh sáng bị hấp thụ khi tới bề mặt của vật chất.","Tất cả các đáp án còn lại"]},"b-66":{"q":"Chọn đáp án đúng nhất về đường thẳng 2D (2D Lines)","options":["Đường thẳng là một hình một chiều thẳng, không có độ dày và kéo dài vô hạn về cả hai hướng.","Đường thẳng là sự lý tưởng hóa của các đối tượng như vậy, thường được mô tả qua hai điểm","Đường thẳng trong mặt phẳng thường được định nghĩa là tập các điểm có tọa độ thỏa mãn một phương trình tuyến tính cho trước.","Tất cả các đáp án còn lại"]},"b-67":{"q":"Chọn mô tả đúng nhất về nhân tích chập (convolution kernel)","options":["Đó là một mảng đại diện để biến đổi ảnh giữa các miền không gian khác nhau.","Đó là quá trình cộng mỗi phần tử của ảnh với các lân cận cục bộ của nó, có trọng số theo giá trị cường độ.","Đó là một ma trận nhỏ dùng để làm nổi bật một số đặc trưng nhất định.","Nó được dùng trong mọi bộ lọc để tăng độ sáng của ảnh."]},"b-68":{"q":"Chọn mô tả đúng nhất về kéo giãn độ tương phản (contrast stretching)","options":["Nó được dùng như một bộ lọc, loại bỏ nhiễu như nhiễu muối tiêu","Nó còn được gọi là Chuẩn hóa nghịch đảo (Invert-Normalization)","Nó cải thiện ảnh bằng cách kéo giãn dải giá trị cường độ mà ảnh chứa.","Đó là một cách biểu diễn histogram theo cách triển khai cân bằng ánh sáng"]},"b-69":{"q":"Chọn mô tả đúng nhất về căn chỉnh toàn cục (global alignment) trong ghép ảnh (image stitching)","options":["Căn chỉnh toàn cục đòi hỏi cực tiểu hóa phi tuyến một số hạng lỗi, được định nghĩa từ các điểm tương ứng.","Căn chỉnh toàn cục vẫn cần thiết để thu được một bức ghép nhất quán toàn cục.","Mục tiêu của căn chỉnh toàn cục là tìm một tập tham số căn chỉnh nhất quán toàn cục sao cho cực tiểu hóa sai lệch đăng ký (misregistration) giữa mọi cặp ảnh.","Tất cả các đáp án còn lại"]},"b-70":{"q":"Chọn mô tả đúng nhất về phát hiện đường (line detection) bằng kỹ thuật dựa trên tích chập","options":["Một kỹ thuật dựa trên tích chập tạo ra mô tả ảnh về các đường mảnh trong ảnh đầu vào","Các mặt nạ nhân (kernel mask) này được điều chỉnh cho các đường tối trên nền xám","Kỹ thuật dựa trên tích chập là nền tảng của các mô hình học sâu.","Tất cả các đáp án còn lại"]},"b-71":{"q":"Chọn mô tả đúng nhất về toán tử Prewitt (Prewitt operator) để phát hiện biên","options":["Nó phát hiện các biên chồng lấn của ảnh.","Nó là một trong những cách tốt nhất để phát hiện cường độ màu và độ lớn của ảnh","Nó có hiệu quả tốt trong việc phát hiện các biên dọc và ngang","Nó không bao giờ là lựa chọn tốt để phát hiện hướng của ảnh"]},"b-72":{"q":"Chọn mô tả đúng nhất về biến đổi Hough (Hough transform)","options":["Biến đổi Hough là một kỹ thuật có thể dùng để tách các đặc trưng có hình dạng cụ thể trong ảnh.","Biến đổi Hough có thể được dùng trong các ứng dụng mà không thể có mô tả giải tích đơn giản cho một đặc trưng.","Ưu điểm chính của kỹ thuật biến đổi Hough là nó chịu được các khoảng trống trong mô tả biên đặc trưng và tương đối ít bị ảnh hưởng bởi nhiễu ảnh.","Tất cả các đáp án còn lại"]},"b-73":{"q":"Chọn mô tả đúng nhất về biến đổi Fourier (Fourier Transform)","options":["Biến đổi Fourier là một công cụ phân tách một dạng sóng thành một biểu diễn thay thế, đặc trưng bởi các hàm sin và cosin.","Biến đổi Fourier cho thấy mọi dạng sóng đều có thể được viết lại thành tổng của các hàm hình sin.","Biến đổi Fourier cho chúng ta một bản đồ độc đáo và mạnh mẽ để quan sát các dạng sóng này.","Tất cả các đáp án còn lại"]},"b-74":{"q":"Chọn mô tả đúng nhất về làm trơn Gauss (Gaussian smoothing)","options":["Làm trơn Gauss là kết quả của việc làm mờ ảnh bằng hàm Laplace.","Nó làm nổi bật các cấu trúc ảnh ở các tỉ lệ khác nhau.","Độ mờ mượt giống như khi thay ảnh bằng cách nhìn qua một màn chắn mờ trong suốt","Tất cả các đáp án còn lại"]},"b-75":{"q":"Chọn đáp án đúng nhất về loại bỏ thị sai (parallax removal)","options":["Thị sai (parallax) là thách thức then chốt dẫn đến đăng ký không chính xác và hiệu ứng bóng ma (ghosting) của các đối tượng trong kết quả. Vì vậy cần loại bỏ nó.","Nó được dùng để tối ưu hóa tư thế camera. Sau khi các tư thế này được ước lượng, vị trí mong muốn của một điểm 3D x có thể được ước lượng bằng trung bình của các vị trí 3D chiếu ngược.","Đó là sự dịch chuyển hay chênh lệch về vị trí biểu kiến của một vật thể khi quan sát theo hai đường ngắm khác nhau, và được đo bằng góc hoặc nửa góc nghiêng giữa hai đường đó.","Tất cả các đáp án còn lại"]},"b-76":{"q":"Chọn đáp án đúng nhất về hàm phân phối phản xạ hai chiều (bidirectional reflectance distribution function):","options":["Nó mô tả ánh sáng tới bề mặt vật chất trong điều kiện thiếu sáng và cách tính phổ màu trong dải tần số tương ứng.","Nó có tính tương hỗ - có thể tính bằng tổng cường độ tới và cường độ phản xạ.","Nó mô tả tỉ lệ ánh sáng đến từ mỗi hướng tới được chuyển hướng sang mỗi hướng phản xạ.","Tất cả các đáp án còn lại"]},"b-77":{"q":"Chọn mô tả đúng nhất về đồng thuận mẫu ngẫu nhiên (RANdom SAmple Consensus - RANSAC)","options":["RANSAC là một phương pháp ước lượng tham số được thiết kế để xử lý tỉ lệ lớn các điểm ngoại lai (outlier) trong dữ liệu đầu vào","RANSAC là một kỹ thuật lấy mẫu lại sinh ra các nghiệm ứng viên bằng cách dùng số điểm dữ liệu tối thiểu cần thiết để ước lượng các tham số mô hình cơ sở.","Nó là một thuật toán đối sánh điểm khóa.","Tất cả các đáp án còn lại"]},"b-78":{"q":"Chọn mô tả đúng nhất về đặc trưng ảnh (image feature)","options":["Đặc trưng là một mẩu thông tin về nội dung của ảnh","Đặc trưng có thể là các cấu trúc cụ thể trong ảnh như điểm, biên hoặc đối tượng","Tất cả các đáp án còn lại","Không đáp án nào trong số còn lại"]},"b-79":{"q":"Chọn mô tả đúng nhất về đường viền chủ động (active contours)","options":["Đó là quá trình gán một màu cho mọi điểm ảnh trong ảnh.","Nó xác định một ranh giới hoặc đường cong riêng cho các vùng của đối tượng mục tiêu cần phân đoạn.","Phân đoạn ảnh thường được dùng để nhận biết dải màu và nhóm của chúng trong ảnh.","Nó được mô tả như một đa mô hình cho quá trình phân đoạn."]},"b-80":{"q":"Việc chọn vị trí của K tâm cụm (centroid) rất quan trọng. Giá trị khởi tạo của vị trí K tâm cụm được tính như thế nào? Chọn đáp án đúng nhất","options":["Chia theo số K và tỉ lệ ảnh","Phân bố đều K tâm trong ảnh","Giá trị trung tâm.","Ngẫu nhiên"]},"b-81":{"q":"Chọn đáp án đúng nhất về quang sai màu (chromatic aberration):","options":["Quang sai màu là sự không thể của thấu kính trong việc hội tụ mọi màu về cùng một điểm.","Quang sai màu: chiết suất của thủy tinh thay đổi nhẹ theo tần số.","Quang sai màu là các bước sóng khác nhau hội tụ ở những khoảng cách hơi giống nhau.","Tất cả các đáp án còn lại"]},"b-82":{"q":"Chọn đáp án đúng nhất về mô hình chiếu sáng (illumination model):","options":["Mô hình chiếu sáng mô tả quá trình hấp thụ ánh sáng từ nguồn nhân tạo và được biểu diễn trong không gian 2D.","Mô hình chiếu sáng là một phép biến đổi không gian, dùng để mô tả phép biến đổi từ không gian 3D sang không gian 2D.","Mô hình chiếu sáng được dùng để tính cường độ ánh sáng phát ra từ các nguồn sáng tự nhiên (Mặt trời, Mặt trăng)","Mô hình chiếu sáng mô tả các đầu vào, giả định và đầu ra dùng để tính độ sáng của các phần tử bề mặt"]},"b-83":{"q":"Chọn đáp án đúng nhất về màu sắc của ảnh (image color)","options":["Màu sắc là khía cạnh của sự vật do các đặc tính khác nhau của ánh sáng mà chúng phản xạ hoặc phát ra gây nên.","Màu sắc là ánh sáng trắng phát ra từ một nguồn tự nhiên - Mặt trời","Màu sắc là một cách hiển thị giá trị của ảnh và màu sắc có bảy màu cơ bản.","Tất cả các đáp án còn lại"]},"b-84":{"q":"Chọn mô tả đúng nhất về thị giác máy tính (computer vision)","options":["Thị giác máy tính xử lý các mức thấp trong ảnh.","Thị giác máy tính hoạt động bằng cách xác định các thành phần khác nhau trong ảnh","Thị giác máy tính chỉ được triển khai trên các hệ thống xử lý lớn và nhanh.","Thị giác máy tính được áp dụng trong xử lý ảnh y tế, nhưng không như kỳ vọng ở các lĩnh vực khác như nông nghiệp."]},"b-85":{"q":"Mục đích chính của việc tìm các thành phần liên thông (connected components) trong đồ thị chồng lấn (overlap graph) khi nhận dạng ảnh toàn cảnh (panorama recognition) là gì?","options":["Xác định các điểm ngoại lai (outlier) trong tập ảnh","Nhận dạng từng ảnh toàn cảnh riêng lẻ","Ước lượng tư thế camera","Tính các góc chồng lấn giữa các ảnh"]},"b-86":{"q":"Mục đích chính của việc tính gradient ảnh (image gradient) trong xử lý ảnh là gì?","options":["Nâng cao độ phân giải ảnh","Xác định các điểm ngoại lai trong dữ liệu","Trích xuất thông tin hữu ích","Điều chỉnh độ sáng ảnh"]},"b-87":{"q":"Nhược điểm chính của toán tử Sobel (Sobel operator) cơ bản trong phát hiện biên là gì?","options":["Nhạy cảm với nhiễu","Không thể phát hiện các biên chéo","Tốc độ tính toán chậm","Thiếu tính bất biến theo phép quay"]},"b-88":{"q":"Mục đích của hàm phân phối phản xạ hai chiều (Bidirectional Reflectance Distribution Function - BRDF) trong sự hình thành ảnh trắc quang (photometric image formation) là gì?","options":["Mô hình hóa phản xạ gương (specular reflection)","Mô tả sự hấp thụ ánh sáng","Mã hóa thông tin màu sắc","Biểu diễn ánh xạ kết cấu (texture mapping)"]},"b-89":{"q":"Nguyên nhân phổ biến gây ra méo (distortion) trong ảnh camera là gì?","options":["Mô hình chiếu tuyến tính","Ống kính góc rộng","Khoảng cách lệch trục","Độ phóng đại tuyến tính"]},"b-90":{"q":"Đầu vào của thị giác máy tính (computer vision) là gì?","options":["Văn bản","Âm thanh","Video","Ảnh"]},"b-91":{"q":"Khía cạnh cơ bản nào của theo dõi đối tượng (object tracking) liên quan đến việc gán một định danh riêng cho mỗi đối tượng được phát hiện rồi theo dõi chuyển động của chúng qua các khung hình video liên tiếp?","options":["Phân loại đối tượng","Dự đoán quỹ đạo","Phân đoạn thể hiện (instance segmentation)","Duy trì việc gán ID"]},"b-92":{"q":"Mục đích chính của biến đổi Fourier (Fourier transform) trong xử lý tín hiệu và phân tích ảnh là gì?","options":["Phân tích tần số","Giảm nhiễu","Phát hiện biên","Hiệu chỉnh màu"]},"b-93":{"q":"Nguyên nhân chính của quang sai màu (chromatic aberration) trong thấu kính là gì?","options":["Sự tán sắc của ánh sáng","Độ cong của thấu kính","Độ dày của thấu kính","Vật liệu của thấu kính","Không đáp án nào trong số còn lại"]},"b-94":{"q":"Ưu điểm của việc dùng một chuỗi các phép biến đổi một chiều so với các nhân lọc hai chiều lớn, không tách được (non-separable) trong xử lý ảnh là gì?","options":["Cải thiện độ chính xác màu","Tăng cường khả năng bảo toàn chi tiết","Tăng hiệu quả tính toán","Giảm yêu cầu bộ nhớ"]},"b-95":{"q":"K đại diện cho điều gì trong thuật toán phân cụm K-Means?","options":["Số chiều","Số điểm dữ liệu","Số cụm","Số vòng lặp"]},"b-96":{"q":"Phương pháp nào thường được dùng để trích xuất vị trí đặc trưng và bộ mô tả trong giai đoạn đối sánh dựa trên đặc trưng của nhận dạng ảnh toàn cảnh (panorama recognition)?","options":["Phân tích thành phần chính (Principal Component Analysis - PCA)","Histogram các gradient có hướng (Histogram of Oriented Gradients - HOG)","Biến đổi đặc trưng bất biến tỉ lệ (Scale Invariant Feature Transform - SIFT)","Mạng nơ-ron tích chập (Convolutional Neural Networks - CNN)"]},"b-97":{"q":"Bạn có thể dùng những phương pháp nào để phân loại đa lớp (multiclass classification) mà không cần thay đổi","options":["KNN","Hồi quy logistic (Logistic Regression)","SVM","Softmax"]},"b-98":{"q":"Bước đầu tiên quan trọng nào đối với thuật toán biến đổi Hough (Hough Transform) khi nhận dạng các đường phức tạp trong ảnh chụp?","options":["Hiệu chỉnh màu của ảnh","Áp dụng ánh xạ kết cấu (texture mapping)","Thực hiện phát hiện biên","Điều chỉnh mức tương phản"]},"b-99":{"q":"Haar Cascade dùng loại đặc trưng nào để phát hiện đối tượng?","options":["Đặc trưng đường (line features)","Histogram màu","Đặc trưng kết cấu (texture features)","Eigenfaces"]},"b-100":{"q":"Phương pháp nhận dạng khuôn mặt nào liên quan đến việc trích xuất các đặc trưng cục bộ như mắt, mũi và miệng, rồi đưa vị trí và thống kê của chúng vào một bộ phân loại cấu trúc?","options":["Các phương pháp đối sánh toàn thể (Holistic Matching Methods)","Các phương pháp dựa trên đặc trưng (Feature-based Methods)","Eigenfaces","Phân tích biệt thức tuyến tính (Linear Discriminant Analysis)"]},"b-101":{"q":"Khía cạnh nào trong hoạt động của camera chịu trách nhiệm điều chỉnh độ khuếch đại và mức đen (black level) để khớp công suất ánh sáng tới với dải động (dynamic range) của ảnh?","options":["Nhiễu cảm biến (Sensor noise)","Độ phân giải ADC","Điều khiển độ lợi tự động (Automatic Gain Control - AGC)","Cân bằng trắng (White balance)"]},"b-102":{"q":"Đồng thuận mẫu ngẫu nhiên (RANdom SAmple Consensus - RANSAC) chủ yếu được thiết kế để giải quyết vấn đề nào trong ước lượng tham số?","options":["Quá khớp (Overfitting)","Các điểm ngoại lai (outlier) trong dữ liệu đầu vào","Dưới khớp (Underfitting)","Độ phức tạp tính toán"]},"b-103":{"q":"Máy ảnh kỹ thuật số dùng hệ thống nào để thực hiện việc số hóa ảnh?","options":["Hệ thống cảm biến","Hệ thống số","Hệ thống logic","Hệ thống quang học"]},"b-104":{"q":"Vấn đề nào thường gặp khi dùng thuật toán phân thủy (watershed) trên các ảnh có nền kết cấu (textured)?","options":["Phân đoạn quá mức (Over-segmentation)","Tốc độ xử lý cao","Hạn chế về thời gian","Mất thông tin màu"]},"b-105":{"q":"Điều nào sau đây là một ứng dụng của thị giác máy tính (computer vision)?","options":["An ninh","Robot học","Y học","Tất cả các đáp án trên"]},"b-106":{"q":"Phương pháp nào sau đây thuộc các phương pháp phát hiện truyền thống?","options":["YOLO","RCNN","Bộ phát hiện Hog (Hog detector)","Retina Net"]},"b-107":{"q":"Thuật toán nào sau đây sẽ phân bố cường độ của ảnh trên toàn bộ dải cường độ?","options":["White patch","Gray world","Ground truth","Cân bằng histogram (Histogram equalization)"]},"b-108":{"q":"Màu nào sau đây có tần số lớn nhất trong phổ khả kiến (visible spectrum)?","options":["Đỏ","Lam","Tím","Lục"]},"b-109":{"q":"Phương pháp nào sau đây dùng các lực năng lượng và ràng buộc để tách các điểm ảnh quan tâm khỏi ảnh?","options":["Đường viền chủ động (Active contours)","Phân thủy (Watershed)","Phân đoạn dựa trên đồ thị (Graph-based segmentation)","Tách vùng (Region splitting)"]},"b-110":{"q":"Phương pháp nào sau đây xác định biên trong ảnh bằng kỹ thuật cắt không (zero-crossing)?","options":["Đạo hàm bậc nhất","Đạo hàm bậc hai","Toán tử Prewitt","Toán tử Robert"]},"b-111":{"q":"Điều nào sau đây là các ứng dụng của thuật toán RANSAC?","options":["Xử lý tài liệu","Các ứng dụng y tế","Tạo ảnh toàn cảnh (panorama)","Tất cả các đáp án trên"]},"b-112":{"q":"Phương pháp nào sau đây sẽ phân đoạn ảnh dựa trên sự tương đồng mức xám và sự tương đồng kết cấu?","options":["Tách vùng (Region splitting)","Phân thủy (Watershed)","Phân đoạn dựa trên đồ thị (Graph-based segmentation)","Tập hợp xác suất (Probabilistic aggregation)"]},"b-113":{"q":"Toán tử nào sau đây sử dụng Laplacian của Gauss (Laplacian of Gaussian)?","options":["Toán tử Prewitt","Toán tử Canny","Sobel (3x3)","Sobel (5x5)"]},"b-114":{"q":"Điều nào sau đây KHÔNG phải là bộ lọc ảnh được dùng trong OpenCV?","options":["Box Filter","Bilateral Filter","Blue Blur","Build Pyramid"]},"b-115":{"q":"Lĩnh vực nào sau đây nghiên cứu các kỹ thuật khác nhau để phân loại các mẫu (pattern)?","options":["Xử lý ảnh (Image Processing)","Đo ảnh (Photogrammetry)","Nhận dạng ảnh (Image Recognition)","Nhận dạng mẫu (Pattern Recognition)"]},"b-116":{"q":"Điều nào sau đây thuộc phương pháp theo dõi dựa trên nhân (kernel tracking) trong các thuật toán theo dõi đối tượng?","options":["Phương pháp dựa trên đa góc nhìn (Multi-view based)","Phương pháp tất định (Deterministic)","Phương pháp xác suất (Probabilistic)","Đối sánh hình dạng (Shape matching)"]},"b-117":{"q":"Thuật toán nào sau đây được dùng để phát hiện vị trí của một blob trong ảnh?","options":["Đạo hàm bậc nhất","Đạo hàm bậc hai","Laplacian của Gauss (Laplacian of Gaussian)","Laplacian của Gauss chuẩn hóa (Normalized Laplacian of Gaussian)"]},"b-118":{"q":"Phương pháp nào được dùng để trải rộng dải cường độ nhằm tận dụng đầy đủ các giá trị có thể?","options":["Kéo giãn độ tương phản (Contrast stretching)","Gray world","Ground truth","Cân bằng histogram (Histogram equalization)"]},"b-119":{"q":"Kỹ thuật nào thường được dùng để phát hiện các điểm khóa (keypoint) và bộ mô tả (descriptor) trong ảnh cho nhận dạng ảnh toàn cảnh (panorama recognition)?","options":["SIFT","Cân bằng histogram (Histogram equalization)","Biến đổi Fourier (Fourier transform)","PCA"]},"b-120":{"q":"Hàm OpenCV nào thường được dùng để vẽ một đường thẳng lên ảnh?","options":["line()","drawLine()","lineSegment()","draw.line()"]},"b-121":{"q":"Thông số kỹ thuật nào của camera điều tiết lượng ánh sáng đến cảm biến và xác lập mức phơi sáng của ảnh?","options":["Bước lấy mẫu (Sampling pitch)","Hệ số lấp đầy (Fill factor)","Tốc độ cửa trập (Shutter speed)","Kích thước chip"]},"b-122":{"q":"Biến đổi Hough (Hough Transform) thường dùng loại không gian nào sau đây để biểu diễn các đường thẳng trong không gian tham số (parameter space)?","options":["Không gian cực (Polar space)","Không gian Descartes (Cartesian space)","Không gian biến đổi (Transform space)","Không gian gradient (Gradient space)"]},"b-123":{"q":"Loại phương pháp theo dõi đối tượng nào ước lượng vùng đối tượng trong mỗi khung hình, bằng cách dùng thông tin được mã hóa bên trong chính vùng đối tượng?","options":["Đối sánh mẫu (Template Matching)","Theo dõi đa góc nhìn (Multi-view Tracking)","Theo dõi theo bóng (Silhouette Tracking)","Tiến hóa đường viền (Contour Evolution)"]},"b-124":{"q":"Thuật toán theo dõi nào nổi tiếng với khả năng xử lý các biến thiên tỉ lệ, phép quay và sự che khuất (occlusion) bằng cách điều chỉnh thích nghi cửa sổ tìm kiếm?","options":["Theo dõi CamShift","Lọc Kalman (Kalman filtering)","Theo dõi Mean Shift","Theo dõi luồng quang học (Optical flow tracking)"]},"b-125":{"q":"Thuật toán phát hiện đối tượng nào nổi tiếng với kiến trúc hai giai đoạn gồm đề xuất vùng (region proposals) và phân loại đối tượng?","options":["Faster R-CNN","YOLO","SSD","Haar Cascade"]},"b-126":{"q":"Mô hình hỗn hợp Gauss (Gaussian Mixture Model) biểu diễn mỗi cụm như thế nào?","options":["Bằng một đường parabol","Bằng một cây quyết định","Bằng một phân phối","Bằng một lựa chọn ngẫu nhiên"]},"b-127":{"q":"Số lần thử tối thiểu cần thiết trong thuật toán RANSAC được tính như thế nào, cho P là xác suất thành công sau S lần thử, p là xác suất của các điểm nội trội (inlier) và k là số mẫu ngẫu nhiên là điểm nội trội?","options":["log(1-P)/log(1-p^k)","log(1-P)*log(1-p^k)","log[(1-P)(1-p^k)]","log[(1-P)/(1-p^k)]"]},"b-128":{"q":"Khi xử lý phân loại ảnh (image classification), chúng ta gặp những loại thách thức nào với ảnh?","options":["Biến thiên do thay đổi tỉ lệ","Biến thiên do chiếu sáng","Che khuất ảnh (occlusion)","Tất cả các đáp án trên"]},"b-129":{"q":"Khi dùng biến đổi Fourier, giá trị của các tính chất cũng được biến đổi tương ứng. Kết quả của biến đổi Fourier áp dụng cho tích chập f(x) * h(x) là gì?","options":["F(w)+H(w)","F(w)*H(w)","F(w)H(w)","F(w)H*(w)"]},"b-130":{"q":"Sau khi trích xuất các đặc trưng và bộ mô tả của chúng từ hai hay nhiều ảnh, bước tiếp theo là thiết lập một số cặp đặc trưng khớp sơ bộ giữa các ảnh này. Bước này có tên là gì?","options":["Giảm đặc trưng (Feature reduce)","Kết hợp đặc trưng (Feature combination)","Nén đặc trưng (Feature compression)","Đối sánh đặc trưng (Feature matching)"]},"b-131":{"q":"Các thuật toán dùng cho phát hiện khuôn mặt (face detection) dựa trên tập đặc điểm nào để nhận ra khuôn mặt? Chọn đáp án đúng nhất","options":["Mắt, lông mày, mũi, tóc, hàm","Mắt, lông mày, mũi, cổ, miệng","Mắt, lông mày, mũi, miệng, hàm","Mắt, lông mày, hàm, cổ, tai"]},"b-132":{"q":"Đường viền chủ động (Active contour) được mô tả như một mô hình chủ động cho quá trình phân đoạn. Thuật toán nào sau đây được dùng trong đường viền chủ động? Chọn đáp án đúng nhất","options":["Mô hình Snakes","Mô hình Scissors","Mô hình Sets","Tất cả các đáp án còn lại"]},"b-133":{"q":"Một tập dữ liệu có 1000 ảnh, kích thước mỗi ảnh là 128x128. Phân tích thành phần chính (Principal component analysis) được áp dụng để giữ lại 1200 thành phần quan trọng nhất. Số đặc trưng của toàn bộ tập dữ liệu trong không gian riêng (eigenspace) là bao nhiêu?","options":["1000x128","1200x1000","128x1200","128x128"]},"b-134":{"q":"Đây là một phương pháp phát hiện, với mỗi điểm ảnh, lớp mà đối tượng đó thuộc về. Tên chính xác của quá trình này là gì?","options":["Phân đoạn thể hiện (Instance segmentation)","Phát hiện ngữ nghĩa (Semantic detection)","Phát hiện thể hiện (Instance detection)","Phân đoạn ngữ nghĩa (Semantic segmentation)"]},"b-135":{"q":"Đây là kỹ thuật ghép ảnh hoàn toàn tự động nhằm nhận biết những ảnh nào thực sự thuộc về nhau. Tên chính xác của quá trình này là gì?","options":["Tạo ảnh toàn cảnh (Panoramas creating)","Nhận dạng ảnh toàn cảnh (Recognizing panoramas)","Loại bỏ thị sai (Parallax removal)","Điều chỉnh chùm (Bundle Adjustment)"]},"b-136":{"q":"Đây là khả năng nhận biết các thuộc tính vật lý của một đối tượng (như hình dạng, màu sắc và kết cấu) và gán các thuộc tính ngữ nghĩa cho đối tượng. Tên chính xác của quá trình này là gì? Chọn đáp án đúng nhất","options":["Phát hiện đối tượng (Object detection)","Định vị đối tượng (Object locating)","Nhận dạng đối tượng (Object recognition)","Theo dõi đối tượng (Object tracking)"]},"b-137":{"q":"Trong hệ tọa độ nào các điểm được biểu diễn bằng khoảng cách hướng tâm, góc phương vị và độ cao?","options":["Tọa độ trụ (Cylindrical coordinates)","Tọa độ Descartes (Cartesian coordinates)","Tọa độ cầu (Spherical coordinates)","Tọa độ cực (Polar coordinates)"]},"b-138":{"q":"Trong xử lý ảnh, bước tiếp theo sau phát hiện đặc trưng (feature detection) là gì?","options":["Tiền xử lý","Mô tả đặc trưng (Feature description)","Kết hợp đặc trưng (Feature combination)","Loại bỏ nhiễu (bộ lọc)"]},"b-139":{"q":"Trong phân đoạn phân thủy (watershed segmentation), ranh giới phân thủy (watershed boundary) biểu diễn điều gì?","options":["Các biên của đối tượng","Các tâm của đối tượng (centroid)","Các thung lũng trong ảnh","Các điểm ảnh"]},"b-140":{"q":"Trong biến đổi Fourier, DFT là viết tắt của gì?","options":["Display Fourier Transform","Distribute Fourier Transform","Discrete Fourier Transform","Discontinous Fourier Transform"]},"b-141":{"q":"Trong bối cảnh hình thành ảnh trắc quang (photometric image formation), mô hình phản xạ Lambert (Lambertian reflectance model) được dùng để mô tả điều gì?","options":["Phản xạ khuếch tán (Diffuse reflection)","Phản xạ gương (Specular reflection)","Khúc xạ (Refraction)","Tính trong mờ (Translucency)"]},"b-142":{"q":"Trong phân đoạn K-means, \"K\" biểu diễn điều gì?","options":["Số cụm","Số láng giềng gần nhất","Kích thước nhân (kernel) của mỗi cụm","Các nhân (kernel) trong một ảnh"]},"b-143":{"q":"Trong bộ phát hiện góc Harris (Harris Corner Detector), tính chất nào của góc được khai thác để phát hiện?","options":["Độ lớn gradient cao","Cường độ điểm ảnh cao","Độ lớn gradient thấp","Cường độ điểm ảnh thấp"]},"b-144":{"q":"Trong biến đổi Fourier, toán tử nào sau đây trong miền tín hiệu sẽ trở thành toán tử tích của các hàm đã biến đổi riêng lẻ trong miền tín hiệu đã biến đổi?","options":["Tích chập (Convolution)","Tương quan (Correlation)","Phép nhân (Multiplication)","Phép cộng (Sum)"]},"b-145":{"q":"Trong loại phương pháp theo dõi đối tượng nào, đối tượng chuyển động được biểu diễn bằng một vùng đối tượng sơ khai, nhấn mạnh vào hình dạng và diện mạo của đối tượng?","options":["Theo dõi dựa trên nhân (Kernel Tracking)","Theo dõi điểm (Point Tracking)","Theo dõi theo bóng (Silhouette Tracking)","Đối sánh mẫu (Template Matching)"]},"b-146":{"q":"Trong bộ phát hiện góc Harris, sau khi tính điểm R để xác định một cửa sổ có thể chứa góc hay không. Khi nào cửa sổ là vùng phẳng (flat)?","options":["|R| nhỏ","|R| lớn","|R| < 0","không thể xác định |R|"]},"b-147":{"q":"Trong kỹ thuật này, một tập thưa các đặc trưng được phát hiện trong một ảnh và được đối sánh với các đặc trưng trong ảnh kia. Sau đó một phép biến đổi được tính dựa trên các đặc trưng khớp này để làm biến dạng (warp) ảnh này lên ảnh kia. Tên chính xác của kỹ thuật này là gì?","options":["Căn chỉnh dựa trên đặc trưng (Feature-Based alignment)","Phát hiện dựa trên đặc trưng (Feature-Based detection)","Nhận dạng dựa trên đặc trưng (Feature-Based recognition)","Bộ lọc dựa trên đặc trưng (Feature-Based filter)"]},"b-148":{"q":"Trong phân đoạn K-Means, các điểm ảnh được nhóm thành cụm như thế nào?","options":["Dựa trên cường độ điểm ảnh","Dựa trên độ gần về không gian","Dựa trên histogram màu","Theo độ lớn gradient"]},"b-149":{"q":"Trong máy ảnh kỹ thuật số, thiết lập ISO điều khiển điều gì?","options":["Độ nhạy của cảm biến với ánh sáng","Tốc độ cửa trập","Kích thước khẩu độ","Tốc độ lấy nét tự động","Không đáp án nào trong số còn lại"]},"b-150":{"q":"Việc này thường được thực hiện bằng cách định vị đối tượng chuyển động, được biểu diễn bằng một vùng đối tượng sơ khai, từ khung hình này sang khung hình kế tiếp: dựa trên đa góc nhìn, dựa trên mẫu. Nó liên quan đến hình dạng và diện mạo của đối tượng. Tên chính xác của phương pháp theo dõi đối tượng này là gì? Chọn đáp án đúng nhất","options":["Theo dõi dựa trên nhân (Kernel Tracking)","Theo dõi điểm (Point tracking)","Theo dõi đường viền (Contour tracking)","Theo dõi đặc trưng (Features tracking)"]},"b-151":{"q":"Đây là một phương pháp xác định, với mỗi điểm ảnh, thể hiện (instance) của đối tượng mà nó thuộc về. Nó phát hiện từng đối tượng riêng biệt quan tâm trong ảnh. Tên chính xác của quá trình này là gì?","options":["Phát hiện ngữ nghĩa (Semantic detection)","Phân đoạn thể hiện (Instance segmentation)","Phát hiện thể hiện (Instance detection)","Phân đoạn ngữ nghĩa (Semantic segmentation)"]},"b-152":{"q":"Đây là một kỹ thuật để tìm hiệu quả các đỉnh trong phân phối dữ liệu nhiều chiều này mà không cần tính tường minh toàn bộ hàm. Tên chính xác của kỹ thuật này trong phân đoạn ảnh là gì?","options":["Mô hình Mean shift","Mô hình phân cụm K-means","Mô hình hỗn hợp Gauss (Gaussian Mixture Models)","Mô hình K láng giềng gần nhất (K-nearest)"]},"b-153":{"q":"Trong lưu trữ ảnh, định dạng ảnh nào sau đây theo mô hình nén có mất mát (lossy)?","options":["iac","bmp","jpg","ppm"]},"b-154":{"q":"Đây là một loại phân đoạn ảnh, trong đó ta thay đổi các điểm ảnh của một ảnh để ảnh dễ phân tích hơn. Ta chuyển một ảnh từ màu hoặc thang xám thành ảnh nhị phân, tức là ảnh chỉ có đen và trắng. Tên chính xác của quá trình này là gì?","options":["Phân đoạn theo ngưỡng (Thresholding Segmentation).","Phân đoạn dựa trên biên (Edge-Based Segmentation).","Phân đoạn dựa trên vùng (Region-Based Segmentation).","Phân đoạn phân thủy (Watershed Segmentation)."]},"b-155":{"q":"Phát hiện đường (line detection) là một bước quan trọng trong xử lý ảnh. Có hai kỹ thuật được áp dụng để tìm đường. Kỹ thuật thứ nhất là biến đổi Hough. Vậy kỹ thuật thứ hai là gì? Chọn đáp án đúng nhất","options":["Các kỹ thuật dựa trên nội dung (Content-based techniques)","Kỹ thuật phát hiện biên (Edge detection technique)","Kỹ thuật Gauss (Gaussian technique)","Kỹ thuật dựa trên tích chập (Convolution based technique)"]},"b-156":{"q":"Phương pháp phát hiện đối
