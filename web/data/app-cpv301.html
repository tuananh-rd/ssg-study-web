rong điện thoại thông minh và máy ảnh compact?","options":["Cảm biến CMOS","Cảm biến full-frame","Cảm biến APS-C","Cảm biến Micro Four Thirds"]},"b-163":{"q":"Nguyên thủy hình học (geometric primitive) nào thường được dùng để biểu diễn một điểm trong ảnh 2D trong thị giác máy tính?","options":["Điểm ảnh (Pixel)","Đường thẳng","Hình tròn","Tam giác"]},"b-164":{"q":"Phép biến đổi nào chỉ bảo toàn tính thẳng hàng (collinearity) và tỉ lệ khoảng cách giữa các điểm trên một đường thẳng?","options":["Phép biến đổi affine (Affine transformation)","Phép tịnh tiến (Translation)","Phép quay (Rotation)","Phép biến đổi phối cảnh (Perspective transformation)"]},"b-165":{"q":"Loại bộ lọc (filter) nào thường được dùng để làm mịn ảnh và giảm nhiễu?","options":["Bộ lọc thông thấp (Low-pass filter)","Bộ lọc thông cao (High-pass filter)","Bộ lọc thông dải (Band-pass filter)","Bộ lọc thích nghi (Adaptive filter)"]},"b-166":{"q":"Thành phần nào của mô hình tô bóng Phong (Phong Shading) chịu trách nhiệm mô phỏng sự phản xạ ánh sáng từ một bề mặt theo nhiều hướng?","options":["Phản xạ khuếch tán (Diffuse reflection)","Phản xạ môi trường (Ambient reflection)","Phản xạ phát xạ (Emissive reflection)","Phản xạ gương (Specular reflection)"]},"b-167":{"q":"Quy trình nào được dùng để hiệu chỉnh thị sai (parallax) khi trộn ảnh (image blending) trong trường hợp chuyển động tương đối nhỏ?","options":["Hiệu chỉnh khối toàn cục (Global bundle adjustment).","Căn chỉnh cục bộ (Local alignment).","Ước lượng chuyển động 2D tổng quát (General 2D motion estimation).","Lấy trung bình chiếu ngược (Back-projection averaging)."]},"b-168":{"q":"Ghép ảnh (image stitching) được dùng để dựng lại giấy bị xé trong lĩnh vực nào?","options":["Phục chế nghệ thuật.","Ảnh y khoa.","Khoa học pháp y và điều tra.","Khảo cổ học."]},"b-169":{"q":"Hướng tiếp cận nào trong nhận dạng khuôn mặt coi bài toán là bài toán hai chiều và bao gồm các kỹ thuật như Phân tích thành phần chính (Principal Component Analysis), Phân tích phân biệt tuyến tính (Linear Discriminant Analysis) và phân tích thành phần độc lập (independent component analysis)?","options":["Phương pháp dựa trên đặc trưng (Feature-based Methods)","Phương pháp đối sánh toàn diện (Holistic Matching Methods)","Phương pháp bộ phân loại cấu trúc (Structural Classifier Methods)","Phương pháp dựa trên mạng nơ-ron (Neural network based method)"]},"b-170":{"q":"Nguyên lý cơ bản của phân đoạn Mean Shift (Mean Shift segmentation) là gì?","options":["Dịch chuyển các điểm ảnh về phía màu trung bình","Cực tiểu hóa gradient cường độ trung bình của các vùng","Cực đại hóa độ tương phản màu của các đối tượng","Áp dụng các phép toán hình thái học (morphological operations) lên ảnh trung vị"]},"b-171":{"q":"Kỹ thuật kéo giãn độ tương phản (contrast stretching) trong xử lý ảnh nhằm mục đích gì?","options":["Nén dải giá trị cường độ của ảnh","Giảm độ sáng tổng thể của ảnh","Kéo giãn dải giá trị cường độ để sử dụng tối ưu","Chuyển ảnh màu thành ảnh xám"]},"b-172":{"q":"Bộ lọc Gaussian (Gaussian filter) đóng vai trò gì trong phát hiện biên Laplacian của Gaussian (Laplacian of Gaussian - LoG)?","options":["Làm mờ ảnh và giảm nhiễu","Tăng cường độ tương phản của ảnh","Tính gradient của ảnh","Thực hiện triệt tiêu phi cực đại (non-maximum suppression)."]},"b-173":{"q":"Kỹ thuật chính mà mean shift dùng để xác định hiệu quả các đỉnh trong phân bố dữ liệu nhiều chiều là gì?","options":["Lấy mẫu ngẫu nhiên các điểm ảnh trong một khoảng","Giảm gradient (gradient descent) của các điểm ảnh trong một cụm","Trung bình của các điểm ảnh trong một cụm","Trung bình của các điểm ảnh trong một khoảng"]},"b-174":{"q":"Xử lý ảnh (image processing) nói chung tập trung vào việc đạt được điều gì?","options":["Tạo thông tin văn bản từ ảnh","Trích xuất thông tin hữu ích và nâng cao chất lượng ảnh","Chuyển ảnh thành tín hiệu âm thanh","Tạo biểu diễn ba chiều của ảnh"]},"b-175":{"q":"Hạn chế của thuật toán phát triển vùng (region growing) trong phân đoạn ảnh là gì?","options":["Khó xử lý các đối tượng có các phần rời rạc.","Không thể phân đoạn ảnh có nhiều màu chủ đạo.","Rất nhạy với nhiễu và các biến thiên cường độ nhỏ.","Chi phí tính toán đáng kể khi xử lý ảnh lớn."]},"b-176":{"q":"Mục tiêu của biến đổi Hough (Hough Transform) khi áp dụng để xác định các đối tượng thuộc một lớp hình dạng nhất định là gì?","options":["Tạo ảnh độ phân giải cao","Thực hiện phân đoạn ở mức điểm ảnh","Thực hiện thủ tục bỏ phiếu (voting) để nhận dạng hình dạng","Tăng độ bão hòa màu của ảnh"]},"b-177":{"q":"Mục tiêu chính của phát hiện đối tượng (object detection) trong xử lý ảnh và video là gì?","options":["Nhận dạng đối tượng mà không xác định vị trí của chúng","Xác định và định vị các thể hiện của đối tượng trong ảnh hoặc video","Mô tả nội dung của ảnh","Phân loại ảnh dựa trên các đặc trưng thị giác"]},"b-178":{"q":"Thuật ngữ \"bình phương tối thiểu\" (least squares) có ý nghĩa gì trong các phương pháp căn chỉnh 2D (2D alignment)?","options":["Nó cực tiểu hóa tổng bình phương khoảng cách giữa các điểm.","Nó cực đại hóa entropy giữa các điểm.","Nó cực đại hóa tổng bình phương sai khác giữa các điểm.","Nó cực tiểu hóa entropy của ảnh sau khi căn chỉnh."]},"b-179":{"q":"Mục đích chính của hiệu chỉnh khối toàn cục (global bundle adjustment) trong xử lý ảnh là gì?","options":["Ước lượng vị trí của các điểm 3D","Hiệu chỉnh thị sai (parallax) trong ảnh","Tối ưu hóa tư thế camera","Căn chỉnh hai ảnh"]},"b-180":{"q":"Đây là phép biến đổi nào nếu ma trận biến đổi như sau?\nT = [[2, 0, 1], [0, 2, 2], [0, 0, 1]]","options":["Co giãn 2 lần và tịnh tiến 1 theo trục x, tịnh tiến 2 theo trục y","Co giãn 2 lần và tịnh tiến 2 theo trục x, tịnh tiến 1 theo trục y","Tịnh tiến 2 theo trục x, tịnh tiến 1 theo trục y","Co giãn 2 lần và tịnh tiến 2 theo trục x, giữ nguyên theo trục y"]},"b-181":{"q":"Tần số Nyquist (Nyquist frequency) là gì trong ngữ cảnh biến đổi Fourier (Fourier transform)?","options":["Một nửa tần số lấy mẫu","Tần số cao nhất trong tín hiệu","Tần số mà tại đó tín hiệu trở nên tuần hoàn","Tần số tương ứng với phần ảo của phổ"]},"b-182":{"q":"Dịch chuyển một tín hiệu trong miền thời gian có ảnh hưởng gì đến biến đổi Fourier của nó?","options":["Phổ pha (phase spectrum) bị dịch chuyển.","Phổ biên độ (magnitude spectrum) bị co giãn.","Các thành phần tần số bị suy giảm.","Tần số Nyquist bị thay đổi."]},"b-183":{"q":"Mục tiêu chính của căn chỉnh dựa trên đặc trưng (feature-based alignment) trong xử lý ảnh là gì?","options":["Nâng cao độ phân giải của một mảng ảnh (image patch)","Loại bỏ nhiễu khỏi ảnh","Ước lượng chuyển động giữa các tập điểm đã được ghép khớp","Điều chỉnh độ sáng của ảnh"]},"b-184":{"q":"Mục đích của số hạng năng lượng nội (internal energy term) trong mô hình Snake (Snake Model) là gì?","options":["Phạt các biến dạng lớn của đường viền","Hút đường viền về phía biên của đối tượng","Thực hiện triệt tiêu phi cực đại (non-maximum suppression)","Điều chỉnh cường độ của các điểm ảnh biên"]},"b-185":{"q":"Thị sai (parallax) là gì trong ngữ cảnh tạo ảnh?","options":["Sự dịch chuyển vị trí của các vật thể khi thay đổi điểm nhìn","Sự méo ảnh do khuyết điểm của ống kính","Quang sai màu (chromatic aberration) trong ảnh","Hiệu ứng nhòe do chuyển động trong lúc chụp ảnh"]},"b-186":{"q":"Ý tưởng chính của thuật toán RANSAC cho căn chỉnh 2D (2D alignment) là gì?","options":["Ước lượng lặp một mô hình từ một tập con các điểm nội (inliers)","Cực tiểu hóa tổng bình phương sai khác","Cực đại hóa thông tin tương hỗ (mutual information) giữa các ảnh","Dùng ước lượng mật độ nhân (kernel density estimation) để ghép khớp đặc trưng"]},"b-187":{"q":"Các phép biến đổi hình học (geometric transformations) được dùng để làm gì trong thực tế?","options":["Căn chỉnh nhiều ảnh được chụp ở các thời điểm khác nhau.","Hiệu chỉnh ảnh để tránh méo do ống kính.","Điều chỉnh ảnh theo hướng của camera.","Tất cả các đáp án còn lại"]},"b-188":{"q":"Nhược điểm chính của việc dùng bộ lọc trung bình (mean filter) để giảm nhiễu là gì?","options":["Nó có xu hướng làm mờ biên và các chi tiết nhỏ.","Chi phí tính toán cao.","Nó chỉ hoạt động tốt với ảnh xám.","Nó khuếch đại nhiễu trong ảnh."]},"b-189":{"q":"Đặc điểm chính của bộ lọc thông dải (band-pass filter) là gì?","options":["Nó cho phép một dải tần số cụ thể đi qua.","Nó chỉ cho phép các tần số thấp đi qua.","Nó cho phép mọi tần số đi qua.","Nó chặn hoàn toàn mọi tần số."]},"b-190":{"q":"Mục đích của khẩu độ (aperture) trong ống kính máy ảnh kỹ thuật số là gì?","options":["Kiểm soát lượng ánh sáng đi vào máy ảnh","Tăng độ sâu trường ảnh (depth of field)","Điều chỉnh độ sắc nét của ảnh","Xác định nhiệt độ màu","Không có đáp án nào trong số còn lại"]},"b-191":{"q":"Bước đầu tiên khi lấy mẫu lại (resampling) một ảnh từ ảnh MIP (MIP-image) là gì?","options":["Áp dụng bộ lọc chất lượng cao","Tính logarit cơ số 2 của ảnh","Ước lượng giá trị vô hướng của tốc độ lấy mẫu lại","Sử dụng mức kim tự tháp (pyramid level) phân số"]},"b-192":{"q":"Hai manh mối (cues) nào được thuật toán hợp nhất xác suất (probabilistic merging algorithm) sử dụng để quyết định việc hợp nhất vùng?","options":["Mức bão hòa và độ tương đồng về độ sáng","Phát hiện biên và độ tương đồng về độ tương phản","Độ tương đồng về mức xám và độ tương đồng về kết cấu (texture)","Sai khác sắc độ (hue) và nhận dạng mẫu"]},"b-193":{"q":"Đầu vào và đầu ra của xử lý ảnh là gì?","options":["tín hiệu và ảnh","chỉ tín hiệu","chỉ ảnh","tùy thuộc vào đầu vào"]},"b-194":{"q":"Các lĩnh vực nào liên quan đến thị giác máy tính (computer vision)?","options":["Xử lý ảnh, các thuật toán đồ họa, Khoa học nhận thức.","Robot học, Sinh học thần kinh, Truy hồi thông tin","Tất cả các đáp án còn lại","Không đáp án nào trong số còn lại"]},"b-195":{"q":"RANSAC là viết tắt của cụm từ nào trong thị giác máy tính?","options":["Random Sample Consensus","Random Assignment for Numerical Stability in Alignment and Classification","Robust Analysis for Noisy and Scattered Alignment of Components","Recursive Alignment and Sampling for Numerical Convergence"]},"b-196":{"q":"\"Đồng thuận\" (consensus) trong RANSAC đề cập đến điều gì?","options":["Đa số các điểm nội (inliers) trong tập dữ liệu","Giá trị trung bình của các điểm dữ liệu","Độ lệch của mô hình so với dữ liệu","Tổng số vòng lặp đã thực hiện"]},"b-197":{"q":"Các thành phần của một điểm ảnh (pixel) bao gồm những gì?","options":["Giá trị cường độ và kích thước của ảnh","Địa chỉ vị trí và giá trị cường độ","Địa chỉ vị trí và kích thước của ảnh","Tất cả các đáp án còn lại"]},"b-198":{"q":"Đặc trưng của phản xạ gương (mirror-like reflection) là gì?","options":["Ánh sáng ra bị tán xạ theo nhiều hướng","Ánh sáng ra tuân theo mô hình chiếu tuyến tính","Ánh sáng ra phản xạ khỏi bề mặt theo một hướng duy nhất","Ánh sáng ra quay quanh pháp tuyến bề mặt một góc 90 độ"]},"b-199":{"q":"Số hạng năng lượng ngoại (external energy term) đóng vai trò gì trong mô hình Snake (Snake Model)?","options":["Nó hút đường viền về phía biên của đối tượng.","Nó áp đặt độ trơn của đường viền của snake.","Nó điều chỉnh cường độ của các điểm ảnh biên của đối tượng.","Nó phạt các sai lệch so với đường thẳng."]},"b-200":{"q":"Nhược điểm nào sau đây là của mô hình Snake (Snake model)?","options":["Nhạy với các trạng thái cực tiểu cục bộ (local minima)","Không hoạt động hoàn hảo ngay cả với ảnh nhị phân","dependent","Tất cả các đáp án trên"]},"b-201":{"q":"Thuật toán nào sau đây được dùng để phát hiện đặc trưng (feature detection)?","options":["Biến đổi đặc trưng bất biến theo tỉ lệ (Scale-Invariant Feature Transform - SIFT)","Bộ phát hiện góc Harris (Harris Corner Detector)","Features from Accelerated Segment Test (FAST)","Tất cả các đáp án còn lại"]},"b-202":{"q":"Lọc dị hướng (anisotropic filtering) ảnh hưởng như thế nào đến các kết cấu (texture) được nhìn ở góc xiên?","options":["Nó làm sắc nét các chi tiết của kết cấu.","Nó làm mờ các chi tiết của kết cấu.","Nó gây ra các biến dạng.","Nó không ảnh hưởng đến các góc nhìn xiên."]},"b-203":{"q":"SIFT xử lý phép quay như thế nào khi ghép khớp điểm khoá (keypoint matching)?","options":["Bằng cách căn chỉnh các điểm khoá dựa trên hướng chủ đạo","Bằng cách xoay toàn bộ ảnh về một hướng chuẩn","Bằng cách dùng một hướng cố định cho mọi điểm khoá","Bằng cách loại bỏ các điểm khoá có hướng khác nhau"]},"b-204":{"q":"Lọc dị hướng (anisotropic filtering) cải thiện chất lượng ảnh của các kết cấu trên bề mặt trong đồ họa máy tính như thế nào?","options":["Bằng cách tăng độ mờ để kết cấu mịn hơn","Bằng cách loại bỏ hiệu ứng răng cưa (aliasing) ở các góc nhìn cực đoan","Bằng cách giảm chi tiết để đạt hiệu năng tốt hơn","Bằng cách chỉ tăng cường kết cấu ở các góc nhìn vuông góc"]},"b-205":{"q":"Tốc độ lấy mẫu (sampling rate) ảnh hưởng như thế nào đến việc biểu diễn các tần số trong biến đổi Fourier (Fourier transform) của một tín hiệu?","options":["Tốc độ lấy mẫu cao hơn làm tăng độ chính xác tần số.","Tốc độ lấy mẫu thấp hơn làm tăng độ chính xác tần số.","Nó không ảnh hưởng đến việc biểu diễn tần số.","Tốc độ lấy mẫu cao hơn làm giảm độ chính xác tần số."]},"b-206":{"q":"Tính chất bất biến theo tỉ lệ (scale-invariance) mang lại lợi ích gì cho các thuật toán phát hiện và ghép khớp đặc trưng?","options":["Nó cho phép phát hiện đặc trưng bất kể kích thước của chúng.","Nó giảm độ phức tạp tính toán của việc ghép khớp đặc trưng.","Nó nâng cao độ phân giải tổng thể của ảnh.","Nó cải thiện tính nhất quán màu sắc giữa các ảnh."]},"b-207":{"q":"SIFT đạt được tính bất biến theo tỉ lệ (scale invariance) trong phát hiện đặc trưng bằng cách nào?","options":["Bằng cách thu nhỏ ảnh ở các độ phân giải khác nhau","Bằng cách dùng kích thước cửa sổ thích nghi để phát hiện đặc trưng","Bằng cách áp dụng bộ lọc Gaussian lên toàn bộ ảnh","Bằng cách chuẩn hóa cường độ điểm ảnh trên toàn ảnh"]},"b-208":{"q":"Căn chỉnh dựa trên đặc trưng (feature-based alignment) thực hiện căn chỉnh giữa hai ảnh bằng cách nào?","options":["Bằng cách so sánh trực tiếp giá trị điểm ảnh giữa các ảnh","Bằng cách phát hiện và ghép khớp một tập đặc trưng thưa (sparse)","Bằng cách áp dụng các phép biến đổi ngẫu nhiên lên các ảnh","Bằng cách phân đoạn các ảnh thành các vùng"]},"b-209":{"q":"Các mốc khuôn mặt (facial landmarks) hữu ích như thế nào trong phát hiện và nhận dạng khuôn mặt?","options":["Bằng cách cung cấp các điểm neo để căn chỉnh khuôn mặt chính xác.","Bằng cách trực tiếp xác định các đặc điểm khuôn mặt riêng biệt của một người.","Bằng cách tách vùng khuôn mặt khỏi nền.","Bằng cách ước lượng tuổi và giới tính của người trong ảnh."]},"b-210":{"q":"Khi phát hiện đường thẳng bằng biến đổi Hough (Hough Transform), sau bước bỏ phiếu (voting), các đường thẳng trong ảnh được phát hiện như thế nào?","options":["Tất cả các ô (bin) có số phiếu khác không đều được coi là đường thẳng.","Các đường thẳng được tạo bằng cách nối mọi điểm biên đã tham gia vào một ô cụ thể.","Các đường thẳng được xác định bằng cách tìm các đỉnh (số phiếu cao nhất) trong không gian tham số.","Biến đổi Hough trực tiếp xuất ra các đoạn thẳng dựa trên quá trình bỏ phiếu."]},"b-211":{"q":"Khi ngăn chặn hiệu ứng răng cưa (aliasing), cần thêm bước nào trước khi áp dụng phép biến đổi cắt xiên (shearing) trong xử lý ảnh?","options":["Giảm mẫu (downsampling) theo cả hai hướng","Áp dụng nhân lọc (filter kernel) không tách được","Điều chỉnh phép biến đổi không gian màu","Tăng mẫu (upsampling) theo hướng ngược lại"]},"b-212":{"q":"Tại sao cần lọc trước (pre-filtering) để ngăn chặn hiệu ứng răng cưa (aliasing) trong đồ họa máy tính?","options":["Để nâng cao độ phân giải ảnh","Để giảm chi phí tính toán","Để giảm thiểu biến dạng khi ánh xạ kết cấu (texture mapping)","Để duy trì tốc độ lấy mẫu lại nhất quán"]},"b-213":{"q":"Các kỹ thuật phát hiện biên (edge detection) trong phân đoạn nhằm mục đích xác định:","options":["Các vùng có màu hoặc cường độ đồng nhất.","Ranh giới giữa các vùng ảnh khác biệt.","Các khu vực có kết cấu cao và biến thiên cục bộ.","Sự hiện diện của các đối tượng hoặc hình dạng cụ thể trong ảnh."]},"b-214":{"q":"Đây là chuyển động của các đối tượng giữa các khung hình liên tiếp của chuỗi, gây ra bởi chuyển động tương đối giữa đối tượng và camera. Tên chính xác của quá trình này là gì?","options":["What is the exact name of this process?","Ghép ảnh (Image stitching)","Luồng quang học (Optical flow)","Đối tượng chuyển động (Object moving)"]},"b-215":{"q":"Trong ngữ cảnh biến dạng dựa trên lưới (mesh-based warping), \"lưới\" (mesh) là gì?","options":["Một tập hợp các đỉnh và cạnh","Một hiệu ứng méo hình ảnh","Một ma trận 2D của cường độ điểm ảnh","Một loại bản đồ kết cấu (texture map) có kích thước 2D"]},"b-216":{"q":"Trong bộ phát hiện góc Harris (Harris corner detector), sau khi tính điểm số R để xác định một cửa sổ có chứa góc hay không, khi nào cửa sổ chứa một góc?","options":["|R| nhỏ và λ1, λ2 đều nhỏ","|R| lớn và λ1 ≈ λ2","|R| < 0 và λ1 >> λ2","không thể xác định |R|"]},"b-217":{"q":"Trong K-means dùng cho phân đoạn (Segmentation), giá trị K có ý nghĩa gì?","options":["Nó biểu diễn số lượng cụm (clusters).","Nó biểu diễn số lượng ảnh.","Nó biểu diễn bước của các cụm.","Nó biểu diễn các nhóm màu."]},"b-218":{"q":"Trong phân đoạn ảnh, đâu là hạn chế của việc dùng các phương pháp phát triển vùng (region growing)?","options":["Khó xử lý các đối tượng có các phần rời rạc.","Không thể phân đoạn ảnh có nhiều màu chủ đạo.","Rất nhạy với nhiễu và các biến thiên cường độ nhỏ.","Chi phí tính toán đáng kể khi xử lý ảnh lớn."]},"b-219":{"q":"Toán tử điểm ảnh (pixel operator) là một hàm dùng để xử lý các điểm ảnh. Đầu vào và đầu ra của toán tử điểm ảnh là gì? Chọn đáp án đúng nhất.","options":["Đầu vào là một ảnh và đầu ra là một ảnh.","Đầu vào là một ảnh và đầu ra là các ảnh.","Đầu vào là một hoặc nhiều ảnh và đầu ra là các ảnh.","Đầu vào là một hoặc nhiều ảnh và đầu ra là một ảnh."]},"b-220":{"q":"Phát hiện đường thẳng dựa trên tích chập (convolution-based line detection) đóng góp như thế nào cho lĩnh vực xe tự hành và robot?","options":["Bằng cách xác định ranh giới làn đường.","Bằng cách nâng cao độ phân giải ảnh.","Bằng cách tính cường độ điểm ảnh.","Bằng cách áp dụng bộ lọc trung vị (median filter) để giảm nhiễu."]},"b-221":{"q":"Một số hệ thống nhận dạng khuôn mặt truyền thống yêu cầu người dùng đăng ký (enrollment), bao gồm:","options":["Hiệu chuẩn camera cho điều kiện ánh sáng tối ưu.","Chụp nhiều ảnh khuôn mặt của một cá nhân từ các góc khác nhau.","Huấn luyện thuật toán nhận dạng trên một tập dữ liệu khuôn mặt lớn.","Chỉ định các mốc khuôn mặt (facial landmarks) cho từng cá nhân đã đăng ký."]},"b-222":{"q":"Hệ quả của định lý Parseval (Parseval's theorem) trong ngữ cảnh biến đổi Fourier (Fourier transform) là gì?","options":["Nó liên hệ năng lượng trong miền thời gian và miền tần số.","Nó đảm bảo biến đổi Fourier là khả nghịch.","Nó thiết lập mối liên hệ giữa biên độ và tần số.","Nó đảm bảo biến đổi Fourier luôn nhận giá trị thực."]},"b-223":{"q":"Điều nào KHÔNG phải là ưu điểm của toán tử Canny (Canny Operator)?","options":["Nó có khả năng định vị tốt.","Nó trích xuất đặc trưng ảnh mà không làm thay đổi các đặc trưng.","Ít nhạy với nhiễu hơn.","Điểm cắt không (zero crossing) thực sự."]},"b-224":{"q":"Toán tử Prewitt khác toán tử Sobel như thế nào trong phát hiện biên?","options":["Nó dùng nhân (kernel) khác.","Nó dùng nhân tích chập 3×3.","Nó ít nhạy hơn với các biên chéo.","Nó không liên quan đến tích chập với nhân."]},"b-225":{"q":"Mục tiêu chính của căn chỉnh toàn cục (global alignment) trong đăng ký ảnh (image registration) là gì?","options":["Giảm thiểu biến dạng bên trong từng ảnh.","Giảm thiểu số lượng đặc trưng được ghép khớp giữa các ảnh.","Tìm một tập tham số căn chỉnh nhất quán trên toàn cục.","Tập trung vào các chi tiết toàn cục trong ảnh."]},"b-226":{"q":"Các phần tử được chọn cho các ô (bin) của histogram trong tính toán HOG như thế nào?","options":["Được gán ngẫu nhiên dựa trên giá trị điểm ảnh","Dựa trên độ sáng của điểm ảnh","Dựa trên hướng của gradient","Dựa trên kích thước của các đối tượng trong ảnh"]},"b-227":{"q":"Mục đích chính của việc áp dụng bộ lọc Gaussian (Gaussian filter) trong thuật toán phát hiện biên Canny là gì?","options":["Làm sắc nét ảnh và tăng cường các chi tiết tần số cao.","Giảm nhiễu trong ảnh, ngăn nhiễu ảnh hưởng đến quá trình phát hiện biên.","Tăng độ tương phản tổng thể của ảnh để hiển thị biên tốt hơn.","Loại bỏ các đối tượng hoặc vùng quan tâm khỏi ảnh trước khi phát hiện biên."]},"b-228":{"q":"Cơ chế của Laplacian của Gaussian (Laplacian of Gaussian) là gì?","options":["Toán tử dựa trên Gaussian dựa vào các chuyển tiếp mức ngẫu nhiên trong ảnh","Toán tử dựa trên Gaussian dùng Laplacian để tính đạo hàm bậc nhất của ảnh","Toán tử dựa trên Gaussian dùng phương pháp điểm cắt không (zero-crossing) dựa trên đạo hàm bậc nhất","Toán tử dựa trên Gaussian dùng Laplacian để tính đạo hàm bậc hai của ảnh, phát hiện biên tại các điểm cắt không (zero crossings)"]},"b-229":{"q":"Điều nào đúng về căn chỉnh toàn cục (global alignment)?","options":["Nó tìm các tham số đăng ký ảnh tuân thủ tốt nhất các ràng buộc do việc ghép khớp ảnh đưa ra","Nó tìm một tập tham số căn chỉnh không nhất quán trên toàn cục nhằm cực tiểu hóa sai lệch đăng ký giữa mọi cặp ảnh","Nó tìm các tham số đăng ký ảnh tuân thủ phù hợp các ràng buộc do việc ghép khớp ảnh đưa ra","Nó tìm một tập tham số căn chỉnh không nhất quán trên toàn cục nhằm cực đại hóa sai lệch đăng ký giữa mọi cặp ảnh"]},"b-230":{"q":"Thị giác máy tính (computer vision) là gì?","options":["Thị giác máy tính dùng ảnh và video để hiểu một cảnh trong thế giới thực.","Giống như con người dùng mắt để thu nhận ánh sáng, các thụ thể trong não để tiếp nhận nó, và vỏ não thị giác để xử lý nó.","Nó giúp máy tính hiểu ảnh, video.","Tất cả các đáp án"]},"b-231":{"q":"Thị giác máy tính (computer vision) là gì?","options":["Thị giác máy tính là một lĩnh vực của khoa học máy tính giúp máy tính hiểu giống như con người.","Thị giác máy tính là việc phân tích và thao tác một ảnh số hóa, đặc biệt nhằm cải thiện chất lượng của nó.","Thị giác máy tính là ngành nghiên cứu về máy tính và các hệ thống tính toán giống như các kỹ sư điện và máy tính.","Thị giác máy tính là một tác vụ được định nghĩa là phân tích kỹ thuật một ảnh bằng các thuật toán phức tạp."]},"b-232":{"q":"Lợi ích của việc dùng các kỹ thuật căn chỉnh dựa trên đặc trưng (feature-based alignment) là gì?","options":["Nó giảm đáng kể kích thước tệp của ảnh.","Nó tự động điều chỉnh độ sáng và độ tương phản của ảnh để nhất quán.","Nó cho phép căn chỉnh bền vững ngay cả khi ảnh có các biến thể như xoay hoặc thay đổi tỉ lệ.","Nó đơn giản hóa các tác vụ chỉnh sửa ảnh bằng cách tự động cắt các vùng không cần thiết."]},"b-233":{"q":"Bộ lọc ảnh (image filter) là gì? Chọn đáp án đúng nhất","options":["Lọc là một kỹ thuật để chỉnh sửa hoặc nâng cao chất lượng ảnh.","Bộ lọc chỉ là các hệ thống tạo ra một ảnh mới, và tốt nhất là được cải thiện, từ sự kết hợp các giá trị điểm ảnh của ảnh gốc.","Lọc là một phép toán lân cận (neighborhood operation), trong đó giá trị của một điểm ảnh bất kỳ trong ảnh đầu ra được xác định bằng cách áp dụng một thuật toán nào đó lên các giá trị điểm ảnh trong vùng lân cận của điểm ảnh đầu vào tương ứng.","Tất cả các đáp án còn lại"]},"b-234":{"q":"Sự khác biệt giữa mô hình nguồn sáng Phong (Phong model) và thực tế là gì?","options":["Phong giả định nguồn sáng vô hạn, trong khi thực tế có bóng đổ và phản xạ qua lại (inter-reflections)","Phong chỉ giả định ánh sáng khuếch tán, trong khi thực tế các nguồn sáng rời rạc tạo ra bóng đổ","Phong giả định nguồn sáng liên tục, trong khi thực tế phản xạ qua lại là không đáng kể","Phong giả định đường truyền ánh sáng trực tiếp, trong khi thực tế các nguồn có thể bị che bóng và có phản xạ qua lại"]},"b-235":{"q":"Hiệu chỉnh khối (bundle adjustment) chủ yếu được dùng để làm gì trong xử lý ảnh?","options":["Thêm ảnh mới vào một ảnh toàn cảnh (panorama)","Điều chỉnh các tham số tư thế của một ảnh để giảm kích thước ảnh","Điều chỉnh đồng thời các tham số tư thế cho một tập lớn các ảnh chồng lấp","Căn chỉnh các ảnh theo cách tuần tự"]},"b-236":{"q":"Khái niệm cốt lõi đằng sau biến đổi Hough (Hough Transform) là gì?","options":["Nó biến đổi các điểm biên trong không gian ảnh sang không gian tham số để xác định các đường thẳng.","Nó trực tiếp xác định các đường thẳng trong ảnh dựa trên sự thay đổi cường độ điểm ảnh.","Nó phân đoạn ảnh thành các vùng liên thông để tạo thành các đoạn thẳng.","Nó yêu cầu chỉ định thủ công điểm đầu và điểm cuối của các đường thẳng cần phát hiện."]},"b-237":{"q":"Ưu điểm chính của thuật toán Canny so với các phương pháp phát hiện biên đơn giản hơn là gì?","options":["Nó tính toán nhanh hơn đáng kể và cần rất ít sức mạnh xử lý.","Nó rất nhạy với nhiễu và dễ bỏ sót các biên quan trọng.","Nó kết hợp nhiều bước để phát hiện biên bền vững, bao gồm giảm nhiễu, tính gradient và triệt tiêu phi cực đại (non-maximum suppression).","Nó có thể trực tiếp xác định màu cụ thể của các biên trong ảnh."]},"b-238":{"q":"Điều nào đúng về bộ lọc trung bình có trọng số elip (Elliptical Weighted Average - EWA)?","options":["Nó dựa trên tính toán một điểm ảnh đơn","Ánh xạ affine đưa vào một hệ tọa độ hai chiều bị xiên theo khoảng cách của mỗi điểm ảnh nguồn x","Phép chiếu ellipsoid của một lưới điểm ảnh nhỏ trong điểm ảnh nguồn lên điểm ảnh đích được tính toán","Sử dụng lọc Gaussian có ma trận hiệp phương sai nghịch đảo là ellipsoid này"]},"b-239":{"q":"Điều nào đúng về phân đoạn ảnh (image segmentation)?","options":["Một ảnh được chia thành nhiều vùng dựa trên đặc tính của các điểm ảnh để xác định các đối tượng","Biểu diễn của một ảnh được chuyển thành một dạng chứa thông tin phức tạp hơn để phân tích","Màu sắc được gán cho mọi điểm ảnh của một ảnh","Hoàn toàn không đúng"]},"b-240":{"q":"Phân đoạn ảnh (image segmentation) trong xử lý ảnh có nghĩa là gì?","options":["Phân đoạn ảnh là việc chia một ảnh thành các vùng hoặc các loại, tương ứng với các đối tượng hoặc các phần của đối tượng khác nhau.","Phân đoạn ảnh là một phương pháp trong đó một ảnh số được chia thành nhiều nhóm con dựa trên màu sắc hoặc vị trí của chúng.","Tất cả các đáp án còn lại","Không đáp án nào trong số còn lại"]},"b-241":{"q":"Sự khác biệt giữa ảnh toàn cảnh hình trụ (cylindrical panoramas) và hình cầu (spherical panoramas) là gì?","options":["Với ảnh toàn cảnh hình cầu, bạn có thể dễ dàng chụp bất kỳ khu vực nào theo mọi hướng.","Ảnh toàn cảnh hình trụ bao phủ toàn bộ 360 độ, trừ góc nhìn lên và xuống.","Ngược lại, ảnh toàn cảnh hình cầu không chỉ chụp tầm nhìn 360 độ mà còn tính đến cả góc nhìn ngang và dọc.","Ảnh toàn cảnh hình trụ là tốt nhất, vì có thể chụp mà không để lộ chân máy hay bóng của người chụp."]},"b-242":{"q":"Phép biến đổi tịnh tiến (translation transformation) là gì?","options":["Chúng ta xoay đối tượng một góc θ (theta) nhất định quanh gốc của nó","Nó di chuyển một đối tượng đến một vị trí khác trên màn hình.","Nó thay đổi kích thước của một đối tượng.","Nó là co giãn, làm xiên và xoay."]},"b-243":{"q":"Cách tiếp cận chính của căn chỉnh dựa trên đặc trưng (feature-based alignment) là gì?","options":["Căn chỉnh 4 góc của hai bức ảnh","Tìm cách khôi phục góc của một ảnh thông qua các phép biến đổi không gian","Chồng các bức ảnh lên nhau và tìm điểm tương đồng giữa chúng","Tìm một vài đặc trưng khớp nhau ở cả hai ảnh rồi tính toán phép căn chỉnh"]},"b-244":{"q":"Nguyên lý cơ bản của phát hiện đối tượng (object detection) là gì?","options":["Phát hiện đối tượng dựa trên các đặc trưng cấu thành nên đối tượng.","Bề mặt của mỗi đối tượng có cấu trúc và hình dạng khác nhau. Do đó phát hiện đối tượng dựa vào sự liên quan về màu sắc","Phát hiện đối tượng dựa trên ngữ nghĩa của các đối tượng trong ảnh.","Tất cả các đáp án còn lại"]},"b-245":{"q":"Sự khác biệt giữa xử lý ảnh (image processing) và thị giác máy tính (computer vision) là gì? Chọn đáp án đúng nhất","options":["Xử lý ảnh và thị giác máy tính là hai khái niệm khác nhau.","Nhiệm vụ của thị giác máy tính là phân tích một ảnh.","Thị giác máy tính có thể được hiểu là các bước làm tăng độ rõ nét của ảnh, thông qua các bước lọc nhiễu.","Xử lý ảnh thực hiện các nhiệm vụ như phân tích xem có những đối tượng nào trong ảnh"]},"b-246":{"q":"Phân đoạn ảnh (image segmentation) trong xử lý ảnh có nghĩa là gì?","options":["Phân đoạn ảnh là việc chia một ảnh thành các vùng hoặc các loại, tương ứng với các đối tượng hoặc các phần của đối tượng khác nhau.","Phân đoạn ảnh là một phương pháp trong đó một ảnh số được chia thành nhiều nhóm con dựa trên màu sắc hoặc vị trí của chúng","Tất cả các đáp án còn lại","Không đáp án nào trong số còn lại"]},"b-247":{"q":"Nguyên lý cơ bản đằng sau căn chỉnh dựa trên đặc trưng (feature-based alignment) là gì?","options":["Nó xác định và ghép khớp các đặc trưng nổi bật (ví dụ: góc, biên) giữa các ảnh để đạt được căn chỉnh.","Nó dựa vào đầu vào thủ công của người dùng để chỉ định các điểm tương ứng giữa các ảnh nhằm căn chỉnh.","Nó trực tiếp ghép khớp và căn chỉnh toàn bộ các vùng ảnh mà không qua xử lý nào.","Nó căn chỉnh các ảnh dựa trên phân bố độ sáng và màu sắc tổng thể của chúng."]},"b-248":{"q":"Hai phương pháp truyền thống được đề xuất để mô hình hóa hiệu ứng ánh sáng dựa trên đặc tính bề mặt là gì?","options":["Dò tia (Ray tracing) cho bề mặt mờ (matte) và xạ hình (radiosity) cho bề mặt phản xạ gương (specular)","Dò tia (Ray tracing) cho các bề mặt chủ yếu phản xạ gương và xạ hình (radiosity) cho các bề mặt chủ yếu mờ","Xạ hình (Radiosity) cho cả bề mặt mờ và bề mặt phản xạ gương","Dò tia (Ray tracing) cho cả bề mặt mờ và bề mặt phản xạ gương"]},"b-249":{"q":"Sự khác biệt giữa tương quan (correlation) và tích chập (convolution) là gì?","options":["Tích chập là phép đo tổng nhiễu của một ảnh lên ảnh khác.","Phép tính toán học của tương quan khác với tích chập trong miền thời gian","Nếu bộ lọc bất đối xứng thì đầu ra của cả hai biểu thức sẽ giống nhau.","Tương quan là phép đo độ tương đồng giữa hai ảnh."]},"b-250":{"q":"Quá trình nối biên (edge linking) đóng vai trò gì trong xử lý ảnh sau khi phát hiện biên?","options":["Nó đưa sự hỗn loạn vào các điểm ảnh biên đã phát hiện.","Nó sắp xếp lại ngẫu nhiên thứ tự của các điểm ảnh biên.","Nó tổ chức một tập điểm ảnh biên không có thứ tự thành một danh sách biên có thứ tự.","Nó loại bỏ thông tin biên bằng cách phá vỡ các kết nối giữa các điểm ảnh lân cận."]},"b-251":{"q":"Tính chất nào của biến đổi Fourier (Fourier transform) khiến nó đặc biệt hữu ích cho các tác vụ xử lý ảnh như giảm nhiễu hoặc phát hiện biên?","options":["Nó cho thấy sự phân bố không gian của độ sáng trong ảnh.","Nó phân rã một ảnh thành các thành phần tần số hình sin cấu thành.","Nó làm tăng độ phân giải của ảnh.","Nó trực tiếp loại bỏ các điểm ảnh nhiễu khỏi ảnh"]},"b-252":{"q":"Điều gì xảy ra trong mô hình thấu kính mỏng (thin lens model)?","options":["Vật bị đảo ngược.","Ảnh bị đổi màu.","Các vật đặt trước hoặc sau thấu kính cho kết quả như nhau.","Ảnh sẽ giữ nguyên kích thước khi dùng ánh sáng trắng làm nguồn (mặt trời)."]},"b-253":{"q":"Điều nào sau đây mô tả một đặc tính mong muốn của các đặc trưng dùng trong căn chỉnh?","options":["Chúng nên dễ bị ảnh hưởng bởi thay đổi ánh sáng.","Chúng nên nổi bật và dễ nhận biết ở cả hai ảnh.","Chúng nên được phân bố đều trên toàn bộ ảnh.","Chúng nên lớn và chiếm một phần đáng kể của ảnh."]},"b-254":{"q":"Phát biểu nào sau đây là KHÔNG đúng về nhận dạng khuôn mặt theo các phương pháp truyền thống?","options":["Nó thường yêu cầu các bước tiền xử lý như chuẩn hóa và căn chỉnh.","Nó thường liên quan đến việc trích xuất các đặc trưng khuôn mặt như eigenfaces hoặc Fisherfaces.","Nó có thể đạt độ chính xác cao trong môi trường được kiểm soát với ánh sáng tốt.","Nó có thể dễ dàng nhận dạng các cá nhân dù có sự biến đổi lớn về tư thế và biểu cảm."]},"b-255":{"q":"Phát biểu nào sau đây là KHÔNG đúng về theo dõi đối tượng (object tracking)?","options":["Một cách xác định hoặc xác nhận danh tính của một cá nhân bằng khuôn mặt của họ.","Lấy một tập phát hiện đối tượng ban đầu (chẳng hạn một tập tọa độ hộp giới hạn (bounding box) đầu vào).","Tạo một ID duy nhất cho mỗi phát hiện ban đầu.","Theo dõi từng đối tượng khi chúng di chuyển giữa các khung hình trong video, duy trì việc gán các ID duy nhất."]},"b-256":{"q":"Tình huống nào hưởng lợi nhiều nhất từ phát hiện đường thẳng bằng biến đổi Hough (Hough Transform)?","options":["Phân đoạn và phân tích từng ký tự trong văn bản viết tay.","Xác định và phân loại các loại hoa khác nhau dựa trên màu sắc và kết cấu.","Phát hiện vạch kẻ làn đường trong ảnh cho các ứng dụng xe tự hành.","Các kỹ thuật phát hiện độ mờ và làm sắc nét ảnh dựa trên thông tin biên chính xác."]},"b-257":{"q":"\"Mô hình chiếu sáng\" (Illumination model) được hình thành như thế nào?","options":["Nó đề cập đến nguồn bức xạ điện từ khả kiến","Nó mô tả mô hình chiếu tuyến tính của ánh sáng","Nó phác thảo các đầu vào, giả định và đầu ra để tính màu sắc và độ sáng của bề mặt","Nó tập trung vào khoảng cách lệch trục của các nguồn sáng"]},"b-258":{"q":"Các phép biến đổi điểm ảnh (pixel transforms) được hiểu như thế nào? Chọn đáp án đúng nhất","options":["Đó là các kỹ thuật biến đổi dựa trên xử lý từng điểm ảnh một.","Đó là các kỹ thuật biến đổi dựa trên xử lý từng điểm ảnh theo cụm.","Đó là các kỹ thuật biến đổi dựa trên xử lý từng điểm ảnh theo ảnh.","Đó là các kỹ thuật biến đổi dựa trên xử lý từng cụm theo cụm."]},"b-259":{"q":"Các phương pháp phân ngưỡng (thresholding) được thực hiện như thế nào? Chọn đáp án đúng nhất","options":["Nó thay mỗi điểm ảnh trong ảnh bằng điểm ảnh đen nếu cường độ ảnh nhỏ hơn một hằng số cố định nào đó.","Nó thay mỗi điểm ảnh trong ảnh bằng điểm ảnh trắng nếu cường độ ảnh lớn hơn hằng số đó.","Câu thứ nhất và thứ hai đều đúng","Câu thứ nhất hoặc thứ hai đúng"]},"b-260":{"q":"Tham số tốc độ màn trập (shutter speed) trong máy ảnh kỹ thuật số hoạt động như thế nào?","options":["Điều chỉnh độ khuếch đại và mức đen để công suất ánh sáng tới \"khớp tốt\" với dải của ảnh","Kiểm soát lượng ánh sáng đến cảm biến","Khoảng cách vật lý giữa các ô cảm biến liền kề trên chip tạo ảnh","Kích thước vùng cảm biến hoạt động như một phần của vùng cảm biến khả dụng về mặt lý thuyết"]},"b-261":{"q":"Nhiễu ảnh ảnh hưởng như thế nào đến hiệu năng phát hiện đường thẳng bằng biến đổi Hough (Hough Transform)?","options":["Nhiễu có tác động tối thiểu vì quá trình bỏ phiếu (voting) vốn đã lọc bỏ nhiễu.","Nhiễu có thể làm các điểm biên lệch nhẹ, có khả năng ảnh hưởng đến độ chính xác của các tham số đường thẳng.","Mức nhiễu cao có thể tạo ra các đỉnh giả trong không gian tham số, dẫn đến phát hiện đường thẳng không chính xác.","Biến đổi Hough không phù hợp với ảnh có bất kỳ mức nhiễu nào."]},"b-262":{"q":"Phép tính Haar được thực hiện như thế nào để phát hiện biên?","options":["Bằng cách đo độ sắc nét của giá trị điểm ảnh ở các vùng tối và sáng","Bằng cách tính tỉ số cường độ điểm ảnh ở các vùng tối và sáng","Bằng cách tìm hiệu giữa các giá trị trung bình của điểm ảnh ở các vùng tối và sáng","Bằng cách so sánh các histogram phân bố điểm ảnh ở các vùng tối và sáng"]},"b-263":{"q":"Lọc tuyến tính (linear filtering) khác lọc phi tuyến (non-linear filtering) như thế nào trong xử lý ảnh?","options":["Lọc tuyến tính kết hợp các giá trị pixel không theo trình tự, trong khi lọc phi tuyến tuân theo một dạng tuyến tính.","Trong lọc tuyến tính, giá trị pixel đầu ra là tổ hợp tuyến tính của các giá trị pixel đầu vào, còn lọc phi tuyến sử dụng cơ chế sắp thứ tự.","Lọc phi tuyến chỉ sử dụng mặt nạ không gian (spatial masks) để thực hiện tích chập (convolution), còn lọc tuyến tính dựa vào cơ chế sắp thứ tự pixel.","Lọc tuyến tính và lọc phi tuyến đều sử dụng các mặt nạ không gian thay thế cho nhau để thay đổi giá trị pixel đầu vào."]},"b-264":{"q":"Máy tính hiểu ảnh đầu vào như thế nào?","options":["Máy tính hiểu ảnh như một ma trận pixel.","Máy tính hiểu ảnh như một ma trận đơn màu.","Máy tính đọc ảnh đầu vào như một mảng các giá trị số nguyên được lưu trong ảnh nhị phân (binary image).","Tất cả các phương án còn lại."]},"b-265":{"q":"Kích thước cửa sổ (window size) trong phát hiện đối tượng bằng HOG ảnh hưởng thế nào đến khả năng phát hiện các đối tượng nhỏ?","options":["Cửa sổ lớn hơn có thể bỏ sót hoàn toàn các đối tượng nhỏ nếu chúng nằm ngoài ranh giới cửa sổ.","Cửa sổ nhỏ hơn là lựa chọn lý tưởng cho mọi kích thước đối tượng, kể cả các đối tượng nhỏ.","Kích thước cửa sổ không ảnh hưởng đến việc phát hiện đối tượng ở bất kỳ kích thước nào.","Cửa sổ lớn hơn giúp tăng độ chính xác phát hiện các đối tượng nhỏ."]},"b-266":{"q":"Có thể tính tích chập (convolution) bằng phép tương quan (correlation) như thế nào?","options":["Không có sự khác biệt; convolution và correlation cho cùng kết quả.","Xoay kernel 180 độ quanh tâm của nó trước khi thực hiện correlation.","Có thể dùng trực tiếp kết quả correlation mà không cần thay đổi gì.","Chia kết quả correlation cho một hệ số không đổi."]},"b-267":{"q":"Có thể tính tích chập (convolution) bằng phép tương quan (correlation) như thế nào?","options":["Không có sự khác biệt; convolution và correlation cho cùng kết quả.","Xoay kernel 180 độ quanh tâm của nó trước khi thực hiện correlation.","Có thể dùng trực tiếp kết quả correlation mà không cần thay đổi gì.","Chia kết quả correlation cho một hệ số không đổi."]},"b-268":{"q":"Tính giá trị cường độ (intensity) của pixel trong không gian màu (color space) như thế nào?","options":["Đó là trung bình của các giá trị màu.","Giá trị này được biểu diễn bằng ba giá trị màu: Red, Green và Blue.","Thành phần màu có giá trị lớn nhất được dùng để biểu diễn giá trị cường độ.","Đó là sự kết hợp các màu trong không gian màu."]},"b-269":{"q":"Bạn hiểu phát hiện đối tượng (object detection) như thế nào?","options":["Object detection chỉ là nhận ra đối tượng có màu khác trong ảnh.","Object detection là nhiệm vụ phát hiện các đối tượng thuộc một lớp nhất định trong ảnh.","Object detection cho phép phân loại và định vị các đối tượng trong ảnh hoặc video.","Tất cả các phương án còn lại."]},"b-270":{"q":"Các phương pháp phân ngưỡng (thresholding) xử lý pixel trong ảnh dựa trên cường độ như thế nào?","options":["Gán ngẫu nhiên màu đen hoặc trắng cho từng pixel trong ảnh.","Thay pixel bằng pixel màu đen nếu cường độ lớn hơn một hằng số cố định.","Thay pixel bằng pixel màu trắng nếu cường độ nhỏ hơn một hằng số cố định.","Đảo màu tất cả các pixel trong ảnh."]},"b-271":{"q":"Tại sao dùng đặc trưng ảnh (image features) để xử lý thay vì dùng toàn bộ ảnh?","options":["Trong bức ảnh, ta chỉ quan tâm đến màu sắc cũng như kích thước của ảnh.","Dùng features để có thể áp dụng các kỹ thuật nâng cao hơn về sau, như deep learning.","Cách này giảm lượng tài nguyên cần thiết để mô tả một tập dữ liệu lớn.","Tất cả các phương án còn lại."]},"b-272":{"q":"Khi tự thiết kế nhân (kernel) để phát hiện biên, điều quan trọng cần cân nhắc khi chọn các trọng số trong nhân là gì?","options":["Gán trọng số cao nhất cho điểm ảnh trung tâm đảm bảo tính gradient chính xác nhất.","Các trọng số nên được chọn để nhấn mạnh loại biên bạn muốn phát hiện (ví dụ: trọng số mạnh hơn cho biên sắc nét hơn).","Tất cả trọng số trong nhân phải âm để phát hiện biên hiệu quả.","Dùng phân bố ngẫu nhiên các trọng số thường cho kết quả phát hiện biên tốt hơn."]},"b-273":{"q":"So với các mô hình phân đoạn ngữ nghĩa (semantic segmentation), các mô hình phân đoạn thể hiện (instance segmentation) nhìn chung","options":["Phức tạp hơn và cần thêm dữ liệu huấn luyện để phân biệt từng đối tượng riêng lẻ.","Ít phức tạp hơn và cần ít dữ liệu huấn luyện hơn.","Phức tạp ngang nhau với yêu cầu dữ liệu huấn luyện tương tự.","Đơn giản hơn nhưng cần ảnh có độ phân giải rất cao để có kết quả chính xác."]},"b-274":{"q":"Phát hiện tế bào ung thư càng nhanh càng tốt có thể cứu sống hàng triệu người. Phát hiện đối tượng (object detection) sẽ không hữu ích lắm ở đây. Vậy tại sao phân đoạn ảnh (image segmentation) lại rất hữu ích trong lĩnh vực này?","options":["Chúng ta sẽ tạo ra các hộp giới hạn (bounding box) không giúp xác định hình dạng của tế bào.","Xử lý phân đoạn nhanh hơn nhiều lần so với phát hiện đối tượng, do đó giúp ngăn chặn nhanh các tế bào ung thư.","Hình dạng của tế bào ung thư đóng vai trò quan trọng trong việc xác định mức độ nghiêm trọng của ung thư.","Tất cả các đáp án còn lại."]},"b-275":{"q":"Phát hiện biên (edge detection) là một kỹ thuật được sử dụng rộng rãi trong xử lý ảnh cũng như thị giác máy tính. Nó giảm lượng dữ liệu trong ảnh và bảo toàn các tính chất cấu trúc của ảnh. Vậy bạn hiểu gì về phát hiện biên?","options":["Phát hiện biên là phương pháp phân đoạn một ảnh thành các vùng liên tục.","Phát hiện biên cho phép người dùng quan sát các đặc trưng của ảnh dựa trên sự thay đổi đáng kể của mức xám.","Phát hiện biên có thể được định nghĩa là một tập các điểm ảnh liên thông tạo thành ranh giới giữa hai vùng rời nhau","Tất cả các đáp án còn lại"]},"b-276":{"q":"Eigenfaces, được dùng trong một số thuật toán nhận dạng khuôn mặt, biểu diễn:","options":["Các đặc trưng khuôn mặt trung bình từ một tập dữ liệu huấn luyện.","Các đặc điểm khuôn mặt nổi bật nhất giữa các cá nhân khác nhau.","Các mẫu (template) cho các biểu cảm khuôn mặt cụ thể (ví dụ: cười, cau mày).","Một mô hình 3D của khuôn mặt để nhận dạng độ phân giải cao."]},"b-277":{"q":"Eigenfaces, được dùng trong một số thuật toán nhận dạng khuôn mặt (face recognition), biểu diễn điều gì?","options":["Các đặc trưng khuôn mặt trung bình từ một tập dữ liệu huấn luyện.","Các đặc trưng khuôn mặt có tính phân biệt nhất giữa các cá nhân khác nhau.","Các mẫu biểu cảm khuôn mặt cụ thể, ví dụ cười hoặc cau mày.","Một mô hình 3D của khuôn mặt dùng để nhận dạng ở độ phân giải cao."]},"b-278":{"q":"Biến đổi Hough (Hough transform) được dùng để nhận dạng các đường phức tạp trong ảnh chụp. Bạn hiểu biến đổi Hough như thế nào?","options":["Mục đích của kỹ thuật là tìm các thể hiện không hoàn hảo của đối tượng trong một lớp hình dạng nhất định bằng thủ tục bỏ phiếu (voting).","Với thuật toán biến đổi Hough, điều quan trọng là phải thực hiện phát hiện điểm trước để tạo ra một ảnh điểm, sau đó dùng làm đầu vào cho thuật toán.","Kỹ thuật Hough đặc biệt hữu ích để tính mô tả cục bộ của một đặc trưng.","Tất cả các đáp án còn lại"]},"b-279":{"q":"Trong các mô hình phản xạ ánh sáng, mô hình Phong đầy đủ (full Phong model) bao gồm những gì?","options":["Chỉ số hạng môi trường (ambient) cho các ánh sáng tới khác","Các thành phần khuếch tán (diffuse) và môi trường (ambient) mà không có đóng góp phản xạ gương (specular)","Các thành phần khuếch tán (diffuse) và phản xạ gương (specular) từ nguồn sáng chính cùng với một số hạng môi trường (ambient)","Chỉ các thành phần phản xạ gương (specular) do nhiều nguồn sáng khác nhau đóng góp"]},"b-280":{"q":"Trong các phương pháp phát hiện biên, ưu điểm chính của thuật toán Canny so với các phương pháp đơn giản hơn là gì?","options":["Nó tính toán nhanh hơn đáng kể và cần rất ít sức mạnh xử lý.","Nó rất nhạy với nhiễu và dễ bỏ sót các biên quan trọng.","Nó kết hợp nhiều bước để phát hiện biên bền vững, bao gồm giảm nhiễu, tính gradient và triệt tiêu phi cực đại (non-maximum suppression).","Nó có thể trực tiếp xác định màu cụ thể của các biên trong ảnh."]},"b-281":{"q":"Theo dõi đối tượng (object tracking) có một cách tiếp cận sử dụng các kỹ thuật theo dõi điểm (point tracking). Vậy cách tiếp cận dùng theo dõi điểm được hiểu như thế nào? Chọn đáp án đúng nhất","options":["Các đối tượng được phát hiện trong các khung hình liên tiếp được biểu diễn bằng các phương pháp tất định (deterministic) và xác suất của đối tượng, và việc liên kết đối tượng dựa trên trạng thái trước đó của đối tượng, có thể bao gồm vị trí và chuyển động của đối tượng.","Nó thường được thực hiện bằng cách định vị đối tượng đang chuyển động, được biểu diễn bởi một vùng đối tượng sơ khai, từ khung hình này sang khung hình khác: dựa trên đa góc nhìn (multi-view), dựa trên mẫu (template).","Nó đề cập đến hình dạng và diện mạo của đối tượng.","Cách tiếp cận này yêu cầu một cơ chế bên ngoài để phát hiện đối tượng ở mỗi khung hình."]},"b-282":{"q":"Phần khó nhất để một thuật toán ghép ảnh hoàn toàn tự động hoạt động được là quyết định những cặp ảnh nào thực sự tương ứng với cùng các phần của cảnh. Giải pháp tốt nhất để giải quyết các vấn đề này là gì? Chọn đáp án đúng nhất","options":["Dùng cách tiếp cận dựa trên đặc trưng để loại bỏ các đối tượng khỏi các khung hình ảnh. Sau đó chúng ta có một ảnh toàn cảnh (panoramas) hoàn chỉnh.","Dùng so sánh trực tiếp dựa trên điểm ảnh giữa các ảnh đã được đăng ký để xác định chúng có thực sự là các góc nhìn khác nhau của cùng một cảnh hay không.","Để tìm độ tương đồng của các ảnh liền kề, chúng ta xác định xem các thuộc tính có khớp hay không, bằng phương pháp kết hợp ảnh.","Tất cả các đáp án còn lại"]},"b-283":{"q":"Mức theo dõi đối tượng có thể chia thành hai loại cơ bản. Loại thứ nhất là Theo dõi một đối tượng (Single Object Tracking - SOT). Chọn mô tả tốt nhất về Theo dõi một đối tượng (SOT)","options":["Nó tạo các hộp giới hạn (bounding box) được đưa cho bộ theo dõi dựa trên khung hình đầu tiên của ảnh đầu vào.","Theo dõi một đối tượng (Single Object Tracking) đôi khi còn được gọi là Theo dõi đối tượng thị giác (Visual Object Tracking).","SOT ngụ ý rằng một đối tượng duy nhất được theo dõi, ngay cả trong môi trường có các đối tượng khác.","Tất cả các đáp án còn lại"]},"b-284":{"q":"Có nhiều ứng dụng của căn chỉnh ảnh (image alignment), chẳng hạn theo dõi đối tượng trong video, phân tích chuyển động và nhiều tác vụ khác của thị giác máy tính. Bạn hiểu căn chỉnh ảnh như thế nào?","options":["Đó là ảnh được tạo bằng các thành phần từ nhiều bức ảnh khác nhau.","Căn chỉnh ảnh là quá trình ghép khớp một ảnh gọi là mẫu (template) với một ảnh khác.","Các ảnh được ghép cặp với nhau nhiều hơn như một bộ sưu tập các ảnh độc lập có thể theo một chủ đề hoặc câu chuyện.","Tất cả các đáp án còn lại"]},"b-285":{"q":"Giả sử chúng ta có hai ảnh tại hai thời điểm khác nhau: I(x,y,t) và I(x,y,t+1). Làm thế nào để ước lượng chuyển động điểm ảnh từ ảnh I(x,y,t) sang I(x,y,t+1)?","options":["Đặt hai ảnh chồng lên nhau và tính khoảng cách gần nhất giữa I(x,y,t) và I(x,y,t+1)","Với một điểm ảnh trong I(x,y,t), tìm các điểm ảnh lân cận có cùng màu trong I(x,y,t+1)","Dùng phương pháp nội suy để ước lượng các vị trí tiếp theo của I(x,y,t).","Dựa trên màu của từng điểm ảnh tại vị trí I(x,y,t) so với toàn bộ ảnh tại thời điểm t+1"]},"b-286":{"q":"Bài toán luồng quang học (optical flow) để ước lượng chuyển động điểm ảnh là","options":["Tìm các điểm ảnh gần tại thời điểm t+1 có cùng màu tại thời điểm t","Tìm các điểm ảnh xa tại thời điểm t có cùng màu tại thời điểm t+1","Tìm các điểm ảnh xa tại thời điểm t+1 có cùng màu tại thời điểm t","Tìm các điểm ảnh gần tại thời điểm t có cùng màu tại thời điểm t+1"]},"b-287":{"q":"Phép tịnh tiến (Translation) là:","options":["Thu nhỏ hoặc phóng to ảnh theo phương ngang và/hoặc phương dọc","Dịch chuyển ảnh","Xoay các ảnh","Không đáp án nào ở trên"]},"b-288":{"q":"Đầu vào của thị giác máy tính (computer vision) là một ảnh. Vậy đầu ra của thị giác máy tính là gì?","options":["Đầu ra là sự diễn giải (interpretation) của một ảnh.","Đầu ra là một ảnh đã được xử lý.","Đầu ra là ảnh đã được khôi phục ở những phần bị nhiễu.","Tất cả các đáp án còn lại"]},"b-289":{"q":"Với căn chỉnh dựa trên đặc trưng (feature-based alignment), làm thế nào để xác định các đặc trưng tương ứng giữa các ảnh?","options":["Bằng cách so sánh các bộ mô tả đặc trưng (feature descriptors), vốn nắm bắt cấu trúc cục bộ xung quanh mỗi đặc trưng.","Bằng cách so sánh trực tiếp cường độ điểm ảnh trong các vùng lân cận cục bộ xung quanh mỗi đặc trưng.","Bằng cách chọn thủ công các đặc trưng khớp nhau dựa trên độ tương đồng thị giác.","Bằng cách ưu tiên các đặc trưng gần tâm ảnh nhất để căn chỉnh."]},"b-290":{"q":"Chúng ta đang dùng tương quan (correlation); làm thế nào để tính được tích chập (convolution)?","options":["Không có sự khác biệt, tích chập và tương quan cho cùng kết quả.","Bằng cách xoay nhân (kernel) 180 độ quanh tâm của nó trước khi thực hiện phép tương quan.","Chúng ta có thể dùng trực tiếp kết quả tương quan mà không cần chỉnh sửa gì.","Bằng cách chia kết quả của tương quan cho một hệ số hằng."]},"b-291":{"q":"Với biến đổi Hough (Hough Transform), tình huống nào hưởng lợi nhiều nhất từ việc phát hiện đường thẳng?","options":["Phân đoạn và phân tích từng ký tự trong văn bản viết tay.","Xác định và phân loại các loại hoa khác nhau dựa trên màu sắc và kết cấu.","Phát hiện vạch kẻ làn đường trong ảnh cho các ứng dụng xe tự hành.","Các kỹ thuật phát hiện độ mờ và làm sắc nét ảnh dựa trên thông tin biên chính xác."]},"b-292":{"q":"Phát biểu nào sau đây mô tả tốt nhất mối quan hệ giữa tích chập (convolution) và biến đổi Fourier (Fourier transform) trong xử lý ảnh?","options":["Tích chập trong miền thời gian tương ứng với phép nhân trong miền tần số.","Tích chập trong miền thời gian tương ứng với phép cộng trong miền tần số.","Biến đổi Fourier trong miền thời gian tương ứng với tích chập trong miền tần số.","Chúng không có bất kỳ mối quan hệ nào."]},"b-293":{"q":"Trong xử lý ảnh, phát biểu nào sau đây giải thích chính xác nhất mối quan hệ giữa tích chập (convolution) và biến đổi Fourier (Fourier transform)?","options":["Tích chập trong miền thời gian tương ứng với phép nhân trong miền tần số.","Tích chập trong miền thời gian tương ứng với phép cộng trong miền tần số.","Biến đổi Fourier trong miền thời gian tương ứng với tích chập trong miền tần số.","Chúng không có bất kỳ mối quan hệ nào."]},"b-294":{"q":"Tại sao dùng Hiệu của các Gaussian (Difference of Gaussian - DoG) thay vì Laplacian của Gaussian chuẩn hóa (Normalized Laplacian of Gaussian - NLoG)?","options":["DoG xấp xỉ NLoG nhưng tính toán hiệu quả hơn.","DoG tốt hơn NLoG và tính toán hiệu quả hơn.","DoG tốt hơn NLoG mặc dù tính toán không hiệu quả.","DoG xấp xỉ NLoG mặc dù có cùng yêu cầu tính toán."]},"b-295":{"q":"Thuật toán lưu vực (watershed) trong phân đoạn tương tự với:","options":["Đổ nước vào một địa hình, trong đó các lưu vực (catchment basins) biểu diễn các đối tượng.","Hợp nhất các vùng liền kề có giá trị cường độ tương tự.","Xác định các biên dựa trên độ lớn gradient trong ảnh.","Chia một ảnh thành một số lượng phân đoạn định trước."]},"b-297":{"q":"_____ dựa trên factored sampling nhưng được mở rộng để áp dụng lặp đi lặp lại cho các ảnh liên tiếp trong một chuỗi.","options":["Bộ mô tả đặc trưng (Feature descriptor)","Condensation","Ghép đặc trưng (Feature matching)","Biến đổi Hough (Hough transform)"]},"r-m1-001":{"q":"What is the core goal of the field of Computer Vision?","correct":"To enable machines to \"see\" and understand the visual world the way humans do","wrong":["To optimize the transmission speed of large image files over the Internet","To automate video compression without decoding the data","To design specialized hardware for storing independent pixel matrices"]},"r-m1-002":{"q":"In the 8-bit digital image representation, what does the pixel value of a grayscale image mean?","correct":"It represents light intensity, ranging from 0 (completely black) to 255 (completely white)","wrong":["It represents light wavelength, ranging from 0 (infrared) to 255 (ultraviolet)","It denotes the display's refresh rate, ranging from 0 Hz to 255 Hz","It specifies the 2D spatial coordinates of the pixel in the data matrix"]},"r-m1-003":{"q":"In the RGB color space, which color does a pixel with the value [255, 255, 0] display?","correct":"Yellow","wrong":["Magenta","Cyan","White"]},"r-m1-004":{"q":"What is the fundamental difference between how a computer and the human eye perceive an image?","correct":"A computer sees an image as a matrix structure of numbers representing light intensity","wrong":["A computer naturally interprets the story and emotional context better than the human eye","A computer can only receive monochromatic light and cannot process color channels","A computer decodes images directly through sound waves from environmental sensors"]},"r-m1-005":{"q":"In the OpenCV library for Python, which function is used to display an image in a GUI window?","correct":"cv2.imshow()","wrong":["cv2.imread()","cv2.imwrite()","cv2.display()"]},"r-m1-006":{"q":"In homogeneous coordinates, a 2D point is represented as a vector (x, y, w). What does w = 0 represent?","correct":"A point at infinity","wrong":["The coordinate origin (0, 0)","The center point of the image matrix","An undefined point caused by an overflow error"]},"r-m1-007":{"q":"Which of the following is a core characteristic of a geometric transformation?","correct":"It changes the spatial structure of the image without changing the pixel values","wrong":["It changes the light intensity and color of pixels while keeping the spatial coordinates unchanged","It converts the image into a binary matrix to reduce storage size","It automatically removes all chromatic aberration of the optical lens system"]},"r-m1-008":{"q":"Which geometric property of objects in an image does an Affine transformation always preserve?","correct":"The parallelism of lines","wrong":["The right angles between intersecting lines","The absolute Euclidean distance between any two points","The area ratios of complex shapes"]},"r-m1-009":{"q":"Which property of lines in an image does a Projective transformation preserve?","correct":"The straightness of lines","wrong":["The parallelism of lines","The angles between intersecting lines","The area and perimeter of objects"]},"r-m1-010":{"q":"How are the Degrees of Freedom (DoF) of a geometric transformation defined?","correct":"The minimum number of independent parameters required to completely specify the transformation","wrong":["The maximum number of pixels that can be displaced in a single transformation step","The total number of dimensions of the homogeneous coordinate matrix plus one","The number of iterations required for the geometric transformation algorithm to converge"]},"r-m1-011":{"q":"What is the main difference between orthographic projection and perspective projection from 3D space to 2D?","correct":"Orthographic projection ignores the depth effect by dropping the z axis without any division","wrong":["Orthographic projection preserves the property that distant objects appear smaller than near objects","Orthographic projection requires computing a virtual vanishing point on the image plane","Orthographic projection can only be applied to cameras with ultra-wide-angle lenses"]},"r-m1-012":{"q":"In OpenCV, which function is used to compute a 2D rotation matrix about a center with a specified angle and scale?","correct":"cv2.getRotationMatrix2D()","wrong":["cv2.warpAffine()","cv2.findHomography()","cv2.rotateMatrix()"]},"r-m1-013":{"q":"According to Lambert's Cosine Law, what does the intensity of diffusely reflected light from a rough surface depend on?","correct":"The angle between the incident light ray and the surface normal vector","wrong":["The distance between the observer's eye and the camera sensor","The ratio of the refractive index of the lens glass to white light","The aperture opening and the exposure time of the camera shutter"]},"r-m1-014":{"q":"Which lighting components does the Phong shading model combine to simulate complete illumination?","correct":"Ambient light + Diffuse reflection + Specular reflection","wrong":["Diffuse reflection + Light refraction + Rayleigh scattering","Ambient light + Thermal radiation (Radiosity) + Aberration scattering","Specular reflection + Lens refractive index + Ray tracing"]},"r-m1-015":{"q":"Which types of surface light interaction are Ray Tracing and Radiosity best suited for?","correct":"Ray tracing is suited to mirror-like/strongly reflective surfaces, while Radiosity is used for rough (diffuse) surfaces","wrong":["Ray tracing is suited only to rough surfaces, while Radiosity is used only for convex spherical mirrors","Both techniques apply only to perfectly transparent liquid surfaces","Ray tracing is used for area light sources, while Radiosity is used for point light sources"]},"r-m1-016":{"q":"What physical cause underlies chromatic aberration in an optical system?","correct":"The refractive index of glass varies slightly with different light wavelengths","wrong":["The intensity of a point light source is non-uniform when passing through the lens aperture","Charge overflow between neighboring sensor cells on the sensor array","The camera shutter opening and closing too quickly, distorting the exposure time"]},"r-m1-017":{"q":"Which important property of the Bidirectional Reflectance Distribution Function (BRDF) is stated in the course material?","correct":"The BRDF is reciprocal","wrong":["The BRDF is always a constant for every light wavelength","The BRDF depends only on the viewing angle and not on the incident angle","The BRDF can only be applied to infinite area light sources"]},"r-m1-018":{"q":"Compared with a CCD sensor, what distinctive advantage does a CMOS sensor have in its signal readout mechanism?","correct":"It can read data from each individual pixel independently","wrong":["It has higher light sensitivity and is completely unaffected by thermal noise","It never suffers from blooming under any lighting condition","It consumes more power, which speeds up ADC signal conversion"]},"r-m1-019":{"q":"Blooming is a limitation most commonly encountered in which type of sensor?","correct":"CCD (Charge-Coupled Device) sensor","wrong":["CMOS sensor","Infrared thermal sensor","CFA (color filter array) sensor"]},"r-m1-020":{"q":"In the HSV color space, which color corresponds to a Hue value of 120 degrees?","correct":"Green","wrong":["Red","Blue","Yellow"]},"r-m1-021":{"q":"In the YCbCr color space, widely used for JPEG image and video compression, what does the Y channel represent?","correct":"The luminance channel (Luma)","wrong":["The blue chroma channel (Blue Chroma)","The red chroma channel (Red Chroma)","The color saturation channel (Saturation)"]},"r-m1-022":{"q":"Which metric is most commonly used to evaluate the quality of an image after compression?","correct":"PSNR (Peak  K_j is the camera calibration matrix","wrong":["R_j is the light reflection matrix, and K_j is the global contrast matrix","R_j is the Gaussian noise filtering matrix, and K_j is the polar coordinate matrix in Hough space","R_j is the multi-pass scaling factor, and K_j is the focal length of a thin lens"]},"r-m6-011":{"q":"In OpenCV's built-in Stitcher class (cv2.Stitcher_create()), which core technical steps does the automatic pipeline include?","correct":"Feature extraction, motion model estimation, and Bundle Adjustment","wrong":["Cancer cell segmentation, SVD decomposition, and CDF histogram equalization","Frequency-domain Fourier transform, anisotropic filtering, and lossy JPEG compression","Drawing Viola-Jones bounding boxes, CSRT object tracking, and Otsu binary thresholding"]},"r-m6-012":{"q":"When using the image stitching tool in OpenCV, what is the prerequisite regarding the fields of view of two adjacent images for successful stitching?","correct":"There must be an overlapping field of view between the images","wrong":["The two images must be cut exactly 50% left and 50% right with no shared region","The two images must have Fourier frequency spectra that are completely orthogonal to each other","The two images must be taken at the same moment by two different CCD sensors"]},"r-m6-013":{"q":"When OpenCV's stitcher.stitch() returns a failure error code, what is the most common cause in practice?","correct":"Not enough matching features are found because the overlapping area between the images is too small","wrong":["The image file size exceeds the 8-bit limit of the CMOS sensor","The Pearson correlation coefficient between the two images reaches an absolute value of 1.0","The camera rotation matrix does not contain a translation component along the z axis"]},"r-m7-001":{"q":"What is the fundamental difference between Object Detection and Image Classification?","correct":"Object detection returns the exact location of the object through a Bounding Box","w )","tracker.detect(frame, bbox)","tracker.train(frame)"]},"r-m7-016":{"q":"What visual effect does Shearing in geometric image transformation have on an original rectangle?","correct":"It skews the image along the X axis or Y axis, deforming the rectangle into a parallelogram","wrong":["It shrinks the rectangle toward the origin by a constant uniform scale","It rotates the rectangle by 90 degrees about its center without changing the right angles","It reflects the rectangle across a mirror plane, producing an axially symmetric image"]},"r-m7-017":{"q":"What is the fundamental difference between Correlation and Convolution in terms of practical application?","correct":"Correlation does not flip the kernel mask and is most commonly used for template matching","wrong":["Correlation flips the kernel by 180 degrees and is used only to detect lines with the Hough transform","Correlation can only be applied to multispectral images with 16-bit color depth","Correlation computes the median value of the neighborhood window to remove salt-and-pepper noise"]},"r-m7-018":{"q":"What distinctive purpose does the Elliptical Weighted Average (EWA) resampling filter serve in image processing?","correct":"It is extremely effective at combating aliasing when warping images","wrong":["Segmenting cancer cells by simulating a flooded terrain map","Finding the optimal rotation matrix in 3-dimensional space using SVD","Biometric face recognition based on principal component analysis (PCA)"]},"r-m7-019":{"q":"What is parallax in panorama stitching, and why must it be eliminated?","correct":"It is the relative displacement of objects at different distances when the viewpoint changes; it must be eliminated to avoid ghosting","wrong":["It is the blooming phenomenon on a CCD sensor that causes the panorama to be completely overexposed","It is the color deviation caused by the refractive index of glass changing with different light wavelengths","It is the frequency difference between the low-pass g":["All result values have their intensity amplitude doubled","The result array is reversed from right to left","All negative values are automatically set to 0"]},"r-m7-035":{"q":"In approximating the first derivative of a discrete function, which kernel mask represents the Central Difference f(x+1) - f(x-1)?","correct":"Kernel [-1, 0, 1]","wrong":["Kernel [0, -1, 1]","Kernel [-1, 1, 0]","Kernel [1, -2, 1]"]},"r-m7-036":{"q":"Which discrete derivative computation does the convolution kernel mask [0, -1, 1] perform by its calculus definition?","correct":"The Forward Difference f(x+1) - f(x)","wrong":["The Backward Difference f(x) - f(x-1)","The Central Difference f(x+1) - f(x-1)","The second-derivative Laplacian f(x+1) - 2f(x) + f(x-1)"]},"r-m7-037":{"q":"When a central difference filter is applied to a row of pixels, where is the sharpest edge of the object located?","correct":"At the position where the derivative intensity change reaches its maximum peak","wrong":["At the position where the brightness is exactly zero","At the position where the variance of the neighborhood window is smallest","At the position where the mode frequency of occurrence is largest"]},"r-m7-038":{"q":"In the gradient orientation formula θ = arctan(I_y / I_x), what do the two quantities I_x and I_y represent?","correct":"The derivatives (gradients) of image intensity along the X axis and Y axis","wrong":["The origin coordinates of the two cluster centers in the K-Means clustering algorithm","The two eigenvalues of the inverse affine matrix","The radius and sweep angle of a circle in Hough space"]},"r-m7-039":{"q":"In the Harris Corner Detector algorithm, when the value R is a significantly negative number, how is the pixel classified?","correct":"Edge","wrong":["Corner","Flat region","Isolated noise point (Outlier)"]}}};

var KEY=SJ.key,canSave=true,P;
function blank(){return {version:2,settings:{examDate:'',theme:'auto',lang:'vi'},answers:{},recent:{},mistakes:{},exams:[],examInProgress:null,read:{},lastLesson:null,cards:{},quiz:null};}
function hydrate(o){var r=Object.assign(blank(),o||{});r.settings=Object.assign(blank().settings,(o&&o.settings)||{});return r;}
function load(){try{var s=localStorage.getItem(KEY);P=hydrate(s?JSON.parse(s):null);localStorage.setItem(KEY+'_p','1');localStorage.removeItem(KEY+'_p');}catch(e){if(!P)P=blank();canSave=false;}}

function banner(){var b=$('#banner');if(b){b.style.display='block';b.innerHTML='Trình duyệt đang chặn lưu trữ — tiến độ chỉ giữ trong phiên này. <a href="#" id="bnExp">Xuất file sao lưu</a>';$('#bnExp').onclick=function(e){e.preventDefault();exportData();};}}

// ---------- stats ----------
function modAcc(m){var r=P.recent[m]||[];return r.length?r.reduce(function(a,b){return a+b;},0)/r.length:null;}
function overallAcc(){var s=0,n=0;D.modules.forEach(function(m){(P.recent[m.id]||[]).forEach(function(v){s+=v;n++;});});return n?s/n:0;}
function coverage(){return Object.keys(P.answers).filter(function(k){return ALLQ_ID[k];}).length/ALLQ.length;}
function lastExam(){return P.exams[P.exams.length-1]||null;}
function readiness(){var le=lastExam();return Math.round(100*(0.6*overallAcc()+0.25*coverage()+0.15*(le?le.score/10:0)));}
function mistakeIds(){return Object.keys(P.mistakes).filter(function(k){return QMAP[k];});}
function daysLeft(){return P.settings.examDate?diffDays(today(),P.settings.examDate):null;}
function barClass(v){return v==null?'':v<0.5?'red':v<0.8?'yellow':'green';}
function weakest(){
  var list=QMODS.slice().map(function(m){var a=modAcc(m.id),n=(P.recent[m.id]||[]).length;return {m:m,score:(a==null?-1:(n<10?a-0.3:a))-m.priority*0.02};});
  list.sort(function(a,b){return a.score-b.score;});return list[0].m;
}
// ---------- ghi nhật ký hoạt động (chỉ khi chạy trên web có tài khoản; quản trị viên được cấp quyền mới xem được) ----------
var TRK={q:[],t:0};
function track(type,detail){
  if(!window.AI_SERVER||!SJ||!SJ.id)return;
  TRK.q.push({type:type,ts:Date.now(),detail:detail||{}});if(TRK.q.length>200)TRK.q.shift();
  clearTimeout(TRK.t);TRK.t=setTimeout(trackFlush,TRK.q.length>=20?200:6000);
}
function trackFlush(){
  if(!TRK.q.length)return;var ev=TRK.q.splice(0,40);
  try{fetch('/api/event',{method:'POST',credentials:'same-origin',keepalive:true,headers:{'content-type':'application/json','x-requested-with':'ssg-web'},body:JSON.stringify({subject:SJ.id,events:ev})}).then(function(r){if(!r.ok&&r.status>=500)TRK.q=ev.concat(TRK.q);}).catch(function(){TRK.q=ev.concat(TRK.q).slice(-200);});}catch(e){}
  if(TRK.q.length){clearTimeout(TRK.t);TRK.t=setTimeout(trackFlush,1500);}
}
addEventListener('pagehide',trackFlush);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')trackFlush();});
function record(q,ok){
  track('quiz_answer',{id:q.id,ok:!!ok,src:q.bank?'bank':(q.type||'q'),mod:q.module||'',ref:q.ref||'',retry:q._retry||0});
  var a=P.answers[q.id]||(P.answers[q.id]={seen:0,correct:0});a.seen++;if(ok)a.correct++;a.lastOk=ok;
  var r=P.recent[q.module]||(P.recent[q.module]=[]);r.push(ok?1:0);if(r.length>20)r.splice(0,r.length-20);
  var m=P.mistakes[q.id];
  if(!ok){m=m||{wrong:0,streak:0};m.wrong++;m.streak=0;P.mistakes[q.id]=m;}
  else if(m){m.streak++;if(m.streak>=2)delete P.mistakes[q.id];}
  save();
}

function modal(html,btns){return new Promise(function(res){
  btns=btns||[{t:'Đóng',v:null,primary:true}];var m=$('#modal');
  m.innerHTML='<div class="box" role="dialog" aria-modal="true">'+html+'<div class="row" style="justify-content:flex-end;margin-top:18px">'+btns.map(function(b,i){return '<button class="btn '+(b.primary?'primary':'')+(b.danger?' danger':'')+'" data-i="'+i+'">'+esc(b.t)+'</button>';}).join('')+'</div></div>';
  m.style.display='flex';
  function close(v){m.style.display='none';m.innerHTML='';document.removeEventListener('keydown',kd,true);res(v);}

  $$('[data-i]',m).forEach(function(b){b.onclick=function(){close(btns[+b.dataset.i].v);};});

});}

function runQuiz(list,title,back,lang,resume){
  list=list.slice();var i=0,score=0,wrong=[],base=list.length,seen={},fixed=0,t0=Date.now(),spent=0,qkey=title+'|'+back;
  if(resume){i=Math.min(resume.i||0,list.length);score=resume.score||0;fixed=resume.fixed||0;seen=resume.seen||{};spent=resume.spent||0;base=resume.base||list.length;wrong=(resume.wrong||[]).map(function(id){return QMAP[id];}).filter(Boolean);}
  function persist(ix){try{P.quiz={key:qkey,title:title,back:back,lang:lang,items:list.map(function(q){return [q.id,q._retry||0];}),i:ix,score:score,fixed:fixed,seen:seen,base:base,wrong:wrong.map(function(q){return q.id;}),spent:spent+Math.round((Date.now()-t0)/1000),at:Date.now()};save();}catch(e){}}lang=localStorage.getItem('ui_qlang')||lang||plang();
  function show(){
    if(i>=list.length)return done();
    persist(i);
    var q=list[i],t=T(q,lang),answered=false,sel=[],tv=(q.bank&&lang==='vi'&&q.vi)?q.vi:null;
    function od(o){return tv?(tv.options[(q.orig||[]).indexOf(o)]||o):o;}
    // q.orig: câu có sẵn danh sách đáp án gốc (đề kì trước, bộ đề); q.keep: giữ nguyên thứ tự (có "All of the above"…)
    var opts=q.orig?(q.keep?q.orig.slice():shuffle(q.orig)):shuffle([t.correct].concat(t.wrong));
    var good=q.answers||[t.correct],multi=good.length>1;
    var head=q.bank?esc(q.topic):(q.type==='recall'||q.type==='key'?'§'+q.ref+' '+esc(secTitle(q.ref)):esc(MOD[q.module].title));
    render('<div class="qtop"><a class="btn sm ghost" href="'+back+'" aria-label="Thoát bài làm">'+ic('close')+'</a><div class="bar"><i style="width:'+(i/list.length*100)+'%"></i></div><span class="small muted">'+(i+1)+'/'+list.length+'</span>'+quizTools(q,lang)+'</div>'+
      (!localStorage.getItem('ssg_quiz_tip_dismissed')?'<div class="quiz-tip-pill" id="quizTip"><span class="qt-ic">'+ic('info')+'</span><span class="qt-txt"><b>Gợi ý sử dụng.</b> Bôi đen cụm từ tiếng Anh để xem bản dịch; dùng nút Gợi ý bên dưới khi cần định hướng cách làm.</span><button class="qt-close" id="qtClose" aria-label="Đóng">'+ic('close')+'</button></div>':'')+

function mdInline2(s){

function mdLite(src){
  src=String(src==null?'':src).replace(/\r\n?/g,'\n');
  var holds=[];function hold(h){holds.push(h);return '\u0000'+(holds.length-1)+'\u0000';}
  function mj(tex,disp){tex=tex.trim();return hold('<'+(disp?'div':'span')+' class="mj'+(disp?' mj-d':'')+'" data-tex="'+esc(tex)+'">'+esc(tex)+'</'+(disp?'div':'span')+'>');}

  src=src.replace(/\x60\x60\x60([\w+#.-]*)[^\n]*\n([\s\S]*?)(?:\x60\x60\x60|$)/g,function(_,lang,code){
    return '\n'+hold('<div class="cb"><div class="cb-h"><span>'+esc(lang||'code')+'</span><button type="button" class="cb-copy">Chép</button></div><pre><code>'+esc(code.replace(/\n$/,''))+'</code></pre></div>')+'\n';});

  src=src.replace(/\$\$([\s\S]+?)\$\$/g,function(_,t){return '\n'+mj(t,true)+'\n';})
    .replace(/\\\[([\s\S]+?)\\\]/g,function(_,t){return '\n'+mj(t,true)+'\n';})

  while(i<lines.length){

    if(/^\s*\|.*\|\s*$/.test(ln)&&i+1<lines.length&&/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i+1])){

var AI_CHIPS_HINT=['Gợi ý cách làm câu này','Giải thích các thuật ngữ trong câu','Dịch câu hỏi sang tiếng Việt'];

      '<label class="check"><input type="checkbox" id="aitr"'+(cfg.autoTranslate!==false?' checked':'')+'> Bôi đen chữ tiếng Anh là tự dịch (mỗi đoạn mới tốn 1 lượt gọi API nhỏ)</label>'+
      '<p class="muted small" style="margin:6px 0 8px">Key chỉ lưu trong trình duyệt này, không nằm trong file HTML – gửi file cho bạn bè không lộ key.</p>'+
      '<div class="row" style="justify-content:flex-end">'+(cfg.key?'<button class="btn sm ghost" id="aidel">Xoá key</button><button class="btn sm" id="aicancel">Huỷ</button>':'')+'<button class="btn sm primary" id="aisave">Lưu</button></div>';
    function sync(){var off=$('#aiprov',box).value==='anthropic';$('#aibasef',box).hidden=$('#aimodtf',box).hidden=off;$('#aimodf',box).hidden=!off;

      if(!k)return $('#aikey',box).focus();

      function commit(){var next={key:k,provider:p,base:off?'':base,model:off?$('#aimod',box).value:mt,autoCheck:$('#aiauto',box).checked,autoTranslate:$('#aitr',box).checked},old=AiCfg.get();
        if(old.provider!==next.provider||old.base!==next.base||old.model!==next.model)Object.keys(aiChats).forEach(function(id){if(!aiChats[id].busy)aiChats[id].msgs=[];});

    setTimeout(function(){$('#aikey',box).focus();});

  function chatView(){
    box.innerHTML='<div class="ai-chat-head"><div class="ai-who"><span class="ai-badge sm">'+ic('spark')+'</span><div><b>Bố Tuấn Anh</b><div class="small muted">'+(AI_SRV?'Hỏi đáp riêng cho môn này':esc(aiModelName())+(aiProvider()==='anthropic'?'':' · bên thứ 3'))+'</div></div></div>'+
      '<span class="row" style="gap:2px"><button class="iconbtn sm" id="aiclr" title="Xoá hội thoại" aria-label="Xoá hội thoại">'+ic('trash')+'</button>'+(AI_SRV?'':'<button class="iconbtn sm" id="aicfg" title="Cài đặt chatbot" aria-label="Cài đặt chatbot">'+ic('gear')+'</button>')+'</span></div>'+
      '<div class="ai-log" aria-live="polite"></div><div class="ai-chips"></div>'+
      '<div class="att-bar" id="aiAtt" hidden></div><div class="ai-compose"><button class="iconbtn att-btn" id="aiAt" type="button" title="Đính kèm ảnh, PDF hoặc tệp văn bản" aria-label="Đính kèm">'+ic('clip')+'</button><input type="file" id="aiFile" multiple hidden accept="'+ATT_ACCEPT+'"><textarea class="ai-input" rows="1" placeholder="Hỏi thêm về câu này…"></textarea><button class="btn sm" id="aistop" hidden>■ Dừng</button><button class="ai-send" id="aisend" aria-label="Gửi">'+ic('arrow')+'</button></div>'+
      '<div class="ai-foot small muted"><span><kbd>Enter</kbd> gửi · <kbd>Shift</kbd>+<kbd>Enter</kbd> xuống dòng</span><span>Hội thoại mất khi tải lại trang</span></div>';
    var log=$('.ai-log',box),input=$('.ai-input',box),chips=$('.ai-chips',box);input.value=chat.draft||'';
    function grow(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px';}
    input.oninput=function(){chat.draft=input.value;grow();};
    input.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}if(e.key==='Escape')input.blur();};
    attBind(chat,{btn:$('#aiAt',box),input:$('#aiFile',box),bar:$('#aiAtt',box),box:box,ta:input});
    $('#aistop',box).onclick=function(){if(chat.ctrl)chat.ctrl.abort();};
    $('#aisend',box).onclick=function(){send();};
    $('#aiclr',box).onclick=function(){if(!chat.busy){chat.msgs=[];chat.err=null;chat.retry=null;draw();}};
    if($('#aicfg',box))$('#aicfg',box).onclick=function(){show(true);};
    function ask(t,shown,restore){aiAsk(chat,chat.msgs.length?t:aiPrompt(q,getCtx())+'\n\nCâu hỏi của tôi: '+t,shown||t,restore);}
    function send(t){t=(t||input.value).trim();if((!t&&!(chat.att&&chat.att.length))||chat.busy||chat.attBusy)return;if(!t)t='Hãy xem giúp tôi phần đính kèm này.';input.value='';chat.draft='';grow();ask(t,t,true);}
    function bubble(m,i){
      var asst=m.role==='assistant';
      return '<div class="ai-msg '+m.role+'">'+(asst?'<span class="ai-badge xs">'+ic('spark')+'</span>':'')+'<div class="ai-bub"><div class="ai-msg-text">'+(asst?mdLite(m.shown):esc(m.shown)+attHtml(m))+'</div>'+
        (asst?'<div class="ai-msg-meta"><span>'+esc(m.meta||'')+'</span><button class="link-btn" data-copy="'+i+'">Chép</button></div>':'')+'</div></div>';
    }
    function draw(){
      var hint=!getCtx().answered;
      log.innerHTML=(!chat.msgs.length&&!chat.busy&&!chat.err?'<div class="ai-empty">'+(hint
          ?'Bạn đang làm câu này nên AI chỉ <b>gợi ý</b>, không nói đáp án. Chọn một gợi ý bên dưới hoặc tự gõ câu hỏi.'
          :'AI sẽ tự giải độc lập rồi đối chiếu với đáp án trong app. Bấm <b>Kiểm tra đáp án</b> hoặc hỏi bất kỳ điều gì về câu này.')+'</div>':'')+
        chat.msgs.map(bubble).join('')+
        (chat.busy?'<div class="ai-msg assistant pending"><span class="ai-badge xs">'+ic('spark')+'</span><div class="ai-bub"><div class="ai-msg-text">'+(chat.partial?mdLite(chat.partial):'<span class="typing"><i></i><i></i><i></i></span>')+'</div></div></div>':'')+
        (chat.err?'<div class="ai-err"><span>'+esc(chat.err)+'</span>'+(chat.retry?'<button class="btn sm" id="airetry">Thử lại</button>':'')+'</div>':'');
      var list=(chat.msgs.length?[]:[hint?'Gợi ý cách làm':'Kiểm tra đáp án']).concat(hint?AI_CHIPS_HINT.slice(1):AI_CHIPS_CHECK);
      chips.innerHTML=chat.busy?'':list.map(function(c,k){return '<button class="ai-chip" data-chip="'+k+'">'+esc(c)+'</button>';}).join('');
      $$('[data-chip]',chips).forEach(function(b){b.onclick=function(){var c=list[+b.dataset.chip];
        if(!chat.msgs.length&&+b.dataset.chip===0)aiAsk(chat,aiPrompt(q,getCtx()),hint?'Gợi ý giúp tôi cách làm câu này (chưa nói đáp án).':'Kiểm tra giúp tôi đáp án câu này.',false);
        else ask(c);};});
      $$('[data-copy]',log).forEach(function(b){b.onclick=function(){copyText(chat.msgs[+b.dataset.copy].shown);b.textContent='Đã chép';setTimeout(function(){b.textContent='Chép';},1500);};});
      if($('#airetry',log))$('#airetry',log).onclick=function(){var r=chat.retry;chat.retry=null;chat.err=null;if(r)aiAsk(chat,r.text,r.shown,true);};

/** Trả lời xong 1 câu: đã cài chatbot + bật tự động thì mở chat và nhờ AI đối chiếu (mỗi câu 1 lần) */
