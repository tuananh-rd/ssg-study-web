e of the Hough transform technique is that it is tolerant of gaps in feature boundary descriptions and is relatively unaffected by image noise.","All of the others"],"answer":[3],"explanation":"**Đáp án đúng: All of the others** — cả ba phát biểu đúng về Hough transform.\n- Cô lập đặc trưng có hình dạng xác định (đường, tròn...).\n- Dùng được khi khó có mô tả giải tích đơn giản của đặc trưng (dạng generalized).\n- Ưu điểm: chịu được đứt đoạn biên và ít bị ảnh hưởng bởi nhiễu nhờ cơ chế bỏ phiếu."},{"id":73,"slide":90,"topic":"Miền tần số & Fourier","section":"Choose the best","question":"Choose the best description of the Fourier Transform","options":["The Fourier Transform is a device that breaks a waveform into an alternate representation, characterized by sine and cosines.","The Fourier Transform shows that any waveform can be re-written as the sum of sinusoidal functions.","The Fourier Transform gives us a unique and powerful map of viewing these waveforms.","All of the others"],"answer":[3],"explanation":"**Đáp án đúng: All of the others** — cả ba phát biểu đúng.\n- Fourier Transform phân tách tín hiệu thành biểu diễn bằng sin và cos.\n- Mọi dạng sóng đều viết được dưới dạng tổng các hàm sin.\n- Cho góc nhìn miền tần số mạnh để phân tích và lọc."},{"id":74,"slide":91,"topic":"Lọc ảnh & tích chập","section":"Choose the best","question":"Choose the best description of the gaussian smoothing","options":["Gaussian smoothing is the result of blurring an image by a Laplace function.","It enhance image structures at different scales.","Smooth blur resembling that of replace the image through a translucent screen","All of the others"],"answer":[2],"explanation":"Gaussian smoothing = làm mờ mịn (smooth blur). Giống như nhìn ảnh qua một lớp kính mờ (translucent screen). Đây là mô tả trực quan đúng nhất"},{"id":75,"slide":92,"topic":"Biến đổi hình học & ghép ảnh","section":"Choose the best","question":"Choose the best correct answer about parallax removal","options":["Parallax is a key challenge that leads to inaccurate registration and ghosting effect of objects in the result. So it needs to remove.","It is used to optimize the camera poses. Once these have been estimated, the desired location of a 3D point x can be estimated as the average of the back-projected 3D locations.","It is a displacement or difference in the apparent position of an object viewed along two different lines of sight, and is measured by the angle or semi-angle of inclination between those two lines.","All of the others"],"answer":[3],"explanation":"**Đáp án đúng: All of the others** — cả ba phát biểu đều đúng về parallax removal.\n- Parallax gây đăng ký sai và hiệu ứng ma (ghosting) nên cần loại bỏ.\n- Dùng để tối ưu tư thế camera; vị trí điểm 3D ước lượng bằng trung bình các điểm back-project.\n- Parallax là độ lệch vị trí biểu kiến của vật khi nhìn từ hai hướng khác nhau."},{"id":76,"slide":93,"topic":"Ảnh số & thu nhận ảnh","section":"Choose the best","question":"Choose the best answer about the bidirectional reflectance distribution function:","options":["It describes the light that reaches the surface of matter in low light and how the color spectrum in the corresponding frequency range can be calculated.","It is reciprocal- can calculate by a total of the incident and reflected intensity.","It describes the proportion of light coming from each incident direction that is redirected to each reflected direction.","All of the others"],"answer":[2],"explanation":"**Đáp án đúng: It describes the proportion of light coming from each incident direction that is redirected to each reflected direction.** BRDF $f_r(\\theta_i,\\phi_i;\\theta_r,\\phi_r)$ cho tỷ lệ ánh sáng tới từ mỗi hướng được phản xạ ra mỗi hướng.\n- Ánh sáng yếu và phổ màu: sai, BRDF không giới hạn ở điều kiện thiếu sáng.\n- Reciprocal tính bằng tổng cường độ tới và phản xạ: sai, tính chất thuận nghịch là $f_r(\\omega_i,\\omega_r)=f_r(\\omega_r,\\omega_i)$.\n- All of the others: sai vì có ý sai."},{"id":77,"slide":94,"topic":"Biến đổi hình học & ghép ảnh","section":"Choose the best","question":"Choose the best description of the RANdom SAmple Consensus- RANSAC","options":["RANSAC is a parameter estimation approach designed to cope with a large proportion of outliers in the input data","RANSAC is a resampling technique that generates candidate solutions by using the minimum number of data points required to estimate the underlying model parameters.","It is a key point matching algorithm.","All of the others"],"answer":[3],"explanation":"**Đáp án đúng: All of the others** — cả ba ý đều được bộ đề chấp nhận.\n- RANSAC ước lượng tham số bền vững với tỷ lệ outlier lớn.\n- Là kỹ thuật lấy mẫu lại: lấy số điểm tối thiểu để sinh mô hình ứng viên rồi đếm inlier.\n- Được dùng trong khớp điểm đặc trưng (loại match sai).\nLưu ý: nói chặt chẽ RANSAC không phải thuật toán so khớp keypoint mà là bước lọc match; ý thứ ba hơi lỏng."},{"id":78,"slide":96,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Choose the best","question":"Choose the best description of the image feature","options":["Feature is a piece of information about the content of an image","Feature may be specific structures in the image such as points, edges, or objects","All of the others","None of the others"],"answer":[2],"explanation":"**Đáp án đúng: All of the others** — hai phát biểu đầu đều đúng.\n- Feature là một mẩu thông tin về nội dung ảnh.\n- Feature có thể là cấu trúc cụ thể như điểm, biên, đối tượng.\n- None of the others: sai."},{"id":79,"slide":98,"topic":"Phân đoạn & phân cụm","section":"Choose the best","question":"Choose the best description of the active contours","options":["It is the process of assigning a color to every pixel in an image.","It defines a separate boundary or curvature for the regions of the target object for segmentation.","Image segmentation is typically used to recognize the color range and their group in images.","It is described as a multi-model for the process of segmentation."],"answer":[1],"explanation":"**Đáp án đúng: It defines a separate boundary or curvature for the regions of the target object for segmentation.** Active contour (snake) là đường cong biến dạng ôm sát biên đối tượng.\n- Gán màu cho mọi pixel: không phải active contour.\n- Nhận dạng dải màu và nhóm màu: mô tả phân cụm màu.\n- Multi-model: không đúng bản chất."},{"id":80,"slide":99,"topic":"Phân đoạn & phân cụm","section":"Choose the best","question":"Choosing the position of K centroids positions is very important. How is the initial value of K centroids positions calculated? Choose the best answer","options":["Divide by K number and photo scale","Evenly distribute K in the image","Central value.","Randomly"],"answer":[3],"explanation":"**Đáp án đúng: Randomly** — trong K-means, các tâm cụm ban đầu thường chọn ngẫu nhiên (ví dụ chọn ngẫu nhiên K điểm dữ liệu), sau đó lặp gán và cập nhật.\n- Chia theo K và tỷ lệ ảnh, phân bố đều, giá trị trung tâm: không phải cách khởi tạo chuẩn.\nMẹo nhớ: khởi tạo ngẫu nhiên nên kết quả có thể khác nhau giữa các lần chạy."},{"id":81,"slide":100,"topic":"Ảnh số & thu nhận ảnh","section":"Choose the best","question":"Choose the best answer about chromatic aberration:","options":["Chromatic aberration is a failure of a lens to focus all colors to the same point.","Chromatic aberration the index of refraction of glass varies slightly as a function frequency.","Chromatic aberration is different wavelengths focus at slightly same distances.","All of the others"],"answer":[0],"explanation":"**Đáp án đúng: Chromatic aberration is a failure of a lens to focus all colors to the same point.**\n- The index of refraction of glass varies slightly as a function frequency: phát biểu đúng về nguyên nhân (tán sắc), nhưng bộ đề chọn định nghĩa hiện tượng.\n- Different wavelengths focus at slightly same distances: sai, bước sóng khác nhau hội tụ ở khoảng cách khác nhau.\n- All of the others: sai vì có ý sai.\nLưu ý: phương án B cũng đúng về mặt vật lý; bộ đề ưu tiên A."},{"id":82,"slide":101,"topic":"Ảnh số & thu nhận ảnh","section":"Choose the best","question":"Choose the best answer about the illumination model:","options":["The illumination model describes the process of absorbing light from an artificial source and is represented in 2D space.","The illumination model is a spatial transformation, used to describe the transformation of 3D space to 2D space.","The illumination model used to calculate the intensity of light emitted from natural light sources (Sun, moon)","The illumination model describes inputs, assumptions, and outputs used to calculate the brightness of surface elements"],"answer":[3],"explanation":"**Đáp án đúng: The illumination model describes inputs, assumptions, and outputs used to calculate the brightness of surface elements.** Mô hình chiếu sáng tính độ sáng của phần tử bề mặt từ nguồn sáng, hình học và vật liệu.\n- Hấp thụ ánh sáng nhân tạo trong không gian 2D: sai.\n- Phép biến đổi không gian 3D sang 2D: đó là phép chiếu.\n- Chỉ tính cường độ nguồn sáng tự nhiên: quá hẹp."},{"id":83,"slide":102,"topic":"Màu sắc & histogram","section":"Choose the best","question":"Choose the best answer about image color","options":["Color is the aspect of things that is caused by differing qualities of light being reflected or emitted by them.","Color is white light emitted by a natural source - the sun","Color is a way of displaying the value of an image and color has seven primary colors.","All of others"],"answer":[0],"explanation":"**Đáp án đúng: Color is the aspect of things that is caused by differing qualities of light being reflected or emitted by them.**\n- Color là ánh sáng trắng từ mặt trời: sai, ánh sáng trắng chỉ chứa các màu.\n- Có bảy màu cơ bản: sai, hệ thường dùng 3 màu cơ bản (RGB/RYB).\n- All of others: sai vì có ý sai."},{"id":84,"slide":103,"topic":"Ảnh số & thu nhận ảnh","section":"Choose the best","question":"Choose the best description of computer vision","options":["Computer vision processes low levels in the image.","Computer vision works by identifying different components in the image","Computer vision is only deployed on large and fast processing systems.","Computer vision is applied in medical image processing, but not as expected in other fields such as agriculture."],"answer":[1],"explanation":"**Đáp án đúng: Computer vision works by identifying different components in the image** — CV phân tích để nhận ra đối tượng/thành phần và hiểu cảnh.\n- Chỉ xử lý mức thấp: sai, CV hướng tới mức cao (hiểu ảnh); mức thấp là image processing.\n- Chỉ chạy trên hệ lớn, nhanh: sai, có thể chạy trên thiết bị nhúng, điện thoại.\n- Chỉ y tế, không nông nghiệp: sai, ứng dụng rộng."},{"id":85,"slide":105,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu ngắn","question":"What is the primary purpose of finding connected components in the overlap graph during panorama recognition?","options":["Identifying outliers in the image set","Recognizing individual panoramas","Estimating camera poses","Calculating image overlap angles"],"answer":[1],"explanation":"**Đáp án đúng: Recognizing individual panoramas** — trong đồ thị chồng lấp (overlap graph), mỗi thành phần liên thông (connected component) là một nhóm ảnh thuộc cùng một panorama.\n- Identifying outliers: là việc của RANSAC.\n- Estimating camera poses: là bundle adjustment.\n- Calculating overlap angles: không phải mục đích của bước này."},{"id":86,"slide":106,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu ngắn","question":"What is the primary purpose of calculating the image gradient in image processing?","options":["Enhancing image resolution","Identifying outliers in the data","Extracting useful information","Adjusting image brightness"],"answer":[2],"explanation":"**Đáp án đúng: Extracting useful information** — gradient đo độ thay đổi cường độ theo hướng, dùng để rút ra biên, hướng, góc cạnh.\n- Enhancing resolution: không liên quan.\n- Identifying outliers: là việc của RANSAC.\n- Adjusting brightness: gradient không chỉnh độ sáng."},{"id":87,"slide":107,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu ngắn","question":"What is the main drawback of the basic Sobel operator in edge detection?","options":["Sensitivity to noise","Inability to detect diagonal edges","Slow computation speed","Lack of rotational invariance"],"answer":[0],"explanation":"**Đáp án đúng: Sensitivity to noise** — Sobel dựa trên đạo hàm nên khuếch đại nhiễu; thường phải làm mờ Gaussian trước.\n- Không dò được biên chéo: sai, Sobel cho đáp ứng cả biên chéo.\n- Tốc độ chậm: sai, chỉ là tích chập $3\\times3$.\n- Thiếu bất biến xoay: đúng một phần nhưng không phải nhược điểm chính."},{"id":88,"slide":108,"topic":"Ảnh số & thu nhận ảnh","section":"Câu ngắn","question":"What is the purpose of the Bidirectional Reflectance Distribution Function (BRDF) in photometric image formation?","options":["Modeling specular reflection","Describing light absorption","Encoding color information","Representing texture mapping"],"answer":[0],"explanation":"**Đáp án đúng: Modeling specular reflection** — theo bộ đề, BRDF dùng để mô hình hoá phản xạ (đặc biệt phản xạ gương) của bề mặt.\n- Describing light absorption: BRDF mô tả phản xạ, không phải hấp thụ.\n- Encoding color: không.\n- Texture mapping: không.\nLưu ý: BRDF tổng quát mô tả cả diffuse lẫn specular; đáp án bộ đề chấp nhận được vì là lựa chọn gần đúng nhất."},{"id":89,"slide":109,"topic":"Camera, stereo & 3D","section":"Câu ngắn","question":"What is a common cause of distortion in camera images?","options":["Linear projection model","Wide-angle lenses","Off-axis distance","linear magnification"],"answer":[1],"explanation":"**Đáp án đúng: Wide-angle lenses** — ống kính góc rộng gây méo thùng (barrel distortion), do phóng đại giảm dần khi xa trục.\n- Linear projection model: là mô hình lý tưởng, không gây méo.\n- Off-axis distance: yếu tố liên quan nhưng không phải nguyên nhân thường gặp theo bộ đề.\n- Linear magnification: lý tưởng, không méo."},{"id":90,"slide":110,"topic":"Ảnh số & thu nhận ảnh","section":"Câu ngắn","question":"What is the input for computer vision?","options":["Text","Audio","Video","Image"],"answer":[3],"explanation":"**Đáp án đúng: Image** — đầu vào của computer vision là ảnh (hoặc chuỗi ảnh/video thực chất là các khung ảnh).\n- Text, Audio: thuộc NLP và xử lý tiếng nói.\n- Video: là chuỗi ảnh; đáp án chuẩn nhất của bộ đề là Image."},{"id":91,"slide":111,"topic":"Chuyển động & optical flow","section":"Câu ngắn","question":"What is a fundamental aspect of object tracking that involves assigning a distinct identifier to each detected object and subsequently monitoring their movements across consecutive video frames?","options":["Object classification","Trajectory prediction","Instance segmentation","ID assignment maintenance"],"answer":[3],"explanation":"**Đáp án đúng: ID assignment maintenance** — gán và duy trì định danh cho từng đối tượng qua các khung hình là cốt lõi của tracking.\n- Object classification: chỉ xác định lớp.\n- Trajectory prediction: dự đoán quỹ đạo, là bước phụ.\n- Instance segmentation: tách từng thể hiện theo pixel trong một ảnh, không theo dõi theo thời gian."},{"id":92,"slide":112,"topic":"Miền tần số & Fourier","section":"Câu ngắn","question":"What is the primary purpose of the Fourier transform in signal processing and image analysis?","options":["Frequency analysis","Noise reduction","Edge detection","Color correction"],"answer":[0],"explanation":"Fourier Transform chuyển tín hiệu hoặc ảnh từ miền không gian sang miền tần số để phân tích, lọc và xử lý tín hiệu."},{"id":93,"slide":114,"topic":"Ảnh số & thu nhận ảnh","section":"Câu ngắn","question":"What is the primary cause of chromatic aberration in lenses?","options":["Dispersion of light","Lens curvature","Lens thickness","Lens material","None of the others"],"answer":[0],"explanation":"**Đáp án đúng: Dispersion of light** — chiết suất thuỷ tinh phụ thuộc bước sóng nên các màu hội tụ ở điểm khác nhau.\n- Lens curvature, thickness, material: là yếu tố ảnh hưởng mức độ, không phải nguyên nhân gốc."},{"id":94,"slide":115,"topic":"Lọc ảnh & tích chập","section":"Câu ngắn","question":"What is an advantage of utilizing a series of one-dimensional transforms over large, non-separable, two-dimensional filter kernels in image processing?","options":["Improved color accuracy","Enhanced detail preservation","Increased computational efficiency","Reduced memory requirements"],"answer":[2],"explanation":"**Đáp án đúng: Increased computational efficiency** — bộ lọc tách được (separable) thay một kernel $K\\times K$ bằng hai kernel một chiều, giảm chi phí từ $O(K^2)$ xuống $O(2K)$ trên mỗi pixel.\n- Color accuracy, detail preservation: không đổi vì kết quả tương đương.\n- Reduced memory: không phải lợi ích chính."},{"id":95,"slide":116,"topic":"Phân đoạn & phân cụm","section":"Câu ngắn","question":"What does K represent in the K-Means clustering algorithm?","options":["Number of dimensions","Number of data points","Number of clusters","Number of iterations"],"answer":[2],"explanation":"**Đáp án đúng: Number of clusters** — $K$ là số cụm cần chia.\n- Số chiều, số điểm dữ liệu, số vòng lặp: không phải $K$."},{"id":96,"slide":117,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu ngắn","question":"What method is commonly employed to extract feature locations and descriptors in the feature-based matching stage of panorama recognition?","options":["Principal Component Analysis (PCA)","Histogram of Oriented Gradients (HOG)","Scale Invariant Feature Transform (SIFT)","Convolutional Neural Networks (CNN)"],"answer":[2],"explanation":"**Đáp án đúng: Scale Invariant Feature Transform (SIFT)** — SIFT trích vị trí keypoint và descriptor bất biến tỷ lệ/xoay, dùng ghép panorama.\n- PCA: giảm chiều.\n- HOG: dùng cho phát hiện đối tượng.\n- CNN: không phải phương pháp chuẩn trong bước này theo bộ đề."},{"id":97,"slide":118,"topic":"Nhận dạng & học máy","section":"Câu ngắn","question":"What methods can you use for Multiclass classification with no alteration","options":["KNN","Logistic Regression","SVM","Softmax"],"answer":[0],"explanation":"**Đáp án đúng: KNN** — K-nearest neighbors vốn xử lý nhiều lớp bằng bỏ phiếu láng giềng, không cần chỉnh sửa.\n- Logistic Regression, SVM: gốc là nhị phân, cần mở rộng (one-vs-rest...).\n- Softmax: là hàm kích hoạt/hồi quy đa lớp, không phải phương pháp độc lập theo cách hỏi."},{"id":98,"slide":119,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu ngắn","question":"What initial step is crucial for the Hough Transform algorithm when recognizing complex lines in photographs?","options":["Color correction of the image","Application of texture mapping","Performing edge detection","Adjusting contrast levels"],"answer":[2],"explanation":"**Đáp án đúng: Performing edge detection** — Hough cần ảnh biên (ví dụ Canny) làm đầu vào để các điểm biên bỏ phiếu trong không gian tham số.\n- Color correction, texture mapping, contrast: không phải bước tiên quyết."},{"id":99,"slide":120,"topic":"Nhận dạng & học máy","section":"Câu ngắn","question":"What type of features does Haar Cascade use for object detection?","options":["Line features","Color histograms","Texture features","Eigenfaces"],"answer":[0],"explanation":"**Đáp án đúng: Line features** — Haar cascade dùng đặc trưng Haar (edge, line, four-rectangle) tính trên tích phân ảnh.\n- Color histograms, texture features: không phải.\n- Eigenfaces: thuộc PCA."},{"id":100,"slide":121,"topic":"Nhận dạng & học máy","section":"Câu ngắn","question":"What type of face recognition method involves the extraction of local features like eyes, nose, and mouth, followed by feeding their locations and statistics into a structural classifier?","options":["Holistic Matching Methods","Feature-based Methods","Eigenfaces","Linear Discriminant Analysis"],"answer":[1],"explanation":"**Đáp án đúng: Feature-based Methods** — trích đặc trưng cục bộ (mắt, mũi, miệng) rồi đưa vị trí và thống kê vào bộ phân loại cấu trúc.\n- Holistic Matching: dùng toàn khuôn mặt.\n- Eigenfaces, LDA: là kỹ thuật holistic."},{"id":101,"slide":122,"topic":"Ảnh số & thu nhận ảnh","section":"Câu ngắn","question":"What aspect of the camera's operation is in charge of adjusting amplification and black level to correspond with incident light power to the image's dynamic range?","options":["Sensor noise","ADC resolution","Automatic Gain Control (AGC)","White balance"],"answer":[2],"explanation":"**Đáp án đúng: Automatic Gain Control (AGC)** — điều chỉnh khuếch đại và black level để khớp công suất ánh sáng tới với dải động của ảnh.\n- Sensor noise: nhiễu.\n- ADC resolution: số bit lượng tử.\n- White balance: cân bằng màu."},{"id":102,"slide":123,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu ngắn","question":"What purpose is RANdom SAmple Consensus (RANSAC) primarily designed to address in parameter estimation?","options":["Overfitting","Outliers in the input data","Underfitting","Computational complexity"],"answer":[1],"explanation":"**Đáp án đúng: Outliers in the input data** — RANSAC ước lượng tham số bền vững khi có nhiều outlier.\n- Overfitting, underfitting, computational complexity: không phải mục tiêu thiết kế."},{"id":103,"slide":124,"topic":"Ảnh số & thu nhận ảnh","section":"Câu ngắn","question":"What system does the digital camera use to perform the digitization of images?","options":["Sensor system","Number system","Logic system","Optical system"],"answer":[0],"explanation":"**Đáp án đúng: Sensor system** — cảm biến (CCD/CMOS) chuyển ánh sáng thành tín hiệu điện rồi số hoá.\n- Optical system: tạo ảnh quang học lên cảm biến, chưa số hoá.\n- Number, Logic system: không phải."},{"id":104,"slide":125,"topic":"Phân đoạn & phân cụm","section":"Câu ngắn","question":"What issue is often associated with using the watershed algorithm on images with textured backgrounds?","options":["Over-segmentation","High-processing speed","Time constrains","Loss of color information"],"answer":[0],"explanation":"**Đáp án đúng: Over-segmentation** — nền có kết cấu sinh nhiều cực tiểu cục bộ, mỗi cực tiểu tạo một lưu vực nên ảnh bị chia quá nhỏ.\n- Tốc độ cao, time constraints, mất thông tin màu: không phải vấn đề đặc trưng."},{"id":105,"slide":126,"topic":"Ảnh số & thu nhận ảnh","section":"Câu ngắn","question":"Which of the following is an application of computer vision?","options":["Security","Robotics","Medicine","All of above"],"answer":[3],"explanation":"**Đáp án đúng: All of above** — computer vision dùng trong an ninh, robot và y tế."},{"id":106,"slide":127,"topic":"Nhận dạng & học máy","section":"Câu ngắn","question":"Which of the following methods of traditional detection?","options":["YOLO","RCNN","Hog detector","Retina Net"],"answer":[2],"explanation":"**Đáp án đúng: Hog detector** — HOG (kèm SVM) là phương pháp phát hiện truyền thống, dùng đặc trưng thủ công.\n- YOLO, RCNN, RetinaNet: dựa trên deep learning."},{"id":107,"slide":128,"topic":"Màu sắc & histogram","section":"Câu ngắn","question":"Which of the following algorithms will distribute the intensity of an image across the entire intensity range?","options":["White patch","Gray world","Ground truth","Histogram equalization"],"answer":[3],"explanation":"**Đáp án đúng: Histogram equalization** — dàn đều cường độ trên toàn dải bằng hàm phân phối tích luỹ của histogram.\n- White patch, Gray world: cân bằng trắng.\n- Ground truth: là nhãn chuẩn, không phải thuật toán."},{"id":108,"slide":129,"topic":"Màu sắc & histogram","section":"Câu ngắn","question":"Which of the following color is having the largest frequency in visible spectrum?","options":["Red","Blue","Violet","Green"],"answer":[2],"explanation":"**Đáp án đúng: Violet** — trong phổ khả kiến, tím có bước sóng ngắn nhất nên tần số lớn nhất ($f=c/\\lambda$).\n- Red: tần số thấp nhất.\n- Blue, Green: nằm giữa."},{"id":109,"slide":130,"topic":"Phân đoạn & phân cụm","section":"Câu ngắn","question":"Which of the following employs energy forces and constraints to separate the pixels of interest from the image?","options":["Active contours","Watershed","Graph-based segmentation","Region splitting"],"answer":[0],"explanation":"**Đáp án đúng: Active contours** — dùng năng lượng nội và ngoại cùng ràng buộc để kéo đường cong ôm đối tượng.\n- Watershed: dựa trên ngập lưu vực.\n- Graph-based segmentation: dựa trên đồ thị.\n- Region splitting: chia vùng theo tiêu chí đồng nhất."},{"id":110,"slide":131,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu ngắn","question":"Which of the following methods identifies edges in an image by zero-crossing technique?","options":["First derivative","Second derivative","Prewitt operator","Robert operator"],"answer":[1],"explanation":"**Đáp án đúng: Second derivative** — biên nằm tại điểm đạo hàm bậc hai đổi dấu (zero-crossing), như Laplacian/LoG.\n- First derivative, Prewitt, Roberts: dùng cực đại của gradient bậc nhất."},{"id":111,"slide":132,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu ngắn","question":"Which of the following applications of RANSAC algorithm?","options":["Document processing","Medical applications","Creating panoramas image","All of the above"],"answer":[3],"explanation":"**Đáp án đúng: All of the above** — RANSAC được dùng ở xử lý tài liệu, y tế và tạo ảnh panorama (ước lượng homography, loại match sai)."},{"id":112,"slide":133,"topic":"Phân đoạn & phân cụm","section":"Câu ngắn","question":"Which of the following will segment an image based on gray-level similarity and texture similarity?","options":["Region splitting","Watershed","Graph-based segmentation","Probabilistic aggregation"],"answer":[2],"explanation":"**Đáp án đúng: Graph-based segmentation** — theo bộ đề, phân đoạn dựa trên đồ thị dùng độ tương đồng mức xám và kết cấu.\n- Region splitting, Watershed: không dựa trên hai tiêu chí này.\n- Probabilistic aggregation: cũng dùng hai tín hiệu này, dễ nhầm.\nLưu ý: câu 192 cùng bộ đề gán hai tiêu chí này cho probabilistic merging; câu này mơ hồ, bộ đề chọn Graph-based."},{"id":113,"slide":134,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu ngắn","question":"Which of the following operators utilizes Laplacian of Gaussian?","options":["Prewitt operator","Canny operator","Sobel (3x3)","Sobel (5x5)"],"answer":[1],"explanation":"Đáp án B: Canny operator. Laplacian of Gaussian (LoG) là phép làm mượt ảnh bằng Gaussian rồi lấy đạo hàm bậc hai (Laplacian), thường gắn với Marr–Hildreth. Trong các lựa chọn, Canny là toán tử phát hiện biên duy nhất bắt đầu bằng làm mượt Gaussian rồi tìm biên nên gần với LoG nhất, còn Prewitt và Sobel (3x3, 5x5) chỉ là mặt nạ đạo hàm bậc nhất. Lưu ý: chữ ẩn trên slide gốc ghi D (Sobel 5x5), còn một bộ đề khác ghi Canny; web chọn Canny vì hợp lý hơn về lý thuyết."},{"id":114,"slide":135,"topic":"Lọc ảnh & tích chập","section":"Câu ngắn","question":"Which of the following is not an Image filters used in OpenCV?","options":["Box Filter","Bilateral Filter","Blue Blur","Build Pyramid"],"answer":[2],"explanation":"**Đáp án đúng: Blue Blur** — không có bộ lọc này trong OpenCV.\n- Box Filter (`cv2.boxFilter`), Bilateral Filter (`cv2.bilateralFilter`), Build Pyramid (`cv2.buildPyramid`): đều tồn tại."},{"id":115,"slide":136,"topic":"Nhận dạng & học máy","section":"Câu ngắn","question":"Which of the following studies various techniques to classify patterns?","options":["Image Processing","Photogrammetry","Image Recognition","Pattern Recognition"],"answer":[3],"explanation":"**Đáp án đúng: Pattern Recognition** — nghiên cứu các kỹ thuật phân loại mẫu.\n- Image Processing: biến đổi ảnh thành ảnh.\n- Photogrammetry: đo đạc từ ảnh.\n- Image Recognition: nhận dạng nội dung ảnh, hẹp hơn."},{"id":116,"slide":137,"topic":"Chuyển động & optical flow","section":"Câu ngắn","question":"Which of the following belongs to kernel tracking approach in object tracking algorithms?","options":["Multi-view based method","Deterministic method","Probabilistic method","Shape matching"],"answer":[1],"explanation":"Lưu ý: bộ đề gốc ghi B (Deterministic method) và web giữ đáp án này theo nguồn đề, nhưng theo giáo trình đáp án đúng là A (Multi-view based method). Trong hệ phân loại object tracking thường dùng, kernel tracking gồm các mô hình appearance dựa trên template, density và multi-view, còn Deterministic và Probabilistic thuộc nhóm point tracking, Shape matching thuộc silhouette tracking. Nếu đề thi theo bộ đề gốc thì chọn B."},{"id":117,"slide":138,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu ngắn","question":"Which of the following algorithms is used to detect the position of a blob in an image?","options":["First derivative","Second derivative","Laplacian of Gaussian","Normalized Laplacian of Gaussian"],"answer":[3],"explanation":"**Đáp án đúng: Normalized Laplacian of Gaussian** — LoG chuẩn hoá theo tỷ lệ ($\\sigma^2\\nabla^2G$) cho cực trị tại vị trí và kích thước blob.\n- First, Second derivative: dùng cho biên.\n- LoG không chuẩn hoá: đáp ứng giảm khi $\\sigma$ lớn nên khó so sánh giữa các tỷ lệ."},{"id":118,"slide":139,"topic":"Màu sắc & histogram","section":"Câu ngắn","question":"Which approach is employed to spread the range of intensity to make full use of possible values?","options":["Contrast stretching","Gray world","Ground truth","Histogram equalization"],"answer":[0],"explanation":"Khi làm thì phải stretch ra full range trước để làm rõ nét độ chênh lệch, full use of... là chỉ việc đưa 1 tấm hình range x->y về full range của bảng màu. Contrast stretching (Kéo dãn độ tương phản): Là kỹ thuật xử lý ảnh giúp mở rộng (kéo dãn) dải mức độ sáng (intensity range) từ một khoảng hẹp ban đầu ra toàn bộ dải giá trị cho phép (ví dụ: từ 0 đến 255 đối với ảnh 8-bit), từ đó cải thiện độ tương phản của ảnh."},{"id":119,"slide":140,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu ngắn","question":"Which technique is commonly used to detect keypoints and descriptors in images for panorama recognition?","options":["SIFT","Histogram equalization","Fourier transform","PCA"],"answer":[0],"explanation":"**Đáp án đúng: SIFT** — phát hiện keypoint và tính descriptor bất biến tỷ lệ/xoay để ghép ảnh.\n- Histogram equalization: tăng tương phản.\n- Fourier transform: phân tích tần số.\n- PCA: giảm chiều."},{"id":120,"slide":141,"topic":"Ảnh số & thu nhận ảnh","section":"Câu ngắn","question":"Which OpenCV function is commonly used to draw a line on an image?","options":["line()","drawLine()","lineSegment()","draw.line()"],"answer":[0],"explanation":""},{"id":121,"slide":142,"topic":"Ảnh số & thu nhận ảnh","section":"Câu ngắn","question":"Which technical specification of a camera regulates the quantity of light that reaches the sensor and establishes the exposure level of an image?","options":["Sampling pitch","Fill factor","Shutter speed","Chip size"],"answer":[2],"explanation":"**Đáp án đúng: Shutter speed** — thời gian mở cửa trập quyết định lượng ánh sáng tới cảm biến và mức phơi sáng.\n- Sampling pitch, Fill factor, Chip size: thông số cảm biến, không điều khiển thời gian phơi sáng."},{"id":122,"slide":143,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu ngắn","question":"Which type of following spaces does the Hough Transform often use for representing lines in parameter space?","options":["Polar space","Cartesian space","Transform space","Gradient space"],"answer":[0],"explanation":"**Đáp án đúng: Polar space** — Hough biểu diễn đường thẳng bằng $\\rho=x\\cos\\theta+y\\sin\\theta$, tức không gian $(\\rho,\\theta)$.\n- Cartesian $(m,b)$: dạng $y=mx+b$ không biểu diễn được đường đứng.\n- Transform, Gradient space: không phải tên không gian tham số chuẩn."},{"id":123,"slide":144,"topic":"Chuyển động & optical flow","section":"Câu ngắn","question":"Which type of object tracking method estimates the object region in each frame, utilizing information encoded within the object region itself?","options":["Template Matching","Multi-view Tracking","Silhouette Tracking","Contour Evolution"],"answer":[0],"explanation":""},{"id":124,"slide":145,"topic":"Chuyển động & optical flow","section":"Câu ngắn","question":"Which tracking algorithm is known for its ability to handle scale variations, rotation, and occlusions by adaptively adjusting the search window?","options":["CamShift tracking","Kalman filtering","Mean Shift tracking","Optical flow tracking"],"answer":[0],"explanation":"**Đáp án đúng: CamShift tracking** — Continuously Adaptive Mean Shift điều chỉnh kích thước và hướng cửa sổ tìm kiếm theo đối tượng.\n- Mean Shift: cửa sổ cố định kích thước.\n- Kalman filtering: bộ lọc trạng thái.\n- Optical flow: ước lượng chuyển động."},{"id":125,"slide":146,"topic":"Nhận dạng & học máy","section":"Câu ngắn","question":"Which object detection algorithm is known for its two-stage architecture involving region proposals and object classification?","options":["Faster R-CNN","YOLO","SSD","Haar Cascade"],"answer":[0],"explanation":"**Đáp án đúng: Faster R-CNN** — hai giai đoạn: Region Proposal Network đề xuất vùng, rồi phân loại và hồi quy hộp.\n- YOLO, SSD: một giai đoạn.\n- Haar Cascade: truyền thống, không dùng region proposal."},{"id":126,"slide":147,"topic":"Phân đoạn & phân cụm","section":"Câu ngắn","question":"How does a Gaussian Mixture Model represent each cluster?","options":["By a parabolic line","By a decision tree","By a distribution","By a random selection"],"answer":[2],"explanation":"**Đáp án đúng: By a distribution** — mỗi cụm trong GMM là một phân phối Gauss với trung bình, hiệp phương sai và trọng số.\n- Parabolic line, decision tree, random selection: không phải cách biểu diễn."},{"id":127,"slide":148,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu ngắn","question":"How is the required minimum number of trials calculated in RANSAC algorithm, given P, the probability of success after S trails, p, the probability of inliers and k, the number of random samples inliers?","options":["log(1-P)/log(1-p^k)","log(1-P)*log(1-p^k)","log[(1-P)(1-p^k)]","log[(1-P)/(1-p^k)]"],"answer":[0],"explanation":"**Đáp án đúng: log(1-P)/log(1-p^k)** — xác suất một lần thử toàn inlier là $p^k$, xác suất thất bại sau $S$ lần là $(1-p^k)^S=1-P$, suy ra\n$$S=\\frac{\\log(1-P)}{\\log(1-p^k)}$$\n- Các dạng tích, log của tích hoặc thương: sai do không giải đúng phương trình mũ."},{"id":128,"slide":149,"topic":"Nhận dạng & học máy","section":"Câu ngắn","question":"When dealing with image classification, what kind of challenges do we face with images?","options":["Variations due to scaling","Variations due to illumination","Image occlusion","All the above"],"answer":[3],"explanation":"**Đáp án đúng: All the above** — phân loại ảnh gặp khó vì thay đổi tỷ lệ, chiếu sáng và bị che khuất."},{"id":129,"slide":150,"topic":"Miền tần số & Fourier","section":"Câu ngắn","question":"When the Fourier transform is used, the values of the properties are also transformed accordingly. What is the result of the Fourier transform applied to convolution f(x) * h(x)?","options":["F(w)+H(w)","F(w)*H(w)","F(w)H(w)","F(w)H*(w)"],"answer":[2],"explanation":"**Đáp án đúng: F(w)H(w)** — định lý tích chập: $\\mathcal{F}\\{f*h\\}=F(\\omega)H(\\omega)$.\n- F(w)+H(w): tương ứng tính cộng, không phải tích chập.\n- F(w)*H(w): là tích chập trong miền tần số, tương ứng tích trong miền không gian.\n- F(w)H*(w): tương ứng tương quan (correlation)."},{"id":130,"slide":151,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu ngắn","question":"After extracted features and their descriptors from two or more images then the next is to establish some preliminary feature matches between these images. Which name is it called?","options":["Feature reduce","Feature combination","Feature compression","Feature matching"],"answer":[3],"explanation":"**Đáp án đúng: Feature matching** — bước thiết lập các cặp đặc trưng tương ứng sơ bộ giữa các ảnh.\n- Feature reduce, combination, compression: không phải tên bước chuẩn."},{"id":131,"slide":152,"topic":"Nhận dạng & học máy","section":"Câu ngắn","question":"Algorithms used for face detection based on what set features to recognize faces? Choose the best correct answer","options":["Eyes, eyebrows, nose, hair, jaw","Eyes, eyebrows, nose, neck, mouth","Eyes, eyebrows, nose, mouth, jaw","Eyes, eyebrows, jaw, neck, ear"],"answer":[2],"explanation":"**Đáp án đúng: Eyes, eyebrows, nose, mouth, jaw** — các đặc trưng khuôn mặt chuẩn: mắt, lông mày, mũi, miệng, đường hàm.\n- Có hair, neck, ear: không phải bộ landmark chuẩn."},{"id":132,"slide":153,"topic":"Phân đoạn & phân cụm","section":"Câu ngắn","question":"Active contour is described as an active model for the process of segmentation. Which of the following algorithms is used in active contour? Choose the best answer","options":["Snakes model","Scissors model","Sets model","All of the others"],"answer":[0],"explanation":"**Đáp án đúng: Snakes model** — active contour dùng mô hình snake, tối thiểu hoá năng lượng nội và ngoại.\n- Scissors model: không phải thuật toán active contour; intelligent scissors là kỹ thuật khác.\n- Sets model: không tồn tại (level set mới là tên thật)."},{"id":133,"slide":154,"topic":"Nhận dạng & học máy","section":"Câu ngắn","question":"A dataset has 1000 images, the size of each image is 128x128. Principal component analysis is applied to keep 1200 most significant components. What is the number of features of the whole dataset in eigenspace?","options":["1000x128","1200x1000","128x1200","128x128"],"answer":[1],"explanation":"**Đáp án đúng: 1200x1000** — sau PCA mỗi ảnh còn 1200 hệ số, với 1000 ảnh là ma trận $1200\\times1000$.\n- 128x1200, 1000x128, 128x128: không khớp số thành phần giữ lại và số ảnh.\nLưu ý: với 1000 ảnh, số thành phần có nghĩa tối đa là 1000; tuy nhiên bộ đề chọn 1200x1000."},{"id":134,"slide":155,"topic":"Phân đoạn & phân cụm","section":"Câu ngắn","question":"It is an approach detecting, for every pixel, belonging class of the object. What is the exact name of this process?","options":["Instance segmentation","Semantic detection","Instance detection","Semantic segmentation"],"answer":[3],"explanation":"**Đáp án đúng: Semantic segmentation** — gán lớp cho từng pixel, không phân biệt từng thể hiện.\n- Instance segmentation: phân biệt từng đối tượng riêng.\n- Semantic detection, Instance detection: không phải thuật ngữ chuẩn."},{"id":135,"slide":156,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu ngắn","question":"It is performed fully automated image stitching is a technique to recognize which images actually go together. What is the exact name of this process?","options":["Panoramas creating","Recognizing panoramas","Parallax removal","Bundle Adjustment"],"answer":[1],"explanation":"**Đáp án đúng: Recognizing panoramas** — nhận dạng những ảnh nào thuộc cùng một panorama trong ghép ảnh tự động.\n- Panoramas creating: tạo ảnh ghép.\n- Parallax removal: khử lệch thị sai.\n- Bundle Adjustment: tối ưu tham số camera."},{"id":136,"slide":157,"topic":"Nhận dạng & học máy","section":"Câu ngắn","question":"It is the ability to perceive an object's physical properties (such as shape, color, and texture) and apply semantic attributes to the object. What is the exact name of this process? Choose the best correct answer","options":["Object detection","Object locating","Object recognition","Object tracking"],"answer":[2],"explanation":"**Đáp án đúng: Object recognition** — nhận ra thuộc tính vật lý (hình, màu, kết cấu) và gán nhãn ngữ nghĩa.\n- Object detection, locating: tìm vị trí.\n- Object tracking: theo dõi theo thời gian."},{"id":137,"slide":158,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu ngắn","question":"In which coordinate system are points represented using the radial distance, azimuthal angle, and height?","options":["Cylindrical coordinates","Cartesian coordinates","Spherical coordinates","Polar coordinates"],"answer":[0],"explanation":"**Đáp án đúng: Cylindrical coordinates** — toạ độ trụ gồm bán kính $r$, góc phương vị $\\theta$ và độ cao $z$.\n- Spherical: bán kính, hai góc.\n- Polar: chỉ $r,\\theta$ (2D).\n- Cartesian: $x,y,z$."},{"id":138,"slide":159,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu ngắn","question":"In image processing, what is the next step after feature detection?","options":["Preprocessing","Feature description","Feature combination","Noise remove( filters)"],"answer":[1],"explanation":"**Đáp án đúng: Feature description** — sau khi phát hiện đặc trưng cần mô tả (descriptor) vùng quanh nó để so khớp.\n- Preprocessing, Noise removal: bước trước.\n- Feature combination: không phải bước chuẩn."},{"id":139,"slide":160,"topic":"Phân đoạn & phân cụm","section":"Câu ngắn","question":"In watershed segmentation, what does a watershed boundary represent?","options":["Object edges","Object centroids","Valleys in the image","Image pixels"],"answer":[0],"explanation":"**Đáp án đúng: Object edges** — đường phân thuỷ (watershed line) là rào chắn nơi các nguồn nước gặp nhau, chính là biên giữa các đối tượng/vùng.\n- Valleys: là các lưu vực (basin), không phải ranh giới.\n- Object centroids, Image pixels: không đúng."},{"id":140,"slide":161,"topic":"Miền tần số & Fourier","section":"Câu ngắn","question":"In Fourier transform, what is the abbreviation for DFT?","options":["Display Fourier Transform","Distribute Fourier Transform","Discrete Fourier Transform","Discontinous Fourier Transform"],"answer":[2],"explanation":"**Đáp án đúng: Discrete Fourier Transform** — DFT biến đổi tín hiệu rời rạc.\n- Các phương án còn lại không phải thuật ngữ."},{"id":141,"slide":162,"topic":"Màu sắc & histogram","section":"Câu ngắn","question":"In the context of photometric image formation, what is the Lambertian reflectance model used to describe?","options":["Diffuse reflection","Specular reflection","Refraction","Translucency"],"answer":[0],"explanation":"**Đáp án đúng: Diffuse reflection** — mô hình Lambert: phản xạ khuếch tán, độ sáng tỷ lệ $\\cos\\theta$ giữa pháp tuyến và hướng sáng, không phụ thuộc hướng nhìn.\n- Specular reflection: phản xạ gương (Phong, Blinn).\n- Refraction, Translucency: khúc xạ, bán trong suốt."},{"id":142,"slide":163,"topic":"Phân đoạn & phân cụm","section":"Câu ngắn","question":"In K mean segmentation, what does \"K\" represent?","options":["Number of clusters","Number of nearest neighbors","The kernel size of each cluster","Kernels in an image"],"answer":[0],"explanation":"**Đáp án đúng: Number of clusters** — $K$ là số cụm.\n- Số láng giềng gần nhất: là $K$ của KNN.\n- Kernel size, kernels in an image: không liên quan."},{"id":143,"slide":164,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu ngắn","question":"In the Harris Corner Detector, what property of corners is exploited for detection?","options":["High gradient magnitude","High pixel intensity","Low gradient magnitude","Low pixel intensity"],"answer":[0],"explanation":"**Đáp án đúng: High gradient magnitude** — tại góc, gradient lớn theo cả hai hướng, nên ma trận cấu trúc có hai trị riêng lớn.\n- Low gradient: vùng phẳng.\n- High/low pixel intensity: Harris không dựa vào độ sáng tuyệt đối."},{"id":144,"slide":165,"topic":"Miền tần số & Fourier","section":"Câu ngắn","question":"In Fourier transform, which of the following operators in signal domain will become the product operator of individual transformed functions in transformed signal domain?","options":["Convolution","Correlation","Multiplication","Sum"],"answer":[0],"explanation":"**Đáp án đúng: Convolution** — $\\mathcal{F}\\{f*h\\}=F(\\omega)H(\\omega)$: tích chập ở miền tín hiệu thành tích ở miền tần số.\n- Correlation: thành $F(\\omega)H^*(\\omega)$.\n- Multiplication, Sum: ngược chiều hoặc thành cộng."},{"id":145,"slide":166,"topic":"Chuyển động & optical flow","section":"Câu ngắn","question":"In which type of object tracking method is the moving object represented by an embryonic object region, with emphasis on object shape and appearance?","options":["Kernel Tracking","Point Tracking","Silhouette Tracking","Template Matching"],"answer":[0],"explanation":"**Đáp án đúng: Kernel Tracking** — đối tượng biểu diễn bằng vùng nguyên thuỷ (kernel), nhấn mạnh hình dạng và diện mạo.\n- Point Tracking: dùng điểm.\n- Silhouette Tracking: dùng đường bao.\n- Template Matching: là một kiểu cụ thể trong kernel tracking."},{"id":146,"slide":167,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu ngắn","question":"In Harris corner detector, after computing score R which determine if a window can contain a corner or not. When is the window flat?","options":["|R| is small","|R| is large","|R| < 0","cannot determine |R|"],"answer":[0],"explanation":"**Đáp án đúng: |R| is small** — Harris: $R=\\det(M)-k\\,\\mathrm{trace}(M)^2$. $|R|$ nhỏ là vùng phẳng; $R<0$ (lớn) là cạnh; $R$ lớn dương là góc.\n- |R| is large: là góc hoặc cạnh.\n- |R| < 0: là cạnh.\n- Cannot determine: sai."},{"id":147,"slide":168,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu ngắn","question":"In the technique, a sparse set of features are detected in one image and matched with the features in the other image. A transformation is then calculated based on these matched features that warp one image onto the other. What is the exact name of this technique?","options":["Feature-Based alignment","Feature-Based detection","Feature-Based recognition","Feature-Based filter"],"answer":[0],"explanation":"**Đáp án đúng: Feature-Based alignment** — phát hiện tập đặc trưng thưa, so khớp rồi tính phép biến đổi để warp ảnh này lên ảnh kia.\n- Detection, recognition, filter: không có cơ chế tính phép biến đổi."},{"id":148,"slide":169,"topic":"Phân đoạn & phân cụm","section":"Câu ngắn","question":"In K-Means segmentation, how are pixels grouped into clusters?","options":["Based on pixel intensity","Based on spatial proximity","Based on the color histogram","By gradient magnitude"],"answer":[0],"explanation":"**Đáp án đúng: Based on pixel intensity** — K-means phân đoạn gom pixel theo giá trị cường độ (hoặc màu) gần tâm cụm.\n- Spatial proximity: không dùng trừ khi thêm toạ độ vào đặc trưng.\n- Color histogram, gradient magnitude: không phải tiêu chí gom."},{"id":149,"slide":170,"topic":"Ảnh số & thu nhận ảnh","section":"Câu ngắn","question":"In digital cameras, what does the ISO setting control?","options":["Sensor sensitivity to light","Shutter speed","Aperture size","Autofocus speed","None of the others"],"answer":[0],"explanation":"**Đáp án đúng: Sensor sensitivity to light** — ISO càng cao càng nhạy sáng nhưng nhiễu hơn.\n- Shutter speed, Aperture size, Autofocus speed: do cài đặt khác điều khiển."},{"id":150,"slide":171,"topic":"Chuyển động & optical flow","section":"Câu ngắn","question":"It is usually performed by locating the moving object, which is represented by an embryonic object region, from one frame to the next: multi-view based, template-based. It refers to the object's shape and appearance. What is the exact name of this approach for object tracking? Choose the best correct answer","options":["Kernel Tracking","Point tracking","Contour tracking","Features tracking"],"answer":[0],"explanation":"**Đáp án đúng: Kernel Tracking** — định vị vùng đối tượng từ khung này sang khung kế (multi-view, template-based), liên quan hình dạng và diện mạo.\n- Point tracking: theo điểm.\n- Contour tracking: theo đường bao.\n- Features tracking: không phải tên nhóm."},{"id":151,"slide":173,"topic":"Phân đoạn & phân cụm","section":"Câu ngắn","question":"It is an approach that identifies, for every pixel, a belonging instance of the object. It detects each distinct object of interest in the image. What is the exact name of this process?","options":["Semantic detection","Instance segmentation","Instance detection","Semantic segmentation"],"answer":[1],"explanation":"**Đáp án đúng: Instance segmentation** — gán mỗi pixel vào một thể hiện cụ thể, phân biệt từng đối tượng.\n- Semantic segmentation: chỉ gán lớp.\n- Semantic/Instance detection: không phải thuật ngữ chuẩn."},{"id":152,"slide":174,"topic":"Phân đoạn & phân cụm","section":"Câu ngắn","question":"It is a technique for efficiently finding peaks in this high-dimensional data distribution without ever computing the complete function explicitly. What is the exact name of this technique in image segmentation?","options":["Mean shift model","K-mean clustering model","Gaussian Mixture Models","K- nearest model"],"answer":[0],"explanation":"**Đáp án đúng: Mean shift model** — tìm đỉnh (mode) của phân phối nhiều chiều mà không tính hàm đầy đủ.\n- K-means: phân cụm với số cụm cố định.\n- GMM: ước lượng bằng EM.\n- K-nearest: phân loại."},{"id":153,"slide":175,"topic":"Ảnh số & thu nhận ảnh","section":"Câu ngắn","question":"In image storing, which of the following image formats follows the pattern of the lossy scheme?","options":["iac","bmp","jpg","ppm"],"answer":[2],"explanation":"**Đáp án đúng: jpg** — JPEG nén có mất mát (lossy).\n- bmp, ppm: không nén hoặc không mất mát.\n- iac: không phải định dạng lossy phổ biến."},{"id":154,"slide":176,"topic":"Phân đoạn & phân cụm","section":"Câu ngắn","question":"It is a type of image segmentation, where we change the pixels of an image to make the image easier to analyze. We convert an image from color or grayscale into a binary image, i.e., one that is simply black and white. What is the exact name of this process?","options":["Thresholding Segmentation.","Edge-Based Segmentation.","Region-Based Segmentation.","Watershed Segmentation."],"answer":[0],"explanation":"**Đáp án đúng: Thresholding Segmentation.** — chuyển ảnh xám/màu thành ảnh nhị phân đen trắng theo ngưỡng.\n- Edge-based: dựa trên biên.\n- Region-based: dựa trên vùng.\n- Watershed: dựa trên lưu vực."},{"id":155,"slide":177,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu ngắn","question":"Line detection is an important step in image processing. There are two techniques applied to line search. The first technique is the Hough transform. So what is the second technique? Choose the best correct answer","options":["Content-based techniques","Edge detection technique","Gaussian technique","Convolution based technique"],"answer":[3],"explanation":"**Đáp án đúng: Convolution based technique** — hai kỹ thuật tìm đường: Hough transform và kỹ thuật dựa trên tích chập (kernel dò đường).\n- Content-based, Gaussian: không phải.\n- Edge detection: bước tiền xử lý, không phải kỹ thuật thứ hai trong bộ đề."},{"id":156,"slide":178,"topic":"Nhận dạng & học máy","section":"Câu ngắn","question":"Object detection method has two approaches. In which the non-neural approach is widely used in computer vision. Which of the following algorithms belongs to the category of non-neural approach?","options":["Mean shift model","Single Shot MultiBox Detector","RANdom SAmple Consensus","Histogram of oriented gradients"],"answer":[3],"explanation":"**Đáp án đúng: Histogram of oriented gradients** — HOG là đặc trưng thủ công, thuộc nhóm không dùng mạng nơ-ron.\n- Single Shot MultiBox Detector: mạng nơ-ron.\n- Mean shift, RANSAC: không phải thuật toán phát hiện đối tượng chính."},{"id":157,"slide":179,"topic":"Nhận dạng & học máy","section":"Câu ngắn","question":"Object detection method has two approaches. In which, the first approach is non-neural which is widely used in traditional computer vision. What is the second approach? Choose the best correct answer","options":["Color-based approach","Neural network approaches","Feature-based approach","Convolution-based techniques"],"answer":[1],"explanation":"**Đáp án đúng: Neural network approaches** — hai nhóm phát hiện đối tượng: không dùng nơ-ron (HOG, Haar) và dùng mạng nơ-ron (R-CNN, YOLO, SSD).\n- Các phương án còn lại thuộc cách tiếp cận truyền thống."},{"id":158,"slide":180,"topic":"Ảnh số & thu nhận ảnh","section":"Câu ngắn","question":"The lower limit of the dynamic range ratio can be determined by___","options":["Contrast","Saturation","Noise","Brightness"],"answer":[2],"explanation":"**Đáp án đúng: Noise** — giới hạn dưới của dải động là mức nhiễu của cảm biến (tín hiệu nhỏ nhất phân biệt được khỏi nhiễu).\n- Saturation: giới hạn trên.\n- Contrast, Brightness: không xác định giới hạn dưới."},{"id":159,"slide":181,"topic":"Nhận dạng & học máy","section":"Câu ngắn","question":"The aim is to identify the facial landmarks that are key to distinguishing your face. What is the exact name of this step in face recognition? Choose the best correct answer","options":["Face detection","Face locating","Features analysis","Face analysis"],"answer":[3],"explanation":"**Đáp án đúng: Face analysis** — bước xác định các landmark trên khuôn mặt giúp phân biệt khuôn mặt.\n- Face detection/locating: tìm vị trí khuôn mặt.\n- Features analysis: không phải tên bước chuẩn."},{"id":160,"slide":182,"topic":"Phân đoạn & phân cụm","section":"Câu ngắn","question":"The basic idea consisted of placing a water source in each regional minimum in the relief, to flood the entire relief from sources, and build barriers when different water sources meet. What is the exact name of this process?","options":["Watershed segmentation","Waterfall segmentation","Interconnected water bottles","Flowing water"],"answer":[0],"explanation":"**Đáp án đúng: Watershed segmentation** — đặt nguồn nước tại mỗi cực tiểu cục bộ, ngập dần và dựng đập khi các nguồn gặp nhau.\n- Các phương án còn lại không phải thuật ngữ."},{"id":161,"slide":183,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu ngắn","question":"We have opened an image with OpenCV. We want to flip it on both Vertical and Horizontal axis. Which is correct the code?","options":["cv2.flip(img, -1)","cv2.flip(img, 1)","cv2.flip(img, 0)","cv2.flip(img, 2)"],"answer":[0],"explanation":"**Đáp án đúng: cv2.flip(img, -1)** — `flipCode` âm lật cả hai trục; `1` lật ngang (quanh trục dọc); `0` lật dọc.\n- `2`: không hợp lệ (mọi giá trị dương hành xử như `1`)."},{"id":162,"slide":184,"topic":"Ảnh số & thu nhận ảnh","section":"Câu ngắn","question":"Which type of digital camera sensor is commonly found in smartphones and compact cameras?","options":["CMOS sensor","Full-frame sensor","APS-C sensor","Micro Four Thirds sensor"],"answer":[0],"explanation":"**Đáp án đúng: CMOS sensor** — cảm biến CMOS phổ biến ở điện thoại và máy compact (tiết kiệm điện, rẻ).\n- Full-frame, APS-C, Micro Four Thirds: là kích thước cảm biến, chủ yếu ở máy ảnh lớn."},{"id":163,"slide":185,"topic":"Ảnh số & thu nhận ảnh","section":"Câu ngắn","question":"What geometric primitive is typically used to represent a point in a 2D image in computer vision?","options":["Pixel","Line","Circle","Triangle"],"answer":[0],"explanation":"Trong ảnh số, mỗi điểm ảnh (pixel) là đơn vị cơ bản biểu diễn một điểm trong không gian 2D và chứa thông tin về màu sắc hoặc cường độ sáng."},{"id":164,"slide":186,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu ngắn","question":"Which transformation only preserves collinearity and ratios of distances between points on a line?","options":["Affine transformation","Translation","Rotation","Perspective transformation"],"answer":[0],"explanation":"Affine transformation bảo toàn các đường thẳng, tính song song và tỷ lệ khoảng cách giữa các điểm trên cùng một đường thẳng, nhưng không nhất thiết bảo toàn góc hoặc khoảng cách tuyệt đối."},{"id":165,"slide":187,"topic":"Lọc ảnh & tích chập","section":"Câu ngắn","question":"Which type of filter is commonly used for smoothing an image and reducing noise?","options":["Low-pass filter","High-pass filter","Band-pass filter","Adaptive filter"],"answer":[0],"explanation":"Low-pass filter làm giảm các thành phần tần số cao (thường là nhiễu), giúp ảnh trở nên mượt hơn."},{"id":166,"slide":188,"topic":"Màu sắc & histogram","section":"Câu ngắn","question":"Which Phong Shading model component is responsible for simulating the reflection of light off a surface in multiple directions?","options":["Diffuse reflection","Ambient reflection","Emissive reflection","Specular reflection"],"answer":[0],"explanation":"Diffuse reflection mô phỏng ánh sáng phản xạ đều theo nhiều hướng từ bề mặt nhám. Trong khi đó, Specular reflection mô phỏng các điểm sáng bóng (highlight)."},{"id":167,"slide":190,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu ngắn","question":"Which process is employed for correcting parallax in image blending when the motion is relatively small?","options":["Global bundle adjustment.","Local alignment.","General 2D motion estimation.","Back-projection averaging."],"answer":[1],"explanation":"Local alignment điều chỉnh từng vùng ảnh riêng biệt để giảm ảnh hưởng của thị sai, đặc biệt khi sự khác biệt giữa các ảnh không lớn."},{"id":168,"slide":191,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu ngắn","question":"In what field is image stitching utilized to reconstruct torn paper?","options":["Art restoration.","Medical imaging.","Forensic and investigative science.","Archaeology."],"answer":[2],"explanation":"Image stitching được ứng dụng trong pháp y để ghép các tài liệu bị xé, hỗ trợ điều tra và phục hồi chứng cứ."},{"id":169,"slide":192,"topic":"Nhận dạng & học máy","section":"Câu ngắn","question":"Which approach in face recognition treats the task as a two-dimensional problem and includes techniques like Principal Component Analysis, Linear Discriminant Analysis, and independent component analysis?","options":["Feature-based Methods","Holistic Matching Methods","Structural Classifier Methods","Neural network based method"],"answer":[1],"explanation":"**Đáp án đúng: Holistic Matching Methods** — xem ảnh mặt như bài toán hai chiều, dùng PCA, LDA, ICA.\n- Feature-based: trích đặc trưng cục bộ.\n- Structural classifier, Neural network: không phải nhóm đó."},{"id":170,"slide":194,"topic":"Phân đoạn & phân cụm","section":"Câu trung bình","question":"What is the underlying principle of Mean Shift segmentation?","options":["Moving pixels towards the average color","Minimizing mean intensity gradients of regions","Maximizing color contrast of objects","Applying morphological operations median images"],"answer":[0],"explanation":"**Đáp án đúng: Moving pixels towards the average color** — mean shift dịch mỗi điểm về trung bình của cửa sổ láng giềng đến khi hội tụ tại mode.\n- Minimizing mean intensity gradients, maximizing contrast, morphological operations: không đúng nguyên lý."},{"id":171,"slide":195,"topic":"Màu sắc & histogram","section":"Câu trung bình","question":"What is the contrast stretching technique in image processing?","options":["To compress the range of intensity values in an image","To reduce the overall brightness of an image","To stretch the range of intensity values for optimal utilization","To convert color images into grayscale"],"answer":[2],"explanation":"**Đáp án đúng: To stretch the range of intensity values for optimal utilization** — kéo giãn dải cường độ ra toàn thang.\n- Compress range: ngược lại.\n- Reduce brightness, convert to grayscale: không liên quan."},{"id":172,"slide":196,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu trung bình","question":"What is the role of the Gaussian filter in the Laplacian of Gaussian (LoG) edge detection?","options":["To blur the image and reduce noise","To enhance the contrast of the image","To calculate the gradient of the image","To perform non-maximum suppression."],"answer":[0],"explanation":"**Đáp án đúng: To blur the image and reduce noise** — LoG gồm Gaussian làm mượt để giảm nhiễu rồi Laplacian tìm zero-crossing.\n- Enhance contrast: không phải vai trò.\n- Calculate gradient: việc của Laplacian.\n- Non-maximum suppression: thuộc Canny."},{"id":173,"slide":197,"topic":"Phân đoạn & phân cụm","section":"Câu trung bình","question":"What is the primary technique used by mean shift to efficiently locate peaks in a high-dimensional data distribution?","options":["Random sampling of the pixels in a range","Gradient descent of the pixels in a clustering","Mean of the pixels in a clustering","Mean of the pixels in a range"],"answer":[3],"explanation":"**Đáp án đúng: Mean of the pixels in a range** — mean shift tính trung bình các điểm trong cửa sổ, dịch cửa sổ tới trung bình đó cho đến khi hội tụ ở đỉnh.\n- Random sampling, gradient descent: không phải kỹ thuật cốt lõi.\n- Mean in a clustering: không đúng, vì dùng cửa sổ (range), chưa có cụm."},{"id":174,"slide":198,"topic":"Tổng quan & toán cơ bản","section":"Câu trung bình","question":"What is image processing generally focused on achieving?","options":["Generating textual information from images","Extracting useful information and enhancing images","Converting images into audio signals","Creating three-dimensional representations of images"],"answer":[1],"explanation":"**Đáp án đúng: Extracting useful information and enhancing images** — xử lý ảnh nhằm cải thiện ảnh và rút thông tin hữu ích.\n- Sinh văn bản, chuyển thành âm thanh, tạo biểu diễn 3D: không phải mục tiêu chính."},{"id":175,"slide":199,"topic":"Phân đoạn & phân cụm","section":"Câu trung bình","question":"What is a limitation of using region growing algorithms for image segmentation?","options":["Difficulty handling objects with disconnected parts.","Inability to segment images with multiple dominant colors.","High sensitivity to noise and slight intensity variations.","Significant computational cost for processing large images."],"answer":[2],"explanation":"**Đáp án đúng: High sensitivity to noise and slight intensity variations.** — region growing phụ thuộc điểm mầm và ngưỡng nên dễ bị nhiễu và thay đổi nhỏ làm sai vùng.\n- Đối tượng nhiều phần rời nhau: không phải hạn chế đặc trưng.\n- Nhiều màu chủ đạo: có thể xử lý bằng nhiều mầm.\n- Chi phí tính toán lớn: không phải nhược điểm chính."},{"id":176,"slide":200,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu trung bình","question":"What is the objective of the Hough Transform when applied to identify objects within a certain class of shapes?","options":["Generating high-resolution images","Conducting pixel-level segmentation","Performing voting procedure for shape recognition","Enhancing color saturation in the image"],"answer":[2],"explanation":"**Đáp án đúng: Performing voting procedure for shape recognition** — mỗi điểm biên bỏ phiếu cho tham số hình dạng; đỉnh bỏ phiếu cho ra hình.\n- High-resolution, pixel segmentation, color saturation: không phải mục tiêu."},{"id":177,"slide":201,"topic":"Nhận dạng & học máy","section":"Câu trung bình","question":"What is the primary goal of object detection in image and video processing?","options":["Recognizing objects without specifying their location","Identifying and locating instances of objects in an image or video","Describing the content of an image","Classifying images based on their visual features"],"answer":[1],"explanation":"**Đáp án đúng: Identifying and locating instances of objects in an image or video** — vừa nhận dạng vừa định vị.\n- Recognizing without location: là recognition.\n- Describing content: captioning.\n- Classifying images: classification."},{"id":178,"slide":202,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu trung bình","question":"What is the significance of the term \"least squares\" in 2D alignment methods?","options":["It minimizes the sum of squared distances between points.","It maximizes the entropy between points.","It maximizes the sum of squared differences between points.","It minimizes the entropy of the aligned image."],"answer":[0],"explanation":"**Đáp án đúng: It minimizes the sum of squared distances between points.** — bình phương tối thiểu cực tiểu $\\sum_i\\|x_i'-f(x_i;p)\\|^2$.\n- Maximizes entropy, maximizes sum of squared differences, minimizes entropy: không đúng."},{"id":179,"slide":203,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu trung bình","question":"What is the primary purpose of global bundle adjustment in image processing?","options":["Estimating the location of 3D points","Correcting parallax in images","Optimizing camera poses","Aligning two images"],"answer":[2],"explanation":"**Đáp án đúng: Optimizing camera poses** — global bundle adjustment tối ưu đồng thời tư thế camera (và điểm 3D) để giảm sai số chiếu lại.\n- Estimating 3D points: là kết quả đi kèm.\n- Correcting parallax: việc khác.\n- Aligning two images: căn chỉnh cặp."},{"id":180,"slide":205,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu trung bình","question":"What is the transformation where the transformation matrix is as follows?\nT = [[2, 0, 1], [0, 2, 2], [0, 0, 1]]","options":["Scale 2 and translate 1 along x axis, translate 2 along y axis","Scale 2 and translate 2 along x axis, translate 1 along y axis","Translate 2 along x axis, translate 1 along y axis","Scale 2 and translate 2 along x axis, keep unchanged to y axis"],"answer":[0],"explanation":"**Đáp án đúng: Scale 2 and translate 1 along x axis, translate 2 along y axis** — ma trận đồng nhất $\\begin{bmatrix}s&0&t_x\\\\0&s&t_y\\\\0&0&1\\end{bmatrix}$ với $s=2$, $t_x=1$, $t_y=2$.\n- Các phương án khác đổi chỗ $t_x$, $t_y$ hoặc bỏ co giãn."},{"id":181,"slide":206,"topic":"Miền tần số & Fourier","section":"Câu trung bình","question":"What is the Nyquist frequency in the context of Fourier transform?","options":["Half of the sampling frequency","The highest frequency in the signal","The frequency at which the signal becomes periodic","The frequency corresponding to the imaginary part of the spectrum"],"answer":[0],"explanation":"**Đáp án đúng: Half of the sampling frequency** — $f_N=f_s/2$; tín hiệu có tần số cao hơn sẽ bị aliasing.\n- Highest frequency in signal: không bắt buộc bằng.\n- Periodic frequency, imaginary part: không liên quan."},{"id":182,"slide":207,"topic":"Miền tần số & Fourier","section":"Câu trung bình","question":"What is the effect of shifting a signal in the time domain on its Fourier transform?","options":["The phase spectrum is shifted.","The magnitude spectrum is scaled.","The frequency components are attenuated.","The Nyquist frequency is altered."],"answer":[0],"explanation":"**Đáp án đúng: The phase spectrum is shifted.** — tính chất dịch: $\\mathcal{F}\\{f(t-t_0)\\}=e^{-j\\omega t_0}F(\\omega)$; độ lớn giữ nguyên, chỉ pha đổi.\n- Magnitude scaled, attenuated, Nyquist altered: sai."},{"id":183,"slide":208,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu trung bình","question":"What is the primary goal of feature-based alignment in image processing?","options":["Enhancing image resolution of an image patch","Removing noise from images","Estimating the motion between sets of matched points","Adjusting image brightness"],"answer":[2],"explanation":"**Đáp án đúng: Estimating the motion between sets of matched points** — ước lượng phép biến đổi giữa các cặp điểm tương ứng.\n- Tăng độ phân giải, khử nhiễu, chỉnh độ sáng: không phải mục tiêu."},{"id":184,"slide":210,"topic":"Phân đoạn & phân cụm","section":"Câu trung bình","question":"What is the purpose of the internal energy term in the Snake Model?","options":["To penalize large deformations of the contour","To attract the contour towards object boundaries","To perform non-maximum suppression","To adjust the intensity of edge pixels"],"answer":[0],"explanation":"**Đáp án đúng: To penalize large deformations of the contour** — năng lượng nội (độ co giãn và độ cong) giữ đường cong trơn.\n- Attract contour to boundaries: là năng lượng ngoại.\n- Non-maximum suppression: thuộc Canny.\n- Adjust intensity: không liên quan."},{"id":185,"slide":211,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu trung bình","question":"What is parallax in the context of imaging?","options":["Shift in the position of objects with a change in viewpoint","Image distortion due to lens imperfections","Chromatic aberration in images","The blurring effect caused by motion during image capture"],"answer":[0],"explanation":"**Đáp án đúng: Shift in the position of objects with a change in viewpoint** — vật gần dịch nhiều hơn vật xa.\n- Lens distortion, chromatic aberration, motion blur: hiện tượng khác."},{"id":186,"slide":212,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu trung bình","question":"What is the key idea behind the RANSAC algorithm for 2D alignment?","options":["Iteratively estimating a model from a subset of inliers","Minimizing the sum of squared differences","Maximizing mutual information between images","Employing kernel density estimation for feature matching"],"answer":[0],"explanation":"**Đáp án đúng: Iteratively estimating a model from a subset of inliers** — lặp: lấy mẫu tối thiểu, ước lượng mô hình, đếm inlier, giữ mô hình tốt nhất.\n- Sum of squared differences: least squares.\n- Mutual information: căn chỉnh khác.\n- Kernel density: không dùng."},{"id":187,"slide":213,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu trung bình","question":"What is the use of the geometric transformations in real life?","options":["Align multiple images that were clicked at different times.","Correct images for avoiding lens distortion.","Images according to camera orientation.","All of the others"],"answer":[3],"explanation":"**Đáp án đúng: All of the others** — biến đổi hình học dùng để căn chỉnh nhiều ảnh, sửa méo ống kính và chỉnh ảnh theo hướng camera."},{"id":188,"slide":214,"topic":"Lọc ảnh & tích chập","section":"Câu trung bình","question":"What is the main drawback of using a mean filter for noise reduction?","options":["It tends to blur edges and fine details.","It is computationally expensive.","It only works well with grayscale images.","It amplifies noise in the image."],"answer":[0],"explanation":"**Đáp án đúng: It tends to blur edges and fine details.** — mean filter lấy trung bình cả biên.\n- Tốn tính toán: không, rất đơn giản.\n- Chỉ ảnh xám: sai.\n- Khuếch đại nhiễu: sai, làm giảm nhiễu."},{"id":189,"slide":215,"topic":"Miền tần số & Fourier","section":"Câu trung bình","question":"What is the key characteristic of a band-pass filter?","options":["It allows a specific range of frequencies to pass through.","It allows only low frequencies to pass through.","It allows all frequencies to pass through.","It completely blocks all frequencies."],"answer":[0],"explanation":"**Đáp án đúng: It allows a specific range of frequencies to pass through.**\n- Chỉ tần số thấp: low-pass.\n- Mọi tần số: all-pass.\n- Chặn tất cả: không phải bộ lọc."},{"id":190,"slide":216,"topic":"Ảnh số & thu nhận ảnh","section":"Câu trung bình","question":"What is the purpose of the aperture in a digital camera lens?","options":["Control the amount of light entering the camera","Enhance the depth of field","Adjust the sharpness of the image","Determine the color temperature","None of the others"],"answer":[0],"explanation":"**Đáp án đúng: Control the amount of light entering the camera** — khẩu độ điều chỉnh lượng sáng vào.\n- Depth of field: hệ quả phụ, không phải mục đích chính.\n- Sharpness, color temperature: không do khẩu độ quyết định."},{"id":191,"slide":217,"topic":"Lọc ảnh & tích chập","section":"Câu trung bình","question":"What is the first step in resampling an image from MIP-image?","options":["Applying a high-quality filter","Computing the base 2 logarithm of the image","Estimating the scalar value of the resampling rate","Using a fractional pyramid level"],"answer":[2],"explanation":"**Đáp án đúng: Estimating the scalar value of the resampling rate** — bước đầu: ước lượng tốc độ lấy mẫu lại để biết mức pyramid cần dùng.\n- Filter chất lượng cao, log cơ số 2, mức pyramid phân số: các bước sau."},{"id":192,"slide":218,"topic":"Phân đoạn & phân cụm","section":"Câu trung bình","question":"What are the two cues utilized by the probabilistic merging algorithm to determine region merging?","options":["Saturation level and brightness similarity","Edge detection and contrast similarity","Gray-level similarity and texture similarity","Hue difference and pattern recognition"],"answer":[2],"explanation":"**Đáp án đúng: Gray-level similarity and texture similarity** — hợp nhất xác suất dùng hai dấu hiệu này.\n- Saturation và brightness, edge và contrast, hue và pattern: không phải."},{"id":193,"slide":219,"topic":"Tổng quan & toán cơ bản","section":"Câu trung bình","question":"What are the input and output of image processing?","options":["signal and image","signal only","image only","depends on input"],"answer":[2],"explanation":"**Đáp án đúng: image only** — xử lý ảnh nhận ảnh và cho ra ảnh.\n- Signal: không đúng theo bộ đề.\nLưu ý: một số tài liệu cho phép đầu ra là thuộc tính; bộ đề chọn image only."},{"id":194,"slide":220,"topic":"Tổng quan & toán cơ bản","section":"Câu trung bình","question":"What are the fields related to computer vision?","options":["Image processing, graphics algorithms, Cognitive sciences.","Robotics, Neurobiology, Information retrieval","All of the others","Not of others"],"answer":[2],"explanation":"**Đáp án đúng: All of the others** — computer vision liên quan xử lý ảnh, đồ hoạ, khoa học nhận thức, robot, thần kinh học và truy xuất thông tin."},{"id":195,"slide":221,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu trung bình","question":"What does RANSAC stand for in the context of computer vision?","options":["Random Sample Consensus","Random Assignment for Numerical Stability in Alignment and Classification","Robust Analysis for Noisy and Scattered Alignment of Components","Recursive Alignment and Sampling for Numerical Convergence"],"answer":[0],"explanation":"**Đáp án đúng: Random Sample Consensus** — RANdom SAmple Consensus.\n- Các phương án còn lại là cụm từ bịa."},{"id":196,"slide":222,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu trung bình","question":"What does \"consensus\" in RANSAC refer to?","options":["The majority of inliers in the data set","The average value of the data points","The deviation of the model from the data","The total number of iterations performed"],"answer":[0],"explanation":"**Đáp án đúng: The majority of inliers in the data set** — consensus là tập điểm đồng thuận (inlier) với mô hình.\n- Giá trị trung bình, độ lệch mô hình, số vòng lặp: không phải."},{"id":197,"slide":223,"topic":"Ảnh số & thu nhận ảnh","section":"Câu trung bình","question":"What do the components of a pixel include?","options":["Intensity value and size of the image","Position address and intensity value","Position address and size of the image","All of the others"],"answer":[1],"explanation":"**Đáp án đúng: Position address and intensity value.** Một pixel gồm vị trí $(x, y)$ trong lưới ảnh và giá trị cường độ (gray level hoặc các kênh màu) tại vị trí đó.\n- Kích thước ảnh là thuộc tính của cả ảnh, không phải của một pixel.\n- \"All of the others\" sai vì hai phương án còn lại chứa \"size of the image\"."},{"id":198,"slide":224,"topic":"Màu sắc & histogram","section":"Câu trung bình","question":"What characterizes mirror-like reflection?","options":["Outgoing light is scattered in multiple directions","Outgoing light follows a linear projection model","Outgoing light reflects off the surface in a single direction","Outgoing light rotates around the surface normal by 90 degrees"],"answer":[2],"explanation":"**Đáp án đúng: Outgoing light reflects off the surface in a single direction.** Với specular (mirror-like) reflection, góc phản xạ bằng góc tới, nên ánh sáng ra đi theo một hướng duy nhất.\n- Tán xạ theo nhiều hướng là đặc điểm của diffuse (Lambertian) reflection.\n- Linear projection model là mô hình camera, không liên quan đến phản xạ.\n- Xoay 90° quanh pháp tuyến không phải quy luật phản xạ nào."},{"id":199,"slide":225,"topic":"Phân đoạn & phân cụm","section":"Câu trung bình","question":"What role does the external energy term play in the Snake Model?","options":["It attracts the contour towards object boundaries.","It enforces smoothness in the contour of the snake.","It adjusts the intensity of edge pixels of the objects.","It penalizes deviations from a straight line."],"answer":[0],"explanation":"**Đáp án đúng: It attracts the contour towards object boundaries.** Snake (active contour) tối thiểu hoá $E = E_{int} + E_{ext}$; $E_{ext}$ (thường dựa trên gradient ảnh) kéo đường cong về biên đối tượng.\n- Làm trơn đường cong và phạt độ cong là việc của internal energy (elasticity, bending).\n- $E_{ext}$ không chỉnh cường độ pixel ảnh.\nMẹo nhớ: internal = hình dạng, external = ảnh."},{"id":200,"slide":226,"topic":"Phân đoạn & phân cụm","section":"Câu trung bình","question":"Which of the following disadvantages of Snake model?","options":["Sensitive to local minima states","Not works perfectly even for binary images","dependent","All of the above"],"answer":[3],"explanation":"**Đáp án đúng: All of the above.** Snake dễ kẹt ở local minima do tối ưu cục bộ, nhạy với khởi tạo đường cong ban đầu và tham số.\n- Mô hình cũng bị hạn chế ngay cả với ảnh nhị phân (ví dụ vùng lõm sâu).\n- Phương án \"dependent\" (phụ thuộc khởi tạo/tham số) cũng là nhược điểm, nên gộp cả ba.\nLưu ý: phương án \"dependent\" bị cắt chữ trong đề, nhưng đáp án \"All of the above\" vẫn hợp lý."},{"id":201,"slide":227,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu trung bình","question":"Which of the following algorithms is used for feature detection?","options":["Scale-Invariant Feature Transform (SIFT)","Harris Corner Detector","Features from Accelerated Segment Test (FAST)","All of the others"],"answer":[3],"explanation":"**Đáp án đúng: All of the others.** SIFT, Harris Corner Detector và FAST đều là thuật toán phát hiện đặc trưng (keypoint/corner).\n- SIFT phát hiện blob bất biến tỉ lệ bằng DoG.\n- Harris dùng ma trận cấu trúc để tìm góc.\n- FAST kiểm tra vòng pixel quanh điểm ứng viên, rất nhanh."},{"id":202,"slide":228,"topic":"Lọc ảnh & tích chập","section":"Câu trung bình","question":"How does anisotropic filtering affect textures viewed at oblique angles?","options":["It sharpens the texture details.","It blurs the texture details.","It introduces distortions.","It has no effect on oblique viewing angles."],"answer":[0],"explanation":"**Đáp án đúng: It sharpens the texture details.** Anisotropic filtering lấy mẫu theo hình elip thay vì hình vuông, nên texture ở góc nhìn xiên vẫn giữ độ nét.\n- Blur là đặc điểm của isotropic filtering (bilinear/trilinear/mipmap) ở góc xiên.\n- Không tạo méo, và có tác dụng rõ rệt ở góc xiên."},{"id":203,"slide":229,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Câu trung bình","question":"How does SIFT handle rotations for keypoint matching?","options":["By aligning keypoints based on dominant orientation","By rotating the entire image to a standard orientation","By using a fixed orientation for all keypoints","By discarding keypoints with varying orientations"],"answer":[0],"explanation":"**Đáp án đúng: By aligning keypoints based on dominant orientation.** SIFT gán cho mỗi keypoint một hướng chủ đạo từ histogram hướng gradient, rồi tính descriptor tương đối theo hướng đó nên bất biến xoay.\n- Không xoay toàn ảnh về hướng chuẩn.\n- Không dùng hướng cố định và không loại bỏ keypoint theo hướng."},{"id":204,"slide":230,"topic":"Lọc ảnh & tích chập","section":"Câu trung bình","question":"How does anisotropic filtering improve the image quality of textures on surfaces of computer graphics?","options":["By increasing blur for smoother textures","By eliminating aliasing effects at extreme viewing angles","By reducing details for better performance","By enhancing textures only at perpendicular viewing angles"],"answer":[1],"explanation":"**Đáp án đúng: By eliminating aliasing effects at extreme viewing angles.** Anisotropic filtering lấy mẫu dọc theo hướng méo của texture, giảm aliasing/blur khi bề mặt nhìn xiên.\n- Tăng blur là hạn chế của isotropic filtering.\n- Không nhằm giảm chi tiết để tăng hiệu năng.\n- Hiệu quả nhất ở góc xiên chứ không chỉ góc vuông."},{"id":205,"slide":231,"topic":"Miền tần số & Fourier","section":"Câu trung bình","question":"How does the sampling rate affect the representation of frequencie
