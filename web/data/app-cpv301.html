ng Viola-Jones sử dụng loại đặc trưng nào làm nền tảng trích xuất?","correct":"Đặc trưng Haar (Haar features / Haar Cascade)","wrong":["Bộ mô tả nhị phân BRIEF","Phân tích suy biến ma trận SVD","Biến đổi Cosine rời rạc DCT"],"explain":"Viola-Jones là thuật toán kinh điển dùng đặc trưng Haar (Haar Cascade), rất nổi tiếng trong phát hiện khuôn mặt truyền thống.","tip":"Viola-Jones gắn liền với đặc trưng Haar."},{"id":"r-m7-003","module":"m7","ref":"7.2","type":"recall","kind":"manual","q":"Trong các hướng tiếp cận bằng mạng nơ-ron sâu cho phát hiện đối tượng, nhóm mô hình One-stage Detectors (như YOLO, SSD) có ưu thế nổi bật nào so với họ Two-stage (R-CNN)?","correct":"Tốc độ xử lý cực nhanh đạt mức thời gian thực (real-time) do dự đoán trực tiếp tọa độ hộp và nhãn trong 1 bước","wrong":["Hoàn toàn không bao giờ bị ảnh hưởng bởi hiện tượng vật thể bị che khuất (occlusion)","Độ chính xác phân loại luôn cao hơn Faster R-CNN trong mọi bài toán y tế","Không cần dữ liệu huấn luyện có gán nhãn mà tự động học không giám sát"],"explain":"One-stage Detectors (SSD, YOLO) chạy 1 bước duy nhất dự đoán trực tiếp tọa độ hộp và nhãn, mang lại tốc độ cực nhanh (real-time).","tip":"One-stage (YOLO, SSD) = 1 bước dự đoán trực tiếp, tốc độ real-time."},{"id":"r-m7-004","module":"m7","ref":"7.2","type":"recall","kind":"manual","q":"Trong các thách thức của bài toán Phát hiện đối tượng, hiện tượng \"Occlusion\" được hiểu là gì?","correct":"Đối tượng bị che khuất một phần hoặc hoàn toàn bởi các vật cản khác trong khung cảnh","wrong":["Đối tượng thay đổi góc nhìn làm hình dáng trông khác hẳn so với lúc ban đầu","Phông nền xung quanh có kết cấu hoặc màu sắc bị lẫn vào chính đối tượng","Độ sáng của khung cảnh bị thay đổi đột ngột từ quá sáng sang quá tối"],"explain":"Occlusion là hiện tượng đối tượng bị che khuất bởi vật cản trong khung cảnh.","tip":"Occlusion = bị che khuất bởi vật cản."},{"id":"r-m7-005","module":"m7","ref":"7.2","type":"recall","kind":"manual","q":"Phương pháp phát hiện đối tượng truyền thống kết hợp bộ mô tả nào sau đây với bộ phân loại SVM để nhận diện người đi bộ?","correct":"Biểu đồ dốc hướng (Histogram of Oriented Gradients - HOG)","wrong":["Cây tứ phân Quadtree","Phân đoạn lưu vực Watershed","Bộ lọc song phương Bilateral Filter"],"explain":"Phương pháp truyền thống sử dụng biểu đồ dốc hướng (HOG) kết hợp với bộ phân loại SVM, đặc biệt thành công trong bài toán phát hiện người đi bộ.","tip":"HOG + SVM là cặp đôi kinh điển để phát hiện người đi bộ."},{"id":"r-m7-006","module":"m7","ref":"7.2","type":"recall","kind":"manual","q":"Trong hàm face_cascade.detectMultiScale(gray, scaleFactor=1.1, minNeighbors=5, minSize=(30, 30)) của OpenCV, ảnh đầu vào gray được xử lý ở định dạng nào?","correct":"Ảnh xám (Grayscale Image)","wrong":["Ảnh màu ba kênh BGR nguyên bản","Ảnh nhị phân sau khi phân ngưỡng nhị phân Otsu","Ảnh miền tần số sau khi biến đổi Fourier 2D"],"explain":"Bộ phân loại Haar Cascade của OpenCV nhận đầu vào là ảnh xám (grayscale) để phát hiện khuôn mặt.","tip":"Haar Cascade trong OpenCV nhận đầu vào là ảnh xám (Grayscale)."},{"id":"r-m7-007","module":"m7","ref":"7.3","type":"recall","kind":"manual","q":"Sự khác biệt cốt lõi giữa Phát hiện (Detection) và Nhận dạng (Recognition) trong thị giác máy tính là gì?","correct":"Detection trả lời câu hỏi đối tượng ở đâu, còn Recognition định danh đối tượng đó là ai hoặc thuộc thực thể cụ thể nào","wrong":["Detection chỉ dùng cho video thời gian thực, còn Recognition chỉ dùng cho các tệp hình ảnh tĩnh","Detection sử dụng mạng nơ-ron sâu, còn Recognition hoàn toàn không dùng bất kỳ thuật toán máy học nào","Detection chỉ tìm thấy đối tượng đơn lẻ, còn Recognition dùng để đếm số lượng người trong đám đông"],"explain":"Detection trả lời câu hỏi \"Ở đây có đối tượng không và nằm ở đâu?\", trong khi Recognition nhận biết, định danh thuộc tính ngữ nghĩa \"Khuôn mặt/đối tượng này là của ai?\".","tip":"Detection: tìm vị trí (ở đâu); Recognition: nhận danh tính (là ai)."},{"id":"r-m7-008","module":"m7","ref":"7.3","type":"recall","kind":"manual","q":"Thứ tự 4 bước chuẩn trong quy trình nhận dạng đối tượng (Object Recognition) là gì?","correct":"Trích xuất đặc trưng → Khớp đặc trưng với mô hình → Hình thành giả thuyết → Xác thực đối tượng","wrong":["Hình thành giả thuyết → Xác thực đối tượng → Trích xuất đặc trưng → Khớp đặc trưng với mô hình","Khớp đặc trưng với mô hình → Trích xuất đặc trưng → Lọc nhiễu Gaussian → Phân ngưỡng Otsu","Phân ngưỡng Canny → Tạo hộp bao Bounding Box → Khớp đặc trưng → Nhận dạng thực thể"],"explain":"4 bước nhận dạng đối tượng gồm: (1) Feature extraction → (2) Feature-model matching → (3) Hypotheses formation → (4) Object verification.","tip":"Quy trình nhận dạng: Trích xuất -> So khớp -> Giả thuyết -> Xác thực."},{"id":"r-m7-009","module":"m7","ref":"7.3","type":"recall","kind":"manual","q":"Phương pháp Eigenfaces kinh điển trong nhận dạng khuôn mặt toàn cục (Holistic Matching) được xây dựng dựa trên kỹ thuật toán học nào?","correct":"Phân tích thành phần chính (Principal Component Analysis - PCA)","wrong":["Biến đổi Cosine rời rạc (DCT)","Biến đổi Hough tọa độ cực","Thuật toán tái lấy mẫu ngẫu nhiên RANSAC"],"explain":"Phương pháp Eigenfaces sử dụng phân tích thành phần chính (PCA) để tính toán tập hợp các khuôn mặt cơ sở.","tip":"Eigenfaces = phương pháp nhận dạng khuôn mặt dựa trên PCA."},{"id":"r-m7-010","module":"m7","ref":"7.3","type":"recall","kind":"manual","q":"Trong phương pháp Eigenfaces, một khuôn mặt mới đưa vào hệ thống được biểu diễn toán học như thế nào?","correct":"Dưới dạng một tổ hợp tuyến tính của các vector khuôn mặt cơ sở (Eigenfaces)","wrong":["Dưới dạng một chuỗi các hàm sóng điều hòa sin và cosin trong không gian Fourier","Dưới dạng một đồ thị phân cấp Quadtree với 4 vùng con độc lập","Dưới dạng một vector nhị phân BRIEF trích xuất từ các điểm góc Harris"],"explain":"Một khuôn mặt mới đưa vào sẽ được biểu diễn dưới dạng tổ hợp tuyến tính của các Eigenfaces trong cơ sở dữ liệu để so sánh khoảng cách định danh.","tip":"Eigenfaces: biểu diễn ảnh mặt mới thành tổ hợp tuyến tính của các Eigenfaces."},{"id":"r-m7-011","module":"m7","ref":"7.3","type":"recall","kind":"manual","q":"Hướng tiếp cận Nhận dạng lai (Hybrid Methods) kết hợp những yếu tố nào để nâng cao độ chính xác nhận dạng khuôn mặt?","correct":"Kết hợp cả đặc điểm toàn cục (Holistic) và các đặc trưng hình học cục bộ","wrong":["Kết hợp bộ lọc thông thấp với bộ lọc thông cao trong miền tần số","Kết hợp cảm biến CCD với cảm biến CMOS trên cùng một thiết bị phần cứng","Kết hợp thuật toán nén JPEG có tổn thất với định dạng lưu trữ BMP không tổn thất"],"explain":"Phương pháp Lai (Hybrid Methods) kết hợp cả đặc điểm toàn cục (Holistic) và đặc trưng cục bộ để tăng độ chính xác nhận dạng.","tip":"Hybrid face recognition = Holistic (toàn cục) + Feature-based (cục bộ)."},{"id":"r-m7-012","module":"m7","ref":"7.4","type":"recall","kind":"manual","q":"Trong thị giác máy tính, nhiệm vụ cốt lõi của bài toán Theo dõi đối tượng (Object Tracking) trong video là gì?","correct":"Duy trì một ID duy nhất và liên tục cập nhật tọa độ hộp giới hạn của đối tượng qua các khung hình liên tiếp","wrong":["Phân loại lại toàn bộ các đối tượng trong từng khung hình bằng cách gán nhãn ngẫu nhiên mới","Căn chỉnh các khung hình video bằng cách tính ma trận Homography toàn cục","Chuyển đổi toàn bộ video sang miền tần số Fourier để khử bỏ hiện tượng rung lắc"],"explain":"Object Tracking lấy đầu vào là kết quả phát hiện ở frame đầu tiên, gán ID duy nhất và tiếp tục theo dõi tọa độ hộp giới hạn qua các frame tiếp theo trong khi vẫn duy trì đúng ID.","tip":"Object Tracking = bám sát tọa độ Bounding Box và duy trì đúng ID qua các frame."},{"id":"r-m7-013","module":"m7","ref":"7.4","type":"recall","kind":"manual","q":"Điểm khác biệt chính giữa kỹ thuật Theo dõi điểm (Point Tracking) và Theo dõi vùng (Kernel Tracking) là gì?","correct":"Point Tracking theo dõi các điểm đặc trưng rời rạc, còn Kernel Tracking theo dõi một vùng hình học cơ bản mang thông tin màu sắc hoặc kết cấu","wrong":["Point Tracking chỉ dùng cho ảnh tĩnh, còn Kernel Tracking chỉ dùng cho ảnh nén JPEG","Point Tracking tự động tạo ID mới ở mỗi khung hình, còn Kernel Tracking không duy trì ID","Point Tracking chỉ theo dõi được khuôn mặt, còn Kernel Tracking chỉ theo dõi được người đi bộ"],"explain":"Point Tracking biểu diễn đối tượng bằng các điểm đặc trưng liên tiếp; Kernel Tracking đại diện đối tượng bằng vùng hình học cơ bản (template/kernel) mang thông tin màu sắc, kết cấu.","tip":"Point Tracking: theo dõi các điểm; Kernel Tracking: theo dõi vùng hình học."},{"id":"r-m7-014","module":"m7","ref":"7.4","type":"recall","kind":"manual","q":"Thách thức \"Occlusion\" trong bài toán Theo dõi đối tượng (Object Tracking) có thể dẫn tới hậu quả nghiêm trọng nào sau đây?","correct":"Mất dấu đối tượng hoặc chuyển nhầm ID sang đối tượng che khuất","wrong":["Làm tăng độ phân giải hình ảnh lên gấp đôi gây tràn bộ nhớ đệm","Biến đổi hệ màu RGB của khung hình thành không gian màu HSV","Làm cho camera tự động đóng khẩu độ và giảm thời gian phơi sáng"],"explain":"Occlusion xảy ra khi đối tượng bị che mất hoàn toàn hoặc một phần bởi vật thể khác trong chốc lát, khiến ID bị mất hoặc chuyển nhầm sang đối tượng che khuất.","tip":"Occlusion trong tracking dễ làm mất dấu (lost) hoặc nhảy nhầm ID."},{"id":"r-m7-015","module":"m7","ref":"7.4","type":"recall","kind":"manual","q":"Trong mã nguồn OpenCV để theo dõi đối tượng, bộ theo dõi CSRT (cv2.TrackerCSRT_create()) được khởi tạo ở khung hình đầu tiên bằng phương thức nào?","correct":"tracker.init(frame, bbox)","wrong":["tracker.update(frame)","tracker.detect(frame, bbox)","tracker.train(frame)"],"explain":"Sau khi chọn ROI, ta gọi `tracker.init(frame, bbox)` để khởi tạo ở khung hình đầu, sau đó trong vòng lặp dùng `tracker.update(frame)` để cập nhật.","tip":"Tracker: init(frame, bbox) để khởi tạo, update(frame) để cập nhật."},{"id":"r-m7-016","module":"m7","ref":"7.4","type":"recall","kind":"manual","q":"Phép bẻ xiên (Shearing) trong biến đổi hình học ảnh gây ra tác động trực quan nào lên một hình chữ nhật ban đầu?","correct":"Kéo lệch hình ảnh dọc theo trục X hoặc trục Y, làm biến dạng hình chữ nhật thành hình bình hành","wrong":["Thu nhỏ kích thước hình chữ nhật về gốc tọa độ theo một tỷ lệ đồng dạng không đổi","Xoay hình chữ nhật một góc 90 độ quanh tâm mà không làm thay đổi các góc vuông","Phản chiếu hình chữ nhật qua mặt phẳng gương tạo ảnh đối xứng trục"],"explain":"Phép bẻ xiên (Shearing) là thao tác kéo lệch hình ảnh dọc theo trục X hoặc trục Y, làm biến dạng một hình chữ nhật ban đầu thành hình bình hành.","tip":"Shearing: kéo lệch theo trục X/Y, biến hình chữ nhật thành hình bình hành."},{"id":"r-m7-017","module":"m7","ref":"7.4","type":"recall","kind":"manual","q":"Điểm khác biệt căn bản giữa phép Tương quan (Correlation) và phép Tích chập (Convolution) về mặt ứng dụng thực tế là gì?","correct":"Phép tương quan không lật ngược mặt nạ kernel và thường được sử dụng nhiều nhất để đối chiếu mẫu (template matching)","wrong":["Phép tương quan lật ngược kernel 180 độ và chỉ dùng để phát hiện đường thẳng bằng biến đổi Hough","Phép tương quan chỉ áp dụng được trên ảnh đa phổ có độ sâu màu 16-bit","Phép tương quan tính giá trị trung vị của cửa sổ lân cận để khử nhiễu hạt tiêu"],"explain":"Phép tương quan có cơ chế toán học giống hệt tích chập nhưng mặt nạ kernel không bị lật ngược, thường được sử dụng nhiều nhất để đối chiếu, tìm kiếm một mẫu nhỏ trong ảnh lớn (template matching).","tip":"Correlation: không lật kernel, ứng dụng chính là template matching."},{"id":"r-m7-018","module":"m7","ref":"7.4","type":"recall","kind":"manual","q":"Bộ lọc Tái mẫu Trung bình Trọng số Elip (Elliptical Weighted Average - EWA) có công dụng đặc trưng nào trong xử lý ảnh?","correct":"Chống lại hiện tượng răng cưa cực kỳ hiệu quả khi thực hiện làm biến dạng (warping) ảnh","wrong":["Phân đoạn tế bào ung thư bằng cách mô phỏng bản đồ địa hình ngập nước","Tìm ma trận quay tối ưu trong không gian 3 chiều bằng phân tích suy biến SVD","Nhận diện khuôn mặt sinh trắc học dựa trên phân tích thành phần chính PCA"],"explain":"EWA là một bộ lọc tái mẫu không gian (resampling) tiên tiến giúp chống lại hiện tượng răng cưa cực kỳ hiệu quả khi làm biến dạng (warping) ảnh.","tip":"EWA (Elliptical weighted average) = chống răng cưa khi warping ảnh."},{"id":"r-m7-019","module":"m7","ref":"7.4","type":"recall","kind":"manual","q":"Hiện tượng Thị sai (Parallax) trong quá trình ghép ảnh Panorama được hiểu là gì và vì sao cần phải loại bỏ?","correct":"Là sự dịch chuyển tương đối của các vật thể ở khoảng cách khác nhau khi đổi góc nhìn, cần loại bỏ để tránh tạo ra bóng ma (ghosting)","wrong":["Là hiện tượng tràn sáng chói trên cảm biến CCD làm cho bức ảnh toàn cảnh bị cháy sáng hoàn toàn","Là sự sai lệch màu sắc do chiết suất thủy tinh thay đổi theo các bước sóng ánh sáng khác nhau","Là sự chênh lệch tần số giữa bộ lọc thông thấp và bộ lọc thông cao khi thực hiện nén ảnh JPEG"],"explain":"Thị sai (Parallax) là hiện tượng dịch chuyển tương đối của các vật thể ở khoảng cách khác nhau khi camera đổi góc nhìn; bắt buộc phải loại bỏ hiện tượng này để tránh tạo ra các bóng ma (ghosting) khi ghép ảnh panorama.","tip":"Parallax (thị sai) gây ra bóng ma (ghosting) khi ghép ảnh panorama."},{"id":"r-m7-020","module":"m7","ref":"7.5","type":"recall","kind":"manual","q":"Trong công thức tính điểm Harris Corner Score: R = det(M) - k * (Tr(M))^2, giá trị det(M) và Tr(M) được tính qua hai giá trị riêng λ1 và λ2 của ma trận cấu trúc M như thế nào?","correct":"det(M) = λ1 * λ2 và Tr(M) = λ1 + λ2","wrong":["det(M) = λ1 + λ2 và Tr(M) = λ1 * λ2","det(M) = λ1^2 + λ2^2 và Tr(M) = sqrt(λ1 * λ2)","det(M) = λ1 / λ2 và Tr(M) = λ1 - λ2"],"explain":"Định thức của ma trận cấu trúc M là det(M) = λ1 * λ2 và vết của ma trận là Tr(M) = λ1 + λ2, với tham số k thường chọn là 0.04.","tip":"Harris Corner: det(M) = λ1*λ2 và Tr(M) = λ1+λ2."},{"id":"r-m7-021","module":"m7","ref":"7.5","type":"recall","kind":"manual","q":"Ma trận biến đổi quay 2D trong không gian tọa độ đồng nhất [x, y, 1]^T với góc xoay θ ngược chiều kim đồng hồ có dạng biểu diễn nào?","correct":"[cosθ -sinθ 0 ; sinθ cosθ 0 ; 0 0 1]","wrong":["[cosθ sinθ 0 ; -sinθ cosθ 0 ; 0 0 1]","[1 0 cosθ ; 0 1 sinθ ; 0 0 1]","[cosθ 0 -sinθ ; 0 1 0 ; sinθ 0 cosθ]"],"explain":"Ma trận quay 2D ngược chiều kim đồng hồ trong hệ tọa độ đồng nhất là: hàng 1: [cosθ, -sinθ, 0]; hàng 2: [sinθ, cosθ, 0]; hàng 3: [0, 0, 1].","tip":"Ma trận quay 2D: [cosθ -sinθ 0; sinθ cosθ 0; 0 0 1]."},{"id":"r-m7-022","module":"m7","ref":"7.5","type":"recall","kind":"manual","q":"Khái niệm Vết của ma trận (Trace - Tr(A)) trong các công thức đại số của thị giác máy tính được định nghĩa là gì?","correct":"Tổng của tất cả các phần tử nằm trên đường chéo chính của ma trận","wrong":["Căn bậc hai của tổng bình phương tất cả các phần tử trong ma trận","Hiệu số giữa phần tử lớn nhất và phần tử nhỏ nhất của ma trận","Tích của tất cả các phần tử nằm ở cột ngoài cùng bên phải"],"explain":"Vết ma trận (Trace): Tr(A) = Σ A_ii, chính là tổng các phần tử nằm trên đường chéo chính.","tip":"Trace = tổng các phần tử trên đường chéo chính."},{"id":"r-m7-023","module":"m7","ref":"7.5","type":"recall","kind":"manual","q":"Chuẩn Frobenius (Frobenius Norm) của một ma trận số thực A được tính bằng công thức toán học nào?","correct":"Căn bậc hai của tổng bình phương tất cả các phần tử trong ma trận (sqrt[ Σ |A_ij|^2 ])","wrong":["Tổng giá trị tuyệt đối của các phần tử nằm trên đường chéo phụ của ma trận","Giá trị lớn nhất trong số các tổng theo từng hàng của ma trận","Tích của các định thức con cấp một của ma trận"],"explain":"Chuẩn Frobenius được tính bằng căn bậc hai của tổng bình phương tất cả các phần tử: ||A||_F = √[ Σ |A_ij|² ].","tip":"Frobenius norm = căn bậc hai tổng bình phương các phần tử."},{"id":"r-m7-024","module":"m7","ref":"7.6","type":"recall","kind":"manual","q":"Cho hai vector x = [2, 6, 6]^T và y = [1, 0, 1]^T, giá trị tích vô hướng (Dot Product) x · y bằng bao nhiêu?","correct":"8","wrong":["14","2","0"],"explain":"Tích vô hướng tính bằng tổng tích các phần tử tương ứng: x · y = (2 * 1) + (6 * 0) + (6 * 1) = 2 + 0 + 6 = 8.","tip":"Dot product: 2*1 + 6*0 + 6*1 = 8."},{"id":"r-m7-025","module":"m7","ref":"7.6","type":"recall","kind":"manual","q":"Cho hai ma trận A và B thỏa mãn mối quan hệ tuyến tính B_ij = A_ij + 100 đối với mọi phần tử, hệ số tương quan Pearson giữa A và B bằng bao nhiêu?","correct":"1.0","wrong":["0.0","0.5","-1.0"],"explain":"Vì B_ij = A_ij + 100 là một mối quan hệ tuyến tính hoàn hảo đồng biến, hệ số tương quan Pearson giữa hai ma trận đạt giá trị tối đa là 1.0.","tip":"Quan hệ tuyến tính hoàn hảo đồng biến -> hệ số tương quan Pearson = 1.0."},{"id":"r-m7-026","module":"m7","ref":"7.6","type":"recall","kind":"manual","q":"Ma trận A = [10, 20, 30; 40, 50, 60; 70, 80, 90] có định thức det(A) = 0. Kết luận nào sau đây là chính xác về ma trận A?","correct":"Ma trận A là ma trận suy biến (Singular matrix) và không khả nghịch (Non-invertible)","wrong":["Ma trận A là ma trận trực giao và có ma trận nghịch đảo bằng chính chuyển vị của nó","Ma trận A là ma trận đối xứng và có tất cả các giá trị riêng đều mang dấu âm","Ma trận A có hạng ma trận cực đại bằng 3 và có vô số nghiệm phân biệt"],"explain":"Vì định thức det(A) = 0 do các hàng phụ thuộc tuyến tính (cấp số cộng), ma trận A là ma trận suy biến và không thể khả nghịch (Non-invertible / Singular matrix).","tip":"det = 0 -> ma trận suy biến (singular), không khả nghịch (non-invertible)."},{"id":"r-m7-027","module":"m7","ref":"7.6","type":"recall","kind":"manual","q":"Vết ma trận (Trace) của ma trận A = [10, 20, 30; 40, 50, 60; 70, 80, 90] có giá trị bằng bao nhiêu?","correct":"150","wrong":["450","50","300"],"explain":"Trace của ma trận A là tổng các phần tử trên đường chéo chính: 10 + 50 + 90 = 150.","tip":"Trace(A) = 10 + 50 + 90 = 150."},{"id":"r-m7-028","module":"m7","ref":"7.6","type":"recall","kind":"manual","q":"Khi thực hiện phép quay một điểm ảnh theo chiều kim đồng hồ một góc 60 độ quanh gốc tọa độ, góc quay θ trong ma trận xoay được quy ước giá trị bằng bao nhiêu?","correct":"θ = -60°","wrong":["θ = +60°","θ = +120°","θ = -30°"],"explain":"Quy ước chuẩn trong toán học và đồ họa: xoay ngược chiều kim đồng hồ là góc dương, do đó xoay cùng chiều kim đồng hồ tương ứng góc âm θ = -60°.","tip":"Xoay cùng chiều kim đồng hồ mang dấu âm: θ = -60°."},{"id":"r-m7-029","module":"m7","ref":"7.6","type":"recall","kind":"manual","q":"Cho điểm ảnh có tọa độ ban đầu A(10, -10). Sau khi áp dụng phép thu phóng (Scaling) ảnh với hệ số tỉ lệ đồng dạng là 2, tọa độ mới A' là bao nhiêu?","correct":"A'(20, -20)","wrong":["A'(12, -8)","A'(5, -5)","A'(20, 10)"],"explain":"Công thức thu phóng: x' = s_x * x và y' = s_y * y. Với s = 2, ta có x' = 2 * 10 = 20 và y' = 2 * (-10) = -20.","tip":"Scaling 2 lần: (10 * 2, -10 * 2) = (20, -20)."},{"id":"r-m7-030","module":"m7","ref":"7.7","type":"recall","kind":"manual","q":"Cho mảng mức xám 1D gồm các giá trị [1, 3, 4, 5, 7, 8, 7, 12]. Giá trị trung vị (Median) của dãy số này bằng bao nhiêu?","correct":"6.0","wrong":["5.875","7.0","5.0"],"explain":"Sắp xếp dãy số tăng dần: [1, 3, 4, 5, 7, 7, 8, 12]. Vì có 8 phần tử (số chẵn), giá trị trung vị là trung bình cộng của 2 số ở giữa: (5 + 7) / 2 = 6.0.","tip":"Dãy sắp xếp: [1, 3, 4, 5, 7, 7, 8, 12] -> median = (5+7)/2 = 6.0."},{"id":"r-m7-031","module":"m7","ref":"7.7","type":"recall","kind":"manual","q":"Cho mảng mức xám [1, 3, 4, 5, 7, 8, 7, 12]. Giá trị yếu vị (Mode) của tập dữ liệu này là giá trị nào?","correct":"7","wrong":["1","5","12"],"explain":"Yếu vị (Mode) là giá trị xuất hiện nhiều lần nhất trong tập dữ liệu. Số 7 xuất hiện 2 lần (nhiều nhất), các số khác chỉ xuất hiện 1 lần.","tip":"Mode = giá trị xuất hiện nhiều nhất (ở đây là 7)."},{"id":"r-m7-032","module":"m7","ref":"7.7","type":"recall","kind":"manual","q":"Trong kỹ thuật Cân bằng lược đồ xám (Histogram Equalization) cho ảnh 8-bit, mức xám mới của một điểm ảnh có xác suất tích lũy CDF = 0.500 được chuẩn hóa thành giá trị nào?","correct":"128","wrong":["64","191","255"],"explain":"Công thức tính mức xám mới trong cân bằng histogram 8-bit là round(CDF * 255). Với CDF = 0.500, ta có 0.500 * 255 = 127.5 ≈ 128.","tip":"Mức xám mới = CDF * 255. 0.5 * 255 ≈ 128."},{"id":"r-m7-033","module":"m7","ref":"7.7","type":"recall","kind":"manual","q":"Cho dãy pixel A = [1, 3, 4, 5, 7, 8, 7, 12] với phần đệm zero padding ở hai đầu là [0, 1, 3, 4, 5, 7, 8, 7, 12, 0]. Khi áp dụng bộ lọc trung vị (Median Filter) kích thước cửa sổ 3x1 tại vị trí index 0 (cửa sổ gồm 0, 1, 3), giá trị đầu ra nhận được là bao nhiêu?","correct":"1","wrong":["0","3","2"],"explain":"Cửa sổ 3 phần tử tại index 0 là [0, 1, 3]. Dãy đã sắp xếp là 0, 1, 3 nên giá trị trung vị ở giữa là 1.","tip":"Cửa sổ [0, 1, 3] có trung vị là 1."},{"id":"r-m7-034","module":"m7","ref":"7.7","type":"recall","kind":"manual","q":"Khi thực hiện phép tích chập (Convolution) giữa tín hiệu 1D với kernel sai phân K = [-1, 0, 1], nếu thiết lập bước nhảy Stride = 2 thì kết quả đầu ra có đặc điểm gì so với Stride = 1?","correct":"Kích thước mảng kết quả giảm đi một nửa do chỉ lấy giá trị ở các bước nhảy cách một phần tử","wrong":["Tất cả các giá trị kết quả được nhân đôi biên độ cường độ sáng","Mảng kết quả bị đảo ngược thứ tự từ phải qua trái","Toàn bộ các giá trị âm được tự động gán bằng 0"],"explain":"Khi Stride = 2, phép toán chỉ lấy kết quả tại các bước nhảy cách 1 phần tử, làm giảm số lượng phần tử đầu ra đi khoảng một nửa.","tip":"Stride = 2 lấy cách 1 bước, làm giảm kích thước đầu ra một nửa."},{"id":"r-m7-035","module":"m7","ref":"7.8","type":"recall","kind":"manual","q":"Trong việc xấp xỉ đạo hàm bậc 1 của hàm số rời rạc, mặt nạ kernel nào sau đây đại diện cho phép tính sai phân trung tâm (Central Difference) f(x+1) - f(x-1)?","correct":"Kernel [-1, 0, 1]","wrong":["Kernel [0, -1, 1]","Kernel [-1, 1, 0]","Kernel [1, -2, 1]"],"explain":"Kernel [-1, 0, 1] trả về công thức f(x+1) - f(x-1), đại diện cho độ dốc qua điểm trung tâm (sai phân trung tâm).","tip":"Sai phân trung tâm (Central): [-1, 0, 1]."},{"id":"r-m7-036","module":"m7","ref":"7.8","type":"recall","kind":"manual","q":"Mặt nạ kernel tích chập [0, -1, 1] thực hiện phép tính toán đạo hàm rời rạc nào theo định nghĩa giải tích?","correct":"Phép sai phân tiến (Forward Difference) f(x+1) - f(x)","wrong":["Phép sai phân lùi (Backward Difference) f(x) - f(x-1)","Phép sai phân trung tâm (Central Difference) f(x+1) - f(x-1)","Phép tính đạo hàm bậc hai Laplacian f(x+1) - 2f(x) + f(x-1)"],"explain":"Tích chập với kernel [0, -1, 1] lật ngược lại trả về công thức f(x+1) - f(x), chính là sai phân tiến (Forward Difference).","tip":"Forward difference: kernel [0, -1, 1]."},{"id":"r-m7-037","module":"m7","ref":"7.8","type":"recall","kind":"manual","q":"Khi áp dụng bộ lọc sai phân trung tâm lên một dòng pixel, vị trí đường biên sắc nét nhất của đối tượng được xác định tại đâu?","correct":"Tại vị trí có giá trị thay đổi cường độ đạo hàm đạt đỉnh cực đại","wrong":["Tại vị trí có cường độ sáng đạt giá trị bằng không hoàn toàn","Tại vị trí có giá trị phương sai của cửa sổ lân cận nhỏ nhất","Tại vị trí có tần suất xuất hiện yếu vị Mode lớn nhất"],"explain":"Biên (Edge) nằm ở vị trí có giá trị thay đổi cường độ đột ngột và mạnh nhất, tương ứng với đỉnh đạo hàm cực đại.","tip":"Đỉnh cực đại của đạo hàm chính là vị trí biên sắc nét nhất."},{"id":"r-m7-038","module":"m7","ref":"7.8","type":"recall","kind":"manual","q":"Trong công thức tính góc hướng gradient θ = arctan(I_y / I_x), hai đại lượng I_x và I_y biểu diễn thành phần nào?","correct":"Đạo hàm (gradient) cường độ sáng của ảnh theo trục X và trục Y","wrong":["Tọa độ gốc của hai tâm cụm trong thuật toán phân cụm K-Means","Hai giá trị riêng của ma trận nghịch đảo affine","Bán kính và góc quét của đường tròn trong không gian Hough"],"explain":"I_x và I_y là đạo hàm riêng của cường độ sáng ảnh theo hai trục X và Y thu được từ các bộ lọc đạo hàm.","tip":"θ = arctan(I_y / I_x) là góc hướng gradient tạo bởi gradient trục Y và trục X."},{"id":"r-m7-039","module":"m7","ref":"7.8","type":"recall","kind":"manual","q":"Trong thuật toán Harris Corner Detector, khi giá trị điểm R nhận kết quả là một số âm đáng kể, điểm ảnh đó được phân loại là gì?","correct":"Biên (Edge)","wrong":["Góc (Corner)","Vùng phẳng (Flat)","Điểm nhiễu cô lập (Outlier)"],"explain":"Trong Harris Corner Detector: khi R âm (một giá trị riêng rất lớn so với giá trị kia), điểm đó thuộc về đường Biên (Edge); khi R dương lớn là Góc (Corner); khi R nhỏ là Vùng phẳng (Flat).","tip":"Harris Corner: R dương lớn -> Góc (Corner); R âm -> Biên (Edge); R nhỏ -> Vùng phẳng (Flat)."}],"bank":[{"id":1,"slide":9,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Hình ảnh, biểu đồ","question":"What is the formula to calculate normalized Laplacian of Gaussian?","options":["IV","I","III","II"],"answer":[1],"explanation":"**Đáp án đúng: I.** Trong lý thuyết scale-space, Normalized Laplacian of Gaussian (LoG) được nhân với hệ số tỉ lệ bậc hai $\\sigma^2$ (công thức $\\sigma^2 \\nabla^2 n_\\sigma * f$) để đảm bảo tính bất biến theo thang đo.\n- II sai vì chỉ nhân $\\sigma$, không đủ để chuẩn hoá biên độ đáp ứng theo thang đo.\n- III và IV sai do dùng sai toán tử vi phân (đạo hàm bậc một $\\nabla$ thay vì Laplacian $\\nabla^2$).\n- Mẹo nhớ: Normalized LoG chuẩn hoá bằng $\\sigma^2$.","img":"/api/img/cpv/009.png"},{"id":2,"slide":10,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Hình ảnh, biểu đồ","question":"How is the orientation of the gradient computed? (I: intensity at pixels, x: x coordinate of pixel, y: y coordinate of pixel)","options":["I","II","III","IV"],"answer":[1],"explanation":"**Đáp án đúng: II.** Hướng của gradient (orientation) được tính theo góc nghiêng arc-tangent: $\\theta = \\tan^{-1}\\left(\\frac{dI/dy}{dI/dx}\\right)$.\n- I sai vì chỉ là tỉ số biến thiên, chưa áp dụng hàm ngược lượng giác $\\tan^{-1}$.\n- III và IV sai do đảo ngược trục toạ độ ($dI/dx$ chia $dI/dy$).\n- Mẹo nhớ: Góc hướng $\\theta = \\tan^{-1}(\\Delta y / \\Delta x)$ (đối chia kề, trục y trên trục x).","img":"/api/img/cpv/010.png"},{"id":3,"slide":11,"topic":"Lọc ảnh & tích chập","section":"Hình ảnh, biểu đồ","question":"Which of the following kernels is used to detect oblique of +45 degrees in convolution based technique?","options":["III","I","II","IV"],"answer":[0],"explanation":"**Đáp án đúng: III.** Kernel III có các phần tử dương giá trị 2 nằm dọc theo đường chéo phụ (từ góc dưới-trái lên trên-phải), đặc trưng cho phát hiện đường nghiêng góc dương +45°.\n- I dùng để phát hiện đường kẻ ngang (0°).\n- II dùng để phát hiện đường kẻ dọc (90°).\n- IV có đường chéo chính mang giá trị 2, dùng để phát hiện đường góc -45° (hoặc 135°).\n- Mẹo nhớ: Đường chéo phụ hướng lên trên sang phải tương ứng góc dương +45°.","img":"/api/img/cpv/011.png"},{"id":4,"slide":12,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Hình ảnh, biểu đồ","question":"Given the integral image of an image (Figure 1).\nWhat is the sum of all pixels' intensity in a patch (red rectangle) shown in Figure 2?","options":["15","17","12","19"],"answer":[0],"explanation":"**Đáp án đúng: 15.** Áp dụng công thức Integral Image: $\\text{Sum} = I(D) - I(B) - I(C) + I(A)$. Vùng chữ nhật đỏ có góc dưới-phải $D(4,4)=57$, góc trên-phải $B(2,4)=27$, góc dưới-trái $C(4,2)=29$, góc trên-trái $A(2,2)=14$. Ta có: $57 - 27 - 29 + 14 = 15$.\n- 17, 12, 19 là các kết quả sai do chọn nhầm toạ độ hoặc quên bù lại vùng giao $A(2,2)$.\n- Mẹo nhớ: Công thức Integral Image: Dưới-Phải trừ Trên-Phải trừ Dưới-Trái cộng Trên-Trái ($D - B - C + A$).","img":"/api/img/cpv/012.png"},{"id":5,"slide":13,"topic":"Lọc ảnh & tích chập","section":"Hình ảnh, biểu đồ","question":"Given an image as follow. What is the filtered image as it is filtered by a mean filter with the size of 3x3?","options":["II","III","I","IV"],"answer":[3],"explanation":"**Đáp án đúng: IV.** Lọc trung bình 3×3 tính trung bình cộng của 9 pixel lân cận tại mỗi tâm cửa sổ: tâm (2,2) có tổng 24/9 ≈ 3; tâm (2,3) có tổng 31/9 ≈ 3; tâm (3,2) có tổng 38/9 ≈ 4. Kết quả làm tròn tương ứng chính xác ma trận IV.\n- I sai vì giá trị tại tâm bên phải là 2 (đúng phải là 3).\n- II sai vì phần tử hàng 3 cột 2 là 3 (đúng phải là 4).\n- III sai vì phần tử hàng 2 cột 1 là 4 (đúng phải là 3).","img":"/api/img/cpv/013.png"},{"id":6,"slide":14,"topic":"Ảnh số & thu nhận ảnh","section":"Nhiều đáp án","question":"What are the factors influencing the evolution of digital image processing? (2 options)","options":["Computer development","mathematical progress","Social media trends","Narrow range of a specific application"],"answer":[0,1],"explanation":"**Đáp án đúng: Computer development, mathematical progress.** Hai động lực nền tảng thúc đẩy sự phát triển của xử lý ảnh số là năng lực tính toán phần cứng máy tính và sự tiến bộ của các phương pháp toán học giải thuật.\n- `Social media trends` chỉ là xu hướng truyền thông xã hội hiện đại, không phải nhân tố bản chất ban đầu.\n- `Narrow range of a specific application` sai vì xử lý ảnh phát triển nhờ mở rộng phạm vi ứng dụng đa dạng chứ không hề hạn hẹp."},{"id":7,"slide":15,"topic":"Phân đoạn & phân cụm","section":"Điền vào chỗ trống","question":"______ is an idea that replaces each pixel with the mean of the pixels in a range neighborhood and whose value is within a distance d.","options":["Mean-shift","Watershed","K-mean","None of these"],"answer":[0],"explanation":"Đáp án A: Mean-shift, vì phép lọc này lấy trung bình các pixel lân cận thoả điều kiện gần nhau về vị trí và giá trị, rồi dịch về trung bình đó qua các bước lặp. Điều kiện khoảng cách d giúp hạn chế trộn các pixel quá khác nhau, nhờ đó có thể làm mượt mà vẫn giữ biên. K-means gán điểm vào các cụm quanh K tâm, còn Watershed phân đoạn theo các lưu vực nên không mô tả phép thay pixel bằng trung bình như đề bài."},{"id":8,"slide":16,"topic":"Biến đổi hình học & ghép ảnh","section":"Điền vào chỗ trống","question":"______ is perform fully automated image stitching is a technique to recognize which images actually go togethering","options":["Recognize panoramas","Object tracking","Recognize face","Object Detection"],"answer":[0],"explanation":"Đáp án A: Recognize panoramas, vì để image stitching hoàn toàn tự động, hệ thống phải nhận ra những ảnh nào có vùng nhìn chồng lấp và thuộc cùng một panorama. Việc này thường dựa vào feature matching và kiểm tra tính nhất quán hình học giữa các ảnh. Object tracking theo dõi đối tượng qua các khung hình, còn Recognize face và Object Detection nhận diện hoặc phát hiện đối tượng nên không giải quyết trực tiếp việc chọn nhóm ảnh để ghép panorama."},{"id":9,"slide":17,"topic":"Phân đoạn & phân cụm","section":"Điền vào chỗ trống","question":"______ is used to identify different classes or clusters in the given data based on how similar the data is.","options":["Feature descriptor","Watershed","Harris","K-means"],"answer":[3],"explanation":"Đáp án D: K-means, vì thuật toán phân cụm dữ liệu bằng cách gán mỗi điểm vào tâm cụm gần nhất rồi cập nhật các tâm để giảm tổng bình phương khoảng cách trong cụm. Các nhóm thu được dựa trên độ tương tự của dữ liệu, không cần nhãn lớp có sẵn. Feature descriptor biểu diễn đặc trưng, Harris phát hiện corner, còn Watershed phân đoạn theo địa hình ảnh nên K-means phù hợp nhất với mô tả phân cụm tổng quát này."},{"id":10,"slide":18,"topic":"Biến đổi hình học & ghép ảnh","section":"Điền vào chỗ trống","question":"______ is the process of combining multiple photographic images with overlapping fields of view to produce a segmented panorama or high-resolution image.","options":["Image preprocessing","Image subtraction","Image stitching","Image acquisition"],"answer":[2],"explanation":"Đáp án C: Image stitching, vì đây là quá trình căn chỉnh và ghép nhiều ảnh có vùng nhìn chồng lấp để tạo panorama hoặc ảnh có độ phân giải cao hơn. Các bước điển hình gồm tìm điểm tương ứng, ước lượng phép biến đổi hình học và blending vùng chồng lấp. Image acquisition chỉ thu nhận ảnh, Image subtraction lấy hiệu giữa các ảnh, còn Image preprocessing là nhóm thao tác chuẩn bị ảnh nói chung."},{"id":11,"slide":19,"topic":"Biến đổi hình học & ghép ảnh","section":"Điền vào chỗ trống","question":"______ is a parameter estimation approach designed to cope with a large proportion of outliers in the input data","options":["RANSAC","Mean shift","K-mean","Canny edge detection"],"answer":[0],"explanation":"Đáp án A: RANSAC, vì thuật toán ước lượng mô hình từ nhiều tập mẫu nhỏ được chọn ngẫu nhiên và đánh giá số inliers ủng hộ từng mô hình. Nhờ chọn mô hình có tập đồng thuận tốt, RANSAC có thể chịu được tỷ lệ outliers lớn nếu có đủ số lần thử. Mean shift và K-means chủ yếu tìm cụm, còn Canny edge detection tìm biên nên không phải phương pháp ước lượng tham số chống outliers được hỏi."},{"id":12,"slide":20,"topic":"Biến đổi hình học & ghép ảnh","section":"Điền vào chỗ trống","question":"______ is a computationally intensive procedure that focuses on outliers in the regressor variables","options":["MM-estimation","M-estimation","S-estimation","All of the above"],"answer":[2],"explanation":"**Đáp án đúng: S-estimation.** `S-estimation` là phương pháp ước lượng thống kê mạnh mẽ, chuyên sâu tính toán tập trung kiểm soát các điểm ngoại lai trong biến giải thích (leverage points / regressor variables) với hệ số đổ vỡ cao.\n- `M-estimation` dễ bị ảnh hưởng bởi ngoại lai trong các biến giải thích.\n- `MM-estimation` kết hợp giữa S-estimation và M-estimation để cân bằng giữa độ bền vững và hiệu quả thống kê."},{"id":13,"slide":21,"topic":"Phân đoạn & phân cụm","section":"Điền vào chỗ trống","question":"______ is the process of dividing an image into different regions based on the characteristics of pixels to identify objects or boundaries to simplify an image and more efficiently analyze it. Choose the best correct answer","options":["Image segmentation","Image analysis","Object detection","Object recognition"],"answer":[0],"explanation":"Đáp án A: Image segmentation, vì mục tiêu là chia ảnh thành các vùng có đặc tính pixel tương đồng để đơn giản hoá việc phân tích đối tượng và ranh giới. Kết quả thường là nhãn vùng cho các pixel hoặc một tập vùng phân đoạn. Image analysis là khái niệm rộng hơn, còn Object detection và Object recognition tập trung vào tìm vị trí hoặc xác định loại đối tượng, không đồng nghĩa với chia ảnh thành các vùng."},{"id":14,"slide":22,"topic":"Lọc ảnh & tích chập","section":"Điền vào chỗ trống","question":"______ is a method of enhancing the image quality of textures on surfaces of computer graphics that are at oblique viewing angles with respect to the camera where the projection of the texture. Choose the best answer","options":["MIP Mapping filter","Elliptical Weighted Average (EWA) filter","Anisotropic filtering","Gaussian White filter"],"answer":[2],"explanation":"**Đáp án đúng: Anisotropic filtering.** `Anisotropic filtering` (lọc dị hướng) là kỹ thuật nâng cao chất lượng vân bề mặt (texture) khi quan sát ở các góc nhìn xiên (oblique viewing angles) so với camera.\n- `MIP Mapping filter` là kỹ thuật tiền tính toán texture đẳng hướng, dễ gây mờ khi góc nhìn quá nghiêng.\n- `Gaussian White filter` không dùng để lọc texture theo hướng nhìn 3D.\n- `Elliptical Weighted Average (EWA) filter` là một giải thuật cụ thể thuộc nhóm này, nhưng câu hỏi hỏi về phương pháp tổng quát."},{"id":15,"slide":23,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Điền vào chỗ trống","question":"______ is a technique of image processing used to identify points in a digital image with discontinuities ~ sharp changes in the image brightness. Choose the best answer","options":["Peak detector","Peak descriptor","Edge detection.","Edge descriptor"],"answer":[2],"explanation":"Đáp án C: Edge detection, vì quá trình này xác định các vị trí có biến thiên cường độ sáng mạnh để tạo bản đồ biên của ảnh. Gradient lớn hoặc zero-crossing của đạo hàm bậc hai có thể được dùng làm dấu hiệu biên tuỳ phương pháp. Peak detector chỉ tìm các cực đại, còn Edge descriptor và Peak descriptor biểu diễn thuộc tính đặc trưng nên không thay thế bước phát hiện các điểm gián đoạn độ sáng."},{"id":16,"slide":25,"topic":"Lọc ảnh & tích chập","section":"Điền vào chỗ trống","question":"______ is a function or operator that takes an image as its input and produces an image as its output. Choose the best answer","options":["Geometric transformation","Image transformation","Geometric computing","Image computing"],"answer":[1],"explanation":"Đáp án B: Image transformation, vì đây là khái niệm tổng quát cho một hàm hoặc toán tử nhận ảnh đầu vào và tạo ảnh đầu ra. Nó có thể thay đổi giá trị pixel hoặc quan hệ không gian giữa các pixel. Geometric transformation chỉ là nhóm biến đổi hình học như xoay, tịnh tiến hay co giãn, còn Geometric computing và Image computing không phải tên chính xác của ánh xạ ảnh được mô tả."},{"id":17,"slide":26,"topic":"Khác","section":"Điền vào chỗ trống","question":"______ is the process by which an existing graph, or graphed equation, is modified to produce a variation of the proceeding graph. Choose the best answer","options":["Graph transformation","Image transformation","Graph computing","Image computing"],"answer":[0],"explanation":"Đáp án A: Graph transformation, vì câu hỏi mô tả việc biến đổi một đồ thị hoặc phương trình đã biểu diễn thành một biến thể của chính đồ thị đó. Các phép tịnh tiến, phản xạ hoặc co giãn đồ thị là những ví dụ điển hình. Image transformation nhận ảnh làm đối tượng biến đổi, còn Graph computing và Image computing là các khái niệm tính toán rộng hơn nên không phải tên chính xác của quá trình được định nghĩa."},{"id":18,"slide":28,"topic":"Biến đổi hình học & ghép ảnh","section":"Điền vào chỗ trống","question":"______ is an image that is meant to be viewed as if seen through the inside of a cylinder. You can look at the image horizontally at a 360 degree. Choose the best correct answer","options":["Cylindrical projection","Cylindrical viewing","Cylindrical panoramic","None of the others"],"answer":[0],"explanation":"**Đáp án đúng: Cylindrical projection.** `Cylindrical projection` (phép chiếu hình trụ) là kỹ thuật chiếu ảnh tạo cảm giác quan sát từ lòng hình trụ, cho phép góc nhìn xoay ngang toàn cảnh 360 độ mà không làm méo dọc.\n- `Cylindrical panoramic` chỉ ảnh toàn cảnh hình trụ thành phẩm, câu hỏi nhấn mạnh vào phép chiếu/dạng hiển thị.\n- `Cylindrical viewing` không phải là thuật ngữ kỹ thuật chuẩn trong đồ hoạ thị giác máy tính."},{"id":19,"slide":29,"topic":"Phân đoạn & phân cụm","section":"Điền vào chỗ trống","question":"______ are probabilistic models and use the soft clustering approach for distributing the points in different clusters. Choose the best answer","options":["K-mean clustering model","SVN model","Gaussian Mixture Models","K- nearest model"],"answer":[2],"explanation":"Đáp án C: Gaussian Mixture Models, vì GMM mô hình hoá dữ liệu bằng hỗn hợp các phân phối Gaussian và gán cho mỗi điểm xác suất thuộc từng cụm. Đó là soft clustering: một điểm có thể có mức độ thuộc nhiều cụm thay vì chỉ nhận một nhãn cứng. K-means thông thường dùng hard assignment, SVN model không phải tên mô hình chuẩn cho mô tả này, còn K-nearest thường dựa vào các láng giềng để dự đoán nên không biểu diễn dữ liệu bằng hỗn hợp Gaussian."},{"id":20,"slide":30,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Điền vào chỗ trống","question":"______ can be used to find a sparse set of corresponding locations in different images. Choose the best answer","options":["Edge features","Line features","Object features","Point features"],"answer":[3],"explanation":"Đáp án D: Point features, vì các điểm nổi bật như corner hoặc keypoint có thể được phát hiện và đối sánh giữa các ảnh để tạo một tập tương ứng thưa. Vị trí điểm được xác định trong hai chiều giúp ước lượng các phép biến đổi hình học. Edge features và Line features biểu diễn đường hoặc biên, thường khó xác định duy nhất vị trí tương ứng dọc theo đường, còn Object features quá tổng quát so với yêu cầu về các vị trí thưa."},{"id":21,"slide":31,"topic":"Biến đổi hình học & ghép ảnh","section":"Điền vào chỗ trống","question":"An ______ is a transformation that preserves collinearity and the ratio of distances. Choose the best answer","options":["Projective transformation","Euclidean transformation","Affine transformation","Similarity transformation"],"answer":[2],"explanation":"**Đáp án đúng: Affine transformation.** `Affine transformation` (biến đổi affin) là phép biến đổi hình học bảo toàn tính thẳng hàng (collinearity) và tỉ số khoảng cách giữa các điểm trên cùng một đường thẳng.\n- `Projective transformation` (Homography) bảo toàn tính thẳng hàng nhưng không bảo toàn tỉ số khoảng cách hay tính song song.\n- `Euclidean transformation` và `Similarity transformation` bảo toàn độ dài thực tế hoặc góc.\n- Mẹo nhớ: Affine bảo toàn tính thẳng hàng (collinearity) và tỉ số khoảng cách song song."},{"id":22,"slide":32,"topic":"Biến đổi hình học & ghép ảnh","section":"Điền vào chỗ trống","question":"An interesting application of image stitching is the ability to ______ taken with a panning camera","options":["Video Brush system","Multiple-image stitching","Panoramic video textures","Summarize and compress videos"],"answer":[3],"explanation":"Đáp án D: Summarize and compress videos, vì image stitching có thể căn chỉnh các khung hình chồng lấp từ panning camera và gộp nội dung cảnh thành biểu diễn panorama. Biểu diễn này giúp tóm tắt trường nhìn và giảm việc lưu lặp lại các vùng nền xuất hiện trong nhiều khung hình. Video Brush system là tên một hệ thống, Multiple-image stitching chỉ mô tả thao tác ghép ảnh, còn Panoramic video textures là một ứng dụng khác nên D hoàn chỉnh ý về khả năng tóm tắt và nén video trong câu này."},{"id":23,"slide":33,"topic":"Lọc ảnh & tích chập","section":"Điền vào chỗ trống","question":"In a ______, the line detector operator consists of a convolution mask tuned to detect the presence of lines of a particular width n and a θ orientation. Choose the best correct answer","options":["Content-based techniques","Gaussian technique","Convolution based technique","Edge detection technique"],"answer":[2],"explanation":"**Đáp án đúng: Convolution based technique.** Trong kỹ thuật dựa trên tích chập (`Convolution based technique`), toán tử phát hiện đường thẳng gồm một ma trận tích chập được căn chỉnh theo độ rộng n và hướng $\\theta$ cụ thể.\n- `Gaussian technique` là bộ lọc làm mịn làm mờ đẳng hướng.\n- `Edge detection technique` là bài toán biên rộng hơn, không chuyên biệt hóa thành mặt nạ đường với bề rộng n và góc $\\theta$ định sẵn.\n- `Content-based techniques` thường dùng cho truy vấn ảnh theo nội dung."},{"id":24,"slide":34,"topic":"Nhận dạng & học máy","section":"Điền vào chỗ trống","question":"Object recognition consists of ______ objects within a picture with a given degree of confidence. Choose the best correct answer","options":["Detection, identifying, and locating","Identifying, and locating","Detection and locating","Recognizing, identifying, and locating"],"answer":[0],"explanation":"Đáp án A: Detection, identifying, and locating, vì theo cách diễn đạt của câu hỏi, Object recognition gồm phát hiện sự hiện diện, xác định đối tượng và tìm vị trí của nó trong ảnh với một mức độ tin cậy. Ba thành phần này trả lời các câu hỏi có đối tượng hay không, đó là gì và ở đâu. B bỏ thành phần Detection, C bỏ Identifying, còn D dùng Recognizing để định nghĩa lại recognition nên không diễn đạt rõ ba nhiệm vụ như A."},{"id":25,"slide":35,"topic":"Ảnh số & thu nhận ảnh","section":"Điền vào chỗ trống","question":"The dynamic range of the imaging system is a quantitative relation where the upper limit can be determined by ____","options":["Saturation","Contrast","Noise","Brightness"],"answer":[0],"explanation":"Đáp án A: Saturation, vì giới hạn trên của dynamic range là mức tín hiệu lớn nhất hệ thống còn ghi nhận được trước khi bị bão hoà hoặc clipping. Khi vượt mức này, tăng cường độ đầu vào không còn tạo ra giá trị đo phân biệt được. Noise quyết định giới hạn dưới, còn Contrast và Brightness mô tả đặc tính ảnh chứ không phải cơ chế giới hạn trên của hệ thống thu nhận."},{"id":26,"slide":36,"topic":"Lọc ảnh & tích chập","section":"Điền vào chỗ trống","question":"The ______ is based on the observation that the affine mapping x = Ax' defines a skewed two-dimensional coordinate system in the vicinity of each source pixel x. Choose the best answer","options":["MIP Mapping filter","Gaussian White filter","Elliptical Weighted Average (EWA) filter","Multi pass filter"],"answer":[2],"explanation":"Đáp án C: Elliptical Weighted Average (EWA) filter, vì ánh xạ affine cục bộ biến một vùng lấy mẫu tròn thành một ellipse có hướng và độ kéo giãn phụ thuộc phép biến đổi. EWA lấy trung bình có trọng số trên vùng ellipse đó để giảm aliasing khi resampling. MIP Mapping chủ yếu dùng các mức ảnh đã giảm độ phân giải, còn Gaussian White filter và Multi pass filter không đặc tả footprint ellipse thích nghi với ánh xạ affine này."},{"id":27,"slide":37,"topic":"Phân đoạn & phân cụm","section":"Điền vào chỗ trống","question":"The ______ treats the image it operates upon like a topographic map, with the brightness of each point representing its height, and finds the lines that run along the tops of ridges. Choose the best correct answer","options":["Image transformation","Heuristic transformation","Hybrid transformation","Watershed transformation"],"answer":[3],"explanation":"Đáp án D: Watershed transformation, vì phương pháp này xem mức sáng như độ cao trên một bề mặt địa hình và chia ảnh thành các lưu vực. Khi các lưu vực được mở rộng và gặp nhau, đường phân thuỷ tạo ranh giới dọc theo các gờ ngăn cách vùng. Image transformation quá tổng quát, còn Heuristic transformation và Hybrid transformation không phải tên của phương pháp phân đoạn dựa trên mô hình địa hình này."},{"id":28,"slide":38,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Điền vào chỗ trống","question":"The ______ is a measure of change in a function, and an image can be considered to be an array of samples of some continuous function of image intensity. Choose the best answer","options":["Gradient","Edge","Grayscale","Contour"],"answer":[0],"explanation":"Đáp án A: Gradient, vì gradient là vector đạo hàm riêng cho biết hướng và tốc độ tăng nhanh nhất của hàm cường độ ảnh. Độ lớn gradient đo mức biến thiên cục bộ nên thường được dùng để phát hiện biên. Edge và Contour là cấu trúc hoặc tập điểm trong ảnh, còn Grayscale là cách biểu diễn mức xám nên không phải đại lượng đạo hàm đo sự thay đổi của hàm."},{"id":29,"slide":39,"topic":"Phân đoạn & phân cụm","section":"Điền vào chỗ trống","question":"The basic idea of ______ is to break the image into a set of disjoint regions which are coherent within themselves. Choose the best correct answer","options":["Region combination","Object combination","Region splitting","Object splitting"],"answer":[2],"explanation":"Đáp án C: Region splitting, vì phương pháp này bắt đầu từ một vùng rồi chia tiếp các vùng chưa thoả tiêu chí đồng nhất để thu được các vùng rời nhau và nhất quán bên trong. Một cách thực hiện phổ biến là chia theo quadtree dựa trên tiêu chí cường độ hoặc độ biến thiên. Region combination mô tả việc gộp vùng theo chiều ngược lại, còn Object combination và Object splitting nói về đối tượng thay vì thao tác phân vùng ảnh được hỏi."},{"id":30,"slide":40,"topic":"Ảnh số & thu nhận ảnh","section":"Điền vào chỗ trống","question":"The lower limit of the dynamic range ratio can be determined by ____","options":["Contrast","Saturation","Noise","Brightness"],"answer":[2],"explanation":"Đáp án C: Noise, vì giới hạn dưới của dynamic range là mức tín hiệu yếu nhất còn phân biệt được với noise floor của hệ thống. Dưới mức này, tín hiệu bị nhiễu che lấp nên các thay đổi nhỏ không còn được đo tin cậy. Saturation đặt giới hạn trên, còn Contrast và Brightness không xác định ngưỡng tín hiệu tối thiểu của hệ thống."},{"id":31,"slide":41,"topic":"Ảnh số & thu nhận ảnh","section":"Câu ngắn","question":"Which of the following statement is TRUE?","options":["Computer vision focuses on low-level operations such as filtering and noise reduction, while image processing involves high-level understanding and decision-making from visual data.","Computer vision and image processing are the same and used interchangeably in the context of analyzing visual data.","Computer vision aims to interpret and make decisions based on visual data, while image processing involves manipulating and transforming pixel data in images.","Image processing focuses on understanding and interpreting images, while computer vision involves operations like noise reduction and edge detection."],"answer":[2],"explanation":"Đáp án C: Computer vision hướng đến diễn giải và đưa ra quyết định từ dữ liệu thị giác, còn image processing tập trung vào thao tác hoặc biến đổi dữ liệu pixel. Ví dụ, nhận dạng đối tượng là nhiệm vụ computer vision, trong khi giảm nhiễu hoặc lọc ảnh là các thao tác image processing. A và D đảo vai trò điển hình của hai lĩnh vực, còn B đồng nhất chúng dù computer vision thường sử dụng image processing như một bước trong quy trình rộng hơn."},{"id":32,"slide":42,"topic":"Biến đổi hình học & ghép ảnh","section":"NOT / EXCEPT","question":"Which of the following is NOT an application of image alignment?","options":["Identifying document templates","Generating panorama images","Comparing multiple scans of tissue taken at different times","Enhancing scanned or photographed documents"],"answer":[0],"explanation":"Đáp án A: Identifying document templates. Image alignment (căn chỉnh ảnh) dùng để ghép các ảnh thành panorama, so sánh các ảnh quét của cùng một mô tại các thời điểm khác nhau và chỉnh lại tài liệu được chụp hoặc quét cho thẳng, rõ. Còn nhận diện mẫu tài liệu là bài toán nhận dạng, phân loại chứ không phải ứng dụng của căn chỉnh ảnh, nên đó là lựa chọn \"không phải\" (NOT) cần tìm."},{"id":33,"slide":44,"topic":"Lọc ảnh & tích chập","section":"NOT / EXCEPT","question":"What is not related to Elliptical Weighted Average (EWA) algorithm?","options":["Affine mapping computation","Skewed two-dimensional coordinate system","Inverse covariance matrix for pixel grids","Circle projection of destination pixels"],"answer":[3],"explanation":"**Đáp án đúng: Circle projection of destination pixels.** Thuật toán EWA sử dụng phép chiếu hình elip (elliptical footprint) do biến dạng từ phép ánh xạ affin, chứ không dùng hình tròn (`Circle projection`).\n- `Affine mapping computation`, `Skewed two-dimensional coordinate system` và `Inverse covariance matrix for pixel grids` đều là các thành phần cốt lõi trong xây dựng bộ lọc elip của Heckbert."},{"id":34,"slide":45,"topic":"Biến đổi hình học & ghép ảnh","section":"NOT / EXCEPT","question":"What is not true about image stitching?","options":["It is the process of combining multiple photographic images with overlapping fields of view","It is used in forensic and investigate science for the reconstruction of torn paper","It is used to complete mapping of a particular place","It maps two pixels that have similar intensity from two adjacent images"],"answer":[3],"explanation":"**Đáp án đúng: It maps two pixels that have similar intensity from two adjacent images.** Ghép ảnh (Image stitching) căn chỉnh dựa trên sự tương đồng về đặc trưng hình học và vector mô tả (feature matching/homography), không thể chỉ dựa vào hai pixel có mức xám giống nhau vì cường độ sáng dễ trùng lặp ngẫu nhiên và biến đổi theo ánh sáng.\n- Các phương án còn lại đều mô tả chính xác mục tiêu ghép ảnh toàn cảnh và ứng dụng khôi phục tài liệu rách."},{"id":35,"slide":46,"topic":"Nhận dạng & học máy","section":"NOT / EXCEPT","question":"What is not true object detection?","options":["It is the task of detecting instances of objects of a certain class within an image","It allows to identify and locate objects in a video","It recognizes with a contour in the image","It detects instances of semantic objects of a certain class"],"answer":[2],"explanation":"**Đáp án đúng: It recognizes with a contour in the image.** Phát hiện đối tượng (Object Detection) chỉ định vị đối tượng bằng hộp bao toạ độ (bounding box) và nhãn lớp; việc tìm đường bao biên chi tiết từng pixel (contour) là nhiệm vụ của phân đoạn đối tượng (Instance / Semantic Segmentation).\n- Các lựa chọn còn lại đều mô tả đúng bản chất phát hiện và định vị các thể hiện đối tượng ngữ nghĩa."},{"id":36,"slide":47,"topic":"Biến đổi hình học & ghép ảnh","section":"NOT / EXCEPT","question":"What is not true about RANSAC algorithm?","options":["It estimates the parameter to deal with a large number of outliers","It generates candidate solutions by using the maximum number of data points required to estimate the underlying model parameters","It selects data items randomly and then find how many data items fit the model","If the tolerance is big enough, the algorithm will accept fit and exit with success"],"answer":[1],"explanation":"**Đáp án đúng: It generates candidate solutions by using the maximum number of data points required to estimate the underlying model parameters.** RANSAC chọn tập mẫu ngẫu nhiên với số lượng điểm tối thiểu (MINIMUM number of data points, ví dụ 4 điểm cho homography, 2 điểm cho đường thẳng) để sinh nghiệm ứng viên, chứ không phải số điểm tối đa (maximum).\n- Các phương án còn lại đều mô tả chính xác cơ chế chọn ngẫu nhiên, đếm số inlier và ước lượng tham số chống ngoại lai của RANSAC.\n- Mẹo nhớ: RANSAC dùng tập mẫu tối thiểu (minimum subset) để sinh nghiệm."},{"id":37,"slide":48,"topic":"Phân đoạn & phân cụm","section":"Công thức","question":"What is true about Gaussian mixture models?","options":["It considers the distributions as the sum of several Gaussian models","It analyzes the distribution into the product of several Gaussian models","It considers the intensity of each pixel as the sum of several Gaussian models","It analyzes the intensity of each pixel into the product of several Gaussian models"],"answer":[0],"explanation":"Gaussian Mixture Model (GMM)\n mô hình hóa phân phối dữ liệu như tổng (weighted sum)\n của nhiều phân phối Gaussian:"},{"id":38,"slide":52,"topic":"Chuyển động & optical flow","section":"NOT / EXCEPT","question":"Which type of information does Optical Flow NOT provide?","options":["Acceleration of objects","Velocity of pixel motion","Direction of pixel motion","Location of keypoints"],"answer":[0],"explanation":"**Đáp án đúng: Acceleration of objects.** Dòng quang (Optical Flow) chỉ biểu diễn trường vector vận tốc chuyển động biểu kiến tức thời của pixel giữa 2 khung hình liên tiếp ($u = dx/dt, v = dy/dt$), không tính toán đạo hàm bậc hai để xác định gia tốc (acceleration).\n- `Velocity of pixel motion` và `Direction of pixel motion` chính là độ lớn và góc pha của vector dòng quang.\n- `Location of keypoints` liên quan đến sparse optical flow (như Lucas-Kanade).\n- Mẹo nhớ: Optical flow cung cấp vận tốc tức thời, không cung cấp gia tốc."},{"id":39,"slide":54,"topic":"Phân đoạn & phân cụm","section":"Câu ngắn","question":"\"Gaussian Mixture Model\" models each cluster to a Gaussian distribution with a specific mean and variance","options":["True","False"],"answer":[0],"explanation":"**Đáp án đúng: True.** Đúng, Gaussian Mixture Model (GMM) biểu diễn phân bố của từng cụm dữ liệu dưới dạng một hàm mật độ xác suất phân phối chuẩn Gaussian với kỳ vọng (mean $\\mu$) và phương sai/ma trận hiệp phương sai (variance $\\Sigma$) xác định.\n- `False` sai vì đây là nguyên lý toán học nền tảng của phân cụm mềm bằng GMM."},{"id":40,"slide":55,"topic":"Phân đoạn & phân cụm","section":"Câu ngắn","question":"If _____ split the area of interest (usually into four equal sub-areas) and consider each of the sub-areas as the area of interest in turn.","options":["True","False"],"answer":[0],"explanation":"**Đáp án đúng: True.** Đây là nguyên lý của phương pháp phân tách vùng bằng cây tứ phân (Quadtree Split-and-Merge): nếu vùng quan tâm không thoả mãn điều kiện đồng nhất, thuật toán sẽ chia vùng đó thành 4 vùng con bằng nhau để tiếp tục xét duyệt đệ quy.\n- `False` sai vì phát biểu phản ánh chính xác cơ chế phân rã trong phân đoạn vùng ảnh."},{"id":41,"slide":56,"topic":"Biến đổi hình học & ghép ảnh","section":"Câu ngắn","question":"Cylindrical is used if the camera is level and we have only rotation around its vertical axis","options":["True","False"],"answer":[0],"explanation":"**Đáp án đúng: True.** Đúng, phép chiếu hình trụ (Cylindrical projection) được áp dụng khi camera được đặt thăng bằng nằm ngang và chỉ xoay quanh trục thẳng đứng duy nhất (pure panning) để tạo ảnh toàn cảnh 360 độ liền mạch.\n- `False` sai vì nếu camera bị nghiêng hoặc lắc trục, phép chiếu hình trụ cơ bản sẽ bị biến dạng đường chân trời."},{"id":42,"slide":58,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Dạng số","question":"What is the typical size (dimensionality) of a descriptor vector generated by the SIFT algorithm?","options":["128","64","256","512"],"answer":[0],"explanation":"**Đáp án đúng: 128.** SIFT chia vùng lân cận 16×16 xung quanh keypoint thành lưới 4×4 ô con, mỗi ô tính histogram định hướng gồm 8 hướng gradient, tạo thành vector đặc trưng có số chiều: $4 \\times 4 \\times 8 = 128$.\n- 64 là số chiều vector mô tả chuẩn của SURF.\n- 256 và 512 là số chiều của các bộ mô tả khác hoặc trích xuất từ mạng học sâu.\n- Mẹo nhớ: SIFT = 4x4 ô x 8 hướng = 128 chiều; SURF = 64 chiều."},{"id":43,"slide":59,"topic":"Màu sắc & histogram","section":"Dạng số","question":"What is the range of the spectrum that humans can see as colors?","options":["200nm- 500nm","300nm- 600nm","400nm-700nm","500nm- 900nm"],"answer":[2],"explanation":"**Đáp án đúng: 400nm-700nm.** Dải quang phổ ánh sáng khả kiến mà mắt người có thể cảm nhận màu sắc nằm trong khoảng bước sóng từ xấp xỉ 400 nm (ánh sáng tím) đến 700 nm (ánh sáng đỏ).\n- Dưới 400 nm là vùng bức xạ tử ngoại (UV).\n- Trên 700 nm là vùng bức xạ hồng ngoại (IR).\n- Mẹo nhớ: Vùng nhìn thấy từ 400 nm (tím) đến 700 nm (đỏ)."},{"id":44,"slide":60,"topic":"Màu sắc & histogram","section":"Dạng số","question":"How many colour channels does a Grayscale image have?","options":["1","2","3","4"],"answer":[0],"explanation":"**Đáp án đúng: 1.** Ảnh mức xám (Grayscale) chỉ có duy nhất 1 kênh thể hiện cường độ sáng (luminance/intensity) của mỗi pixel từ 0 (đen) đến 255 (trắng).\n- 2 kênh thường dùng cho biểu diễn toạ độ gradient hoặc vector dòng quang.\n- 3 kênh là ảnh màu RGB chuẩn; 4 kênh là ảnh RGBA có thêm kênh alpha."},{"id":45,"slide":61,"topic":"Nhận dạng & học máy","section":"Dạng số","question":"How many steps are there in the task of face recognition?","options":["1","4","2","3"],"answer":[1],"explanation":"**Đáp án đúng: 4.** Quy trình nhận diện khuôn mặt tiêu chuẩn trong thị giác máy tính gồm 4 giai đoạn chính: Phát hiện khuôn mặt (Face Detection), Căn chỉnh toạ độ (Face Alignment), Trích xuất đặc trưng (Feature Extraction), và Phân loại/So khớp danh tính (Classification/Verification).\n- 1, 2, 3 là các bước chưa trọn vẹn hoặc bị gộp tác vụ."},{"id":46,"slide":62,"topic":"Biến đổi hình học & ghép ảnh","section":"Dạng số","question":"How many points at least do we need to find affine transformation matrix?","options":["3","4","5","6"],"answer":[0],"explanation":"**Đáp án đúng: 3.** Biến đổi affin 2D có 6 bậc tự do (6 tham số trong ma trận $2 \\times 3$). Mỗi cặp điểm tương ứng cung cấp 2 phương trình toạ độ ($x'$ và $y'$), do đó cần tối thiểu 3 cặp điểm không thẳng hàng ($3 \\times 2 = 6$) để giải hệ.\n- 4 điểm là số điểm tương ứng tối thiểu cần cho biến đổi Homography (8 bậc tự do).\n- Mẹo nhớ: Affine cần 3 điểm (6 DoF); Homography cần 4 điểm (8 DoF)."},{"id":47,"slide":63,"topic":"Lọc ảnh & tích chập","section":"Dạng số","question":"A convolution-based technique is used to detect the line. Here are the four convolution masks to detect horizontal, vertical, oblique +- amount lines in an image. What is the specific value of the oblique in degrees?","options":["15","45","90","180"],"answer":[1],"explanation":"**Đáp án đúng: 45.** Kỹ thuật phát hiện đường bằng bộ lọc tích chập 3×3 rời rạc hỗ trợ 4 hướng chính: ngang (0°), dọc (90°), và hai hướng nghiêng chéo (oblique) là +45° và -45° (hoặc 135°).\n- 90° và 180° (0°) là các góc trực giao ngang dọc.\n- 15° không thể biểu diễn đối xứng trên lưới mặt nạ 3×3 rời rạc."},{"id":48,"slide":64,"topic":"Nhận dạng & học máy","section":"Dạng số","question":"A dataset has 100 images, the size of each image is 112x112 pixels. Principal component analysis is applied to keep 200 most significant components. Initially, how many components does PCA break the image into?","options":["11200","1254400","20000","12544"],"answer":[3],"explanation":"**Đáp án đúng: 12544.** Ban đầu, mỗi bức ảnh kích thước $112 \\times 112$ được trải phẳng thành một vector đặc trưng có số chiều bằng tổng số pixel: $112 \\times 112 = 12544$ chiều (thành phần). Sau đó PCA mới chiếu giảm chiều xuống 200 thành phần chính.\n- 1254400 là kết quả tính nhầm khi nhân cả số lượng 100 ảnh vào chiều vector.\n- 11200 và 20000 là các số liệu tính toán sai."},{"id":49,"slide":65,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Dạng số","question":"Given a 2nd gradient: [-1, -7, 4, -2, 8, -5, 0, 9, -3, 6, -1, -9, 3, 2, 7, -8, 5, 10, -6, -4]. How many zero-crossing points are there in the above 2nd gradient?","options":["12","11","5","7","13"],"answer":[0],"explanation":"Zero-crossing là khi giá trị đổi dấu từ âm sang dương hoặc dương sang âm. Dãy:\n-1, -7, 4, -2, 8, -5, 0, 9, -3, 6, -1, -9, 3, 2, 7, -8, 5, 10, -6, -4\nĐếm số lần đổi dấu:\n-7 → 4; 4 → -2; -2 → 8; 8 → -5; -5 → 0 → 9; 9 → -3; -3 → 6; 6 → -1; -9 → 3; 7 → -8; -8 → 5; 10 → -6. Tổng cộng 12 zero-crossing points."},{"id":50,"slide":66,"topic":"Ảnh số & thu nhận ảnh","section":"Dạng số","question":"If we want to draw a shape and fill it inside we must write:","options":["1","fillInside = 1","fillInside = True","-1"],"answer":[3],"explanation":"**Đáp án đúng: -1.** Trong thư viện OpenCV (`cv2`), tham số độ dày nét vẽ `thickness` khi được gán giá trị âm như `-1` (hoặc hằng số `cv2.FILLED`) sẽ ra lệnh tô kín toàn bộ vùng bên trong hình vẽ.\n- `1` chỉ vẽ đường viền biên xung quanh có độ dày 1 pixel.\n- `fillInside` không phải là tên tham số hợp lệ trong OpenCV.\n- Mẹo nhớ: OpenCV thickness = -1 để tô màu kín bên trong hình."},{"id":51,"slide":67,"topic":"Biến đổi hình học & ghép ảnh","section":"Dạng số","question":"Rearrange the following steps of RAndom SAmple Consensus (RANSAC) algorithm\n1.Select N data items at random\n2.If K is big enough, accept fit and exit with success.\n3.Finds how many data items (of M) fit the model with parameter vector x within a user given tolerance. Call this K.\n4.Fail if you get here\n5.Repeat the above steps L times\n6.Estimates parameter of vector x","options":["163254","123465","254613","123654"],"answer":[0],"explanation":"**Đáp án đúng: 163254.** Trình tự các bước thực hiện thuật toán RANSAC: (1) Chọn ngẫu nhiên N điểm mẫu $\\rightarrow$ (6) Ước lượng vector tham số $x$ $\rightarrow$ (3) Đếm số điểm inlier K phù hợp dung sai $\\rightarrow$ (2) Nếu K đủ lớn thì chấp nhận mô hình và thành công $\rightarrow$ (5) Lặp lại quy trình L lần $\rightarrow$ (4) Báo thất bại nếu vượt quá L lần lặp.\n- Các chuỗi khác sai logic vì không thể kiểm tra điều kiện chấp nhận (2) trước khi ước lượng tham số (6) và đếm inlier (3)."},{"id":52,"slide":68,"topic":"Phân đoạn & phân cụm","section":"Dạng số","question":"Rearrange the following steps for K-means based segmentation\n\nAssign each observation to the group that has the closest centroid\nRepeat until either the centroid position or the observations assignments no longer move\nGuess K centroids positions, a centroid for each results cluster\nWhen all observations have been assigned, recalculate the positions of the K centroids","options":["3124","3214","1324","4231"],"answer":[0],"explanation":"**Đáp án đúng: 3124.** Bộ đề ghi nhận thứ tự `3124` (tương ứng: 3. Khởi tạo K centroid $\\rightarrow$ 1. Gán quan sát vào centroid gần nhất $\\rightarrow$ 2. Lặp lại $\\rightarrow$ 4. Tính toán lại vị trí K centroid).\n- Lưu ý: Trình tự logic chuẩn của giải thuật K-means là Khởi tạo tâm (3) $\\rightarrow$ Gán cụm (1) $\\rightarrow$ Cập nhật lại tâm (4) $\\rightarrow$ Lặp lại cho đến khi hội tụ (2). Bộ đề chọn `3124` do ưu tiên cặp bước mở đầu (3-1)."},{"id":53,"slide":69,"topic":"Ảnh số & thu nhận ảnh","section":"Dạng số","question":"We are working with OpenCV and we want to draw a straight line on our image. How many points do we need to use?","options":["2","4","5","3"],"answer":[0],"explanation":"**Đáp án đúng: 2** — một đoạn thẳng được xác định bởi hai điểm đầu và cuối: `cv2.line(img, pt1, pt2, color, thickness)`.\n- 3, 4, 5: thừa điểm; `cv2.line` chỉ nhận đúng `pt1` và `pt2`.\nMẹo nhớ: hai điểm xác định một đường thẳng."},{"id":54,"slide":71,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Choose the best","question":"Choose the best description of the edge in image","options":["Edges are significant local changes of intensity in a digital image.","An edge can be defined as a set of connected pixels that forms a boundary between two conjoined regions.","Three types of edges include horizontal edges, vertical edges, and circle edges","All of the others"],"answer":[0],"explanation":"**Đáp án đúng: Edges are significant local changes of intensity in a digital image.** Biên là nơi cường độ sáng thay đổi mạnh cục bộ (gradient lớn).\n- An edge can be defined as a set of connected pixels...: mô tả gần đúng nhưng là cách phát biểu thiên về đường bao/vùng, không phải định nghĩa cốt lõi theo cường độ.\n- Three types of edges include horizontal, vertical, circle: sai, phân loại biên thường là step, ramp, roof...\n- All of the others: sai vì có phương án sai.\nLưu ý: phương án B cũng khá hợp lý; bộ đề chọn A là định nghĩa chuẩn."},{"id":55,"slide":72,"topic":"Biến đổi hình học & ghép ảnh","section":"Choose the best","question":"Choose the best answer about 2D point","options":["It is a geometric setting in which two values are required to determine the position of an element.","It represents a location in (x,y) coordinate space.","It is the property possessed by an object of producing different sensations on the eye as a result of the way the object reflects or emits light.","All of the others"],"answer":[1],"explanation":"Trong CPV301 (Computer Graphics/Computer Vision Programming), 2D point được định nghĩa là một điểm biểu diễn một vị trí trong hệ tọa độ (x, y). Đây là định nghĩa chuẩn trong đồ họa máy tính."},{"id":56,"slide":73,"topic":"Màu sắc & histogram","section":"Choose the best","question":"Choose the best description of image histogram","options":["It is a type of histogram that acts as a graphical representation of the tonal distribution in a digital image.","It is a histogram representing the layout organization of an image, such as color and corresponding pixel position.","Two images with different compositions will produce two different image histograms.","Image histogram is used to synthesize colors in an image."],"answer":[0],"explanation":"Image histogram là biểu đồ biểu diễn sự phân bố mức cường độ sáng (tonal/intensity distribution) hoặc giá trị màu của các pixel trong ảnh. Nó cho biết có bao nhiêu pixel ở mỗi mức sáng hoặc mỗi giá trị màu."},{"id":57,"slide":74,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Choose the best","question":"Choose the best description of the feature descriptors","options":["Feature descriptor is an algorithm that takes an image and outputs feature vectors.","Feature descriptors are used to find the essential features from the given image","Feature descriptors are used to convert features to other representations through spatial transformations.","All of the others"],"answer":[0],"explanation":"Feature Descriptor là một thuật toán nhận vào ảnh (hoặc vùng ảnh quanh điểm đặc trưng - keypoint) và trả về các vector đặc trưng (feature vectors/feature descriptors) đại diện cho thông tin của vùng đó (ví dụ: SIFT, SURF, ORB, HOG). Trong Computer Vision (CPV301), quy trình thường là: Feature detector → phát hiện các điểm đặc trưng (keypoints). Feature descriptor → mô tả mỗi điểm đặc trưng bằng một feature vector để phục vụ việc so khớp (matching) hoặc nhận dạng."},{"id":58,"slide":75,"topic":"Phân đoạn & phân cụm","section":"Choose the best","question":"Choose the best description of the image segmentation","options":["Segmentation is the technique of dividing or partitioning an image into parts.","Image segmentation is the process of assigning a color to every pixel in an image.","Image segmentation is typically used to recognize objects and their name in images.","All of the others."],"answer":[0],"explanation":"Image segmentation là quá trình chia một ảnh thành nhiều vùng (segments) hoặc nhóm các pixel có đặc điểm tương đồng để việc phân tích ảnh trở nên dễ dàng hơn. Đây là định nghĩa chuẩn trong Computer Vision."},{"id":59,"slide":76,"topic":"Phân đoạn & phân cụm","section":"Choose the best","question":"Choose the best description of the Mean Shift segmentation","options":["It is a local homogenization technique that is very useful for salt- pepper or tonality differences in global objects.","Mean shift implicitly models this distribution using a smooth continuous non-parametric model","The idea is to replace each pixel with the 3x3 of the pixels in a range neighborhood and whose value is within a distance d","All of the others"],"answer":[1],"explanation":"Mean Shift Segmentation là thuật toán phân cụm (clustering) dựa trên ước lượng mật độ xác suất không tham số (non-parametric density estimation). Thuật toán dịch chuyển mỗi điểm dữ liệu về vùng có mật độ cao nhất (mode) để tạo thành các cụm."},{"id":60,"slide":77,"topic":"Biến đổi hình học & ghép ảnh","section":"Choose the best","question":"Choose the best description of the Geometric Transformations","options":["In these transformations, pixel values are not changed, the positions of pixel values are changed.","A geometric transformation of an image is a spatial transformation of the image coordinate system.","Geometric transformation is the geometry of image is changed with altering its actual pixel values.","All of the others"],"answer":[1],"explanation":"Geometric Transformation là phép biến đổi tọa độ không gian (spatial transformation) của ảnh, chẳng hạn như: Translation (tịnh tiến), Rotation (xoay), Scaling (phóng to/thu nhỏ), Shearing (biến dạng), Affine/Perspective transformation. Mục tiêu là thay đổi vị trí của các pixel trong hệ tọa độ, không phải thay đổi ý nghĩa của giá trị màu."},{"id":61,"slide":78,"topic":"Phân đoạn & phân cụm","section":"Choose the best","question":"Choose the best description of the K- Mean for segmentation","options":["The k-means clustering algorithm attempts to fill in the missing data intervals to create new clusters.","It is used to identify data labels based on a given labeled dataset.","K Means is a classifying algorithm.","In the K-Mean algorithm, in the same data group, the closer to the central data point, the larger the difference in data will be."],"answer":[2],"explanation":"Chính xác hơn về mặt học thuật, K-Means là thuật toán phân cụm (clustering), không phải phân loại (classification). Tuy nhiên, trong các đề CPV301/FPTU, đáp án C thường được dùng để chỉ thuật toán dùng để chia dữ liệu thành các nhóm (classes/clusters)."},{"id":62,"slide":79,"topic":"Màu sắc & histogram","section":"Choose the best","question":"Choose the best answer about color space","options":["Color space is the term for a system that uses a specific image model to translate color into numbers.","A color space is a specific organization of colors.","System that turns image into numbers.","Color spaces are mathematical models describing the way image can be represented."],"answer":[1],"explanation":"Color space (không gian màu) là một cách tổ chức/biểu diễn màu sắc để mỗi màu có thể được biểu diễn bằng các giá trị số (ví dụ RGB, HSV, Lab...)."},{"id":63,"slide":80,"topic":"Ảnh số & thu nhận ảnh","section":"Choose the best","question":"Choose the best answer about digital image","options":["The digital image is a two-dimensional array of color","The digital image is a matrix of pixels.","The digital images are composed of a combination of colors.","The digital images are created from digital cameras through a mechanical system."],"answer":[1],"explanation":"Trong CPV301 (Computer Vision), định nghĩa chuẩn của digital image là: A digital image is a matrix (2D array) of pixels. Mỗi pixel chứa giá trị cường độ sáng (ảnh xám) hoặc giá trị màu (RGB, HSV,...)."},{"id":64,"slide":81,"topic":"Miền tần số & Fourier","section":"Choose the best","question":"Choose the best description of the Fourier Transform","options":["Fourier transform is a mathematical function which transforms a signal from the frequency domain to the time domain.","The Fourier Transform is an important image processing tool which is used to decompose an image into its sine and cosine components","In the Fourier domain image, each point represents a particular spatial contained in the frequency domain image.","All of the others"],"answer":[1],"explanation":"Fourier Transform (FT) dùng để chuyển tín hiệu từ miền không gian/thời gian sang miền tần số (frequency domain). Trong xử lý ảnh, FT phân tích ảnh thành tổng của các thành phần sin và cos với các tần số khác nhau."},{"id":65,"slide":82,"topic":"Ảnh số & thu nhận ảnh","section":"Choose the best","question":"Choose the best answer about Photometry:","options":["Photometry is proportional to the amount of light directed by the surface patch which projects onto the computer.","Photometry is the science of the measurement of light, in terms of its perceived brightness to the human eye","Photometry is the phenomenon of light being absorbed when it reaches the surface of the matter.","All of the others"],"answer":[1],"explanation":"Photometry là ngành khoa học đo lường ánh sáng theo cách con người cảm nhận được (độ sáng nhìn thấy bởi mắt người). Đây là định nghĩa chuẩn trong quang học và Computer Vision."},{"id":66,"slide":83,"topic":"Biến đổi hình học & ghép ảnh","section":"Choose the best","question":"Choose the best answer about 2D Lines","options":["A line is a straight one-dimensional figure having no thickness and extending infinitely in both directions.","Lines are an idealization of such objects, which are often described in terms of two points","Line in the plane is often defined as the set of points whose coordinates satisfy a given linear equation.","All of others"],"answer":[3],"explanation":"**Đáp án đúng: All of others** — cả ba phát biểu đều đúng về đường thẳng 2D.\n- Đường thẳng là hình một chiều, không có độ dày, kéo dài vô hạn hai phía.\n- Là sự lý tưởng hoá, thường mô tả qua hai điểm.\n- Trong mặt phẳng, là tập điểm thoả phương trình tuyến tính $ax+by+c=0$."},{"id":67,"slide":84,"topic":"Lọc ảnh & tích chập","section":"Choose the best","question":"Choose the best description of the convolution- Kernel","options":["It is an array-representative for transforming images from different spatial domains.","It is the process of adding each element of the image to its local neighbors, weighted by the intensity value.","It is a small matrix used to clarify certain features.","It is used in all filters to increase the brightness of the image."],"answer":[2],"explanation":"**Đáp án đúng: It is a small matrix used to clarify certain features.** Kernel (mask) là ma trận nhỏ trượt trên ảnh để làm nổi bật/trích đặc trưng (làm mờ, làm sắc, biên...).\n- Array chuyển miền không gian: đó là vai trò của biến đổi (Fourier), không phải kernel.\n- Cộng phần tử với láng giềng theo cường độ: mô tả sai; trọng số lấy từ kernel, không phải cường độ.\n- Tăng độ sáng mọi bộ lọc: sai, mỗi kernel có chức năng riêng."},{"id":68,"slide":85,"topic":"Màu sắc & histogram","section":"Choose the best","question":"Choose the best description of the contrast stretching","options":["It is used as a filter, removing noise like salt and pepper","It is also known as Invert-Normalization","It improves an image by stretching the range of intensity values it contains.","It is a way of representing histogram in terms of light balance implementation"],"answer":[2],"explanation":"**Đáp án đúng: It improves an image by stretching the range of intensity values it contains.** Contrast stretching (normalization) kéo giãn dải cường độ thực tế ra toàn thang, ví dụ $s=\\frac{r-r_{min}}{r_{max}-r_{min}}\\cdot 255$.\n- Lọc nhiễu salt-and-pepper: là median filter.\n- Invert-Normalization: không phải tên gọi khác.\n- Biểu diễn histogram về cân bằng sáng: gần với histogram equalization, là kỹ thuật khác."},{"id":69,"slide":86,"topic":"Biến đổi hình học & ghép ảnh","section":"Choose the best","question":"Choose the best description about global alignment in image stitching","options":["Global alignment requires the non-linear minimization of an error term, which is defined from point correspondences.","Global alignment is still needed to obtain a globally coherent mosaic.","The goal of global alignment is then to find a globally consistent set of alignment parameters that minimize the misregistration between all pairs of images.","All of the others"],"answer":[3],"explanation":"**Đáp án đúng: All of the others** — cả ba ý đều đúng về global alignment trong ghép ảnh.\n- Cần cực tiểu hoá phi tuyến một hàm lỗi xác định từ các điểm tương ứng.\n- Cần để có mosaic nhất quán toàn cục (tránh tích luỹ sai số khi ghép từng cặp).\n- Mục tiêu: tìm tham số căn chỉnh nhất quán, giảm misregistration giữa mọi cặp ảnh."},{"id":70,"slide":87,"topic":"Lọc ảnh & tích chập","section":"Choose the best","question":"Choose the best description of the line detection using the convolution based technique","options":["A convolution-based technique that produces an image description of the thin lines in an input image","These kernel masks are tuned for dark lines against a grey background","A convolution-based technique is the foundation of deep learning models.","All of the others"],"answer":[0],"explanation":"**Đáp án đúng: A convolution-based technique that produces an image description of the thin lines in an input image** — dùng các kernel dò đường (ngang, dọc, chéo) để tạo ảnh mô tả đường mảnh.\n- Kernel tuned for dark lines against grey background: sai, các mask này chỉnh cho đường sáng trên nền tối.\n- Là nền tảng deep learning: không phải mô tả đặc thù của line detection.\n- All of the others: sai vì có ý sai."},{"id":71,"slide":88,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Choose the best","question":"Choose the best description of the Prewitt operator for edge detection","options":["It detects the overlap edges of an image.","It is one of the best ways to detect the color intensity and magnitude of an image","It is a good performance on detecting vertical and horizontal edges","It is never a good choice to detect the orientation of an image"],"answer":[2],"explanation":"**Đáp án đúng: It is a good performance on detecting vertical and horizontal edges.** Prewitt dùng hai kernel $3\\times3$ đạo hàm theo $x$ và $y$, nên nhạy với biên dọc và ngang.\n- Overlap edges: không có khái niệm này.\n- Color intensity và magnitude: nói chung chung, không phải điểm mạnh đặc trưng.\n- Never good for orientation: sai, từ gradient có thể tính hướng $\\theta=\\arctan(G_y/G_x)$."},{"id":72,"slide":89,"topic":"Biên & đặc trưng (edge, corner, SIFT…)","section":"Choose the best","question":"Choose the best description of the Hough transform","options":["The Hough transform is a technique that can be used to isolate features of a particular shape within an image.","Hough transform can be employed in applications where a simple analytic description of a feature is not possible.","The main advantag
