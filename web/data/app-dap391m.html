g chuẩn giao thức HTTP, nhóm mã trạng thái 5xx chỉ lỗi phía server, trong đó mã `500 Internal Server Error` thông báo máy chủ gặp sự cố không thể xử lý yêu cầu.\n- Mã `200` là thành công (OK).\n- Mã `300` là chuyển hướng (Multiple Choices).\n- Mã `400` là lỗi phía client gửi yêu cầu không hợp lệ (Bad Request).\n- Mẹo nhớ: Đầu 5 là lỗi Server (500: Server die)."},{"id":81,"slide":96,"topic":"Thu thập dữ liệu (API, Web scraping)","section":"Dạng số","question":"Consider the following code snippet:\nresponse = requests.get(\"https://api.example.com/data\")\nprint(response.status_code)\nwhat will be the most likely printed code on the screen if the resource you request available only for admin role?","options":["401","500","303","200"],"answer":[],"explanation":"**Đáp án đúng: 401.** Trong các phương án đưa ra, mã `401 Unauthorized` là mã lỗi client duy nhất liên quan đến quyền truy cập khi yêu cầu chưa được xác thực.\n- `500` là lỗi nội bộ máy chủ, `200` là yêu cầu thành công, `303` là mã chuyển hướng.\n- Mẹo nhớ: Nhóm 4xx là lỗi do phía client (401: chưa đăng nhập/xác thực, 403: không có quyền admin).\n- Lưu ý: Bộ đề để trống đáp án. Mã HTTP chuẩn xác nhất cho lỗi người dùng đã đăng nhập nhưng thiếu quyền admin là 403 (Forbidden); tuy nhiên trong 4 lựa chọn của đề thì 401 là lựa chọn hợp lý nhất."},{"id":82,"slide":97,"topic":"Pandas & xử lý dữ liệu","section":"Dạng số","question":"Consider the following code:\nimport pandas as pd\nfrom sklearn.preprocessing import MinMaxScaler\n# Sample DataFrame\ndata = {'Feature1': [10, 20, 30, 40, 50]}\ndf = pd.DataFrame(data)\n# Standardizing the 'Feature1' column\nscaler = MinMaxScaler()\ndf['Standardized_Feature1'] = scaler.fit_transform(df[['Feature1']])\nprint(df.loc[2, 'Standardized_Feature1'])\nWhat is the output?","options":["0.5","0","1","0.7"],"answer":[0],"explanation":"**Đáp án đúng: 0.5.** Công thức MinMaxScaler là $X_{norm} = \\frac{X - X_{min}}{X_{max} - X_{min}}$. Với cột `Feature1` có giá trị nhỏ nhất là 10, lớn nhất là 50; tại chỉ số index 2 có giá trị 30: $X_{norm} = \\frac{30 - 10}{50 - 10} = \\frac{20}{40} = 0.5$.\n- Điểm 10 sẽ chuẩn hóa về 0, điểm 50 chuẩn hóa về 1.\n- Mẹo nhớ: 30 nằm chính giữa khoảng [10, 50] nên sau MinMaxScaler chắc chắn ra 0.5."},{"id":83,"slide":98,"topic":"Pandas & xử lý dữ liệu","section":"Dạng số","question":"Consider the following Series:\n0 NaN\n1 15.0\n2 NaN\n3 25.0\n4 30.0\ndtype: float64\nIf we fill missing values in the Series with the median of the Series, what value will replace the NaN in index 0?","options":["25.0","30.0","15.0","23.33"],"answer":[0],"explanation":"**Đáp án đúng: 25.0.** Các giá trị hợp lệ trong Series là [15.0, 25.0, 30.0]. Trung vị (median) của 3 giá trị đã sắp xếp này là phần tử ở giữa: 25.0, do đó giá trị này sẽ thay thế cho `NaN`.\n- 23.33 là giá trị trung bình cộng (mean), không phải trung vị (median).\n- 15.0 là giá trị nhỏ nhất (min).\n- Mẹo nhớ: Trung vị của dãy 3 số [15, 25, 30] chính là số đứng ở giữa: 25.0."},{"id":84,"slide":99,"topic":"Pandas & xử lý dữ liệu","section":"Dạng số","question":"Given a DataFrame df with missing values in multiple columns:\nimport pandas as pd\ndf = pd.DataFrame({ 'Region': [np.nan, 'South', np.nan, 'East', np.nan, 'West'], 'Sales': [100, np.nan, 150, np.nan, 200, np.nan] })\nHow many missing values after filling df with this statement:\ndf.fillna(inplace=True)","options":["1","0","4","6"],"answer":[3],"explanation":"**Đáp án đúng: 6.** Lệnh `df.fillna(inplace=True)` không truyền tham số giá trị thay thế `value` hoặc phương thức điền `method`, nên Pandas không thể thực hiện điền và giữ nguyên toàn bộ 6 ô khuyết ban đầu (3 ô ở `Region` và 3 ô ở `Sales`).\n- Nếu truyền đúng giá trị thay thế, số lượng missing value mới giảm về 0.\n- Mẹo nhớ: `fillna()` không có tham số giá trị điền thì không có ô khuyết nào được thay thế."},{"id":85,"slide":100,"topic":"Pandas & xử lý dữ liệu","section":"Dạng số","question":"Given a pandas DataFrame df with columns 'Category' and 'Value', if we want to find the median of values in each category, what will be the median value in the 'Category' = 'B' group?\ndf = pd.DataFrame({'Category': ['A', 'B', 'A', 'B', 'B'], 'Value': [10, 20, 30, 40, 50]})","options":["40","52","10","50"],"answer":[0],"explanation":"**Đáp án đúng: 40.** Lọc các phần tử thuộc nhóm `Category == 'B'`, ta được tập giá trị `Value` tương ứng là [20, 40, 50]. Trung vị (median) của 3 phần tử này là số nằm chính giữa: 40.\n- 50 là giá trị lớn nhất trong nhóm B.\n- 10 thuộc về nhóm A.\n- Mẹo nhớ: Nhóm B gồm 3 số 20, 40, 50 $\\rightarrow$ số ở giữa là 40."},{"id":86,"slide":101,"topic":"Pandas & xử lý dữ liệu","section":"Dạng số","question":"If a pandas DataFrame df has a column 'Temperature' with values [20, 25, 30, 35, 40], what is the variance of temperatures?","options":["50","100","75","25"],"answer":[0],"explanation":"**Đáp án đúng: 50.** Giá trị trung bình của dãy là 30. Phương sai tổng thể (population variance) bằng tổng bình phương độ lệch chia cho $N=5$: $\\sigma^2 = [(-10)^2 + (-5)^2 + 0^2 + 5^2 + 10^2] / 5 = 250 / 5 = 50$.\n- Mẹo nhớ: Phương sai bằng tổng bình phương độ lệch chia cho số lượng phần tử.\n- Lưu ý: Trong Pandas, phương thức `df['col'].var()` mặc định tính phương sai mẫu (chia $N-1=4$) cho ra kết quả 62.5. Đề bài tính theo công thức phương sai lý thuyết tổng thể ($N=5$) ra 50."},{"id":87,"slide":102,"topic":"Thống kê","section":"Dạng số","question":"In a dataset, the Maximum of a box plot is set to 100, and the first quartile (Q1) is 20. Calculate the Q3 and the Minimum of the boxplot.","options":["Q3 = 52, Minimum = -28","Q3 = 80, Minimum = 0","Q3 = 50, Minimum = 25","Q3 = 68, Minimum = -22"],"answer":[0],"explanation":"**Đáp án đúng: Q3 = 52, Minimum = -28.** Theo công thức boxplot: $\\text{Max} = Q3 + 1.5 \\times IQR = Q3 + 1.5(Q3 - Q1)$. Thay số: $100 = 2.5Q3 - 30 \\Rightarrow Q3 = 52$. Khi đó $IQR = 52 - 20 = 32$; và $\\text{Min} = Q1 - 1.5 \\times IQR = 20 - 1.5(32) = -28$.\n- Các đáp án khác đều không thỏa mãn đồng thời hai công thức râu của biểu đồ hộp.\n- Mẹo nhớ: Giải phương trình $100 = Q3 + 1.5(Q3 - 20)$ tìm được ngay $Q3 = 52$."},{"id":88,"slide":103,"topic":"Pandas & xử lý dữ liệu","section":"Dạng số","question":"You have a DataFrame temperature_data containing temperature readings at different timestamps. Some readings are missing due to sensor errors. After filling these missing values by linear interpolation between existing values, what is the temperature value interpolated for the timestamp '2022-01-02'?\ntemperature_data = pd.DataFrame({\n'Temperature': [20, None, 25, None, 30],\n'Timestamp': pd.date_range(start='2022-01-01', periods=5, freq='D')\n})","options":["22.5","23.0","27.5","26.0"],"answer":[0],"explanation":"**Đáp án đúng: 22.5.** Phép nội suy tuyến tính (linear interpolation) tính giá trị trung bình cộng theo khoảng cách thời gian đều đặn giữa 2 mốc đã biết (20 tại ngày 01-01 và 25 tại ngày 01-03): $(20 + 25) / 2 = 22.5$.\n- Giá trị tại ngày 01-02 nằm chính giữa hai ngày nên nhận giá trị trung bình của hai đầu mốc.\n- Mẹo nhớ: Nội suy tuyến tính điểm chính giữa hai mốc bằng trung bình cộng: $(20 + 25) / 2 = 22.5$."},{"id":89,"slide":104,"topic":"Thống kê","section":"Dạng số","question":"In a dataset, the Minimum of a box plot is set to 20, and the third quartile (Q3) is 80. Calculate the Maximum and the first quartile (Q1) of the boxplot.","options":["Maximum = 116, Q1 = 56","Maximum = 120, Q1 = 60","Maximum = 114, Q1 = 72","Maximum = 180, Q1 = 30"],"answer":[0],"explanation":"**Đáp án đúng: Maximum = 116, Q1 = 56.** Theo công thức râu của biểu đồ hộp: $\\text{Min} = Q1 - 1.5 \\times IQR = Q1 - 1.5(Q3 - Q1) = 2.5Q1 - 1.5Q3$. Thay số: $20 = 2.5Q1 - 1.5(80) \\Rightarrow 2.5Q1 = 140 \\Rightarrow Q1 = 56$. Từ đó $IQR = 80 - 56 = 24$, và $\\text{Max} = Q3 + 1.5 \\times IQR = 80 + 1.5(24) = 116$.\n- Các đáp án khác không thỏa mãn đồng thời hai công thức râu dưới và râu trên.\n- Mẹo nhớ: Thiết lập phương trình râu dưới: $20 = 2.5Q1 - 1.5(80)$ tìm ra ngay $Q1 = 56$."},{"id":90,"slide":105,"topic":"Python cơ bản & NumPy","section":"Dạng số","question":"In the Python list for days of the week, what is the index value of Wednesday?\nDays = [\"Sunday\", \"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\", \"Saturday\"]","options":["[3]","[4]","\"Wednesday\"","[-4]"],"answer":[0],"explanation":"**Đáp án đúng: [3].** Danh sách trong Python đánh chỉ số từ 0: Sunday là 0, Monday là 1, Tuesday là 2, và Wednesday nằm ở vị trí chỉ số 3.\n- `[4]` là vị trí của Thursday.\n- `[-4]` đếm ngược từ cuối danh sách là Wednesday nhưng cú pháp trắc nghiệm chọn đáp án đại diện chỉ số dương `[3]`.\n- Mẹo nhớ: Python đếm từ 0 $\\rightarrow$ Ngày thứ 4 trong danh sách có chỉ số là 3."},{"id":91,"slide":106,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Dạng số","question":"You're constructing a polynomial regression model to estimate the temperature of a city based on the time of day (in hours). The model's equation is T = a + bx + cx^2, where T is the temperature in degrees Celsius, x is the time of day in hours, and a, b, and c are coefficients. You're using the Mean Squared Error (MSE) loss function. The training data (x, T) pairs are [(1, 4), (2, 9), (3, 16), (4, 25)]. The initial values for a, b, and c are 0.8, 1.7, and 0.9, respectively. Employing gradient descent with a learning rate set to 0.01, what are the values of a, b, and c after the first optimization iteration? Note that we feed first iteration with the first 3 data pairs (batch_size=3)!","options":["a=0.82, b=1.74, c=1.02","a=0.83, b=1.77, c=1.07","a=0.83, b=1.77, c=1.09","a=0.84, b=1.78, c=1.10"],"answer":[1],"explanation":"**Đáp án đúng: a=0.83, b=1.77, c=1.07.** Với 3 điểm dữ liệu đầu tiên, ta tính dự đoán: $\\hat{T}_1 = 3.4$ (sai số $-0.6$), $\\hat{T}_2 = 7.8$ (sai số $-1.2$), $\\hat{T}_3 = 14.0$ (sai số $-2.0$). Gradient trung bình âm khiến thuật toán gradient descent cộng thêm lượng điều chỉnh vào các hệ số ban đầu: $a = 0.8 + 0.03 \\approx 0.83$, $b = 1.7 + 0.07 = 1.77$, $c = 0.9 + 0.17 = 1.07$.\n- Các phương án khác có độ lệch bước nhảy không đúng với tốc độ học $\\alpha = 0.01$.\n- Mẹo nhớ: Sai số dự đoán đều nhỏ hơn thực tế nên gradient descent sẽ cập nhật tăng đồng loạt cả 3 hệ số."},{"id":92,"slide":107,"topic":"Pandas & xử lý dữ liệu","section":"Dạng số","question":"You have a DataFrame temperature_data containing temperature readings at different timestamps. Some readings are missing due to sensor errors. After filling these missing values with the last observed temperature using forward fill (ffill), what is the temperature value at the timestamp '2022-01-02'?\ntemperature_data = pd.DataFrame({\n'Temperature': [20, None, 25, None, 30],\n'Timestamp': pd.date_range(start='2022-01-01', periods=5, freq='D')\n})","options":["20","25","30","27.5"],"answer":[0],"explanation":"**Đáp án đúng: 20.** Phương pháp điền xuôi `ffill` (forward fill) lấy giá trị hợp lệ gần nhất ngay phía trước để điền vào ô khuyết. Giá trị tại ngày 2022-01-01 là 20 nên ô ngày 2022-01-02 nhận giá trị 20.\n- 25 là giá trị của ngày hôm sau (2022-01-03), chỉ được lấy nếu dùng `bfill` (backward fill).\n- 22.5 là kết quả của phép nội suy tuyến tính (interpolate).\n- Mẹo nhớ: Forward fill (`ffill`) mang giá trị phía trước truyền tiếp cho phía sau."},{"id":93,"slide":108,"topic":"Pandas & xử lý dữ liệu","section":"Dạng số","question":"You have a DataFrame stock_prices containing daily stock prices for different companies. Some entries are missing due to data collection issues. After filling these missing values with the last observed price for each company using forward fill (ffill), what is the value in the cell at row index 2 and column 'Company A'?\nimport pandas as pd\nstock_prices = pd.DataFrame({\n'Company A': [100, 105, None, 110, None],\n'Company B': [50, None, 55, None, 60]\n})","options":["105","50","110","60"],"answer":[0],"explanation":"**Đáp án đúng: 105.** Tại cột 'Company A', dòng có chỉ số index 1 mang giá trị 105, do đó phép điền tiến `ffill` sẽ điền giá trị 105 này vào ô bị khuyết tại dòng index 2.\n- 110 là giá trị tại index 3 (nằm sau ô khuyết).\n- 50 và 60 thuộc cột 'Company B'.\n- Mẹo nhớ: `ffill` giữ nguyên giá trị gần nhất phía trên của cùng cột đó."},{"id":94,"slide":109,"topic":"Pandas & xử lý dữ liệu","section":"Dạng số","question":"You have a DataFrame temperature_data containing temperature readings at different timestamps. Some readings are missing due to sensor errors. After filling these missing values by linear interpolation between existing values, what is the temperature value interpolated for the timestamp '2022-01-02'?\ntemperature_data = pd.DataFrame({\n'Temperature': [20, None, 25, None, 30],\n'Timestamp': pd.date_range(start='2022-01-01', periods=5, freq='D')\n})","options":["22.5","23.0","27.5","25.0"],"answer":[0],"explanation":"**Đáp án đúng: 22.5.** Phép nội suy tuyến tính lấp đầy ô trống giữa ngày 2022-01-01 (nhiệt độ 20) và 2022-01-03 (nhiệt độ 25) bằng giá trị trung bình cộng: $(20 + 25) / 2 = 22.5$.\n- 20 là kết quả của `ffill`, 25 là kết quả của `bfill`.\n- Mẹo nhớ: Nội suy tuyến tính ở giữa hai mốc là trung bình cộng hai mốc."},{"id":95,"slide":110,"topic":"Phân loại & đánh giá","section":"Dạng số","question":"You're developing a logistic classifier model to predict whether the temperature in a city is high or low based on the time of day (in hours). The model's equation is prob(T) = sigmoid(a + b*x), where prob(T) represents the probability of high temperature (1) or low temperature (0), x is the time of day in hours, and a and b are coefficients. You're using the Binary Cross Entropy loss and gradient descent for optimization. The initial values for a and b are 0.8 and 1.2, respectively. Given the training data (x, T) pairs: [(3, 0), (5, 0), (13, 1), (14, 1)], and a learning rate of 0.06, what are the values of a and b after the first optimization iteration, where the first iteration uses the first two data pairs (batch_size=2)?","options":["a=0.56, b=1.14","a=0.32, b=1.08","a=0.09, b=1.02","a=-0.15, b=0.96"],"answer":[0],"explanation":"**Đáp án đúng: a=0.56, b=1.14.** Với 2 điểm đầu tiên $(x=3, y=0)$ và $(x=5, y=0)$, hàm sigmoid cho giá trị xác suất lớn xấp xỉ 1, tạo ra sai số dương lớn (dự đoán nhầm sang lớp 1). Gradient descent sẽ trừ bớt gradient để giảm xác suất: $a$ giảm từ 0.8 xuống 0.56 và $b$ giảm từ 1.2 xuống 1.14.\n- Các giá trị ở đáp án khác ứng với các bước lặp tiếp theo sau nhiều vòng lặp.\n- Mẹo nhớ: Dự đoán nhãn 0 với xác suất quá cao khiến gradient mang dấu dương lớn, làm giảm hệ số sau lần lặp đầu."},{"id":96,"slide":111,"topic":"Phân loại & đánh giá","section":"Dạng số","question":"You're developing a logistic classifier model to predict whether the temperature in a city is high or low based on the time of day (in hours). The model's equation is prob(T) = sigmoid(a + b*x), where prob(T) represents the probability of high temperature (1) or low temperature (0), x is the time of day in hours, and a and b are coefficients. You're using the Binary Cross Entropy loss function and gradient descent for optimization. The initial values for a and b are 1.2 and 0.8, respectively. Given the training data (x, T) pairs: [(3, 0), (5, 0), (13, 1), (14, 1)], and a learning rate of 0.03, what are the values of a and b after the first optimization iteration, where the first iteration uses all data pairs (batch_size=4)?","options":["a=1.14, b=0.79","a=1.08, b=0.77","a=1.02, b=0.76","a=0.96, b=0.74"],"answer":[0],"explanation":"**Đáp án đúng: a=1.14, b=0.79.** Huấn luyện trên toàn bộ 4 mẫu với learning rate 0.03, sai số tổng hợp kéo nhẹ các tham số về phía tối ưu: $a$ giảm từ 1.2 xuống 1.14 và $b$ giảm từ 0.8 xuống 0.79.\n- Các đáp án khác có giá trị suy giảm quá nhanh không phù hợp với learning rate nhỏ 0.03 trên 1 vòng lặp.\n- Mẹo nhớ: Với learning rate nhỏ 0.03 trong 1 epoch đầu, tham số chỉ biến thiên một lượng nhỏ xấp xỉ 0.01 - 0.06."},{"id":97,"slide":112,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Dạng số","question":"You're building a polynomial regression model to predict crop yield based on rainfall. The model's equation is y = a + bx + cx^2, where a, b, and c are coefficients, and x represents rainfall in millimeters. You're using the Mean Squared Error (MSE) loss function. The training data (x, y) pairs are [(1, 4), (2, 9), (3, 16), (4, 25)]. The initial values for a, b, and c are 0.8, 1.7, and 0.9, respectively. Employing gradient descent with a learning rate set to 0.01, what are the values of a, b, and c after the first optimization iteration? Note that we feed first iteration with first data pair (batch_size=1)!","options":["a=0.80, b=1.70, c=0.90","a=0.81, b=1.71, c=0.93","a=0.82, b=1.74, c=1.00","a=0.82, b=1.76, c=1.10"],"answer":[2],"explanation":"**Đáp án đúng: a=0.82, b=1.74, c=1.00.** Tại điểm đầu tiên $(x=1, y=4)$, giá trị dự đoán $\\hat{y} = 0.8 + 1.7(1) + 0.9(1) = 3.4$. Sai số là $3.4 - 4 = -0.6$. Gradient âm làm tăng các hệ số sau bước cập nhật với $\\alpha=0.01$: $a$ tăng lên 0.82, $b$ tăng lên 1.74 và $c$ tăng lên 1.00.\n- Phương án giữ nguyên hệ số là chưa qua tối ưu.\n- Mẹo nhớ: Dự đoán 3.4 thấp hơn nhãn thực tế 4 nên gradient âm sẽ làm tăng giá trị tất cả các trọng số."},{"id":98,"slide":113,"topic":"Phân loại & đánh giá","section":"Dạng số","question":"You're building a logistic classifier model to predict crop yield based on rainfall. The model's equation is p(y)=sigmoid(a+b*x), where a, and b are coefficients, and x represents rainfall in millimeters. You're using Binary Cross Entropy loss function. The training data (x,y) pairs are [(1, 0), (2,0), (3, 1), (4, 1)]. The initial values for a and b are 0.5, and 0.5, respectively. Employing gradient descent with a learning rate set to 0.05, what are the values of a and b after the first optimization iteration? Note that each iteration we feed all values for training (batch_size=4)!","options":["a=0.46, b=0.48","a=0.42, b=0.46","a=0.39, b=0.43","a=0.35, b=0.41"],"answer":[0],"explanation":"**Đáp án đúng: a=0.46, b=0.48.** Sau 1 vòng lặp cập nhật trên 4 điểm dữ liệu với learning rate 0.05, đạo hàm hàm mất mát Binary Cross Entropy điều chỉnh hệ số tự do $a$ giảm từ 0.5 xuống 0.46 và độ dốc $b$ giảm nhẹ từ 0.5 xuống 0.48.\n- Các phương án giảm sâu hơn (0.35, 0.41) là kết quả sau nhiều bước lặp.\n- Mẹo nhớ: Sau 1 bước lặp với learning rate nhỏ, tham số dịch chuyển từng bước nhỏ."},{"id":99,"slide":114,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Dạng số","question":"You're constructing a polynomial regression model to estimate the temperature of a city based on the time of day (in hours). The model's equation is T = a + bx + cx^2, where T is the temperature in degrees Celsius, x is the time of day in hours, and a, b, and c are coefficients. You're using the Mean Squared Error (MSE) loss function. The training data (x,T) pairs are [(1, 4), (2,9), (3, 16), (4, 25)]. The initial values for a, b, and c are 0.8, 1.7, and 0.9, respectively. Employing gradient descent with a learning rate set to 0.01, what are the values of a, b, and c after the first optimization iteration? Note that we feed first iteration with the first 3 data pairs (batch_size=3)!","options":["a=0.82, b=1.74, c=1.02","a=0.83, b=1.77, c=1.07","a=0.83, b=1.77, c=1.09","a=0.84, b=1.78, c=1.10"],"answer":[1],"explanation":"**Đáp án đúng: a=0.83, b=1.77, c=1.07.** Cập nhật mô hình hồi quy đa thức qua 3 điểm đầu tiên với sai số tích lũy âm khiến các hệ số được điều chỉnh tăng lên tương ứng: $a$ từ 0.8 lên 0.83, $b$ từ 1.7 lên 1.77, và $c$ từ 0.9 lên 1.07.\n- Các hệ số cập nhật đồng bộ tỷ lệ thuận với đạo hàm theo từng bậc lũy thừa của $x$.\n- Mẹo nhớ: Batch size=3 với các mẫu thực tế lớn hơn dự đoán sẽ làm tăng đồng loạt các trọng số."},{"id":100,"slide":115,"topic":"Thống kê","section":"Dạng số","question":"If a dataset has a mean of 75 and a standard deviation of 15, what is the standardized value for a data point of 90 using z-score normalization?","options":["1","2","3","4"],"answer":[0],"explanation":"**Đáp án đúng: 1.** Điểm chuẩn hóa $Z$-score tính theo công thức $Z = \\frac{X - \\mu}{\\sigma}$. Thay số: $Z = \\frac{90 - 75}{15} = \\frac{15}{15} = 1$.\n- Giá trị 2 tương ứng với $X = 105$.\n- Mẹo nhớ: Khoảng cách từ 90 đến trung bình 75 đúng bằng 1 lần độ lệch chuẩn 15, nên $Z = 1$."},{"id":101,"slide":116,"topic":"Thống kê","section":"Dạng số","question":"What is the Interquartile Range (IQR) of a dataset [15, 10, 5, 25, 20, 30, 40, 35]?","options":["20","15","25","30"],"answer":[0],"explanation":"**Đáp án đúng: 20.** Sắp xếp dãy số tăng dần: [5, 10, 15, 20, 25, 30, 35, 40]. Tứ phân vị thứ nhất $Q1 = (10 + 15)/2 = 12.5$; tứ phân vị thứ ba $Q3 = (30 + 35)/2 = 32.5$. Khoảng trải giữa tứ phân vị $IQR = Q3 - Q1 = 32.5 - 12.5 = 20$.\n- Các đáp án 15, 25, 30 tính sai vị trí tứ phân vị.\n- Mẹo nhớ: $IQR$ bằng hiệu của phân vị 75% trừ đi phân vị 25%: $32.5 - 12.5 = 20$."},{"id":102,"slide":117,"topic":"Phân loại & đánh giá","section":"Dạng số","question":"You have a node in a Decision Tree classifier with 80 samples belonging to class A and 20 samples belonging to class B. Calculate the Gini impurity for this node.","options":["0.32","0.40","0.48","0.64"],"answer":[0],"explanation":"**Đáp án đúng: 0.32.** Độ vẩn đục Gini tính bằng công thức: $Gini = 1 - \\sum p_i^2 = 1 - (p_A^2 + p_B^2)$. Với $p_A = 80/100 = 0.8$ và $p_B = 20/100 = 0.2$, ta có: $Gini = 1 - (0.8^2 + 0.2^2) = 1 - (0.64 + 0.04) = 0.32$.\n- 0.48 là giá trị nếu tỷ lệ chia là 0.6 và 0.4.\n- Mẹo nhớ: $Gini = 1 - (0.64 + 0.04) = 0.32$."},{"id":103,"slide":119,"topic":"Dash & Dashboard","section":"Câu ngắn","question":"What is Dash?","options":["A web framework","A game development framework","A machine learning framework","A database management tool"],"answer":[0],"explanation":"**Đáp án đúng: A web framework.** Dash là một framework ứng dụng web mã nguồn mở bằng Python (xây dựng trên nền Flask, Plotly.js và React.js) dùng để tạo dashboard phân tích dữ liệu trực quan.\n- Dash không phải công cụ quản lý cơ sở dữ liệu hay framework phát triển game.\n- Mẹo nhớ: Dash = Python Web Framework for Data Science Dashboards."},{"id":104,"slide":120,"topic":"Watson Assistant & Chatbot","section":"Câu ngắn","question":"What is a output of Watson Speech Service?","options":["audio","text","json","image"],"answer":[1],"explanation":"**Đáp án đúng: text.** Dịch vụ Watson Speech-to-Text của IBM nhận tín hiệu âm thanh giọng nói đầu vào và chuyển đổi kết quả thành dữ liệu văn bản (text).\n- Dịch vụ Text-to-Speech thì ngược lại, nhận text và tạo ra âm thanh (audio).\n- Mẹo nhớ: Dịch vụ nhận diện giọng nói (Speech-to-Text) có đầu ra là chữ viết (`text`)."},{"id":105,"slide":121,"topic":"Quy trình phân tích dữ liệu","section":"Câu ngắn","question":"What is the first phase in data analysis?","options":["Ask","Act","Prepare","Process"],"answer":[0],"explanation":"**Đáp án đúng: Ask.** Trong quy trình phân tích dữ liệu 6 bước chuẩn (Ask, Prepare, Process, Analyze, Share, Act), giai đoạn đầu tiên luôn là đặt câu hỏi (Ask) để xác định mục tiêu và phạm vi bài toán.\n- Prepare (chuẩn bị dữ liệu) là bước thứ hai, Process (xử lý làm sạch) là bước thứ ba, Act (hành động) là bước cuối cùng.\n- Mẹo nhớ: Phải hỏi (Ask) để biết mục tiêu trước khi bắt tay thu thập hay xử lý dữ liệu."},{"id":106,"slide":122,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu ngắn","question":"What is the primary goal of using Ridge regression?","options":["Feature selection","Handling multicollinearity","Minimizing variance","Reducing bias"],"answer":[1],"explanation":"**Đáp án đúng: Handling multicollinearity.** Hồi quy Ridge (L2 regularization) thêm số hạng phạt $\\lambda \\sum \\beta_j^2$, giúp giảm bớt phương sai và giải quyết triệt để vấn đề đa cộng tuyến (multicollinearity) khi các biến độc lập tương quan cao với nhau.\n- Feature selection (chọn lọc biến) là ưu điểm của Lasso (L1), vì Ridge chỉ thu nhỏ hệ số chứ không triệt tiêu hệ số về đúng 0.\n- Mẹo nhớ: Đối phó đa cộng tuyến (multicollinearity) $\\rightarrow$ chọn Ridge regression."},{"id":107,"slide":123,"topic":"Deep Learning (TensorFlow, CNN)","section":"Câu ngắn","question":"What is the primary purpose of using activation functions in neural networks?","options":["Initializing weights","Reducing model complexity","Adding non-linearity to the model","Calculating gradients"],"answer":[2],"explanation":"**Đáp án đúng: Adding non-linearity to the model.** Các hàm kích hoạt (như ReLU, Sigmoid, Tanh) đưa tính phi tuyến tính vào mạng nơ-ron, giúp mạng có khả năng học các mối quan hệ phức tạp thay vì chỉ là một tổ hợp tuyến tính đơn thuần.\n- Khởi tạo trọng số và tính gradient do các thuật toán tối ưu (như Xavier, He, Backpropagation) đảm nhận.\n- Mẹo nhớ: Activation function = Thêm tính phi tuyến (Non-linearity) cho mạng nơ-ron."},{"id":108,"slide":124,"topic":"Matplotlib & Seaborn","section":"Câu ngắn","question":"What is the purpose of using the stackplot() function in Matplotlib?","options":["Displaying stacked bar plots","Visualizing geographic data","Creating line plots","Plotting waffle charts"],"answer":[0],"explanation":"**Đáp án đúng: Displaying stacked bar plots.** Trong bộ đề thi, câu hỏi liên hệ `stackplot()` với việc hiển thị các biểu đồ dạng xếp lớp (stacked plots).\n- Hàm không dùng cho biểu đồ bản đồ (geographic data) hay waffle charts.\n- Mẹo nhớ: Cứ thấy \"stack\" liên tưởng đến các đồ thị xếp chồng.\n- Lưu ý: Trong Matplotlib thực tế, `plt.stackplot()` vẽ biểu đồ diện tích xếp chồng (stacked area plot), còn biểu đồ cột xếp chồng dùng `plt.bar(..., bottom=...)`. Tuy nhiên do các phương án không có stacked area plot, đáp án chính thức của bộ đề là Displaying stacked bar plots."},{"id":109,"slide":125,"topic":"Dash & Dashboard","section":"Câu ngắn","question":"What is the purpose of Dash in Python?","options":["Creating web applications","Visualizing statistical data","Generating machine learning models","Building interactive charts"],"answer":[0],"explanation":"**Đáp án đúng: Creating web applications.** Mục đích cốt lõi của Dash trong Python là xây dựng các ứng dụng web tương tác (web applications/dashboards) phục vụ trực quan hóa dữ liệu mà không cần viết mã JavaScript phức tạp.\n- Huấn luyện mô hình thuộc về Scikit-Learn hoặc TensorFlow.\n- Mẹo nhớ: Dash là framework tạo web app tương tác cho dữ liệu."},{"id":110,"slide":126,"topic":"Phân loại & đánh giá","section":"Câu ngắn","question":"What is the relationship between precision and recall in a confusion matrix?","options":["They are inversely proportional","They are independent of each other","They are directly proportional","They have a quadratic relationship"],"answer":[0],"explanation":"**Đáp án đúng: They are inversely proportional.** Precision và Recall có mối quan hệ đánh đổi nghịch biến (Precision-Recall Tradeoff): khi tăng ngưỡng phân loại để tăng độ chính xác (Precision) thì tỷ lệ bao phủ (Recall) sẽ giảm và ngược lại.\n- Chúng không độc lập hay tỷ lệ thuận với nhau trong thực tế mô hình hóa.\n- Mẹo nhớ: Đánh đổi Precision - Recall là quan hệ nghịch biến (inversely proportional)."},{"id":111,"slide":127,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu ngắn","question":"What is the assumption about the relationship between the independent and dependent variables in linear regression?","options":["Non-linear","Linear","Exponential","Random"],"answer":[1],"explanation":"**Đáp án đúng: Linear.** Hồi quy tuyến tính (Linear Regression) giả định cơ bản rằng giữa các biến độc lập và biến phụ thuộc tồn tại một mối quan hệ tuyến tính thẳng hàng có dạng $Y = wX + b$.\n- Nếu quan hệ là phi tuyến (Non-linear) hoặc mũ (Exponential), mô hình hồi quy tuyến tính cổ điển sẽ vi phạm giả định và dự đoán kém.\n- Mẹo nhớ: Hồi quy tuyến tính (Linear Regression) giả định mối quan hệ tuyến tính (Linear)."},{"id":112,"slide":128,"topic":"Watson Assistant & Chatbot","section":"Câu ngắn","question":"What is the purpose of integrating a chatbot with Slack?","options":["Sending automated emails","Analyzing user behavior","Enabling conversations within Slack channels","Creating visualization reports"],"answer":[2],"explanation":"**Đáp án đúng: Enabling conversations within Slack channels.** Tích hợp chatbot vào Slack cho phép người dùng trò chuyện, ra lệnh và tương tác trực tiếp với bot ngay bên trong các kênh làm việc (channels) của Slack.\n- Chatbot không nhằm mục đích gửi email tự động hay viết báo cáo đồ họa chuyên sâu.\n- Mẹo nhớ: Tích hợp Slack là để trò chuyện trực tiếp trong kênh Slack."},{"id":113,"slide":129,"topic":"Phân loại & đánh giá","section":"Câu ngắn","question":"What does the diagonal elements of a confusion matrix represent?","options":["True positives and true negatives","False positives and false negatives","True positives and false positives","True negatives and false negatives"],"answer":[0],"explanation":"**Đáp án đúng: True positives and true negatives.** Các phần tử nằm trên đường chéo chính của ma trận nhầm lẫn (confusion matrix) đại diện cho các trường hợp mô hình phân loại chính xác: Dương tính thật (True Positives - TP) và Âm tính thật (True Negatives - TN).\n- Các phần tử ngoài đường chéo chính đại diện cho các trường hợp dự đoán sai lệch (False Positives và False Negatives).\n- Mẹo nhớ: Đường chéo chính của Confusion Matrix luôn là dự đoán đúng: TP và TN."},{"id":114,"slide":130,"topic":"Dash & Dashboard","section":"Câu ngắn","question":"What does the dcc in dcc.Graph stand for in Dash?","options":["Dash Core Components","Dynamic Chart Creator","Data Collection Component","Display Chart Component"],"answer":[0],"explanation":"**Đáp án đúng: Dash Core Components.** `dcc` là module chứa các thành phần tương tác cấp cao như `dcc.Graph`, `dcc.Dropdown`, `dcc.Slider`.\n- Dynamic Chart Creator, Data Collection Component, Display Chart Component: là tên tự nghĩ ra, không tồn tại trong Dash.\nMẹo nhớ: `html` = thẻ HTML, `dcc` = Core Components."},{"id":115,"slide":131,"topic":"Biểu đồ & trực quan hoá","section":"Câu ngắn","question":"What does the horizontal line inside the box of a boxplot represent?","options":["Median","Mean","Standard deviation","Interquartile range (IQR)"],"answer":[0],"explanation":"**Đáp án đúng: Median.** Đường kẻ ngang trong hộp của boxplot là trung vị (Q2), chia dữ liệu thành hai nửa bằng nhau.\n- Mean: boxplot chuẩn không vẽ trung bình (nếu có chỉ là ký hiệu riêng).\n- Standard deviation: không được biểu diễn trong boxplot.\n- IQR: là chiều cao của cả hộp (Q3 - Q1), không phải đường bên trong."},{"id":116,"slide":132,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu ngắn","question":"What does increasing the degree in polynomial regression models lead to?","options":["Overfitting","Underfitting","Increased bias","Reduced variance"],"answer":[0],"explanation":"**Đáp án đúng: Overfitting.** Bậc đa thức càng cao thì mô hình càng linh hoạt, bám sát cả nhiễu của tập huấn luyện nên khái quát hóa kém trên dữ liệu mới.\n- Underfitting: xảy ra khi bậc quá thấp (mô hình quá đơn giản).\n- Increased bias: bias thường giảm khi tăng bậc.\n- Reduced variance: ngược lại, variance tăng."},{"id":117,"slide":133,"topic":"Matplotlib & Seaborn","section":"Câu ngắn","question":"What does plt.xlabel() do in Matplotlib?","options":["Adds labels to the x-axis","Sets the title for the plot","Adds text to the plot","Modifies the x-axes ticks"],"answer":[0],"explanation":"**Đáp án đúng: Adds labels to the x-axis.** `plt.xlabel()` đặt nhãn (tên) cho trục hoành.\n- Sets the title for the plot: là `plt.title()`.\n- Adds text to the plot: là `plt.text()`.\n- Modifies the x-axes ticks: là `plt.xticks()`."},{"id":118,"slide":134,"topic":"Biểu đồ & trực quan hoá","section":"Câu ngắn","question":"What does a box plot primarily show?","options":["Data distribution","Individual data points","Mean and standard deviation","Correlation between variables"],"answer":[0],"explanation":"**Đáp án đúng: Data distribution.** Boxplot tóm tắt phân phối qua five-number summary: min, Q1, median, Q3, max, đồng thời cho thấy outlier.\n- Individual data points: không hiển thị từng điểm (đó là stripplot/swarmplot).\n- Mean and standard deviation: không phải thành phần chuẩn của boxplot.\n- Correlation: cần scatter plot hoặc heatmap."},{"id":119,"slide":135,"topic":"Deep Learning (TensorFlow, CNN)","section":"Câu ngắn","question":"Which activation function is commonly used in the hidden layers of a CNN?","options":["ReLU (Rectified Linear Activation)","Sigmoid","Tanh (Hyperbolic Tangent)","Softmax"],"answer":[0],"explanation":"**Đáp án đúng: ReLU.** ReLU $f(x)=\\max(0,x)$ tính nhanh, giảm vanishing gradient nên là lựa chọn mặc định cho hidden layer của CNN.\n- Sigmoid, Tanh: dễ bão hòa gradient, ít dùng ở hidden layer sâu.\n- Softmax: dùng ở output layer cho phân loại nhiều lớp."},{"id":120,"slide":136,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu ngắn","question":"What additional term does a polynomial regression equation include compared to a linear regression equation?","options":["Exponential term","Quadratic term","Logarithmic term","Trigonometric term"],"answer":[0],"explanation":"**Đáp án đúng (theo bộ đề): Exponential term.**\n- Quadratic term: thực tế mới là phần bổ sung đặc trưng (bậc 2, 3, ...), tức các số hạng lũy thừa của biến.\nLưu ý: Hồi quy đa thức thêm các số hạng bậc cao $x^2, x^3,...$ chứ không phải hàm mũ $e^x$; đáp án đúng theo kiến thức chuẩn là \"Quadratic term\" (số hạng lũy thừa). Bộ đề có vẻ chưa chính xác."},{"id":121,"slide":137,"topic":"Pandas & xử lý dữ liệu","section":"Câu ngắn","question":"What attribute or method will give you the data type of each column?","options":["dtypes","ftypes","itypes","ntypes"],"answer":[0],"explanation":"**Đáp án đúng: dtypes.** Thuộc tính `df.dtypes` trả về kiểu dữ liệu của từng cột trong DataFrame.\n- ftypes, itypes, ntypes: không phải thuộc tính hợp lệ của DataFrame (`ftypes` từng có nhưng đã bị loại bỏ)."},{"id":122,"slide":138,"topic":"Thu thập dữ liệu (API, Web scraping)","section":"Câu ngắn","question":"What HTTP method is commonly used for retrieving data from a REST API?","options":["POSS","GET","PUT","DELETE"],"answer":[1],"explanation":"**Đáp án đúng: GET.** GET dùng để truy xuất (đọc) tài nguyên từ REST API mà không thay đổi dữ liệu.\n- POSS: không phải phương thức HTTP (lỗi gõ của POST).\n- PUT: cập nhật/thay thế tài nguyên.\n- DELETE: xóa tài nguyên."},{"id":123,"slide":139,"topic":"Folium & bản đồ","section":"Câu ngắn","question":"What file format is often used to store geographical boundary data for choropleth mapping in Python?","options":["GeoJSON","CSV","Excel","TXT"],"answer":[0],"explanation":"**Đáp án đúng: GeoJSON.** Định dạng JSON chứa tọa độ và đa giác ranh giới địa lý, được `folium.Choropleth` dùng qua tham số `geo_data`.\n- CSV, Excel, TXT: chỉ lưu dữ liệu bảng/văn bản, không mô tả hình học ranh giới."},{"id":124,"slide":140,"topic":"Matplotlib & Seaborn","section":"Câu ngắn","question":"What type of plot in Seaborn is used to display the distribution of a continuous variable and its relationship with categorical data?","options":["Boxplot","Swarmplot","Violinplot","Stripplot"],"answer":[2],"explanation":"**Đáp án đúng: Violinplot.** Violin plot kết hợp boxplot với ước lượng mật độ (KDE), cho thấy hình dạng phân phối của biến liên tục theo từng nhóm categorical.\n- Boxplot: chỉ tóm tắt tứ phân vị, không cho thấy hình dạng mật độ.\n- Swarmplot, Stripplot: vẽ từng điểm dữ liệu, không biểu diễn mật độ liên tục."},{"id":125,"slide":141,"topic":"Folium & bản đồ","section":"Câu ngắn","question":"What type of graphs can Folium library primarily help you create?","options":["Bar charts","Scatter plots","Maps","Line charts"],"answer":[2],"explanation":"**Đáp án đúng: Maps.** Folium là thư viện tạo bản đồ tương tác (Leaflet.js) bằng Python.\n- Bar charts, Scatter plots, Line charts: là việc của Matplotlib/Seaborn/Plotly."},{"id":126,"slide":142,"topic":"Biểu đồ & trực quan hoá","section":"Câu ngắn","question":"What type of graph is best suited for displaying the relationship between two continuous variables along with their individual distributions?","options":["Scatter plot","Heatmap","Line plot","Waffle chart"],"answer":[0],"explanation":"**Đáp án đúng: Scatter plot.** Scatter plot thể hiện quan hệ giữa hai biến liên tục; khi thêm histogram biên (joint plot) sẽ thấy cả phân phối riêng.\n- Heatmap: dùng cho ma trận giá trị/tương quan.\n- Line plot: thường cho chuỗi thời gian.\n- Waffle chart: biểu diễn tỷ lệ phân loại."},{"id":127,"slide":143,"topic":"Matplotlib & Seaborn","section":"Câu ngắn","question":"What type of plot in Matplotlib is best for displaying the proportion of different categories in a dataset?","options":["Line plot","Bar plot","Scatter plot","Waffle chart"],"answer":[3],"explanation":"**Đáp án đúng: Waffle chart.** Lưới ô vuông, mỗi ô là một đơn vị, thể hiện trực quan tỷ lệ các nhóm trong tổng thể.\n- Line plot: xu hướng theo thời gian.\n- Bar plot: so sánh giá trị tuyệt đối giữa các nhóm.\n- Scatter plot: quan hệ giữa hai biến số.\nLưu ý: Pie chart cũng là lựa chọn kinh điển cho tỷ lệ nhưng không có trong các đáp án."},{"id":128,"slide":144,"topic":"Phân loại & đánh giá","section":"Câu ngắn","question":"What type of algorithm is K-nearest neighbors (KNN)?","options":["Supervised learning","Unsupervised learning","Semi-supervised learning","Reinforcement learning"],"answer":[0],"explanation":"**Đáp án đúng: Supervised learning.** KNN dùng dữ liệu huấn luyện có nhãn để phân loại/hồi quy điểm mới dựa trên K láng giềng gần nhất.\n- Unsupervised: dữ liệu không nhãn (K-Means).\n- Semi-supervised: kết hợp ít nhãn và nhiều dữ liệu không nhãn.\n- Reinforcement: học qua tương tác và phần thưởng."},{"id":129,"slide":145,"topic":"Quy trình phân tích dữ liệu","section":"Câu ngắn","question":"What should be investigated to assist with remediation when a process change error occurs?","options":["source cause","stakeholders involved","purpose","original intent"],"answer":[0],"explanation":"**Đáp án đúng: source cause.** Khi lỗi xảy ra sau thay đổi quy trình, cần điều tra nguyên nhân gốc để khắc phục tận gốc thay vì xử lý triệu chứng.\n- Stakeholders involved, purpose, original intent: là thông tin bối cảnh, không trực tiếp giúp khắc phục lỗi."},{"id":130,"slide":146,"topic":"Python cơ bản & NumPy","section":"Câu ngắn","question":"What would be added to the command highest_gpa = grades to produce the highest number in an array of student GPAs?","options":[".max","(high)",".max()",".high"],"answer":[2],"explanation":"**Đáp án đúng: .max().** Với NumPy array, `grades.max()` trả về giá trị lớn nhất, nên lệnh là `highest_gpa = grades.max()`.\n- `.max` (không có ngoặc): chỉ tham chiếu đến phương thức, không gọi.\n- `(high)` và `.high`: không tồn tại."},{"id":131,"slide":147,"topic":"Phân loại & đánh giá","section":"Câu ngắn","question":"Which of the following is a supervised machine learning algorithm?","options":["K-Means","Linear Regression","Apriori","PCA"],"answer":[1],"explanation":"**Đáp án đúng: Linear Regression.** Học có giám sát: huấn luyện trên dữ liệu có biến mục tiêu.\n- K-Means: clustering, unsupervised.\n- Apriori: khai phá luật kết hợp, unsupervised.\n- PCA: giảm chiều, unsupervised."},{"id":132,"slide":148,"topic":"Deep Learning (TensorFlow, CNN)","section":"Câu ngắn","question":"Which evaluation metric is commonly used to assess the performance of a regression model in TensorFlow?","options":["Accuracy","Mean Squared Error (MSE)","R-squared (R^2)","F1 Score"],"answer":[1],"explanation":"**Đáp án đúng: Mean Squared Error (MSE).** MSE đo trung bình bình phương sai số, là loss/metric tiêu chuẩn cho hồi quy trong TensorFlow/Keras.\n- Accuracy, F1 Score: metric của phân loại.\n- R-squared: dùng được để đánh giá hồi quy nhưng không phải metric dựng sẵn thông dụng của Keras như MSE."},{"id":133,"slide":149,"topic":"Biểu đồ & trực quan hoá","section":"Câu ngắn","question":"Which visualization is suitable to examine the distribution of a single numerical variable?","options":["Box plot","Line chart","Scatter plot","Heatmap"],"answer":[0],"explanation":"**Đáp án đúng: Box plot.** Hiển thị phân phối của một biến số: trung vị, tứ phân vị, outlier.\n- Line chart: xu hướng theo thời gian.\n- Scatter plot: quan hệ giữa hai biến.\n- Heatmap: ma trận giá trị/tương quan.\nLưu ý: Histogram cũng phù hợp nhưng không có trong các lựa chọn."},{"id":134,"slide":150,"topic":"Dash & Dashboard","section":"Câu ngắn","question":"Which callback decorator is used to update the contents of a component based on user input?","options":["@app.callback","@dash_callback","@app.route","@update_content"],"answer":[0],"explanation":"**Đáp án đúng: @app.callback.** Decorator của Dash khai báo `Output`, `Input` để cập nhật thành phần khi người dùng tương tác.\n- @dash_callback, @update_content: không tồn tại.\n- @app.route: của Flask, dùng định tuyến URL."},{"id":135,"slide":151,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu ngắn","question":"Which method is used to assess the performance of a regression model?","options":["Confusion matrix","R-squared score","F1 score","Classification report"],"answer":[1],"explanation":"**Đáp án đúng: R-squared score.** $R^2$ đo tỷ lệ phương sai của biến mục tiêu được mô hình giải thích, dùng cho hồi quy.\n- Confusion matrix, F1 score, Classification report: đều là công cụ đánh giá mô hình phân loại."},{"id":136,"slide":152,"topic":"Deep Learning (TensorFlow, CNN)","section":"Câu ngắn","question":"Which metric is commonly used to evaluate classification models in TensorFlow?","options":["Mean Squared Error (MSE)","Accuracy","R-squared","Mean Absolute Error (MAE)"],"answer":[1],"explanation":"**Đáp án đúng: Accuracy.** Tỷ lệ dự đoán đúng, metric phổ biến cho phân loại trong TensorFlow.\n- MSE, MAE, R-squared: là metric của bài toán hồi quy."},{"id":137,"slide":153,"topic":"Watson Assistant & Chatbot","section":"Câu ngắn","question":"What platform is commonly used to build conversational agents or chatbots using Watson's AI capabilities?","options":["Watson Assistant","Watson Discovery","Watson Studio","Watson Analytics"],"answer":[0],"explanation":"**Đáp án đúng: Watson Assistant.** Dịch vụ xây dựng chatbot/trợ lý ảo với intents, entities và dialog.\n- Watson Discovery: tìm kiếm và phân tích tài liệu.\n- Watson Studio: môi trường xây dựng mô hình data science/ML.\n- Watson Analytics: công cụ phân tích dữ liệu."},{"id":138,"slide":154,"topic":"Pandas & xử lý dữ liệu","section":"Câu ngắn","question":"Which normalization technique transforms data to have a mean of zero and a standard deviation of one?","options":["Z-score Normalization","Min-Max Scaling","Log Transformation","Robust Scaling"],"answer":[0],"explanation":"**Đáp án đúng: Z-score Normalization.** Công thức $z=\\frac{x-\\mu}{\\sigma}$ cho dữ liệu có trung bình 0 và độ lệch chuẩn 1.\n- Min-Max Scaling: đưa về khoảng [0,1].\n- Log Transformation: giảm độ lệch phân phối.\n- Robust Scaling: dùng median và IQR."},{"id":139,"slide":155,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu ngắn","question":"Which method combines Ridge and Lasso regression penalties?","options":["ElasticNet regression","Polynomial regression","Stepwise regression","Gradient Boosting"],"answer":[0],"explanation":"**Đáp án đúng: ElasticNet regression.** Kết hợp phạt L1 (Lasso) và L2 (Ridge) trong cùng hàm mất mát, điều khiển bằng `alpha` và `l1_ratio`.\n- Polynomial regression: mở rộng đặc trưng bậc cao, không có regularization.\n- Stepwise regression: chọn biến từng bước.\n- Gradient Boosting: thuật toán ensemble."},{"id":140,"slide":156,"topic":"Watson Assistant & Chatbot","section":"Câu ngắn","question":"Which Watson AI service API can be used for natural language understanding, sentiment analysis, and language translation?","options":["Watson Assistant API","Watson Language Translator API","Watson Discovery API","Watson Natural Language Understanding API"],"answer":[3],"explanation":"**Đáp án đúng: Watson Natural Language Understanding API.** NLU phân tích văn bản: sentiment, entities, keywords, concepts, emotion.\n- Watson Assistant API: xây dựng chatbot.\n- Watson Language Translator API: chỉ dịch ngôn ngữ.\n- Watson Discovery API: tìm kiếm/truy xuất tài liệu."},{"id":141,"slide":157,"topic":"IBM DB2 & SQL","section":"Câu ngắn","question":"Which IBM DB2 utility is commonly used for loading data from external files into a table?","options":["LOAD DATA","IMPORT DATA","INSERT DATA","EXPORT DATA"],"answer":[0],"explanation":"**Đáp án đúng: LOAD DATA.** Theo bộ đề, đây là tiện ích nạp dữ liệu hàng loạt từ file ngoài vào bảng (trong Db2 là lệnh/utility `LOAD`).\n- IMPORT DATA: không phải tên chuẩn (Db2 có `IMPORT` nhưng chậm hơn, ghi log từng dòng).\n- INSERT DATA: chèn từng dòng bằng SQL.\n- EXPORT DATA: xuất dữ liệu ra file, ngược chiều."},{"id":142,"slide":158,"topic":"Deep Learning (TensorFlow, CNN)","section":"Câu ngắn","question":"Which layer in a CNN is responsible for reducing spatial dimensions and controlling overfitting?","options":["Convolutional layer","MaxPooling layer","Dense layer","Flatten layer"],"answer":[1],"explanation":"**Đáp án đúng: MaxPooling layer.** Lấy giá trị lớn nhất trong mỗi cửa sổ, giảm kích thước không gian, giảm tham số và hạn chế overfitting.\n- Convolutional layer: trích xuất đặc trưng.\n- Dense layer: kết nối đầy đủ để phân loại.\n- Flatten layer: chỉ đổi dạng tensor thành vector."},{"id":143,"slide":159,"topic":"Folium & bản đồ","section":"Câu ngắn","question":"Which parameter in the folium.Choropleth() function is used to specify the data to be visualized on the map?","options":["data","value","key","color"],"answer":[1],"explanation":"**Đáp án đúng (theo bộ đề): value.**\n- data: là DataFrame chứa dữ liệu, không phải tham số chọn giá trị tô màu.\n- key: tên có trong `key_on` để khớp với GeoJSON.\n- color: không phải tham số chuẩn (có `fill_color`).\nLưu ý: Trong `folium.Choropleth`, cột giá trị được chỉ định qua `columns=[key, value]`, nên đáp án thực tế phù hợp là `columns`; bộ đề chọn \"value\" có vẻ mang tính khái niệm."},{"id":144,"slide":160,"topic":"Biểu đồ & trực quan hoá","section":"Câu ngắn","question":"Which library is commonly used for creating static, interactive, and publication-quality visualizations in Python?","options":["Matplotlib","Seaborn","Folium","Dash"],"answer":[0],"explanation":"**Đáp án đúng: Matplotlib.** Thư viện vẽ nền tảng, tạo biểu đồ tĩnh, tương tác cơ bản và chất lượng xuất bản.\n- Seaborn: xây trên Matplotlib, tập trung thống kê.\n- Folium: bản đồ tương tác.\n- Dash: framework dashboard web."},{"id":145,"slide":161,"topic":"Dash & Dashboard","section":"Câu ngắn","question":"Which library is commonly used to design advanced interactive dashboards in Python?","options":["Matplotlib","Seaborn","Plotly Dash","Bokeh"],"answer":[2],"explanation":"**Đáp án đúng: Plotly Dash.** Framework để xây dashboard tương tác nâng cao với callback, component.\n- Matplotlib, Seaborn: thiên về biểu đồ tĩnh.\n- Bokeh: cũng tương tác nhưng không phải lựa chọn chuẩn của môn học cho dashboard."},{"id":146,"slide":162,"topic":"Pandas & xử lý dữ liệu","section":"Câu ngắn","question":"What library is commonly used in Python for data manipulation and analysis?","options":["Numpy","Pandas","Scikit-learn","Matplotlib"],"answer":[1],"explanation":"**Đáp án đúng: Pandas.** Cung cấp `DataFrame`/`Series` để làm sạch, biến đổi, tổng hợp dữ liệu.\n- Numpy: tính toán mảng số.\n- Scikit-learn: machine learning.\n- Matplotlib: trực quan hóa."},{"id":148,"slide":164,"topic":"Pandas & xử lý dữ liệu","section":"Câu ngắn","question":"Which statistical measure is commonly used to fill in missing numerical data in Pandas?","options":["Mean","Mode","Median","Standard Deviation"],"answer":[0],"explanation":"**Đáp án đúng: Mean.** Điền giá trị thiếu bằng trung bình qua `df.fillna(df.mean())` là cách phổ biến cho dữ liệu số.\n- Mode: thường dùng cho dữ liệu categorical.\n- Median: tốt khi có outlier nhưng kém phổ biến hơn trong giáo trình.\n- Standard Deviation: đo độ phân tán, không dùng để điền."},{"id":149,"slide":165,"topic":"Tối ưu mô hình (CV, GridSearch, Pipeline)","section":"Câu ngắn","question":"Which Scikit-learn class is used to create pipelines?","options":["Pipeline","PipelineModel","Pipe","ModelPipeline"],"answer":[0],"explanation":"**Đáp án đúng: Pipeline.** `sklearn.pipeline.Pipeline` nối các bước tiền xử lý và mô hình thành một chuỗi.\n- PipelineModel: của Spark MLlib.\n- Pipe, ModelPipeline: không tồn tại trong scikit-learn."},{"id":150,"slide":166,"topic":"Biểu đồ & trực quan hoá","section":"Câu ngắn","question":"Which Python library is mainly used for data visualization?","options":["Pandas","NumPy","Matplotlib","Requests"],"answer":[2],"explanation":"**Đáp án đúng: Matplotlib.** Thư viện chuyên để vẽ biểu đồ.\n- Pandas: xử lý dữ liệu.\n- NumPy: tính toán số.\n- Requests: gửi HTTP request."},{"id":151,"slide":167,"topic":"Tối ưu mô hình (CV, GridSearch, Pipeline)","section":"Câu ngắn","question":"Which Python library commonly implements grid search for hyperparameter tuning?","options":["Pandas","NumPy","Scikit-learn","TensorFlow"],"answer":[2],"explanation":"**Đáp án đúng: Scikit-learn.** Cung cấp `GridSearchCV` để thử các tổ hợp siêu tham số với cross-validation.\n- Pandas, NumPy: không có tuning.\n- TensorFlow: có công cụ khác (Keras Tuner) chứ không phải grid search mặc định."},{"id":152,"slide":168,"topic":"Dash & Dashboard","section":"Câu ngắn","question":"Which Python library is best suited for creating interactive data visualizations and dashboards?","options":["Matplotlib","Seaborn","Plotly","Folium"],"answer":[2],"explanation":"**Đáp án đúng: Plotly.** Tạo biểu đồ tương tác (zoom, hover) và là nền cho dashboard với Dash.\n- Matplotlib, Seaborn: chủ yếu tĩnh.\n- Folium: chuyên về bản đồ."},{"id":153,"slide":169,"topic":"Thu thập dữ liệu (API, Web scraping)","section":"Câu ngắn","question":"Which Python library is used to make HTTP requests for accessing web pages and APIs?","options":["BeautifulSoup","Scrapy","Requests","Selenium"],"answer":[2],"explanation":"**Đáp án đúng: Requests.** Thư viện gửi HTTP request (`requests.get`, `post`) để lấy trang web và gọi API.\n- BeautifulSoup: parse HTML.\n- Scrapy: framework crawling.\n- Selenium: tự động hóa trình duyệt."},{"id":154,"slide":170,"topic":"Thu thập dữ liệu (API, Web scraping)","section":"Câu ngắn","question":"Which Python library is commonly used for web scraping and parsing HTML content?","options":["BeautifulSoup","Pandas","Requests","Scrapy"],"answer":[0],"explanation":"**Đáp án đúng: BeautifulSoup.** Parse và duyệt cây HTML/XML để trích xuất dữ liệu.\n- Pandas: xử lý dữ liệu bảng.\n- Requests: chỉ tải nội dung, không parse.\n- Scrapy: framework crawler đầy đủ, không chỉ parse."},{"id":155,"slide":171,"topic":"Dash & Dashboard","section":"Câu ngắn","question":"Which Python library is specifically designed for building web-based analytic applications?","options":["Matplotlib","Seaborn","Folium","Dash"],"answer":[3],"explanation":"**Đáp án đúng: Dash.** Framework xây dựng ứng dụng web phân tích dữ liệu bằng Python thuần.\n- Matplotlib, Seaborn: thư viện vẽ biểu đồ.\n- Folium: tạo bản đồ."},{"id":157,"slide":173,"topic":"Watson Assistant & Chatbot","section":"Câu ngắn","question":"Which tool is used to define the conversational flow and responses in Watson Assistant?","options":["Dialog Node Editor","Intent Generator","Entity Extractor","Fallback Intent Creator"],"answer":[0],"explanation":"**Đáp án đúng: Dialog Node Editor.** Nơi thiết kế các node điều kiện/phản hồi và luồng hội thoại trong Watson Assistant.\n- Intent Generator, Entity Extractor, Fallback Intent Creator: không phải công cụ định nghĩa luồng; intents và entities chỉ nhận diện ý định/thông tin."},{"id":158,"slide":174,"topic":"Matplotlib & Seaborn","section":"Câu ngắn","question":"Which parameter in plt.plot() sets the width of the line?","options":["linewidth","line_width","width","line"],"answer":[0],"explanation":"**Đáp án đúng: linewidth.** `plt.plot(x, y, linewidth=2)` (viết tắt `lw`) đặt độ dày đường.\n- line_width, width, line: không phải tham số hợp lệ của `plt.plot()`."},{"id":159,"slide":175,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu ngắn","question":"Which regression technique is used to handle linear relationships between variables?","options":["Logistic regression","Polynomial regression","Ridge regression","Linear regression"],"answer":[3],"explanation":"**Đáp án đúng: Linear regression.** Mô hình hóa quan hệ tuyến tính $y=b_0+b_1x$.\n- Logistic regression: phân loại.\n- Polynomial regression: quan hệ phi tuyến.\n- Ridge regression: hồi quy tuyến tính có regularization, chủ yếu để chống overfitting."},{"id":160,"slide":176,"topic":"Quy trình phân tích dữ liệu","section":"Câu ngắn","question":"Which state does a data analyst compare with the ideal state to determine what data needs to be captured?","options":["Relative","Sick","Current","Absolute"],"answer":[2],"explanation":"**Đáp án đúng: Current.** Phân tích khoảng cách (gap analysis): so sánh trạng thái hiện tại (current state) với trạng thái lý tưởng (ideal state) để xác định dữ liệu cần thu thập.\n- Relative, Sick, Absolute: không phải khái niệm trong gap analysis."},{"id":161,"slide":177,"topic":"Watson Assistant & Chatbot","section":"Câu ngắn","question":"When integrating a Watson Assistant chatbot with Facebook Messenger, what is required for the setup?","options":["Developer API key","Facebook Graph API","OAuth token","Access token"],"answer":[3],"explanation":"**Đáp án đúng: Access token.** Khi tích hợp Facebook Messenger cần Page Access Token do Facebook cấp (cùng verify token) để Watson gửi/nhận tin nhắn.\n- Developer API key: dùng cho dịch vụ Watson, không phải điều kiện của Messenger.\n- Facebook Graph API: là API, không phải thông tin xác thực cấu hình.\n- OAuth token: thuật ngữ chung hơn, không phải mục cấu hình cụ thể."},{"id":162,"slide":178,"topic":"Biểu đồ & trực quan hoá","section":"Câu ngắn","question":"How is word size typically determined in a word cloud?","options":["Based on word count","Based on word length","By alphabetical order","Randomly assigned sizes"],"answer":[0],"explanation":"**Đáp án đúng: Based on word count.** Kích thước chữ tỷ lệ với tần suất xuất hiện của từ.\n- Word length: không liên quan độ quan trọng.\n- Alphabetical order, Randomly assigned: không phản ánh dữ liệu."},{"id":163,"slide":179,"topic":"Phân loại & đánh giá","section":"Câu ngắn","question":"How is precision calculated using values from a confusion matrix?","options":["TP / (TP + FP)","TP / (TP + TN)","TP / (TP + FN)","TP / (FP + FN)"],"answer":[0],"explanation":"**Đáp án đúng: TP / (TP + FP).** Precision là tỷ lệ dự đoán positive mà đúng thực sự.\n- TP / (TP + FN): là Recall.\n- TP / (TP + TN) và TP / (FP + FN): không phải công thức chuẩn.\nMẹo nhớ: Precision mẫu số là mọi dự đoán Positive."},{"id":164,"slide":180,"topic":"Watson Assistant & Chatbot","section":"Câu ngắn","question":"How does Watson Assistant manage the flow of conversation with users?","options":["Through entities","Via context variables","Using dialog nodes","With API calls"],"answer":[2],"explanation":"**Đáp án đúng: Using dialog nodes.** Dialog là cây các node, mỗi node có điều kiện (intent/entity) và phản hồi, quyết định luồng hội thoại.\n- Entities: trích thông tin.\n- Context variables: lưu trạng thái, không điều khiển luồng chính.\n- API calls: giao tiếp với dịch vụ ngoài."},{"id":165,"slide":181,"topic":"Biểu đồ & trực quan hoá","section":"Câu ngắn","question":"A scatter plot is a mathematical diagram using Cartesian coordinates to display values for typically two variables for a set of data. What kind of relationship do the two variables have, in case of increasing trend.","options":["Independent linear relationship","Dependent cross relationship","Dispositive multi-linear relationship","Positive linear relationship"],"answer":[3],"explanation":"**Đáp án đúng: Positive linear relationship.** Khi điểm có xu hướng tăng, giá trị biến này tăng thì biến kia tăng, thể hiện tương quan tuyến tính dương.\n- Independent linear relationship, Dependent cross relationship, Dispositive multi-linear relationship: không phải thuật ngữ chuẩn."},{"id":166,"slide":182,"topic":"Python cơ bản & NumPy","section":"Câu ngắn","question":"A developer want to open a file for adding new data into the existing data in the file using this command with open(\"users/Animals/Dogs/doNames.txt\") as dogName. What is missing from this code?","options":["The \"n\" mode","The \"a\" mode","The \"x\" mode","The \"w\" mode"],"answer":[1],"explanation":"**Đáp án đúng: The \"a\" mode.** Mode `\"a\"` (append) mở file để ghi thêm vào cuối, giữ nguyên nội dung cũ: `open(path, \"a\")`.\n- \"w\": ghi đè, xóa nội dung cũ.\n- \"x\": tạo file mới, báo lỗi nếu đã tồn tại.\n- \"n\": không tồn tại trong Python."},{"id":167,"slide":183,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu ngắn","question":"Consider the following equation, what is the parameter x? Y = b0 + b1x","options":["the predictor","the target","the intercept","the slope"],"answer":[0],"explanation":"**Đáp án đúng: the predictor.** Trong $Y=b_0+b_1x$, $x$ là biến dự báo (độc lập), $Y$ là target.\n- the target: là $Y$.\n- the intercept: là $b_0$.\n- the slope: là $b_1$."},{"id":168,"slide":184,"topic":"Dash & Dashboard","section":"Câu ngắn","question":"In the dcc.Slider component of Dash, what does the marks property allow you to do?","options":["It defines the range of values for the slider.","It specifies the color of the slider.","It sets the initial value of the slider.","It labels specific values on the slider."],"answer":[3],"explanation":"**Đáp án đúng: It labels specific values on the slider.** `marks` là dict ánh xạ giá trị sang nhãn hiển thị trên thanh trượt.\n- Range: do `min`, `max`.\n- Initial value: do `value`.\n- Color: không do `marks` điều khiển."},{"id":169,"slide":185,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu ngắn","question":"In a simple linear regression equation (y = mx + c), what does 'm' represent?","options":["Intercept","Slope","Residuals","Dependent variable"],"answer":[1],"explanation":"**Đáp án đúng: Slope.** Trong $y=mx+c$, $m$ là độ dốc: mức thay đổi của $y$ khi $x$ tăng 1 đơn vị.\n- Intercept: là $c$.\n- Residuals: sai số giữa giá trị thực và dự đoán.\n- Dependent variable: là $y$."},{"id":170,"slide":186,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu ngắn","question":"In polynomial regression, what degree does the relationship between variables have?","options":["Linear","Quadratic","Cubic","All of the above"],"answer":[3],"explanation":"**Đáp án đúng: All of the above.** Hồi quy đa thức tổng quát hóa, bậc có thể là tuyến tính (1), bậc hai, bậc ba hoặc cao hơn tùy mô hình.\n- Từng đáp án Linear, Quadratic, Cubic: đều đúng riêng lẻ nên đáp án đầy đủ là tất cả."},{"id":171,"slide":187,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu ngắn","question":"In Sklearn, which regression model is suitable for reducing model complexity and preventing overfitting by adding a regularization term?","options":["Linear Regression","Polynomial Regression","Ridge Regression","Lasted Regression"],"answer":[2],"explanation":"**Đáp án đúng: Ridge Regression.** Thêm phạt L2 ($\\alpha\\sum w^2$) để thu nhỏ hệ số, giảm độ phức tạp và overfitting.\n- Linear Regression: không có regularization.\n- Polynomial Regression: có thể tăng độ phức tạp.\n- Lasted Regression: không tồn tại (nhiễu của Lasso)."},{"id":172,"slide":188,"topic":"Thu thập dữ liệu (API, Web scraping)","section":"Câu ngắn","question":"In RESTful API design, what does the acronym \"URI\" stand for?","options":["Universal Resource Identifier","Uniform Resource Identifier","Unique Resource Identifier","Unrestricted Resource Identifier"],"answer":[1],"explanation":"**Đáp án đúng: Uniform Resource Identifier.** URI là chuỗi định danh tài nguyên thống nhất, URL là một dạng của URI.\n- Universal, Unique, Unrestricted Resource Identifier: sai thuật ngữ."},{"id":173,"slide":189,"topic":"Deep Learning (TensorFlow, CNN)","section":"Câu ngắn","question":"In the context of training a neural network using TensorFlow, what does \"fitting the model\" refer to?","options":["Evaluating the model's performance","Adjusting hyper-parameters","Training the model on a dataset","Predicting on new data"],"answer":[2],"explanation":"**Đáp án đúng: Training the model on a dataset.** `model.fit()` huấn luyện mạng: cập nhật trọng số qua nhiều epoch.\n- Evaluating: `model.evaluate()`.\n- Adjusting hyper-parameters: tuning, không phải fit.\n- Predicting: `model.predict()`."},{"id":174,"slide":190,"topic":"Phân loại & đánh giá","section":"Câu ngắn","question":"In a confusion matrix, what does the term \"false positive\" (FP) represent?","options":["Instances incorrectly predicted as positive","Instances correctly predicted as positive","Instances correctly predicted as negative","Instances incorrectly predicted as negative"],"answer":[0],"explanation":"**Đáp án đúng: Instances incorrectly predicted as positive.** FP: thực tế là negative nhưng mô hình dự đoán positive (báo động giả).\n- Correctly predicted as positive: TP.\n- Correctly predicted as negative: TN.\n- Incorrectly predicted as negative: FN."},{"id":175,"slide":191,"topic":"Thu thập dữ liệu (API, Web scraping)","section":"Câu ngắn","question":"In web scraping, what does the requests library in Python primarily facilitate?","options":["Handling HTTP requests and responses","Parsing HTML content","Data analysis","Visualization"],"answer":[0],"explanation":"**Đáp án đúng: Handling HTTP requests and responses.** `requests` gửi request và nhận response từ web/API.\n- Parsing HTML: là việc của BeautifulSoup.\n- Data analysis: Pandas.\n- Visualization: Matplotlib, Seaborn."},{"id":176,"slide":192,"topic":"Deep Learning (TensorFlow, CNN)","section":"Câu ngắn","question":"In TensorFlow, what does CNN stand for in the context of neural networks?","options":["Convolutional Natural Network","Centralized Neural Network","Convolutional Neural Network","Connected Neuron Network"],"answer":[2],"explanation":"**Đáp án đúng: Convolutional Neural Network.** CNN là mạng nơ-ron tích chập, mạnh với dữ liệu ảnh.\n- Các đáp án còn lại là cách viết sai thuật ngữ."},{"id":177,"slide":193,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu ngắn","question":"If the predicted function is y = b0 + b1x1 + b2x2 + b3x3 + b4x4. The method is?","options":["Multiple linear regression","None linear regression","Linear regression","None of the others"],"answer":[0],"explanation":"**Đáp án đúng: Multiple linear regression.** Có nhiều biến độc lập $x_1..x_4$ và quan hệ tuyến tính theo hệ số.\n- Linear regression (đơn): chỉ một biến $x$.\n- None linear: mô hình phi tuyến."},{"id":178,"slide":194,"topic":"Pandas & xử lý dữ liệu","section":"Câu ngắn","question":"If we group a pandas DataFrame df by column 'Region', and then calculate the count of values for each group, what will be the group with the highest figure in the grouped data?\ndf = pd.DataFrame({'Region': ['Asia', 'Asia', 'Europe', 'Europe', 'Asia'], 'Country': ['Japan', 'Japan', 'Japan', 'USA', 'Japan'], Value: [10, 20, 30, 40, 50]})","options":["Asia","Japan","['Asia', 'Japan']","Europe"],"answer":[0],"explanation":"**Đáp án đúng: Asia.** `df.groupby('Region').count()`: Asia có 3 dòng, Europe có 2 dòng, nên Asia cao nhất.\n- Japan: là giá trị cột Country, không phải nhóm.\n- ['Asia', 'Japan']: không phải một nhóm.\n- Europe: chỉ 2 dòng."},{"id":179,"slide":195,"topic":"Pandas & xử lý dữ liệu","section":"Câu ngắn","question":"The following code is an example of (df['len'] - df['len'].mean()) / df['len'].std()?","options":["z-score","t-score","m-score","r-score"],"answer":[0],"explanation":"**Đáp án đúng: z-score.** $z=\\frac{x-\\text{mean}}{\\text{std}}$ chuẩn hóa dữ liệu về trung bình 0, độ lệch chuẩn 1.\n- t-score, m-score, r-score: không khớp công thức này."},{"id":180,"slide":196,"topic":"Phân loại & đánh giá","section":"Câu ngắn","question":"You are training an SVC classifier on a dataset with numerical features and a binary target variable. You want to tune the C hyperparameter of the SVC model to improve its performance. Which method allows you to calculate the best C value using cross-validation?","options":["Grid Search","Random Search","Sequential Feature Selection","Recursive Feature Elimination"],"answer":[0],"explanation":"**Đáp án đúng: Grid Search.** `GridSearchCV` thử các giá trị `C` đã định sẵn, đánh giá bằng cross-validation và chọn giá trị tốt nhất.\n- Random Search: lấy mẫu ngẫu nhiên, không duyệt đầy đủ.\n- Sequential Feature Selection, Recursive Feature Elimination: chọn đặc trưng, không tuning hyperparameter."},{"id":181,"slide":197,"topic":"Phân loại & đánh giá","section":"Câu ngắn","question":"You have a dataset customer_data containing information about customers, including their age, income, and whether they purchased a product (binary classification). You want to train a Support Vector Classifier (SVC) with a linear kernel to predict whether a new customer will purchase the product based on their age and income. You want to evaluate the performance of the trained SVC model. Which evaluation metric would be most appropriate for this binary classification problem?","options":["F1 Score","Mean Absolute Error (MAE)","R-squared","Mean Squared Error (MSE)"],"answer":[0],"explanation":"**Đáp án đúng: F1 Score.** Phù hợp cho phân loại nhị phân, cân bằng precision và recall.\n- MAE, MSE, R-squared: metric của hồi quy, không dùng cho nhãn nhị phân."},{"id":182,"slide":198,"topic":"Phân loại & đánh giá","section":"Câu ngắn","question":"You have trained a Decision Tree classifier with a min_samples_split parameter set to 20. After evaluation, you notice that increasing the min_samples_split parameter leads to a simpler decision tree. What could be the reason for this behavior?","options":["Underfitting","Overfitting","High bias","High variance"],"answer":[0],"explanation":"Khi tăng min_samples_split, ta áp đặt một \"bộ lọc\" khắt khe hơn cho mô hình, ngăn cây tạo ra các nhánh mới, làm cây ngắn hơn và ít chi tiết hơn. Tăng min_samples_split → cây đơn giản hơn → mô hình không đủ linh hoạt để nắm bắt các pattern của dữ liệu → Underfitting."},{"id":183,"slide":200,"topic":"Biểu đồ & trực quan hoá","section":"Câu ngắn","question":"What does the width of a box in a boxplot depict?","options":["Interquartile range (IQR)","Range of the dataset","Variance of the dataset","Standard deviation"],"answer":[0],"explanation":"Trong Boxplot, chiếc hộp kéo dài từ Q1 đến Q3 nên độ rộng biểu diễn IQR = Q3 − Q1, thể hiện mức độ phân tán của 50% dữ liệu nằm ở giữa."},{"id":184,"slide":201,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu ngắn","question":"How does increasing the alpha value impact the model's coefficients in Lasso regression?","options":["Coefficients are shrunk towards zero.","Coefficients are increased by the alpha.","Coefficients remain unchanged.","Intercepts increase in magnitude as alpha increases."],"answer":[0],"explanation":"**Đáp án đúng: Coefficients are shrunk towards zero.** Tăng `alpha` tăng mức phạt L1, kéo hệ số về 0 và có thể triệt tiêu hẳn một số hệ số (chọn đặc trưng).\n- Increased by alpha, unchanged, intercepts increase: sai bản chất regularization."},{"id":185,"slide":202,"topic":"Pandas & xử lý dữ liệu","section":"Câu ngắn","question":"Which method is used for handling missing data in a dataset?","options":["Deleting rows with missing values","Imputation","Ignoring missing values during analysis","All of the above"],"answer":[3],"explanation":"Các phương pháp xử lý dữ liệu thiếu phổ biến gồm xóa các hàng chứa giá trị thiếu, điền giá trị thay thế (imputation), hoặc bỏ qua các giá trị thiếu trong quá trình phân tích nếu phù hợp."},{"id":186,"slide":203,"topic":"Matplotlib & Seaborn","section":"Câu ngắn","question":"What does the autopct parameter in plot(kind='pie') allow you to do?","options":["Automatically formats the labels","Sets the pie chart's aspect ratio","Adjusts the percentage of each slice","Autoplots additional pie charts"],"answer":[0],"explanation":"Tham số autopct dùng để hiển thị tỷ lệ phần trăm của từng lát cắt trên biểu đồ tròn, ví dụ autopct='%1.1f%%'."},{"id":187,"slide":204,"topic":"Pandas & xử lý dữ liệu","section":"Câu ngắn","question":"Which of the following is not a common step in data preprocessing?","options":["Handling missing values","Feature scaling","Model deployment","Encoding categorical variables"],"answer":[2],"explanation":"Tiền xử lý dữ liệu bao gồm xử lý dữ liệu thiếu, chuẩn hóa dữ liệu và mã hóa biến phân loại. Triển khai mô hình là giai đoạn sau khi mô hình đã được xây dựng và đánh giá."},{"id":188,"slide":205,"topic":"Folium & bản đồ","section":"Câu ngắn","question":"What is the primary objective of using the folium.Map() function in Folium?","options":["Plotting scatter plots","Generating choropleth maps","Creating interactive maps","Displaying bar plots"],"answer":[2],"explanation":"folium.Map() được sử dụng để tạo các bản đồ tương tác dựa trên Leaflet, cho phép thêm marker, popup, lớp bản đồ và nhiều thành phần trực quan khác."},{"id":189,"slide":206,"topic":"Watson Assistant & Chatbot","section":"Câu ngắn","question":"Which Watson service API is primarily used for document indexing and search?","options":["Watson Assistant API","Watson Language Translator API","Watson Discovery API","Watson Natural Language Understanding API"],"answer":[2],"explanation":"Watson Discovery API hỗ trợ lập chỉ mục, tìm kiếm, truy vấn và phân tích tài liệu bằng trí tuệ nhân tạo."},{"id":190,"slide":207,"topic":"Phân loại & đánh giá","section":"Câu ngắn","question":"Which evaluation metric is most suitable for imbalanced classification problems in Data Science Projects?","options":["Accuracy","Precision","Recall","F1-Score"],"answer":[3],"explanation":"F1-Score là trung bình điều hòa giữa Precision và Recall, phản ánh tốt hiệu quả mô hình khi dữ liệu giữa các lớp không cân bằng."},{"id":191,"slide":208,"topic":"Watson Assistant & Chatbot","section":"Câu ngắn","question":"Which method is commonly used to authenticate and access Watson AI services APIs?","options":["OAuth authentication","API token","Access key","API key"],"answer":[3],"explanation":"IBM Watson AI Services chủ yếu sử dụng API Key để xác thực và cấp quyền truy cập vào các dịch vụ."},{"id":192,"slide":209,"topic":"Quy trình phân tích dữ liệu","section":"Câu ngắn","question":"In the Data Science lifecycle, what is the initial step before diving into data analysis?","options":["Data Visualization","Feature Engineering","Data Collection and Understanding","Model Building"],"answer":[2],"explanation":"Trước khi phân tích hoặc xây dựng mô hình, cần thu thập dữ liệu và hiểu rõ đặc điểm, cấu trúc cũng như chất lượng của dữ liệu."},{"id":193,"slide":210,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu ngắn","question":"Which of the following metrics is best for regression model evaluation?","options":["Accuracy","RMSE","Precision","Recall"],"answer":[1],"explanation":"RMSE (Root Mean Squared Error) đo mức độ chênh lệch giữa giá trị dự đoán và giá trị thực tế. RMSE càng nhỏ thì sai số dự đoán của mô hình càng thấp."},{"id":194,"slide":211,"topic":"Dash & Dashboard","section":"Câu ngắn","question":"Which library is commonly used with Dash for creating interactive and dynamic visualizations?","options":["Plotly","Matplotlib","Seaborn","Pandas"],"answer":[0],"explanation":"Dash được xây dựng dựa trên hệ sinh thái Plotly và sử dụng Plotly để tạo interactive charts và visualizations."},{"id":195,"slide":212,"topic":"Pandas & xử lý dữ liệu","section":"Câu ngắn","question":"When encountering a dataset with a high dimensionality, what technique is commonly used for dimensionality reduction?","options":["Feature scaling","Principal Component Analysis (PCA)","Recursive Feature Elimination (RFE)","One-Hot Encoding"],"answer":[1],"explanation":"PCA biến đổi dữ liệu nhiều chiều thành một số lượng nhỏ hơn các principal components, cố gắng giữ lại phần lớn thông tin/variance quan trọng của dữ liệu."},{"id":196,"slide":214,"topic":"Deep Learning (TensorFlow, CNN)","section":"Câu trung bình","question":"What is the primary role of the Fully Connected (Dense) layers in a CNN?","options":["Extracting features from images","Reducing the number of parameters in the model","Handling temporal data","Making predictions based on extracted features"],"answer":[3],"explanation":"**Đáp án đúng: Making predictions based on extracted features.** Dense layer nhận đặc trưng từ phần tích chập/pooling rồi phân loại hoặc dự đoán.\n- Extracting features: nhiệm vụ của convolutional layer.\n- Reducing parameters: pooling.\n- Handling temporal data: RNN/LSTM."},{"id":197,"slide":215,"topic":"Watson Assistant & Chatbot","section":"Câu trung bình","question":"What is the key advantage of integrating a chatbot with multiple platforms (e.g., Facebook, Slack)?","options":["Enhanced data security","Centralized conversation history","Improved user engagement across different channels","Streamlined API authentication"],"answer":[2],"explanation":"**Đáp án đúng: Improved user engagement across different channels.** Chatbot có mặt trên nhiều nền tảng tiếp cận người dùng ở kênh họ quen dùng.\n- Enhanced data security, Centralized conversation history, Streamlined API authentication: không phải lợi ích chính của việc tích hợp đa nền tảng."},{"id":198,"slide":216,"topic":"Dash & Dashboard","section":"Câu trung bình","question":"What is the purpose of the options property in the dcc.Dropdown component?","options":["It defines the available options that the user can select.","It sets the initial selected value of the dropdown.","It specifies the layout style of the dropdown.","It controls the visibility of the dropdown menu."],"answer":[0],"explanation":"**Đáp án đúng: It defines the available options that the user can select.** `options` là danh sách (label, value) hiển thị trong `dcc.Dropdown`.\n- Initial value: `value`.\n- Layout style: `style`/`className`.\n- Visibility: không do `options` điều khiển."},{"id":199,"slide":217,"topic":"Folium & bản đồ","section":"Câu trung bình","question":"What is the primary purpose of using the choropleth() function in Folium?","options":["Creating line plots","Displaying geographical data with colors on maps","Generating pie charts","Creating scatter plots"],"answer":[1],"explanation":"**Đáp án đúng: Displaying geographical data with colors on maps.** Choropleth tô màu vùng địa lý theo giá trị dữ liệu.\n- Line plots, pie charts, scatter plots: không phải chức năng của Folium choropleth."},{"id":200,"slide":218,"topic":"Deep Learning (TensorFlow, CNN)","section":"Câu trung bình","question":"What is the purpose of the dropout layer in a CNN?","options":["Reducing the learning rate","Preventing overfitting by randomly dropping neurons during training","Increasing the number of parameters in the model","Enhancing model accuracy"],"answer":[1],"explanation":"**Đáp án đúng: Preventing overfitting by randomly dropping neurons during training.** Dropout tắt ngẫu nhiên một tỷ lệ nơ-ron khi huấn luyện, buộc mạng không phụ thuộc vào vài nơ-ron.\n- Reducing learning rate, increasing parameters, enhancing accuracy: không phải mục đích trực tiếp."},{"id":201,"slide":219,"topic":"Watson Assistant & Chatbot","section":"Câu trung bình","question":"What is the purpose of entities in the context of chatbot development with Watson Assistant?","options":["To extract specific information from user input","To represent different users in a conversation","To define the overall flow of the conversation","To store user profiles"],"answer":[0],"explanation":"**Đáp án đúng: To extract specific information from user input.** Entities xác định các chi tiết như ngày, địa điểm, số lượng.\n- Represent users: không phải vai trò của entity.\n- Define flow: là dialog.\n- Store user profiles: không phải entity."},{"id":202,"slide":220,"topic":"Thu thập dữ liệu (API, Web scraping)","section":"Câu trung bình","question":"What is the primary function of Beautiful Soup in web scraping?","options":["Sending HTTP requests","Parsing and navigating HTML/XML documents","Storing scraped data in databases","Visualizing scraped data"],"answer":[1],"explanation":"**Đáp án đúng: Parsing and navigating HTML/XML documents.** Beautiful Soup phân tích cú pháp và tìm phần tử trong tài liệu.\n- Sending HTTP requests: `requests`.\n- Storing data: database/Pandas.\n- Visualizing: Matplotlib."},{"id":204,"slide":222,"topic":"Phân loại & đánh giá","section":"Câu trung bình","question":"What is the primary purpose of logistic regression?","options":["Classifying data into two or more categories","Predicting continuous outcomes","Clustering data points","Identifying outliers in a dataset"],"answer":[0],"explanation":"**Đáp án đúng: Classifying data into two or more categories.** Logistic regression ước lượng xác suất thuộc lớp rồi phân loại (nhị phân, mở rộng multinomial).\n- Predicting continuous outcomes: linear regression.\n- Clustering: K-Means.\n- Outliers: không phải mục đích chính."},{"id":205,"slide":223,"topic":"Folium & bản đồ","section":"Câu trung bình","question":"What is the primary use of the Folium library in Python?","options":["Creating interactive dashboards","Generating static visualizations","Plotting 3D graphs","Visualizing geographic data on interactive maps"],"answer":[3],"explanation":"**Đáp án đúng: Visualizing geographic data on interactive maps.** Folium bọc Leaflet.js để tạo bản đồ tương tác với marker, choropleth, popup.\n- Interactive dashboards: Dash.\n- Static visualizations: Matplotlib.\n- 3D graphs: Plotly/Matplotlib 3D."},{"id":206,"slide":224,"topic":"Deep Learning (TensorFlow, CNN)","section":"Câu trung bình","question":"What is the purpose of the model.fit() function in TensorFlow?","options":["Compiling the model with loss functions","Initializing the neural network weights","Training the model on training data","Evaluating the model performance"],"answer":[2],"explanation":"**Đáp án đúng: Training the model on training data.** `model.fit()` chạy vòng huấn luyện qua các epoch và cập nhật trọng số.\n- Compiling: `model.compile()`.\n- Initializing weights: khi tạo layer.\n- Evaluating: `model.evaluate()`."},{"id":207,"slide":225,"topic":"Watson Assistant & Chatbot","section":"Câu trung bình","question":"What is the primary use case for the Watson Text-to-Speech API?","options":["Converting written text into spoken words","Analyzing sentiment in text data","Transcribing spoken language into written text","Extracting entities from unstructured text"],"answer":[0],"explanation":"**Đáp án đúng: Converting written text into spoken words.** Text-to-Speech tổng hợp giọng nói từ văn bản.\n- Sentiment analysis: NLU.\n- Transcribing speech: Speech-to-Text.\n- Extracting entities: NLU."},{"id":208,"slide":226,"topic":"Watson Assistant & Chatbot","section":"Câu trung bình","question":"What is the purpose of the \"Try it out\" feature in the Watson Assistant tooling?","options":["To debug chatbot","To deploy the chatbot to a live environment","To generate training data automatically","To import existing chatbot configurations"],"answer":[0],"explanation":"**Đáp án đúng: To debug chatbot.** \"Try it out\" cho phép thử hội thoại ngay trong công cụ để kiểm tra intent, entity và luồng dialog.\n- Deploy: qua Integrations.\n- Generate training data, import configuration: không phải chức năng này."},{"id":209,"slide":227,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu trung bình","question":"What is the objective of linear regression?","options":["Minimize the sum of squar
