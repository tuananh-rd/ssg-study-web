t yêu cầu đến \"https://api.example.com/submit\" với dữ liệu JSON {\"name\": \"John\", \"age\": 30}. Đoạn mã nào sau đây gửi yêu cầu này đúng, lưu ý rằng bạn không muốn hiển thị dữ liệu trên URL?","options":["response = requests.post(\"https://api.example.com/submit\", json={\"name\": \"John\", \"age\": 30})","response = requests.post(\"https://api.example.com/submit\", params={\"name\": \"John\", \"age\": 30})","response = requests.get(\"https://api.example.com/submit\", json={\"name\": \"John\", \"age\": 30})","response = requests.get(\"https://api.example.com/submit\", params={\"name\": \"John\", \"age\": 30})"]},"b-290":{"q":"Bạn đang giải thích khái niệm độ không thuần khiết (impurity) cho một đồng nghiệp mới làm quen với cây quyết định (decision trees). Phát biểu nào sau đây mô tả đúng nhất độ không thuần khiết trong bối cảnh cây quyết định?","options":["Impurity đo độ thuần khiết của một nút xét theo phân bố lớp.","Impurity đo mức độ ngẫu nhiên trong tập dữ liệu.","Impurity đo độ sâu của cây quyết định để ngăn vấn đề quá khớp (overfit).","Impurity đo số lượng đặc trưng trong tập dữ liệu không liên quan đến việc phân loại."]},"b-292":{"q":"Trong hồi quy ridge (ridge regression), phát biểu nào sau đây là đúng về số hạng điều chuẩn (regularization term)?","options":["Số hạng điều chuẩn phạt các giá trị lớn của hệ số bằng cách cộng bình phương của chúng vào hàm mất mát (loss function).","Số hạng điều chuẩn khuyến khích các giá trị lớn của hệ số để cải thiện hiệu suất mô hình.","Số hạng điều chuẩn phạt các giá trị lớn của hệ số bằng cách cộng giá trị tuyệt đối của chúng vào hàm mất mát.","Số hạng điều chuẩn không có tác động nào đến các hệ số của mô hình."]},"r-m1-001":{"q":"Which Python library provides the DataFrame and Series data structures along with data analysis tools?","correct":"Pandas","wrong":["NumPy","SciPy","Matplotlib"]},"r-m1-002":{"q":"Among Python libraries for Data Science, which one belongs to the Machine Learning algorithms category?","correct":"Scikit-learn","wrong":["NumPy","Seaborn","Matplotlib"]},"r-m1-003":{"q":"Which library is used for advanced statistical visualization and for drawing heatmaps?","correct":"Seaborn","wrong":["Pandas","SciPy","Statsmodels"]},"r-m1-004":{"q":"Which of the following Pandas syntaxes correctly exports data from a DataFrame to a CSV file without saving the index column?","correct":"df.to_csv(\"cleaned_data.csv\", index=False)","wrong":["df.to_csv(\"cleaned_data.csv\", index=True)","df.read_csv(\"cleaned_data.csv\", index=False)","df.export_csv(\"cleaned_data.csv\", index=False)"]},"r-m1-005":{"q":"Which method is used to display the first 5 rows of a DataFrame in Pandas?","correct":"print(df.head())","wrong":["print(df.tail())","print(df.describe())","print(df.info())"]},"r-m1-006":{"q":"Which of the following Pandas syntaxes removes rows with missing values (NaN/Null) in the 'price' column directly in the current DataFrame?","correct":"df.dropna(subset=['price'], axis=0, inplace=True)","wrong":["df.fillna(subset=['price'], axis=0, inplace=True)","df.dropna(subset=['price'], axis=1, inplace=False)","df.replace(subset=['price'], axis=0, inplace=True)"]},"r-m1-007":{"q":"Which of the following formulas represents the Z-score normalization method (standard normalization)?","correct":"df['length'] = (df['length'] - df['length'].mean()) / df['length'].std()","wrong":["df['length'] = df['length'] / df['length'].max()","df['length'] = (df['length'] - df['length'].min()) / (df['length'].max() - df['length'].min())","df['length'] = (df['length'] - df['length'].mean()) / df['length'].max()"]},"r-m1-008":{"q":"Which normalization method does the code `df['length'] = (df['length'] - df['length'].min()) / (df['length'].max() - df['length'].min())` correspond to?","correct":"Min-Max Normalization","wrong":["Simple Feature Scaling","Z-score (standard normalization)","One-Hot Encoding"]},"r-m1-009":{"q":"Which Pandas function does the Binning technique use to group continuous values into categorical bins?","correct":"pd.cut()","wrong":["pd.get_dummies()","pd.concat()","pd.pivot()"]},"r-m1-010":{"q":"In data preprocessing, which Pandas function is used to perform One-Hot Encoding to create dummy variables?","correct":"pd.get_dummies()","wrong":["pd.cut()","pd.dropna()","pd.concat()"]},"r-m1-011":{"q":"Which command quickly summarizes basic descriptive statistics such as count, mean, std, min, and max for numeric columns?","correct":"print(df.describe())","wrong":["print(df.value_counts())","print(df.corr())","print(df.groupby())"]},"r-m1-012":{"q":"In a correlation matrix displayed as a heatmap, what does the diagonal line represent?","correct":"Every variable always has a perfect correlation coefficient of 1 with itself","wrong":["The correlation coefficient between any two independent variables is always 0","The variables have a perfect negative correlation of -1","Outliers are concentrated along the diagonal"]},"r-m1-013":{"q":"What relationship is indicated when one variable increases (such as engine size) and the other variable increases as well (such as car price)?","correct":"Positive Correlation","wrong":["Negative Correlation","Multicollinearity","Linear Independence"]},"r-m1-014":{"q":"Which Seaborn function is used to draw a scatter plot combined with a regression line?","correct":"sns.regplot()","wrong":["sns.heatmap()","sns.barplot()","sns.boxplot()"]},"r-m1-015":{"q":"Which method is used to count the frequency of each distinct categorical value in a column of a Pandas DataFrame?","correct":"print(df['drive-wheels'].value_counts())","wrong":["print(df['drive-wheels'].count())","print(df['drive-wheels'].unique_counts())","print(df['drive-wheels'].sum())"]},"r-m1-016":{"q":"When a simple linear regression model does not fit the data well (it fails to capture the curves in the data), which model should be used?","correct":"Polynomial Regression","wrong":["Ridge Regression","Decision Tree","K-Nearest Neighbors (KNN)"]},"r-m1-017":{"q":"What is the main benefit of using a Pipeline in the Scikit-learn library?","correct":"It simplifies and sequentially combines data transformation and model fitting steps","wrong":["It automatically removes all outliers and replaces missing values","It automatically searches for optimal hyperparameters in place of GridSearchCV","It increases the number of records in the training dataset"]},"r-m1-018":{"q":"What does the R-squared measure represent when evaluating a regression model?","correct":"The percentage of the variance of the target variable explained by the model","wrong":["The mean of the squared errors between actual and predicted values","The number of statistically significant independent features in the model","The standard deviation between predicted values and the target mean"]},"r-m1-019":{"q":"Which of the following statements about Mean Squared Error (MSE) is correct?","correct":"It is the mean of the squared errors; the smaller the MSE, the more accurate the model","wrong":["It is the mean absolute error; the larger the MSE, the better the model","It is the proportion of explained variance; MSE always lies between 0 and 1","It is the standard deviation of the residuals; the closer the MSE is to 1, the more reliable the model"]},"r-m1-020":{"q":"When does overfitting occur in machine learning, and what is its consequence?","correct":"The model captures the noise in the training data, leading to poor results on new data","wrong":["The model is too simple and fails to learn the structure even on the training set","The model predicts too quickly but consumes a lot of RAM during training","The model achieves similar accuracy on both the train and test sets"]},"r-m1-021":{"q":"In which situation is Ridge Regression most appropriately used?","correct":"When multicollinearity is present or when a polynomial model is overfitting","wrong":["When the target variable is a binary categorical variable (Binary Classification)","When the dataset has so many missing v // ---------- stats ----------
function modAcc(m){var r=P.recent[m]||[];return r.length?r.reduce(function(a,b){return a+b;},0)/r.length:null;}
function overallAcc(){var s=0,n=0;D.modules.forEach(function(m){(P.recent[m.id]||[]).forEach(function(v){s+=v;n++;});});return n?s/n:0;}
function coverage(){return Object.keys(P.answers).filter(function(k){return ALLQ_ID[k];}).length/ALLQ.length;}
function lastExam(){return P.exams[P.exams.length-1]||null;}
function readiness(){var le=lastExam();return Math.round(100*(0.6*overallAcc()+0.25*coverage()+0.15*(le?le.score/10:0)));}
function mistakeIds(){return Object.keys(P.mistakes).filter(function(k){return QMAP[k];});}
function daysLeft(){return P.settings.examDate?diffDays(today(),P.settings.examDate):null;}
function barClass(v){return v==null?'':v<0.5?'red':v<0.8?'yellow':'green';}
function weakest(){
  var list=QMODS.slice().map(function(m){var a=modAcc(m.id),n=(P.recent[m.id]||[]).length;return {m:m,score:(a==null?-1:(n<10?a-0.3:a))-m.priority*0.02};});
  list.sort(function(a,b){return a.score-b.score;});return list[0].m;
}

var TRK={q:[],t:0};
function track(type,detail){
  if(!window.AI_SERVER||!SJ||!SJ.id)return;
  TRK.q.push({type:type,ts:Date.now(),detail:detail||{}});if(TRK.q.length>200)TRK.q.shift();
  clearTimeout(TRK.t);TRK.t=setTimeout(trackFlush,TRK.q.length>=20?200:6000);
}
function trackFlush(){
  if(!TRK.q.length)return;var ev=TRK.q.splice(0,40);
  try{fetch('/api/event',{method:'POST',credentials:'same-origin',keepalive:true,headers:{'content-type':'application/json','x-requested-with':'ssg-web'},body:JSON.stringify({subject:SJ.id,events:ev})}).then(function(r){if(!r.ok&&r.status>=500)TRK.q=ev.concat(TRK.q);}).catch(function(){TRK.q=ev.concat(TRK.q).slice(-200);});}catch(e){}
  if(TRK.q.length){clearTimeout(TRK.t);TRK.t=setTimeout(trackFlush,1500);}
}

// Đo thời gian đọc lý thuyết (chỉ tính khi đang xem bài, tab hiển thị và có thao tác trong 2,5 phút gần nhất (đọc chữ thường không đụng chuột)) → điểm bảng xếp hạng
var RT={sec:0,mod:'',act:Date.now()};
['mousemove','keydown','scroll','touchstart','pointerdown','wheel'].forEach(function(ev){addEventListener(ev,function(){RT.act=Date.now();},{passive:true,capture:true});});
function rtFlush(){if(RT.sec>=5){track('read_time',{mod:RT.mod,secs:Math.min(120,RT.sec)});}RT.sec=0;}
setInterval(function(){
  var m=/^#\/learn\/([^?\/]+)/.exec(location.hash||'');
  if(m&&document.visibilityState==='visible'&&Date.now()-RT.act<150000){if(RT.mod&&RT.mod!==m[1])rtFlush();RT.mod=m[1];RT.sec+=5;if(RT.sec>=30)rtFlush();}
  else if(RT.sec)rtFlush();
},5000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')rtFlush();});
function record(q,ok,quiet){
  if(!quiet)track('quiz_answer',{id:q.id,ok:!!ok,src:q.bank?'bank':(q.type||'q'),mod:q.module||'',ref:q.ref||'',retry:q._retry||0});
  var a=P.answers[q.id]||(P.answers[q.id]={seen:0,correct:0});a.seen++;if(ok)a.correct++;a.lastOk=ok;
  var r=P.recent[q.module]||(P.recent[q.module]=[]);r.push(ok?1:0);if(r.length>20)r.splice(0,r.length-20);
  var m=P.mistakes[q.id];
  if(!ok){m=m||{wrong:0,streak:0};m.wrong++;m.streak=0;P.mistakes[q.id]=m;}
  else if(m){m.streak++;if(m.streak>=2)delete P.mistakes[q.id];}
  save();
}

  var cut=txt.length>ATT_FILE_CHARS;return {kind:'file',name:file.name,text:cut?txt.slice(0,ATT_FILE_CHARS):txt,note:'PDF '+pdf.numPages+' trang'+(cut||n<pdf.numPages?', chỉ đọc phần đầu':'')};}
async function attText(file){

async function attAdd(chat,files){
  chat.att=chat.att||[];chat.attBusy=(chat.attBusy||0);
  for(var i=0;i<files.length;i++){
    var f=files[i];chat.attBusy++;if(chat.attView)chat.attView();
    try{
      var isImg=/^image\//.test(f.type)||/\.(png|jpe?g|webp|gif|bmp)$/i.test(f.name);
      if(isImg){if(chat.att.filter(function(x){return x.kind==='img';}).length>=ATT_MAX_IMG)throw new Error('Gửi tối đa '+ATT_MAX_IMG+' ảnh mỗi lần');if(f.size>25e6)throw new Error('Ảnh quá lớn (trên 25 MB)');chat.att.push(await attImage(f));}

      else if(/^text\//.test(f.type)||ATT_TEXT_RE.test(f.name)){if(f.size>10e6)throw new Error('Tệp quá lớn (trên 10 MB)');chat.att.push(await attText(f));}
      else throw new Error('Chưa đọc được loại tệp "'+f.name+'". Hãy gửi ảnh, PDF hoặc tệp văn bản/mã nguồn.');
    }catch(e){if(typeof toast==='function')toast(e.message||'Không đọc được tệp');}
    chat.attBusy--;if(chat.attView)chat.attView();
  }
}

/** Thanh đính kèm + nút kẹp giấy + kéo thả/dán ảnh cho một khung chat. o: {btn,input,bar,box,ta} */
function attBind(chat,o){

    o.bar.hidden=!(chat.att.length||chat.attBusy);
    o.bar.innerHTML=chat.att.map(function(x,i){return '<span class="att-pill">'+(x.kind==='img'?'<img src="'+x.url+'" alt="">':ic('book'))+'<span class="att-n" title="'+esc(x.name+(x.note?' · '+x.note:''))+'">'+esc(x.name)+'</span><button type="button" data-rm="'+i+'" aria-label="Bỏ tệp">'+ic('close')+'</button></span>';}).join('')+(chat.attBusy?'<span class="att-pill busy"><i class="att-spin"></i> Đang đọc…</span>':'');
    [].forEach.call(o.bar.querySelectorAll('[data-rm]'),function(b){b.onclick=function(){chat.att.splice(+b.dataset.rm,1);chat.attView();};});

async function aiStream(chat,onDelta,opts){
  var model=aiModel(),openai=aiProvider()==='openai',rq=aiRequest(chat,opts);
  chat.ctrl=new AbortController();

        if(ev.usage){usage.in=ev.usage.prompt_tokens||0;usage.out=ev.usage.completion_tokens||0;}continue;}
      if(ev.type==='message_start'){usedModel=ev.message.model||model;usage.in=(ev.message.usage&&ev.message.usage.input_tokens)||0;}

        if(d.type==='text_delta')b.text=(b.text||'')+d.text;else if(d.type==='thinking_delta')b.thinking=(b.thinking||'')+d.thinking;else if(d.type==='signature_delta')b.signature=(b.signature||'')+d.signature;onDelta(blocks);}

function aiErrText(e){

    if(e.status===401)return 'Phiên đăng nhập đã hết. Tải lại trang để đăng nhập lại.';
    if(e.status===429)return e.message||'Bạn đã dùng hết lượt hỏi AI trong hôm nay. Mai quay lại nhé.';
    if(e.status===403)return 'Tài khoản chưa được cấp quyền môn này.';
    return 'Bố Tuấn Anh đang bận, thử lại sau ít phút. '+(e.message?'('+e.message+')':'');}
  if(e instanceof TypeError){if(aiProvider()==='anthropic')return 'Không kết nối được tới Claude API – kiểm tra mạng.';
    var host=aiUrl();try{host=new URL(aiUrl()).host;}catch(x){}
    return 'Không kết nối được tới '+host+'. Kiểm tra mạng và Base URL trong "Cài đặt". Nếu địa chỉ đúng mà vẫn lỗi, có thể dịch vụ này không cho gọi trực tiếp từ trình duyệt (lỗi CORS) – hỏi nhà cung cấp hoặc thử chuẩn API còn lại.';}

    return 'API key không hợp lệ hoặc đã bị thu hồi. Bấm "Cài đặt" để nhập lại.';}
  if(s===403)return 'Key không có quyền dùng model này. Thử đổi model trong "Cài đặt".';
  if(s===404)return 'Không tìm thấy địa chỉ API (404) – kiểm tra Base URL và chuẩn API trong "Cài đặt". '+e.message;

async function aiAsk(chat,text,shown,restoreDraft){

  chat.msgs.push({role:'user',content:text+fileTxt,shown:shown,imgs:imgs,att:att.map(function(x){return {kind:x.kind,name:x.name,url:x.kind==='img'?x.url:null,note:x.note||''};})});chat.busy=true;chat.err=null;chat.partial='';if(chat.attView)chat.attView();if(chat.view)chat.view();

    if(r.stop==='refusal')throw new Error('AI từ chối trả lời yêu cầu này. Thử hỏi lại theo cách khác.');

// Markdown nhẹ: tiêu đề, gạch đầu dòng, danh sách số, **đậm**, `code`
function mdInline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');}
function mdInline2(s){
  return s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g,'$1<i>$2</i>').replace(/~~(.+?)~~/g,'<s>$1</s>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
function mdLite(src){
  src=String(src==null?'':src).replace(/\r\n?/g,'\n');
  var holds=[];function hold(h){holds.push(h);return '\u0000'+(holds.length-1)+'\u0000';}
  function mj(tex,disp){tex=tex.trim();return hold('<'+(disp?'div':'span')+' class="mj'+(disp?' mj-d':'')+'" data-tex="'+esc(tex)+'">'+esc(tex)+'</'+(disp?'div':'span')+'>');}
  // khối code
  src=src.replace(/\x60\x60\x60([\w+#.-]*)[^\n]*\n([\s\S]*?)(?:\x60\x60\x60|$)/g,function(_,lang,code){
    return '\n'+hold('<div class="cb"><div class="cb-h"><span>'+esc(lang||'code')+'</span><button type="button" class="cb-copy">Chép</button></div><pre><code>'+esc(code.replace(/\n$/,''))+'</code></pre></div>')+'\n';});
  // công thức: $$..$$, \[..\], \(..\), $..$
  src=src.replace(/\$\$([\s\S]+?)\$\$/g,function(_,t){return '\n'+mj(t,true)+'\n';})
    .replace(/\\\[([\s\S]+?)\\\]/g,function(_,t){return '\n'+mj(t,true)+'\n';})
    .replace(/\\\(([\s\S]+?)\\\)/g,function(_,t){return mj(t,false);})
    .replace(/\$([^\s$](?:[^$\n]*?[^\s$])?)\$/g,function(_,t){return mj(t,false);});
  src=src.replace(/\x60([^\x60\n]+)\x60/g,function(_,c){return hold('<code>'+esc(c)+'</code>');});
  var lines=src.split('\n'),out=[],i=0;
  function inl(s){return mdInline2(esc(s));}
  function cells(l){return l.trim().replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim();});}
  while(i<lines.length){
    var ln=lines[i],m;
    if(!ln.trim()){i++;continue;}
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(ln)){out.push('<hr>');i++;continue;}
    if((m=ln.match(/^\s*(#{1,4})\s+(.*)/))){var lv=Math.min(4,m[1].length+1);out.push('<h'+lv+' class="md-h">'+inl(m[2])+'</h'+lv+'>');i++;continue;}
    if(/^\s*\|.*\|\s*$/.test(ln)&&i+1<lines.length&&/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i+1])){
      var head=cells(ln),al=cells(lines[i+1]).map(function(c){return /^:-+:$/.test(c)?'center':/-:$/.test(c)?'right':'left';}),rows=[];i+=2;
      while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){rows.push(cells(lines[i]));i++;}
      out.push('<div class="md-tbl"><table><thead><tr>'+head.map(function(c,k){return '<th style="text-align:'+(al[k]||'left')+'">'+inl(c)+'</th>';}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+head.map(function(_,k){return '<td style="text-align:'+(al[k]||'left')+'">'+inl(r[k]||'')+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>');
      continue;
    }
    if(/^\s*>\s?/.test(ln)){var q=[];while(i<lines.length&&/^\s*>\s?/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,''));i++;}out.push('<blockquote>'+q.map(inl).join('<br>')+'</blockquote>');continue;}
    if(/^\s*([-*•]|\d+[.)])\s+/.test(ln)){
      var stack=[],html='';
      while(i<lines.length&&(m=lines[i].match(/^(\s*)([-*•]|\d+[.)])\s+(.*)/))){
        var ind=Math.floor(m[1].replace(/\t/g,'  ').length/2),tag=/\d/.test(m[2])?'ol':'ul';
        while(stack.length>ind+1){html+='</li></'+stack.pop()+'>';}
        if(stack.length===ind+1){if(stack[ind]!==tag){html+='</li></'+stack.pop()+'>';html+='<'+tag+'>';stack.push(tag);}else html+='</li>';}
        else{while(stack.length<ind+1){html+='<'+tag+'>';stack.push(tag);}}
        html+='<li>'+inl(m[3]);i++;
      }
      while(stack.length)html+='</li></'+stack.pop()+'>';
      out.push(html);continue;
    }
    var para=[];
    while(i<lines.length&&lines[i].trim()&&!/^\s*(#{1,4}\s|>|([-*•]|\d+[.)])\s+|\|.*\||-{3,}\s*$)/.test(lines[i])){para.push(lines[i]);i++;}
    if(!para.length){para.push(lines[i]);i++;}
    out.push('<p>'+para.map(inl).join('<br>')+'</p>');
  }
  var html=out.join('').replace(/\u0000(\d+)\u0000/g,function(_,k){return holds[+k];});
  return '<div class="md">'+html+'</div>';
}

function secText(ref){var m=MOD[modOfRef(ref)];if(!m)return '';var s=m.sections.filter(function(x){return x.id===ref;})[0];if(!s)return '';
  var d=document.createElement('div');d.innerHTML=s.h.replace(/<\/(li|p|tr|h\d)>/g,'\n</$1>');return ('§'+s.id+' '+s.t+'\n'+d.textContent.replace(/\n\s*\n+/g,'\n').trim()).slice(0,1800);}
/** ctx: {lang, opts: các đáp án theo thứ tự đang hiện, picked: đáp án đã chọn (hoặc null), answered} */
function aiPrompt(q,ctx){
  var t=T(q,ctx.lang),hint=!ctx.answered,good=q.answers||[t.correct];
  var letters=function(arr){return arr.map(function(x){return L[ctx.opts.indexOf(x)];}).filter(Boolean).sort().join(', ');};
  var ans=letters(good),mine=ctx.picked!=null?letters([].concat(ctx.picked)):'';
  return [
    'Đây là một câu trắc nghiệm môn '+SJ.aiField+'.'+(hint?'':' Đáp án trong app CÓ THỂ BỊ SAI.'),
    q.past?'Câu này lấy từ đề thi kì trước; đề không kèm đáp án nên đáp án trong app do người soạn tự xác định.':null,
    q.bank?'Câu này lấy từ bộ đề ôn tập '+SJ.name+' do sinh viên tổng hợp ('+q.section+'); đáp án trong bộ đề có thể sai.':null,
    good.length>1?'Câu này chọn '+good.length+' đáp án.':null,
    hint?'Tôi đang tự làm câu này. ĐỪNG nói thẳng đáp án: hãy gợi ý kiến thức cần dùng và hướng suy luận để tôi tự chọn. Chỉ nói đáp án khi tôi xin. Trả lời ngắn gọn bằng tiếng Việt.'
        :'Hãy tự giải độc lập trước, sau đó so với đáp án trong app và kết luận rõ: ĐÚNG hay SAI (nếu sai thì đáp án đúng là gì). Giải thích ngắn gọn bằng tiếng Việt.',
    '','Câu hỏi:',t.q,''
  ].concat(ctx.opts.map(function(o,i){return L[i]+'. '+o;})).concat([
    '',
    hint?null:'Đáp án trong app: '+ans,
    !hint&&mine&&mine!==ans?'Tôi đã chọn: '+mine:null,
    hint?null:(q.explain?'Giải thích trong app: '+q.explain:null),
    q.ref?'\nTrích tài liệu môn liên quan:\n'+secText(q.ref):null
  ]).filter(function(x){return x!=null;}).join('\n');
}

/** Hàng nút "Hỏi Bố" + khung chat, vẽ vào el. getCtx() trả về ctx hiện tại của câu. */
function aiBox(el,q,getCtx){
  var chat=aiChat(q.id);
  function draw(){
    var ctx=getCtx(),hint=!ctx.answered,hasKey=!!AiCfg.get().key;
    var isFirstHint=!localStorage.getItem('ssg_hint_seen');
    el.innerHTML='<div class="ai-bar'+(chat.open?' open':'')+'"><div class="ai-bar-l"><span class="ai-badge">'+ic('spark')+'</span><div><div class="row" style="gap:6px;align-items:center"><b>Bố Tuấn Anh</b>'+(hint&&isFirstHint?'<span class="tag ok" style="font-size:.72em;padding:1px 7px">Tính năng gợi ý</span>':'')+'</div><div class="small muted">'+
        (hint?'Bí? Nhận gợi ý phương pháp giải — AI không làm lộ đáp án.':'Chưa chắc đáp án? Để AI tự giải và đối chiếu.')+'</div></div></div>'+
      '<div class="ai-bar-r"><button class="btn sm primary ai-btn-quick" data-ai="quick">'+(hint?ic('bulb')+'Gợi ý':ic('check')+' Kiểm tra đáp án')+'</button>'+
      '<button class="btn sm'+(chat.open?' on':'')+'" data-ai="toggle">'+(chat.open?'Thu gọn':ic('chat')+'Hỏi Bố'+(chat.msgs.length?' ('+chat.msgs.length/2+')':''))+'</button>'+
      '<details class="ai-ext"><summary class="btn sm ghost" title="Mở ở trang chat ngoài (không cần API key)">'+ic('ext')+'</summary><div class="ai-ext-menu"><div class="small muted">Mở ở trang chat ngoài, prompt được chép sẵn:</div>'+
        AI_SITES.map(function(s,i){return '<button class="btn sm" data-site="'+i+'">'+s[0]+' '+ic('ext')+'</button>';}).join('')+'</div></details></div>'+
      (hint&&isFirstHint?'<div class="ai-first-coach">'+ic('info')+' <b>Bố Tuấn Anh:</b> Khi gặp câu hỏi khó, bấm <b>“Gợi ý”</b> để nhận manh mối từng bước mà không lo bị lộ đáp án!</div>':'')+
      '<div class="ai-note"></div></div>'+(chat.open?'<div class="ai-chat"></div>':'');
    $('[data-ai="toggle"]',el).onclick=function(){chat.open=!chat.open;localStorage.setItem('ssg_hint_seen','1');draw();};
    $('[data-ai="quick"]',el).onclick=function(){
      chat.open=true;localStorage.setItem('ssg_hint_seen','1');draw();
      if(!hasKey)return;   // chưa có key → khung chat hiện form cài đặt
      aiAsk(chat,aiPrompt(q,getCtx()),hint?'Gợi ý giúp tôi cách làm câu này (chưa nói đáp án).':'Kiểm tra giúp tôi đáp án câu này.',false);
    };
    $$('[data-site]',el).forEach(function(b){b.onclick=function(){var s=AI_SITES[+b.dataset.site],text=aiPrompt(q,getCtx()),ok=copyText(text);window.open(s[1]+encodeURIComponent(text),'_blank','noopener');$('.ai-note',el).textContent=ok?'Đã mở '+s[0]+' và chép sẵn prompt – nếu ô chat trống thì dán (Ctrl+V).':'Đã mở '+s[0]+'.';$('details',el).open=false;};});
    if(chat.open)aiPanel($('.ai-chat',el),q,getCtx,chat);
  }
  el._aiDraw=draw;draw();
}
var AI_CHIPS_HINT=['Gợi ý cách làm câu này','Giải thích các thuật ngữ trong câu','Dịch câu hỏi sang tiếng Việt'];
var AI_CHIPS_CHECK=['Vì sao các đáp án còn lại sai?','Cho ví dụ thực tế dễ nhớ','Mẹo ghi nhớ kiến thức này','Câu này hay bị bẫy ở đâu?'];
function aiPanel(box,q,getCtx,chat){
  function show(editing){if(AI_SRV||(AiCfg.get().key&&!editing))chatView();else keyForm();}
  function keyForm(){
    var cfg=AiCfg.get(),prov=aiProvider();
    box.innerHTML='<div class="ai-chat-head"><b>'+ic('gear')+' Cài đặt chatbot</b></div><p class="muted small" id="aihint" style="margin:0"></p>'+
      '<label class="ai-field">Nhà cung cấp<select id="aiprov">'+Object.keys(AI_PROVIDERS).map(function(k){return '<option value="'+k+'"'+(k===prov?' selected':'')+'>'+esc(AI_PROVIDERS[k])+'</option>';}).join('')+'</select></label>'+
      '<label class="ai-field" id="aibasef">Base URL (địa chỉ API của dịch vụ)<input id="aibase" type="url" placeholder="vd: https://api.dichvu.com/v1" value="'+esc(cfg.base||'')+'"></label>'+
      '<label class="ai-field">API key<span class="ai-keyrow"><input id="aikey" type="password" autocomplete="off" spellcheck="false" value="'+esc(cfg.key||'')+'"><button type="button" class="btn sm" id="aieye">Hiện</button></span></label>'+
      '<p class="small muted" id="ailink" style="margin:-4px 0 6px">Chưa có key? Tạo ở <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a> (cần nạp tiền vào tài khoản API).</p>'+
      '<label class="ai-field" id="aimodf">Model<select id="aimod">'+Object.keys(AI_MODELS).map(function(id){var m=AI_MODELS[id];return '<option value="'+id+'"'+(id===aiModel()?' selected':'')+'>'+m.name+' ('+m.note+') – $'+m.price[0]+' / $'+m.price[1]+' mỗi 1 triệu token vào / ra</option>';}).join('')+'</select></label>'+
      '<label class="ai-field" id="aimodtf">Model<input id="aimodt" type="text" list="ai-ids" placeholder="Tên model theo dịch vụ, vd: claude-opus-5-5" value="'+esc(prov==='anthropic'?'':(cfg.model||''))+'"><datalist id="ai-ids">'+Object.keys(AI_MODELS).map(function(id){return '<option value="'+id+'">';}).join('')+'</datalist></label>'+
      '<label class="check"><input type="checkbox" id="aiauto"'+(cfg.autoCheck!==false?' checked':'')+'> Tự động đối chiếu đáp án ngay khi trả lời một câu trong Luyện tập (mỗi câu tốn 1 lượt gọi API)</label>'+
      '<label class="check"><input type="checkbox" id="aitr"'+(cfg.autoTranslate!==false?' checked':'')+'> Bôi đen chữ tiếng Anh là tự dịch (mỗi đoạn mới tốn 1 lượt gọi API nhỏ)</label>'+
      '<p class="muted small" style="margin:6px 0 8px">Key chỉ lưu trong trình duyệt này, không nằm trong file HTML – gửi file cho bạn bè không lộ key.</p>'+
      '<div class="row" style="justify-content:flex-end">'+(cfg.key?'<button class="btn sm ghost" id="aidel">Xoá key</button><button class="btn sm" id="aicancel">Huỷ</button>':'')+'<button class="btn sm primary" id="aisave">Lưu</button></div>';
    function sync(){var off=$('#aiprov',box).value==='anthropic';$('#aibasef',box).hidden=$('#aimodtf',box).hidden=off;$('#aimodf',box).hidden=!off;
      $('#aikey',box).placeholder=off?'sk-ant-…':'Dán API key của dịch vụ…';$('#ailink',box).hidden=!off;
      $('#aihint',box).textContent=off?'Dán Claude API key (tạo ở console.anthropic.com). Mỗi lần hỏi được tính phí vào tài khoản API của bạn – nên đặt giới hạn chi tiêu cho key.':'Lấy Base URL, chuẩn API (Anthropic hay OpenAI) và tên model trong trang hướng dẫn của dịch vụ bạn mua key. Dịch vụ phải cho phép gọi trực tiếp từ trình duyệt (CORS).';}
    $('#aiprov',box).onchange=sync;sync();
    $('#aieye',box).onclick=function(){var k=$('#aikey',box),show=k.type==='password';k.type=show?'text':'password';this.textContent=show?'Ẩn':'Hiện';};
    function save(){
      var k=$('#aikey',box).value.trim(),p=$('#aiprov',box).value,off=p==='anthropic',base=$('#aibase',box).value.trim(),mt=$('#aimodt',box).value.trim();
      if(!k)return $('#aikey',box).focus();
      if(!off&&!/^https?:\/\/\S+$/i.test(base)){toast('Nhập Base URL bắt đầu bằng https://');return $('#aibase',box).focus();}
      if(!off&&!mt)return $('#aimodt',box).focus();
      function commit(){var next={key:k,provider:p,base:off?'':base,model:off?$('#aimod',box).value:mt,autoCheck:$('#aiauto',box).checked,autoTranslate:$('#aitr',box).checked},old=AiCfg.get();
        if(old.provider!==next.provider||old.base!==next.base||old.model!==next.model)Object.keys(aiChats).forEach(function(id){if(!aiChats[id].busy)aiChats[id].msgs=[];});
        AiCfg.set(next);chat.err=null;show(false);}
      if(off&&k.indexOf('sk-ant-')!==0)confirmBox('Key này không giống key Anthropic chính hãng (thường bắt đầu bằng “sk-ant-”). Nếu bạn mua key ở dịch vụ khác, bấm Huỷ rồi chọn “Bên thứ 3” ở ô Nhà cung cấp.<br><br>Vẫn lưu với Anthropic chính hãng?','Vẫn lưu').then(function(y){if(y)commit();});
      else commit();
    }
    [$('#aikey',box),$('#aibase',box),$('#aimodt',box)].forEach(function(n){n.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();save();}};});
    $('#aisave',box).onclick=save;
    if($('#aicancel',box))$('#aicancel',box).onclick=function(){show(false);};
    if($('#aidel',box))$('#aidel',box).onclick=function(){confirmBox('Xoá API key khỏi trình duyệt này?','Xoá key',true).then(function(y){if(y){AiCfg.set(Object.assign({},AiCfg.get(),{key:''}));show(true);}});};
    setTimeout(function(){$('#aikey',box).focus();});
  }
  function chatView(){
    box.innerHTML='<div class="ai-chat-head"><div class="ai-who"><span class="ai-badge sm">'+ic('spark')+'</span><div><b>Bố Tuấn Anh</b><div class="small muted">'+(AI_SRV?'Hỏi đáp riêng cho môn này':esc(aiModelName())+(aiProvider()==='anthropic'?'':' · bên thứ 3'))+'</div></div></div>'+
      '<span class="row" style="gap:2px"><button class="iconbtn sm" id="aiclr" title="Xoá hội thoại" aria-label="Xoá hội thoại">'+ic('trash')+'</button>'+(AI_SRV?'':'<button class="iconbtn sm" id="aicfg" title="Cài đặt chatbot" aria-label="Cài đặt chatbot">'+ic('gear')+'</button>')+'</span></div>'+
      '<div class="ai-log" aria-live="polite"></div><div class="ai-chips"></div>'+
      '<div class="att-bar" id="aiAtt" hidden></div><div class="ai-compose"><button class="iconbtn att-btn" id="aiAt" type="button" title="Đính kèm ảnh, PDF hoặc tệp văn bản" aria-label="Đính kèm">'+ic('clip')+'</button><input type="file" id="aiFile" multiple hidden accept="'+ATT_ACCEPT+'"><textarea class="ai-input" rows="1" placeholder="Hỏi thêm về câu này…"></textarea><button class="btn sm" id="aistop" hidden>■ Dừng</button><button class="ai-send" id="aisend" aria-label="Gửi">'+ic('arrow')+'</button></div>'+
      '<div class="ai-foot small muted"><span><kbd>Enter</kbd> gửi · <kbd>Shift</kbd>+<kbd>Enter</kbd> xuống dòng</span><span>Hội thoại mất khi tải lại trang</span></div>';
    var log=$('.ai-log',box),input=$('.ai-input',box),chips=$('.ai-chips',box);input.value=chat.draft||'';
    function grow(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px';}
    input.oninput=function(){chat.draft=input.value;grow();};
    input.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}if(e.key==='Escape')input.blur();};
    attBind(chat,{btn:$('#aiAt',box),input:$('#aiFile',box),bar:$('#aiAtt',box),box:box,ta:input});
    $('#aistop',box).onclick=function(){if(chat.ctrl)chat.ctrl.abort();};
    $('#aisend',box).onclick=function(){send();};
    $('#aiclr',box).onclick=function(){if(!chat.busy){chat.msgs=[];chat.err=null;chat.retry=null;draw();}};
    if($('#aicfg',box))$('#aicfg',box).onclick=function(){show(true);};
    function ask(t,shown,restore){aiAsk(chat,chat.msgs.length?t:aiPrompt(q,getCtx())+'\n\nCâu hỏi của tôi: '+t,shown||t,restore);}
    function send(t){t=(t||input.value).trim();if((!t&&!(chat.att&&chat.att.length))||chat.busy||chat.attBusy)return;if(!t)t='Hãy xem giúp tôi phần đính kèm này.';input.value='';chat.draft='';grow();ask(t,t,true);}
    function bubble(m,i){
      var asst=m.role==='assistant';
      return '<div class="ai-msg '+m.role+'">'+(asst?'<span class="ai-badge xs">'+ic('spark')+'</span>':'')+'<div class="ai-bub"><div class="ai-msg-text">'+(asst?mdLite(m.shown):esc(m.shown)+attHtml(m))+'</div>'+
        (asst?'<div class="ai-msg-meta"><span>'+esc(m.meta||'')+'</span><button class="link-btn" data-copy="'+i+'">Chép</button></div>':'')+'</div></div>';
    }
    function draw(){
      var hint=!getCtx().answered;
      log.innerHTML=(!chat.msgs.length&&!chat.busy&&!chat.err?'<div class="ai-empty">'+(hint
          ?'Bạn đang làm câu này nên AI chỉ <b>gợi ý</b>, không nói đáp án. Chọn một gợi ý bên dưới hoặc tự gõ câu hỏi.'
          :'AI sẽ tự giải độc lập rồi đối chiếu với đáp án trong app. Bấm <b>Kiểm tra đáp án</b> hoặc hỏi bất kỳ điều gì về câu này.')+'</div>':'')+
        chat.msgs.map(bubble).join('')+
        (chat.busy?'<div class="ai-msg assistant pending"><span class="ai-badge xs">'+ic('spark')+'</span><div class="ai-bub"><div class="ai-msg-text">'+(chat.partial?mdLite(chat.partial):'<span class="typing"><i></i><i></i><i></i></span>')+'</div></div></div>':'')+
        (chat.err?'<div class="ai-err"><span>'+esc(chat.err)+'</span>'+(chat.retry?'<button class="btn sm" id="airetry">Thử lại</button>':'')+'</div>':'');
      var list=(chat.msgs.length?[]:[hint?'Gợi ý cách làm':'Kiểm tra đáp án']).concat(hint?AI_CHIPS_HINT.slice(1):AI_CHIPS_CHECK);
      chips.innerHTML=chat.busy?'':list.map(function(c,k){return '<button class="ai-chip" data-chip="'+k+'">'+esc(c)+'</button>';}).join('');
      $$('[data-chip]',chips).forEach(function(b){b.onclick=function(){var c=list[+b.dataset.chip];
        if(!chat.msgs.length&&+b.dataset.chip===0)aiAsk(chat,aiPrompt(q,getCtx()),hint?'Gợi ý giúp tôi cách làm câu này (chưa nói đáp án).':'Kiểm tra giúp tôi đáp án câu này.',false);
        else ask(c);};});
      $$('[data-copy]',log).forEach(function(b){b.onclick=function(){copyText(chat.msgs[+b.dataset.copy].shown);b.textContent='Đã chép';setTimeout(function(){b.textContent='Chép';},1500);};});
      if($('#airetry',log))$('#airetry',log).onclick=function(){var r=chat.retry;chat.retry=null;chat.err=null;if(r)aiAsk(chat,r.text,r.shown,true);};
      $('#aisend',box).disabled=chat.busy;$('#aistop',box).hidden=!chat.busy;$('#aiclr',box).hidden=!chat.msgs.length;
      if(!chat.busy&&chat.draft&&!input.value){input.value=chat.draft;grow();}
      log.scrollTop=log.scrollHeight;
    }
    chat.view=function(){if(log.isConnected)draw();};draw();grow();
  }
  show(false);
}
/** Trả lời xong 1 câu: đã cài chatbot + bật tự động thì mở chat và nhờ AI đối chiếu (mỗi câu 1 lần) */
function aiAutoCheck(el,q,getCtx){
  var cfg=AiCfg.get();if(!cfg.key||cfg.autoCheck===false)return;
  var chat=aiChat(q.id);if(chat.autoChecked||chat.busy)return;
  chat.autoChecked=true;chat.open=true;if(el._aiDraw)el._aiDraw();
  aiAsk(chat,aiPrompt(q,getCtx()),'Kiểm tra giúp tôi đáp án câu này.',false);
}

// ---------- Dịch Anh → Việt ----------
function googleTr(text){return 'https://translate.google.com/?sl=en&tl=vi&op=translate&text='+encodeURIComponent(text.slice(0,4000));}
async function aiTranslate(text,onDelta){var r=await aiStream({msgs:[{role:'user',content:text}]},function(b){if(onDelta)onDelta(blocksText(b));},{system:TR_SYSTEM,effort:'low'});
  if(r.stop==='refusal')throw new Error('AI từ chối dịch đoạn này.');return blocksText(r.blocks).trim();}
var trState={};
/** Khung dịch cho câu đang hiện bằng tiếng Anh. Câu trong ngân hàng: dùng sẵn bản tiếng Việt (miễn phí);
    câu đề kì trước: nhờ AI dịch (lưu lại), chưa cài chatbot thì mở Google Dịch. opts = đáp án tiếng Anh theo thứ tự đang hiện. */
function trToggle(el,btn,q,opts){
  var st=trState[q.id]||(trState[q.id]={});
  if(st.open){st.open=false;el.innerHTML='';btn.textContent='Dịch';return;}
  var en=T(q,'en'),srcEn=[en.correct].concat(en.wrong),srcVi=[q.correct].concat(q.wrong);
  if(q.en&&!q.past){st.open=true;btn.textContent='Ẩn bản dịch';
    el.innerHTML='<div class="tr-box"><b>Bản tiếng Việt</b><div>'+qhtml(q.q)+'</div><ol class="tr-opts">'+opts.map(function(o,i){return '<li><b>'+L[i]+'.</b> '+esc(srcVi[srcEn.indexOf(o)]||o)+'</li>';}).join('')+'</ol></div>';return;}
  var full=[q.q].concat(q.orig).join('\n'),cached=TrCache.get()[q.id];
  if(!cached&&!AiCfg.get().key){window.open(googleTr(full),'_blank','noopener');return;}
  st.open=true;btn.textContent='Ẩn bản dịch';
  function paint(raw,loading,err){
    var p=raw&&trParse(raw);
    el.innerHTML='<div class="tr-box"><div class="row between"><b>Bản dịch</b><a class="small" href="'+googleTr(full)+'" target="_blank" rel="noopener">Google Dịch '+ic('ext')+'</a></div>'+
      (err?'<div class="ai-err">'+esc(err)+'</div>':loading?'<div class="muted">'+esc((raw||'Đang dịch…').replace(/<<\s*(Q|\d+)\s*>>\s*/g,''))+'</div>':
      p?'<div>'+qhtml(p.q)+'</div><ol class="tr-opts">'+opts.map(function(o,i){return '<li><b>'+L[i]+'.</b> '+esc(p.opts[q.orig.indexOf(o)]||o)+'</li>';}).join('')+'</ol>':'<div>'+qhtml(raw)+'</div>')+'</div>';
  }
  if(cached)return paint(cached);
  paint('',true);
  var src='Dịch nội dung dưới đây. Giữ nguyên các dấu mốc <<Q>>, <<1>>, <<2>>… ở đầu mỗi phần, không thêm gì khác.\n\n'+['<<Q>>',q.q].concat([].concat.apply([],q.orig.map(function(o,i){return ['<<'+(i+1)+'>>',o];}))).join('\n');

function trOnSelect(e){

    var range=sel.getRangeAt(0),node=range.commonAncestorContainer,host=node.nodeType===1?node:node.parentElement;
    if(!host||!host.closest('#content')||host.closest('input,textarea,select,.ai-log,.tr-box,.tr-pop'))return;
    if(host.closest('.dock'))return;
    var viet=/[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i.test(text);
    if(text.length>=3&&(viet||text.length>1500)&&text.length<=3000){askPopShow(text,range.getBoundingClientRect());return;}

}

var DK_KEY='dock_geo';
function dkGet(){try{var g=JSON.parse(localStorage.getItem(DK_KEY)||'null');if(g&&g.w&&g.h)return g;}catch(e){}return null;}
function dkSave(g){try{localStorage.setItem(DK_KEY,JSON.stringify(g));}catch(e){}}
function dkClamp(g){
  var W=window.innerWidth,H=window.innerHeight;
  g.w=Math.max(300,Math.min(g.w,W));g.h=Math.max(320,Math.min(g.h,H));
  g.x=Math.max(0,Math.min(g.x,W-g.w));g.y=Math.max(0,Math.min(g.y,H-g.h));return g;
}
function dkApply(g){var s=dock.el.style;s.left=g.x+'px';s.top=g.y+'px';s.width=g.w+'px';s.height=g.h+'px';s.right='auto';s.bottom='auto';}
function dkReset(){
  dock.max=false;try{localStorage.removeItem(DK_KEY);}catch(e){}
  var s=dock.el.style;s.left=s.top=s.width=s.height=s.right=s.bottom='';
}
function dkCur(){var r=dock.el.getBoundingClientRect();return {x:r.left,y:r.top,w:r.width,h:r.height};}
function dockFloat(){
  if(window.innerWidth<=760)return;
  ['n','s','e','w','ne','nw','se','sw'].forEach(function(d){var h=document.createElement('div');h.className='dk-h '+d;h.dataset.d=d;dock.el.appendChild(h);});
  var g=dkGet();if(g)dkApply(dkClamp(g));
  var drag=null;
  function down(e){
    if(window.innerWidth<=760||e.button>0)return;
    var t=e.target,h=t.closest&&t.closest('.dk-h'),hd=t.closest&&t.closest('.dk-head');
    if(!h&&!(hd&&!t.closest('button')))return;
    var c=dkCur();drag={mode:h?h.dataset.d:'move',sx:e.clientX,sy:e.clientY,c:c};
    dock.el.classList.add(h?'resizing':'dragging');e.preventDefault();
    document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
  }
  function move(e){
    if(!drag)return;var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy,c=drag.c,g={x:c.x,y:c.y,w:c.w,h:c.h},W=window.innerWidth,H=window.innerHeight,m=drag.mode;
    if(m==='move'){g.x=c.x+dx;g.y=c.y+dy;}
    else{
      if(m.indexOf('e')>=0)g.w=Math.min(c.w+dx,W-c.x);
      if(m.indexOf('s')>=0)g.h=Math.min(c.h+dy,H-c.y);
      if(m.indexOf('w')>=0){var nw=Math.min(Math.max(300,c.w-dx),c.x+c.w);g.x=c.x+c.w-nw;g.w=nw;}
      if(m.indexOf('n')>=0){var nh=Math.min(Math.max(320,c.h-dy),c.y+c.h);g.y=c.y+c.h-nh;g.h=nh;}
    }
    dock.max=false;dkApply(dkClamp(g));
  }
  function up(){
    document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
    dock.el.classList.remove('dragging','resizing');if(drag){dkSave(dkClamp(dkCur()));}drag=null;
  }
  dock.el.addEventListener('pointerdown',down);
  $('.dk-head',dock.el).addEventListener('dblclick',function(e){if(e.target.closest('button'))return;dkReset();});
  var mx=$('#dkMx',dock.el);
  if(mx)mx.onclick=function(){
    if(dock.max){dock.max=false;var g=dock.prev;if(g){dkApply(dkClamp(g));dkSave(g);}else dkReset();return;}
    dock.prev=dkCur();dock.max=true;
    var W=window.innerWidth,H=window.innerHeight,w=Math.min(W-40,Math.max(dock.prev.w,Math.round(W*.6))),h=H-40;
    dkApply(dkClamp({x:Math.round((W-w)/2),y:20,w:w,h:h}));
  };
  window.addEventListener('resize',function(){if(window.innerWidth<=760){dock.el.style.cssText='';return;}var g=dkGet();if(g)dkApply(dkClamp(g));});
}
function dockSend(q){

    text='Trả lời bằng tiếng Việt, ngắn gọn, đúng trọng tâm, giữ nguyên thuật ngữ tiếng Anh.'+(ctx.text?'\n\n[Tài liệu môn '+SJ.name+' — '+ctx.label+']\n'+ctx.text:'')+(dock.quote?'\n\n[Đoạn sinh viên bôi đen]\n"'+dock.quote+'"':'')+'\n\n[Câu hỏi]\n'+q;

  $$('#dkChips .chip',dock.el).forEach(function(b){b.onclick=function(){if(!c.busy)dockSend(chips[+b.dataset.i]);};});
}

function tidyLesson(h){
  var d=document.createElement('div');d.innerHTML=h;
  // 1. bảng chứa code → khối code có nhãn ngôn ngữ + nút chép
  d.querySelectorAll('table').forEach(function(t){
    if(!t.querySelector('td')&&t.querySelector('code')){
      t.querySelectorAll('br').forEach(function(b){b.replaceWith('\n');});
      var rows=[].map.call(t.querySelectorAll('tr'),function(r){return r.textContent;}),code=rows.join('\n').replace(/^\n+|\s+$/g,'');
      var lang=/^\s*(SELECT|INSERT|CREATE|UPDATE|DELETE)\b/im.test(code)?'sql':/\b(import|def|print|cv2\.|np\.|pd\.|plt\.|from)\b/.test(code)?'python':'code';
      var w=document.createElement('div');w.className='cb';w.innerHTML='<div class="cb-h"><span></span><button type="button" class="cb-copy">Chép</button></div><pre><code></code></pre>';
      w.querySelector('span').textContent=lang;w.querySelector('code').textContent=code;t.replaceWith(w);
    }else{var w2=document.createElement('div');w2.className='tbl-wrap';t.parentNode.insertBefore(w2,t);w2.appendChild(t);}
  });
  // 2. chỗ hình còn lại: gộp các chỗ liền nhau thành một khung "hình trong tài liệu gốc"
  d.querySelectorAll('.img-ph').forEach(function(x){
    var p=x.previousSibling;while(p&&p.nodeType===3&&!p.textContent.trim())p=p.previousSibling;
    if(p&&p.nodeType===1&&p.classList&&p.classList.contains('fig-ph')){x.remove();return;}
    var f=document.createElement('span');f.className='fig-ph';f.innerHTML='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg><span>Hình minh hoạ trong slide gốc</span>';x.replaceWith(f);
  });
  d.querySelectorAll('p').forEach(function(p){var only=p.querySelector('.fig-ph')&&!p.textContent.replace('Hình minh hoạ trong slide gốc','').trim();if(!only)return;var pv=p.previousElementSibling;if(pv&&pv.classList.contains('fig-only')){var c=pv.querySelector('.fig-n'),k=(+pv.dataset.n||1)+1;pv.dataset.n=k;c.textContent=k+' hình';p.parentNode.removeChild(p);}else{p.classList.add('fig-only');p.dataset.n=1;var sp=document.createElement('b');sp.className='fig-n';p.querySelector('.fig-ph').appendChild(sp);}});
  // 3. văn bản: $…$ → công thức KaTeX; λ1, σ2… → chỉ số dưới
  var tw=document.createTreeWalker(d,NodeFilter.SHOW_TEXT,null),ns=[],n;
  while((n=tw.nextNode())){if(n.parentNode.closest&&n.parentNode.closest('code,pre,.cb,.mj'))continue;if(/\$[^$]+\$|[λσθαβμεΔ][0-9]|[A-Za-z]_[A-Za-z0-9]/.test(n.textContent))ns.push(n);}
  ns.forEach(function(t){
    var s=t.textContent,frag=document.createDocumentFragment(),re=/\$\$([^$]+)\$\$|\$([^$\n]+)\$|([λσθαβμεΔ])([0-9])|(?<![A-Za-z0-9_])([A-Za-z])_([A-Za-z0-9]{1,2})(?![A-Za-z0-9_])/g,last=0,m;
    while((m=re.exec(s))){
      if(m.index>last)frag.appendChild(document.createTextNode(s.slice(last,m.index)));
      if(m[3]||m[5]){var sp=document.createElement('span');sp.className='gsub';sp.appendChild(document.createTextNode(m[3]||m[5]));var sb=document.createElement('sub');sb.textContent=m[4]||m[6];sp.appendChild(sb);frag.appendChild(sp);}
      else{var mj=document.createElement(m[1]?'div':'span');mj.className='mj'+(m[1]?' mj-d':'');mj.setAttribute('data-tex',(m[1]||m[2]).trim());mj.textContent=(m[1]||m[2]).trim();frag.appendChild(mj);}
      last=re.lastIndex;
    }
    if(last<s.length)frag.appendChild(document.createTextNode(s.slice(last)));
    t.parentNode.replaceChild(frag,t);
  });
  // 4. ô ghi chú: đoạn bắt đầu bằng Lưu ý / Note / Mẹo / Ghi nhớ / Chú ý / Ví dụ
  d.querySelectorAll('p,li').forEach(function(p){
    var tx=(p.textContent||'').trim(),m=tx.match(/^(Lưu ý|Note|Chú ý|Cảnh báo|Mẹo|Tip|Ghi nhớ|Ví dụ|Example)\b\s*[:：-]?/i);
    if(!m)return;var k=m[1].toLowerCase(),cls=/lưu ý|note|chú ý|cảnh báo/.test(k)?'warn':/mẹo|tip|ghi nhớ/.test(k)?'tip':'ex';

  });
  // bỏ thẻ code/đoạn rỗng sót lại từ tài liệu gốc
  d.querySelectorAll('code').forEach(function(c){if(!c.closest('.cb')&&!c.textContent.trim())c.replaceWith(document.createTextNode(' '));});
  d.querySelectorAll('p').forEach(function(p){if(!p.textContent.trim()&&!p.querySelector('img,.mj,.fig-ph'))p.parentNode.removeChild(p);});
  // tiêu đề con chưa có số thứ tự thì tự đánh số theo mục
  d.querySelectorAll('h4').forEach(function(x){if(!/^\s*(\d+[.)]|[IVX]+\.|Bước\s+\d)/i.test(x.textContent))x.classList.add('hn');});
  // 5. đoạn chỉ gồm một câu in đậm → câu chốt kiến thức
  d.querySelectorAll('p').forEach(function(p){if(p.children.length===1&&/^(B|STRONG)$/.test(p.children[0].tagName)&&p.textContent.trim()===p.children[0].textContent.trim()&&p.textContent.trim().length>12)p.classList.add('kstate');});
  // 6. thuật ngữ đầu mục "Thuật ngữ (…): giải thích" → in đậm phần thuật ngữ
  d.querySelectorAll('li').forEach(function(li){
    var f=li.firstChild;if(!f||f.nodeType!==3)return;var m=f.textContent.match(/^(\s*[^:：.]{2,60}?)([:：])\s/);
    if(!m||/[.!?]/.test(m[1])||m[1].split(/\s+/).length>9)return;
    var b=document.createElement('span');b.className='term';b.textContent=m[1].trim();f.textContent=f.textContent.slice(m[0].length);
    li.insertBefore(document.createTextNode(' '),f);li.insertBefore(document.createTextNode(m[2]),li.firstChild);li.insertBefore(b,li.firstChild);
  });
  return d.innerHTML;
}

function fcTick(){

function focusOn(){

  if(!FC.left){FC.phase='work';FC.left=fcDur('work');}
  FC.running=true;FC.endAt=Date.now()+FC.left*1000;
  clearInterval(FC.timer);FC.timer=setInterval(fcTick,500);
  var de=document.documentElement;try{if(de.requestFullscreen&&!document.fullscreenElement){FC.fs=true;de.requestFullscreen().catch(function(){FC.fs=false;});}}catch(e){FC.fs=false;}

function focusOff(){

  FC.on=false;FC.running=false;clearInterval(FC.timer);document.body.classList.remove('focus-mode');fcScene();
  FC.left=0;FC.phase='work';

  var wasFs=FC.fs;FC.fs=false;if(wasFs&&document.fullscreenElement){try{document.exitFullscreen();}catch(x){}}

}
function focusToggle(){if(FC.on)focusOff();else focusOn();}

function qsideResize(){
  var lay=$('.qlay'),side=$('.qside');if(!lay||!side||window.innerWidth<1000)return;
  var W=+localStorage.getItem('qs_w')||0,H=+localStorage.getItem('qs_h')||0;
  function apply(){if(W)lay.style.setProperty('--qw',W+'px');else lay.style.removeProperty('--qw');if(H){lay.style.setProperty('--qlh',H+'px');lay.classList.add('qs-h');}else{lay.style.removeProperty('--qlh');lay.classList.remove('qs-h');}}
  apply();
  var rh=document.createElement('div');rh.className='qs-rh';rh.title='Kéo để đổi độ rộng (nhấp đúp: mặc định)';rh.setAttribute('aria-hidden','true');
  var bh=document.createElement('div');bh.className='qs-bh';bh.title='Kéo để đổi chiều cao (nhấp đúp: mặc định)';bh.setAttribute('aria-hidden','true');
  side.appendChild(rh);side.appendChild(bh);
  try{new MutationObserver(function(){if(!side.contains(rh))side.appendChild(rh);if(!side.contains(bh))side.appendChild(bh);}).observe(side,{childList:true});}catch(e){}
  function drag(h,onmove,onend){h.addEventListener('pointerdown',function(e){e.preventDefault();var sx=e.clientX,sy=e.clientY,s0={w:side.getBoundingClientRect().width,h:($('.ai-log',side)||{getBoundingClientRect:function(){return {height:260};}}).getBoundingClientRect().height};
    document.body.classList.add('qs-dragging');
    function mv(ev){onmove(ev.clientX-sx,ev.clientY-sy,s0);apply();}
    function up(){document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.body.classList.remove('qs-dragging');onend();}
    document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);});}
  drag(rh,function(dx,dy,s0){var max=Math.min(760,lay.getBoundingClientRect().width-380);W=Math.round(Math.max(280,Math.min(max,s0.w+dx)));},function(){try{localStorage.setItem('qs_w',String(W));}catch(e){}});
  drag(bh,function(dx,dy,s0){H=Math.round(Math.max(140,Math.min(window.innerHeight-240,s0.h+dy)));},function(){try{localStorage.setItem('qs_h',String(H));}catch(e){}});
  rh.addEventListener('dblclick',function(){W=0;try{localStorage.removeItem('qs_w');}catch(e){}apply();});
  bh.addEventListener('dblclick',function(){H=0;try{localStorage.removeItem('qs_h');}catch(e){}apply();});
}

var revSt={q:'',topic:'',status:'all',lang:'',show:30,sol:false};
routes.review=function(){
  var pool=BANK,st=revSt;
  var lang=st.lang||localStorage.getItem('ui_qlang')||'en';
  var topics=[];pool.forEach(function(q){if(topics.indexOf(q.topic)<0)topics.push(q.topic);});
  function status(q){var an=P.answers[q.id];if(P.mistakes[q.id])return 'wrong';if(!an)return 'new';return an.lastOk?'ok':'wrong';}
  function pick(){
    var kw=st.q.trim().toLowerCase();
    return pool.filter(function(q){
      if(st.topic&&q.topic!==st.topic)return false;
      if(st.status!=='all'&&status(q)!==st.status)return false;
      if(kw){var hay=(q.q+' '+q.orig.join(' ')+' '+(q.explain||'')+' '+(q.vi?q.vi.q+' '+q.vi.options.join(' '):'')).toLowerCase();if(hay.indexOf(kw)<0)return false;}
      return true;});
  }
  function item(q){
    var tv=(lang==='vi'&&q.vi)?q.vi:null,s=status(q),good=q.answers;
    var tag=s==='ok'?'<span class="tag ok">Đúng lần gần nhất</span>':s==='wrong'?'<span class="tag bad">Cần ôn lại</span>':'<span class="tag">Chưa làm</span>';
    return '<div class="card rv-item" id="rv-'+q.no+'"><div class="rv-h"><span class="tag">Câu '+q.no+'</span><span class="tag">'+esc(q.topic)+'</span>'+tag+(good.length>1?'<span class="tag warn">'+good.length+' đáp án đúng</span>':'')+'</div>'+
      '<div class="q">'+qhtml(tv?tv.q:q.q)+'</div>'+(q.img?'<img class="q-img" src="'+esc(q.img)+'" alt="Hình của câu hỏi">':'')+
      '<ol class="rv-opts">'+q.orig.map(function(o,k){var ok=good.indexOf(o)>=0;return '<li class="'+(ok?'ok':'')+'"><b>'+L[k]+'</b><span>'+esc(tv?(tv.options[k]||o):o)+'</span>'+(ok?'<i class="rv-tick">'+ic('check')+'</i>':'')+'</li>';}).join('')+'</ol>'+
      '<div class="rv-x'+(st.sol?' open':'')+'" id="rx-'+q.no+'">'+(q.explain?mdLite(q.explain):'<span class="muted small">Câu này chưa có lời giải soạn sẵn.</span>')+'</div>'+
      '<div class="row" style="gap:8px;margin-top:10px"><button type="button" class="btn sm" data-rsol="'+q.no+'">'+ic('book')+' Lời giải</button><button type="button" class="btn sm" data-rprac="'+q.id+'">'+ic('pen')+' Luyện câu này</button></div></div>';
  }
  function list(){
    var l=pick(),box=document.getElementById('rvlist');if(!box)return;
    box.innerHTML='<div class="small muted" style="margin:6px 2px 10px">'+l.length+'/'+pool.length+' câu khớp bộ lọc</div>'+(l.length?l.slice(0,st.show).map(item).join(''):'<div class="card empty"><p class="muted">Không có câu nào khớp.</p></div>')+(l.length>st.show?'<div class="row" style="justify-content:center;margin:8px 0"><button type="button" class="btn" id="rvmore">Hiện thêm '+Math.min(30,l.length-st.show)+' câu ('+(l.length-st.show)+' còn lại)</button></div>':'');
    var cnt=document.getElementById('rvgo');if(cnt){cnt.disabled=!l.length;cnt.innerHTML=ic('play')+' Luyện '+l.length+' câu đang lọc';}
    $$('[data-rsol]',box).forEach(function(b){b.onclick=function(){var x=document.getElementById('rx-'+b.dataset.rsol);if(x)x.classList.toggle('open');};});
    $$('[data-rprac]',box).forEach(function(b){b.onclick=function(){var q=QMAP[b.dataset.rprac];runQuiz([q],'Luyện 1 câu · câu '+q.no,'#/review','en');};});
    var mo=document.getElementById('rvmore');if(mo)mo.onclick=function(){st.show+=30;list();};
  }
  var counts={all:pool.length,new:0,ok:0,wrong:0};pool.forEach(function(q){counts[status(q)]++;});
  render('<div class="row between" style="flex-wrap:wrap;gap:8px"><h1 style="margin:0">'+esc(SJ.bankTitle)+'</h1><div class="seg"><a class="btn sm ghost" href="#/bank" style="border-radius:8px">Luyện tập</a><button class="on" type="button">Xem tất cả câu hỏi</button></div></div>'+
    '<p class="muted" style="margin:6px 0 12px">Duyệt toàn bộ '+pool.length+' câu của bộ đề, xem đáp án đúng và lời giải, lọc theo chủ đề hoặc trạng thái.</p>'+
    '<div class="card rv-tools"><input type="search" id="rvq" class="sel" style="max-width:none;width:100%" placeholder="Tìm theo từ khoá (câu hỏi, đáp án, lời giải)" value="'+esc(st.q)+'">'+
    '<div class="row" style="gap:10px 16px;margin-top:10px;flex-wrap:wrap"><div class="seg" id="rvst">'+[['all','Tất cả'],['new','Chưa làm'],['ok','Đã đúng'],['wrong','Cần ôn']].map(function(x){return '<button type="button" data-st="'+x[0]+'" class="'+(st.status===x[0]?'on':'')+'">'+x[1]+' <span class="muted">'+counts[x[0]]+'</span></button>';}).join('')+'</div>'+
    '<div class="qlang" role="group" aria-label="Ngôn ngữ"><button type="button" data-rl="vi" class="'+(lang==='vi'?'on':'')+'">VI</button><button type="button" data-rl="en" class="'+(lang==='en'?'on':'')+'">EN</button></div>'+
    '<label class="rv-chk"><input type="checkbox" id="rvsol"'+(st.sol?' checked':'')+'> Hiện lời giải của tất cả câu</label></div>'+
    '<div class="chips" style="margin-top:10px"><button type="button" data-tp="" class="'+(!st.topic?'on':'')+'">Mọi chủ đề</button>'+topics.map(function(t){return '<button type="button" data-tp="'+esc(t)+'" class="'+(st.topic===t?'on':'')+'">'+esc(t)+'</button>';}).join('')+'</div>'+
    '<div class="row" style="margin-top:12px"><button type="button" class="btn primary" id="rvgo">'+ic('play')+' Luyện các câu đang lọc</button></div></div><div id="rvlist"></div>');
  $$('[data-st]').forEach(function(b){b.onclick=function(){st.status=b.dataset.st;st.show=30;routes.review();};});
  $$('[data-tp]').forEach(function(b){b.onclick=function(){st.topic=b.dataset.tp;st.show=30;routes.review();};});
  $$('[data-rl]').forEach(function(b){b.onclick=function(){st.lang=b.dataset.rl;try{localStorage.setItem('ui_qlang',st.lang);}catch(e){}routes.review();};});
  document.getElementById('rvsol').onchange=function(){st.sol=this.checked;list();};
  var tm;document.getElementById('rvq').oninput=function(){var v=this.value;clearTimeout(tm);tm=setTimeout(function(){st.q=v;st.show=30;list();},180);};
  document.getElementById('rvgo').onclick=function(){var l=pick();if(l.length)runQuiz(shuffle(l).slice(0,50),'Luyện theo bộ lọc ('+Math.min(50,l.length)+' câu)','#/review','en');};
  list();
};

function buildExam(n){
  var tot=D.modules.reduce(function(a,m){return a+m.weight;},0),al=D.modules.map(function(m){var x=n*m.weight/tot;return {m:m.id,k:Math.floor(x),r:x%1};});
  var left=n-al.reduce(function(a,b){return a+b.k;},0);al.slice().sort(function(a,b){return b.r-a.r;}).slice(0,left).forEach(function(a){a.k++;});
  var ids=[],used={};
  al.forEach(function(a){shuffle(EXAMQ.filter(function(q){return q.module===a.m;})).slice(0,a.k).forEach(function(q){ids.push(q.id);used[q.id]=1;});});
  if(ids.length<n)shuffle(EXAMQ.filter(function(q){return !used[q.id];})).slice(0,n-ids.length).forEach(function(q){ids.push(q.id);});
  ids=shuffle(ids);return withOpts(ids);
}
// exam text is always English
function withOpts(ids){var o={};ids.forEach(function(id){var t=T(QMAP[id],'en');var qq=QMAP[id];o[id]=(qq.orig&&qq.keep)?qq.orig.slice():shuffle([t.correct].concat(t.wrong));});return {ids:ids,opts:o,answers:{},flags:{},cur:0};}
function buildPastExam(ex){return withOpts(D.past.filter(function(q){return q.exam===ex;}).map(function(q){return q.id;}));}
function chart(h){var pts=h.slice(-15),W=600,H=150,p=22;function x(i){return p+(pts.length<2?(W-2*p)/2:i*(W-2*p)/(pts.length-1));}function y(v){return H-p-v/10*(H-2*p);}
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Điểm các lần thi thử"><line x1="'+p+'" x2="'+(W-p)+'" y1="'+y(8)+'" y2="'+y(8)+'" stroke="var(--ok)" stroke-dasharray="5 5"/><text x="'+(W-p)+'" y="'+(y(8)-6)+'" font-size="12" text-anchor="end" fill="var(--muted)">mục tiêu 8</text><line x1="'+p+'" x2="'+(W-p)+'" y1="'+y(4)+'" y2="'+y(4)+'" stroke="var(--bad)" stroke-dasharray="3 6" opacity=".6"/><text x="'+(W-p)+'" y="'+(y(4)-6)+'" font-size="12" text-anchor="end" fill="var(--muted)">tối thiểu 4</text>'+
  '<polyline fill="none" stroke="var(--primary)" stroke-width="3" stroke-linejoin="round" points="'+pts.map(function(e,i){return x(i)+','+y(e.score);}).join(' ')+'"/>'+pts.map(function(e,i){return '<circle cx="'+x(i)+'" cy="'+y(e.score)+'" r="5" fill="var(--panel)" stroke="var(--primary)" stroke-width="3"><title>'+e.score.toFixed(1)+'</title></circle>';}).join('')+'</svg>';}

function submitExam(auto){

}

  function wire(){$('#cm').onchange=function(){nav({});};bind('[data-mode]','click',function(e,b){if(b.dataset.mode==='list')nav({list:'1'});else nav({mode:b.dataset.mode,list:''});});var r=$('#rev');if(r)r.onchange=function(){nav({rev:this.checked?'1':''});};}
  if(list){
    var gl=D.glossary.filter(function(g){return !mod||g.module===mod;}).slice().sort(function(a,b){return a.term.localeCompare(b.term);});
    render(head+'<div class="card" style="padding:6px 18px">'+gl.map(function(g){var p=P.cards[cardId(g)];return '<div class="gl"><div><b>'+esc(g.term)+'</b> <span class="muted">— '+esc(g.vi)+'</span><div class="small muted">'+esc(g.def)+'</div></div>'+(p&&p.box>=3?'<span class="tag ok">đã thuộc</span>':p?'<span class="tag">hộp '+p.box+'</span>':'')+'</div>';}).join('')+'</div>');
    wire();return;
  }
  var q=mode==='all'?shuffle(D.glossary.filter(function(g){return !mod||g.module===mod;})):shuffle(dueTerms(mod)).concat(newTerms(mod).slice(0,20));
  // Phiên ôn: deck là danh sách thẻ theo thứ tự, pos là thẻ đang xem; có thể lùi lại xem / chấm lại thẻ trước.
  var deck=q,pos=0,flipped=false,rated={},RATE=['Quên','Khó','Nhớ','Dễ'];

      var n=Object.keys(rated).length;
      el.innerHTML='<div class="card empty"><div class="e">'+ic('checkc')+'</div><h3>'+(deck.length?'Xong phiên ôn · đã chấm '+n+' thẻ':'Không có thẻ nào đến hạn')+'</h3><p class="muted">Thẻ “Nhớ”, “Dễ” sẽ quay lại theo lịch; bạn vẫn có thể ôn tất cả bất cứ lúc nào.</p><div class="row" style="justify-content:center">'+(deck.length?'<button class="btn" id="backb">← Xem lại thẻ cuối</button>':'')+'<button class="btn primary" id="allb">Ôn tất cả</button><a class="btn ghost" href="#/">Trang chủ</a></div></div>';

  if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') return duelReset('Không kết nối được tới máy chủ ghép phòng. Kiểm tra internet rồi thử lại.');
  if (t === 'browser-incompatible') return duelReset('Trình duyệt này không hỗ trợ WebRTC. Hãy dùng Chrome, Edge, Firefox hoặc Safari bản mới.');
  duelReset('Lỗi kết nối' + (t ? ' (' + esc(t) + ')' : '') + '. Thử tạo lại phòng mới.');
}

function duelHost(retry) {
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', code = '';
  for (var i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  if (!retry) { DU.busy = 'Đang tạo phòng…'; duelDraw(); }
  duelLib().then(function() {
    try { if (DU.peer) DU.peer.destroy(); } catch(e) {}
    var peer = new window.Peer(PEER_PREFIX + code, {
      debug: 0,
      config: { iceServers: ICE_SERVERS, iceCandidatePoolSize: 10 }
    });
    DU.peer = peer; DU.code = code; DU.role = 'host'; DU.myId = 'host'; DU.conns = [];
    peer.on('open', function() {
      DU.busy = '';
      DU.s = {
        phase: 'wait',
        code: code,
        cfg: Object.assign({}, DU.cfg),
        players: [{ id: 'host', av: duelAv(), name: DU.myName || 'Chủ phòng', score: 0, pick: null, time: null, connected: true, isHost: true }],
        ids: [],
        opts: {},
        i: 0,
        winner: null,
        correct: null,
        hist: []
      };
      if (DU.autoBots) { var nb = DU.autoBots; DU.autoBots = 0; for (var bi = 0; bi < nb; bi++) duelAddBot(); }
      duelDraw();
    });
    peer.on('connection', function(c) {
      c.on('open', function() {
        if (!DU.s) return;
        var activePlayers = DU.s.players.filter(function(p) { return p.connected; });
        if (activePlayers.length >= 8) {
          c.send({ t: 'full' }); setTimeout(function() { c.close(); }, 400); return;
        }
        if (DU.s.phase !== 'wait' && DU.s.phase !== 'ready' && DU.s.phase !== 'end') {
          c.send({ t: 'started' }); setTimeout(function() { c.close(); }, 400); return;
        }
        DU.conns.push(c);
        c.on('data', function(m) { duelHostData(c, m); });
        c.on('close', function() { duelHostDrop(c); });
      });
    });
    peer.on('error', duelErr);
    peer.on('disconnected', function() { try { peer.reconnect(); } catch(e) {} });
  }, function() { DU.busy = ''; duelReset('Không tải được thư viện kết nối. Chế độ đấu cần internet.'); });
}

function duelHostData(c, m) {
  var s = DU.s; if (!s || !m) return;
  if (m.t === 'hello') {
    var pid = c.peer || ('p_' + Math.random().toString(36).slice(2, 8));
    var pName = String(m.name || 'Người chơi ' + (s.players.length)).slice(0, 24);
    var p = s.players.find(function(x) { return x.id === pid; });
    if (!p) {
      p = { id: pid, av: validAv(m.av), name: pName, score: 0, pick: null, time: null, connected: true, isHost: false };
      s.players.push(p);
    } else {
      p.connected = true;
      p.name = pName; p.av = validAv(m.av);
    }
    if (s.players.filter(function(x) { return x.connected; }).length >= 2 && s.phase === 'wait') {
      s.phase = 'ready';
    }
    try { c.send({ t: 'welcome', myId: pid, s: s }); } catch(e) {}
    duelPush();
  } else if (m.t === 'react') {
    duelReact(c.peer, m.k);
  } else if (m.t === 'pow') {
    duelPower(c.peer, m.i, m.k);
  } else if (m.t === 'ans') {
    duelAnswer(c.peer, m.i, m.choice, m.ms);
  } else if (m.t === 'bye') {
    duelHostDrop(c);
  }
}

function duelHostDrop(c) {
  var s = DU.s; if (!s) return;
  var idx = DU.conns.indexOf(c);
  if (idx >= 0) DU.conns.splice(idx, 1);
  var p = s.players.find(function(x) { return x.id === c.peer; });
  if (p) {
    p.connected = false;
    toast(esc(p.name) + ' đã rời phòng');
    if (s.phase === 'wait' || s.phase === 'ready') {
      s.players = s.players.filter(function(x) { return x.connected; });
      if (s.players.length < 2) s.phase = 'wait';
    } else if (s.phase === 'q') {
      duelCheckAllAnswered();
    }
    duelPush();
  }
}

function duelJoin(code) {
  code = code.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 6) return toast('Mã phòng gồm 6 ký tự');
  DU.busy = 'Đang vào phòng ' + code + '…'; DU.code = code; duelDraw();
  duelLib().then(function() {
    var peer = new window.Peer({
      debug: 0,
      config: { iceServers: ICE_SERVERS, iceCandidatePoolSize: 10 }
    });
    DU.peer = peer; DU.role = 'guest';
    var to = setTimeout(function() {
      if (!DU.s) duelReset('Không vào được phòng <b>' + esc(code) + '</b> sau 15 giây. Hãy kiểm tra mã phòng và kết nối mạng rồi thử lại.');
    }, 15000);
    peer.on('open', function(id) {
      DU.myId = id;
      var c = peer.connect(PEER_PREFIX + code, { reliable: true });
      DU.conns = c;
      c.on('open', function() {
        c.send({ t: 'hello', name: DU.myName || 'Khách', av: duelAv() });
      });
      c.on('data', function(m) {
        clearTimeout(to);
        duelGuestData(m);
      });
      c.on('close', function() {
        duelLost();
      });
    });
    peer.on('error', function(e) { clearTimeout(to); duelErr(e); });
  }, function() { DU.busy = ''; duelReset('Không tải được thư viện kết nối. Chế độ đấu cần internet.'); });
}

function duelLost() {
  var s = DU.s;
  if (DU.role === 'host') {
    duelPush();
    return;
  }
  duelReset(s && s.phase !== 'end' ? 'Mất kết nối với chủ phòng — trận đấu kết thúc.' : '');
}

function duelGuestData(m) {
  if (!m) return;
  if (m.t === 'full') return duelReset('Phòng <b>' + esc(DU.code) + '</b> đã đầy (tối đa 8 người).');
  if (m.t === 'started') return duelReset('Trận đấu trong phòng <b>' + esc(DU.code) + '</b> đã bắt đầu rồi. Hãy chờ trận kế tiếp!');
  if (m.t === 'bye') return duelReset('Chủ phòng đã đóng phòng đấu.');
  if (m.t === 'welcome') {
    DU.myId = m.myId || DU.myId;
    DU.s = m.s;
    duelDraw();
    return;
  }
  if (m.t === 'st') {
    var old = DU.s; DU.s = m.s;
    if (m.s.phase === 'count' && (!old || old.phase !== 'count')) {
      DU.countStart = Date.now(); DU.recorded = -1; DU.lastI = -1; DU.pending = -1; DU.pendingChoice = null;
    }
    if (m.s.phase === 'reveal' && m.s.xpText && (!old || old.phase !== 'reveal' || old.i !== m.s.i || !old.xpText)) DU.revStart = Date.now();
    if (m.s.phase === 'q' && m.s.i !== DU.lastI) {
      DU.lastI = m.s.i; DU.qStart = Date.now(); DU.pending = -1; DU.pendingChoice = null;
    }
    duelDraw();
  }
}

// Trọng tài (Host)
function duelStart() {
  var s = DU.s; if (!s || DU.role !== 'host') return;
  var cfg = s.cfg, pool = DUEL_SRC[cfg.src].list();
  var list = shuffle(pool).slice(0, cfg.n);
  s.ids = []; s.opts = {}; DU.correct = {};
  list.forEach(function(q) {
    var t = q.bank ? null : T(q, 'en'), base = q.bank ? q.orig : (q.orig || [t.correct].concat(t.wrong));
    s.ids.push(q.id); s.opts[q.id] = KEEP_ANY(base) ? base.slice() : shuffle(base);
    DU.correct[q.id] = q.bank ? q.answers[0] : t.correct;
  });
  s.i = 0; s.hist = []; s.phase = 'count';
  duelClearBots(); DU.endPlayed = false; DU.xp = {}; DU.xpBusy = 0;
  s.players.forEach(function(p) { p.score = 0; p.pick = null; p.time = null; p.gain = 0; p.streak = 0; p.right = 0; p.fast = 0; p.pw = { x2: 1, fifty: 1 }; p.x2 = -1; p.hideI = -1; p.hide = []; s.feed = []; });
  DU.countStart = Date.now(); DU.recorded = -1; DU.lastI = -1; DU.pending = -1; DU.pendingChoice = null;
  duelPush(); duelXpPump();
  clearTimeout(DU.timer); DU.timer = setTimeout(duelNextQ, 3000);
}

function duelNextQ() {
  var s = DU.s; if (!s || DU.role !== 'host') return;
  s.phase = 'q'; s.winner = null; s.correct = null; s.steal = null;
  s.players.forEach(function(p) { p.pick = null; p.time = null; p.gain = 0; });
  s.xpText = null; duelXpPump();
  DU.qStart = Date.now(); DU.lastI = s.i; DU.pending = -1; DU.pendingChoice = null;
  duelPush();
  clearTimeout(DU.timer); DU.timer = setTimeout(duelReveal, s.cfg.sec * 1000 + 400);
  duelBotPlay();
}

function duelAnswer(pid, i, choice, ms) {
  var s = DU.s; if (!s || s.phase !== 'q' || i !== s.i) return;
  var p = s.players.find(function(x) { return x.id === pid; });
  if (!p || p.pick != null) return;
  p.pick = choice; p.time = ms;
  var tot = s.cfg.sec * 1000, isGood = (choice === DU.correct[s.ids[s.i]]);
  ms = Math.max(0, Math.min(+ms || 0, tot)); p.time = ms; p.gain = 0;
  if (isGood) {
    p.streak = (p.streak || 0) + 1; p.right = (p.right || 0) + 1;
    p.gain = 100 + Math.round(100 * (tot - ms) / tot) + (p.streak >= 3 ? 25 : 0);
    if (p.x2 === s.i) p.gain *= 2;
    if (p.hideI === s.i) p.gain = Math.round(p.gain * 0.7);
    p.score += p.gain;
    if (!s.winner) { s.winner = p.id; p.fast = (p.fast || 0) + 1; }
  } else p.streak = 0;
  duelCheckAllAnswered();
}

function duelCheckAllAnswered() {
  var s = DU.s; if (!s || s.phase !== 'q') return;
  var actives = s.players.filter(function(p) { return p.connected; });
  var allDone = actives.every(function(p) { return p.pick != null; });
  if (allDone) {
    duelReveal();
  } else {
    duelPush();
  }
}

function duelReveal() {
  var s = DU.s; if (!s || s.phase !== 'q') return;
  clearTimeout(DU.timer); duelClearBots();
  s.players.forEach(function(p) { if (p.pick == null) { p.streak = 0; p.gain = 0; } });
  var id = s.ids[s.i]; s.phase = 'reveal'; s.correct = DU.correct[id];
  duelBotSteal();
  s.hist.push({
    id: id,
    correct: s.correct,
    winner: s.winner,
    players: s.players.map(function(p) { return { id: p.id, name: p.name, pick: p.pick, time: p.time, score: p.score, gain: p.gain || 0 }; })
  });
  duelPush();
  s.xpText = duelXpFallback(id); duelXpArm();
  duelPush();
}

DU.xp = {}; DU.xpBusy = 0;
function duelXpFallback(id) {
  var q = QMAP[id]; return (q && q.explain) ? q.explain : 'Câu này chưa có lời giải soạn sẵn. Đáp án đúng theo bộ đề môn ' + SJ.name + '.';

          (q.explain ? '<div class="small muted" style="margin-top:4px">' + esc(q.explain) + '</div>' : '') + '</div>';
      }).join('');
    content.innerHTML = h;
    bind('#dagain', 'click', duelStart);
    bind('#dshare', 'click', function() {
      var t = 'Kết quả thi đấu ' + SJ.name + ': ' + ranked.map(function(p, k) { return (k + 1) + '. ' + p.name + ' (' + p.score + ' điểm)'; }).join(' | ');
      copyText(t); toast('Đã chép kết quả');
    });
  }

  bind('#dsnd', 'click', function() { try { localStorage.setItem(KEY + '_snd', duelMuted() ? '1' : '0'); } catch (e) {} duelDraw(); });
  bind('#dleave', 'click', function() {
    var go2 = function() { duelSend({ t: 'bye' }); duelReset(); };
    if (duelActive()) confirmBox('Rời phòng giữa trận? Bạn sẽ bị mất kết nối khỏi trận đấu này.', 'Rời phòng', true).then(function(y) { if (y) go2(); });
    else go2();
  });

  function renderScoreboard(state) {
    var myPid = duelMyId();
    var rank = state.players.filter(function(p) { return p.connected; }).sort(function(x, y) { return y.score - x.score; });
    var top = rank.length ? Math.max(1, rank[0].score) : 1;
    return rank.map(function(p, k) {
      var isMe = (p.id === myPid), st = '';
      if (state.phase === 'q') st = (p.pick != null || (isMe && DU.pending === state.i)) ? '<span class="tag ok">đã chọn</span>' : '<span class="tag">đang nghĩ…</span>';
      else if (state.phase === 'reveal') {
        if (p.gain) st = '<span class="tag ok">+' + p.gain + (state.winner === p.id ? ' · nhanh nhất' : '') + '</span>';
        else if (p.pick != null) st = '<span class="tag bad">sai</span>'; else st = '<span class="tag">hết giờ</span>';
      }
      if (state.phase === 'reveal' && state.steal) {
        if (state.steal.by === p.id) st += ' <span class="tag warn">cướp +' + state.steal.amt + '</span>';
        else if (state.steal.from === p.id) st += ' <span class="tag bad">bị cướp −' + state.steal.amt + '</span>';
      }
      var streak = (p.streak >= 2 && state.phase !== 'count') ? '<span class="tag warn">chuỗi ' + p.streak + '</span> ' : '';
      return '<div class="pl-card' + (isMe ? ' me' : '') + '"><span class="pl-rank">' + (k + 1) + '</span>' + avHtml(p, 32) + '<div class="nm"><b>' + esc(p.name) + '</b>' + (isMe ? ' <small class="muted">(Bạn)</small>' : '') + '<div class="pl-st">' + streak + st + '</div></div><div class="pl-sc"><b class="sc">' + p.score + '</b><div class="pl-bar"><i style="width:' + Math.round(p.score / top * 100) + '%"></i></div></div></div>';
    }).join('');
  }
}
routes.duel=function(_,qs){
  content.innerHTML='';duelDraw();window.scrollTo(0,0);
  if(qs&&qs.join&&window.AI_SERVER){var jc=String(qs.join).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);history.replaceState(null,'',location.pathname+location.search+'#/duel');
    var ci=$('#dcode');if(ci&&jc.length===6&&!DU.s&&!DU.busy){ci.value=jc;if(duelName()){DU.myName=duelName();duelJoin(jc);}else{toast('Nhập tên hiển thị rồi bấm Vào phòng');var nmI=$('#dname');if(nmI)nmI.focus();}}}
  setKeys(function(e){var s=DU.s;if(s&&s.phase==='reveal'&&DU.role==='host'&&(e.key==='Enter'||e.key==='ArrowRight')){duelAdvance();return true;}if(!s||s.phase!=='q')return;var n=keyIdx(e,s.opts[s.ids[s.i]].length);if(n>=0){duelPick(n);return true;}});
};

function exportData(){var blob=new Blob([JSON.stringify(P)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=SJ.id+'-tien-do-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);}
function openSettings(){

  $('#rs',m).onclick=function(){m.__close(null);confirmBox('Xóa <b>toàn bộ</b> tiến độ trên máy này? Không thể hoàn tác.','Xóa hết',true).then(function(y){if(y){P=blank();save();applyTheme();toast('Đã xóa dữ liệu');go();}});};
