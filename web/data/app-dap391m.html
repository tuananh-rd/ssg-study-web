hưng tô màu phần diện tích phía dưới, thích hợp xem xét các thành phần cộng dồn theo thời gian.</li><li>Histogram: Biểu diễn phân phối tần suất của một tập hợp các số liệu liên tục.</li><li>Bar Chart: Biểu đồ cột dùng để so sánh các giá trị phân loại khác nhau.</li></ul><h4>Biểu đồ tròn (Pie Charts) và Biểu đồ hộp (Box Plots)</h4><p><b>Pie Charts</b> biểu diễn tỷ lệ phần trăm của các thành phần trong một tổng thể. <b>Box Plots</b> cực kỳ hữu ích trong phân tích thống kê để xem xét sự phân tán của dữ liệu thông qua các điểm: min, tứ phân vị thứ nhất (Q1), trung vị (median), Q3, max và giá trị ngoại lai (outliers).</p><table><tr><th><div><code># Vẽ biểu đồ hộp (Box Plot) cho dữ liệu nhập cư từ Nhật Bản tới Canada</code><code><br>df_japan = df_canada.loc[[</code><code>'Japan'</code><code>], years].transpose()<br>df_japan.plot(kind=</code><code>'box'</code><code>, figsize=(</code><code>8</code><code>, </code><code>6</code><code>))<br><br>plt.title(</code><code>'Box plot of Japanese Immigrants from 1980 - 2013'</code><code>)<br>plt.ylabel(</code><code>'Number of Immigrants'</code><code>)<br>plt.show()</code></div></th></tr></table><h4>Biểu đồ phân tán (Scatter Plots)</h4><p>Được sử dụng để xem xét mối tương quan giữa hai biến số liên tục (ví dụ: Mối quan hệ giữa năm và tổng lượng người nhập cư).</p><table><tr><th><div><code># Vẽ biểu đồ phân tán (Scatter Plot)</code><code><br>df_total.plot(kind=</code><code>'scatter'</code><code>, x=</code><code>'year'</code><code>, y=</code><code>'total'</code><code>, figsize=(</code><code>10</code><code>, </code><code>6</code><code>), color=</code><code>'darkblue'</code><code>)<br>plt.title(</code><code>'Total Immigration to Canada from 1980 - 2013'</code><code>)<br>plt.xlabel(</code><code>'Year'</code><code>)<br>plt.ylabel(</code><code>'Number of Immigrants'</code><code>)<br>plt.show()<br></code></div></th></tr></table>"},{"id":"2.4","t":"Waffle Charts, Word Clouds, Seaborn và Geospatial Data","h":"<h4>Waffle Charts và Word Clouds</h4><ul><li>Waffle Charts: Một biểu đồ dạng ô vuông (lưới) trực quan để thay thế Pie Chart, thể hiện tỷ lệ của các danh mục dữ liệu.</li><li>Word Clouds: Đám mây từ vựng biểu diễn tần suất xuất hiện của từ ngữ trong một văn bản. Kích thước của từ tỷ lệ thuận với tần suất của nó.</li></ul><table><tr><th><div><code>from</code><code> wordcloud </code><code>import</code><code> WordCloud<br></code><code>import</code><code> matplotlib.pyplot </code><code>as</code><code> plt<br><br></code><code># Tạo đối tượng Word Cloud</code><code><br>text = </code><code>\"data science python visualization machine learning pandas data data\"</code><code><br>wordcloud = WordCloud(background_color=</code><code>'white'</code><code>).generate(text)<br><br>plt.imshow(wordcloud, interpolation=</code><code>'bilinear'</code><code>)<br>plt.axis(</code><code>'off'</code><code>)<br>plt.show()<br></code></div></th></tr></table><h4>Xử lý dữ liệu không gian địa lý với Folium</h4><p>Folium là thư viện kết nối sức mạnh xử lý dữ liệu của Python với bản đồ Leaflet.js, cho phép bạn đánh dấu (markers) hoặc tạo biểu đồ Choropleth để tô màu các vùng địa lý theo phân bố dữ liệu.</p><table><tr><th><div><code>import</code><code> folium<br><br></code><code># Tạo bản đồ trung tâm tại Canada</code><code><br>canada_map = folium.Map(location=[</code><code>56.130</code><code>, </code><code>-106.35</code><code>], zoom_start=</code><code>4</code><code>)<br><br></code><code># Thêm Marker vào bản đồ</code><code><br>folium.Marker([</code><code>51.25</code><code>, </code><code>-85.32</code><code>], popup=</code><code>'Tỉnh bang Ontario'</code><code>).add_to(canada_map)<br>canada_map</code></div></th></tr></table>"},{"id":"2.5","t":"Xây dựng Dashboards với Plotly và Dash","h":"<p><b>Dash</b> là một framework mã nguồn mở của Python chuyên để xây dựng các ứng dụng web phân tích dữ liệu (Dashboards) mà không cần dùng đến JavaScript hay HTML thuần. Dash cấu thành từ:</p><ul><li>Dash HTML Components (dash.html): Cung cấp các thẻ HTML để xây dựng giao diện (Div, H1, P, v.v.).</li><li>Dash Core Components (dash.dcc): Cung cấp các công cụ tương tác như Dropdown, Slider, và Graph (sử dụng biểu đồ Plotly).</li></ul><h4>Tạo Dashboard tương tác (Make Dashboards interactive)</h4><p>Sự tương tác của Dash được điều khiển bởi <b>Callback</b> (hàm phản hồi). Decorator @app.callback kết nối Input (những gì người dùng thao tác, ví dụ chọn dropdown) với Output (biểu đồ hoặc văn bản cần được cập nhật tự động).</p><table><tr><th><div><code>import</code><code> dash<br></code><code>from</code><code> dash </code><code>import</code><code> dcc, html<br></code><code>from</code><code> dash.dependencies </code><code>import</code><code> Input, Output<br></code><code>import</code><code> plotly.express </code><code>as</code><code> px<br></code><code>import</code><code> pandas </code><code>as</code><code> pd<br><br></code><code># Khởi tạo dữ liệu</code><code><br>df = pd.DataFrame({<br>    </code><code>\"Fruit\"</code><code>: [</code><code>\"Apples\"</code><code>, </code><code>\"Oranges\"</code><code>, </code><code>\"Bananas\"</code><code>, </code><code>\"Apples\"</code><code>, </code><code>\"Oranges\"</code><code>, </code><code>\"Bananas\"</code><code>],<br>    </code><code>\"Amount\"</code><code>: [</code><code>4</code><code>, </code><code>1</code><code>, </code><code>2</code><code>, </code><code>2</code><code>, </code><code>4</code><code>, </code><code>5</code><code>],<br>    </code><code>\"City\"</code><code>: [</code><code>\"SF\"</code><code>, </code><code>\"SF\"</code><code>, </code><code>\"SF\"</code><code>, </code><code>\"Montreal\"</code><code>, </code><code>\"Montreal\"</code><code>, </code><code>\"Montreal\"</code><code>]<br>})<br><br>app = dash.Dash(__name__)<br><br></code><code># Xây dựng bố cục giao diện</code><code><br>app.layout = html.Div([<br>    html.H1(</code><code>\"Dashboard Trực quan hóa Trái cây\"</code><code>),<br>    dcc.Dropdown(<br>        id=</code><code>'city-dropdown'</code><code>,<br>        options=[{</code><code>'label'</code><code>: i, </code><code>'value'</code><code>: i} </code><code>for</code><code> i </code><code>in</code><code> df[</code><code>'City'</code><code>].unique()],<br>        value=</code><code>'SF'</code><code><br>    ),<br>    dcc.Graph(id=</code><code>'bar-chart'</code><code>)<br>])<br><br></code><code># Hàm callback cập nhật biểu đồ dựa trên lựa chọn Dropdown</code><code><br></code><code>@app.callback(</code><code><br>    Output(</code><code>'bar-chart'</code><code>, </code><code>'figure'</code><code>),<br>    Input(</code><code>'city-dropdown'</code><code>, </code><code>'value'</code><code>)<br>)<br></code><code>def</code> <code>update_graph</code><code>(selected_city):<br>    filtered_df = df[df[</code><code>'City'</code><code>] == selected_city]<br>    fig = px.bar(filtered_df, x=</code><code>\"Fruit\"</code><code>, y=</code><code>\"Amount\"</code><code>, color=</code><code>\"Fruit\"</code><code>, title=</code><code>f\"Dữ liệu tại {selected_city}\"</code><code>)<br>    </code><code>return</code><code> fig<br><br></code><code>if</code><code> __name__ == </code><code>'__main__'</code><code>:<br>    app.run_server(debug=</code><code>True</code><code>)</code></div></th></tr></table><p>Watson</p>"}]},{"id":"m3","short":"C3","title":"Watson (đọc để biết)","color":"#d6336c","weight":27,"priority":3,"keyPoints":[],"sections":[{"id":"3.1","t":"Tổng quan","h":"<p>Recommend ai muốn học AI theo hướng application, deploy hàng có sẵn thôi chứ không muốn đào sâu kiến trúc model thì nên tìm hiểu nhen, thích nữa thì tìm hiểu (ngoài chương trình) Replicate API, comfy</p>"},{"id":"3.2","t":"Phân tích dữ liệu = Python (Data Analysis)","h":"<h4>Nhập và xuất dữ liệu</h4><p>Giai đoạn đầu tiên là thấu hiểu cấu trúc tập dữ liệu và định hình bài toán. Cần xác định rõ số lượng bản ghi, các biến độc lập (features) và biến mục tiêu (target variable).</p><ul><li>Pandas: Cung cấp cấu trúc dữ liệu DataFrame và Series.</li><li>NumPy: Tối ưu hóa tính toán đại số tuyến tính và mảng đa chiều.</li><li>SciPy: Thư viện tính toán khoa học chuyên sâu.</li><li>Matplotlib &amp; Seaborn: Trực quan hóa dữ liệu thống kê.</li><li>Scikit-learn: Học máy và tiền xử lý.</li><li>Statsmodels: Mô hình hóa thống kê.</li></ul><table><tr><th><div><code>import</code><code> pandas </code><code>as</code><code> pd<br>url = </code><code>\"auto.csv\"</code><code><br>df = pd.read_csv(url)<br>print(df.head(</code><code>5</code><code>))<br></code><code># Xuất dữ liệu</code><code><br>df.to_csv(</code><code>\"automobile_processed.csv\"</code><code>, index=</code><code>False</code><code>)<br></code></div></th></tr></table><h4>Làm sạch và biến đổi dữ liệu (Data Wrangling)</h4><p>Các bước chuẩn: Nhận diện -&gt; Loại bỏ (nếu mất target) -&gt; Thay thế (bằng Mean, Median hoặc Mode).</p><table><tr><th><div><code>import</code><code> numpy </code><code>as</code><code> np<br>df.replace(</code><code>\"?\"</code><code>, np.nan, inplace=</code><code>True</code><code>)<br>mean_norm = df[</code><code>'normalized-losses'</code><code>].astype(</code><code>'float'</code><code>).mean()<br>df[</code><code>'normalized-losses'</code><code>].fillna(mean_norm, inplace=</code><code>True</code><code>)<br><br></code><code># Chuẩn hóa Z-score</code><code><br>df[</code><code>'length'</code><code>] = (df[</code><code>'length'</code><code>] - df[</code><code>'length'</code><code>].mean()) / df[</code><code>'length'</code><code>].std()<br></code><code># One-Hot Encoding</code><code><br>dummy_var = pd.get_dummies(df[</code><code>\"fuel-type\"</code><code>])<br>df = pd.concat([df, dummy_var], axis=</code><code>1</code><code>)<br></code></div></th></tr></table><h4>Khám phá dữ liệu (EDA) và mô hình</h4><p>Thực hiện thống kê mô tả, phân tích tương quan Pearson, và xây dựng Pipelines Hồi quy.</p><table><tr><th><div><code>import</code><code> seaborn </code><code>as</code><code> sns<br></code><code>import</code><code> matplotlib.pyplot </code><code>as</code><code> plt<br></code><code># Biểu đồ phân tán và Hồi quy</code><code><br>sns.regplot(x=</code><code>\"engine-size\"</code><code>, y=</code><code>\"price\"</code><code>, data=df)<br>plt.show()<br><br></code><code>from</code><code> sklearn.pipeline </code><code>import</code><code> Pipeline<br></code><code>from</code><code> sklearn.preprocessing </code><code>import</code><code> StandardScaler, PolynomialFeatures<br></code><code>from</code><code> sklearn.linear_model </code><code>import</code><code> LinearRegression<br>Input = [(</code><code>'scale'</code><code>, StandardScaler()), (</code><code>'polynomial'</code><code>, PolynomialFeatures(degree=</code><code>2</code><code>)), (</code><code>'model'</code><code>, LinearRegression())]<br>pipe = Pipeline(Input)<br>pipe.fit(X, y)</code></div></th></tr></table>"},{"id":"3.3","t":"Trực quan hóa dữ liệu = Python (Data Visualization)","h":"<h4>Các công cụ trực quan hóa</h4><p>Sử dụng Matplotlib (kiến trúc 3 tầng: Backend, Artist, Scripting) để vẽ các đồ thị cơ bản.</p><table><tr><th><div><code># Biểu đồ đường</code><code><br>df_haiti.plot(kind=</code><code>'line'</code><code>, figsize=(</code><code>8</code><code>, </code><code>5</code><code>))<br>plt.title(</code><code>'Xu hướng Nhập cư từ Haiti sang Canada'</code><code>)<br>plt.ylabel(</code><code>'Số lượng người'</code><code>)<br>plt.show()</code></div></th></tr></table><p>Waffle Charts, Word Clouds và Folium giúp trực quan hóa nâng cao và định vị không gian.</p><table><tr><th><div><code>import</code><code> folium<br>world_map = folium.Map(location=[</code><code>56.130</code><code>, </code><code>-106.35</code><code>], zoom_start=</code><code>4</code><code>)<br>folium.Marker(location=[</code><code>43.6532</code><code>, </code><code>-79.3832</code><code>], popup=</code><code>'Toronto'</code><code>).add_to(world_map)</code></div></th></tr></table><h4>Dashboard với Plotly và Dash</h4><p>Dash HTML Components và Dash Core Components giúp xây dựng UI, Callback quản lý tính tương tác.</p><table><tr><th><div><code>import</code><code> dash<br></code><code>from</code><code> dash </code><code>import</code><code> dcc, html<br></code><code>from</code><code> dash.dependencies </code><code>import</code><code> Input, Output<br></code><code># Thiết lập callback để cập nhật biểu đồ</code><code><br></code><code>@app.callback(</code><code><br>    Output(</code><code>'bar-chart'</code><code>, </code><code>'figure'</code><code>),<br>    Input(</code><code>'dropdown'</code><code>, </code><code>'value'</code><code>)<br>)<br></code><code>def</code> <code>update_graph</code><code>(selected_value):<br>    </code><code>return</code><code> px.bar(df[df[</code><code>'col'</code><code>] == selected_value], x=</code><code>'A'</code><code>, y=</code><code>'B'</code><code>)</code></div></th></tr></table>"},{"id":"3.4","t":"Xây dựng ứng dụng AI Với Watson APIs","h":"<h4>Kiến trúc trợ lý nhận thức (cognitive assistant architecture)</h4><p>Watson Assistant bao gồm Intents (Ý định của người dùng), Entities (Thực thể / Từ khóa) và Dialog (Luồng kịch bản hội thoại).</p><table><tr><th><div><code>from</code><code> ibm_watson </code><code>import</code><code> AssistantV2<br></code><code>from</code><code> ibm_cloud_sdk_core.authenticators </code><code>import</code><code> IAMAuthenticator<br>authenticator = IAMAuthenticator(</code><code>'API_KEY'</code><code>)<br>assistant = AssistantV2(version=</code><code>'2021-06-14'</code><code>, authenticator=authenticator)<br>response = assistant.message(<br>    assistant_id=</code><code>'ID'</code><code>,<br>    session_id=</code><code>'SESSION'</code><code>,<br>    input={</code><code>'message_type'</code><code>: </code><code>'text'</code><code>, </code><code>'text'</code><code>: </code><code>'Giá khóa học?'</code><code>}<br>).get_result()<br></code></div></th></tr></table><h4>Giọng nói và triển khai (Voice & Deployment)</h4><p>Tích hợp Text-to-Speech (TTS) và Speech-to-Text (STT) để bot có khả năng nghe/nói. Watson hỗ trợ triển khai đa kênh qua Web Chat, WordPress, Slack, Facebook Messenger và Node-RED.</p><table><tr><th><div><code>from</code><code> ibm_watson </code><code>import</code><code> TextToSpeechV1<br>tts = TextToSpeechV1(authenticator=IAMAuthenticator(</code><code>'API_KEY'</code><code>))<br></code><code>with</code><code> open(</code><code>'voice.wav'</code><code>, </code><code>'wb'</code><code>) </code><code>as</code><code> audio_file:<br>    res = tts.synthesize(</code><code>'Xin chào, giá là 500 đô.'</code><code>, voice=</code><code>'en-US_AllisonV3Voice'</code><code>, accept=</code><code>'audio/wav'</code><code>).get_result()<br>    audio_file.write(res.content)</code></div></th></tr></table>"},{"id":"3.5","t":"Hệ thống cơ sở dữ liệu và REST API","h":"<h4>Create Db2 Service Instance</h4><p>IBM Db2 là hệ quản trị cơ sở dữ liệu quan hệ (RDBMS) thế hệ mới được tối ưu hóa cho các tác vụ phân tích dữ liệu lớn và vận hành doanh nghiệp dựa trên nền tảng điện toán đám mây. Các bước khởi tạo trên IBM Cloud Console bao gồm:</p><ol><li>Truy cập vào danh mục tài nguyên (Catalog) trên trang quản trị IBM Cloud.</li><li>Tìm kiếm dịch vụ với từ khóa Db2 và lựa chọn gói dịch vụ phù hợp.</li><li>Thiết lập các thông số cơ bản bao gồm vùng tài nguyên (Region), tên thực thể dịch vụ (Service name) và nhóm tài nguyên (Resource group).</li><li>Nhấn nút Create để hệ thống tiến hành cấp phát tài nguyên tự động.</li></ol><p>Sau khi khởi tạo xong, truy cập vào giao diện quản trị console để lấy các thông tin cấu hình quan trọng như chuỗi kết nối kết nối (Credentials), cổng kết nối (Port), tên máy chủ (Hostname) phục vụ cho việc tích hợp ứng dụng bên ngoài.</p><h4>Load Data into Db2</h4><p>Giao diện Db2 Console cung cấp một bộ công cụ trực quan cho phép người dùng trực tiếp tải lên các tệp dữ liệu phẳng như CSV, XLSX hoặc tệp định dạng văn bản. Trong quá trình nạp dữ liệu, hệ thống yêu cầu chỉ định hoặc khởi tạo một Lược đồ (Schema) để phân tách không gian tên giữa các dự án.</p><ul><li>Cấu hình kiểu dữ liệu chính xác cho từng cột (ví dụ: VARCHAR cho chuỗi ký tự, INT cho số nguyên, hoặc DECIMAL).</li><li>Thiết lập khóa chính (Primary Key) nếu cần thiết để đảm bảo tính toàn vẹn của dữ liệu.</li></ul><p>SQL minh họa khởi tạo bảng và chèn dữ liệu thủ công (nào làm thì quăng cho AI tạo script add dữ liệu, chèn thủ công thì tới mùa quýt mất, chèn thủ công chỉ để đem lên bùa chú review trực tiếp thôi nhá):</p><table><tr><th><div><code>CREATE</code> <code>TABLE</code><code> MY_SCHEMA.PRODUCTS (<br>    PRODUCT_ID </code><code>INT</code> <code>NOT</code> <code>NULL</code><code>,<br>    PRODUCT_NAME </code><code>VARCHAR</code><code>(</code><code>100</code><code>) </code><code>NOT</code> <code>NULL</code><code>,<br>    PRICE </code><code>DECIMAL</code><code>(</code><code>10</code><code>, </code><code>2</code><code>),<br>    STOCK_QUANTITY </code><code>INT</code><code>,<br>    PRIMARY </code><code>KEY</code><code> (PRODUCT_ID)<br>);<br><br></code><code>-- Chèn dữ liệu mẫu vào bảng</code><code><br></code><code>INSERT</code> <code>INTO</code><code> MY_SCHEMA.PRODUCTS (PRODUCT_ID, PRODUCT_NAME, PRICE, STOCK_QUANTITY)<br></code><code>VALUES</code><code> (</code><code>1</code><code>, </code><code>'Laptop ThinkPad X1'</code><code>, </code><code>1200.00</code><code>, </code><code>15</code><code>),<br>       (</code><code>2</code><code>, </code><code>'MacBook Pro M3'</code><code>, </code><code>1999.50</code><code>, </code><code>10</code><code>);</code></div></th></tr></table><h4>Setup server to provide REST API</h4><p>Kiến trúc REST API với cơ sở dữ liệu hoạt động như sau: Máy chủ trung gian đóng vai trò là một API Gateway, tiếp nhận các yêu cầu HTTP (GET, POST, PUT, DELETE) từ các ứng dụng phía máy khách, thực thi các truy vấn SQL tương ứng xuống Db2, sau đó đóng gói kết quả trả về dưới dạng JSON tiêu chuẩn. Việc thiết lập có thể được hiện thực hóa qua Node-RED hoặc các framework như Flask (Python) hay Express (Node.js).</p><p>Mã Python minh họa xây dựng REST API kết nối IBM Db2:</p><table><tr><th><div><code>from</code><code> flask </code><code>import</code><code> Flask, jsonify, request<br></code><code>import</code><code> ibm_db<br><br>app = Flask(__name__)<br><br></code><code># Cấu hình chuỗi kết nối thông tin xác thực lấy từ Db2 Console</code><code><br>dsn_driver = </code><code>\"{IBM DB2 ODBC DRIVER}\"</code><code><br>dsn_database = </code><code>\"BLUDB\"</code><code><br>dsn_hostname = </code><code>\"your-hostname.databases.appdomain.cloud\"</code><code><br>dsn_port = </code><code>\"32733\"</code><code><br>dsn_protocol = </code><code>\"TCPIP\"</code><code><br>dsn_uid = </code><code>\"your_username\"</code><code><br>dsn_pwd = </code><code>\"your_password\"</code><code><br>dsn_security = </code><code>\"SSL\"</code><code><br><br>dsn = (<br>    </code><code>f\"DRIVER={dsn_driver};\"</code><code><br>    </code><code>f\"DATABASE={dsn_database};\"</code><code><br>    </code><code>f\"HOSTNAME={dsn_hostname};\"</code><code><br>    </code><code>f\"PORT={dsn_port};\"</code><code><br>    </code><code>f\"PROTOCOL={dsn_protocol};\"</code><code><br>    </code><code>f\"UID={dsn_uid};\"</code><code><br>    </code><code>f\"PWD={dsn_pwd};\"</code><code><br>    </code><code>f\"SECURITY={dsn_security};\"</code><code><br>)<br><br></code><code>@app.route('/api/products', methods=['GET'])</code><code><br></code><code>def</code> <code>get_products</code><code>():<br>    </code><code>try</code><code>:<br>        </code><code># Khởi tạo kết nối tới thực thể Db2</code><code><br>        conn = ibm_db.connect(dsn, </code><code>\"\"</code><code>, </code><code>\"\"</code><code>)<br>        sql = </code><code>\"SELECT * FROM MY_SCHEMA.PRODUCTS\"</code><code><br>        stmt = ibm_db.exec_immediate(conn, sql)<br>        <br>        products_list = []<br>        row = ibm_db.fetch_assoc(stmt)<br>        </code><code>while</code><code> row != </code><code>False</code><code>:<br>            products_list.append(row)<br>            row = ibm_db.fetch_assoc(stmt)<br>            <br>        ibm_db.close(conn)<br>        </code><code>return</code><code> jsonify({</code><code>\"status\"</code><code>: </code><code>\"success\"</code><code>, </code><code>\"data\"</code><code>: products_list}), </code><code>200</code><code><br>    </code><code>except</code><code> Exception </code><code>as</code><code> e:<br>        </code><code>return</code><code> jsonify({</code><code>\"status\"</code><code>: </code><code>\"error\"</code><code>, </code><code>\"message\"</code><code>: str(e)}), </code><code>500</code><code><br><br></code><code>if</code><code> __name__ == </code><code>'__main__'</code><code>:<br>    app.run(debug=</code><code>True</code><code>, port=</code><code>5000</code><code>)<br></code></div></th></tr></table><p>SpaceX</p>"}]},{"id":"m4","short":"C4","title":"SpaceX · Tổng quan dự án","color":"#e8590c","weight":1,"priority":3,"keyPoints":[],"sections":[{"id":"4.1","t":"Tổng quan","h":"<p>Cần áp dụng toàn bộ kiến thức về khoa học dữ liệu, từ khâu thu thập, làm sạch, phân tích khám phá, trực quan hóa đến việc xây dựng các mô hình học máy. Bối cảnh dự án (scenario) xoay quanh việc phân tích dữ liệu phóng tàu vũ trụ của công ty SpaceX nhằm dự đoán khả năng hạ cánh thành công của tầng 1 (first stage) tên lửa Falcon 9, từ đó ước tính chi phí cho một lần phóng tên lửa.</p>"},{"id":"4.2","t":"Khởi tạo dự án trên IBM Watson Studio:","h":"<p>Nền tảng IBM Watson Studio cung cấp môi trường tích hợp để phát triển các Notebooks (Jupyter). Các bước bao gồm: Đăng nhập vào IBM Cloud, tạo dự án (Project) mới, thiết lập tài nguyên lưu trữ đám mây (Cloud Object Storage) và cấp phát môi trường lập trình.</p>"}]},{"id":"m5","short":"C5","title":"SpaceX · GitHub và Watson Studio","color":"#0c8599","weight":2,"priority":3,"keyPoints":[],"sections":[{"id":"5.1","t":"Liên kết và tích hợp GitHub (Link and integrate GitHub)","h":"<p>Để quản lý phiên bản mã nguồn, Watson Studio cho phép liên kết trực tiếp với tài khoản GitHub cá nhân bằng cách tạo và cung cấp Khóa truy cập cá nhân (Personal Access Token). Việc tích hợp này giúp quá trình làm việc nhóm, lưu trữ và chia sẻ mã nguồn trở nên an toàn và thuận tiện hơn.</p>"},{"id":"5.2","t":"Xuất bản Notebook (Publish notebook on GitHub)","h":"<p>Sau khi hoàn thiện mã Python trên Jupyter Notebook trong Watson Studio, học viên có thể đẩy (push/publish) trực tiếp file notebook (có đuôi .ipynb) lên kho lưu trữ (repository) trên GitHub. Đồng thời, bạn cũng có thể thêm (Add) các Notebook mẫu sẵn có từ một kho lưu trữ GitHub về lại dự án Watson Studio để tiếp tục làm việc.</p>"}]},{"id":"m6","short":"C6","title":"SpaceX · Thu thập dữ liệu","color":"#2f9e44","weight":15,"priority":3,"keyPoints":[],"sections":[{"id":"6.1","t":"Overview","h":"<p>Ở đây tập trung thu thập dữ liệu thô từ hai nguồn chính: truy xuất dữ liệu thông qua REST API do SpaceX cung cấp và thu thập dữ liệu bằng cách cào dữ liệu từ các trang web (Web Scraping).</p>"},{"id":"6.2","t":"Thu thập dữ liệu thông qua SpaceX REST API","h":"<p>API của SpaceX cung cấp các điểm cuối (endpoints) mở để lấy dữ liệu về các đợt phóng tàu, các bộ phận tên lửa (cores, capsules). Ví dụ: endpoint api.spacexdata.com/v4/launches/past sẽ trả về danh sách dữ liệu các lần phóng trong quá khứ.</p><table><tr><th><div><code>import</code><code> requests<br></code><code>import</code><code> pandas </code><code>as</code><code> pd<br><br></code><code># 1. Điểm cuối URL của SpaceX API cho các đợt phóng trong quá khứ</code><code><br>spacex_url = </code><code>\"https://api.spacexdata.com/v4/launches/past\"</code><code><br><br></code><code># 2. Thực hiện một yêu cầu GET tới API để lấy dữ liệu</code><code><br>response = requests.get(spacex_url)<br><br></code><code># 3. Nếu mã trạng thái là 200 (Thành công), ta tiến hành xử lý dữ liệu JSON</code><code><br></code><code>if</code><code> response.status_code == </code><code>200</code><code>:<br>    data = response.json()<br>    df_launches = pd.json_normalize(data)<br>    print(df_launches[[</code><code>'flight_number'</code><code>, </code><code>'name'</code><code>, </code><code>'date_utc'</code><code>]].head())<br></code><code>else</code><code>:<br>    print(</code><code>\"Lỗi: Không thể kết nối đến SpaceX API.\"</code><code>)</code></div></th></tr></table>"},{"id":"6.3","t":"Thu thập dữ liệu qua Web Scraping","h":"<p>Không phải tất cả dữ liệu đều có sẵn và được sắp xếp gọn gàng qua API. Một lượng lớn dữ liệu giá trị có thể được trích xuất từ các bảng dữ liệu trên Wikipedia bằng phương pháp cào dữ liệu (Web Scraping) sử dụng thư viện BeautifulSoup.</p><table><tr><th><div><code>import</code><code> requests<br></code><code>from</code><code> bs4 </code><code>import</code><code> BeautifulSoup<br></code><code>import</code><code> pandas </code><code>as</code><code> pd<br><br></code><code># 1. URL trang Wikipedia chứa danh sách các lần phóng Falcon 9</code><code><br>wiki_url = </code><code>\"https://en.wikipedia.org/wiki/List_of_Falcon_9_and_Falcon_Heavy_launches\"</code><code><br><br></code><code># 2. Tải nội dung HTML</code><code><br>html_data = requests.get(wiki_url).text<br><br></code><code># 3. Phân tích cú pháp HTML</code><code><br>soup = BeautifulSoup(html_data, </code><code>'html.parser'</code><code>)<br><br></code><code># 4. Tìm tất cả các thẻ bảng</code><code><br>html_tables = soup.find_all(</code><code>'table'</code><code>)<br><br></code><code># 5. Trích xuất dữ liệu từ một bảng cụ thể</code><code><br>first_launch_table = html_tables[</code><code>2</code><code>]<br></code><code>for</code><code> th </code><code>in</code><code> first_launch_table.find_all(</code><code>'th'</code><code>):<br>    print(th.text.strip())</code></div></th></tr></table>"},{"id":"6.4","t":"Tiền xử lý dữ liệu SpaceX (Data Wrangling)","h":"<h4>Xác định và phân tích các đặc trưng chính</h4><p>Sau bước thu thập dữ liệu thô từ API và Web Scraping, quy trình tiền xử lý tập trung vào việc định hình các thuộc tính quyết định đến khả năng hạ cánh thành công của tầng 1 (first stage) tên lửa Falcon 9:</p><ul><li>Outcome: Trạng thái chi tiết của việc hạ cánh (ví dụ: True ASDS, False ASDS, True RTLS, None None). Đây là biến nền tảng để tạo nhãn mục tiêu.</li><li>Grid Fins &amp; Legs: Các bộ phận cơ khí hỗ trợ điều hướng và giữ thăng bằng khi tên lửa đáp xuống bãi đáp hoặc sà lan.</li><li>Flights &amp; Reused Count: Số lần lõi tên lửa đã từng bay và số lần được tái sử dụng trong quá khứ.</li><li>Block &amp; Serial: Phiên bản công nghệ của lõi tên lửa (Block 1 đến Block 5) và mã định danh duy nhất của từng lõi (Serial).</li><li>Launch Site: Vị trí bãi phóng bệ tên lửa (vùng không gian kinh độ và vĩ độ).</li></ul><h4>Binary Labeling</h4><p>Biến đổi cột thuộc tính phi cấu trúc Outcome thành một biến mục tiêu nhị phân duy nhất đặt tên là Class: Gán giá trị <b>1</b> nếu tầng 1 hạ cánh thành công (các trạng thái bắt đầu bằng True) và gán giá trị <b>0</b> nếu hạ cánh thất bại hoặc không thực hiện hạ cánh (các trạng thái bắt đầu bằng False hoặc None).</p><table><tr><th><div><code>import</code><code> pandas </code><code>as</code><code> pd<br></code><code>import</code><code> numpy </code><code>as</code><code> np<br><br></code><code># Giả định df là DataFrame chứa dữ liệu thô thu được từ SpaceX API</code><code><br></code><code># Khảo sát các giá trị độc bản trong cột Outcome</code><code><br>print(df[</code><code>'Outcome'</code><code>].value_counts())<br><br></code><code># Thiết lập danh sách các trạng thái hạ cánh thành công</code><code><br>success_outcomes = [</code><code>'True ASDS'</code><code>, </code><code>'True RTLS'</code><code>, </code><code>'True Ocean'</code><code>]<br><br></code><code># Áp dụng hàm lambda hoặc np.where để tạo cột Class nhị phân</code><code><br>df[</code><code>'Class'</code><code>] = np.where(df[</code><code>'Outcome'</code><code>].isin(success_outcomes), </code><code>1</code><code>, </code><code>0</code><code>)<br><br></code><code># Kiểm tra tỷ lệ hạ cánh thành công nền tảng</code><code><br>print(df[</code><code>'Class'</code><code>].value_counts(normalize=</code><code>True</code><code>))</code></div></th></tr></table>"},{"id":"6.5","t":"Phân tích trực quan tương tác Và thiết lập Dashboard","h":"<h4>Phân tích bãi phóng không gian địa lý với Folium</h4><p>Sử dụng thư viện Folium để ánh xạ các tọa độ bãi phóng (Launch Sites) của SpaceX lên bản đồ thực tế. Đồng thời áp dụng công thức toán học Haversine để tính toán khoảng cách từ vị trí bãi phóng đến các thực thể hạ tầng quan trọng xung quanh như đường bờ biển (coastlines), đường cao tốc (highways), và các trung tâm đô thị gần nhất để tìm ra mối tương quan an toàn bệ phóng.</p><table><tr><th><div><code>import</code><code> folium<br></code><code>from</code><code> math </code><code>import</code><code> sin, cos, sqrt, atan2, radians<br><br></code><code>def</code> <code>calculate_distance</code><code>(lat1, lon1, lat2, lon2):<br>    </code><code># Công thức toán học Haversine tính khoảng cách giữa hai tọa độ địa lý</code><code><br>    R = </code><code>6373.0</code> <code># Bán kính Trái Đất tính theo km</code><code><br>    lat1, lon1, lat2, lon2 = map(radians, [lat1, lon1, lat2, lon2])<br>    dlon = lon2 - lon1<br>    dlat = lat2 - lat1<br>    a = sin(dlat / </code><code>2</code><code>)**</code><code>2</code><code> + cos(lat1) * cos(lat2) * sin(dlon / </code><code>2</code><code>)**</code><code>2</code><code><br>    c = </code><code>2</code><code> * atan2(sqrt(a), sqrt(</code><code>1</code><code> - a))<br>    </code><code>return</code><code> R * c<br><br></code><code># Khởi tạo bản đồ Folium tại bệ phóng mẫu</code><code><br>site_map = folium.Map(location=[</code><code>28.562302</code><code>, </code><code>-80.577356</code><code>], zoom_start=</code><code>15</code><code>)<br>folium.Marker([</code><code>28.562302</code><code>, </code><code>-80.577356</code><code>], popup=</code><code>'CCAFS LC-40'</code><code>).add_to(site_map)<br>site_map<br></code></div></th></tr></table><h4>Phát triển ứng dụng Dashboard với Plotly Dash</h4><p>Xây dựng kiến trúc Dashboard động để phân tích hiệu suất phóng tên lửa thời gian thực qua 4 nhiệm vụ (Tasks) cấu trúc cốt lõi:</p><ul><li>TASK 1: Thêm một Drop-down Input component để người dùng lựa chọn giữa việc xem toàn bộ các bãi phóng (All Sites) hoặc chọn từng bãi phóng cụ thể.</li><li>TASK 2: Thiết lập hàm callback render biểu đồ tròn (Success Pie Chart) phản ánh tỷ lệ phần trăm số lần phóng thành công và thất bại tương ứng với bãi phóng được chọn.</li><li>TASK 3: Thêm cấu trúc thanh trượt Range Slider cho phép chọn bộ lọc khoảng khối lượng tải trọng (Payload Range) từ 0 kg đến 10,000 kg.</li><li>TASK 4: Thiết lập hàm callback kết nối đầu ra hiển thị biểu đồ phân tán (Scatter Plot) thể hiện mối quan hệ tuyến tính giữa Payload và kết quả Class, ánh xạ màu sắc theo phiên bản lõi tên lửa (Booster Version).</li></ul><table><tr><th><div><code>import</code><code> dash<br></code><code>from</code><code> dash </code><code>import</code><code> dcc, html<br></code><code>from</code><code> dash.dependencies </code><code>import</code><code> Input, Output<br></code><code>import</code><code> plotly.express </code><code>as</code><code> px<br><br>app = dash.Dash(__name__)<br><br>app.layout = html.Div([<br>    html.H1(</code><code>\"SpaceX Launch Records Dashboard\"</code><code>, style={</code><code>'textAlign'</code><code>: </code><code>'center'</code><code>}),<br>    </code><code># TASK 1: Thành phần chọn bãi phóng Dropdown</code><code><br>    dcc.Dropdown(id=</code><code>'site-dropdown'</code><code>,<br>                 options=[<br>                     {</code><code>'label'</code><code>: </code><code>'All Sites'</code><code>, </code><code>'value'</code><code>: </code><code>'ALL'</code><code>},<br>                     {</code><code>'label'</code><code>: </code><code>'CCAFS LC-40'</code><code>, </code><code>'value'</code><code>: </code><code>'CCAFS LC-40'</code><code>},<br>                     {</code><code>'label'</code><code>: </code><code>'VAFB SLC-4E'</code><code>, </code><code>'value'</code><code>: </code><code>'VAFB SLC-4E'</code><code>},<br>                     {</code><code>'label'</code><code>: </code><code>'KSC LC-39A'</code><code>, </code><code>'value'</code><code>: </code><code>'KSC LC-39A'</code><code>}<br>                 ], value=</code><code>'ALL'</code><code>, placeholder=</code><code>\"Select a Launch Site here\"</code><code>, searchable=</code><code>True</code><code>),<br>    html.Br(),<br>    html.Div(dcc.Graph(id=</code><code>'success-pie-chart'</code><code>)),<br>    html.Br(),<br>    html.P(</code><code>\"Payload range (Kg):\"</code><code>),<br>    </code><code># TASK 3: Thành phần chọn khoảng khối lượng Range Slider</code><code><br>    dcc.RangeSlider(id=</code><code>'payload-slider'</code><code>, min=</code><code>0</code><code>, max=</code><code>10000</code><code>, step=</code><code>1000</code><code>,<br>                    marks={</code><code>0</code><code>: </code><code>'0'</code><code>, </code><code>10000</code><code>: </code><code>'10000'</code><code>}, value=[</code><code>0</code><code>, </code><code>10000</code><code>]),<br>    html.Div(dcc.Graph(id=</code><code>'success-payload-scatter-chart'</code><code>)),<br>])<br><br></code><code># TASK 2 &amp; TASK 4: Các hàm logic Callback xử lý tương tác đồ họa tự động</code><code><br></code><code>@app.callback(</code><code><br>    Output(component_id=</code><code>'success-pie-chart'</code><code>, component_property=</code><code>'figure'</code><code>),<br>    Input(component_id=</code><code>'site-dropdown'</code><code>, component_property=</code><code>'value'</code><code>)<br>)<br></code><code>def</code> <code>get_pie_chart</code><code>(entered_site):<br>    </code><code>if</code><code> entered_site == </code><code>'ALL'</code><code>:<br>        fig = px.pie(df, values=</code><code>'Class'</code><code>, names=</code><code>'Launch Site'</code><code>, title=</code><code>'Total Success Launches By Site'</code><code>)<br>    </code><code>else</code><code>:<br>        filtered_df = df[df[</code><code>'Launch Site'</code><code>] == entered_site]<br>        fig = px.pie(filtered_df, names=</code><code>'Class'</code><code>, title=</code><code>f'Total Success Launches for site {entered_site}'</code><code>)<br>    </code><code>return</code><code> fig<br><br></code><code>if</code><code> __name__ == </code><code>'__main__'</code><code>:<br>    app.run_server(debug=</code><code>False</code><code>)<br></code></div></th></tr></table>"},{"id":"6.6","t":"Predictive Analysis","h":"<h4>Chuẩn hóa ma trận đặc trưng</h4><p>Trước khi đưa các biến độc lập vào hệ thống phân loại học máy, việc sử dụng kỹ thuật cấu trúc StandardScaler là bước bắt buộc để chuyển đổi các thuộc tính số có thang đo phân tán rộng (như khối lượng tải trọng Payload) về phân phối có trung bình bằng 0 và độ lệch chuẩn bằng 1.</p><h4>Thử nghiệm training và quét hyperparameters với GridSearchCV</h4><p>Hệ thống tiến hành phân tách tập dữ liệu thành tập huấn luyện (Train set) và tập kiểm thử độc lập (Test set). Sau đó, thực hiện việc tìm kiếm tối ưu trên không gian tham số của 4 thuật toán phân loại kinh điển bao gồm: <b>Logistic Regression</b>, <b>Support Vector Machine (SVM)</b>, <b>Decision Tree Classifier</b>, và <b>K-Nearest Neighbors (KNN)</b>.</p><p><i><b>Thường các phần quét siêu tham số này sẽ khá lâu nhá</b></i></p><table><tr><th><div>Thuật toán Phân loại</div></th><th><div>Không gian Siêu tham số Quét (Hyperparameters Grid)</div></th><th><div>Mục tiêu Tối ưu hóa Hệ thống</div><div> </div></th></tr><tr><td><div><b>Logistic Regression</b></div></td><td><div>Hệ số phạt C: [0.01, 0.1, 1, 10], Hàm phạt penalty: ['l1', 'l2']</div></td><td><div>Tối ưu hóa ranh giới phân tách xác suất tuyến tính.</div></td></tr><tr><td><div><b>Support Vector Machine</b></div></td><td><div>Hệ số C, Hàm nhân kernel: ['linear', 'rbf', 'poly', 'sigmoid']</div></td><td><div>Tìm kiếm siêu phẳng có biên độ khoảng cách (margin) lớn nhất.</div></td></tr><tr><td><div><b>Decision Tree</b></div></td><td><div>Tiêu chí criterion: ['gini', 'entropy'], Độ sâu tối đa max_depth</div></td><td><div>Tách nhóm dữ liệu dựa trên mức độ thuần khiết của thông tin.</div></td></tr><tr><td><div><b>K-Nearest Neighbors</b></div></td><td><div>Số lượng láng giềng n_neighbors, Thuật toán tìm kiếm n_neighbors</div></td><td><div>Phân lớp dựa trên khoảng cách biểu diễn không gian láng giềng gần nhất.</div></td></tr></table><table><tr><th><div><code>from</code><code> sklearn.model_selection </code><code>import</code><code> train_test_split, GridSearchCV<br></code><code>from</code><code> sklearn.preprocessing </code><code>import</code><code> StandardScaler<br></code><code>from</code><code> sklearn.linear_model </code><code>import</code><code> LogisticRegression<br></code><code>from</code><code> sklearn.svm </code><code>import</code><code> SVC<br><br></code><code># 1. Chuẩn hóa ma trận biến đầu vào X</code><code><br>scaler = StandardScaler()<br>X_scaled = scaler.fit_transform(X)<br><br></code><code># 2. Phân tách tập huấn luyện và kiểm thử theo tỷ lệ 80/20</code><code><br>X_train, X_test, Y_train, Y_test = train_test_split(X_scaled, Y, test_size=</code><code>0.2</code><code>, random_state=</code><code>2</code><code>)<br><br></code><code># 3. Quét tối ưu siêu tham số cho mô hình SVM bằng GridSearchCV</code><code><br>parameters = {</code><code>'kernel'</code><code>: (</code><code>'linear'</code><code>, </code><code>'rbf'</code><code>, </code><code>'poly'</code><code>, </code><code>'sigmoid'</code><code>), </code><code>'C'</code><code>: [</code><code>0.01</code><code>, </code><code>0.1</code><code>, </code><code>1</code><code>, </code><code>10</code><code>]}<br>svm = SVC()<br>clf = GridSearchCV(svm, parameters, cv=</code><code>10</code><code>)<br>clf.fit(X_train, Y_train)<br><br>print(</code><code>\"Siêu tham số tối ưu tìm được:\"</code><code>, clf.best_params_)<br>print(</code><code>\"Độ chính xác trung bình trên tập kiểm chứng chéo (CV):\"</code><code>, clf.best_score_)<br>print(</code><code>\"Độ chính xác thực tế đánh giá trên tập Test độc lập:\"</code><code>, clf.score(X_test, Y_test))</code></div></th></tr></table>"},{"id":"6.7","t":"Bài học rút ra từ project SpaceX:","h":"<p>Một bài trình bày khoa học dữ liệu hướng đối tượng doanh nghiệp chuẩn mực cần tuân thủ nghiêm ngặt cấu trúc cấu thành 5 phần cơ bản sau:</p><ol><li>Introduction: Định hình bối cảnh bài toán nghiên cứu chi phí phóng sà lan tên lửa của SpaceX và nêu rõ mục tiêu dự báo khả năng tái sử dụng lõi tên lửa để tiết kiệm ngân sách đầu tư.</li><li>Data Collection &amp; Wrangling: Tóm tắt phương pháp gọi API, kỹ thuật cào dữ liệu Wikipedia bằng BeautifulSoup và các bước làm sạch giá trị khuyết thiếu dữ liệu.</li><li>Exploratory Data Analysis (EDA): Trình bày các phát hiện thống kê thông qua các câu lệnh truy vấn SQL nâng cao và các đồ thị phân tích xu hướng trực quan.</li><li>Interactive Analytics: Trình diễn trực tiếp mô hình bản đồ tương tác Folium chỉ rõ khoảng cách an toàn bãi phóng và ứng dụng phân tích thời gian thực Dashboard của Plotly Dash.</li><li>Predictive Analysis &amp; Conclusion: Đưa ra bảng thống kê so sánh độ chính xác của 4 mô hình máy học đã huấn luyện, chỉ ra mô hình có hiệu năng cao nhất và đưa ra khuyến nghị thực tế cho doanh nghiệp.</li></ol>"}]}],"questions":[],"past":[],"pastExams":[],"glossary":[],"quick":[],"compares":[],"keyq":[],"recall":[{"id":"r-m1-001","module":"m1","ref":"1.1","type":"recall","kind":"manual","q":"Thư viện Python nào chuyên cung cấp cấu trúc dữ liệu DataFrame và Series cùng các công cụ phân tích dữ liệu?","correct":"Pandas","wrong":["NumPy","SciPy","Matplotlib"],"explain":"Pandas là thư viện tính toán khoa học chuyên về cấu trúc dữ liệu bảng (DataFrame) và các công cụ phân tích dữ liệu trong Python.","tip":"Gắn liền thao tác bảng và đọc/ghi dữ liệu với Pandas."},{"id":"r-m1-002","module":"m1","ref":"1.1","type":"recall","kind":"manual","q":"Trong các thư viện Python cho Khoa học Dữ liệu, thư viện nào thuộc nhóm thuật toán Máy học (Machine Learning)?","correct":"Scikit-learn","wrong":["NumPy","Seaborn","Matplotlib"],"explain":"Scikit-learn là thư viện máy học cung cấp các thuật toán xây dựng mô hình và các kỹ thuật tiền xử lý dữ liệu.","tip":"Học máy (Machine Learning) trong Python thường bắt đầu với Scikit-learn (sklearn)."},{"id":"r-m1-003","module":"m1","ref":"1.1","type":"recall","kind":"manual","q":"Thư viện nào được sử dụng để trực quan hóa thống kê nâng cao và vẽ biểu đồ heatmap?","correct":"Seaborn","wrong":["Pandas","SciPy","Statsmodels"],"explain":"Seaborn là thư viện trực quan hóa dữ liệu thống kê nâng cao, đặc biệt hỗ trợ vẽ biểu đồ nhiệt (heatmap).","tip":"Heatmap tương quan thường vẽ bằng sns.heatmap của Seaborn."},{"id":"r-m1-004","module":"m1","ref":"1.1","type":"recall","kind":"manual","q":"Để xuất dữ liệu từ một DataFrame ra file CSV mà không lưu cột chỉ số (index), cú pháp Pandas nào sau đây là đúng?","correct":"df.to_csv(\"cleaned_data.csv\", index=False)","wrong":["df.to_csv(\"cleaned_data.csv\", index=True)","df.read_csv(\"cleaned_data.csv\", index=False)","df.export_csv(\"cleaned_data.csv\", index=False)"],"explain":"Phương thức to_csv() dùng để ghi file CSV, và tham số index=False giúp không ghi cột chỉ số (index) vào file.","tip":"Muốn bỏ cột số thứ tự khi lưu file thì đặt index=False."},{"id":"r-m1-005","module":"m1","ref":"1.1","type":"recall","kind":"manual","q":"Để hiển thị 5 dòng đầu tiên của một DataFrame trong Pandas, phương thức nào được sử dụng?","correct":"print(df.head())","wrong":["print(df.tail())","print(df.describe())","print(df.info())"],"explain":"Phương thức df.head() mặc định trả về 5 dòng đầu tiên của DataFrame.","tip":"head() là phần đầu (5 dòng đầu), tail() là phần đuôi (5 dòng cuối)."},{"id":"r-m1-006","module":"m1","ref":"1.2","type":"recall","kind":"manual","q":"Cú pháp nào sau đây trong Pandas dùng để loại bỏ các dòng có giá trị bị thiếu (NaN/Null) tại cột 'price' trực tiếp trên DataFrame hiện tại?","correct":"df.dropna(subset=['price'], axis=0, inplace=True)","wrong":["df.fillna(subset=['price'], axis=0, inplace=True)","df.dropna(subset=['price'], axis=1, inplace=False)","df.replace(subset=['price'], axis=0, inplace=True)"],"explain":"Hàm dropna với axis=0 xóa các dòng bị thiếu theo danh sách cột trong subset, inplace=True để cập nhật trực tiếp vào DataFrame.","tip":"dropna() để xóa giá trị thiếu; axis=0 là xóa dòng, axis=1 là xóa cột."},{"id":"r-m1-007","module":"m1","ref":"1.2","type":"recall","kind":"manual","q":"Công thức nào sau đây biểu diễn phương pháp Chuẩn hóa Z-score (Chuẩn hóa chuẩn)?","correct":"df['length'] = (df['length'] - df['length'].mean()) / df['length'].std()","wrong":["df['length'] = df['length'] / df['length'].max()","df['length'] = (df['length'] - df['length'].min()) / (df['length'].max() - df['length'].min())","df['length'] = (df['length'] - df['length'].mean()) / df['length'].max()"],"explain":"Chuẩn hóa Z-score lấy giá trị trừ đi kỳ vọng trung bình (mean) rồi chia cho độ lệch chuẩn (std).","tip":"Z-score gắn liền với mean và std."},{"id":"r-m1-008","module":"m1","ref":"1.2","type":"recall","kind":"manual","q":"Đoạn mã `df['length'] = (df['length'] - df['length'].min()) / (df['length'].max() - df['length'].min())` tương ứng với phương pháp chuẩn hóa nào?","correct":"Min-Max Normalization","wrong":["Simple Feature Scaling","Z-score (Chuẩn hóa chuẩn)","One-Hot Encoding"],"explain":"Min-Max Normalization đưa dữ liệu về thang đo [0, 1] bằng cách lấy hiệu giữa giá trị và min chia cho khoảng biến thiên (max - min).","tip":"Công thức có cả min và max là Min-Max Normalization."},{"id":"r-m1-009","module":"m1","ref":"1.2","type":"recall","kind":"manual","q":"Kỹ thuật chia khoảng (Binning) sử dụng hàm nào trong Pandas để phân nhóm các giá trị liên tục thành các khoảng phân loại (categorical bins)?","correct":"pd.cut()","wrong":["pd.get_dummies()","pd.concat()","pd.pivot()"],"explain":"Hàm pd.cut() được sử dụng để cắt/chia nhỏ dữ liệu liên tục thành các khoảng rời rạc (bins) có gán nhãn danh mục.","tip":"pd.cut() cắt dữ liệu liên tục thành các khoảng nhỏ."},{"id":"r-m1-010","module":"m1","ref":"1.2","type":"recall","kind":"manual","q":"Trong tiền xử lý dữ liệu, phương pháp One-Hot Encoding được thực hiện bằng hàm nào của Pandas để tạo biến giả (dummy variables)?","correct":"pd.get_dummies()","wrong":["pd.cut()","pd.dropna()","pd.concat()"],"explain":"pd.get_dummies() chuyển đổi các biến phân loại thành các cột biến giả (dummy variables) chứa các giá trị nhị phân 0 và 1.","tip":"Tạo dummy variables thì nhớ tới get_dummies()."},{"id":"r-m1-011","module":"m1","ref":"1.3","type":"recall","kind":"manual","q":"Để tổng hợp nhanh các thông số thống kê mô tả (Descriptive Statistics) cơ bản như count, mean, std, min, max của các cột số, ta dùng lệnh nào?","correct":"print(df.describe())","wrong":["print(df.value_counts())","print(df.corr())","print(df.groupby())"],"explain":"df.describe() tính toán và hiển thị bảng tổng kết thống kê mô tả bao gồm số lượng, giá trị trung bình, độ lệch chuẩn, các tứ phân vị và min/max.","tip":"describe = mô tả thống kê."},{"id":"r-m1-012","module":"m1","ref":"1.3","type":"recall","kind":"manual","q":"Trong ma trận tương quan (Correlation Matrix) hiển thị bằng Heatmap, đường chéo (Diagonal Line) thể hiện điều gì?","correct":"Mọi biến luôn có hệ số tương quan hoàn hảo là 1 với chính nó","wrong":["Hệ số tương quan giữa hai biến độc lập bất kỳ luôn bằng 0","Các biến có tương quan nghịch hoàn toàn với giá trị -1","Các giá trị ngoại lai (outliers) phân bố tập trung trên đường chéo"],"explain":"Tương quan của bất kỳ biến nào với chính bản thân nó luôn bằng 1, do đó đường chéo ma trận luôn có giá trị 1 (màu đỏ đậm).","tip":"Tương quan với chính mình luôn luôn bằng 1."},{"id":"r-m1-013","module":"m1","ref":"1.3","type":"recall","kind":"manual","q":"Hiện tượng khi một biến tăng (như kích thước động cơ) kéo theo biến kia tăng (như giá xe) biểu thị mối quan hệ gì?","correct":"Tương quan dương (Positive Correlation)","wrong":["Tương quan âm (Negative Correlation)","Đa cộng tuyến (Multicollinearity)","Độc lập tuyến tính (Linear Independence)"],"explain":"Tương quan dương xảy ra khi hai biến biến thiên cùng chiều: biến này tăng thì biến kia cũng có xu hướng tăng.","tip":"Cùng tăng hoặc cùng giảm là tương quan dương (thuận)."},{"id":"r-m1-014","module":"m1","ref":"1.3","type":"recall","kind":"manual","q":"Hàm nào của thư viện Seaborn được sử dụng để vẽ biểu đồ phân tán (Scatter Plot) kết hợp với đường hồi quy?","correct":"sns.regplot()","wrong":["sns.heatmap()","sns.barplot()","sns.boxplot()"],"explain":"Hàm sns.regplot() vẽ các điểm dữ liệu phân tán (scatter plot) đồng thời khớp và hiển thị một đường hồi quy tuyến tính.","tip":"regplot viết tắt từ regression plot."},{"id":"r-m1-015","module":"m1","ref":"1.3","type":"recall","kind":"manual","q":"Để đếm tần suất xuất hiện của các giá trị phân loại riêng biệt trong một cột của Pandas DataFrame, ta dùng phương thức nào?","correct":"print(df['drive-wheels'].value_counts())","wrong":["print(df['drive-wheels'].count())","print(df['drive-wheels'].unique_counts())","print(df['drive-wheels'].sum())"],"explain":"value_counts() đếm số lần xuất hiện của từng giá trị độc nhất trong một cột phân loại.","tip":"value_counts() đếm tần suất giá trị."},{"id":"r-m1-016","module":"m1","ref":"1.4","type":"recall","kind":"manual","q":"Khi mô hình hồi quy tuyến tính đơn giản không khớp tốt với dữ liệu (không bắt được các đường cong trong dữ liệu), ta nên sử dụng mô hình nào?","correct":"Hồi quy đa thức (Polynomial Regression)","wrong":["Hồi quy Ridge (Ridge Regression)","Cây quyết định (Decision Tree)","K-Nearest Neighbors (KNN)"],"explain":"Hồi quy đa thức (Polynomial Regression) cho phép mô hình hóa các mối quan hệ phi tuyến dạng đường cong uốn lượn trong dữ liệu.","tip":"Dữ liệu có đường cong phức tạp thì dùng Hồi quy đa thức."},{"id":"r-m1-017","module":"m1","ref":"1.4","type":"recall","kind":"manual","q":"Việc sử dụng Pipeline trong thư viện Scikit-learn mang lại lợi ích chính nào?","correct":"Đơn giản hóa và kết hợp tuần tự quá trình biến đổi dữ liệu và khớp mô hình","wrong":["Tự động loại bỏ toàn bộ dữ liệu ngoại lai và thay thế giá trị khuyết","Tự động quét và tìm kiếm siêu tham số tối ưu thay cho GridSearchCV","Gia tăng số lượng bản ghi của tập dữ liệu huấn luyện"],"explain":"Pipeline cho phép xâu chuỗi nhiều bước tiền xử lý (như chuẩn hóa, biến đổi đa thức) với mô hình ước lượng thành một quy trình duy nhất.","tip":"Pipeline như dây chuyền lắp ráp tuần tự từ tiền xử lý đến mô hình."},{"id":"r-m1-018","module":"m1","ref":"1.4","type":"recall","kind":"manual","q":"Thước đo R-squared (R bình phương) trong đánh giá mô hình hồi quy thể hiện điều gì?","correct":"Tỷ lệ phần trăm phương sai của biến mục tiêu được giải thích bởi mô hình","wrong":["Giá trị trung bình của bình phương các sai số giữa thực tế và dự đoán","Số lượng đặc trưng độc lập có ý nghĩa thống kê trong mô hình","Độ lệch chuẩn giữa giá trị dự báo và giá trị trung bình mục tiêu"],"explain":"R-squared biểu thị tỷ lệ phần trăm phương sai của biến mục tiêu được giải thích bởi các biến độc lập trong mô hình; càng gần 1 càng tốt.","tip":"R-squared đo mức độ giải thích phương sai, giá trị lý tưởng tiến gần 1."},{"id":"r-m1-019","module":"m1","ref":"1.4","type":"recall","kind":"manual","q":"Nhận định nào sau đây là đúng về chỉ số Mean Squared Error (MSE)?","correct":"Là giá trị trung bình của bình phương các sai số, MSE càng nhỏ thì mô hình càng chính xác","wrong":["Là giá trị trung bình sai số tuyệt đối, MSE càng lớn chứng tỏ mô hình càng tốt","Là tỷ lệ phương sai giải thích được, MSE luôn nằm trong khoảng từ 0 đến 1","Là độ lệch chuẩn của phần dư, MSE càng tiến gần 1 mô hình càng tin cậy"],"explain":"Mean Squared Error (MSE) đo giá trị trung bình của bình phương sai số dự báo; giá trị MSE càng nhỏ thì độ chính xác của mô hình càng cao.","tip":"MSE là sai số (Error) nên giá trị càng nhỏ càng tốt."},{"id":"r-m1-020","module":"m1","ref":"1.5","type":"recall","kind":"manual","q":"Hiện tượng quá khớp (Overfitting) trong học máy xảy ra khi nào và dẫn đến hậu quả gì?","correct":"Mô hình bắt cả nhiễu (noise) của dữ liệu huấn luyện, dẫn đến kết quả kém trên dữ liệu mới","wrong":["Mô hình quá đơn giản, không học được cấu trúc ngay trên tập huấn luyện","Mô hình dự đoán quá nhanh nhưng tiêu tốn nhiều bộ nhớ RAM khi huấn luyện","Mô hình đạt độ chính xác tương đương nhau trên cả tập train và test"],"explain":"Overfitting xảy ra khi mô hình quá phức tạp và học cả các chi tiết ngẫu nhiên (nhiễu) của dữ liệu huấn luyện, khiến khả năng tổng quát hóa trên dữ liệu mới bị giảm sút.","tip":"Overfitting: điểm train rất cao nhưng điểm test rất thấp do học vẹt cả nhiễu."},{"id":"r-m1-021","module":"m1","ref":"1.5","type":"recall","kind":"manual","q":"Mô hình Hồi quy Ridge (Ridge Regression) được sử dụng phù hợp nhất trong hoàn cảnh nào?","correct":"Khi có hiện tượng đa cộng tuyến hoặc khi mô hình đa thức bị overfitting","wrong":["Khi biến mục tiêu là biến phân loại nhị phân (Binary Classification)","Khi tập dữ liệu có quá nhiều giá trị khuyết không thể điền trung bình","Khi các biến đầu vào hoàn toàn không có tương quan với nhau"],"explain":"Ridge Regression áp dụng kỹ thuật điều chuẩn L2 để giải quyết hiện tượng đa cộng tuyến và ngăn chặn overfitting của mô hình đa thức.","tip":"Ridge giải quyết đa cộng tuyến và chống overfitting."},{"id":"r-m1-022","module":"m1","ref":"1.5","type":"recall","kind":"manual","q":"Trong Hồi quy Ridge, tham số 'alpha' có vai trò gì đối với mô hình?","correct":"Kiểm soát mức độ phạt (penalty) đối với độ lớn của các hệ số","wrong":["Xác định số lượng cụm phân loại trong không gian dữ liệu","Quy định số lượng nếp gấp K-fold trong quá trình kiểm chứng chéo","Thiết lập tỷ lệ phần trăm phân chia giữa tập train và tập test"],"explain":"Tham số alpha trong Ridge Regression quy định mức độ phạt (penalty) lên độ lớn của các hệ số hồi quy để kiểm soát độ phức tạp mô hình.","tip":"Alpha càng lớn thì mức phạt càng mạnh."},{"id":"r-m1-023","module":"m1","ref":"1.5","type":"recall","kind":"manual","q":"Mặc định, phương pháp GridSearchCV sử dụng thang đo (scoring) nào để đánh giá và lựa chọn mô hình hồi quy tối ưu?","correct":"Điểm R-squared","wrong":["Mean Squared Error (MSE)","Accuracy (Độ chính xác)","F1-score"],"explain":"Theo nội dung bài học, phương pháp GridSearchCV mặc định sử dụng điểm R-squared làm thang đo scoring để tìm mô hình tốt nhất.","tip":"Mặc định cho hồi quy trong GridSearchCV là R-squared."},{"id":"r-m1-024","module":"m1","ref":"1.5","type":"recall","kind":"manual","q":"Sau khi huấn luyện đối tượng GridSearchCV, thuộc tính nào được sử dụng để trích xuất ra mô hình tối ưu nhất?","correct":"best_estimator_","wrong":["cv_results_","best_score_","best_params_"],"explain":"Thuộc tính best_estimator_ của GridSearchCV trả về mô hình đã được khớp với bộ siêu tham số tốt nhất.","tip":"best_estimator_ lấy ra object mô hình tối ưu, còn best_params_ lấy ra dict tham số."},{"id":"r-m2-001","module":"m2","ref":"2.2","type":"recall","kind":"manual","q":"Mục tiêu cốt lõi của trực quan hóa dữ liệu (Data Visualization) là gì?","correct":"Chuyển đổi dữ liệu thô thành biểu diễn đồ họa để dễ phát hiện xu hướng, mẫu (patterns) và ngoại lai","wrong":["Thay thế hoàn toàn quá trình làm sạch dữ liệu và điền giá trị khuyết thiếu","Tự động tính toán các siêu tham số tối ưu nhất cho thuật toán máy học","Chuyển đổi biến số liên tục thành các biến phân loại nhị phân trong cơ sở dữ liệu"],"explain":"Trực quan hóa dữ liệu giúp biến dữ liệu thô thành hình ảnh đồ họa trực quan, giúp người phân tích nhanh chóng nhận ra xu hướng, quy luật và điểm dị biệt.","tip":"Mục đích trực quan hóa: dễ nhìn thấy mẫu (patterns) và ngoại lai (outliers)."},{"id":"r-m2-002","module":"m2","ref":"2.2","type":"recall","kind":"manual","q":"Thư viện Matplotlib cung cấp hai cách tiếp cận chính nào để xây dựng biểu đồ?","correct":"Scripting layer (pyplot) và Artist layer (Object-oriented)","wrong":["Backend layer và Network layer","Functional layer và Procedural layer","Declarative layer và Imperative layer"],"explain":"Matplotlib hỗ trợ hai phong cách tiếp cận chính: Scripting layer thông qua pyplot và Artist layer theo hướng đối tượng (Object-oriented).","tip":"Pyplot là Scripting layer, tiếp cận hướng đối tượng là Artist layer."},{"id":"r-m2-003","module":"m2","ref":"2.2","type":"recall","kind":"manual","q":"Biểu đồ đường (Line Plots) thường được ưu tiên sử dụng phù hợp nhất cho loại dữ liệu nào?","correct":"Dữ liệu chuỗi thời gian (time-series)","wrong":["Dữ liệu danh mục phân loại không có thứ tự thời gian","Dữ liệu phân bố tần suất của một biến rời rạc","Dữ liệu không gian địa lý dựa trên tọa độ kinh độ và vĩ độ"],"explain":"Biểu đồ đường rất thích hợp để quan sát xu hướng thay đổi liên tục của dữ liệu theo thời gian (chuỗi thời gian).","tip":"Theo dõi biến động qua các năm/thời gian thì dùng Line Plot."},{"id":"r-m2-004","module":"m2","ref":"2.2","type":"recall","kind":"manual","q":"Để vẽ biểu đồ đường trong Pandas từ một Series hoặc DataFrame, tham số `kind` trong phương thức `.plot()` được gán giá trị gì?","correct":"kind='line'","wrong":["kind='bar'","kind='scatter'","kind='area'"],"explain":"Trong phương thức plot() của Pandas, thiết lập kind='line' chỉ định việc vẽ biểu đồ đường.","tip":"kind='line' tạo biểu đồ đường tuyến tính."},{"id":"r-m2-005","module":"m2","ref":"2.3","type":"recall","kind":"manual","q":"Loại biểu đồ nào dựa trên biểu đồ đường nhưng tô màu phần diện tích bên dưới, thích hợp xem xét các thành phần cộng dồn theo thời gian?","correct":"Biểu đồ diện tích (Area Plot)","wrong":["Biểu đồ phân tán (Scatter Plot)","Biểu đồ hộp (Box Plot)","Biểu đồ tần suất (Histogram)"],"explain":"Area Plot tô màu phần diện tích dưới đường biểu diễn, giúp quan sát tỷ trọng đóng góp và sự cộng dồn theo thời gian.","tip":"Tô màu phần diện tích bên dưới đường chính là Area Plot."},{"id":"r-m2-006","module":"m2","ref":"2.3","type":"recall","kind":"manual","q":"Biểu đồ nào được dùng để biểu diễn phân phối tần suất của một tập hợp các số liệu liên tục?","correct":"Biểu đồ tần suất (Histogram)","wrong":["Biểu đồ cột (Bar Chart)","Biểu đồ tròn (Pie Chart)","Biểu đồ phân tán (Scatter Plot)"],"explain":"Histogram chia dải giá trị số liên tục thành các khoảng (bins) và đếm tần suất xuất hiện của dữ liệu trong từng khoảng.","tip":"Phân phối tần suất dữ liệu liên tục -> Histogram. So sánh giá trị phân loại -> Bar Chart."},{"id":"r-m2-007","module":"m2","ref":"2.3","type":"recall","kind":"manual","q":"Biểu đồ hộp (Box Plots) giúp người phân tích khảo sát sự phân tán và ngoại lai của dữ liệu thông qua những mốc thống kê nào?","correct":"Min, Q1, Median (trung vị), Q3, Max và Outliers","wrong":["Mean, Standard Deviation, Variance, Mode và Z-score","R-squared, Mean Squared Error, Absolute Error và Residuals","Count, Unique values, Top category và Frequency"],"explain":"Biểu đồ Box Plot tóm tắt dữ liệu qua 5 con số thống kê chính (Min, Q1, Median, Q3, Max) cùng các điểm ngoại lai (outliers) nằm ngoài râu biểu đồ.","tip":"Box Plot thể hiện 5 mốc tứ phân vị (min, Q1, median, Q3, max) và outliers."},{"id":"r-m2-008","module":"m2","ref":"2.3","type":"recall","kind":"manual","q":"Khi cần thể hiện tỷ lệ phần trăm của các thành phần con cấu thành trong một tổng thể trọn vẹn, loại biểu đồ nào thích hợp nhất?","correct":"Biểu đồ tròn (Pie Chart)","wrong":["Biểu đồ phân tán (Scatter Plot)","Biểu đồ hộp (Box Plot)","Biểu đồ đường (Line Plot)"],"explain":"Pie Chart chia hình tròn thành các lát đại diện cho tỷ lệ phần trăm đóng góp của từng thành phần trong tổng số 100%.","tip":"Tỷ lệ phần trăm trong tổng thể -> Pie Chart."},{"id":"r-m2-009","module":"m2","ref":"2.3","type":"recall","kind":"manual","q":"Để xem xét mối tương quan tuyến tính hoặc phi tuyến giữa hai biến số liên tục với nhau, ta sử dụng biểu đồ nào?","correct":"Biểu đồ phân tán (Scatter Plot)","wrong":["Biểu đồ cột (Bar Chart)","Biểu đồ tròn (Pie Chart)","Biểu đồ hộp (Box Plot)"],"explain":"Scatter Plot biểu diễn các cặp điểm dữ liệu trên hệ tọa độ 2 chiều (X và Y), qua đó giúp phát hiện mối tương quan giữa hai biến số liên tục.","tip":"Tương quan giữa hai biến số liên tục -> Scatter Plot."},{"id":"r-m2-010","module":"m2","ref":"2.4","type":"recall","kind":"manual","q":"Biểu đồ Waffle Chart có đặc điểm thiết kế và mục đích sử dụng chính là gì?","correct":"Biểu đồ dạng ô vuông (lưới) trực quan dùng để thay thế Pie Chart, thể hiện tỷ lệ của các danh mục","wrong":["Biểu đồ dạng đám mây chữ dùng để phân loại văn bản tự động","Biểu đồ đa giác tô màu theo ranh giới hành chính của quốc gia","Biểu đồ đường uốn lượn thể hiện chuỗi thời gian liên tục"],"explain":"Waffle Chart gồm các ô lưới hình vuông nhỏ, biểu diễn trực quan và rõ ràng tỷ lệ giữa các danh mục hơn so với biểu đồ tròn.","tip":"Waffle Chart = lưới ô vuông (như bánh waffle) thay thế Pie Chart."},{"id":"r-m2-011","module":"m2","ref":"2.4","type":"recall","kind":"manual","q":"Trong biểu đồ đám mây từ vựng (Word Cloud), kích thước hiển thị của một từ phản ánh điều gì?","correct":"Tần suất xuất hiện của từ ngữ trong văn bản (kích thước tỷ lệ thuận với tần suất)","wrong":["Độ dài ký tự của từ ngữ đó trong câu","Mức độ quan trọng ngữ pháp của từ theo thứ tự bảng chữ cái","Hệ số tương quan Pearson giữa từ đó với các từ xung quanh"],"explain":"Trong Word Cloud, từ nào xuất hiện lặp lại càng nhiều lần trong văn bản thì kích thước phông chữ hiển thị của từ đó càng lớn.","tip":"Từ càng to = xuất hiện càng nhiều."},{"id":"r-m2-012","module":"m2","ref":"2.4","type":"recall","kind":"manual","q":"Thư viện Folium trong Python được xây dựng nhằm mục đích kết nối sức mạnh của Python với thư viện bản đồ JavaScript nào?","correct":"Leaflet.js","wrong":["D3.js","Chart.js","Three.js"],"explain":"Folium tận dụng sức mạnh xử lý dữ liệu của Python và thư viện bản đồ tương tác Leaflet.js của JavaScript để hiển thị bản đồ.","tip":"Folium đi kèm với Leaflet.js."},{"id":"r-m2-013","module":"m2","ref":"2.4","type":"recall","kind":"manual","q":"Để tô màu các vùng địa lý khác nhau trên bản đồ Folium theo phân bố mật độ dữ liệu số, loại biểu đồ nào được sử dụng?","correct":"Biểu đồ Choropleth (Choropleth Map)","wrong":["Biểu đồ Waffle Chart","Biểu đồ Word Cloud","Biểu đồ Box Plot"],"explain":"Bản đồ Choropleth tô màu các phân vùng hành chính/địa lý theo các thang giá trị dữ liệu thống kê tương ứng.","tip":"Tô màu bản đồ theo vùng địa lý = Choropleth."},{"id":"r-m2-014","module":"m2","ref":"2.4","type":"recall","kind":"manual","q":"Để đánh dấu một địa điểm có tọa độ xác định kèm thông tin dạng popup hiển thị khi nhấp chuột trên bản đồ Folium, ta dùng cú pháp nào?","correct":"folium.Marker([lat, lon], popup='...').add_to(map)","wrong":["folium.Choropleth([lat, lon], title='...').add_to(map)","folium.Point([lat, lon], label='...').show()","folium.Pin([lat, lon], text='...').render()"],"explain":"Lớp đối tượng folium.Marker nhận tọa độ [kinh độ, vĩ độ] và tham số popup để hiển thị nhãn đánh dấu trên bản đồ.","tip":"folium.Marker đánh dấu điểm mốc trên bản đồ."},{"id":"r-m2-015","module":"m2","ref":"2.5","type":"recall","kind":"manual","q":"Thư viện Dash trong Python có vai trò và ưu điểm chính là gì?","correct":"Xây dựng các ứng dụng web phân tích dữ liệu (Dashboards) tương tác mà không cần viết JavaScript hay HTML thuần","wrong":["Cung cấp các thuật toán huấn luyện mạng nơ-ron học sâu tối ưu trên GPU","Quản trị và tối ưu hóa câu lệnh truy vấn trong hệ cơ sở dữ liệu quan hệ","Tự động trích xuất bảng biểu dữ liệu từ các website tin tức trực tuyến"],"explain":"Dash là framework Python mã nguồn mở giúp xây dựng ứng dụng web phân tích và dashboard hoàn toàn bằng Python mà không cần kiến thức web chuyên sâu.","tip":"Dash viết web dashboard hoàn toàn bằng Python."},{"id":"r-m2-016","module":"m2","ref":"2.5","type":"recall","kind":"manual","q":"Gói thư viện con `dash.html` (Dash HTML Components) đảm nhận nhiệm vụ gì trong ứng dụng Dash?","correct":"Cung cấp các thẻ HTML để xây dựng cấu trúc giao diện (Div, H1, P,...)","wrong":["Cung cấp các biểu đồ động tương tác như thanh trượt Slider và Dropdown","Quản lý luồng dữ liệu phản hồi giữa các hàm callback trong server","Lưu trữ dữ liệu vào bảng cơ sở dữ liệu quan hệ Db2"],"explain":"dash.html cung cấp các thành phần thẻ HTML thuần (Div, H1, H2, P,...) dưới dạng các đối tượng Python để thiết kế layout.","tip":"dash.html tạo cấu trúc layout (Div, H1, P...)."},{"id":"r-m2-017","module":"m2","ref":"2.5","type":"recall","kind":"manual","q":"Các thành phần điều khiển giao diện tương tác như Dropdown, Slider và đối tượng hiển thị biểu đồ Graph thuộc về gói thư viện nào trong Dash?","correct":"Dash Core Components (dash.dcc)","wrong":["Dash HTML Components (dash.html)","Dash Dependencies (dash.dependencies)","Dash Bootstrap Components (dash.dbc)"],"explain":"Các thành phần tương tác cao như Dropdown, Slider, Graph,... nằm trong gói Dash Core Components (dash.dcc).","tip":"dcc = Dash Core Components (Dropdown, Slider, Graph)."},{"id":"r-m2-018","module":"m2","ref":"2.5","type":"recall","kind":"manual","q":"Cơ chế nào trong Dash chịu trách nhiệm liên kết hành động của người dùng trên giao diện với việc cập nhật nội dung biểu đồ tự động?","correct":"Hàm phản hồi Callback thông qua decorator @app.callback","wrong":["Phương thức fit_transform() trong bộ chuẩn hóa StandardScaler","Hàm khởi tạo layout trong dash.html.Div","Cơ chế Grid Search lặp qua các nếp gấp K-fold"],"explain":"Decorator @app.callback kết nối các thành phần Input và Output, tự động gọi hàm Python xử lý mỗi khi có sự kiện tương tác từ người dùng.","tip":"@app.callback kết nối Input tương tác với Output hiển thị."},{"id":"r-m2-019","module":"m2","ref":"2.5","type":"recall","kind":"manual","q":"Trong decorator `@app.callback`, thành phần `Input` đại diện cho điều gì?","correct":"Thao tác lựa chọn hoặc dữ liệu người dùng thay đổi trên thành phần giao diện","wrong":["Biểu đồ hoặc văn bản giao diện đích cần được vẽ lại sau khi tính toán","Dữ liệu huấn luyện đầu vào của mô hình máy học scikit-learn","Khóa truy cập cá nhân dùng để kết nối với cơ sở dữ liệu ngoài"],"explain":"Input trong callback chỉ định thành phần nguồn phát sinh sự kiện tương tác của người dùng (ví dụ giá trị được chọn trong dropdown).","tip":"Input: dữ liệu từ phía người dùng chọn; Output: thành phần hiển thị nhận kết quả."},{"id":"r-m3-001","module":"m3","ref":"3.2","type":"recall","kind":"manual","q":"Trong quy trình làm sạch và biến đổi dữ liệu (Data Wrangling), nếu một bản ghi bị mất giá trị của biến mục tiêu (target variable), giải pháp xử lý chuẩn là gì?","correct":"Loại bỏ bản ghi đó ra khỏi tập dữ liệu","wrong":["Thay thế bằng giá trị trung bình (Mean Imputation)","Thay thế bằng giá trị xuất hiện nhiều nhất (Mode)","Điền giá trị 0 hoặc chuỗi ký tự rỗng"],"explain":"Theo quy trình chuẩn trong bài, dữ liệu thiếu ở biến mục tiêu (target) thì phải loại bỏ, còn thiếu ở biến độc lập mới cân nhắc thay thế bằng Mean/Median/Mode.","tip":"Mất biến mục tiêu (target) thì không thể học chuẩn được nên phải loại bỏ."},{"id":"r-m3-002","module":"m3","ref":"3.2","type":"recall","kind":"manual","q":"Ba bước chuẩn theo thứ tự trong quy trình Làm sạch và biến đổi dữ liệu (Data Wrangling) là gì?","correct":"Nhận diện -> Loại bỏ (nếu mất target) -> Thay thế (bằng Mean, Median hoặc Mode)","wrong":["Thay thế -> Nhận diện -> Loại bỏ","Chuẩn hóa -> Huấn luyện -> Đánh giá","Trích xuất -> Tải lên -> Phân tích tương quan"],"explain":"Quy trình chuẩn được nêu rõ: Nhận diện giá trị khuyết -> Loại bỏ (nếu mất target) -> Thay thế (bằng Mean, Median hoặc Mode).","tip":"Nhận diện trước, loại bỏ nếu mất nhãn mục tiêu, rồi mới điền thay thế."},{"id":"r-m3-003","module":"m3","ref":"3.2","type":"recall","kind":"manual","q":"Để chuyển đổi các ký tự đặc biệt đại diện cho dữ liệu thiếu (như dấu \"?\") thành giá trị NaN của NumPy trong DataFrame, ta dùng cú pháp nào?","correct":"df.replace(\"?\", np.nan, inplace=True)","wrong":["df.fillna(\"?\", np.nan, inplace=True)","df.dropna(\"?\", inplace=True)","df.astype(\"?\", np.nan)"],"explain":"Phương thức df.replace(\"?\", np.nan, inplace=True) tìm kiếm ký tự \"?\" và thay thế bằng hằng số np.nan của NumPy.","tip":"replace('?', np.nan) để đưa dấu hỏi về chuẩn NaN."},{"id":"r-m3-004","module":"m3","ref":"3.2","type":"recall","kind":"manual","q":"Thư viện Python nào chuyên dùng cho việc khám phá dữ liệu và ước lượng mô hình hóa thống kê chuyên sâu?","correct":"Statsmodels","wrong":["NumPy","Matplotlib","Scipy"],"explain":"Statsmodels là thư viện chuyên trách việc khám phá dữ liệu và ước lượng các mô hình thống kê chuyên sâu trong Python.","tip":"Mô hình hóa thống kê (statistical models) -> Statsmodels."},{"id":"r-m3-005","module":"m3","ref":"3.2","type":"recall","kind":"manual","q":"Khi tạo các biến giả (dummy variables) bằng One-Hot Encoding, hàm nào của Pandas được dùng để ghép các cột mới này vào DataFrame ban đầu?","correct":"df = pd.concat([df, dummy_var], axis=1)","wrong":["df = pd.concat([df, dummy_var], axis=0)","df = pd.merge([df, dummy_var], on='index')","df = pd.append([df, dummy_var])"],"explain":"Hàm pd.concat với danh sách các DataFrame và tham số axis=1 thực hiện việc nối/ghép các cột theo chiều ngang.","tip":"axis=1 là ghép thêm cột (chiều ngang)."},{"id":"r-m3-006","module":"m3","ref":"3.3","type":"recall","kind":"manual","q":"Kiến trúc nền tảng của thư viện Matplotlib được tổ chức thành 3 tầng (layers) nào?","correct":"Backend layer, Artist layer và Scripting layer","wrong":["Presentation layer, Business layer và Database layer","Model layer, View layer và Controller layer","Client layer, Gateway layer và Server layer"],"explain":"Matplotlib được thiết kế dựa trên kiến trúc 3 tầng: Backend (vẽ đồ họa nền), Artist (các đối tượng hình vẽ) và Scripting (giao diện thao tác như pyplot).","tip":"3 tầng của Matplotlib: Backend, Artist, Scripting."},{"id":"r-m3-007","module":"m3","ref":"3.3","type":"recall","kind":"manual","q":"Trong Matplotlib và Pandas plot, tham số `figsize` đóng vai trò gì?","correct":"Thiết lập kích thước của hình vẽ hiển thị (chiều rộng, chiều cao theo inch)","wrong":["Quy định số lượng điểm dữ liệu tối đa được hiển thị trên biểu đồ","Xác định kích cỡ phông chữ của tiêu đề và các nhãn trục tọa độ","Quy định độ phân giải DPI của file ảnh khi lưu về ổ đĩa"],"explain":"Tham số figsize=(width, height) thiết lập kích thước chiều rộng và chiều cao của khung hình vẽ biểu đồ.","tip":"figsize = kích thước figure (rộng, cao)."},{"id":"r-m3-008","module":"m3","ref":"3.3","type":"recall","kind":"manual","q":"Trong thư viện Folium, cú pháp nào được dùng để gắn một điểm đánh dấu (Marker) lên đối tượng bản đồ đã tạo?","correct":"folium.Marker(location=[lat, lon], popup='...').add_to(map_name)","wrong":["map_name.insert(folium.Marker(location=[lat, lon]))","folium.Marker(location=[lat, lon]).render(map_name)","map_name.append_marker([lat, lon], popup='...')"],"explain":"Đối tượng folium.Marker cung cấp phương thức .add_to(map_name) để gắn chính nó vào đối tượng bản đồ đích.","tip":"Marker().add_to(map) để đưa điểm vào bản đồ."},{"id":"r-m3-009","module":"m3","ref":"3.3","type":"recall","kind":"manual","q":"Trong ứng dụng xây dựng bằng Dash, thành phần nào giữ vai trò quản lý tính tương tác giữa lựa chọn của người dùng và việc cập nhật biểu đồ?","correct":"Hàm phản hồi (Callback) với decorator @app.callback","wrong":["Phương thức fit() trong mô hình hồi quy tuyến tính","Cấu trúc bảng Dash HTML Components","Hàm khởi tạo đối tượng Folium Map"],"explain":"Decorator @app.callback liên kết dữ liệu đầu vào (Input) từ thao tác người dùng để tự động chạy hàm logic và cập nhật dữ liệu đầu ra (Output) lên biểu đồ.","tip":"Tương tác trong Dash luôn thông qua Callback."},{"id":"r-m3-010","module":"m3","ref":"3.4","type":"recall","kind":"manual","q":"Kiến trúc trợ lý nhận thức (cognitive assistant architecture) trong Watson Assistant gồm 3 thành phần cốt lõi nào?","correct":"Intents (Ý định), Entities (Thực thể / Từ khóa) và Dialog (Kịch bản hội thoại)","wrong":["Input, Hidden Layers và Output","Model, View và Controller","Database, API Gateway và Web Client"],"explain":"Watson Assistant cấu thành từ 3 phần cơ bản: Intents (nhận diện ý định người dùng), Entities (trích xuất thực thể) và Dialog (quản lý luồng hội thoại).","tip":"Intents, Entities, Dialog là bộ 3 cốt lõi của Watson Assistant."},{"id":"r-m3-011","module":"m3","ref":"3.4","type":"recall","kind":"manual","q":"Trong Watson Assistant, thành phần 'Intents' đại diện cho điều gì?","correct":"Ý định hoặc mục đích của người dùng khi đưa ra câu nói","wrong":["Từ khóa hoặc danh từ cụ thể chỉ thực thể trong câu","Cây sơ đồ logic điều hướng các nhánh rẽ hội thoại","Khóa bảo mật cá nhân dùng để kết nối với đám mây"],"explain":"Intents thể hiện mục đích hoặc ý định mà người dùng muốn thực hiện (ví dụ: hỏi giá, đặt câu hỏi chào hỏi).","tip":"Intent = ý định của người dùng."},{"id":"r-m3-012","module":"m3","ref":"3.4","type":"recall","kind":"manual","q":"Dịch vụ nào của IBM Watson giúp chuyển đổi văn bản câu trả lời thành giọng nói âm thanh?","correct":"Text-to-Speech (TTS)","wrong":["Speech-to-Text (STT)","Language Translator","Natural Language Understanding"],"explain":"Dịch vụ Text-to-Speech (TTS) chuyển đổi văn bản (text) thành giọng nói tổng hợp (speech).","tip":"Text-to-Speech (TTS): Chữ thành Tiếng nói; Speech-to-Text (STT): Tiếng nói thành Chữ."},{"id":"r-m3-013","module":"m3","ref":"3.4","type":"recall","kind":"manual","q":"Theo tài liệu, Watson Assistant hỗ trợ triển khai đa kênh (deployment) thông qua những nền tảng nào?","correct":"Web Chat, WordPress, Slack, Facebook Messenger và Node-RED","wrong":["Hệ điều hành Android thuần, iOS Swift, Docker và Kubernetes","Email SMTP, SMS Gateway truyền thống và Tổng đài Analog","Chỉ hỗ trợ duy nhất giao diện dòng lệnh CLI trên terminal"],"explain":"Watson Assistant hỗ trợ tích hợp sẵn với nhiều kênh như Web Chat, WordPress, Slack, Facebook Messenger và luồng Node-RED.","tip":"Watson triển khai đa kênh: Web Chat, Slack, Messenger, WordPress, Node-RED."},{"id":"r-m3-014","module":"m3","ref":"3.4","type":"recall","kind":"manual","q":"Để xác thực quyền truy cập khi tương tác với các dịch vụ Watson API bằng IBM Cloud Python SDK, lớp đối tượng nào được sử dụng?","correct":"IAMAuthenticator","wrong":["BasicAuthSession","OAuth2BearerToken","JWTHeaderVerifier"],"explain":"Lớp IAMAuthenticator từ thư viện ibm_cloud_sdk_core.authenticators được dùng để truyền API Key xác thực danh tính.","tip":"IAMAuthenticator truyền API Key xác thực với IBM Cloud."},{"id":"r-m3-015","module":"m3","ref":"3.5","type":"recall","kind":"manual","q":"IBM Db2 thuộc loại hệ quản trị cơ sở dữ liệu nào?","correct":"Hệ quản trị cơ sở dữ liệu quan hệ (RDBMS)","wrong":["Cơ sở dữ liệu phi quan hệ dạng tài liệu (Document NoSQL)","Cơ sở dữ liệu đồ thị phân tán (Graph Database)","Kho lưu trữ khóa - giá trị trong bộ nhớ (Key-Value Store)"],"explain":"IBM Db2 là hệ quản trị cơ sở dữ liệu quan hệ (RDBMS) thế hệ mới, tối ưu hóa cho phân tích dữ liệu lớn trên nền tảng đám mây.","tip":"Db2 là hệ RDBMS của IBM."},{"id":"r-m3-016","module":"m3","ref":"3.5","type":"recall","kind":"manual","q":"Khi khởi tạo một phiên bản dịch vụ Db2 trên IBM Cloud Console, các thông số cấu hình cơ bản cần thiết lập gồm những gì?","correct":"Vùng tài nguyên (Region), tên thực thể dịch vụ (Service name) và nhóm tài nguyên (Resource group)","wrong":["Số lượng bảng tối đa, kiểu mã hóa SSL và địa chỉ IP tĩnh","Thuật toán mã hóa mật khẩu, cổng REST API và giao thức HTTP","Tên người dùng quản trị tối cao, dung lượng RAM và số nhân CPU"],"explain":"Các thông số cơ bản khi khởi tạo dịch vụ trên IBM Cloud Console là: Region (vùng), Service name (tên thực thể) và Resource group (nhóm tài nguyên).","tip":"Bộ 3 khởi tạo dịch vụ đám mây: Region, Service name, Resource group."},{"id":"r-m3-017","module":"m3","ref":"3.5","type":"recall","kind":"manual","q":"Trong quá trình nạp dữ liệu vào Db2, thành phần nào được sử dụng để phân tách không gian tên giữa các dự án?","correct":"Lược đồ (Schema)","wrong":["Khóa ngoại (Foreign Key)","Cổng kết nối (Port)","Chuỗi kết nối (DSN)"],"explain":"Lược đồ (Schema) trong Db2 được dùng để phân chia và nhóm các đối tượng dữ liệu (bảng, view), tách biệt không gian tên giữa các dự án.","tip":"Schema phân tách không gian tên giữa các bảng và dự án."},{"id":"r-m3-018","module":"m3","ref":"3.5","type":"recall","kind":"manual","q":"Trong mô hình kiến trúc cung cấp REST API cho cơ sở dữ liệu, máy chủ trung gian (như Flask hoặc Express) giữ vai trò gì?","correct":"Đóng vai trò API Gateway tiếp nhận yêu cầu HTTP, thực thi truy vấn SQL và đóng gói kết quả dạng JSON","wrong":["Lưu trữ vĩnh viễn toàn bộ dữ liệu bảng thay thế cơ sở dữ liệu Db2","Tự động huấn luyện lại các mô hình học máy theo chu kỳ thời gian thực","Sinh mã HTML tĩnh để hiển thị giao diện báo cáo cho người dùng cuối"],"explain":"Máy chủ trung gian đóng vai trò API Gateway: nhận yêu cầu HTTP từ client, chạy truy vấn SQL tới Db2, và trả về dữ liệu định dạng JSON tiêu chuẩn.","tip":"API Gateway: trung gian kết nối HTTP request với truy vấn SQL sang Db2."},{"id":"r-m3-019","module":"m3","ref":"3.5","type":"recall","kind":"manual","q":"Thư viện Python nào được sử dụng trực tiếp để kết nối và thực thi truy vấn SQL với cơ sở dữ liệu IBM Db2?","correct":"ibm_db","wrong":["sqlite3","psycopg2","mysql-connector"],"explain":"ibm_db là driver và thư viện chính thức trong Python dùng để kết nối và thực thi các câu lệnh SQL trên IBM Db2.","tip":"ibm_db là thư viện kết nối Db2 trong Python."},{"id":"r-m3-020","module":"m3","ref":"3.5","type":"recall","kind":"manual","q":"Phương thức nào trong thư viện `ibm_db` được sử dụng để lấy từng dòng bản ghi dữ liệu kết quả dưới dạng dictionary liên kết?","correct":"ibm_db.fetch_assoc()","wrong":["ibm_db.fetchall()","ibm_db.get_row()","ibm_db.read_record()"],"explain":"Phương thức ibm_db.fetch_assoc(stmt) duyệt và trả về dòng bản ghi tiếp theo dưới dạng associative array (dictionary trong Python).","tip":"fetch_assoc() = fetch associative array (dạng dictionary)."},{"id":"r-m3-021","module":"m3","ref":"3.5","type":"recall","kind":"manual","q":"Mục đích quan trọng nhất của việc thiết lập Khóa chính (Primary Key) khi tạo bảng trong cơ sở dữ liệu quan hệ Db2 là gì?","correct":"Đảm bảo tính toàn vẹn và tính duy nhất của dữ liệu trên mỗi dòng bản ghi","wrong":["Tự động mã hóa toàn bộ dữ liệu lưu trữ trên các cột số","Tăng tốc độ truyền tải gói tin qua giao thức mạng HTTP","Cho phép lưu trữ giá trị rỗng (NULL) không giới hạn trên cột đó"],"explain":"Khóa chính (Primary Key) là định danh duy nhất cho từng bản ghi trong bảng, đảm bảo tính toàn vẹn dữ liệu và không được trùng lặp hay mang giá trị NULL.","tip":"Primary Key đảm bảo tính duy nhất và toàn vẹn dữ liệu."},{"id":"r-m4-001","module":"m4","ref":"4.1","type":"recall","kind":"manual","q":"Bối cảnh dự án tổng hợp (scenario) được đề cập xoay quanh việc phân tích dữ liệu của công ty nào?","correct":"Công ty hàng không vũ trụ SpaceX","wrong":["Tập đoàn máy tính IBM","Cơ quan Hàng không Vũ trụ NASA","Tập đoàn công nghệ Microsoft"],"explain":"Dự án nghiên cứu tình huống phân tích dữ liệu các đợt phóng tàu vũ trụ thực tế của công ty SpaceX.","tip":"Dự án thực hành lớn xoay quanh dữ liệu phóng tên lửa của SpaceX."},{"id":"r-m4-002","module":"m4","ref":"4.1","type":"recall","kind":"manual","q":"Mục tiêu kỹ thuật cốt lõi trong dự án phân tích dữ liệu SpaceX là dự đoán điều gì?","correct":"Khả năng hạ cánh thành công của tầng 1 (first stage) tên lửa Falcon 9","wrong":["Quỹ đạo bay chính xác của vệ tinh nhân tạo Starlink","Thời gian cần thiết để chế tạo động cơ tên lửa Merlin","Tỷ lệ tiêu hao nhiên liệu oxy lỏng trong quá trình cất cánh"],"explain":"Mục tiêu trọng tâm của dự án là xây dựng mô hình dự báo tầng 1 (first stage) của tên lửa Falcon 9 có hạ cánh an toàn thành công hay không.","tip":"Mục tiêu: dự đoán khả năng hạ cánh thành công tầng 1 (first stage) Falcon 9."},{"id":"r-m4-003","module":"m4","ref":"4.1","type":"recall","kind":"manual","q":"Việc dự đoán khả năng hạ cánh thành công của tầng 1 tên lửa Falcon 9 mang lại ý nghĩa thực tiễn quan trọng nào cho doanh nghiệp?","correct":"Ước tính chi phí cho một lần phóng tên lửa","wrong":["Tự động hóa hoàn toàn việc lập trình hệ điều hành tàu con thoi","Xác định vị trí địa lý của bãi phóng tên lửa tiếp theo trên thế giới","Thay thế toàn bộ phi hành đoàn bằng trí tuệ nhân tạo"],"explain":"Tầng 1 chiếm phần lớn giá trị tên lửa; nếu hạ cánh và tái sử dụng thành công sẽ giảm mạnh chi phí, do đó dự đoán thành công giúp ước tính chính xác chi phí cho mỗi lần phóng.","tip":"Tái sử dụng tầng 1 giúp ước tính và tiết kiệm chi phí phóng."},{"id":"r-m4-004","module":"m4","ref":"4.2","type":"recall","kind":"manual","q":"Nền tảng IBM Watson Studio cung cấp môi trường tích hợp chuyên dùng để phát triển loại tài liệu/công cụ nào?","correct":"Jupyter Notebooks","wrong":["Hệ điều hành nhúng thời gian thực RTOS","Trình biên dịch mã máy C++ chuyên dụng","Phần mềm thiết kế đồ họa 3D CAD"],"explain":"IBM Watson Studio cung cấp môi trường đám mây tích hợp để lập trình và thực thi các Notebook (Jupyter Notebooks) trong khoa học dữ liệu.","tip":"Watson Studio là môi trường chạy Jupyter Notebook trên đám mây."},{"id":"r-m4-005","module":"m4","ref":"4.2","type":"recall","kind":"manual","q":"Trong các bước khởi tạo dự án trên IBM Watson Studio, dịch vụ đám mây nào được liên kết để lưu trữ tài nguyên và dữ liệu dự án?","correct":"Cloud Object Storage (COS)","wrong":["Elastic Block Storage (EBS)","Network File System (NFS)","Simple Notification Service (SNS)"],"explain":"IBM Watson Studio yêu cầu liên kết với dịch vụ Cloud Object Storage (lưu trữ đối tượng đám mây) để chứa các tệp dữ liệu, mã nguồn và mô hình.","tip":"Lưu trữ dự án Watson Studio bằng Cloud Object Storage."},{"id":"r-m4-006","module":"m4","ref":"4.2","type":"recall","kind":"manual","q":"Các bước chuẩn để khởi tạo một môi trường làm việc dự án trên IBM Watson Studio gồm những gì?","correct":"Đăng nhập IBM Cloud -> Tạo Project mới -> Thiết lập Cloud Object Storage -> Cấp phát môi trường lập trình","wrong":["Cài đặt L
