ed residuals","Maximize the R-squared value","Minimize the number of predictors","Maximize the coefficient of determination"],"answer":[0],"explanation":"**Đáp án đúng: Minimize the sum of squared residuals.** Phương pháp bình phương tối thiểu (OLS): $\\min\\sum(y_i-\\hat y_i)^2$.\n- Maximize R-squared / coefficient of determination: là hệ quả, không phải mục tiêu trực tiếp (và hai đáp án này thực chất giống nhau).\n- Minimize predictors: không phải mục tiêu."},{"id":210,"slide":228,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu trung bình","question":"What is the purpose of using polynomial regression?","options":["To model non-linear relationships between variables","To reduce overfitting in the model","To handle missing data effectively","To improve computational efficiency"],"answer":[0],"explanation":"**Đáp án đúng: To model non-linear relationships between variables.** Thêm các số hạng bậc cao để đường cong khớp dữ liệu phi tuyến.\n- Reduce overfitting: ngược lại, bậc cao dễ overfit.\n- Missing data, computational efficiency: không liên quan."},{"id":211,"slide":229,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu trung bình","question":"What is the purpose of Polynomial Regression in machine learning?","options":["Handling non-linear relationships between variables","Reducing model complexity","Handling missing values in data","Converting categorical variables into numerical form"],"answer":[0],"explanation":"**Đáp án đúng: Handling non-linear relationships between variables.** Mô hình vẫn tuyến tính theo hệ số nhưng dùng $x^2, x^3,...$ để bắt quan hệ cong.\n- Reducing complexity: ngược lại, tăng độ phức tạp.\n- Missing values, categorical: là việc tiền xử lý."},{"id":212,"slide":230,"topic":"Watson Assistant & Chatbot","section":"Câu trung bình","question":"What is the role of the \"Integrations\" feature in Watson Assistant?","options":["To deploy the chatbot to applications","To manage user authentication","To define the conversational flow","To handle user input validation"],"answer":[0],"explanation":"**Đáp án đúng: To deploy the chatbot to applications.** Integrations kết nối chatbot với kênh như Facebook, Slack, web chat.\n- Authentication, conversational flow, input validation: do phần khác (dialog, webhook) đảm nhiệm."},{"id":213,"slide":231,"topic":"Tối ưu mô hình (CV, GridSearch, Pipeline)","section":"Câu trung bình","question":"What is the primary goal of using cross-validation in machine learning?","options":["To improve model training time","To make the model fit the training data perfectly","To estimate the performance of a model on an independent dataset","To reduce the number of features in the dataset"],"answer":[2],"explanation":"**Đáp án đúng: To estimate the performance of a model on an independent dataset.** Cross-validation chia dữ liệu thành các fold để ước lượng khả năng khái quát hóa.\n- Improve training time: không, còn tốn thời gian hơn.\n- Fit perfectly: gây overfitting.\n- Reduce features: là feature selection."},{"id":214,"slide":232,"topic":"Deep Learning (TensorFlow, CNN)","section":"Câu trung bình","question":"What is the primary use of the model.evaluate() function in TensorFlow?","options":["Compiling the model with optimizer","Training the model on training data","Initializing the neural network weights","Evaluating the model performance on test data"],"answer":[3],"explanation":"**Đáp án đúng: Evaluating the model performance on test data.** `model.evaluate()` trả về loss và metric trên tập kiểm tra.\n- Compiling: `compile()`.\n- Training: `fit()`.\n- Initializing weights: không phải chức năng này."},{"id":216,"slide":234,"topic":"Tối ưu mô hình (CV, GridSearch, Pipeline)","section":"Câu trung bình","question":"What is the purpose of grid search in machine learning?","options":["To search for the best hyperparameters","To search for the best features","To search for the best model","To search for the best dataset"],"answer":[0],"explanation":"**Đáp án đúng: To search for the best hyperparameters.** Grid search duyệt toàn bộ lưới tổ hợp siêu tham số, chọn tổ hợp có điểm cross-validation cao nhất.\n- Best features, model, dataset: không phải mục đích của grid search."},{"id":217,"slide":235,"topic":"Dash & Dashboard","section":"Câu trung bình","question":"What is the purpose of using sliders in dashboard design?","options":["Displaying images","Enabling user input for selecting values within a range","Embedding videos","Showing text data"],"answer":[1],"explanation":"**Đáp án đúng: Enabling user input for selecting values within a range.** Slider cho người dùng chọn giá trị trong khoảng, thường để lọc/điều khiển biểu đồ.\n- Images, videos, text: dùng thành phần khác."},{"id":218,"slide":236,"topic":"Thu thập dữ liệu (API, Web scraping)","section":"Câu trung bình","question":"What is the primary purpose of using the requests library in Python for web crawling?","options":["Scraping and parsing HTML/XML data","Data visualization","Machine learning modeling","Database management"],"answer":[0],"explanation":"**Đáp án đúng (theo bộ đề): Scraping and parsing HTML/XML data.**\n- Data visualization, Machine learning modeling, Database management: không liên quan.\nLưu ý: `requests` chỉ gửi HTTP request và nhận response; việc parse HTML/XML là của BeautifulSoup/lxml. Đáp án chính xác hơn là \"gửi HTTP request để lấy nội dung\", nhưng không có trong lựa chọn."},{"id":219,"slide":237,"topic":"Watson Assistant & Chatbot","section":"Câu trung bình","question":"What is the primary purpose of using Watson Natural Language Understanding API?","options":["Translating text between languages","Analyzing sentiment in text data","Extracting entities from text","Understanding and processing textual content"],"answer":[3],"explanation":"**Đáp án đúng: Understanding and processing textual content.** NLU là dịch vụ tổng quát phân tích văn bản, gồm sentiment, entities, keywords.\n- Translating: Language Translator.\n- Sentiment analysis, Extracting entities: chỉ là một phần chức năng của NLU nên đáp án tổng quát là đúng nhất."},{"id":220,"slide":238,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu trung bình","question":"What do the points in a residual plot represent?","options":["Difference between observed and predicted values","Predicted values from the regression model with given parameters","Actual observed values","Outliers in the dataset"],"answer":[0],"explanation":"**Đáp án đúng: Difference between observed and predicted values.** Mỗi điểm trong residual plot là phần dư $e=y-\\hat y$, vẽ theo giá trị dự đoán hoặc biến độc lập.\n- Predicted values, Actual values: không phải đại lượng được vẽ.\n- Outliers: chỉ là những điểm có residual lớn bất thường."},{"id":221,"slide":239,"topic":"Pandas & xử lý dữ liệu","section":"Câu trung bình","question":"What does Min-Max Scaling do to the data?","options":["Scales data to a fixed range, often between 0 and 1","Shifts the mean to zero and scales to unit variance","Normalizes data based on the median and interquartile range","Transforms data using the natural logarithm"],"answer":[0],"explanation":"**Đáp án đúng: Scales data to a fixed range, often between 0 and 1.** $x'=\\frac{x-x_{min}}{x_{max}-x_{min}}$.\n- Mean 0 và unit variance: Z-score.\n- Median và IQR: Robust Scaling.\n- Natural logarithm: Log Transformation."},{"id":222,"slide":240,"topic":"Tối ưu mô hình (CV, GridSearch, Pipeline)","section":"Câu trung bình","question":"What does the method fit_transform() in Sklearn typically do?","options":["Fits the model to the training data","Transforms the training data","Fits the model and transforms the training data simultaneously","None of the above"],"answer":[2],"explanation":"**Đáp án đúng: Fits the model and transforms the training data simultaneously.** `fit_transform()` học tham số (mean, std...) và biến đổi dữ liệu trong một bước.\n- Chỉ fit hoặc chỉ transform: là `fit()` và `transform()` riêng lẻ.\nMẹo nhớ: Dùng `fit_transform` cho train, chỉ `transform` cho test."},{"id":223,"slide":241,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu trung bình","question":"What does the order parameter in regplot represent?","options":["Control the order of polynomial regression","Adjusts the size of the markers","Controls the order of the markers in legend","Changes the color of the regression line"],"answer":[0],"explanation":"**Đáp án đúng: Control the order of polynomial regression.** `sns.regplot(..., order=2)` khớp đa thức bậc 2.\n- Marker size: `scatter_kws`.\n- Legend order: không liên quan.\n- Line color: `line_kws`."},{"id":224,"slide":242,"topic":"Matplotlib & Seaborn","section":"Câu trung bình","question":"What does the subplot() function in Matplotlib allow you to do?","options":["Create multiple plots within a single figure","Change the background color of the plot","Adjust the size of the markers in a scatter plot","Remove ticks from the plot axis"],"answer":[0],"explanation":"**Đáp án đúng: Create multiple plots within a single figure.** `plt.subplot()`/`plt.subplots()` chia figure thành lưới nhiều axes.\n- Background color, marker size, ticks: do hàm/tham số khác điều khiển."},{"id":225,"slide":243,"topic":"Folium & bản đồ","section":"Câu trung bình","question":"What does the folium.Circle() function do in Folium?","options":["Creates a scatter plot on the map","Adds circles with varying radius to the map","Generates a choropleth map","Plots line segments on the map"],"answer":[1],"explanation":"**Đáp án đúng: Adds circles with varying radius to the map.** `folium.Circle()` vẽ hình tròn bán kính tính bằng mét trên bản đồ.\n- Scatter plot, choropleth, line segments: là `CircleMarker`/`Choropleth`/`PolyLine`."},{"id":226,"slide":244,"topic":"Folium & bản đồ","section":"Câu trung bình","question":"What does a choropleth map in Folium represent?","options":["Geographical locations with clustered markers","Geographical areas colored or shaded based on data values","Density distribution of data points on a map","Polyline connecting different locations"],"answer":[1],"explanation":"**Đáp án đúng: Geographical areas colored or shaded based on data values.** Tô màu theo vùng (quốc gia, bang) dựa trên giá trị số.\n- Clustered markers: `MarkerCluster`.\n- Density: `HeatMap`.\n- Polyline: `PolyLine`."},{"id":227,"slide":245,"topic":"Deep Learning (TensorFlow, CNN)","section":"Câu trung bình","question":"What does the softmax activation function do in the output layer of a multi-class classification model?","options":["Calculate the derivative of the activation function","Converts logits into a probability distribution over multiple classes","Applies a threshold for binary classification","Normalizes input features to zero mean and unit variance"],"answer":[1],"explanation":"**Đáp án đúng: Converts logits into a probability distribution over multiple classes.** $\\text{softmax}(z_i)=\\frac{e^{z_i}}{\\sum_j e^{z_j}}$, tổng xác suất bằng 1.\n- Threshold nhị phân: sigmoid.\n- Normalize đầu vào: scaling/BatchNorm.\n- Đạo hàm: không phải chức năng."},{"id":228,"slide":246,"topic":"Deep Learning (TensorFlow, CNN)","section":"Câu trung bình","question":"What does the softmax activation function do in the output layer of a classification model?","options":["Applies a threshold for binary classification","Maps values to probabilities for multiple classes","Normalizes the output values","Calculates the derivative of the activation function"],"answer":[1],"explanation":"**Đáp án đúng: Maps values to probabilities for multiple classes.** Softmax chuyển điểm số đầu ra thành xác suất đa lớp.\n- Threshold binary: sigmoid.\n- Normalizes output values: mơ hồ, chưa nêu đúng là xác suất.\n- Derivative: không phải chức năng."},{"id":229,"slide":247,"topic":"Tối ưu mô hình (CV, GridSearch, Pipeline)","section":"Câu trung bình","question":"What does the parameter cv represent in cross-validation techniques?","options":["Complexity value","Cross-validation score","Number of folds or cross-validation iterations","Regularization parameter"],"answer":[2],"explanation":"**Đáp án đúng: Number of folds or cross-validation iterations.** `cv=5` nghĩa là chia 5 fold.\n- Complexity value, Cross-validation score, Regularization parameter: không phải ý nghĩa của `cv`."},{"id":230,"slide":248,"topic":"Biểu đồ & trực quan hoá","section":"Câu trung bình","question":"What does the bins parameter in pandas.hist() control?","options":["Number of bins in the histogram","Width of each bar in the histogram","Number of rows in the histogram","Size of the figure for the histogram"],"answer":[0],"explanation":"**Đáp án đúng: Number of bins in the histogram.** `df.hist(bins=20)` quyết định số khoảng chia giá trị.\n- Width của mỗi cột: hệ quả gián tiếp.\n- Number of rows, figure size: là `figsize`, không phải `bins`."},{"id":231,"slide":249,"topic":"Thu thập dữ liệu (API, Web scraping)","section":"Câu trung bình","question":"What does the requests.get() function in Python's requests library do?","options":["Sends a POST request","Sends a GET request to a specified URL","Retrieves data from a database","Parses HTML content"],"answer":[1],"explanation":"**Đáp án đúng: Sends a GET request to a specified URL.** `requests.get(url)` trả về đối tượng Response.\n- POST: `requests.post()`.\n- Database: không liên quan.\n- Parse HTML: BeautifulSoup."},{"id":233,"slide":251,"topic":"Tối ưu mô hình (CV, GridSearch, Pipeline)","section":"Câu trung bình","question":"What does the PolynomialFeatures class in Scikit-learn do?","options":["Computes polynomial transformations of features","Performs feature selection","Generates new features based on interaction terms","Scales the features in the dataset"],"answer":[0],"explanation":"**Đáp án đúng: Computes polynomial transformations of features.** `PolynomialFeatures(degree=2)` sinh các đặc trưng $x, x^2$ và cả số hạng tương tác.\n- Feature selection: `SelectKBest`...\n- Scaling: `StandardScaler`/`MinMaxScaler`.\n- Interaction terms: chỉ là một phần kết quả."},{"id":234,"slide":252,"topic":"Folium & bản đồ","section":"Câu trung bình","question":"What does the Choropleth function in Folium enable users to do?","options":["Create color-coded geographical maps","Generate regions on the map with different percentages.","Add multiple markers to a map based on data values","Draw circles of varying sizes on the map"],"answer":[0],"explanation":"**Đáp án đúng: Create color-coded geographical maps.** `folium.Choropleth` tô màu vùng theo dữ liệu.\n- Regions with percentages: diễn đạt hẹp.\n- Markers: `Marker`.\n- Circles: `Circle`/`CircleMarker`."},{"id":235,"slide":253,"topic":"Folium & bản đồ","section":"Câu trung bình","question":"What type of map can be generated using Folium's CircleMarker() function?","options":["Heatmap","Scatter plot","Choropleth map","Markers with specified radius on the map"],"answer":[3],"explanation":"**Đáp án đúng: Markers with specified radius on the map.** `CircleMarker` vẽ chấm tròn có bán kính tính bằng pixel.\n- Heatmap: `HeatMap`.\n- Scatter plot: không là loại bản đồ riêng.\n- Choropleth: tô màu vùng."},{"id":236,"slide":254,"topic":"Pandas & xử lý dữ liệu","section":"Câu trung bình","question":"What task does the method value_counts perform?","options":["get total of data except nan value","get number row of data","return counts of unique values","return total of numeric"],"answer":[2],"explanation":"**Đáp án đúng: return counts of unique values.** `Series.value_counts()` đếm số lần xuất hiện của mỗi giá trị duy nhất.\n- Total except NaN: giống `count()`.\n- Number of rows: `len()`/`shape`.\n- Total of numeric: `sum()`."},{"id":237,"slide":255,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu trung bình","question":"When would you choose polynomial regression over linear regression?","options":["When the relationship between variables is non-linear","When the relationship between variables is linear","When there are only two variables","When there is no correlation between variables"],"answer":[0],"explanation":"**Đáp án đúng: When the relationship between variables is non-linear.** Hồi quy đa thức khớp đường cong khi đường thẳng không đủ.\n- Linear relationship: dùng linear regression.\n- Only two variables, no correlation: không phải tiêu chí chọn."},{"id":238,"slide":256,"topic":"Watson Assistant & Chatbot","section":"Câu trung bình","question":"When using Watson Assistant, what is the purpose of defining intents?","options":["Identifying specific entities in user input","Generating small talk responses","Understanding the purpose or goal of user input","Authenticating user access"],"answer":[2],"explanation":"**Đáp án đúng: Understanding the purpose or goal of user input.** Intent biểu diễn ý định (ví dụ đặt vé, hỏi giờ).\n- Identifying entities: là entities.\n- Small talk, authentication: không phải vai trò của intents."},{"id":239,"slide":257,"topic":"Watson Assistant & Chatbot","section":"Câu trung bình","question":"How is the Watson Speech-to-Text API typically used in a real-time scenario?","options":["By transcribing streaming audio in real-time","By converting text into speech in real-time","By analyzing text data for sentiment","By processing pre-recorded audio files"],"answer":[0],"explanation":"**Đáp án đúng: By transcribing streaming audio in real-time.** Speech-to-Text hỗ trợ WebSocket để chuyển giọng nói luồng thành văn bản tức thời.\n- Text to speech: Text-to-Speech.\n- Sentiment: NLU.\n- Pre-recorded audio: chế độ batch, không phải real-time."},{"id":240,"slide":258,"topic":"Thống kê","section":"Câu trung bình","question":"How is a skewed distribution represented in a box plot?","options":["Asymmetrical lengths of whiskers","Equal lengths of whiskers","Symmetrical lengths of whiskers","The box and whiskers have the same width"],"answer":[0],"explanation":"**Đáp án đúng: Asymmetrical lengths of whiskers.** Phân phối lệch làm một whisker dài hơn, median lệch khỏi giữa hộp.\n- Equal/symmetrical whiskers: dấu hiệu phân phối đối xứng.\n- Same width: không liên quan."},{"id":241,"slide":259,"topic":"Folium & bản đồ","section":"Câu trung bình","question":"How is a basic map created in Folium?","options":["By calling the Map() function","There's no direct method to create a basic map","Using the BaseMap() function","Utilizing the create_map() method"],"answer":[0],"explanation":"**Đáp án đúng: By calling the Map() function.** `folium.Map(location=[lat, lon], zoom_start=10)` tạo bản đồ cơ bản.\n- BaseMap(), create_map(): không tồn tại trong Folium."},{"id":242,"slide":260,"topic":"Deep Learning (TensorFlow, CNN)","section":"Câu trung bình","question":"How does TensorFlow help in optimizing model training?","options":["By automatically adjusting learning rates","By providing pre-trained models","By implementing various optimization algorithms","By reducing the number of layers in the model"],"answer":[2],"explanation":"**Đáp án đúng: By implementing various optimization algorithms.** TensorFlow/Keras cung cấp SGD, Adam, RMSprop... để tối ưu trọng số.\n- Auto adjust learning rates: chỉ một số optimizer/callback.\n- Pre-trained models: hỗ trợ khác.\n- Reduce layers: không phải vai trò của TensorFlow."},{"id":243,"slide":261,"topic":"Watson Assistant & Chatbot","section":"Câu trung bình","question":"How is the webhook typically configured in Watson Assistant to connect to a DB2 database?","options":["By providing the webhook endpoint URL in the webhook settings","By specifying the SQL queries directly in the webhook settings","By embedding the database credentials in the chatbot responses","By creating a separate webhook for each database query"],"answer":[0],"explanation":"**Đáp án đúng: By providing the webhook endpoint URL in the webhook settings.** Watson gọi tới URL của dịch vụ trung gian, dịch vụ này truy vấn DB2.\n- SQL trực tiếp trong settings, nhúng credential vào phản hồi: không an toàn hoặc không hỗ trợ.\n- Webhook riêng cho từng query: không cần thiết."},{"id":244,"slide":262,"topic":"Tối ưu mô hình (CV, GridSearch, Pipeline)","section":"Câu trung bình","question":"How does GridSearchCV in Scikit-learn determine the best hyperparameters for a model?","options":["By trying all possible combinations of hyperparameters","By randomly selecting hyperparameters","By using gradient descent optimization","By relying on default hyperparameters"],"answer":[0],"explanation":"**Đáp án đúng: By trying all possible combinations of hyperparameters.** `GridSearchCV` duyệt toàn bộ lưới, đánh giá bằng cross-validation, chọn tổ hợp tốt nhất.\n- Random: `RandomizedSearchCV`.\n- Gradient descent: không dùng.\n- Default: không tuning."},{"id":245,"slide":263,"topic":"Matplotlib & Seaborn","section":"Câu trung bình","question":"How can you add a legend to the pie chart created using plot(kind='pie')?","options":["Legends are added automatically","legend=True","add_legend()","Legends cannot be added to pie charts"],"answer":[1],"explanation":"**Đáp án đúng: legend=True.** `df.plot(kind='pie', y='col', legend=True)` hiển thị chú giải.\n- add_legend(): không có trong pandas plot.\n- Pie chart có thể thêm legend, nên hai đáp án còn lại sai.\nLưu ý: Pie chart không tự động có legend theo mặc định."},{"id":246,"slide":265,"topic":"Python cơ bản & NumPy","section":"Câu trung bình","question":"A teacher has the students' grades stored in an array. The teacher is evaluating the mean of each student's grade and dropping the lowest grade for the year. The array is: grades = np.array([100, 30, 77, 20, 99, 100]). What code will produce the mean grade and the lowest grade from the array?","options":["grades = grades.mean(), min()","grades = mean(), min()","grades = grades.mean() and lowest_grade = grades.low()","grades = grades.mean() and lowest_grade = grades.min()"],"answer":[0],"explanation":"**Đáp án đúng (theo bộ đề): grades = grades.mean(), min().**\n- grades = mean(), min(): `mean` và `min` chưa được gọi qua array.\n- Hai đáp án còn lại dùng `.low()` không tồn tại.\nLưu ý: Về cú pháp, đáp án đúng nên là `grades.mean()` và `grades.min()`; đáp án gần nhất với ý đó là đáp án cuối (`grades.mean()` and `lowest_grade = grades.min()`). Bộ đề có vẻ chưa chính xác."},{"id":247,"slide":266,"topic":"Python cơ bản & NumPy","section":"Câu trung bình","question":"An analyst on your team is forgetful about closing a file after they read the data. What can the analyst do to access the files needed without worrying about leaving a file unintentionally open?","options":["Use a WITH statement in place of the open command","Use a WITH statement with the open command","Use the CLOSE statement prior to the open command","Use the CLOSE statement in place of the open command"],"answer":[1],"explanation":"**Đáp án đúng: Use a WITH statement with the open command.** `with open(path) as f:` là context manager, tự đóng file khi thoát khối.\n- WITH in place of open: thiếu hàm mở file.\n- CLOSE statement: không có statement CLOSE; đóng file bằng `f.close()` và phải nhớ gọi."},{"id":248,"slide":267,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu trung bình","question":"A researcher fits a polynomial regression model to predict the price of a house based on its size. If the equation of the regression line obtained is:\nPrice = 100000 + 5000 × Size − 100 × Size²\nWhat does the coefficient of Size² (-100) indicate?","options":["The effect of size on price is negative.","The effect of size on price is positive.","The effect of size on price is linear.","The effect of size on price is non-linear."],"answer":[3],"explanation":"**Đáp án đúng: The effect of size on price is non-linear.** Có số hạng $\\text{Size}^2$ nên quan hệ là đường cong parabol; hệ số âm cho thấy đường cong úp (hiệu ứng giảm dần).\n- Negative, positive: tác động thay đổi theo Size, không cố định một dấu.\n- Linear: sai vì có số hạng bậc hai."},{"id":249,"slide":268,"topic":"Quy trình phân tích dữ liệu","section":"Câu trung bình","question":"A junior analyst collects data on the effects of a recent process change. The effects are mostly unfavorable. Where should the focus on rectifying these effects lie?","options":["The individual effects","The source of the effects - the problem itself","The stakeholders involved with the process change","The original project manager of the process change"],"answer":[1],"explanation":"**Đáp án đúng: The source of the effects - the problem itself.** Cần khắc phục nguyên nhân gốc thay vì từng hậu quả.\n- Individual effects: chỉ xử lý triệu chứng.\n- Stakeholders, project manager: không phải trọng tâm khắc phục."},{"id":250,"slide":269,"topic":"Quy trình phân tích dữ liệu","section":"Câu trung bình","question":"A development project has missed several deadlines and appears they will be missing the next one. A new project leader has been brought in. What would be the first step to get the project on track?","options":["Perform a root cause analysis","Assess individual performance by performing interviews","Evaluate the efficiency of the platforms being used","Make a pie chart to identify a new timeline"],"answer":[0],"explanation":"**Đáp án đúng: Perform a root cause analysis.** Bước đầu là tìm nguyên nhân thật sự khiến chậm tiến độ trước khi hành động.\n- Phỏng vấn từng cá nhân: có thể quy lỗi sai chỗ.\n- Đánh giá nền tảng: giả định nguyên nhân sớm.\n- Pie chart timeline: không giúp tìm nguyên nhân."},{"id":251,"slide":270,"topic":"Dash & Dashboard","section":"Câu trung bình","question":"In Plotly Dash, what is the primary function of a callback?","options":["Managing user authentication","Handling HTTP requests","Updating components based on user interaction","Sending emails"],"answer":[2],"explanation":"**Đáp án đúng: Updating components based on user interaction.** Callback liên kết `Input` với `Output`, tự chạy khi đầu vào đổi để cập nhật thành phần.\n- Authentication, HTTP requests, emails: không phải vai trò callback."},{"id":252,"slide":271,"topic":"Tối ưu mô hình (CV, GridSearch, Pipeline)","section":"Câu trung bình","question":"In grid search, what does the 'grid' refer to?","options":["A set of potential model parameters","A set of potential input features","A set of potential output predictions","A set of potential model evaluation metrics"],"answer":[0],"explanation":"**Đáp án đúng: A set of potential model parameters.** Grid là tập các giá trị siêu tham số cần thử, ví dụ `{'C':[1,10], 'kernel':['linear','rbf']}`.\n- Input features, output predictions, evaluation metrics: không phải grid."},{"id":253,"slide":272,"topic":"Pandas & xử lý dữ liệu","section":"Câu trung bình","question":"In which scenario is Log Transformation often applied for normalization?","options":["When data has a skewed distribution","When data has a linear distribution","When data has a normal distribution","When data has missing values"],"answer":[0],"explanation":"**Đáp án đúng: When data has a skewed distribution.** Log transform nén giá trị lớn, giảm độ lệch, đưa phân phối gần chuẩn hơn.\n- Linear, normal distribution: không cần.\n- Missing values: xử lý bằng imputation."},{"id":254,"slide":273,"topic":"Watson Assistant & Chatbot","section":"Câu trung bình","question":"In Watson Assistant, what are entities used for?","options":["Handling user authentication","Identifying and extracting specific information from user input","Redirecting users to external websites","Generating small talk responses"],"answer":[1],"explanation":"**Đáp án đúng: Identifying and extracting specific information from user input.** Entity như ngày, địa danh, số lượng.\n- Authentication, redirect, small talk: không phải vai trò entity."},{"id":255,"slide":274,"topic":"Dash & Dashboard","section":"Câu trung bình","question":"In Dash, what is the function of a callback function?","options":["Displaying data","Filtering data","Modifying data","Linking components and updating the layout"],"answer":[3],"explanation":"**Đáp án đúng (theo bộ đề): Linking components and updating the layout.** Callback nối `Input` và `Output` và cập nhật thành phần giao diện.\n- Displaying, Filtering, Modifying data: là việc cụ thể bên trong hàm, không phải chức năng của callback."},{"id":256,"slide":275,"topic":"Biểu đồ & trực quan hoá","section":"Câu trung bình","question":"In a heatmap, what does the color intensity signify?","options":["Strength of correlations","Frequency of occurrence","Magnitude of a single variable","Range of values in the dataset"],"answer":[0],"explanation":"**Đáp án đúng: Strength of correlations.** Trong heatmap tương quan, màu đậm/nhạt thể hiện mức độ và chiều của hệ số tương quan.\n- Frequency, Magnitude of a single variable, Range: phụ thuộc loại heatmap, không phải ý nghĩa chuẩn của câu hỏi."},{"id":257,"slide":276,"topic":"Watson Assistant & Chatbot","section":"Câu trung bình","question":"In Watson Assistant, what is a dialog node used for?","options":["Controlling the flow of the conversation","Representing user messages","Defining intents","Storing user data"],"answer":[0],"explanation":"**Đáp án đúng: Controlling the flow of the conversation.** Dialog node là các khối điều kiện/phản hồi nối với nhau, quyết định assistant trả lời gì và đi tiếp nhánh nào.\n- Representing user messages: tin nhắn người dùng là input, không phải node.\n- Defining intents: intents được định nghĩa riêng trong phần Intents.\n- Storing user data: dữ liệu được lưu trong context variables, không phải chức năng chính của node."},{"id":258,"slide":277,"topic":"Thống kê","section":"Câu trung bình","question":"In a Chi-Square test, what does a p-value less than 0.05 suggest?","options":["Reject the null hypothesis","Fail to reject the null hypothesis","Insufficient evidence to conclude","No correlation exists"],"answer":[0],"explanation":"**Đáp án đúng: Reject the null hypothesis.** p-value < 0.05 (mức ý nghĩa thường dùng) nghĩa là có đủ bằng chứng bác bỏ $H_0$ (không có liên hệ/độc lập giữa hai biến).\n- Fail to reject: xảy ra khi p-value > 0.05.\n- Insufficient evidence: ứng với p-value lớn.\n- No correlation exists: Chi-Square kiểm tra tính độc lập của biến phân loại, và p nhỏ cho thấy có liên hệ, không phải không có."},{"id":260,"slide":279,"topic":"Watson Assistant & Chatbot","section":"Câu trung bình","question":"In Watson Assistant, what is the purpose of the \"Slots\" feature in dialog nodes?","options":["To capture information from the user's input","To represent empty spaces in the conversation","To reserve memory space for storing user data","To define the color scheme of the chatbot interface"],"answer":[0],"explanation":"**Đáp án đúng: To capture information from the user's input.** Slots cho phép một dialog node thu thập nhiều thông tin cần thiết (ví dụ ngày, địa điểm) và tự hỏi lại nếu còn thiếu.\n- Empty spaces in the conversation: không có nghĩa này.\n- Reserve memory space: không liên quan đến bộ nhớ hệ thống.\n- Color scheme: giao diện không do slots quyết định."},{"id":261,"slide":280,"topic":"Phân loại & đánh giá","section":"Câu trung bình","question":"You are training a Decision Tree classifier on a dataset X_train containing numerical features and y_train containing corresponding binary target labels. You decide to set the min_samples_split parameter to 10. What does this parameter control in the construction of the decision tree?","options":["One node can split only at least 10 samples.","The minimum depth of the tree is set to 10.","There must be more than 10 nodes in each depth of tree","Total number of nodes in tree must be greater than 10"],"answer":[0],"explanation":"**Đáp án đúng: One node can split only at least 10 samples.** `min_samples_split=10` nghĩa là một node chỉ được tách tiếp nếu chứa ít nhất 10 mẫu, nhằm hạn chế overfitting.\n- Minimum depth = 10: độ sâu do `max_depth` điều khiển (và là mức tối đa, không phải tối thiểu).\n- Hơn 10 node mỗi tầng / tổng số node > 10: không có tham số nào ràng buộc như vậy.\n\nLưu ý: phát biểu đáp án nên hiểu là node cần có ít nhất 10 mẫu mới được tách."},{"id":262,"slide":281,"topic":"Phân loại & đánh giá","section":"Câu trung bình","question":"You are training an SVC classifier on a dataset with 1000 samples and 20 features. You decide to use grid search to find the best C value for the SVC classifier. You specify a range of C values to search over, including [0.1, 1, 10, 100, 1000]. You perform grid search with 5-fold cross-validation to find the best C value. After grid search, you find that the best C value is 10. What does this indicate about the regularization strength of the SVC classifier?","options":["Low regularization strength","High regularization strength","No regularization applied","No conclusion can be drawn from the best C value"],"answer":[0],"explanation":"**Đáp án đúng: Low regularization strength (theo bộ đề).** Trong SVC, $C$ tỉ lệ nghịch với độ mạnh regularization: $C$ lớn thì phạt lỗi phân loại nặng, regularization yếu.\n- High regularization strength: ứng với $C$ rất nhỏ.\n- No regularization applied: $C$ hữu hạn vẫn còn regularization.\n- No conclusion: sai vì $C$ cho biết xu hướng regularization.\n\nLưu ý: $C=10$ nằm giữa khoảng thử 0.1 đến 1000 và so với mặc định $C=1$ là regularization khá yếu, nên đáp án bộ đề chấp nhận được nhưng mang tính tương đối."},{"id":263,"slide":282,"topic":"Tối ưu mô hình (CV, GridSearch, Pipeline)","section":"Câu trung bình","question":"You are performing grid search to find the best C value for an SVC classifier. You specify the parameter grid as follows: param_grid = {'C': [0.01, 0.1, 1, 10, 100]}. After performing grid search, you find that the best C value is 0.01. What does this suggest about the dataset and the model's complexity?","options":["Because the dataset is highly complex, a lower C value is preferred.","Because the dataset is simple, a lower C value is preferred.","Because the dataset is simple, a higher C value is preferred.","The choice of C value does not affect the model's complexity."],"answer":[1],"explanation":"**Đáp án đúng: Because the dataset is simple, a lower C value is preferred.** $C=0.01$ là giá trị nhỏ nhất, tức regularization mạnh, mô hình đơn giản, biên rộng. Điều này gợi ý dữ liệu không cần mô hình phức tạp.\n- Dataset phức tạp thì lower C: sai, dữ liệu phức tạp thường cần $C$ lớn hơn.\n- Dataset đơn giản thì higher C: ngược lại với kết quả grid search.\n- C không ảnh hưởng độ phức tạp: sai, C kiểm soát trade-off bias-variance."},{"id":264,"slide":283,"topic":"Dash & Dashboard","section":"Câu trung bình","question":"What is the primary purpose of using the add_trace() function in Dash?","options":["Adding annotations to graphs","Adding multiple traces to a single plot","Creating dropdown menus","Generating choropleth maps"],"answer":[1],"explanation":"add_trace() là phương thức của Plotly được sử dụng trong Dash để thêm một hoặc nhiều trace (đường, cột, điểm, vùng...) vào cùng một Figure, giúp hiển thị nhiều tập dữ liệu trên một biểu đồ."},{"id":265,"slide":284,"topic":"Thu thập dữ liệu (API, Web scraping)","section":"Câu trung bình","question":"In the context of web scraping, what does the term \"HTML parsing\" refer to?","options":["Identifying and extracting specific elements from a webpage","Converting HTML documents into plain text","Analyzing the structure of a website's database","Scraping data from API endpoints"],"answer":[0],"explanation":"HTML parsing là quá trình phân tích cấu trúc HTML của một trang web để tìm và lấy các thành phần như tiêu đề, bảng, hình ảnh, liên kết hoặc nội dung văn bản bằng các thư viện như BeautifulSoup hoặc lxml."},{"id":266,"slide":285,"topic":"Quy trình phân tích dữ liệu","section":"Câu trung bình","question":"Which statement about exploratory data analysis (EDA) is correct?","options":["EDA is performed only after model training","EDA focuses on understanding dataset structure and patterns","EDA is optional and usually skipped","EDA is the same as feature engineering"],"answer":[1],"explanation":"EDA được sử dụng để khám phá dữ liệu, giúp phát hiện xu hướng, mối quan hệ, outliers, dữ liệu thiếu và các đặc điểm quan trọng của dataset. EDA không phải là feature engineering và không chỉ được thực hiện sau khi huấn luyện mô hình."},{"id":267,"slide":287,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu dài","question":"What is the meaning of Mean Squared Error (MSE)?","options":["find the difference between the actual values and the predicted values then square it.","find the difference between the predictor values and the predicted values then square it.","find the difference between the intercept values and the predicted values then square it.","find the difference between the slope values and the predicted values then square it."],"answer":[0],"explanation":"**Đáp án đúng: find the difference between the actual values and the predicted values then square it.** $MSE=\\frac{1}{n}\\sum (y_i-\\hat{y}_i)^2$, tức trung bình bình phương sai khác giữa giá trị thực và giá trị dự đoán.\n- Các lựa chọn còn lại dùng predictor, intercept hoặc slope thay cho giá trị thực: đây không phải là sai số.\n\nMẹo nhớ: Mean (trung bình) của Squared (bình phương) Error (sai số thực - dự đoán)."},{"id":269,"slide":289,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu dài","question":"What is the primary purpose of Ridge Regression in machine learning?","options":["To reduce overfitting by adding a penalty term to the regression equation","To increase model complexity by introducing additional features","To maximize the coefficient of determination (R-squared)","To perform feature selection automatically"],"answer":[0],"explanation":"**Đáp án đúng: To reduce overfitting by adding a penalty term to the regression equation.** Ridge (L2) cộng $\\alpha\\sum w_j^2$ vào hàm chi phí để thu nhỏ hệ số, giảm variance.\n- Increase model complexity: ngược mục đích.\n- Maximize R-squared: Ridge không tối ưu $R^2$ trực tiếp.\n- Automatic feature selection: đó là đặc trưng của Lasso (L1), Ridge không đưa hệ số về đúng 0."},{"id":270,"slide":290,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu dài","question":"What is the primary difference between setting a high alpha in Ridge and in Lasso?","options":["In Ridge, high alpha reduces coefficients uniformly, while in Lasso, high alpha can set some coefficients to zero.","High alpha in Ridge increases coefficients, while in Lasso, it decreases them.","Both methods treat alpha similarly, making it impossible to distinguish their effects.","High alpha in Ridge makes the model prone to underfitting, while in Lasso, it increases overfitting.","None of the others."],"answer":[0],"explanation":"**Đáp án đúng: In Ridge, high alpha reduces coefficients uniformly, while in Lasso, high alpha can set some coefficients to zero.** Ridge (L2) co hệ số về gần 0 nhưng hiếm khi bằng 0; Lasso (L1) có thể đưa một số hệ số về đúng 0 nên chọn lọc đặc trưng.\n- High alpha in Ridge increases coefficients: sai, alpha lớn làm hệ số nhỏ lại.\n- Both treat alpha similarly: sai, hiệu ứng khác nhau.\n- Ridge underfitting, Lasso overfitting: alpha lớn đều dẫn đến underfitting."},{"id":271,"slide":291,"topic":"Watson Assistant & Chatbot","section":"Câu dài","question":"What role do intents and entities play in the context of Watson Assistant?","options":["Entities handle user authentication, while intents identify user goals.","Intents handle context variables, while entities extract specific information from user input.","Entities understand the purpose of user input, while intents extract specific information.","Intents identify user goals, while entities extract specific information from user input."],"answer":[3],"explanation":"**Đáp án đúng: Intents identify user goals, while entities extract specific information from user input.** Intent là mục đích của người dùng (ví dụ đặt vé), entity là chi tiết cụ thể (ngày, thành phố).\n- Entities handle authentication: sai.\n- Intents handle context variables: context variables là thành phần riêng.\n- Đáp án đảo vai trò intents và entities: sai."},{"id":272,"slide":292,"topic":"Pandas & xử lý dữ liệu","section":"Câu dài","question":"What task does the following line of code perform? df['price'].replace(np.nan, 100, inplace=True)","options":["replace the not a number values with 100 in the column 'price'","replace the not a text values with 100 in the column 'price'","add the not a number values with 100 in the column 'price'","add the not a null values with 100 in the column 'price'"],"answer":[0],"explanation":"**Đáp án đúng: replace the not a number values with 100 in the column 'price'.** `np.nan` là giá trị NaN (thiếu dữ liệu); `replace(np.nan, 100, inplace=True)` thay mọi NaN trong cột `price` bằng 100 ngay trên DataFrame.\n- not a text values: NaN không phải về kiểu text.\n- add ... values with 100: `replace` thay thế, không cộng thêm.\n- not a null values: sai thuật ngữ, và không phải thao tác cộng."},{"id":273,"slide":293,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu dài","question":"Which of the following is true regarding the penalty term in Ridge Regression?","options":["It penalizes large coefficients by adding their squares to the cost function","It penalizes small coefficients by subtracting their squares from the cost function","It penalizes features based on their order in the dataset","It penalizes features randomly to regularize the model"],"answer":[0],"explanation":"**Đáp án đúng: It penalizes large coefficients by adding their squares to the cost function.** Ridge thêm $\\alpha\\sum w_j^2$ vào hàm chi phí nên hệ số lớn bị phạt mạnh hơn.\n- Penalizes small coefficients by subtracting: sai, là cộng chứ không trừ, và phạt hệ số lớn.\n- Based on order in the dataset: thứ tự đặc trưng không liên quan.\n- Randomly: penalty có công thức xác định, không ngẫu nhiên."},{"id":274,"slide":294,"topic":"Watson Assistant & Chatbot","section":"Câu dài","question":"Which of these statements is true about the deployment of a chatbot application?","options":["You need to re-deploy your chatbot every time you change the dialog within Watson Assistant.","You don't need to re-deploy your chatbot every time you change the dialog within Watson Assistant.","You don't need to dispose your chatbot every time you change the content within Watson Assistant.","You don't need to re-deploy your chatbot every time you change the content within Watson Assistant."],"answer":[1],"explanation":"**Đáp án đúng: You don't need to re-deploy your chatbot every time you change the dialog within Watson Assistant.** Chatbot gọi Watson Assistant qua API, nên thay đổi dialog trong Watson có hiệu lực ngay mà không cần deploy lại ứng dụng.\n- Need to re-deploy: sai vì lý do trên.\n- Các lựa chọn dùng \"dispose\" hoặc \"content\": không đúng ngữ cảnh/thuật ngữ câu hỏi.\n\nLưu ý: lựa chọn \"content\" cũng có nội dung gần giống, nhưng đáp án bộ đề chọn \"dialog\" mới khớp câu hỏi."},{"id":276,"slide":296,"topic":"Matplotlib & Seaborn","section":"Câu dài","question":"Choose the one that best describes of Seaborn","options":["Seaborn is a Python visualization library based on scikit-learn","Seaborn can effectively increase the number of lines of code to create a plot","Seaborn is a Python visualization library that provides a high-level interface for drawing attractive statistical graphics","All answer is correct"],"answer":[2],"explanation":"**Đáp án đúng: Seaborn is a Python visualization library that provides a high-level interface for drawing attractive statistical graphics.** Seaborn xây dựng trên Matplotlib và tích hợp tốt với Pandas.\n- Based on scikit-learn: sai, nền tảng là Matplotlib.\n- Increase the number of lines of code: sai, Seaborn giúp code ngắn gọn hơn.\n- All answer is correct: sai vì có đáp án sai."},{"id":277,"slide":297,"topic":"Biểu đồ & trực quan hoá","section":"Câu dài","question":"Choose the one that best describes of Area chart","options":["It is commonly used to represent cumulated totals using numbers or percentages over time.","It is a type of plot which displays information as a series of data points called 'markers' connected by straight line segments.","It is a way of representing the frequency distribution of a variable.","It is commonly used to compare the values of a variable at a given point in time."],"answer":[0],"explanation":"**Đáp án đúng: It is commonly used to represent cumulated totals using numbers or percentages over time.** Area chart là line chart có tô vùng bên dưới, dùng để thể hiện tổng tích lũy theo thời gian.\n- Series of markers connected by straight lines: là line plot.\n- Frequency distribution of a variable: là histogram.\n- Compare values at a given point in time: là bar chart."},{"id":278,"slide":298,"topic":"Folium & bản đồ","section":"Câu dài","question":"Choose the best describes of Choropleth map","options":["A choropleth map is a thematic map in which areas are shaded in proportion to the measurement of the statistical variable being displayed on the map","A choropleth map is a thematic map in which areas are patterned in proportion to the measurement of the statistical variable being displayed on the map","A choropleth map is a thematic map in which areas are shaded or patterned in proportion to the measurement of the statistical variable being displayed on the map","None of the others"],"answer":[2],"explanation":"**Đáp án đúng: ... areas are shaded or patterned in proportion to the measurement of the statistical variable.** Choropleth map là bản đồ chủ đề, các vùng được tô màu hoặc tô hoa văn tỉ lệ với giá trị biến thống kê.\n- Chỉ shaded hoặc chỉ patterned: thiếu một cách biểu diễn nên chưa đầy đủ.\n- None of the others: sai vì có đáp án đúng.\n\nMẹo nhớ: Choropleth = tô màu theo vùng (ví dụ Folium `Choropleth`)."},{"id":279,"slide":299,"topic":"Biểu đồ & trực quan hoá","section":"Câu dài","question":"Choose the one that best describes of Bar chart","options":["It is a type of plot which displays information as a series of data points called 'markers' connected by straight line segments.","It is a way of representing the frequency distribution of a variable.","It is commonly used to compare the values of a variable at a given point in time.","It is a circular statistical graphic divided into slices to illustrate numerical proportion."],"answer":[2],"explanation":"**Đáp án đúng: It is commonly used to compare the values of a variable at a given point in time.** Bar chart so sánh giá trị giữa các nhóm/hạng mục.\n- Markers nối bằng đường thẳng: line plot.\n- Frequency distribution: histogram.\n- Circular graphic divided into slices: pie chart."},{"id":280,"slide":300,"topic":"Biểu đồ & trực quan hoá","section":"Câu dài","question":"Choose the one that best describes of Waffle chart","options":["It is a depiction of the frequency of different words in some textual data.","It is a circular statistical graphic divided into slices to illustrate numerical proportions.","It is a way of representing the frequency distribution of a variable.","It is an interesting visualization that is normally created to display progress toward goals."],"answer":[3],"explanation":"**Đáp án đúng: It is an interesting visualization that is normally created to display progress toward goals.** Waffle chart là lưới ô vuông, mỗi ô là một đơn vị, thường thể hiện tiến độ hoặc tỉ lệ so với mục tiêu.\n- Word frequency: word cloud.\n- Circular graphic with slices: pie chart.\n- Frequency distribution: histogram."},{"id":281,"slide":301,"topic":"Watson Assistant & Chatbot","section":"Câu dài","question":"In Watson Assistant, choose the best description of Dialog Skill?","options":["A dialog skill uses just Watson natural language processing to understand user questions and respond the answers.","A dialog skill uses just machine learning technologies to understand user questions and respond the answers.","A dialog skill uses Watson natural language processing and machine learning technologies to understand user questions and respond the answers.","None of the others"],"answer":[2],"explanation":"**Đáp án đúng: A dialog skill uses Watson natural language processing and machine learning technologies to understand user questions and respond the answers.** Dialog skill kết hợp NLP và machine learning để hiểu ý định, thực thể và dẫn dắt hội thoại.\n- Chỉ NLP hoặc chỉ machine learning: thiếu một thành phần.\n- None of the others: sai."},{"id":282,"slide":302,"topic":"Deep Learning (TensorFlow, CNN)","section":"Câu dài","question":"In TensorFlow, what is the purpose of the model.compile() function?","options":["Initializing the neural network weights","Defining the architecture of the neural network","Compiling the model with optimizer, loss function, and metrics","Evaluating the model performance"],"answer":[2],"explanation":"**Đáp án đúng: Compiling the model with optimizer, loss function, and metrics.** `model.compile()` cấu hình quá trình huấn luyện: optimizer, loss, metrics.\n- Initializing weights: thực hiện khi tạo layer/build model.\n- Defining architecture: dùng `Sequential` hoặc các layer.\n- Evaluating performance: dùng `model.evaluate()`."},{"id":283,"slide":303,"topic":"Watson Assistant & Chatbot","section":"Câu dài","question":"In Watson Assistant, what is an Intents? Choose the best answer","options":["Intents are purposes or goals that are expressed in a customer's input.","Intents is a container for the artifacts that define the flow of a conversation that your assistant can have with your customers","Intents is a Watson natural language processing service to understand user questions and respond the answers.","Intents are a collection of questions that users will ask the virtual assistant."],"answer":[0],"explanation":"**Đáp án đúng: Intents are purposes or goals that are expressed in a customer's input.** Intent biểu diễn mục đích của người dùng (ví dụ #order_pizza).\n- Container for artifacts defining the flow: mô tả skill/dialog.\n- Watson NLP service: không phải định nghĩa intent.\n- A collection of questions: các ví dụ câu hỏi chỉ là dữ liệu huấn luyện của một intent, không phải định nghĩa intent."},{"id":284,"slide":304,"topic":"Python cơ bản & NumPy","section":"Câu dài","question":"In the Python array for months of the year, a developer was asked to use the print command to display \"October\". When the developer ran the block, \"November\" was displayed instead. Assuming that the calendar months are consecutive, beginning in January, what is the most likely cause for this?","options":["The developer ran the code to display the value at the 11th place in the array.","The developer ran the code to display the value at the 10th place in the array.","Every month in the array was \"November\".","The OS changed, and the subprocess created the error."],"answer":[1],"explanation":"**Đáp án đúng: The developer ran the code to display the value at the 10th place in the array (theo bộ đề).** Python đánh chỉ số từ 0 nên January ở index 0, October ở index 9, November ở index 10; nhập 10 sẽ ra November.\n- 11th place: nếu hiểu là vị trí thứ 11 thì là December, hoặc index 11.\n- Every month is November: không hợp lý.\n- OS changed: không liên quan.\n\nLưu ý: cách diễn đạt mơ hồ; chính xác hơn là developer dùng index 10 (vị trí thứ 11 đếm từ 1)."},{"id":285,"slide":305,"topic":"Thống kê","section":"Câu dài","question":"In a survey of 500 individuals regarding their preferred mode of transportation to work (car, public transit, bicycle, walk), if the chi-square test yields a p-value of 0.001, what conclusion can be drawn regarding the association between gender and preferred mode of transportation?","options":["Men and Women might prefer different transportation types.","There is no association between gender and preferred mode of transportation.","The chi-square test is inconclusive.","The sample size is insufficient to perform the chi-square test."],"answer":[0],"explanation":"**Đáp án đúng: Men and Women might prefer different transportation types.** p-value = 0.001 < 0.05 nên bác bỏ $H_0$ (độc lập), tức có mối liên hệ thống kê giữa giới tính và phương tiện.\n- No association: ngược với kết quả.\n- Inconclusive: p-value nhỏ cho kết luận rõ.\n- Sample size insufficient: n = 500 là đủ."},{"id":286,"slide":306,"topic":"IBM DB2 & SQL","section":"Câu dài","question":"In IBM DB2, what is the significance of the SEPARATOR field in the LOAD DATA tab?","options":["It specifies the character used for delimiting columns in the input file.","It sets the primary key for the table.","It defines the data types of the columns in the input file.","It controls the loading process speed."],"answer":[0],"explanation":"**Đáp án đúng: It specifies the character used for delimiting columns in the input file.** Trường SEPARATOR trong Db2 LOAD DATA xác định ký tự phân tách cột (dấu phẩy, tab...).\n- Sets the primary key: thiết lập khi tạo bảng.\n- Defines data types: thực hiện ở bước ánh xạ cột.\n- Controls loading speed: không phải chức năng của SEPARATOR."},{"id":287,"slide":307,"topic":"Watson Assistant & Chatbot","section":"Câu dài","question":"Implementing a voice-based interface for Watson Assistant chatbots, there are three approaches. Choose the best answer","options":["Phone calls, Watson Speech to Text APIs and Text Agent with Watson.","Phone calls, Watson Text to Speech APIs and Voice Agent with Watson.","Phone calls, Watson Speech to Text - Text to Speech APIs and Voice Agent with Watson.","Phone calls, Watson Speech to Text - Text to Speech APIs and Text Agent with Watson."],"answer":[2],"explanation":"**Đáp án đúng: Phone calls, Watson Speech to Text - Text to Speech APIs and Voice Agent with Watson.** Giao diện giọng nói cần cả chuyển giọng nói thành văn bản (STT) và văn bản thành giọng nói (TTS), cùng Voice Agent.\n- Chỉ Speech to Text hoặc chỉ Text to Speech: thiếu một chiều.\n- Text Agent: dành cho kênh văn bản, không phải giọng nói."},{"id":288,"slide":308,"topic":"Pandas & xử lý dữ liệu","section":"Câu dài","question":"You want to filter the DataFrame df_customer to select male customers aged 40 or older (see dataset below). Which Pandas code snippet is equivalent to the SQL query: SELECT * FROM df_customer WHERE gender = 'M' AND age >= 40?\nimport pandas as pd\n# Create a DataFrame for customer information\ncustomer_data = {\n'customer_id': [1001, 1002, 1003, 1004, 1005],\n'name': ['Alice', 'Bob', 'Charlie', 'David', 'Emma'],\n'age': [30, 25, 35, 40, 45],\n'gender': ['F', 'M', 'M', 'M', 'F']\n}\ndf_customer = pd.DataFrame(customer_data)","options":["df_filtered = df_customer[(df_customer['gender'] == 'M') & (df_customer['age'] >= 40)]","df_filtered = df_customer[(df_customer['gender'] == 'M') && (df_customer['age'] >= 40)]","df_filtered = df_customer[df_customer['gender'] == 'M' & df_customer['age'] > 40]","df_filtered = df_customer[(df_customer['gender'] = 'M') AND (df_customer['age'] > 40)]"],"answer":[0],"explanation":"**Đáp án đúng: `df_customer[(df_customer['gender'] == 'M') & (df_customer['age'] >= 40)]`.** Pandas dùng `==` để so sánh, `&` cho AND theo phần tử, mỗi điều kiện đặt trong ngoặc; `>=` tương ứng `age >= 40`.\n- `&&`: không hợp lệ trong Python.\n- Thiếu ngoặc và dùng `> 40`: `&` có độ ưu tiên cao hơn so sánh nên lỗi, và `>` bỏ sót tuổi 40.\n- `=` và `AND`: cú pháp SQL, không phải Python.\n\nMẹo nhớ: Pandas dùng `&`, `|`, `~` và ngoặc quanh từng điều kiện."},{"id":289,"slide":309,"topic":"Thu thập dữ liệu (API, Web scraping)","section":"Câu dài","question":"You want to send a request to \"https://api.example.com/submit\" with JSON data {\"name\": \"John\", \"age\": 30}. Which of the following code snippets correctly sends this request, note that you do not want to show the data on URL?","options":["response = requests.post(\"https://api.example.com/submit\", json={\"name\": \"John\", \"age\": 30})","response = requests.post(\"https://api.example.com/submit\", params={\"name\": \"John\", \"age\": 30})","response = requests.get(\"https://api.example.com/submit\", json={\"name\": \"John\", \"age\": 30})","response = requests.get(\"https://api.example.com/submit\", params={\"name\": \"John\", \"age\": 30})"],"answer":[0],"explanation":"**Đáp án đúng: `requests.post(url, json={...})`.** POST gửi dữ liệu trong body, `json=` tự serialize và đặt header `Content-Type: application/json`, nên dữ liệu không hiện trên URL.\n- `post(..., params=...)`: `params` đưa dữ liệu vào query string trên URL.\n- `get(..., json=...)`: GET không nên có body, thường bị bỏ qua.\n- `get(..., params=...)`: dữ liệu hiện trên URL."},{"id":290,"slide":310,"topic":"Phân loại & đánh giá","section":"Câu dài","question":"You are explaining the concept of impurity to a colleague who is new to decision trees. Which of the following statements best describes impurity in the context of decision trees?","options":["Impurity measures the purity of a node in terms of class distribution.","Impurity measures the level of randomness in the dataset.","Impurity measures the depth of a decision tree to prevent overfit problem.","Impurity measures the number of features in a dataset that are not relevant for classification."],"answer":[0],"explanation":"**Đáp án đúng: Impurity measures the purity of a node in terms of class distribution.** Impurity (Gini, entropy) đo mức độ lẫn lộn các lớp trong một node; node chỉ chứa một lớp thì impurity bằng 0.\n- Randomness in the dataset: mô tả quá chung, không đặc thù cho node.\n- Depth of the tree: do `max_depth` kiểm soát.\n- Number of irrelevant features: không liên quan.\n\nLưu ý: về bản chất impurity đo độ không thuần khiết (cao = lẫn nhiều lớp), nhưng đáp án bộ đề vẫn là đáp án tốt nhất trong các lựa chọn."},{"id":292,"slide":313,"topic":"Hồi quy (Linear, Polynomial, Ridge, Lasso)","section":"Câu dài","question":"In ridge regression, which of the following statements is true regarding the regularization term?","options":["The regularization term penalizes large values of coefficients by adding their squares to the loss function.","The regularization term encourages large values of coefficients to improve model performance.","The regularization term penalizes large values of coefficients by adding their absolute values to the loss function.","The regularization term has no effect on the coefficients of the model."],"answer":[0],"explanation":"Trong Ridge Regression (L2), hàm mất mát được bổ sung tổng bình phương các hệ số (λΣβ²), giúp giảm độ lớn của các hệ số, hạn chế overfitting. Khác với Lasso (L1) dùng tổng giá trị tuyệt đối của các hệ số."}],"topicMod":{"Matplotlib & Seaborn":"m2","Biểu đồ & trực quan hoá":"m2","Folium & bản đồ":"m2","Dash & Dashboard":"m2","Watson Assistant & Chatbot":"m3","IBM DB2 & SQL":"m5","Thu thập dữ liệu (API, Web scraping)":"m6","Hồi quy (Linear, Polynomial, Ridge, Lasso)":"m1","Pandas & xử lý dữ liệu":"m1","Tối ưu mô hình (CV, GridSearch, Pipeline)":"m1","Python cơ bản & NumPy":"m1","Phân loại & đánh giá":"m1","Thống kê":"m1","Quy trình phân tích dữ liệu":"m1","Deep Learning (TensorFlow, CNN)":"m1"},"xl":{"b-1":{"q":"Loại biểu đồ nào trong Seaborn được sử dụng để trực quan hoá phân phối (distribution) của một biến liên tục cùng với ước lượng mật độ xác suất (probability density estimate) của nó? (Chọn tất cả các đáp án đúng)","options":["Histplot","KDEplot","Violinplot","Boxplot"]},"b-2":{"q":"..... là một loại biểu đồ hiển thị các giá trị thường thuộc về hai biến đối chiếu với nhau. Hãy chọn đáp án đúng nhất.","options":["biểu đồ hộp (box plot)","biểu đồ phân tán (scatter plot)","biểu đồ tần số (Histogram)","biểu đồ tròn (Pie chart)"]},"b-3":{"q":"Dữ liệu được thu thập khi một máy khách (client) gửi một yêu cầu ______ tới máy chủ (server).","options":["PORT","GET","PUT","HTTP"]},"b-4":{"q":"Facebook Messenger và ...... là các tùy chọn tích hợp bên trong Watson Assistant từ nút Add Integration. Hãy chọn đáp án đúng nhất","options":["Slack","Google Search","Yahoo messager","Github"]},"b-5":{"q":"Kỹ thuật hồi quy ượng lớp (layers) của mô hình"]},"b-243":{"q":"Webhook thường được cấu hình như thế nào trong Watson Assistant để kết nối với cơ sở dữ liệu DB2?","options":["Bằng cách cung cấp URL điểm cuối (endpoint) của webhook trong phần cài đặt webhook","Bằng cách chỉ định trực tiếp các truy vấn SQL trong phần cài đặt webhook","Bằng cách nhúng thông tin xác thực cơ sở dữ liệu vào các phản hồi của chatbot","Bằng cách tạo một webhook riêng cho mỗi truy vấn cơ sở dữ liệu"]},"b-244":{"q":"GridSearchCV trong Scikit-learn xác định các siêu tham số (hyperparameters) tốt nhất cho mô hình như thế nào?","options":["Bằng cách thử tất cả các tổ hợp siêu tham số có thể","Bằng cách chọn ngẫu nhiên các siêu tham số","Bằng cách dùng tối ưu hóa gradient descent","Bằng cách dựa vào các siêu tham số mặc định"]},"b-245":{"q":"Làm thế nào để thêm chú giải (legend) vào biểu đồ tròn được tạo bằng plot(kind='pie')?","options":["Chú giải được thêm tự động","legend=True","add_legend()","Không thể thêm chú giải vào biểu đồ tròn"]},"b-246":{"q":"Một giáo viên lưu điểm của học sinh trong một mảng (array). Giáo viên đang tính điểm trung bình của mỗi học sinh và loại bỏ điểm thấp nhất trong năm. Mảng là: grades = np.array([100, 30, 77, 20, 99, 100]). Đoạn mã nào sẽ cho ra điểm trung bình và điểm thấp nhất từ mảng?","options":["grades = grades.mean(), min()","grades = mean(), min()","grades = grades.mean() and lowest_grade = grades.low()","grades = grades.mean() and lowest_grade = grades.min()"]},"b-247":{"q":"Một nhà phân tích trong nhóm của bạn hay quên đóng tệp sau khi đọc dữ liệu. Nhà phân tích có thể làm gì để truy cập các tệp cần thiết mà không phải lo vô tình để tệp mở?","options":["Dùng câu lệnh WITH thay cho lệnh open","Dùng câu lệnh WITH cùng với lệnh open","Dùng câu lệnh CLOSE trước lệnh open","Dùng câu lệnh CLOSE thay cho lệnh open"]},"b-248":{"q":"Một nhà nghiên cứu khớp một mô hình hồi quy đa thức (polynomial regression) để dự đoán giá nhà dựa trên diện tích. Nếu phương trình đường hồi quy thu được là:\nPrice = 100000 + 5000 × Size − 100 × Size²\nHệ số của Size² (-100) cho biết điều gì?","options":["Ảnh hưởng của diện tích đến giá là âm.","Ảnh hưởng của diện tích đến giá là dương.","Ảnh hưởng của diện tích đến giá là tuyến tính.","Ảnh hưởng của diện tích đến giá là phi tuyến."]},"b-249":{"q":"Một nhà phân tích mới vào nghề thu thập dữ liệu về các tác động của một thay đổi quy trình gần đây. Các tác động hầu hết là bất lợi. Cần tập trung khắc phục các tác động này vào đâu?","options":["Các tác động riêng lẻ","Nguồn gốc của các tác động - chính là vấn đề","Các bên liên quan (stakeholders) tham gia vào thay đổi quy trình","Người quản lý dự án ban đầu của thay đổi quy trình"]},"b-250":{"q":"Một dự án phát triển đã trễ nhiều thời hạn và có vẻ sẽ trễ thời hạn tiếp theo. Một trưởng dự án mới đã được đưa vào. Bước đầu tiên để đưa dự án trở lại đúng hướng là gì?","options":["Thực hiện phân tích nguyên nhân gốc rễ (root cause analysis)","Đánh giá hiệu suất cá nhân bằng cách thực hiện phỏng vấn","Đánh giá hiệu quả của các nền tảng đang được sử dụng","Vẽ biểu đồ tròn để xác định một mốc thời gian mới"]},"b-251":{"q":"Trong Plotly Dash, chức năng chính của một callback là gì?","options":["Quản lý xác thực người dùng","Xử lý các yêu cầu HTTP","Cập nhật các thành phần dựa trên tương tác của người dùng","Gửi email"]},"b-252":{"q":"Trong tìm kiếm lưới (grid search), 'lưới' (grid) dùng để chỉ điều gì?","options":["Một tập các tham số tiềm năng của mô hình","Một tập các đặc trưng đầu vào tiềm năng","Một tập các dự đoán đầu ra tiềm năng","Một tập các thước đo đánh giá mô hình tiềm năng"]},"b-253":{"q":"Trong tình huống nào phép biến đổi logarit (Log Transformation) thường được áp dụng để chuẩn hóa (normalization)?","options":["Khi dữ liệu có phân phối lệch (skewed distribution)","Khi dữ liệu có phân phối tuyến tính","Khi dữ liệu có phân phối chuẩn (normal distribution)","Khi dữ liệu có giá trị bị thiếu"]},"b-254":{"q":"Trong Watson Assistant, các thực thể (entities) được dùng để làm gì?","options":["Xử lý xác thực người dùng","Xác định và trích xuất thông tin cụ thể từ đầu vào của người dùng","Chuyển hướng người dùng đến các trang web bên ngoài","Tạo các phản hồi trò chuyện xã giao (small talk)"]},"b-255":{"q":"Trong Dash, chức năng của một hàm callback là gì?","options":["Hiển thị dữ liệu","Lọc dữ liệu","Sửa đổi dữ liệu","Liên kết các thành phần và cập nhật bố cục (layout)"]},"b-256":{"q":"Trong biểu đồ nhiệt (heatmap), cường độ màu sắc biểu thị điều gì?","options":["Độ mạnh của các tương quan","Tần suất xuất hiện","Độ lớn của một biến đơn","Phạm vi giá trị trong tập dữ liệu"]},"b-257":{"q":"Trong Watson Assistant, nút hội thoại (dialog node) được dùng để làm gì?","options":["Điều khiển luồng của cuộc hội thoại","Biểu diễn các tin nhắn của người dùng","Định nghĩa các ý định (intents)","Lưu trữ dữ liệu người dùng"]},"b-258":{"q":"Trong kiểm định Chi bình phương (Chi-Square test), giá trị p (p-value) nhỏ hơn 0.05 gợi ý điều gì?","options":["Bác bỏ giả thuyết không (null hypothesis)","Không bác bỏ được giả thuyết không","Không đủ bằng chứng để kết luận","Không tồn tại tương quan"]},"b-260":{"q":"Trong Watson Assistant, mục đích của tính năng \"Slots\" trong các nút hội thoại (dialog nodes) là gì?","options":["Để thu thập thông tin từ đầu vào của người dùng","Để biểu diễn các khoảng trống trong cuộc hội thoại","Để dành không gian bộ nhớ lưu trữ dữ liệu người dùng","Để định nghĩa bảng màu của giao diện chatbot"]},"b-261":{"q":"Bạn đang huấn luyện một bộ phân loại Cây quyết định (Decision Tree) trên tập dữ liệu X_train chứa các đặc trưng số và y_train chứa các nhãn mục tiêu nhị phân tương ứng. Bạn quyết định đặt tham số min_samples_split bằng 10. Tham số này kiểm soát điều gì trong quá trình xây dựng cây quyết định?","options":["Một nút chỉ có thể được tách nếu có ít nhất 10 mẫu.","Độ sâu tối thiểu của cây được đặt là 10.","Phải có hơn 10 nút ở mỗi độ sâu của cây","Tổng số nút trong cây phải lớn hơn 10"]},"b-262":{"q":"Bạn đang huấn luyện một bộ phân loại SVC trên tập dữ liệu có 1000 mẫu và 20 đặc trưng. Bạn quyết định dùng tìm kiếm lưới (grid search) để tìm giá trị C tốt nhất cho bộ phân loại SVC. Bạn chỉ định một dải giá trị C để tìm kiếm, gồm [0.1, 1, 10, 100, 1000]. Bạn thực hiện grid search với kiểm định chéo 5-fold (5-fold cross-validation) để tìm giá trị C tốt nhất. Sau grid search, bạn thấy giá trị C tốt nhất là 10. Điều này cho biết gì về cường độ điều chuẩn (regularization strength) của bộ phân loại SVC?","options":["Cường độ điều chuẩn thấp","Cường độ điều chuẩn cao","Không áp dụng điều chuẩn","Không thể rút ra kết luận nào từ giá trị C tốt nhất"]},"b-263":{"q":"Bạn đang thực hiện tìm kiếm lưới (grid search) để tìm giá trị C tốt nhất cho một bộ phân loại SVC. Bạn chỉ định lưới tham số như sau: param_grid = {'C': [0.01, 0.1, 1, 10, 100]}. Sau khi thực hiện grid search, bạn thấy giá trị C tốt nhất là 0.01. Điều này gợi ý gì về tập dữ liệu và độ phức tạp của mô hình?","options":["Vì tập dữ liệu rất phức tạp nên giá trị C thấp hơn được ưu tiên.","Vì tập dữ liệu đơn giản nên giá trị C thấp hơn được ưu tiên.","Vì tập dữ liệu đơn giản nên giá trị C cao hơn được ưu tiên.","Việc chọn giá trị C không ảnh hưởng đến độ phức tạp của mô hình."]},"b-264":{"q":"Mục đích chính của việc sử dụng hàm add_trace() trong Dash là gì?","options":["Thêm các chú thích (annotations) vào đồ thị","Thêm nhiều đường dữ liệu (traces) vào một biểu đồ duy nhất","Tạo các menu thả xuống","Tạo các bản đồ choropleth"]},"b-265":{"q":"Trong bối cảnh thu thập dữ liệu web (web scraping), thuật ngữ \"phân tích cú pháp HTML\" (HTML parsing) có nghĩa là gì?","options":["Xác định và trích xuất các phần tử cụ thể từ một trang web","Chuyển đổi các tài liệu HTML thành văn bản thuần","Phân tích cấu trúc cơ sở dữ liệu của một trang web","Thu thập dữ liệu từ các điểm cuối (endpoints) của API"]},"b-266":{"q":"Phát biểu nào về phân tích dữ liệu thăm dò (exploratory data analysis, EDA) là đúng?","options":["EDA chỉ được thực hiện sau khi huấn luyện mô hình","EDA tập trung vào việc hiểu cấu trúc và các mẫu hình của tập dữ liệu","EDA là tùy chọn và thường bị bỏ qua","EDA giống với kỹ thuật đặc trưng (feature engineering)"]},"b-267":{"q":"Sai số bình phương trung bình (Mean Squared Error, MSE) có nghĩa là gì?","options":["tìm hiệu giữa các giá trị thực tế và các giá trị dự đoán rồi bình phương nó.","tìm hiệu giữa các giá trị của biến dự báo (predictor) và các giá trị dự đoán rồi bình phương nó.","tìm hiệu giữa các giá trị hệ số chặn (intercept) và các giá trị dự đoán rồi bình phương nó.","tìm hiệu giữa các giá trị độ dốc (slope) và các giá trị dự đoán rồi bình phương nó."]},"b-269":{"q":"Mục đích chính của Hồi quy Ridge (Ridge Regression) trong học máy là gì?","options":["Để giảm quá khớp (overfitting) bằng cách thêm một số hạng phạt (penalty term) vào phương trình hồi quy","Để tăng độ phức tạp của mô hình bằng cách đưa thêm các đặc trưng","Để cực đại hóa hệ số xác định (R-squared)","Để tự động thực hiện chọn lọc đặc trưng (feature selection)"]},"b-270":{"q":"Sự khác biệt chính giữa việc đặt alpha cao trong Ridge và trong Lasso là gì?","options":["Trong Ridge, alpha cao làm giảm các hệ số một cách đồng đều, còn trong Lasso, alpha cao có thể đặt một số hệ số về không.","Alpha cao trong Ridge làm tăng các hệ số, còn trong Lasso thì làm giảm chúng.","Cả hai phương pháp xử lý alpha tương tự nhau, nên không thể phân biệt các tác động của chúng.","Alpha cao trong Ridge làm mô hình dễ bị chưa khớp (underfitting), còn trong Lasso thì làm tăng quá khớp (overfitting).","Không có đáp án nào trong các đáp án còn lại."]},"b-271":{"q":"Các ý định (intents) và thực thể (entities) đóng vai trò gì trong bối cảnh Watson Assistant?","options":["Thực thể xử lý xác thực người dùng, còn ý định xác định mục tiêu của người dùng.","Ý định xử lý các biến ngữ cảnh (context variables), còn thực thể trích xuất thông tin cụ thể từ đầu vào của người dùng.","Thực thể hiểu mục đích của đầu vào người dùng, còn ý định trích xuất thông tin cụ thể.","Ý định xác định mục tiêu của người dùng, còn thực thể trích xuất thông tin cụ thể từ đầu vào của người dùng."]},"b-272":{"q":"Dòng mã sau thực hiện tác vụ gì? df['price'].replace(np.nan, 100, inplace=True)","options":["thay thế các giá trị không phải số (not a number) bằng 100 trong cột 'price'","thay thế các giá trị không phải văn bản (not a text) bằng 100 trong cột 'price'","cộng các giá trị không phải số (not a number) với 100 trong cột 'price'","cộng các giá trị không phải null (not a null) với 100 trong cột 'price'"]},"b-273":{"q":"Điều nào sau đây là đúng về số hạng phạt (penalty term) trong Hồi quy Ridge (Ridge Regression)?","options":["Nó phạt các hệ số lớn bằng cách cộng bình phương của chúng vào hàm chi phí (cost function)","Nó phạt các hệ số nhỏ bằng cách trừ bình phương của chúng khỏi hàm chi phí","Nó phạt các đặc trưng dựa trên thứ tự của chúng trong tập dữ liệu","Nó phạt các đặc trưng một cách ngẫu nhiên để điều chuẩn (regularize) mô hình"]},"b-274":{"q":"Phát biểu nào sau đây là đúng về việc triển khai (deployment) một ứng dụng chatbot?","options":["Bạn cần triển khai lại chatbot mỗi khi thay đổi hộp thoại (dialog) trong Watson Assistant.","Bạn không cần triển khai lại chatbot mỗi khi thay đổi hộp thoại (dialog) trong Watson Assistant.","Bạn không cần loại bỏ (dispose) chatbot mỗi khi thay đổi nội dung (content) trong Watson Assistant.","Bạn không cần triển khai lại chatbot mỗi khi thay đổi nội dung (content) trong Watson Assistant."]},"b-276":{"q":"Chọn phát biểu mô tả đúng nhất về Seaborn","options":["Seaborn là một thư viện trực quan hóa Python dựa trên scikit-learn","Seaborn có thể làm tăng hiệu quả số dòng mã để tạo một biểu đồ","Seaborn là một thư viện trực quan hóa Python cung cấp giao diện cấp cao để vẽ các biểu đồ thống kê hấp dẫn","Tất cả các đáp án đều đúng"]},"b-277":{"q":"Chọn phát biểu mô tả đúng nhất về biểu đồ miền (Area chart)","options":["Nó thường được dùng để biểu diễn các tổng tích lũy bằng số hoặc phần trăm theo thời gian.","Nó là một loại biểu đồ hiển thị thông tin dưới dạng một chuỗi các điểm dữ liệu gọi là 'markers' được nối với nhau bằng các đoạn thẳng.","Nó là một cách biểu diễn phân phối tần suất của một biến.","Nó thường được dùng để so sánh các giá trị của một biến tại một thời điểm nhất định."]},"b-278":{"q":"Chọn phát biểu mô tả đúng nhất về bản đồ Choropleth","options":["Bản đồ choropleth là một bản đồ chuyên đề trong đó các khu vực được tô bóng tương ứng với số đo của biến thống kê được hiển thị trên bản đồ","Bản đồ choropleth là một bản đồ chuyên đề trong đó các khu vực được tạo hoa văn tương ứng với số đo của biến thống kê được hiển thị trên bản đồ","Bản đồ choropleth là một bản đồ chuyên đề trong đó các khu vực được tô bóng hoặc tạo hoa văn tương ứng với số đo của biến thống kê được hiển thị trên bản đồ","Không có đáp án nào trong các đáp án còn lại"]},"b-279":{"q":"Chọn phát biểu mô tả đúng nhất về biểu đồ cột (Bar chart)","options":["Nó là một loại biểu đồ hiển thị thông tin dưới dạng một chuỗi các điểm dữ liệu gọi là 'markers' được nối với nhau bằng các đoạn thẳng.","Nó là một cách biểu diễn phân phối tần suất của một biến.","Nó thường được dùng để so sánh các giá trị của một biến tại một thời điểm nhất định.","Nó là một đồ thị thống kê hình tròn được chia thành các phần (lát) để minh họa tỷ lệ số."]},"b-280":{"q":"Chọn phát biểu mô tả đúng nhất về biểu đồ Waffle (Waffle chart)","options":["Nó là sự mô tả tần suất của các từ khác nhau trong một số dữ liệu văn bản.","Nó là một đồ thị thống kê hình tròn được chia thành các phần (lát) để minh họa các tỷ lệ số.","Nó là một cách biểu diễn phân phối tần suất của một biến.","Nó là một trực quan hóa thú vị thường được tạo ra để hiển thị tiến độ hướng tới các mục tiêu."]},"b-281":{"q":"Trong Watson Assistant, chọn mô tả đúng nhất về Dialog Skill?","options":["Một dialog skill chỉ dùng xử lý ngôn ngữ tự nhiên (natural language processing) của Watson để hiểu câu hỏi của người dùng và đưa ra câu trả lời.","Một dialog skill chỉ dù
